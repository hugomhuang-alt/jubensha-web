window.__CASES = [{"id":"paimai","title":"压轴之夜","tagline":"暴雨封楼，拍卖师死在上锁的鉴定室，台下的名画却分毫未损","difficulty":4,"cover":"cover","tone":"purple","brief":"十月的暴雨夜，云轩拍卖行在二十八层举办年度压轴夜场，失传百年的《霁雪寒林图》将在22:30开拍，估价八千八百万。可开拍前，首席拍卖师兼鉴定师谷鸣远被人发现死在上锁的鉴定室里，后脑塌陷，名画就在三步之外，毫发无损。暴雨冲断了山路，警方两个小时后才能赶到。拍卖行股东求你在这段时间里先把事情弄清楚。你穿过满厅惊惶的宾客，手里只有六处能搜的地方，和八个各怀心事的人。每个人都有话没说，而你要找的人，此刻就站在他们中间。","victim":{"name":"谷鸣远","age":62,"desc":"云轩拍卖行首席拍卖师兼鉴定师，业内公认最难糊弄的“眼睛”。被发现死在上锁的鉴定室内，后脑遭钝器重击，倒在书桌与紫外灯台之间。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"none","outfit":"suit","acc":"bow","mood":"stern"}},"publicFacts":["谷鸣远死在二十八层东侧的鉴定室。门关上会自动落锁，发现时门是锁着的，保安用主卡打开。","鉴定室里的《霁雪寒林图》完好地摆在展台上，没有被盗，没有破损。","东走廊3号摄像头因雷击跳闸离线，直到夜里才恢复；贵宾厅的摄像头一直正常运行。","暴雨冲断山路，电梯停运检修，二十八层的所有人只能留在楼里，没有人离开过。","谷鸣远曾在今晚的预展上说过，压轴拍品开拍前他还要做最后一次终检。","这幅画由墨痕画廊柯美玲送拍，恒安保险承保，由保险调查员严松监督运输和封存。"],"timeline":[{"t":"19:30","text":"预展酒会在二十八层开始，宾客陆续入场"},{"t":"20:28","text":"门禁记录：谷鸣远刷卡进入鉴定室，此后到22:38 没有任何刷卡记录"},{"t":"21:10","text":"系统记录：东走廊3号摄像头雷击离线，22:52 恢复"},{"t":"21:42","text":"手机记录：谷鸣远与柯美玲通话三分钟，这是他最后一通电话"},{"t":"22:05","text":"柯美玲自称敲鉴定室的门无人应，随后去找保安"},{"t":"22:30","text":"原定压轴开拍时间，夜场被迫中止"},{"t":"22:38","text":"门禁记录：保安主卡打开鉴定室门"}],"budget":{"search":12,"ask":26},"locations":[{"id":"loc_lab","name":"鉴定室","scene":"study","desc":"顶楼东侧的恒温鉴定室，隔音门厚重，关上即自动落锁。书桌、紫外灯台、展台一应俱全，谷鸣远倒在其间。","clues":[{"id":"c_st1","title":"鉴定笔记","text":"书桌上摊开的硬皮鉴定笔记，最后一页用蓝黑墨水潦草写着：“紫外灯下右下角有一个‘巳’字荧光暗记——韩的摹本，无疑。摹本10月2日只交给柯。10月5日起运，封条S-4417，装箱监封人：严。画心绢偏新。真迹在哪？”"},{"id":"c_st2","title":"死者手机","text":"桌角的手机屏幕仍亮着。短信：20:55 发给韩述“现在来一趟，有东西要你认。”；21:20 发给严松“S-4417。十点前，来一趟。”（显示已送达）。通话记录：21:42 柯美玲，通话3分钟。严松那一栏没有回复。"},{"id":"c_st3","title":"青铜镇纸","text":"谷鸣远面朝下倒在书桌与紫外灯台之间，后脑塌陷。沾血的青铜镇纸滚在地毯上，表面没有清晰指纹，只有一层细密的棉纤维压痕。桌上两只茶杯，一只已凉，杯沿有一圈淡淡的口红印；一只半满。门内侧没有撬动痕迹。"},{"id":"c_st4","title":"紫外灯下的画","text":"你拧亮灯台，展台上的《霁雪寒林图》右下角浮出一枚淡青色的“巳”字荧光印记。放大镜下，画心绢边的经纬丝线整齐细密，没有一处旧损。画旁摆着一副没用完的白棉手套。"}]},{"id":"loc_mon","name":"监控室","scene":"library","desc":"一整面墙的屏幕和一台嗡嗡作响的主机，空气里是泡面和烟草味。保安彭大海平时在这里值守。","clues":[{"id":"c_mon1","title":"贵宾厅截图","text":"贵宾厅摄像头的截图，时间戳 22:15:06：严松起身与贺承握手，两人身后墙上的倒计时屏清楚地显示“距压轴开拍 00:34:54”，几名侍者正引导宾客往外走。"},{"id":"c_mon2","title":"门禁记录","text":"打印的门禁日志，鉴定室只有两条：20:28 谷鸣远刷卡进入；22:38 保安主卡开门。东走廊3号摄像头标注“21:10 雷击跳闸离线，22:52 恢复”。旁边附一张系统设置截屏：“自动校时：关闭”。"},{"id":"c_mon3","title":"安防整改单","text":"恒安保险《场馆安防审核整改单》复印件，第3项手写：“门禁及监控主机时钟较标准时间偏快约20分钟，建议校准后复核。”审核人签名：严松，日期10月9日；整改回执栏空白。"},{"id":"c_mon4","title":"巡逻本","text":"彭大海的巡逻记录本，21:35至22:00一栏空白，页脚夹着一张彩票和棋牌室会员卡；22:08 一行字“柯女士来找，要开鉴定室，先报备值班经理”，22:18“开鉴定室”。另一行：“21:32 钱总上天台，说抽烟；22:11 下来。”"}]},{"id":"loc_vip","name":"贵宾厅","scene":"hall","desc":"铺着深红地毯的贵宾厅，洽谈区的沙发围着一面倒计时屏，窗外暴雨如注，宾客已被引去拍卖厅。","clues":[{"id":"c_vip1","title":"夜场流程单","text":"苏小棠打印的《夜场流程单》：19:30 预展酒会；21:15–21:55 VIP洽谈区（严松/贺承预约）；21:55 终场铃，宾客移步拍卖厅；22:30 压轴开拍。页边钢笔批注：“铃响一次；鉴定室谷老师说十点前出来。”"},{"id":"c_vip2","title":"揉皱的合同","text":"沙发缝里塞着一份《藏品质押借款合同》复印件：出借人魏某，质押物《霁雪寒林图》，借款2600万，到期日10月20日；柯美玲签名旁有红笔批注“拍卖成交后第一时间还款”。"},{"id":"c_vip3","title":"竞价牌登记册","text":"登记册上贺承的号牌“A-08”旁有铅笔小字“10/11预览，谷老师特批”，该日期的访客栏被涂改过一次，涂改处仍能辨出一个“贺”字。"}]},{"id":"loc_bk","name":"后台寄存间","scene":"backstage","desc":"拍卖厅后台的寄存间，金属架上码着宾客的箱包与拍品周转箱，潮气里混着樟木味。","clues":[{"id":"c_bk1","title":"勘验箱夹层","text":"寄存架第17号：恒安保险的铝合金勘验箱，标签写着严松。箱底有一层夹层，里面卷着一幅绢本，樟木卷轴，题签“霁雪寒林图”，绢色泛暗，背面有几处旧补绢，轴头刻着一个“程”字小款。"},{"id":"c_bk2","title":"装箱签收单","text":"10月5日墨痕画廊《装箱监封签收单》：14:10 柯美玲离场（备注：有事外出），14:50 返回；14:25 封箱，封条编号S-4417，监封人栏只有“严松”一人签名；两名搬运工签于14:55，备注“候于外间”。"},{"id":"c_bk3","title":"洛芷的提包","text":"一只被雨淋湿的帆布提包，里面是一叠旧信、一支笔式紫外手电，和一张写了又揉过的便笺，上面写着“绢不对，手感太新——你再看一遍。芷 20:35”。"},{"id":"c_bk4","title":"编目照片","text":"苏小棠平板里存着10月8日入库编目照片：木箱封条S-4417完好，开箱后的画作全幅照，拍摄者署名苏小棠；备注栏写着“先开箱了，别告诉谷老师”。"}]},{"id":"loc_res","name":"修复间","scene":"lab","desc":"拍卖行里的修复工作间，灯台、镊子、浆糊盆和一排排裱纸，韩述把这里当成了半个家。","clues":[{"id":"c_lb1","title":"摹本交接单","text":"韩述工作台上的交接单副本：10月2日，交付墨痕画廊柯美玲“《霁雪寒林图》展示用摹本一幅”，条款“仅限展陈，不得出售”；摹本右下角按工作习惯加“巳”字荧光暗记；收件人签名：柯美玲。"},{"id":"c_lb2","title":"修复日志","text":"修复日志记载真迹7至9月在此修复，9月21日交还柯美玲；备注：绢本，背面多处旧补绢，樟木轴头刻“程”字小款，需避光。日志下压着一张银行催缴单和一份工作室欠薪名单。"},{"id":"c_lb3","title":"律师函","text":"墨痕画廊的律师函，催促韩述退还已预付的摹本制作费40万元；韩述在页边批了一句“柯不付尾款，我凭什么退”。"}]},{"id":"loc_bar","name":"酒廊","scene":"dining","desc":"预展酒会的酒廊，香槟塔空了一半，吧台边的杯子东倒西歪，雨声压过了背景乐。","clues":[{"id":"c_dn1","title":"遗落的备忘","text":"吧台边遗落的手机备忘录页面：“收购云轩全部股权，报价2.4亿，贺总方；谷若反对，此事不成，先要拿到他手里那10%。”最后编辑 20:50，机主署名钱立诚。"},{"id":"c_dn4","title":"掉落的信封","text":"吧台高脚凳底下掉着一个被捏皱的信封，收件人栏写着“严松”。里面是澳门一家赌场的《信用额度逾期通知》，欠额一千九百万港币，限十月二十五日前清偿；信封背面用铅笔草草写了“4200”和“拍后”两个词。"},{"id":"c_dn2","title":"酒廊账单","text":"酒廊账单：洛芷 20:45 点威士忌两杯，21:30 结账离开；侍者备注“客人一直在哭，中途没离开过吧台”。"},{"id":"c_dn3","title":"侍者便签","text":"侍者便签：“21:15 左右韩先生从东走廊快步回来，脸色发白；21:20 左右柯女士在东侧走廊尽头打电话，声音发抖。”"}]}],"suspects":[{"id":"yan","name":"严松","role":"保险调查员","age":41,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"smile"},"bio":"恒安保险派驻的艺术品理赔调查员，负责这幅压轴拍品的承保、运输监封和现场安防审核。当晚大部分时间在贵宾厅陪买家洽谈。","demeanor":"斯文周到，爱用“按程序”“据我所知”，被问到要害时语速反而更慢","topics":[{"id":"t_job","q":"你在这里做什么？","a":"据我所知，这幅《霁雪寒林图》保额八千八百万，承保、运输监封、现场安防审核都归我。我是恒安的调查员。说白了，我是替保险公司盯着这幅画别出事的人。结果偏偏出了事，真是讽刺。"},{"id":"t_where","q":"案发时你在哪？","lie":true,"a":"我从九点十五分起一直在洽谈区陪贺总，监控能证明，一直到十点一刻我才起身，之后去拍卖厅找座位。中间我没离开过半步，这点贺总可以作证，你们调监控就清楚了。","truth":"好吧，铃一响，也就是九点五十五，我就借口去洗手间离开了洽谈区。监控时间我知道偏快二十分钟，我故意引你们去信那个时间。我去了东走廊，见了谷先生。之后的事，我不会再多说一个字。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷先生是业内最顶尖的眼睛，也是最难缠的人。他对每件拍品都要求保险条款逐条过目，我们合作过六次，彼此尊重，仅此而已。他走了，我很遗憾。"},{"id":"t_contact","q":"你今晚和他联系过吗？","lie":true,"a":"到场后只在酒会上点过头，没有单独说过话，也没收到过他的消息。我手机一直静音，拍卖夜我习惯这样，免得打扰客人。","truth":"他的短信我看到了，九点二十。他知道封条的事不对劲。我没回复，铃响后我去见了他。我骗你们，是因为我知道那条短信一旦被看到，我就完了。"},{"id":"t_painting","q":"这幅画是真的吗？","a":"鉴定是谷先生的职权，我只负责保险和运输。我只能说，装箱前后封条完好，从程序上讲，这幅画自始至终没出过问题。"},{"id":"t_crate","q":"10月5日装箱时的情形？","lie":true,"a":"那天我按程序监封，柯女士全程在场，两名搬运工也在，封条S-4417是当着大家的面贴的。整个过程没有任何疏漏，签收单上都有记录。","truth":"柯美玲十四点十分就走了，封箱之前那十五分钟，库房里只有我一个人。我翻到了角落圆筒里那幅没人知道的摹本，就在那十五分钟里动的手：摹本放进木箱，真迹卷进了我的勘验箱。"},{"id":"t_clock","q":"你知道系统时钟偏差吗？","lie":true,"needs":["clue:c_mon3"],"a":"偏差？整改单是例行公事，我随手写一条建议，监控时钟差几分钟太常见了，我并不清楚具体差多少，也没当回事。","truth":"我清清楚楚。十月九号审核时我对过表，快整整二十分钟。那天我就想到，这二十分钟可以变成我的不在场证明。"},{"id":"t_case","q":"你的勘验箱里有什么？","lie":true,"needs":["clue:c_bk1"],"a":"只有仪器：放大镜、色卡、湿度计、手套和记录本。保险调查员的箱子，里面能有什么？你们要查就查，别吓到别人。","truth":"夹层里的是真迹。四千二百万，港商已经谈好，拍卖一结束我就带着箱子走。摹本拍出去，谁还会查？谷鸣远偏偏查了。"},{"id":"t_debt","q":"你最近手头宽裕吗？","lie":true,"needs":["clue:c_dn4"],"a":"我们这行薪水稳当，谈不上宽裕，也谈不上紧。我不好赌也不好酒，生活一向规律，公司的背景调查里都有记录，你们尽管去查。","truth":"我欠了澳门那边一千九百万港币，利滚利，催债的人已经找到公司楼下。港商给四千二百万，还完债我还能全身而退。我本不想杀人，是谷鸣远逼我走到这一步。"}],"confronts":[{"clue":"c_mon1","breaks":"t_where","crack":true,"a":"……三十五分钟。压轴二十二点半开拍，往回推，这一刻是九点五十五，不是画面角落写的十点十五。主机的时间不对，我比谁都清楚。你们……看懂了。"},{"clue":"c_vip1","breaks":"t_where","a":"流程单写得很清楚，终场铃是九点五十五。我说陪到十点一刻，是按监控时间说的。你们要纠结这二十分钟，我无话可说，铃响后我确实离开过洽谈区。"},{"clue":"c_st2","breaks":"t_contact","a":"他的手机……九点二十，十点前来一趟。我确实看到了。我说没收到，是因为我不想成为他最后一条消息的收件人。这谎是我说的。"},{"clue":"c_bk2","breaks":"t_crate","a":"签收单上柯女士十四点十分离场，十四点五十回来，监封人只有我。这张纸……我说全程在场，是我记错了——不，是我说谎。"},{"clue":"c_bk1","breaks":"t_case","crack":true,"a":"那是我的箱子，夹层里是什么我无法再否认。轴头的“程”字款，修复日志里想必也写着。是的，那才是真迹。"},{"clue":"c_mon3","breaks":"t_clock","a":"那是我亲笔签的字，日期、签名都是我的。我说不清楚偏差，是装的，我其实清楚得很，快整整二十分钟，一分不差。"},{"clue":"c_dn4","breaks":"t_debt","a":"……那封信是我掉的。你们既然捡到了，我也不必再装。数字是真的，欠款是真的，人家给的期限也是真的。"},{"clue":"c_st3","a":"镇纸上只有棉纤维压痕？很多人都戴手套，鉴定行业不稀奇。我看不出这和我有什么关系。"}],"fallback":"这和我无关，请按程序来，我愿意配合，但请别断章取义。"},{"id":"han","name":"韩述","role":"书画修复师","age":38,"look":{"skin":"light","hair":"messy","hairColor":"black","glasses":"round","beard":"stubble","outfit":"hoodie","mood":"worried"},"bio":"云轩拍卖行的特聘书画修复师，那幅压轴拍品的真迹曾在他手里修复了整整三个月。当晚在修复间和酒廊之间来回，说话絮叨，手总在抖。","demeanor":"内向絮叨，爱用手艺人的比喻，一紧张就搓手指","topics":[{"id":"t_job","q":"你和这幅画的关系？","a":"七月到九月，这幅《霁雪寒林图》整整三个月都在我案子上。揭裱、补绢、全色，一寸一寸地喂。说句不怕笑话的，我比它的主人更熟它的绢纹，它就像我养大的孩子。"},{"id":"t_where","q":"案发前后你在哪？","lie":true,"a":"我一直在修复间收拾工具，后来去酒廊喝了两杯。鉴定室我今晚根本没去过，谷老师最近忙，我哪敢去烦他。","truth":"我去过。他九点前发短信叫我，我九点到九点十二分在鉴定室里，被他问得像审犯人。我撒谎是怕你们觉得我动过那幅画——我真的什么都没动，我走的时候他还活着。"},{"id":"t_copy","q":"你做过这幅画的摹本吗？","lie":true,"a":"摹本？没有没有，我是修复师，不是造假的。这行最忌讳的就是摹本，我怎么可能碰那种东西。","truth":"做过。十月二日我交给柯美玲一幅展示用摹本，合同写了仅限展陈。我怕说出来，大家以为是我拿摹本调了包，所以才说没有。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷老师是我师傅的朋友，也是我的恩人，行里没人比他更懂眼学。但他眼里揉不得沙子，这也是很多人怕他的原因。"},{"id":"t_money","q":"你缺钱吗？","a":"工作室欠着三个月的薪水，银行也在催，柯美玲的尾款拖了又拖。你说缺不缺？可我再缺钱，也不会拿这种脏手段，你信不信由你。","needs":["clue:c_lb2"]},{"id":"t_msg","q":"谷鸣远找你说了什么？","needs":["clue:c_st2"],"a":"他问我摹本交给了谁，我说只交了柯美玲一人，他又问装箱那天有谁在，我答不上来。他说他心里有数了，让我回去。我走的时候他正低头调紫外灯，活得好好的。"},{"id":"t_mark","q":"“巳”字暗记是怎么回事？","needs":["clue:c_st4"],"a":"那是我的习惯，每幅摹本右下角加一个“巳”，紫外灯下才显形，为的就是将来有人拿摹本冒充真迹，一照就穿。没想到，最后是谷老师用它找出了问题。"},{"id":"t_guess","q":"你觉得谁调的包？","needs":["ask:han.t_msg"],"a":"摹本只经过柯美玲的手，之后就是装箱封存。装箱那天在场的人，我就不知道了。你们去查监封单吧，纸比嘴靠得住。"}],"confronts":[{"clue":"c_st2","breaks":"t_where","a":"……这条短信是我的名字。好吧，我去过。我不是没想说，是我一想到说出来就成了最后见他的人，我就怕。"},{"clue":"c_dn3","breaks":"t_where","a":"侍者看见我九点十五分快步回酒廊？对，我那时候刚从鉴定室出来，脸白得像宣纸，我自己都知道。"},{"clue":"c_lb1","breaks":"t_copy","a":"交接单上有柯美玲的签名，合同条款也在。我否认摹本，是想撇清自己，现在没办法了，是我做的。"},{"clue":"c_lb3","a":"那份律师函……柯美玲想赖掉我的尾款，还倒打一耙要我退预付金。我恨她，但我没杀人。"},{"clue":"c_bk1","a":"……这几处补绢是我七月亲手补的，针脚我闭着眼都认得，轴头上的“程”字小款也在。这才是真迹。它怎么会在保险公司的箱子里？"},{"clue":"c_st3","a":"镇纸？我没留意过那东西。你们别这么看我，我拿惯了镊子和排笔，连只鸡都杀不了，更别说杀人了，真的。"}],"fallback":"我只会修画，别的我真不懂，您问点我能答的行吗？"},{"id":"ke","name":"柯美玲","role":"墨痕画廊主","age":52,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"qipao","acc":"necklace","mood":"stern"},"bio":"墨痕画廊的老板，《霁雪寒林图》的送拍人，成交价她能拿走大头。当晚大部分时间在酒廊应酬，十点前后去敲过鉴定室的门。","demeanor":"干练强势，爱抬高声调，用“我们做画廊的”开头，被戳到痛处会忽然压低声音","topics":[{"id":"t_job","q":"你为什么送拍这幅画？","a":"这是我们墨痕画廊压箱底的东西，我替藏家守了十年。八千八百万的估价，是我们这行的脸面，也是我的心血。谁要毁了它，我跟谁拼命。"},{"id":"t_replica","q":"这幅画有摹本吗？","lie":true,"a":"摹本？我们做画廊的，最忌讳在真迹旁边放仿品，哪来的什么摹本。你们不要听风就是雨，更不要拿这种没影的事来给我添乱，我没工夫陪你们猜。","truth":"有。韩述十月二日交给我一幅展示用摹本，是为了真迹送拍这阵子，画廊展厅里不至于空着。我没敢告诉拍卖行，怕保险公司觉得我们保管不严，不肯承保。"},{"id":"t_present","q":"10月5日装箱你在场吗？","lie":true,"a":"当然在场，从头到尾我都盯着。封条是当着我的面贴的，严先生和搬运工都可以作证，这么大的拍品，我怎么敢走开。","truth":"我十四点十分出去了，四十分钟。有个人必须见，我没办法。库房里只剩严松一个人监封。我这些天越想越怕，所以才硬说我全程在场。"},{"id":"t_call","q":"你和谷鸣远最后说了什么？","lie":true,"a":"那通电话只是聊夜场流程，叮嘱我别紧张，开拍时我得坐在第一排，替藏家举牌应答。统共三分钟，没什么别的，你们不用追问。","truth":"他问我10月5日装箱那天我在不在场，又问摹本放哪了。我说我不在，我出去了一会儿。他沉默了很久，说：“知道了。等拍卖完我再找你。”那是他最后的话。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷鸣远是我认识二十年的老朋友，也是拍卖场上让我最放心的人。他说话从不拐弯，今晚他叫我时语气很沉，我就觉得不对劲。"},{"id":"t_knock","q":"你去敲过鉴定室的门？","a":"十点零五分左右，我去敲了三下，里面没人应。我想他是不想被打扰，又等了几分钟才去找保安。保安说动主卡要先报备，磨了十来分钟，十点一刻过了才开的门。"},{"id":"t_loan","q":"你很缺钱吗？","needs":["clue:c_vip2"],"a":"……是，魏老板的质押款到期日是十月二十号。拍卖成交，我才还得上。所以这幅画的真假、拍卖能不能成，对我生死攸关。可我要杀他，就不会自己守着画等他开拍了。"},{"id":"t_tube","q":"摹本平时放在哪？","needs":["clue:c_lb1","clue:c_bk2"],"a":"库房最里头的圆筒，靠在铁架角落，我自己都懒得去看。十月五号那天我走得急，库房门没锁，叫严先生自己进去对封箱清单——人家是保险公司的，我信得过。现在想想，我真是……"},{"id":"t_lender","q":"十四点十分你见了谁？","needs":["ask:ke.t_present"],"a":"魏老板。我在街角茶楼求他把质押宽限，他最多只肯拖到十月二十号。回来的时候封条已经贴好，严先生说一切顺利，我看着封条完好，就放心了。"}],"confronts":[{"clue":"c_lb1","breaks":"t_replica","a":"这是我的签名……好吧，我承认摹本是有的。可它一直躺在库房的圆筒里，我没碰过，你们不要把我往坏处想。"},{"clue":"c_bk2","breaks":"t_present","a":"签收单上写着我离场，我还能说什么。我撒谎是怕保险失效，画一旦被说成监封有漏洞，质押方就要抽贷。"},{"clue":"c_st2","breaks":"t_call","a":"他的手机记着我，三分钟。好，我告诉你们实话，他问的是封箱，不是流程。我当时慌了，所以……"},{"clue":"c_vip2","a":"这份合同怎么在沙发缝里？……对，那是我的，不小心掉的。是，我缺钱，但我缺的是画卖出去，不是画被毁掉。"},{"clue":"c_dn3","a":"我在东侧走廊打电话，是在求魏老板宽限日子，不是别的。声音抖，是急的，换你被逼到那份上，也会哭出来的。"}],"fallback":"这和我没关系，我只关心画能不能顺利拍卖，别绕弯子。"},{"id":"he","name":"贺承","role":"压轴竞买人","age":49,"look":{"skin":"tan","hair":"slick","hairColor":"black","glasses":"none","beard":"mustache","outfit":"jacket","acc":"pocketwatch","mood":"smirk"},"bio":"做地产起家的富商，今晚最有可能举牌拿下压轴拍品的买家。酒会大半时间都在贵宾厅洽谈区，和保险公司的严松聊天。","demeanor":"豪爽带点江湖气，爱叫人“老弟”，被问急了会拍桌子","topics":[{"id":"t_job","q":"你为什么想拍这幅画？","a":"老弟，我这辈子收了不少东西，就缺一幅压得住场的雪景。这幅《霁雪寒林图》来历干净，名头又响，该花的钱我不省。拿下它，我这个收藏圈的位子就坐稳了。"},{"id":"t_know","q":"你以前认识谷鸣远吗？","lie":true,"a":"谷老师？今晚酒会才第一次见，隔着人群点了个头。我这种人怎么会和拍卖师有交情，那是犯规的。","truth":"十月十一号我私下来云轩预览过，谷鸣远特批的。我想探别的买家上限，他当场翻脸把我骂回去，说再问就取消我的号牌。我怕这事传出去号牌被吊销，才装不熟。"},{"id":"t_talk","q":"你和严松聊了什么？","a":"艺术品投资啊，他讲保险条款、估值逻辑，一套一套的，我听得服气。九点一刻起在洽谈区坐下，聊了将近四十分钟。这个人说话滴水不漏。"},{"id":"t_bell","q":"终场铃响时他怎样？","needs":["clue:c_mon1"],"a":"铃一响他就起身，说去趟洗手间，让我先进拍卖厅。我还抬头看了那块倒计时，三十五分钟，记得清楚。之后我直接进场了，没再见到他，直到拍卖厅里宣布出事。"},{"id":"t_qian","q":"你和钱立诚有往来吗？","lie":true,"a":"钱总？酒会上碰过一杯，没有往来。我买画，他是云轩的股东，不过如此，你别把我和他扯到一块儿，传出去不好听。","truth":"行，我跟你说实话。我在谈收购云轩，价码二点四亿，钱立诚是中间人。谷鸣远不松口，这事就黄了。我瞒着，是怕你们把收购和命案扯在一块。"},{"id":"t_bid","q":"你打算出到多少？","a":"一亿二的底线，再多我就走人，谁劝都没用。这事我没瞒着，谁问我都这么说，拍卖场上讲的就是一个干脆。"},{"id":"t_victim","q":"你怎么看谷鸣远的死？","a":"可惜，真可惜。能把规矩守得这么死的拍卖师，这行里不多了。就这么没了，我心里不是滋味。"}],"confronts":[{"clue":"c_vip3","breaks":"t_know","a":"登记册连我名字的“贺”字都涂改出来了？行，我认。那次预览是我求他的，别往歪处想。"},{"clue":"c_dn1","breaks":"t_qian","a":"备忘录上写着“贺总方”，那是钱立诚的手机。是，我们在谈收购，我得瞒着，因为谷鸣远是最大的拦路虎。"},{"clue":"c_mon1","a":"这就是我刚才说的，铃响他起身，墙上倒计时三十五分钟。你们要我作证，我就实话实说，反正我进场的时候他没跟上来。"},{"clue":"c_st2","a":"这条短信不是发给我的，里头的事我一概不知道。你们别拿这个吓唬我，我是来买画的，不是来蹲局子的。"}],"fallback":"老弟，这个我真不清楚，你换个问法。"},{"id":"qian","name":"钱立诚","role":"拍卖行大股东","age":58,"look":{"skin":"light","hair":"bald","hairColor":"grey","glasses":"round","beard":"none","outfit":"vest","acc":"bow","mood":"sly"},"bio":"云轩拍卖行持股最多的股东，名义上主管财务与后勤。他和谷鸣远是三十年合伙人，近来为公司股权的去向多次起争执。","demeanor":"官腔十足，爱说“按公司章程”“据我了解”，被追问时笑着绕圈子","topics":[{"id":"t_job","q":"你在公司负责什么？","a":"我主管财务与后勤，按公司章程，拍品估值与成交归鉴定部和拍卖师负责，我不干涉。老谷是首席，我是后勤，我们三十年的配合，一向分工明确。"},{"id":"t_where","q":"案发前后你在哪？","lie":true,"a":"我一直在拍卖厅，调试大屏和音响，九点半到十点一刻，工作人员都可以作证。我是股东，也是后勤，这种夜晚我哪敢乱走。","truth":"我九点半多上了天台，说是抽烟，实则一直在跟对方律师打电话，十点十一分才下来。我瞒着，是因为那通电话在谈出卖公司，被人知道我就完了。"},{"id":"t_victim","q":"你和谷鸣远关系如何？","a":"三十年的合伙人，难免有分歧。他对公司股权有他的坚持，我有我的考虑，但我们从没红过脸。他的死，对云轩是巨大的损失。"},{"id":"t_stock","q":"他手里的股份会怎样？","a":"老谷持有百分之十，按章程，他无继承人，股权由公司回购或转给其他股东。说到底，谁受益，我心里也明白，所以我先说清楚：我没杀他。"},{"id":"t_deal","q":"你在谈收购吗？","needs":["clue:c_dn1"],"lie":true,"a":"收购？没有的事，公司的事我只管后勤，股权上的事我从来不碰。你们不要拿一条没头没尾的备忘录做文章，那说明不了什么。","truth":"好，我谈了。贺承出价二点四亿，要全部股权，条件是拿到老谷的百分之十。老谷不同意，我本想今晚拍完让他松口。可我没杀他，他死了，这笔交易反而悬了。"},{"id":"t_roof","q":"你在天台和谁通话？","needs":["ask:qian.t_where"],"a":"对方的律师，姓顾。通话记录你们尽管去查，九点三十四分打出，十点零九分挂断，一共三十五分钟。"},{"id":"t_clock","q":"你知道监控时钟问题吗？","a":"那是安保部的事，我只在年终会议上听老彭提过一句，说主机老了，该换了。具体偏差多少，我没留意，也不归我管。"}],"confronts":[{"clue":"c_mon4","breaks":"t_where","a":"彭大海居然把我上天台的时间记了下来？……这个榆木脑袋。行，我认，我那段时间确实不在拍卖厅里。"},{"clue":"c_dn1","breaks":"t_deal","a":"这是我的手机……备忘录是我写的。是，收购这件事我一直在推，老谷不点头，我一个人做不了主。"},{"clue":"c_vip2","a":"柯美玲的质押合同？我头一次见。这件事公司没有备案，我一点也不清楚，你们该去问她本人，别问我。"},{"clue":"c_mon2","a":"门禁记录……我对监控一窍不通。不过我们公司的门禁什么时候乱成这样了？这些记录该交给谁看，回头得整顿一下。"}],"fallback":"这个问题，按公司章程，我无可奉告。"},{"id":"su","name":"苏小棠","role":"拍卖助理","age":25,"look":{"skin":"fair","hair":"ponytail","hairColor":"brown","glasses":"none","beard":"none","outfit":"dress","acc":"headset","mood":"worried"},"bio":"谷鸣远的贴身助理，管流程、编目和竞买人登记，跟了他两年。当晚戴着耳麦满场跑，是最后给他送茶的人。","demeanor":"语速飞快，爱说“哎呀”“真的啦”，一紧张就咬嘴唇","topics":[{"id":"t_job","q":"你平时做什么？","a":"我是谷老师的助理，流程单、编目、号牌登记，全是我的活。他脾气硬，但对我很照顾，教了我不少东西。他走了，我到现在都不敢信。"},{"id":"t_tea","q":"你最后见他是什么时候？","a":"二十点十分，我给他送了一壶茶。他在鉴定室门口接过去，说“今晚谁也别打扰我”，还叮嘱我十点前准时敲铃。我就是那时候最后一次见他。"},{"id":"t_open","q":"入库编目时你开过箱吗？","lie":true,"a":"我没开过箱呀，真的啦。箱子是原封到的，封条S-4417完好，我按流程只核对封条，开箱是谷老师的权限。","truth":"我开过。十月八日我偷偷拧开侧板，把画拍了照，想赶在谷老师之前做图录，违反了规定。我怕被骂才不敢说。封条没动，是因为我动的是侧板的螺丝。"},{"id":"t_photo","q":"照片里的画有问题吗？","needs":["clue:c_bk4"],"a":"我看不出来……那天的画跟平时一样，绢色、题款、印章都对。我不是鉴定师，要是有问题，也只有谷老师能看出来。现在想想，是不是我拍的就已经……"},{"id":"t_see","q":"终场铃响后你看见谁？","needs":["ask:he.t_bell"],"a":"我在拍卖厅门口收号牌，A-08贺总铃响没多久就进来了。大概十点零八分，严先生从东边走廊那头过来，说洗手间排队，随便找了个靠后的座位。我当时忙着数人，没多想。"},{"id":"t_list","q":"号牌名单你给过谁？","a":"没有啊……除了A-08贺总的助理私下问过我一嘴，我没给。哎呀，真的就是问了一嘴，你们别往外传，我会被开除的。"},{"id":"t_victim","q":"你觉得谁想害谷老师？","a":"他得罪的人不少，可他是为了守住规矩。他今晚情绪很沉，看着像是发现了什么大事。我不敢猜，真的不敢。"}],"confronts":[{"clue":"c_bk4","breaks":"t_open","a":"这是我的平板……好吧，我违规了。我只是想早点做图录，没想到……没想到会出这种事。"},{"clue":"c_vip1","a":"这是我打的流程单，铃响一次，鉴定室那边谷老师说十点前出来。批注是我写的，他那时亲口说的。"},{"clue":"c_st1","a":"这是谷老师的笔记，他的字我认得，一笔一划都不会错。“真迹在哪？”……他是不是已经发现画被换了？"},{"clue":"c_mon1","a":"这是贵宾厅的监控画面？我对这套系统不太熟，时间戳我平时没留意过，也没人跟我说过它有问题。"}],"fallback":"哎呀，这个我真不知道，你别吓我……"},{"id":"peng","name":"彭大海","role":"保安队长","age":46,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"uniform","acc":"badge","mood":"stern"},"bio":"云轩拍卖行的保安队长，退伍军人，管门禁、监控和夜间巡逻。当晚是他用主卡打开鉴定室的门，发现了谷鸣远。","demeanor":"军人腔，爱说“报告”“长官”，被问到痛处会声音变大","topics":[{"id":"t_job","q":"你负责什么？","a":"报告，我管门禁、监控、巡逻，一共六个人的班。云轩的安保，每个点位我心里都有数。这次出事，我有责任。"},{"id":"t_clock","q":"监控时间准确吗？","lie":true,"a":"准！主机每天自动校时，误差不会超过几秒钟，我天天盯着的。你们看到的所有时间戳，放心大胆地当真就是了。","truth":"报告，不准。去年自动校时老是让摄像头掉线，我就把它关了，慢慢地主机越走越快，现在快了二十分钟。我怕被扣奖金，一直没敢报上去。"},{"id":"t_post","q":"你整晚都在监控室吗？","lie":true,"a":"报告，我整晚没离开过监控室，眼睛都没眨一下。所有点位的画面都在我视线里，要是有人进出，我不可能不知道。","truth":"报告，九点三十五到十点我溜出去了，躲在消防楼梯间用手机打了二十多分钟牌，监控室没人。我知道这是失职，可我真没碰过鉴定室。"},{"id":"t_open","q":"你怎么开的鉴定室门？","a":"柯女士十点零八分来监控室找我，说敲门没人应。规定动主卡得先向值班经理报备，报备完，十点一刻到的门口，十点十八分刷卡开门，谷先生已经倒在地上了，我第一时间报警，保护现场。"},{"id":"t_door","q":"谁能进鉴定室？","a":"门关上自动落锁，能开的有两张：谷先生自己的卡，和我的主卡。里面的人要放人进去，按钮一按门就开。门禁只记录刷卡，按钮不记。"},{"id":"t_cam","q":"东走廊摄像头怎么回事？","needs":["clue:c_mon2"],"a":"雷击，3号摄像头那一路跳闸，要去配电间手动合闸。我看见画面黑了，想等巡完这一轮再去，一拖就拖到出了事。这事我认。"},{"id":"t_offset","q":"时钟究竟偏了多少？","needs":["clue:c_mon3"],"a":"二十分钟，我自己拿手机对过。整改单我没签收。严先生来过一回，说整改月底前做完就行，夜场前千万别动系统，万一重启出岔子谁担责。我就顺坡下驴，拖着了。"}],"confronts":[{"clue":"c_mon2","breaks":"t_clock","a":"报告，设置页是我截的，“自动校时：关闭”。这是我关的，你们说得对，我愿意受处分，也不再瞒了。"},{"clue":"c_mon4","breaks":"t_post","a":"这是我的巡逻本，空白的那一栏就是我溜走的时间。我认罚，只求你们别把赌博的事告诉老板。"},{"clue":"c_mon1","a":"这帧画面时间戳是十点十五分，可我觉得，嗯……这块倒计时屏看着不对。我不是技术员，说不准。"},{"clue":"c_st3","a":"报告，我进去的时候，镇纸就是这个样子滚在地毯上，我没动现场，保护得很完整，请长官放心。"}],"fallback":"报告，这个我不清楚，请换个问题。"},{"id":"luo","name":"洛芷","role":"博物馆研究员","age":33,"look":{"skin":"light","hair":"long","hairColor":"black","glasses":"round","beard":"none","outfit":"turtleneck","acc":"scarf","mood":"sad"},"bio":"谷鸣远多年前的学生，也曾是他的恋人，现在在省博物馆做书画研究。受谷鸣远邀请来看压轴夜场，当晚多半时间在酒廊独坐。","demeanor":"冷静克制带自嘲，被刺痛时会笑一下，“你们别用那种眼神看我”","topics":[{"id":"t_job","q":"你为什么来今晚？","a":"谷老师邀请我来看压轴夜场，说有一幅他想让我看的东西。我在省博做书画研究，他是我的师傅。这些年我们不常联系，这次请柬来得有些突然。"},{"id":"t_relation","q":"你和谷鸣远是什么关系？","a":"师生，也曾经不止是师生。都过去了，各过各的日子，这些年连逢年过节都不怎么联系，你们不用多想。"},{"id":"t_visit","q":"你今晚单独见过他吗？","lie":true,"a":"没有。酒会上我一直待在酒廊，没有去过鉴定室，更没有单独见他。你们不要把我和这件事扯上。","truth":"我去过。二十点二十分到四十分，我在鉴定室里和他吵了一架，也提醒他那幅画的绢手感太新。他脸色很沉，只说了句“有人动了不该动的东西”，我气得撂下一句“你会后悔的”就走了。我撒谎，是怕你们知道旧事，更怕你们听到那句话。"},{"id":"t_paper","q":"你为什么说手感太新？","needs":["clue:c_bk3"],"a":"我摸过上百幅清初的绢本，那幅画的画心绢，手感太新，太挺括。可我没勇气说它是假的——我怕我错了，也怕我对了。我只是写了张便笺，让他再看一遍。"},{"id":"t_after","q":"九点半后你在哪？","a":"二十一点半离开酒廊后，我在楼梯间坐着，雨声很大，我哭了一阵。没人能证明，你们爱怎么想怎么想。"},{"id":"t_old","q":"你们的旧事是怎么回事？","needs":["ask:luo.t_visit"],"a":"九年前，他答应推荐我去故宫，后来因为一场鉴定风波他撤回了推荐。我恨过他很多年，直到后来明白，他是为了保护我。今晚我去找他，也是想把话说开。"},{"id":"t_victim","q":"你觉得他会遇到什么事？","a":"他太认真了，认真的人容易得罪人。请柬上只写了“来看一幅画”，我想他这阵子多半就是在为这幅画发愁。"}],"confronts":[{"clue":"c_bk3","breaks":"t_visit","a":"那是我的包，里面的纸条是我写的，时间也是真的。好，我说实话，二十点三十五分我还在鉴定室里，我去过。"},{"clue":"c_dn2","a":"酒廊的账单，是的，我二十点四十五到二十一点三十分都在吧台，侍者可以证明。我不是不想说，是怕被问到更多。"},{"clue":"c_st4","a":"紫外灯下的“巳”字……他是不是已经确认它是摹本了？那我今晚的直觉没有错，可我宁愿自己错了。"},{"clue":"c_st1","a":"这是他的笔迹，我认得，一笔一划都像他本人。“真迹在哪？”……他最后一页想的，竟然是这个。"}],"fallback":"我只想知道真相，别的，与我无关。"}],"solution":{"culprit":"yan","method":{"q":"凶手怎么做到的？","options":["买通保安关闭东走廊监控，趁谷鸣远独处时潜入，用主卡开门行凶","先在10月5日装箱时调包，再借监控和门禁时钟偏快二十分钟制造“全程在贵宾厅”的假象，终场铃后进入鉴定室行凶","在谷鸣远的茶里下毒，再伪造现场令死亡时间提前","与柯美玲合谋，由她在东走廊望风，严松从鉴定室暗门出入"],"correct":1},"motive":{"q":"为什么杀人？","options":["为了阻止拍卖行被贺承收购","为了独吞保险公司的赔偿金","他私下调包卖掉真迹，谷鸣远识破摹本并追问封条，凶手灭口以掩盖盗换","为报复谷鸣远当年撤回对他的推荐"],"correct":2},"keyClues":["c_mon1","c_vip1","c_st1","c_st2","c_bk1","c_bk2"],"truth":["凶手是保险调查员严松。他欠下巨额赌债，10月5日在墨痕画廊监督装箱时，趁柯美玲离场、封箱前库房里只剩他一人的十五分钟，把角落圆筒里的“展示用摹本”封进木箱，真迹则卷进自己勘验箱的夹层，港商已谈好四千二百万。","谷鸣远当晚终检时，在紫外灯下照出摹本右下角韩述留下的“巳”字暗记。洛芷提醒绢太新，韩述承认摹本只交给过柯美玲，他在笔记里写下：封箱监封人只有严松。他21:20发短信让严松十点前来解释，又在21:42追问柯美玲，确认她当天不在场。","严松的“不在场证明”来自一个错觉：拍卖行门禁和监控的时钟偏快整整二十分钟。他在10月9日的整改单里亲笔写过这一条。监控里他陪着贺承直到22:15，其实那是真实的21:55——终场铃一响，他就借口去洗手间离开了。","21:58，严松戴着白棉手套进入鉴定室，趁谷鸣远转身开紫外灯，用青铜镇纸击杀了他。门关上自动落锁，不需要刷卡，也没有任何记录。东走廊摄像头恰好因雷击离线。22:08，他回到拍卖厅，苏小棠还看见他从东走廊那头过来，说是洗手间排队。","保安彭大海22:18开门，门禁却记成22:38，又是同样的二十分钟。贺承证实严松在铃响时起身，那块倒计时写着三十五分钟；流程单写明终场铃是21:55。这些独立线索合起来，严松的“全程在场”不攻自破。","至于其他人：韩述怕被当成造假者，柯美玲怕质押贷款曝光，贺承私下预览、钱立诚暗谈收购、苏小棠违规拆箱、彭大海赌博又关了自动校时、洛芷隐瞒旧情——每个人都有秘密，但没有一个人的秘密能解释那二十分钟。","最后的铁证是后台17号架的勘验箱：夹层里卷着的绢本，旧补绢与轴头的“程”字小款都对得上韩述的修复日志，才是真迹。吧台边掉落的赌场逾期通知，背面写着“4200”和“拍后”，说明了他为何铤而走险。严松原打算拍卖一结束，就拎着这只箱子走出云轩。"]}},{"id":"zujie","title":"留声","tagline":"满座宾客都听见他在门里念稿，可那扇门是从外面锁上的。","difficulty":4,"cover":"cover","tone":"sepia","brief":"一九三七年八月底，上海法租界。闸北的炮声隔几分钟就滚过一阵，泰和洋行买办顾鸿章在霞飞路公馆办欢送酒会，周二就要举家去香港。可就在致词前，他死在了锁着的书房里。公馆里有英国大班、日本记者、来历不明的女学生，还有一台据说在发报的电台，巡捕房的老朋友怕此案牵出外交纠纷，半夜把你请来。你踏进公馆时，客厅里的钢琴没人弹了，二十来位宾客被扣在原地，所有人都说同一句话：九点四十一分，顾老爷在书房里排练致词，还活着。","victim":{"name":"顾鸿章","desc":"泰和洋行买办，五十八岁。仰卧在二楼书房书桌后，后脑被重物击伤。书房门从外面反锁，钥匙在他背心口袋里，窗闩却是抬起的。","look":{"skin":"light","hair":"slick","hairColor":"grey","glasses":"rect","beard":"mustache","outfit":"suit","acc":"pocketwatch","mood":"stern"}},"publicFacts":["顾鸿章是泰和洋行的买办，周二将去香港，今晚的酒会既是欢送，也是为了二十二点的致词。","二十二点十分，管家周福用钥匙打开反锁的书房门，发现顾鸿章死在书桌后，凶器像是桌上的铜马镇纸。","书房的钥匙共三把：顾自己一把（在他口袋里）、管家一把、账房钱仲平一把。","大班哈考特与账房钱仲平称，二十一点四十一分在书房门外听见顾在里面排练致词，所有人据此认为那时他还活着。","公馆里有英国大班、日本记者、来历不明的女学生，据说阁楼里还有人发电报；二十二点十分后大门落锁，宾客一律不得离开。","闸北正在打仗，租界当局最怕涉外命案，限你天亮前给出答案。"],"timeline":[{"t":"19:30","text":"晚宴开席，二十几位宾客在餐厅入座。"},{"t":"20:40","text":"宾客移至大客厅，林素秋弹钢琴，白露放留声机。"},{"t":"21:41","text":"大班与账房称在书房门外听见顾鸿章排练致词（二人所述）。"},{"t":"22:00","text":"原定致词时间，顾鸿章没有出现。"},{"t":"22:10","text":"管家用钥匙开门，发现顾鸿章死亡，窗闩抬起，门反锁。"},{"t":"22:15","text":"公馆报案，租界巡捕房通知了你。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"study","name":"顾鸿章的书房","scene":"study","desc":"二楼走廊尽头的大书房，厚地毯、红木书桌、满墙洋装书。尸体已被盖上白布，门锁已被管家用钥匙打开过。","clues":[{"id":"c_study1","title":"书房的手摇唱机","text":"窗边矮柜上的手摇留声机，发条已完全松尽，唱针停在一张十寸铝质刻录盘最里圈的空槽上，盘面用铅笔写着“致词 一”。制动杆上缠着一小截烧焦的红色棉线，旁边小碟里有一截烧短的线香头，香灰落了一小摊。"},{"id":"c_study2","title":"死者的状态","text":"顾鸿章仰卧在书桌后，后脑塌陷，血已发暗发干，地毯上的血渍边缘结硬。夜里十一点巡捕房的医生赶到，试了下颌与颈项：已经僵硬，手指冰凉，膝弯也发紧。他低声说：“僵到这个地步，少说也死了快两个钟头，也许更久。”桌角那只铜马镇纸沾着血和头发，地毯上还有一只摔碎的威士忌杯。"},{"id":"c_study3","title":"刻录盘试听","text":"你把“致词 一”放回唱机摇紧发条试听：顾的声音念着告别词，第一句“诸位，今晚承蒙赏光”之后清了一下嗓子，后面有一句“我先静一静，稍后再出来同诸位道别”，全盘约两分半钟，底噪沙沙。旁边另一张“致词 二”被收在唱片套里，盘面干净没有磨痕。"},{"id":"c_study4","title":"门锁与钥匙","text":"书房门是普通的弹子锁，从外面用钥匙才能反锁。顾的钥匙在他背心口袋里，锁孔内侧没有插着钥匙。管家说这把锁一共三把钥匙：顾自己一把、管家一把（开门用的就是这一把）、账房钱仲平一把，他说自己那把一直锁在抽屉里。"},{"id":"c_study5","title":"半开的法式窗","text":"通向露台的法式窗窗闩被抬起，窗扇虚掩。但门槛和窗框下缘落的一层薄灰完好无损，没有被手或鞋蹭过；窗帘下摆干燥平整，而窗外这一晚下过雨，露台边缘湿漉漉的。"}]},{"id":"acct","name":"账房","scene":"library","desc":"一楼后侧的小账房，满柜线装账簿，一股檀香味。钱仲平平日在这里办公，门没锁。","clues":[{"id":"c_acct1","title":"线轴与线香","text":"账房桌上摆着装订账册用的红色粗棉线轴，线头有新鲜的剪口，轴上少了一截。桌边的香筒里插着一束同样粗细的檀香线香，其中一支被掐去了一段。账房里常年点檀香，这是钱仲平的习惯。"},{"id":"c_acct2","title":"两套账簿","text":"书柜里有两套账。一套是洋行保证金的明细账，每页盖着“钱”字朱印，大笔款项以“寄港·K.M.”名义转出，累计四十二万元。另一套是顾鸿章的私账，字迹是顾的：K.M. 即“金茂行”，开在香港，户主栏填的是顾鸿章的化名。"},{"id":"c_acct3","title":"钱的存折","text":"抽屉里一本折子：钱仲平四千八百元的全部积蓄存在顾家的“鸿泰钱庄”，八月二十六日起挤兑停付，折上盖着“暂缓提取”的红戳。折子下压着一张写着“儿媳产期在十月”的便条。"}]},{"id":"hall","name":"大客厅","scene":"hall","desc":"摆着三角钢琴和留声机的大客厅，酒会的残局还没收拾，窗外隐约传来闸北方向的炮声。","clues":[{"id":"c_hall1","title":"舞会节目单","text":"节目单背面是铅笔写的临时安排：“林小姐：21:30 后曲目改慢板，21:38 起停琴七分钟（钱先生嘱，说老爷要排练致词，要清静）。21:45 恢复。”最下面用红笔圈着“22:00 致词”。"},{"id":"c_hall2","title":"电话便条","text":"电话机旁的便条纸上记着：“21:10 吴律师来电，请太太回电，说‘遗嘱和房契的事’。我上楼敲了太太卧房的门，太太在里头应了一声，说‘知道了，待会儿’。”落款是接线的佣人。"},{"id":"c_hall3","title":"来宾签名簿","text":"签名簿上哈考特、几位洋行同仁、银行界人士的名字齐全。最后一栏有个潦草的“石川谦”，介绍人写着“白露夫人”，没有请柬编号，旁边有人用铅笔打了个问号。"},{"id":"c_hall4","title":"沙发上的手袋","text":"沙发角落有只小手袋，里面一本窄长的小册，页页都是四位数字和圈圈叉叉，夹着几张“白鸽票”和马票的存根。手袋内袋里还有一张去香港的船票的收据复写联，写的是两人名字。"}]},{"id":"garden","name":"花园与露台","scene":"garden","desc":"洋房后面的草坪和露台，夜里下过雨，泥地潮软。墙角立着一只焚烧落叶的铁桶，远处有炮声闷闷滚过。","clues":[{"id":"c_gar1","title":"焚烧桶里的残纸","text":"铁桶里的灰还微温，灰底压着半张没烧尽的毛边纸，右下角有一枚朱红的“钱”字方印，纸边一排细密的针孔，像是从线装册子上撕下来的；残存字迹是“……愿自承……亏空……绝无异议”。"},{"id":"c_gar2","title":"窗下的花坛","text":"书房露台下的花坛泥土松软，没有任何脚印通向窗台或爬上露台的痕迹。草坪另一头的树荫下有一小片被反复踩踏的草，地上落着五六个“敷岛”牌香烟头，离书房窗约二十步。"},{"id":"c_gar3","title":"掉落的胶卷盒","text":"树荫下的草丛里躺着一只空的小号胶卷盒，盒盖上有人用指甲划了个“I”字。附近的草被压得很平，像是有人长时间蹲伏在这里，朝书房的窗口张望。"}]},{"id":"attic","name":"三楼阁楼","scene":"guestroom","desc":"顾明远住的阁楼客房，斜顶、小窗、一张行军床。屋里有股焊锡和旧木头的味道。","clues":[{"id":"c_att1","title":"藏在箱里的电台","text":"床下的旧樟木箱里藏着一台短波发报机，天线从老虎窗拉出去。机旁摊着一本发报日志，用铅笔记满数字组，最后几行时间是：“21:04 起 · 21:29 止”，其中一行批注“21:08 新底本到（素）”，每行后面都有一个“明”字签。"},{"id":"c_att2","title":"《圣经》密码页","text":"床头一本英文《圣经》，书页间夹着手抄的一串串数字，对应章节与行数——一套用经文做底的简易密码。扉页写着“林素秋，圣玛丽女校”，字迹是女孩子的。"},{"id":"c_att3","title":"顾写给明远的字条","text":"桌上压着一张顾鸿章手书的字条：“那东西明晚之前搬走。不然我自己送去公董局。你想害我们全家吗？ 鸿”。字条边缘有被攥皱又抚平的痕迹，日期是八月二十三日。"}]},{"id":"kitchen","name":"厨房与后楼梯","scene":"kitchen","desc":"一楼后侧的厨房，连着通二楼的后楼梯和通花园的后门，酒会的碗碟堆了半个灶台。","clues":[{"id":"c_kit1","title":"灶间的湿毛巾","text":"灶台边的毛巾架上挂着一条潮湿的粗布毛巾，上面有一抹淡褐红的痕，凑近有一股檀香味。厨娘说，晚上九点一刻多，有位先生在灶间水龙头下匆匆冲了手，把毛巾用完就挂回去了。"},{"id":"c_kit2","title":"领用单","text":"厨房的领用簿上记着：“20:30 书房 冰一桶 酒杯二只 威士忌一瓶 周福取”。后面又记“20:55 书房 咖啡两份——钱先生说不必，退”。备注栏里有人写：“二楼书房，内有老爷与钱先生。”"},{"id":"c_kit3","title":"后门的泥印","text":"通后弄堂的后门，门槛里侧泥地上有几个新鲜的鞋印，不止一双布鞋，鞋底都沾着雨后的泥。厨房的角落里放着骰盅和一副扑克牌，盒盖上写着“周”。"}]}],"suspects":[{"id":"shen","name":"沈婉仪","role":"顾太太","age":51,"look":{"skin":"light","hair":"bun","hairColor":"grey","glasses":"none","beard":"none","outfit":"qipao","acc":"necklace","mood":"stern"},"bio":"顾鸿章的正室，当家主母，酒会的女主人。说自己晚宴后一直留在客厅招呼女眷，直到管家喊人才知道老爷出了事。","demeanor":"端着架子，冷而克制，开口先“我们顾家”，被戳到痛处就笑。","topics":[{"id":"t_role","q":"你与顾鸿章是怎样的夫妻？","a":"我们顾家二十六年。他是买办，我是顾太太，该有的体面一样不缺，该担的家事我也一件没落下。外头怎么说，我不管。"},{"id":"t_where","q":"案发前后你在哪里？","lie":true,"a":"客厅。陪几位银行太太说话，一步没挪。你去问她们，我是主人，怎么能够离席？这点规矩我还是懂的。","truth":"我二十点五十分上了楼，关着房门在老爷卧房里翻他的抽屉，足足待到九点二十分才下来。我想找船票。我要知道，那个人这一回走，是不是把我留下。"},{"id":"t_noise","q":"你在楼上听到什么？","needs":["ask:shen.t_where"],"a":"落地钟刚敲过九点，过了几分钟，我从卧房出来站在楼梯口，听见走廊那头书房里有一声闷响，像重东西倒了，接着是玻璃碰地的声音。我以为他又跟人拍桌子，没理会。"},{"id":"t_marriage","q":"你和他感情和睦吗？","lie":true,"a":"夫妻之间，有什么不和睦的？他在外头应酬，我在家里管事，二十六年没红过脸。若说有不顺心的，那也是上海这世道不顺心。","truth":"和睦？我找到了两张头等舱的船票，周二开往香港，一张顾鸿章，一张白露。没有我的。他要把我连同这栋空房子一起留给日本人的炮火，自己带着那个唱歌的走。"},{"id":"t_will","q":"吴律师为何来电？","needs":["clue:c_hall2"],"a":"那是遗嘱的事。八月二十号老爷改过一次，吴律师含含糊糊没说明白，我才打电话问。九点二十，我在楼上分机上给他回的话，他说顾的新遗嘱，大头给了一个我“不认得的户头”。"},{"id":"t_ming","q":"你对养子明远怎么看？","a":"明远是我娘家侄孙，过继给我们的。这孩子聪明，就是心太野，整天往学堂跑，跟些来历不明的同学来往。老爷为这孩子操了不少心，也发过几次火。"},{"id":"t_bai","q":"你对白露怎么看？","a":"一个百乐门出来的，会唱几支小曲，就以为这座公馆也姓白了。我不屑与她争。可今晚她在我眼皮底下，把一个陌生的东洋人带进客厅，这就是不懂规矩了。"},{"id":"t_alive","q":"你信那声音是他吗？","a":"我没有亲耳听见，是大班和钱先生说的。钱仲平跟了他二十二年，说话向来稳当，他说听见，大概错不了。只是我没听见，不好说。"}],"confronts":[{"clue":"c_hall2","breaks":"t_where","a":"她盯着便条上“敲了太太卧房的门”那一行，嘴角抽了抽。“佣人嘴快。”她终于说，“我那时在楼上。你想要真话，就别一直盯着我的脸。”"},{"clue":"c_hall4","breaks":"t_marriage","a":"她的指甲掐进了掌心。“船票收据，两个名字……”她低头笑了一声，“原来她也知道。那就不必装了，我找到了票，我气得发抖，我也想过杀人，可我没有动手。”"},{"clue":"c_study4","a":"“钥匙？管家有，账房有。”太太淡淡道，“我是主母，从不管这些。不过这屋里谁能反锁那扇门，我倒是想了很久。”"},{"clue":"c_study2","a":"她看着盖白布的人形，很久没有说话。“僵了？”她低声问，“那么九点过的那声闷响，就是……”话没说完，她的手撑在了椅背上。"}],"fallback":"这些东西我不懂，你该去问账房与管家。"},{"id":"qian","name":"钱仲平","role":"账房先生","age":55,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"robe","acc":"pocketwatch","mood":"tired"},"bio":"在顾家当了二十二年账房，经手洋行保证金与顾家全部账目。晚宴后说自己在账房理账，九点半后到大厅招呼客人，还陪大班去过书房门口。","demeanor":"恭谨、絮叨，爱说“不敢”“小的愚见”，被问急了就反复擦眼镜。","topics":[{"id":"t_role","q":"你替顾先生管什么？","a":"洋行的保证金明细、家里的开销、钱庄往来，都是小的经手。二十二年了，顾先生信得过我，账上的章只有我那一枚。不敢说功劳，只能说没出过岔子。"},{"id":"t_last","q":"你何时最后见到他？","lie":true,"a":"二十点五十几分，我把账册送进书房，老爷看了两眼，说了句“知道了”，我就退出来了。那会儿他好好的，我再没进去过。这话巡捕房问几遍都是这句。","truth":"我没有退出来。他拿出一张字据，逼我画押，说四十二万的亏空全是我经手、我盖的章，明晚他就走了，我不认也得认。我……我在他背后抄起了镇纸。九点过一刻我才从那间屋子里出来。"},{"id":"t_where","q":"21点到21点25你在哪？","lie":true,"a":"在账房里，一个人，对着账册。灯亮着，门也没关，谁都看得见。到九点半光景我才去大厅，帮着给客人添茶，这一节厨房里的人都能作证。","truth":"我不在账房。我从后楼梯下来，在灶间冲手，又去了花园。周福撞见我时，我说是烫着了手。那天晚上我走过的每一步，其实都有人看见，只是人家没往心里去。"},{"id":"t_alive","q":"21:41你听到了什么？","lie":true,"needs":["ask:qian.t_where"],"a":"大班哈考特先生要见老爷，我就陪他去书房门口。里头老爷在排练致词，一句句念得清清楚楚，还清了嗓子。大班先生也听见了。老爷那时活着，凶手只可能是后来从窗口进去的外人。","truth":"那不是老爷。我九点十分把“致词一”放上唱机，上紧发条，红线拴住制动杆，线搭在一支点着的粗檀香上，离香头一寸半。香烧到线，线断，盘就转了，正好半个钟头。我带大班去听的，是一个死人念他自己的稿子。"},{"id":"t_voice","q":"那声音真是老爷？","needs":["ask:qian.t_alive"],"a":"是老爷的声音，没错。跟他二十二年，闭着眼我也认得出：他的嗓子，他那口咳嗽，他的官腔。老爷下午还在书房里摆弄他那架新机器，试嗓子，得意得很。您若说是别人学的，除非拿得出第二个顾鸿章。"},{"id":"t_stop","q":"为何要林小姐停琴？","needs":["clue:c_hall1"],"a":"是我去同林小姐传的话，九点三十八分起停七分钟，我同她说的是“老爷要排练致词，请清静一会儿”。大班先生那边，我也请他去听听老爷念稿，有个洋人在旁边，老爷脸上也有光。小事一桩，何必当真。"},{"id":"t_window","q":"书房的窗是怎么回事？","needs":["clue:c_study5"],"a":"窗闩抬着，窗虚掩着，开门的时候小的也看见了。依小的愚见，外头来的人翻进窗，打死老爷，再翻出去，也不是不可能。闸北那边乱成那样，租界里混进多少闲人，谁说得清。"},{"id":"t_ledger","q":"“寄港K.M.”是什么？","needs":["clue:c_acct2"],"a":"这户头是老爷自己吩咐开的，小的只管照章登记，盖的是账房的章。去向么，账上只写“寄港”两个字。外头人说什么的都有，说替日本人办事的，说替英国人跑腿的，小的只认账上的字，不敢乱猜。"},{"id":"t_money","q":"你的钱呢？","needs":["clue:c_acct3"],"a":"小的一辈子的积蓄，四千八百元，存在老爷的钱庄里，八月二十六号停付，取不出一个铜板。儿媳十月生产，我连接生婆的钱都垫不出……可这与命案有什么关系，您别往小的头上扣。"}],"confronts":[{"clue":"c_study1","breaks":"t_alive","crack":true,"a":"他的手慢慢伸向眼镜，又缩回去。“……唱机停了。针在最里头。”半晌，他摘下眼镜，声音突然很轻：“您看得很细。是，是我放的盘，我不敢说是老爷的声音，可我也不敢说不是。”"},{"clue":"c_study2","breaks":"t_alive","a":"“僵了……”钱仲平喃喃道，“可九点四十一分……我亲耳……”他忽然闭嘴，像被人掐住了喉咙。过了一会儿才低声说：“人死了多久，是尸体说了算，不是耳朵说了算。”"},{"clue":"c_study3","a":"他听着唱机里那段“稍后再出来同诸位道别”，肩头一点点塌下去。“……连清嗓子的位置，一个字也没差。老爷下午刻这张盘，是笑着让我听的。他大概没想到，它会被用来干这个。”"},{"clue":"c_acct1","breaks":"t_alive","crack":true,"a":"“这线……是账房的装订线。”他看着那截红线，很久没有说话。“香也是我的。可全公馆的账册都用这种线，您说是我，也说得通别人。”他的手却在发抖，抖得连眼镜都握不稳。"},{"clue":"c_hall1","a":"“……是我吩咐林小姐的。”他连说了两遍，“可我一个账房，让大班听老爷念稿子，也算犯法么？”话没说完，嗓子已经哑了。“那盘子又小又沙，琴一响就什么都盖住了……”他猛地住了口。"},{"clue":"c_gar1","breaks":"t_last","a":"他盯着那枚朱印看了许久。“那是我的章……老爷逼我画的押。我烧了它。是的，我烧了它。”忽然抬起头，“可烧一张纸，不是杀人。”这句话说得既像辩解，又像认罪。"},{"clue":"c_kit1","breaks":"t_where","a":"“灶间的毛巾……”他苦笑了一下，“是我擦的手。我说是烫着了。厨娘居然还记得。”他望着自己的手心，像要找出什么没洗掉的东西。"},{"clue":"c_gar2","a":"“没有脚印。”他重复了一遍，“窗闩是我抬的。我只想着窗闩，没想着泥。”他缓缓坐下，“五十五岁的人，把一个晚上算得再细，也算不过一场雨。”"},{"clue":"c_acct2","a":"“您翻到了他的私账。”钱仲平声音发干，“K.M. 就是金茂行，四十二万，全是他转走的，账却做在我名下。我早知道有这一本，只是没有凭据。他说签了字据，明早便不再追究；不签，便送我去巡捕房。我五十五了，没处去。”"},{"clue":"c_acct3","a":"他的眼圈慢慢红了。“那折子……那是小的一辈子。”他沉默了很久，“他要走，要拿我顶缸，还把我的棺材本留在一家不会再开门的钱庄里。可这些，说出来像是替自己开脱吧？”"}],"fallback":"小的……不敢乱说，这件东西小的没见过，也不明白与账房有何相干。"},{"id":"bai","name":"白露","role":"顾家姨太太","age":31,"look":{"skin":"fair","hair":"curly","hairColor":"black","glasses":"none","beard":"none","outfit":"qipao","acc":"earrings","mood":"worried"},"bio":"百乐门出身的歌女，三年前被顾鸿章纳为姨太太，在公馆里处处看人脸色。今晚在客厅给林素秋的钢琴翻谱、放唱片，还引了一位东洋记者进门。","demeanor":"软糯、会撒娇，嘴上叫“阿拉”，一紧张就绞手帕，爱岔开话题。","topics":[{"id":"t_role","q":"你在顾家的处境如何？","a":"阿拉是什么身份，侬还看不出吗？老爷疼我，太太瞧不上我。我不过是个歌女，进这公馆，吃一口饭，也吃一肚子气。今晚他死了，我还不晓得明天睡哪里。"},{"id":"t_book","q":"手袋里的小册子是什么？","lie":true,"a":"那……那是家里的菜账呀，买米买菜的。数字密密麻麻的，我自己都认不全。侬一定要看，就拿去看好了，反正无聊得很。","truth":"是白鸽票和马票的号码。我偷偷买，输了好些钱，不敢叫老爷知道。人家以为是什么密码本，阿拉倒是想要有那么玄的东西，可惜只是赌。"},{"id":"t_invite","q":"石川是怎么进来的？","lie":true,"a":"是阿拉的表哥呀，在日本做事情。想来见见世面，阿拉就写了个名帖。老爷也知道的，没有什么好问的。","truth":"他不是我表哥。他是个记者，来找我打听顾家与东洋人的往来。我缺钱，收了他一点好处，替他签了名。我真不晓得他要拍什么，更不晓得他会在花园里蹲着。"},{"id":"t_quarrel","q":"你和老爷吵过架吗？","a":"二十点二十分，在走廊里。我问他周二去香港，是不是带我。他说带，又吞吞吐吐，说“人多嘴杂”。我气极了，把手帕丢在他脸上。后来我躲在房里哭，十几分钟，才下楼。"},{"id":"t_record","q":"老爷下午做了什么？","needs":["clue:c_study1"],"a":"下午四点半，老爷新买的那台刻录机在书房玩，还叫我去唱了一首《夜上海》刻在盘上。他刻了两张致词，一张“一”，一张“二”，念得一本正经，念完自己先笑，说官腔十足。钱先生就站在书桌旁递账册。"},{"id":"t_ticket","q":"你知道去香港的船票？","needs":["clue:c_hall4"],"a":"周二的头等舱，一张老爷，一张阿拉。他说太太留在上海看房子，免得被人说闲话。这话他对太太说过没有，阿拉可不晓得，可见了她，阿拉总觉得心虚。"},{"id":"t_hall","q":"21点后你在做什么？","a":"在客厅换唱片。林小姐九点过后就不在琴边，说去透口气，我替她放了几张舞曲，一直放到她回来为止，大概九点二十几分。后来她回来，我就把唱机交给她。"},{"id":"t_ming","q":"你对明远有何看法？","a":"那孩子心眼好，就是爱躲在阁楼里。上个礼拜我听见楼上有“嘀嘀嗒嗒”的声音，像发电报。老爷也听见了，当天夜里火气很大，把他叫去训话。"}],"confronts":[{"clue":"c_hall4","breaks":"t_book","a":"她的脸一下子白了。“侬……侬翻了阿拉的包。”她抢过手袋，又泄气地松开，“好吧，我赌，输得精光，不敢跟老爷说。那种事，总比杀人好听吧？”"},{"clue":"c_hall3","breaks":"t_invite","a":"她看着那行潦草的“石川谦”，抿着嘴唇不吭声，半晌才小声说：“是我签的。我不晓得会出这种事。”"},{"clue":"c_study3","a":"她听见唱机里老爷的声音，浑身一抖。“就是这张。”她低低说，“下午他刻着玩，还笑说‘等我走了，你们想我就放这张’。想不到……”"},{"clue":"c_att3","a":"“明远……”她叹气，“那孩子被老爷逼得没法子。可阿拉可以拿命担保，那孩子连只鸡都不敢杀。”"}],"fallback":"阿拉不晓得呀，侬不要一直盯着阿拉看。"},{"id":"ming","name":"顾明远","role":"顾家养子","age":24,"look":{"skin":"light","hair":"messy","hairColor":"black","glasses":"round","beard":"none","outfit":"shirt","mood":"worried"},"bio":"太太娘家的侄孙，过继给顾家，在圣约翰大学念书。说自己整晚在三楼房里看书睡觉，直到被楼下的喊声惊醒。","demeanor":"年轻气盛，防备心重，爱反问，被逼急了会冷笑。","topics":[{"id":"t_role","q":"你和顾家是什么关系？","a":"过继来的，吃顾家的饭，念顾家的书。老爷待我，说得上恩，也说得上管得严。他想让我毕业后去洋行当学徒，我想去的地方，他不肯放我去。"},{"id":"t_night","q":"案发时你在哪里？","lie":true,"a":"三楼我自己的房里，睡觉。白天跑了一天，累得很，一觉睡到管家敲门。这有什么好问的？我又不是那种杀人的人。","truth":"我没有睡。九点零四分到九点二十九分，我在阁楼里发报。我们这几个同学成立了一个小团体，把上海战事的消息发往内地。那天夜里是整夜最忙的时候，我不能离开半步。"},{"id":"t_gu","q":"你和顾先生有矛盾吗？","lie":true,"a":"没有。老爷待我很好。偶尔训我几句，那是做父亲的本分，我从来不放在心上，更不会为此记恨他。","truth":"有。上周他发现了电台，说再不拆，就把我送去公董局。他说“你想害我们全家吗”。我们吵过，我摔了门。但我不会杀他，他再凶，也是养了我十年的人。"},{"id":"t_lin","q":"你和林素秋认识吗？","lie":true,"a":"林小姐？今晚才第一次见。她是白姨太请来弹琴的，我们一句话都没说过，谈不上认识，更没有来往。","truth":"她是我的同学，也是联络员。她今晚借着弹琴进门，真正的任务是把新的密码底本带给我。九点零八分她上阁楼，十几分钟就回去了。我们都没想到，那十几分钟，会成为她整个晚上的空白。"},{"id":"t_radio","q":"电台是怎么回事？","needs":["clue:c_att1"],"a":"短波发报机，是一位教授拆旧收音机拼的。我在阁楼里用它，替他们发闸北的情况。日志上写着我的起止时间，九点零四到九点二十九，这二十五分钟我一直在发报，一步也没挪开。"},{"id":"t_smell","q":"之后你有没有下楼？","needs":["ask:ming.t_night"],"a":"收报完毕，我下二楼上厕所，大概是九点三十二分。经过书房门口，里头没有一点声音，门缝底下渗出一股檀香味，浓得很。老爷平常只抽雪茄，他最讨厌香味，我当时还觉得奇怪。"},{"id":"t_key","q":"你对书房钥匙了解吗？","a":"三把钥匙，老爷自己一把，管家一把，账房钱先生一把，我都没有。书房是顾家的重地，我这个养子进去只能敲门。"},{"id":"t_will","q":"你想过老爷遗嘱吗？","a":"我不指望他留给我什么。他要是真留给我什么，我反倒睡不踏实。顾家的财产，太太、白姨太、洋行，谁拿都轮不到我。"}],"confronts":[{"clue":"c_att1","breaks":"t_night","a":"他沉默了好一会儿，把发报日志合上，低声说：“你们终究还是翻到了。好，我认。可你们也看见了，这二十五分钟，我寸步没有离开。”"},{"clue":"c_att3","breaks":"t_gu","a":"“他写得很重。”明远冷笑，“可你要是以为我会因此动手，那就看轻了我。我也想过，要是他死了该多好。但我宁可把机器沉进苏州河，也不想拿命去换。”"},{"clue":"c_att2","breaks":"t_lin","a":"他的脸色变了。“她的名字写在扉页上……好吧，她是我的联络员。请别把她牵扯进来，她只是个十九岁的学生。”"},{"clue":"c_study1","a":"明远盯着那截烧焦的红线，目光忽然锐利了：“有人用香做定时？这不是临时起意，这是预先布置好的。”"}],"fallback":"这个我不清楚，我只管自己的书。"},{"id":"hark","name":"哈考特","role":"英籍洋行大班","age":52,"look":{"skin":"fair","hair":"sidepart","hairColor":"red","glasses":"none","beard":"mustache","outfit":"suit","acc":"tie","mood":"stern"},"bio":"泰和洋行的英国大班，顾鸿章的顶头上司。今晚是顾的欢送酒会主宾，明早本要带人查账。他说自己晚宴后一直在大客厅，九点四十分与钱先生一起去过书房门口。","demeanor":"英式冷淡，中文夹英语，语速慢，喜欢先反问“你凭什么这样问”。","topics":[{"id":"t_role","q":"你与顾是什么关系？","a":"他是我的买办，二十年。生意上，他给洋行办事，我给他地位，彼此互不亏欠。我今晚来，是为他送行，也有……几件账目上的小事需要明早处理。"},{"id":"t_private","q":"散席后你见过他吗？","lie":true,"a":"Well，不曾。晚宴之后我一直在客厅里，和银行的几位先生谈话，没有单独见过顾。你们警察总想把大班和买办的闲话变成密谈，我不喜欢这样。","truth":"见过。二十点三十五分，他在书房请我喝威士忌。我们谈到洋行保证金的亏空。他很镇定，说明天十点账本摆在桌上，“都是账房钱仲平经手的，你去问他”。我二十点五十分离开，那是我最后一次看见他的脸。"},{"id":"t_spy","q":"你为什么盯着他的账？","lie":true,"needs":["ask:hark.t_private"],"a":"洋行大班检查买办账目，天经地义。你若想听出别的意思，就是你的想象了。我可没有什么谍报任务，也不会向租界当局以外的人汇报。","truth":"领事馆托我查他：有人说顾把钢材转卖给日方军需商。我查了账，发现钱是流向香港，却不是通敌。这件事没有任何公开的权限，若泄露，我在租界立刻难做。我隐瞒，是为公务，不是为命案。"},{"id":"t_41","q":"21:41你听见了什么？","a":"九点三十九分，钱仲平先生请我去书房门口，说顾正在排练致词。走到门外是四十一分前后，很静，我听见里面的声音：“诸位，今晚承蒙赏光”，然后有人清嗓子，还说“我先静一静，稍后再出来同诸位道别”。我以为他在排练，就没有敲门。"},{"id":"t_odd","q":"那声音有无异样？","needs":["ask:hark.t_41"],"a":"Hmm，现在你问起，我倒觉得有点怪。声音很平，语气没有变化，也没有停顿去想词，一句接一句。人排练时总会重复，会改，会骂自己。而那声音，像背得滚瓜烂熟，或者……像念的是印好的东西。"},{"id":"t_qian","q":"钱仲平如何引你去？","needs":["ask:hark.t_41"],"a":"他在客厅里找到我，神色很恭敬，说“老爷在排练致词，请大班先生听一听，也许有话要指教”。他还特意看了看表，说“差一两分钟，等等就好”。我当时以为是中国人的客气。"},{"id":"t_window","q":"你看到窗口有人吗？","a":"我在客厅窗前抽烟时，往花园看过一眼，似乎有个影子在树荫下。可我的眼睛不是很好，也许是花匠。我没有注意到有谁翻窗，也没有听到任何响动。"},{"id":"t_late","q":"22点之后做了什么？","a":"到了十点，致词时间已到，顾却没有出来。我与钱先生都觉得不对，是管家周福用钥匙开的门。我看见他躺在地上，那一刻我想：昨夜我同他还在讲公事，今天他就不会再说话了。"}],"confronts":[{"clue":"c_kit2","breaks":"t_private","a":"大班把领用单看了两遍，鼻子里哼了一声。“冰桶，两只杯子。是的，那是我。你们的人记账记得比我的会计还细。”他松了松领带，“好吧，我可以说实话。”"},{"clue":"c_acct2","breaks":"t_spy","a":"他看着“金茂行”三个字，神情终于松动。“所以我查到的，只是这个。”片刻后他苦笑，“我的上司将因此得知，这个民国买办不是汉奸，只是个贼。这比我们想的好一些，也坏一些。”"},{"clue":"c_hall1","a":"“钱先生吩咐停琴？”大班皱起眉头，“那么我听到的静，是他安排的静。”他沉默了几秒，“我一直以为，那是顾自己要求的。”"},{"clue":"c_study1","a":"大班凑近唱机看了很久。“有人把它摇上了弦。”他缓缓直起身，“你是说，我听见的是机器？……天哪，我是证人，还是帮凶？”"}],"fallback":"这件东西与我无关。如果你想指控什么，请先拿出证据。"},{"id":"shi","name":"石川谦","role":"日籍记者","age":35,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"sly"},"bio":"《大陆晨报》驻沪记者，日本人，会说一口略带关西腔的中文。凭白露夫人的名帖进了酒会，自称一直在大客厅里与宾客攀谈。","demeanor":"客气得过分，常鞠躬，说话绕弯，被追问时先道歉再避实就虚。","topics":[{"id":"t_role","q":"你为何来参加酒会？","a":"失礼了。我是新闻记者，想报道一位买办离沪赴港的新闻，也想请教租界商界对战局的看法。顾先生是体面人物，我一向敬重。"},{"id":"t_where","q":"案发时你在哪里？","lie":true,"a":"一直在大客厅，与几位先生谈话，也听林小姐弹琴。失礼，请原谅我记不得具体和谁说话，酒喝得不少，只记得很热闹。","truth":"我在花园。九点钟之后，我借口透气，在树荫下蹲了很久，想拍书房的窗口和人影。我怀疑顾先生和军需商有往来。这件事我没有说，因为我是日本人，在这个晚上出现在命案现场，谁都会怀疑我。"},{"id":"t_cam","q":"你带着相机吗？","lie":true,"a":"没有。记者到酒会，应该只带笔和耳朵，相机太失礼了。我一向守规矩，请不要误会，更不要怀疑我。","truth":"带了一台小相机，藏在大衣里。我在花园里想偷拍，结果胶卷盒掉在草丛里。我什么都没拍到，窗帘一直拉着。"},{"id":"t_war","q":"你对战事怎么看？","a":"我反对这场战争。我写过稿子，被编辑部压下来了。我是日本人，也是人，看见炮火压在闸北，我不好受。请别因为我的国籍，就把我当作间谍。"},{"id":"t_voice","q":"花园里听到什么？","needs":["ask:shi.t_where"],"a":"九点四十分左右，书房窗里传出人的声音，说“诸位，今晚承蒙赏光”。我隔着窗帘听着，觉得声音带着沙沙的杂音，像唱片的底噪，只是当时很远，我没往这方面想。"},{"id":"t_shadow","q":"你在花园看到谁？","needs":["ask:shi.t_where"],"a":"九点二十分前后，墙角焚烧桶边有个瘦瘦的人影，穿灰布长衫，背对着我，在烧什么东西。风里有一股檀香味。他烧完用鞋尖把灰拨平，匆匆走了。我没看见脸。"},{"id":"t_window","q":"你见到有人翻窗吗？","a":"从九点到九点四十，我盯着那扇窗，没有人爬上露台，也没有人从窗里出来。窗帘一直拉着，直到最后，我才听到有人叫管家开门。"},{"id":"t_bai","q":"你和白露怎么认识的？","a":"失礼了，那是一个朋友引荐的。白夫人需要一点帮忙，我需要一张进门的名帖，大家各取所需。我没有为难她，也没有写任何不利于她的东西。"}],"confronts":[{"clue":"c_gar3","breaks":"t_cam","a":"他看着那只胶卷盒，苦笑着鞠了一躬。“失礼了，是我的。盖子上的‘I’是我写的。我只是想拿到一点证据，没想到命案先发生了。”"},{"clue":"c_gar2","breaks":"t_where","a":"石川望着那堆“敷岛”烟头，叹了口气。“这个牌子，租界里肯抽的人不多，我是一个。”他摊了摊手，“好吧，我在花园。请你相信，我只是旁观者。”"},{"clue":"c_hall3","a":"“白夫人替我签的名。”他微微欠身，露出尴尬的笑，“请别告诉太太。我没有恶意，只想进来看看，听听生意人怎么谈战事。”"},{"clue":"c_gar1","a":"他认出了那只铁桶，眼睛一亮。“就是这里。”他指着焚烧桶，“九点二十分，那个穿灰长衫的人，烧的就是这样的纸，一张一张撕着烧。”"}],"fallback":"请原谅，这件事我实在不清楚。"},{"id":"zhou","name":"周福","role":"顾家管家","age":62,"look":{"skin":"tan","hair":"short","hairColor":"white","glasses":"none","beard":"stubble","outfit":"vest","mood":"tired"},"bio":"在顾家当了三十年管家，手里一串钥匙。酒会上张罗茶水酒食，十点过后用钥匙打开书房门，是第一个看到尸体的人。","demeanor":"老派、絮叨，句句带“老爷”“东家”，一慌就把话绕回规矩上。","topics":[{"id":"t_role","q":"你在顾家管什么？","a":"管门户，管下人，管酒窖，管一串钥匙。东家的规矩是，书房锁着，除非他亲口吩咐，谁都不许进。老头子跟了他三十年，没出过半点差错。"},{"id":"t_ice","q":"20:30你送了什么？","lie":true,"a":"冰一桶，杯子一只，威士忌一瓶，只有老爷一人在书房。他嘱咐我别吵，我放下就出来了。","truth":"杯子是两只。大班哈考特先生也在里头。他递给我十块钱，叫我别说他来过书房。我这把老骨头，收了钱，就把嘴缝上了。"},{"id":"t_pantry","q":"21点到21点半你在哪？","lie":true,"a":"就在茶水间。添酒、收杯子、擦盘子，一步没走开。厨房的人都看见的，东家的规矩我不敢忘。","truth":"我溜去后弄堂赌了两手牌九。只一刻钟，九点过后出去，九点一刻多就回了。我怕东家知道，更怕太太知道。那天晚上的牌也没赢，输了八块钱。"},{"id":"t_back","q":"你在后楼梯遇到谁？","needs":["ask:zhou.t_pantry"],"a":"九点一刻多，我从后门回来，在后楼梯上撞见钱先生，他从楼上下来，一边走一边搓手，说烫着了手。我当时只当他又去灶间弄茶水，也没多嘴问。他走路急，鞋也没顾着擦。"},{"id":"t_order","q":"钱先生有吩咐吗？","needs":["ask:zhou.t_back"],"a":"九点三十分前后，钱先生把我叫到一边，说“老爷在排练致词，别惊动他，十点以后再说”。我就照办，一直守到十点。十点了东家还没出来，我才拿钥匙去开门。"},{"id":"t_door","q":"开门时是什么情形？","a":"十点过十分，门是锁着的，锁孔里没钥匙。我用自己的钥匙开了，推门进去，老爷躺在书桌后头，头上全是血。窗是虚掩的，窗闩抬着。我当时一下子腿就软了。"},{"id":"t_key","q":"你的钥匙借出去过吗？","a":"那串钥匙从不离身，连睡觉都挂在腰上。你们可以查：我这一把在东家出事时，仍在我身上。要说借，钱先生那一把，也是东家亲手给的。"},{"id":"t_lin","q":"林小姐中途离开过吗？","a":"那位弹琴的林小姐？九点以后我是看见她从楼梯上下来的，神色匆匆，手里还拿着本书。白姨太替她放了唱片。我只当年轻人坐不住，没往别处想。"}],"confronts":[{"clue":"c_kit2","breaks":"t_ice","a":"管家的手有点抖。“一桶冰，两只杯子，是我自己写的。”他叹了口气，“大班先生给了十块钱，我嘴上说一个人……是我糊涂。”"},{"clue":"c_kit3","breaks":"t_pantry","a":"老管家看着那副骰盅，脸一下红到耳根。“被你们翻出来了。”他搓着手，“我只出去一刻钟。可就是那一刻钟，我撞见了不该撞见的。”"},{"clue":"c_study4","a":"“三把钥匙。”管家点头，“东家那把在他口袋里，我这把在腰上，钱先生那把……他说锁在抽屉里。”他说完，自己也愣了一愣。"},{"clue":"c_kit1","a":"“毛巾……”管家想了想，“我在后楼梯撞见钱先生时，他身上就有这股檀香味。可他向来用檀香，我也没往心里去。”"}],"fallback":"老头子不懂这些，您问别人吧。"},{"id":"lin","name":"林素秋","role":"女学生·钢琴伴奏","age":19,"look":{"skin":"fair","hair":"bob","hairColor":"black","glasses":"none","beard":"none","outfit":"dress","acc":"bow","mood":"worried"},"bio":"圣玛丽女校的学生，经白露介绍到酒会弹钢琴伴奏。说自己整晚坐在钢琴前，只有账房先生请她停琴那一次离开过琴凳。","demeanor":"说话清脆急促，带点学生腔，紧张时咬嘴唇，爱说“其实”。","topics":[{"id":"t_role","q":"你怎么来弹琴的？","a":"白姨太太说酒会缺个弹琴的，我就来了，二十块酬劳。其实我家里在闸北，炮声响了以后，全家逃到法租界，我需要这笔钱。"},{"id":"t_piano","q":"21点到21点半你在哪？","lie":true,"a":"一直坐在琴凳上，没离开过。白姨太替我翻谱子，可是琴一直是我弹的，不信你问在座的客人。","truth":"九点零五分起我离开了二十分钟，是白姨太替我放的唱片。我上了三楼阁楼，把一本新的密码底本交给顾明远。九点二十五分回来。这是我们这个团体里的秘密，我宁可说谎，也不能害了同学。"},{"id":"t_ming","q":"你认识顾明远吗？","lie":true,"a":"不认识。今晚才第一次听说有这么个人。顾家的少爷怎么会和我这样的学生打交道，我们差得远了。","truth":"他是我同学，也是我们团体的负责人。我们靠发报把战事消息送到内地。我今晚借着弹琴进门，其实是为了送密码底本。请不要把他交出去。"},{"id":"t_stop","q":"钱先生要你做什么？","needs":["clue:c_hall1"],"a":"九点半前后，钱先生走到琴边，客气得很，说老爷要排练致词，请我九点三十八分起停琴七分钟，之前换慢板。我照办了，他还站在琴旁看着表。"},{"id":"t_clock","q":"停琴时你看到什么？","needs":["ask:lin.t_stop"],"a":"九点三十八分，我停手，客厅里一下子静下来。钱先生马上走到大班先生身边，两人往楼梯那边去了。七分钟里，我看见他们从楼上下来，大班先生脸色古怪，钱先生却很平静。"},{"id":"t_bible","q":"那本《圣经》是你的？","needs":["clue:c_att2"],"a":"是我的，我送给明远的。其实不是为了礼拜，是用《圣经》的章节行数做底本，换一套新的密码。每周换一次，免得被敌人破译。"},{"id":"t_guzhu","q":"你对顾先生印象如何？","a":"见过一面，很客气，说我弹得好。有钱人的客气总让人不踏实，我只想弹完琴，拿钱回家。"},{"id":"t_bai","q":"白姨太太人怎样？","a":"她是个可怜人，嘴上爱撒娇，心里很空。她替我放唱片，一点怨言也没有，还说“你们年轻人有你们的事”。"}],"confronts":[{"clue":"c_att1","breaks":"t_piano","a":"她咬着嘴唇，眼圈红了。“日志上有我的名字……是，九点零八分，我在阁楼。可我二十分钟就回来了，你们别抓明远。”"},{"clue":"c_att2","breaks":"t_ming","a":"她愣愣地看着扉页，忽然笑了一下。“我写的字，终究是骗不过人的。”她低头，“我认。”"},{"clue":"c_hall1","a":"“这是钱先生写的？”她盯着铅笔字，“我只知道我照他说的做了。他那天看起来特别平静，好像早就晓得七分钟之后会发生什么似的。”"},{"clue":"c_study1","a":"“唱机？”她眨了眨眼睛，声音忽然低下去，“难道说……那天夜里，有人让一个已经不在的人，在门里念了一遍稿子？”"}],"fallback":"我……我不太懂这个，请您问别人吧。"}],"solution":{"culprit":"qian","method":{"q":"凶手是怎样制造“九点四十一分顾鸿章还活着”的？","options":["凶手九点四十分趁无人时潜入书房，模仿死者的声音念稿。","凶手让死者自己在门里念稿，之后才从窗口翻入将其杀死。","提前杀人，把死者下午刻的致词试录盘放上唱机，用线香烧断红线定时放出声音。","凶手买通管家，由管家学顾的腔调在门内说话。"],"correct":2},"motive":{"q":"凶手为什么杀人？","options":["顾鸿章通日卖国，凶手为国锄奸。","顾鸿章侵吞洋行保证金逃港，并把亏空做成凶手经手、盖章的账，逼他画押背锅。","凶手想独吞顾家遗产。","顾鸿章发现了凶手的电台，凶手为灭口杀人。"],"correct":1},"keyClues":["c_study1","c_study2","c_acct1","c_acct2","c_hall1","c_gar1"],"truth":["凶手是账房钱仲平。他用一台留声机和一张刻录盘，把一个死人的声音，放进了所有人的耳朵里。","谍战只是迷雾：阁楼上的电台是顾明远与林素秋的救亡团体所设，石川谦在花园是偷拍与探听，哈考特暗查账目是为领事馆，白露的“密码本”是马票，太太翻楼上抽屉是为了找船票。它们都有事后能解释的真相，却都与命案无关。","真正的动机藏在账里：所谓“寄港K.M.”的款项，并不是通敌，而是顾鸿章把洋行保证金四十二万转入自己在香港开的“金茂行”。他周二要携白露逃走，早已把亏空做成钱仲平经手、盖钱章的账。当晚二十点五十五分，他逼钱画押认账。钱的四千八百元积蓄困在顾家的钱庄里，儿媳十月临盆，他一怒之下抄起铜镇纸，二十一点零五分前后将顾打死。太太在楼梯口听见的那一声闷响，就是此刻。","诡计：下午顾鸿章刻了“致词一”“致词二”两张试录盘，钱当时在场。杀人后，钱把“致词一”放上唱机，摇紧发条，用账房的红棉线拴住制动杆，线搭在一支点燃的粗檀香上，离香头约一寸半，粗香燃得慢，正好烧上半个钟头。香烧断线，制动放开，唱机约二十一点四十分开始出声。他二十一点十五分用自己的钥匙从外面反锁了门，抬起窗闩，让人以为有外人出入。","钱在后楼梯被管家撞见，说烫了手，在灶间冲手，又去花园的焚烧桶烧掉逼他画押的字据。二十一点三十分他请林素秋二十一点三十八分起停琴七分钟，二十一点三十九分又把大班哈考特带到书房门外。唱机里响起“我先静一静，稍后再出来同诸位道别”，一个洋大班成了他最好的证人。","破绽：唱机停在盘尾空槽、制动杆上有红色焦线、账房里有同样的线与线香；顾的尸体在十一点验时已僵硬，死亡远早于九点四十一分；节目单上有钱嘱咐停琴的铅笔字；焚烧桶里有带“钱”字印的字据残片；窗台灰尘完好，花园没有脚印，所谓外人行凶不攻自破。账簿一翻，真相明白：杀人的不是特务，而是被逼到墙角的老账房。"]}},{"id":"liaoyang","title":"台风夜查房","tagline":"台风封山，院长死在反锁的屋里，唯一的目击者是个“看见鬼”的病人","difficulty":4,"cover":"cover","tone":"green","brief":"一九八七年九月二十六日傍晚，你坐着吉普车爬上青崖山，来到松岚疗养院。十天前，院长顾清源给你写过一封信，只有一句要紧话：“药房账目似有蹊跷，不便行文，望一见。”他在门厅握了握你的手，说：“今晚风大，明早再谈。”可当夜台风封了山，山路塌方，摇把电话线也断了。零点五十五分，你被喊声惊醒：院长室的门从里面锁着，护工和副院长劈开门，顾清源伏在桌前，右臂上插着一支空注射器，已经没了呼吸。副院长说是吗啡过量，意外或自戕。可你揣着那封信，还有一个病人在走廊拦住你，低声说：“我昨夜看见了，没有脸的人，提着灯进了他的屋子。”警察最早天亮才到，你只有这一夜。","victim":{"name":"顾清源","desc":"松岚疗养院创办人兼院长，六十一岁，患晚期胰腺癌，每晚自行注射吗啡止痛。零点五十五分被发现伏在院长室书桌前，已无呼吸，右臂上斜插着空注射器，桌角散落三支空安瓿，门自内锁死。","look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"labcoat","acc":"stethoscope","mood":"tired"}},"publicFacts":["松岚疗养院是青崖山腰的私立疗养院，设三十四张床位；19:10 山路塌方，19:40 摇把电话线被风刮断，警方最早明晨抵达。","顾清源患晚期胰腺癌，只有副院长严仲谦、护士长薛玉芬和药剂师宋鹤龄知情，他每晚自行注射吗啡止痛。","院长室是弹簧门锁，门一拉上就锁，钥匙当晚放在桌面，窗内插销闩着；零点五十五分魏德贵与严仲谦劈门而入。","22:00 值夜护工魏德贵送开水时院长仍然活着，院长吩咐他零点半再送一壶；22:30 全院停电，此后只用马灯和手电。","严仲谦初验后认为是吗啡过量致呼吸抑制，倾向于意外或自戕；你的委托信里提到“药房账目蹊跷”。","长期住院的梁秋白声称昨夜见到“白衣无面人提灯进院长室”，但护理记录显示他21:30已服镇静药，医护都认为是旧病幻觉。"],"timeline":[{"t":"19:10","text":"山路塌方，疗养院被隔绝；19:40 电话线被风刮断。"},{"t":"21:10","text":"严仲谦与院长在院长室谈话约半小时，魏德贵在廊下听见有人提高嗓门。"},{"t":"22:00","text":"魏德贵给院长送开水，院长在世；院长吩咐零点半再送一壶。"},{"t":"22:30","text":"全院停电，各处改用马灯和手电。"},{"t":"22:45","text":"魏德贵巡廊一次（值班本记录）。"},{"t":"00:40","text":"魏德贵送水叩门无人应，赶去叫严仲谦。"},{"t":"00:55","text":"二人劈开院长室门，发现院长已死，右臂插着空注射器，桌上三支空安瓿。"},{"t":"01:10","text":"严仲谦初验：尸体尚温，下颌僵硬刚起，瞳孔针尖样缩小。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"study","name":"院长室","scene":"study","desc":"东头的院长办公室，书柜、铁皮保险柜和一张老式写字台，窗内插销闩着。台风把窗纸似的雨幕压在玻璃上，马灯的光在墙上发抖。","clues":[{"id":"c_s1","title":"右臂新针眼","text":"遗体伏在桌前，左袖挽到肘上，左臂内侧布满陈旧针眼与淤青，密得像缝过线；右袖也被卷起，右上臂外侧只有一个新鲜针眼，空注射器斜插其上。棉球盒里的棉球原样未动。"},{"id":"c_s2","title":"空安瓿与抽屉","text":"桌角摆着三支空安瓿，蓝字标签写“盐酸吗啡注射液 10mg”，瓶身批号印“8706”。拉开右手抽屉，里面还躺着两支同规格的未开封安瓿，批号印“8612”，旁边是一个煮针筒的铝盒。"},{"id":"c_s4","title":"台历与便条","text":"台历9月27日栏用红笔写着“晨八时 宋 带8612账册来”。台历下压着半张便条：“严 收洪 每月八十元 核实 勿声张”。字迹都是死者惯用的钢笔字。"},{"id":"c_s3","title":"弹簧锁与烟蒂","text":"门是老式弹簧锁，门内旋钮拧到“关”位，门一合就自动锁上，钥匙当时放在桌面。门外廊砖上有半干的水痕，右脚的痕迹较轻，还拖出一道；门框旁落着四个“大前门”烟蒂。"}]},{"id":"pharm","name":"药房","scene":"clinic","desc":"西侧的药房，玻璃药柜、天平和一排褐色药瓶，里间有铁皮麻醉柜。空气里一股来苏水混着薄荷脑的味道，侧门通向后院。","clues":[{"id":"c_p1","title":"麻醉柜清点","text":"里间铁皮麻醉柜上着两把锁，钥匙串在宋鹤龄腰间。柜内8706批吗啡整盒码放，标牌写“存50支”，实际清点只剩47支；柜角堆着8612批的空盒，盒盖都已拆开。"},{"id":"c_p2","title":"管制药品登记册","text":"布面登记册每页边缘盖着红色骑缝章。第38页纸色偏白偏新，页边半枚红章与前后页对不上；页末一行新写着“9月26日22:10 吗啡8706×3 顾清源 亲领 签”，墨色比上一页更黑。"},{"id":"c_p3","title":"厚底右布鞋","text":"药房门后靠着一根枣木手杖和一双布鞋，右脚那只鞋里垫了两层厚棉布，鞋跟外侧磨得很偏，前掌钉着一块菱形格纹的旧胶皮；旁边挂着一件白大褂和一只洗得发黄的口罩。"},{"id":"c_p4","title":"稿纸上的签名","text":"废纸篓里有十几张揉皱的稿纸，同一个“顾清源”签名反复写了几十遍，越到后面越像。纸边沾着蓝黑墨水，与登记册第38页上的墨色接近。"}]},{"id":"lab","name":"化验室","scene":"lab","desc":"后楼一间窄小的化验室，酒精灯、试管架和一台旧显微镜，墙上贴着“检验规程”。窗外就是后院，雨声很大。","clues":[{"id":"c_l1","title":"化验申请与结果","text":"化验申请单：9月22日，申请人顾清源，“检8612批吗啡注射液含量”。结果栏9月24日：“含量约为标示量十分之一，余为氯化钠反应”，检验人简若川。另附院长亲笔批示：“结果仅限你我知悉。”"},{"id":"c_l2","title":"化验记录本","text":"实验记录本9月26日14:30一栏：“8706批吗啡，含量合格，与标示相符。顾院长要求当面复核。”下面还有8612批两次复检的数字，与申请单上的结果一致。"},{"id":"c_l3","title":"窗台马灯","text":"窗台上放着一盏马灯，灯罩里的煤油烧去了大半，灯芯刚被剪过；试管架旁的记录纸上，有一行“22:40 复检第二法”的新铅笔字，墨迹未被雨气晕开。"}]},{"id":"records","name":"病历档案室","scene":"library","desc":"一楼拐角的档案室，铁皮病历柜一排排立着，值班桌上压着护理记录和值班本。屋里没有灯，只有手里的马灯照出一圈黄光。","clues":[{"id":"c_r1","title":"夜班护理记录单","text":"9月26日夜班护理记录单从21:00一直填到次日06:00，连02:00、04:00、06:00的体温脉搏栏都已写满，全是同一支蓝黑钢笔、同样圆润的笔迹，22:30栏写着“查房毕，各床安睡”。现在才凌晨一点多。"},{"id":"c_r4","title":"夜间值班本","text":"值班本是魏德贵的字，歪斜但清楚：“22:00 送开水，院长在。22:30 停电。22:45 巡廊，严副院长房有灯，里面有人说话，没敢敲。23:00 在发电机棚歇。00:20 醒。00:40 叩门无应。”"},{"id":"c_r3","title":"苏婉如病历夹","text":"病历柜第三层苏婉如的病历夹被抽走了，空槽里夹着院长亲笔的评估草稿：“病情稳定一年以上，拟十月办理出院”，下面压着洪建国的探视登记。"},{"id":"c_r2","title":"梁秋白病历","text":"梁秋白的病历夹：医嘱“氯丙嗪100mg 睡前”，用药栏每日“已服”；病程记录近两月多次写着“诉夜间见白衣无面人持灯于药房、走廊走动，查房未见，视为幻觉”。"}]},{"id":"ward","name":"梁秋白的病室","scene":"guestroom","desc":"男病区尽头的单人病室，窗户正对走廊另一头。一张铁床、一只木箱、一摞包着牛皮纸的书，收拾得比别处都整齐。","clues":[{"id":"c_w1","title":"梁的夜间笔记","text":"蓝皮练习本每行先写时间：“22:00 院长室灯亮，老魏送水，片刻即出，其后廊下无人往来。22:20 白衣人，蒙口罩，左手提马灯，右脚拖着走，自药房那头来，入院长室，未敲门。22:30 停电。22:45 老魏提灯巡廊，过院长室门前不停。22:52 白衣人出，门‘咔’一声自合，仍提灯向药房去。22:54 另有一人自客房那头来，立门前敲门、点烟，至23:15 方去。23:40 走廊尽头窗外，后院方向有火光。”"},{"id":"c_w2","title":"缸底的药片","text":"床头搪瓷缸底压着三片半化的白色糖衣片，缸沿上有指甲划出的细痕；床垫下还有几片用手帕包好的药。"},{"id":"c_w3","title":"怀表与窗","text":"窗台上放着一块铜壳怀表，走时与大厅座钟只差一分钟。从他床边向外，透过玻璃正对着走廊尽头院长室的门，中间没有遮挡。"}]},{"id":"yard","name":"后院","scene":"garden","desc":"药房侧门外的后院：焚化炉、发电机棚和一架被风吹倒的葡萄藤。雨在泥地上砸出一个个小坑，棚檐下还挂着一盏熄了的马灯。","clues":[{"id":"c_y1","title":"焚化炉残页","text":"焚化炉的灰里挑出一角没烧透的纸，带着半枚红色骑缝章，可辨页码“38”和几行残字：“……破损2支 ……破损3支 ……破损2支”，每行末尾都有“薛玉芬 核”，墨色完全一致。"},{"id":"c_y2","title":"棚边酒瓶与脚印","text":"发电机棚的草席旁倒着一只空酒瓶，瓶身有“地瓜烧”字样，手摇发电机的手柄上有水渍。棚与药房侧门之间的泥地上有一串往返焚化炉的脚印：左脚印清楚，右脚印浅，前掌带菱形格纹，脚尖后面拖出一道浅沟，沟里积着半窝雨水。"},{"id":"c_y3","title":"药房侧门","text":"药房侧门通向后院，门闩刚上过油，门槛内侧的地砖上落着几点黑色纸灰，旁边有一小片擦得半干的泥印。"}]}],"suspects":[{"id":"yan","name":"严仲谦","role":"副院长","age":55,"look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"none","outfit":"suit","acc":"pocketwatch","mood":"stern"},"bio":"松岚疗养院副院长兼内科主任，跟了顾清源十二年。当晚是他与魏德贵合力破的门，并做了初步勘验，认为是吗啡过量。自称晚饭后回房休息。","demeanor":"官腔，爱说“按规定”，被问急了就拿资历压人","topics":[{"id":"t_bio","q":"您负责院里什么？","a":"临床和管理，院长不在，我就是当家人。十二年，我没有一天误过查房。你一个外来的同志，问话之前先摆正位置，我配合是出于纪律，不是出于客气。"},{"id":"t_judge","q":"您怎么看死因？","a":"吗啡过量，呼吸抑制，教科书上的症状我看得清清楚楚。院长癌痛多年，夜里手抖，多扎一支少扎一支都可能。意外也好，想结束痛苦也好，院里的体面要紧，结论我已经下了，明早警察来我自会交代。"},{"id":"t_cancer","q":"院长的病有谁知道？","a":"知情的只有三个人：我，薛护士长，药房的宋药师。他自己要求保密，怕床位上的病人和家属慌。这事我从没对外说过，你问别人也问不出来。"},{"id":"t_where","q":"21:40 以后你在哪？","lie":true,"a":"谈完话我回房间看了会儿文件，然后睡了，一直到老魏来砸门。台风夜里屋里就我一个人，没有谁能给我作证，可这不等于我撒谎。","truth":"我没睡。我和薛玉芬在我房里，从十点到十一点过一刻。我们……处了两年了，这事要是传开，她护士长当不成，我的位置也保不住。我不该瞒你，但这跟院长的死没有关系。"},{"id":"t_quarrel","q":"你们晚饭后吵了什么？","lie":true,"a":"谁说我吵了？例行汇报。下季度的预算、床位、药品采购，老顾脾气硬，嗓门大了点，这在我们之间不算事。","truth":"他拿着一张便条质问我收了家属的钱。他说今天路一通，明天他就写书面材料交县卫生局，要我退赃、写检查、自己辞职。我嚷了几句，扭头就走。那是气话，我杀他图什么，他快死了。"},{"id":"t_money","q":"那便条上的钱是怎么回事？","needs":["clue:c_s4"],"a":"洪建国每月八十，托我把他老婆多留一阵子。我收了，一共收了十一个月。你要记就记吧，这是我的错，但人是病人，照样治，没亏待她。院长要我退赃，我答应了，没想到还没退他就……"},{"id":"t_succ","q":"院长之后谁接班？","a":"县卫生局的意思是外派，我这辈子也就到副字头了。有人说我盼着他死，笑话，他活着，我至少还有副院长这块牌子，他一死，天知道上头派来个什么人。"},{"id":"t_ghost","q":"梁秋白看到的白影呢？","a":"妄想，病程记录写得明明白白，近两月反复。护理单上他21:30就吃了氯丙嗪，一百毫克，睡得比我还死。你要是拿一个病人的话来办案，我只能说，你不懂这一行。"}],"confronts":[{"clue":"c_r4","breaks":"t_where","a":"……老魏这个本子，谁准他记这种东西的。好，你既然翻到了，我就不抵赖：那晚我不是一个人。其余的，按规定，我只对你一个人说，对警察我也是这个口径。"},{"clue":"c_s4","breaks":"t_quarrel","a":"这半张条子……他什么时候写的！好，我不绕了。八十块，是我的把柄，也是我的耻辱。可你替我想想，我若要杀他，何必挑台风夜，挑这么个满院都是人的晚上？这不合常理，同志。"},{"clue":"c_r1","a":"这是护士长的事，我不管。不过一张写到早上六点的记录，连我都看出不对来了。明早我会处理，轮不到你来教我怎么管人。"},{"clue":"c_s2","a":"8706，8612……我只验了死因，没去看批号。哪一批能要人命，哪一批不能？这是药房的账，你问宋药师，别问我。"},{"clue":"c_s1","a":"右臂？他的习惯，我不如护士长清楚。可癌痛的人，疼起来哪还顾得上哪只手？这一点，不足以推翻我的结论。"}],"fallback":"这与你要查的事有什么关系？按规定，我只回答与案情有关的问题。"},{"id":"xue","name":"薛玉芬","role":"护士长","age":49,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"uniform","acc":"badge","mood":"tired"},"bio":"松岚疗养院护士长，守着三十四张床十七年，当晚与魏德贵共同值夜。自称一直在病区查房，22:30 后点着马灯逐床看过。","demeanor":"短句利落，开口先说“按章办事”，心虚时语速变快","topics":[{"id":"t_bio","q":"您在院里做什么？","a":"护士长，也是半个管家。三十四个人的药、饭、被褥，都归我。院长信我，我也没让他失望过，十七年，一次差错也没有。"},{"id":"t_round","q":"昨夜 22:30 查房了吗？","lie":true,"a":"查了。我点着马灯，一间一间看过去，各床安睡，才写的“查房毕”。记录单就是我的凭据，你可以看。","truth":"我没查，那单子……是我傍晚交班前就填好的。台风夜人手少，我想着省点事，把整夜的栏都先写了。22:00以后我和严副院长在他房里，直到十一点过一刻才回病区。我对不起那些病人，可我没害院长。"},{"id":"t_pill","q":"梁秋白的药你看他咽了？","lie":true,"needs":["clue:c_r1"],"a":"我亲手递的杯子，亲眼看他咽下去的。氯丙嗪一百毫克，他吃了就睡，从来如此，所以他半夜看见什么，一定是药没压住病。","truth":"我递了杯子就转身去忙别的，没盯着他咽。单子上的“已服”，是我提前写的。梁先生从不闹，我就信了纸。他要是把药吐了，那夜里看见的东西就不一定是病了。"},{"id":"t_sign","q":"药房的破损登记你签过？","lie":true,"needs":["clue:c_y1"],"a":"每月月底我亲自去药房点破损的空安瓿，一支一支对数，核对无误才签字。我是护士长，这点规矩比命重要。","truth":"宋药师说空安瓿太多、站着点腿疼，让我签个字就行，他事后会补数。我信他，一签就是四个月，有时一次签好几页。我不知道那是把我当遮羞布。"},{"id":"t_vic","q":"院长平时怎么打针？","needs":["clue:c_s1"],"a":"他右手抖，只能用右手握针筒，扎左臂，十年没变过。我给他配过棉球，他从不碰右臂，说那只胳膊要留着写字。这几个月左臂扎得没处下针，他疼，可也不肯换边。"},{"id":"t_song","q":"你怎么看宋药师？","a":"勤勉、守时、手脚细，药房的账从没出过岔子。他七六年修房梁摔断过右腿，阴雨天走路右脚拖着，老人家都习惯了。院长的药都是他亲手发，我也只有信他的份。"},{"id":"t_ghost","q":"你信梁说的白影吗？","a":"不信，也不是不信。我在这儿十七年，梁先生六年，他一向条理清楚，只在夜里偶尔胡言。这回我不好说，记录是那样写的，可我现在知道那记录……不好当凭据。"},{"id":"t_truth","q":"22:00 以后你人在哪？","needs":["clue:c_r1"],"a":"两年了，院里没人知道。他离了婚，我守寡，可这种事传出去，我就别想当护士长了。昨夜十点到十一点过一刻，我们在他房里，谁也没出去过，老魏巡廊从门口过，我听见了脚步。"}],"confronts":[{"clue":"c_r1","breaks":"t_round","a":"……是我写的。写到早上六点，是我写的。别用那种眼神看我，我认错。可单子废了，你问严副院长，我们那一个多钟头到底在哪儿。"},{"clue":"c_w2","breaks":"t_pill","a":"药在缸底……他一直在藏。那我写的“已服”，就全是白纸黑字的谎。我真该死。要是我盯着看那一眼，他的话也不至于被当成疯话。"},{"clue":"c_y1","breaks":"t_sign","a":"这是我的名字。同一天，同一支笔，我认得出。四个月的“核”，原来烧起来是这么个样子。宋药师，你拿我的字去干了什么？"},{"clue":"c_r4","a":"老魏巡到严副院长房门口，我听见了。他没敢敲，是个体面人。倒是他后来躲进棚里喝酒，我心里知道，也没说破。"}],"fallback":"这个我说不清楚，按章办事，我只认记录。"},{"id":"liang","name":"梁秋白","role":"长期住院病人","age":59,"look":{"skin":"light","hair":"short","hairColor":"white","glasses":"round","beard":"none","outfit":"vest","acc":"pocketwatch","mood":"smile"},"bio":"退休中学历史教师，因反复发作的抑郁住进松岚六年，正在写一部《松岚六年》。自称昨夜看见一个“白衣无面人”提灯进了院长室，护理记录却说他早已服药入睡。","demeanor":"文雅克制，有教师的条理，被当病人时语气温和而带锋","topics":[{"id":"t_bio","q":"您是怎样的人？","a":"教了三十一年历史。这里的人都当我是病人，我也承认自己是病人，可病人不等于不会看、不会记。我每晚记笔记，是教书留下的习惯，一件事发生的时刻，我比多数人更在意。"},{"id":"t_saw","q":"昨夜你看见了什么？","a":"二十二点二十分，一个穿白衣的人提灯进了院长室。他蒙着口罩，没有脸，左手提灯，右脚拖着走。二十二点五十二分，他出来，门咔的一声自己合上。这些都在我的本子里，你可以去拿。我知道这听起来像什么，可我只是说我看见的。"},{"id":"t_pill","q":"药你吃了吗？","lie":true,"a":"吃了。护士看着我咽的，我从不违抗医嘱，夜里睡得很沉。你不要因为这个怀疑我，我可以现在张嘴给你看。","truth":"我没吃。氯丙嗪让我昏沉，写不出东西，我就含在舌下，等护士走了吐进搪瓷缸，压在缸底。这是我六年里的小抵抗，我不是怕药，是怕被药变成另一个人。这事和院长无关，只是我想要自己的脑子。"},{"id":"t_clock","q":"你怎么知道时间？","a":"怀表。我当年教书起，就习惯和大厅的座钟对表，每天二十一点校一次。差一分钟，不会更多。我用它记所有的事，包括你现在问我的这个。"},{"id":"t_past","q":"你以前也见过他吗？","a":"见过。八月以来，我记了六回：夜里一两点，同样的白影从药房侧门出来，往后院走一趟又回去。他们都说我是幻觉，可幻觉不会每回都走同一条路，也不会拖着同一只脚。"},{"id":"t_face","q":"那人是男是女？","needs":["ask:liang.t_saw"],"a":"男。个子中等，偏瘦，肩膀有点往右塌。脸被口罩和马灯照出的暗影遮住，我说不出是谁。我只能说，他走路的时候，右脚比左脚晚落地半拍。"},{"id":"t_record","q":"护士长的记录呢？","needs":["clue:c_r1"],"a":"那单子我听说过，是不是连明天早上的体温都写好了？十七年，薛护士长先写后做，我见过她站在走廊里对着墙补记，不过我不怪她，人少，活多。可如果我的“已服”也是先写的，你就该知道我话里能信几分了。"},{"id":"t_dignity","q":"被当成疯子是什么感觉？","a":"一开始愤怒，后来是疲倦。人们说话的时候不看你的眼睛，只看你的病历。我只希望你，这位外来的先生，这一次，先看我的本子，再看我的病历。"}],"confronts":[{"clue":"c_w2","breaks":"t_pill","a":"……被你翻出来了。不错，我没吃。你不必替我瞒着护士长，也不必替我辩解。这几片药是我的证词，不是我的罪。"},{"clue":"c_w1","a":"这是我的笔记，一字不改。你读到“右脚拖着”了吗？我只写所见，从不下判断。判断是你的事。"},{"clue":"c_r2","a":"“视为幻觉”，是他们写的。幻觉能记下时间、方向和步法吗？但我不怪他们，人总习惯用现成的词，把看不懂的事关起来。"},{"clue":"c_r1","a":"连早上六点的体温都写了，我就知道我的“已服”也白搭了。你要信的话，信我的怀表吧，它从不先写。"}],"fallback":"这个我没看见，也不想编。我只说我写进本子里的事。"},{"id":"su","name":"苏婉如","role":"住院病人","age":38,"look":{"skin":"fair","hair":"bob","hairColor":"black","glasses":"none","beard":"none","outfit":"robe","mood":"sad"},"bio":"原纺织厂会计，因精神分裂症稳定期住院四年，院长曾答应她今年秋天出院。昨晚打了安神针后睡下，自称只记得天亮。","demeanor":"说话轻，爱停顿，爱用数字；记忆断片时先道歉","topics":[{"id":"t_bio","q":"您原来做什么的？","a":"纺织三厂，管财务科的账，十年，从不出错。我现在每天在这里数东西：几张床，几个窗，几口人。数字是不会骗人的，对不起，我说得有点多。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"我睡了。九点简医生给我打了针，之后什么都不记得，一觉到天亮。对不起，我真的不记得别的。","truth":"我不是一直睡。大概十一点以后我醒了，口渴，摸黑去水房，路上看见药房亮着灯。后来我又去了档案室，我想拿回自己的病历，因为我想知道他们到底给我写了什么。我怕被发现乱走，要加药，所以不敢说。"},{"id":"t_gap","q":"你的记忆是怎么回事？","a":"那针打完，脑子就像被擦过的黑板，一块一块空着。我分不清是病，还是药。简医生很年轻，他后来也跟我道歉，说记不清是不是打了两遍。对不起，我不想怪他。"},{"id":"t_keep","q":"你想出院吗？","a":"想。院长答应过，今年秋天。我丈夫来看我，说家里没人照顾，让我再等等，他说话的时候不看我，我就知道了，这个人，不想我回去。"},{"id":"t_hong","q":"你丈夫昨天的样子？","a":"他下午就到了，说是路上耽搁。晚上他睡客房，我睡病房，隔着一条走廊。他带了橘子，剥了一个又一个，剥完又装回去，像是把心思也装回去了。"},{"id":"t_water","q":"你夜里走动时看见了什么？","needs":["clue:c_r3"],"a":"我口渴去水房，途中药房里亮着灯，我从门缝瞥了一眼。是宋药师，戴着口罩，伏在桌上写字。我在厂里干过十年，那姿势我认得，他是在抄账。我正要走，他抬头看见我，让我回去睡，说我什么都没看见。"},{"id":"t_ledger","q":"你怎么知道是抄账？","needs":["ask:su.t_water"],"a":"他左手压着一页旧账，右手用尺子压着新纸，一行一行地照着写，写一行吹一口气，等墨干。这是造账的法子，我看过不少人做假账。那时候钟刚打完十一下不久，我记得钟声，别的我记不全，对不起。"},{"id":"t_ghost","q":"梁先生说的白影？","a":"梁先生从不撒谎，只是话说得太细，细得没人耐烦听。我信他。因为我自己也知道，被人当成没有记性的人，是什么滋味。"}],"confronts":[{"clue":"c_r3","breaks":"t_where","a":"那是我的病历夹……我没偷，我只是想拿回来看。他们写的东西，我连看的资格都没有吗？好，我说，我昨晚不是一直在睡。"},{"clue":"c_p2","a":"这页的红章，边缘对不上。会计看一眼就知道，这一页是后来补的。这种做法我们厂里叫“抽换页”，一旦动了，就说明原来的页有不能给人看的东西。"},{"clue":"c_p4","a":"这是练字……不，是练别人的签名。越写越像，说明他要用。我在厂里见过，这是造假的第一步。对不起，我是不是说得太专业了？"},{"clue":"c_w1","a":"梁先生写得这样细，时间、方向、脚步都有，他一定没有说谎。我们这里的人，字写得越小，越是怕被人看轻。"}],"fallback":"对不起，这个我真的不记得，说不清。"},{"id":"hong","name":"洪建国","role":"病人家属","age":41,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","mood":"sly"},"bio":"苏婉如的丈夫，机修厂钳工。昨天下午探视，因山路塌方被困在院里，住在客房。自称晚饭后回客房睡觉，没见过院长。","demeanor":"粗嗓门，爱套近乎，急了拍桌子，一口车间腔","topics":[{"id":"t_bio","q":"你是干什么的？","a":"钳工，干了二十年，厂里的活儿我闭着眼都能干。咱是粗人，不会拐弯抹角，该说就说。我老婆在这儿住了四年，每月的费用我一分没少交，你问问院里。"},{"id":"t_visit","q":"你为什么来探视？","a":"一个月一回，这个月赶上台风。我带了橘子。她那脾气，隔着玻璃都吵，我也不想吵，就是想她安安稳稳在这儿，别折腾。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"客房，晚饭后就躺下了。外头风太大，我睡得不踏实，听见老魏砸门才爬起来。我连院长长啥样都没打过照面，你别往我身上扯。","truth":"我不在客房。快十一点的时候，我去了院长室门口，想最后求他一回，别让我老婆出院。我敲了好几次门，没人应，就在门口抽了四根烟，等到十一点一刻才走。我怕说出来你们觉得我是凶手，所以才瞒。"},{"id":"t_money","q":"你给过严副院长什么吗？","lie":true,"needs":["clue:c_s4"],"a":"没有，没有。我一个工人，一个月才挣几十块，哪来的钱孝敬领导？你别听人胡说八道，我跟严副院长连话都说不上几句。","truth":"每月八十，我给过，十一个月了。我厂里有个女工，跟我好了两年，我老婆一出院，这事就藏不住。我把钱塞给严副院长，求他多留她一阵。我不是个好人，可我真没动过院长一根指头。"},{"id":"t_wife","q":"你怎么对待你老婆？","a":"她是我孩子的娘，我不想她遭罪，也不想她回去遭罪。你们这些做官的、做学问的不会懂，一个家，我一个月六十来块工资，哪来那么多心力？她在这儿吃得饱穿得暖，我挺放心。"},{"id":"t_door","q":"你在门口都听到什么？","needs":["clue:c_w1"],"a":"里头没动静，只有一阵粗重的呼吸，呼噜呼噜的，我当他睡着了。门底下透出灯光，我敲了三回，没人开门。我就想着等他醒，一根接一根地抽，抽到十一点一刻才走。"},{"id":"t_heard","q":"你来的路上遇见谁？","needs":["ask:hong.t_door"],"a":"我是从客房那头过来的，拐进走廊，就见院长室门口那头有个白衣的影子，提着灯背对我往药房那头走，走得一拐一拐的，右脚拖地。我以为是哪个医生，没在意。事后想想，当时离我少说三四十步。"},{"id":"t_ghost","q":"听说院里闹鬼？","a":"我不信那些。不过住这里的人都爱说“白衣的”。我看他们是被药给灌的。你要问我，我信的是人，不是鬼。"}],"confronts":[{"clue":"c_s3","breaks":"t_where","a":"那四个烟蒂……是我的，大前门，我就抽这个。行，你逮着了！我是去过，可我就站在门口敲门，屁都没干！"},{"clue":"c_s4","breaks":"t_money","a":"这便条……他们连这个都记上了！行，我认。八十块，每个月。我一个钳工，一个月才六十几，剩下的是我借的。你可别让我老婆知道！"},{"clue":"c_r3","a":"拟十月出院！这就是我最怕的事。我没杀人，但我心里确实盼过他别这么痛快。我知道我不是东西。"},{"clue":"c_p3","a":"这鞋我认得，是宋药师的。他走路就这样，一高一低，院里谁没见过？你拿这个问我干什么，我可没碰过他的东西。"},{"clue":"c_w1","breaks":"t_where","a":"梁老师那本子，连我抽烟都记了？……行，那我不赖。我就是去求院长的，敲了门没人应，我也不敢硬闯。"}],"fallback":"这个我不懂，别问我，我就是个钳工。"},{"id":"wei","name":"魏德贵","role":"值夜护工","age":56,"look":{"skin":"brown","hair":"cap","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"jacket","mood":"tired"},"bio":"松岚疗养院的老护工，管开水、扫地和后院的手摇发电机，在院里干了十四年。昨夜22:00 给院长送过开水，00:40 又去叩门，是第一个发现不对的人。","demeanor":"老实巴交，拖长音，爱说“咱们院里”，一紧张就搓手","topics":[{"id":"t_bio","q":"您在院里干什么？","a":"烧水、扫地、推车、摇发电机，咱们院里的粗活都归我。十四年了，院长待我不薄，逢年过节还给我留半斤酒票。他这一走，咱们院里怕是要散了。"},{"id":"t_water","q":"22:00 院长什么样？","a":"好好的，就是脸白，说话喘。他拉开抽屉看了看里头那两支小玻璃管，又推了回去，煮了针筒，吩咐我：今晚疼得厉害，别让人来吵，零点半再送一壶开水来。我应了，就出来了。"},{"id":"t_where","q":"你整夜在哪里？","lie":true,"a":"我哪儿也没去，整夜来回巡廊，开水房、病区、前后院，一遍遍地走。咱们院里台风夜，谁敢睡？零点二十我还在走，这才想起送水。","truth":"二十二点四十五巡了一趟，之后我就坐不住了，躲进发电机棚喝了半瓶地瓜烧，一醉就睡到零点二十。我这毛病院长知道，每回都骂我，也都护着我。我不敢跟人说，怕被辞，可我没害他。"},{"id":"t_find","q":"你怎么发现的？","a":"零点四十我端着水去叩门，叩了好几回没人应。我慌了，去叫严副院长。我俩拿斧头劈开的门，钥匙就放在桌上，门是锁着的，窗也闩着。院长趴在桌上，手还是温的。"},{"id":"t_song","q":"宋药师这个人？","a":"老实人，肯干，从不跟人红脸。就是腿，七六年摔的，阴雨天右脚拖着，走几步就要歇。他夜里常守着药房，我常给他送茶。"},{"id":"t_fire","q":"后院有什么动静？","needs":["clue:c_y2"],"a":"半睡半醒的时候，我看见焚化炉那边有火光，红红的一团，旁边有个人影，好像在往里添东西。我当是做梦，翻个身又睡了。说出来你们也不信，我是醉汉。"},{"id":"t_ghost","q":"院里闹鬼的说法？","a":"梁先生说的“白衣人”，咱们院里的老人都听过，夜里一两点，药房那边有灯，有时也在走廊。我不敢说有鬼，也不敢说没有。不过那不像鬼，鬼哪用提灯呢。"},{"id":"t_doc","q":"院长最近怎么了？","a":"近来他疼得厉害，半夜常叫我去煮针。有一回他看着一支小玻璃管，念叨：“怎么越打越疼……”我不懂，就没吭声。"}],"confronts":[{"clue":"c_y2","breaks":"t_where","a":"那瓶酒……是我的。唉，我说实话，咱们院里的事，我是喝多了睡过去的，不是在巡廊。你可别告诉护士长，她要是知道，非撵我走不可。"},{"clue":"c_r4","breaks":"t_where","a":"这是我写的，字不好看，一笔一画可都是真的。“23:00 在发电机棚歇”……唉，白纸黑字，我赖不掉。我是醉了睡的，不是在巡廊。"},{"clue":"c_s3","a":"门口这些烟蒂，我二十二点四十五巡廊时还没有。大前门是客房那位洪师傅抽的，我闻得出这个味儿。"},{"clue":"c_p3","a":"这是宋药师的鞋，我认得，右脚垫了两层。他这条腿，一到阴雨天就疼，走路一拖一拖，咱们院里人都知道。"}],"fallback":"这个我不懂，咱们院里的事我只知道大概。"},{"id":"jian","name":"简若川","role":"实习医生","age":24,"look":{"skin":"fair","hair":"messy","hairColor":"black","glasses":"rect","beard":"none","outfit":"labcoat","acc":"stethoscope","mood":"worried"},"bio":"省医学院毕业的实习医生，九月二十日才来松岚报到，被安排在内科和化验室帮忙。自称昨夜在宿舍睡觉，之后听到喊声才起来。","demeanor":"年轻，语速快，爱先道歉，紧张时背医学名词","topics":[{"id":"t_bio","q":"你来院里多久了？","a":"才六天，对不起，我还在适应。我在医学院学的是内科，这边院长让我兼着化验，说人手缺。我手脚还不熟，希望没给你添乱。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"宿舍，九点半后就没出去过，躺下听着风声，一直到喊声。我真的没出门，护士长可以作证……呃，她可能也不在。总之，我在宿舍。","truth":"我在化验室，一直到二十三点二十。我心里不踏实，想用第二种方法再验一遍那批药，所以点着马灯做到那个钟点。我怕被人知道我违令，才瞒了。回宿舍的路上我谁也没见着。"},{"id":"t_test","q":"你替院长做过化验吗？","lie":true,"needs":["clue:c_l1"],"a":"没有。就是照流程做常规检验，血常规、尿常规、肝功，没有谁交代我什么特别的。你要问我，我什么都说，可真的没有。","truth":"有。九月二十二号，院长交给我一支8612批吗啡，让我悄悄检含量，说不许对任何人讲，连严副院长都不行。结果出来只有标示量的十分之一，我吓坏了，院长让我闭嘴，我就一直闭嘴。"},{"id":"t_day","q":"昨天院长有什么异常？","needs":["clue:c_l2"],"a":"下午两点半，他让我复核新到的8706批，结果合格。他看着结果说，这批是真的。他还说，明早八点，有些人就得老实了。我当时没懂，现在想起来，后背发凉。"},{"id":"t_dose","q":"苏婉如的针是怎么打的？","needs":["ask:su.t_gap"],"a":"九点我按单子给她肌注了氯丙嗪二十五毫克，后来想起来，单子上已经写好“已注”，我怕漏了，又补了一针。等于打了两针，对不起，我吓得没敢说。她今天要是记不清事，是我的错。氯丙嗪两针五十毫克，不至于出大事，可也够她晕一晚上。"},{"id":"t_song","q":"宋药师对你如何？","a":"客气，常给我倒茶。有天他半开玩笑问我，新来的医生是不是要给院里查账。我说我哪有那本事，他笑笑没说话。我现在回想，他问的时候，手一直在转钥匙。"},{"id":"t_ghost","q":"你信有白影吗？","a":"我信数据，不信鬼。可梁先生的记录，时间、方位都那么一致，我很难说那只是幻觉。这几天我越看越觉得，他不一定在说胡话。"},{"id":"t_fear","q":"你怕什么？","a":"怕被牵扯。我刚来六天，又碰上院长的死，又知道不该知道的事。我是个新人，说话没分量，一旦被怀疑，没人替我辩。"}],"confronts":[{"clue":"c_l1","breaks":"t_test","a":"这是……我的字。那个，院长让我保密，我就一直保着。您要是早一点来就好了，我一个实习生，真的不知道该跟谁说。"},{"clue":"c_l3","breaks":"t_where","a":"那盏灯，还有那行字，是我留的。我撒了谎，我没在宿舍，我在做第二法复检。怕一个新人被扯进这种事，就……我知道这样不对。"},{"clue":"c_r1","a":"这单子……我是照着上面的顺序打的针。如果上面的记录是预先写的，那我到底是在治病，还是在照着一张假单子行事？"},{"clue":"c_l2","a":"8706我验过，含量合格，我敢拿行医资格担保。药没问题，真的，问题在别的批号上，这个我只能说到这儿了，再多我怕说错。"}],"fallback":"对不起，这个我真的不清楚，可以问问别人吗？"},{"id":"song","name":"宋鹤龄","role":"药剂师","age":52,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"rect","beard":"none","outfit":"labcoat","acc":"badge","mood":"tired"},"bio":"松岚疗养院药剂师，十五年来管着药房和管制药品柜，院里的药都经他的手。七六年摔伤右腿，阴雨天走路拖脚。自称昨夜在药房月末盘点。","demeanor":"客气周到，说话慢，爱用“您”，被逼急了先叹气","topics":[{"id":"t_bio","q":"药房的工作是怎样的？","a":"收药、点药、发药、记账。管制药品要双锁双账，一支一支对。十五年没出过差错，不是我夸口，院长那样挑剔的人，也挑不出我的毛病。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"药房。月底盘点，从九点多起一直做到零点四十，听见喊声才出来。台风夜我腿疼，哪儿也没去，您要信，翻我的登记册就是。","truth":"我去了院长室。二十二点二十到五十二，我与他谈了近半个钟头。我不敢承认，是怕您听了就认定是我。这一点我瞒了您，对不起。"},{"id":"t_ledger","q":"管制药品登记册可靠吗？","lie":true,"a":"每笔当场记，当场签，一笔不错。昨晚22:10，院长亲自来药房领了三支8706，我发的药，他签的字，您去翻第38页，白纸黑字。他想自己打，我劝不住。","truth":"那页是我后来补的。原页上有些不能让人看的记录，我烧了，另抄一页，把“院长自领”添进去，想让三支空安瓿有个来路。"},{"id":"t_key","q":"8706的柜钥匙谁有？","needs":["clue:c_p1"],"a":"麻醉柜两把锁，一把我带着，一把也在我手里，备用的封在院长保险柜里，封条是严副院长盖的章，完好无损。所以这柜子，除了我，谁也开不了。"},{"id":"t_stock","q":"药品账物相符吗？","lie":true,"a":"相符，一支不差。有破损，每月二三支，都有护士长核对签字。药房的账，是我一生的脸面。","truth":"不相符。我从八三年起把8612批的吗啡冲成盐水，真药拿去换了钱，给儿子治肾病。破损是我编的，薛护士长签的字也是我拿空白页骗的。账是假的，我这一辈子，就是这几页纸。"},{"id":"t_ghost","q":"你怎么看梁的白影？","a":"梁先生是个体面人，我很同情，他的病程记录写得明白，是药物和病情，不能当真。他夜里睡不稳，看谁都是白的。院里人的白大褂，哪一件不是白的？"},{"id":"t_visit2","q":"你去院长室做什么？","needs":["clue:c_w1"],"lie":true,"a":"梁先生的本子，您大概已经看过了，我也不再瞒：我是去过。我只想劝劝他，他最近疑心我，我去解释。没带药，也没碰他的针。我走时他自己在抽屉里备针，用的是他平日那批8612，好端端的。我离开时是二十二点五十二，门一合就锁了，我也没想到。","truth":"我没劝他。下午他只叫我明早八点带8612的账册去，没说为什么，可我心里明白。夜里我提着新批的8706，说是给他止痛，他疼得厉害，又知道这批验过是真药，就让我进了门。我说他手抖，我替他推。……我替他打了那针。"},{"id":"t_conf","q":"那针是你打的？","needs":["ask:song.t_visit2","clue:c_s1","clue:c_s2"],"a":"是我。我说他手抖，新批劲大，我替他推。他信了我十五年。我从自己的柜里取了三支真药，推进他右臂，看着他一点点睡下去。然后拉门，门咔一声锁上。我回药房，重抄了第38页，烧了原页。我儿子的病，我这辈子也还不清。"}],"confronts":[{"clue":"c_w1","breaks":"t_where","crack":true,"a":"……唉。梁先生的本子，您读得仔细。是我，我去过。右脚拖着走，您大概也看出来了。我这一晚上最怕的，就是有人把“疯话”当了真。"},{"clue":"c_p2","breaks":"t_ledger","crack":true,"a":"这半枚章……您连这个都看出来了。字我抄得再像，章也盖不回去。……唉，好，您问吧，您要什么，我给您什么。"},{"clue":"c_y1","breaks":"t_ledger","a":"这一角……没烧透。我烧得太急，雨又大，炉子不旺。第38页原样是什么样，您现在大概也猜得出。"},{"clue":"c_l1","breaks":"t_stock","a":"一比十……他竟然真的验了。我早该想到，他那个人，从不空口说话。账是假的，药也是假的，我认。"},{"clue":"c_s1","breaks":"t_visit2","crack":true,"a":"右臂……他从不扎右臂，这我是知道的。当时只想着快，竟忘了。您说得对，没有人会给自己扎错手臂。"},{"clue":"c_s2","breaks":"t_visit2","a":"三支空的是8706，抽屉里原封的是8612，我无话可说。他一支也没碰过自己的药，真药是我带去的。"},{"clue":"c_y2","breaks":"t_where","a":"后院的泥……唉，雨这么大，竟也冲不干净。右脚拖出来的沟，我自己最清楚。我说“哪儿也没去”，是我不老实了。"},{"clue":"c_p3","a":"这是我的鞋，院里谁不知道？我腿不好，天天拖着走。可您要拿一双鞋就定我的罪，未免也太轻率了。"},{"clue":"c_p1","a":"四十七支，三支领出去的，账上有。柜角那些空盒是用完的旧批，也都登记在册。您数得准，可您数的是药，不是人。"},{"clue":"c_p4","a":"练字的废纸。药房里夜长，闲着没事，谁不描几张帖解闷？院长的字写得好，我不过是学着玩的，您不要多心。"},{"clue":"c_s4","a":"明早八点……是，院长是约了我。账册我自然会带，他要查，尽管查，我问心无愧。药房的账，我这一辈子都认。"},{"clue":"c_y3","a":"烧点废纸，药房里常有的事，包药的草纸、作废的处方，总得有个去处。您别见怪，我这人，一向爱干净。"}],"fallback":"这个与药房无关，您恐怕问错人了。"}],"solution":{"culprit":"song","method":{"q":"凶手怎么做到的？","correct":2,"options":["A 院长因癌痛难忍，自己多打了几支吗啡， <script>
'use strict';
// 视觉特效：飘雪、点击涟漪、打字机、火花/彩带、卡片倾斜
const FX = (() => {
  // 手机/低配设备：关掉闪烁、发光、火花等持续特效，只留轻微飘雪，避免卡顿和闪烁
  const LITE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || (navigator.hardwareConcurrency || 8) <= 4;
  try { if (LITE) document.documentElement.classList.add('lite'); } catch (e) {}

  // 飘雪画布。返回 stop()

    if (!canvas || reduce()) return () => {};

    const count = LITE ? Math.min(o.count || 70, 22) : (o.count || 70), speed = o.speed || 1, alpha = o.alpha == null ? 0.7 : o.alpha;
    let w = 0, h = 0, raf = 0, flakes = [], dead = false;
    const fit = () => {
      const r = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = Math.max(1, r.width); h = Math.max(1, r.height);
      canvas.width = w * dpr; canvas.height = h * dpr;

    // 输入文字时（键盘弹出、页面反复重排）暂停飘雪并隐藏画布，避免输入卡顿
    const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
    const onFocusIn = (e) => { if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) canvas.style.visibility = 'hidden'; };
    const onFocusOut = () => { setTimeout(() => { if (!isTyping()) canvas.style.visibility = ''; }, 150); };
    document.addEventListener('focusin', onFocusIn); document.addEventListener('focusout', onFocusOut);
    const mk = (top) => ({ x: Math.random() * w, y: top ? -10 : Math.random() * h, r: 0.6 + Math.random() * 2, v: 14 + Math.random() * 34, s: Math.random() * 6.28, a: 0.25 + Math.random() * 0.6 });

      raf = requestAnimationFrame(tick);
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (document.hidden) return;
      if (isTyping()) return;
      if (LITE && t - lastDraw < 40) return;

    el.addEventListener('pointerleave', reset);

    const w = document.createElement('div');
    w.className = 'spk-wrap';
    for (let i = 0; i < (n || 8); i++) {
      const s = document.createElement('i');
      s.className = 'spk';
      s.style.cssText = `left:${(Math.random() * 96).toFixed(0)}%;top:${(Math.random() * 96).toFixed(0)}%;--s:${(o.min || 6) + Math.random() * (o.max || 12)}px;animation-delay:-${(Math.random() * 3).toFixed(2)}s;animation-duration:${(1.5 + Math.random() * 2).toFixed(2)}s`;
      w.appendChild(s);
    }
    el.appendChild(w);
    return w;
  }
  // 点击处迸出一圈火花
  function pop(x, y) {
    if (reduce() || LITE) return;
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('i');
      const a = (i / 9) * 6.283 + Math.random() * 0.5, d = 26 + Math.random() * 30;
      s.className = 'popk';
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;--r:${(Math.random() * 180).toFixed(0)}deg`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 750);
    }
  }
  return { snow, typewriter, burst, tilt, sparkle, pop, reduce };
})();
if (typeof window !== 'undefined') window.FX = FX;
