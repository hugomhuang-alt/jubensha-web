<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1420"></head><body>
<title>线上剧本杀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #0e1420;
  --bg2: #121a2a;
  --panel: #172033;
  --panel2: #1e2a43;
  --line: #2a3752;
  --text: #ebe6da;
  --muted: #9aa6bb;
  --accent: #e2b86f;
  --accent-ink: #1b1608;
  --danger: #e57b73;
  --ok: #84c9a0;
  --radius: 14px;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; min-height: 100dvh;
  background:
    radial-gradient(1200px 500px at 50% -10%, #1d2b4a 0%, transparent 60%),
    var(--bg);
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.banner { position: fixed; z-index: 30; top: 0; left: 0; right: 0; padding: 8px 16px; text-align: center; background: var(--danger); color: #230b09; font-size: 14px; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(92vw, 520px); padding: 12px 16px; border-radius: 12px; background: #263553; border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.45); font-size: 14px; line-height: 1.55; }

/* 首页 */
.home { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.home-card { width: min(440px, 100%); background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: 22px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.eyebrow { margin: 0 0 6px; color: var(--accent); letter-spacing: .3em; font-size: 12px; }
.home-card h1 { margin: 0; font-family: var(--serif); font-size: 44px; letter-spacing: .12em; font-weight: 700; }
.sub { margin: 8px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: #0f1626; outline: none; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(226,184,111,.15); }
.or { margin: 20px 0 10px; text-align: center; color: var(--muted); font-size: 13px; }
.join-row { display: flex; gap: 10px; }
.join-row input { text-transform: uppercase; letter-spacing: .4em; text-align: center; font-weight: 700; }
.fine { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

.btn { padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; transition: transform .06s, background .15s, border-color .15s; min-height: 44px; }
.btn:hover { border-color: #3a4c72; }
.btn:active { transform: translateY(1px); }
.btn.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 6px 12px; min-height: 32px; font-size: 13px; border-radius: 9px; }
.btn.danger { background: #3a1f24; border-color: #6a343b; color: #ffd6d2; }
.btn.ghost { background: transparent; }

/* 房间 */
.room { max-width: 760px; margin: 0 auto; padding: 0 14px 96px; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -14px 10px; padding-left: 16px; padding-right: 16px; }
.room-code { display: inline-block; padding: 3px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-weight: 700; letter-spacing: .3em; font-size: 14px; cursor: pointer; }
.phase-name { margin-top: 6px; font-family: var(--serif); font-size: 20px; letter-spacing: .06em; }
.timer { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; color: var(--accent); }
.timer.low { color: var(--danger); }

.players { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.chip .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); font-weight: 700; font-size: 13px; flex: none; }
.chip .nm { font-size: 13px; font-weight: 600; line-height: 1.2; }
.chip .ch { font-size: 11px; color: var(--muted); line-height: 1.2; }
.chip .st { font-size: 11px; margin-left: 2px; }
.chip.me { border-color: #4b5f8a; }
.chip.off { opacity: .45; }
.chip.speaker { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(226,184,111,.25); }
.chip.speaking .av { background: var(--ok); color: #0b2316; box-shadow: 0 0 0 3px rgba(132,201,160,.35); }

.phase-card { margin-bottom: 12px; padding: 16px; border-radius: var(--radius); background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); }
.phase-card h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 17px; }
.phase-card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.phase-card .row { display: flex; flex-wrap: wrap; gap: 8px; }
.phase-card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.loc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 4px; }
.loc { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }
.loc b { display: block; margin-bottom: 4px; }
.loc small { color: var(--muted); font-size: 12px; line-height: 1.5; display: block; }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vote-grid .loc.picked { border-color: var(--accent); background: #2a2a1f; }

.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { flex: 1; position: relative; padding: 10px 6px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; }
.tabs button.on { background: var(--panel2); color: var(--text); }
.dot { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.tab-body, .chat-pane { padding: 4px 2px 12px; }
.card { padding: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; }
.card h4 { margin: 0 0 8px; font-family: var(--serif); font-size: 16px; color: var(--accent); letter-spacing: .04em; }
.card p { margin: 0 0 10px; line-height: 1.85; font-size: 15px; }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 0; padding-left: 20px; line-height: 1.85; font-size: 15px; }
.card li { margin-bottom: 6px; }
.card.secret { border-color: #6a4b3a; background: linear-gradient(180deg, #2a1f1c, var(--panel)); }
.card.secret h4 { color: #f0a58b; }
.card.culprit { border-color: #7b3b43; background: linear-gradient(180deg, #33191e, var(--panel)); }
.card.culprit h4 { color: var(--danger); }
.role-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.role-head .big { font-family: var(--serif); font-size: 28px; letter-spacing: .08em; }
.role-head .meta { color: var(--muted); font-size: 14px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-right: 6px; }
.clue { padding: 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); margin-bottom: 10px; }
.clue .t { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 6px; }
.clue .t b { font-family: var(--serif); }
.clue .loc-tag { font-size: 12px; color: var(--muted); }
.clue p { margin: 0; font-size: 14px; line-height: 1.8; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }

.chat-log { height: min(46vh, 420px); overflow-y: auto; padding: 12px; border-radius: var(--radius); background: var(--bg2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.msg { font-size: 14px; line-height: 1.6; word-break: break-word; }
.msg b { color: var(--accent); margin-right: 6px; }
.msg.sys { color: var(--muted); font-size: 12px; text-align: center; }
.chat-form { display: flex; gap: 8px; margin-top: 10px; }

.voicebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: flex; justify-content: center; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); }
.voicebar .inner { display: flex; align-items: center; gap: 10px; width: min(760px, 100%); padding: 8px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 -4px 30px rgba(0,0,0,.4); }
.voicebar .status { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.4; min-width: 0; }
.voicebar .status b { color: var(--text); }
.mic-on { background: var(--ok) !important; color: #0b2316 !important; border-color: transparent !important; }
.mic-gated { background: #3a331c !important; color: #f1d88e !important; }

.lobby-list { display: grid; gap: 8px; margin: 10px 0 14px; }
.reveal-win { font-family: var(--serif); font-size: 22px; margin: 0 0 8px; }
.reveal-win.good { color: var(--ok); }
.reveal-win.bad { color: var(--danger); }
.vote-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 4px 0; }
.vote-bar .bar { height: 8px; border-radius: 4px; background: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 720px) {
  .home-card { padding: 40px 36px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* =====================================================================
   视觉升级：插画、动画、特效
   ===================================================================== */
:root { --gold: #e2b86f; --gold2: #fff1c4; --glass: rgba(18, 26, 42, .72); }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.home, .room, .banner { position: relative; z-index: 1; }
.banner { position: fixed; }
.room { z-index: 1; }

/* ---- 场景动画（SVG 内部） ---- */
.scene, .portrait { display: block; width: 100%; height: 100%; }
.scene .tw { animation: tw 3.2s ease-in-out infinite; }
.scene .fl { animation: fall linear infinite; }
.scene .flick { animation: flick 3.1s steps(1) infinite; }
.scene .flick2 { animation: flick2 2.2s ease-in-out infinite; }
.scene .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .flame { animation: flame .9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.scene .drift { animation: drift 24s linear infinite alternate; }
.scene .drift2 { animation: drift 30s linear infinite alternate-reverse; }
.scene .smoke circle { animation: smoke 4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .smoke circle:nth-child(2) { animation-delay: 1.3s; } .scene .smoke circle:nth-child(3) { animation-delay: 2.6s; }
.scene .steam path { animation: steam 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.scene .swing { animation: swing 3.4s ease-in-out infinite alternate; }
.scene .pend { animation: swing 2s ease-in-out infinite alternate; }
.scene .noise { animation: noise .35s steps(2) infinite; }
.scene .ecg { stroke-dasharray: 140; animation: ecg 2.2s linear infinite; }
@keyframes tw { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
@keyframes fall { from { transform: translateY(-12px) } to { transform: translateY(260px) } }
@keyframes flick { 0%, 100% { opacity: 1 } 8% { opacity: .35 } 12% { opacity: 1 } 55% { opacity: .85 } 60% { opacity: 1 } 90% { opacity: .5 } 94% { opacity: 1 } }
@keyframes flick2 { 0%, 100% { opacity: 1 } 40% { opacity: .72 } 70% { opacity: .9 } }
@keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.94) } 50% { opacity: 1; transform: scale(1.1) } }
@keyframes flame { from { transform: scale(1, .86) skewX(-3deg) } to { transform: scale(1.06, 1.12) skewX(3deg) } }
@keyframes drift { from { transform: translateX(-14px) } to { transform: translateX(14px) } }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: .5 } 100% { transform: translate(8px, -26px) scale(1.7); opacity: 0 } }
@keyframes steam { 0% { opacity: 0; transform: translateY(6px) scaleY(.7) } 40% { opacity: .6 } 100% { opacity: 0; transform: translateY(-10px) scaleY(1.2) } }
@keyframes swing { from { transform: rotate(-4deg) } to { transform: rotate(4deg) } }
@keyframes noise { 0% { transform: translate(0, 0) } 50% { transform: translate(-3px, 1px) } 100% { transform: translate(2px, -1px) } }
@keyframes ecg { from { stroke-dashoffset: 140 } to { stroke-dashoffset: -140 } }

/* ---- 按钮：金色流光 + 涟漪 ---- */
.btn, .loc, .vote-card, .tabs button, .seal-btn { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.rip { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .35); transform: scale(0); animation: rip .65s ease-out forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(1); opacity: 0 } }
.btn { transition: transform .12s, box-shadow .2s, background .2s, border-color .2s, filter .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.btn.primary { background: linear-gradient(180deg, #f1cd8b, #d9a54f 70%, #c8903a); color: #2a1c06; box-shadow: 0 6px 22px rgba(226, 184, 111, .28), inset 0 1px 0 rgba(255, 255, 255, .5); letter-spacing: .06em; text-shadow: 0 1px 0 rgba(255, 255, 255, .35); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-18deg); animation: shine 3.6s ease-in-out infinite; pointer-events: none; }
.btn.primary:disabled::after { display: none; }
.btn.primary.cta { animation: glow 2.6s ease-in-out infinite; }
@keyframes shine { 0% { left: -60% } 45%, 100% { left: 140% } }
@keyframes glow { 0%, 100% { box-shadow: 0 6px 22px rgba(226, 184, 111, .25), 0 0 0 0 rgba(226, 184, 111, .35) } 50% { box-shadow: 0 6px 28px rgba(226, 184, 111, .5), 0 0 0 8px rgba(226, 184, 111, 0) } }
.btn:not(.primary):hover:not(:disabled) { border-color: var(--gold); }

/* ---- 首页 ---- */
.home { padding-top: max(16px, env(safe-area-inset-top)); }
.home-card { padding: 0; overflow: hidden; position: relative; background: linear-gradient(180deg, #121a2c, #0f1626); border-color: #33415f; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
.hero { position: relative; height: 236px; overflow: hidden; }
.hero .scene { position: absolute; inset: 0; transform: scale(1.04); animation: kenburns 28s ease-in-out infinite alternate; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 14, 26, 0) 40%, #0f1626 98%); }
.hero-title { position: absolute; z-index: 2; left: 0; right: 0; bottom: 10px; text-align: center; }
.hero-title .eyebrow { margin: 0 0 4px; text-shadow: 0 2px 8px #000; }
.home-card h1 { font-size: 50px; letter-spacing: .2em; padding-left: .2em; background: linear-gradient(180deg, #fff6dc 10%, #e2b86f 55%, #b9873a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 12px rgba(226, 184, 111, .35)); animation: titleglow 4s ease-in-out infinite alternate; }
@keyframes titleglow { from { filter: drop-shadow(0 3px 10px rgba(226, 184, 111, .2)) } to { filter: drop-shadow(0 3px 20px rgba(226, 184, 111, .6)) } }
.home-body { padding: 4px 24px 28px; }
.home .sub { text-align: center; margin: 4px 0 20px; }
@keyframes kenburns { from { transform: scale(1.04) translate(0, 0) } to { transform: scale(1.18) translate(-10px, -6px) } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

/* ---- 头部和玩家头像 ---- */
.topbar { background: linear-gradient(180deg, #131b2e, #0e1420); }
.phase-name { background: linear-gradient(90deg, #fff1c4, #e2b86f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip .av { overflow: hidden; background: #1e2a43; border: 1px solid #3a4a6a; }
.chip .av .portrait { width: 100%; height: 100%; }
.chip.speaker { animation: speakerpulse 1.6s ease-in-out infinite; }
@keyframes speakerpulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(226, 184, 111, .25) } 50% { box-shadow: 0 0 0 5px rgba(226, 184, 111, .12), 0 0 16px rgba(226, 184, 111, .35) } }

/* ---- 卡片入场 ---- */
.card, .phase-card, .clue { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
.card:nth-child(2) { animation-delay: .06s } .card:nth-child(3) { animation-delay: .12s } .card:nth-child(4) { animation-delay: .18s } .card:nth-child(5) { animation-delay: .24s }
.card { background: linear-gradient(180deg, #19233a, #141c2e); }
.card h4 { display: flex; align-items: center; gap: 8px; }
.card h4::before { content: ""; width: 14px; height: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tabs button.on { background: linear-gradient(180deg, #25324f, #1e2a43); box-shadow: inset 0 -2px 0 var(--gold); }

/* ---- 角色卡 ---- */
.role-hero { position: relative; display: flex; gap: 16px; align-items: flex-end; padding: 16px; border-radius: 16px; border: 1px solid #4b5f8a; background: linear-gradient(135deg, #1d2944, #121a2c); margin-bottom: 12px; overflow: hidden; animation: rise .6s both; }
.role-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px 160px at 20% 0, rgba(226, 184, 111, .18), transparent 70%); }
.frame { position: relative; flex: none; width: 128px; aspect-ratio: 5/6; border-radius: 12px; overflow: hidden; border: 2px solid var(--gold); box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 4px rgba(226, 184, 111, .14); transition: transform .15s ease-out; will-change: transform; }
.frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .22) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 5s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%, 55% { transform: translateX(-120%) } 85%, 100% { transform: translateX(120%) } }
.frame .portrait { animation: breathe 5s ease-in-out infinite; transform-origin: 50% 80%; }
@keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.025) } }
.role-info { position: relative; min-width: 0; padding-bottom: 4px; }
.role-info .big { font-family: var(--serif); font-size: 30px; letter-spacing: .1em; display: block; line-height: 1.15; text-shadow: 0 2px 12px rgba(0, 0, 0, .5); }
.role-info .meta { color: var(--muted); font-size: 14px; display: block; margin: 4px 0 8px; }
.role-info p { margin: 0 0 8px; font-size: 14px; line-height: 1.7; color: #cfd7e6; }
.stamp { display: inline-block; padding: 3px 10px; border: 2px solid var(--danger); color: var(--danger); border-radius: 6px; font-weight: 800; letter-spacing: .15em; transform: rotate(-6deg); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-6deg) scale(2.2); opacity: 0 } to { transform: rotate(-6deg) scale(1); opacity: 1 } }

/* 封印的档案 */
.sealed { text-align: center; padding: 30px 16px 26px; border-radius: 16px; border: 1px solid #5a4a2a; background: radial-gradient(300px 200px at 50% 0, rgba(226, 184, 111, .16), transparent 70%), linear-gradient(180deg, #2a2418, #171b27); margin-bottom: 12px; animation: rise .6s both; }
.sealed h4 { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; letter-spacing: .1em; color: var(--gold2); }
.sealed p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.seal-btn { width: 112px; height: 112px; border-radius: 50%; border: 0; color: #fff3d4; font-family: var(--serif); font-size: 18px; letter-spacing: .1em; background: radial-gradient(circle at 35% 30%, #d8503e, #8c1f1a 60%, #5e0f10); box-shadow: 0 10px 30px rgba(140, 31, 26, .55), inset 0 -6px 14px rgba(0, 0, 0, .4), inset 0 4px 8px rgba(255, 255, 255, .25); animation: sealpulse 2.4s ease-in-out infinite; }
.seal-btn::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 2px dashed rgba(255, 230, 190, .5); }
@keyframes sealpulse { 0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(140, 31, 26, .5) } 50% { transform: scale(1.06); box-shadow: 0 10px 40px rgba(220, 60, 40, .6) } }
.unseal { animation: unseal .8s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes unseal { 0% { opacity: 0; transform: translateY(40px) scale(.9) rotateX(40deg) } 100% { opacity: 1; transform: none } }

/* ---- 案情：封面、时间线、人物墙 ---- */
.cover-card { position: relative; height: 170px; border-radius: 16px; overflow: hidden; border: 1px solid #33415f; margin-bottom: 12px; }
.cover-card .scene { position: absolute; inset: 0; animation: kenburns 26s ease-in-out infinite alternate; }
.cover-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(8, 12, 22, .92)); }
.cover-card .cap { position: absolute; z-index: 2; left: 14px; bottom: 10px; right: 14px; }
.cover-card .cap b { font-family: var(--serif); font-size: 24px; letter-spacing: .14em; color: var(--gold2); text-shadow: 0 2px 10px #000; }
.cover-card .cap span { display: block; font-size: 12px; color: #c4cee3; margin-top: 2px; }
.tl { position: relative; margin: 6px 0 2px 8px; padding-left: 28px; }
.tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, var(--gold), rgba(226, 184, 111, .1)); transform-origin: top; animation: grow 1.2s ease-out both; }
@keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
.tl-item { position: relative; padding: 0 0 14px; animation: slidein .5s cubic-bezier(.2, .8, .2, 1) both; }
.tl-item:last-child { padding-bottom: 2px; }
.tl-item .dot2 { position: absolute; left: -29px; top: -1px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #1b2540; border: 2px solid var(--gold); color: var(--gold); box-shadow: 0 0 12px rgba(226, 184, 111, .4); }
.tl-item .dot2 .ico { width: 11px; height: 11px; }
.tl-item.hot .dot2 { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 14px rgba(229, 123, 115, .6); animation: pulsedot 1.6s infinite; }
@keyframes pulsedot { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.2) } }
.tl-item .tm { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.tl-item .tx { font-size: 14px; line-height: 1.6; color: #d6ddec; }
@keyframes slidein { from { opacity: 0; transform: translateX(-14px) } to { opacity: 1; transform: none } }
.cast { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cast-card { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #131b2e; animation: rise .5s both; }
.cast-card .ph { aspect-ratio: 5/5.4; }
.cast-card .ph .portrait { height: 100%; }
.cast-card .tx { padding: 8px 10px 10px; }
.cast-card b { font-family: var(--serif); font-size: 16px; letter-spacing: .06em; }
.cast-card small { display: block; color: var(--gold); font-size: 12px; margin-top: 1px; }
.cast-card p { margin: 4px 0 0 !important; font-size: 12px !important; line-height: 1.55 !important; color: var(--muted); }
.cast-card .who { position: absolute; top: 6px; left: 6px; padding: 1px 8px; font-size: 11px; border-radius: 999px; background: rgba(8, 12, 22, .7); border: 1px solid #3a4a6a; color: #dbe3f3; }
.cast-card.me { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(226, 184, 111, .2); }
.victim { display: flex; gap: 14px; align-items: center; }
.victim .frame { width: 92px; border-color: #777; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.victim .frame::after { display: none; }
.victim .frame::before { content: "†"; position: absolute; z-index: 2; right: 6px; top: 2px; color: #ddd; font-size: 18px; text-shadow: 0 1px 4px #000; }
.truth p { animation: slidein .7s cubic-bezier(.2, .8, .2, 1) both; }
.truth-cover { position: relative; height: 130px; border-radius: 12px; overflow: hidden; margin: -4px -4px 12px; }
.truth-cover .scene { position: absolute; inset: 0; animation: kenburns 20s ease-in-out infinite alternate; }
.truth-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(51, 25, 30, .2), #33191e); }
.ending { display: flex; gap: 10px; align-items: flex-start; }
.ending .mini { flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid #3a4a6a; }
.ending.c .mini { border-color: var(--danger); box-shadow: 0 0 10px rgba(229, 123, 115, .5); }

/* ---- 阶段卡、地点卡、投票卡 ---- */
.loc-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
.loc.place { padding: 0; display: flex; flex-direction: column; background: #131b2e; transition: transform .15s, border-color .15s, box-shadow .2s; }
.loc.place .th { height: 78px; width: 100%; position: relative; overflow: hidden; }
.loc.place .th .scene { transition: transform .5s; }
.loc.place:hover:not(:disabled) .th .scene { transform: scale(1.12); }
.loc.place:hover:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 24px rgba(226, 184, 111, .18); transform: translateY(-2px); }
.loc.place .tx { padding: 8px 10px 10px; }
.loc.place:disabled { filter: grayscale(.7) brightness(.7); }
.loc.place .tick { position: absolute; top: 6px; right: 6px; padding: 1px 8px; font-size: 11px; border-radius: 999px; background: rgba(8, 12, 22, .75); color: var(--ok); border: 1px solid #3a6a52; }
.vote-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
.vote-card { padding: 0; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: #131b2e; display: flex; flex-direction: column; transition: transform .15s, box-shadow .2s, border-color .15s; }
.vote-card .ph { aspect-ratio: 5/4.4; position: relative; }
.vote-card .ph .portrait { height: 100%; filter: saturate(.85); transition: filter .3s, transform .4s; }
.vote-card:hover .ph .portrait { filter: saturate(1.1); transform: scale(1.05); }
.vote-card .tx { padding: 8px 10px 10px; }
.vote-card .tx b { display: block; font-family: var(--serif); letter-spacing: .06em; }
.vote-card .tx small { color: var(--muted); font-size: 12px; }
.vote-card.picked { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(229, 123, 115, .45), 0 10px 28px rgba(229, 123, 115, .25); transform: translateY(-2px); }
.vote-card.picked .ph::after { content: "指认"; position: absolute; right: 8px; top: 8px; padding: 2px 10px; border: 2px solid var(--danger); color: var(--danger); background: rgba(40, 10, 14, .55); border-radius: 6px; font-weight: 800; letter-spacing: .12em; font-size: 15px; animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.phase-card { background: linear-gradient(180deg, #19233a, #121a2c); border-color: #33415f; position: relative; overflow: hidden; }
.phase-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }

/* 发言舞台 */
.stage { position: relative; display: flex; align-items: center; gap: 16px; padding: 14px; margin: 4px 0 10px; border-radius: 14px; background: radial-gradient(260px 160px at 22% 40%, rgba(226, 184, 111, .22), transparent 70%), #0d1424; border: 1px solid #3a4a6a; overflow: hidden; }
.stage .spot { position: absolute; left: 0; top: -20px; width: 150px; height: 220px; background: conic-gradient(from 180deg at 50% 0, transparent 160deg, rgba(255, 241, 196, .22) 180deg, transparent 200deg); filter: blur(6px); animation: sweep 6s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: rotate(-8deg) } to { transform: rotate(8deg) } }
.stage .speaker-av { position: relative; flex: none; width: 92px; height: 92px; }
.stage .speaker-av .face { position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); z-index: 2; background: #1e2a43; }
.stage .speaker-av .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; animation: ring 2.2s ease-out infinite; }
.stage .speaker-av .ring:nth-child(2) { animation-delay: .73s } .stage .speaker-av .ring:nth-child(3) { animation-delay: 1.46s }
@keyframes ring { 0% { transform: scale(.85); opacity: .8 } 100% { transform: scale(1.7); opacity: 0 } }
.stage .info { position: relative; z-index: 2; min-width: 0; }
.stage .info b { font-family: var(--serif); font-size: 20px; letter-spacing: .08em; display: block; }
.stage .info span { color: var(--muted); font-size: 13px; }
.wave { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; margin-left: 8px; vertical-align: middle; }
.wave i { width: 3px; background: var(--gold); border-radius: 2px; animation: wave 1s ease-in-out infinite; }
.wave i:nth-child(1) { height: 6px } .wave i:nth-child(2) { height: 14px; animation-delay: .15s } .wave i:nth-child(3) { height: 9px; animation-delay: .3s } .wave i:nth-child(4) { height: 13px; animation-delay: .45s }
@keyframes wave { 0%, 100% { transform: scaleY(.4) } 50% { transform: scaleY(1.2) } }

/* 线索卡 */
.clue { display: flex; gap: 12px; position: relative; overflow: hidden; }
.clue .cth { flex: none; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; border: 1px solid #3a4a6a; }
.clue .cbody { min-width: 0; flex: 1; }
.clue.fresh { animation: flipin .8s cubic-bezier(.2, .9, .3, 1) both; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(226, 184, 111, .3); }
@keyframes flipin { from { opacity: 0; transform: perspective(600px) rotateX(-70deg) translateY(-20px) } to { opacity: 1; transform: none } }

/* ---- 全屏覆盖层 ---- */
.ov { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #05070d; color: var(--text); animation: fadein .35s both; overflow: hidden; }
.ov.out { animation: fadeout .4s both; pointer-events: none; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeout { to { opacity: 0 } }
.ov .bgscene { position: absolute; inset: 0; }
.ov .bgscene .scene { animation: kenburns 14s ease-out both; }
.ov canvas.ovsnow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.ov .shade { position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(5, 7, 13, .5) 0%, rgba(5, 7, 13, 0) 30%, rgba(5, 7, 13, .6) 62%, rgba(5, 7, 13, .96) 100%); }
.ov .skip { position: absolute; z-index: 8; top: max(12px, env(safe-area-inset-top)); right: 12px; padding: 6px 14px; border-radius: 999px; background: rgba(8, 12, 22, .6); border: 1px solid #3a4a6a; color: #cdd6ea; font-size: 13px; backdrop-filter: blur(6px); }
.intro .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .9s; }
.intro .slide.on { opacity: 1; }
.intro .slide .bgscene .scene { animation: kenburns 16s ease-out both; }
.intro .titlecard { position: absolute; z-index: 5; left: 0; right: 0; top: 34%; text-align: center; }
.intro .titlecard h1 { margin: 0; font-family: var(--serif); font-size: 56px; letter-spacing: .28em; padding-left: .28em; background: linear-gradient(180deg, #fff6dc, #e2b86f 60%, #b9873a); -webkit-background-clip: text; background-clip: text; color: transparent; animation: titlein 2s cubic-bezier(.2, .8, .2, 1) both; filter: drop-shadow(0 4px 20px rgba(226, 184, 111, .5)); }
.intro .titlecard p { margin: 10px 0 0; color: #cdd6ea; letter-spacing: .3em; font-size: 13px; animation: fadein 2s .8s both; }
@keyframes titlein { from { opacity: 0; letter-spacing: .6em; filter: blur(12px) } to { opacity: 1 } }
.intro .textbox { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 0 20px max(28px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.intro .textbox .tt { min-height: 124px; font-family: var(--serif); font-size: 18px; line-height: 1.95; letter-spacing: .04em; text-shadow: 0 2px 10px #000; }
.intro .textbox .hint { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; color: #9aa6bb; font-size: 12px; }
.intro .dots { display: flex; gap: 6px; } .intro .dots i { width: 18px; height: 3px; border-radius: 2px; background: #3a4a6a; } .intro .dots i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.intro .next { animation: blink 1.4s infinite; color: var(--gold); }
@keyframes blink { 50% { opacity: .3 } }

.splash { position: fixed; inset: 0; z-index: 45; pointer-events: none; display: grid; place-items: center; animation: splash 2.1s ease both; }
.splash .bgscene { position: absolute; inset: 0; opacity: .5; } .splash::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(5, 7, 13, .35), rgba(5, 7, 13, .9)); z-index: 1; }
.splash .inner { position: relative; z-index: 2; text-align: center; padding: 0 20px; }
.splash .inner small { display: block; color: var(--gold); letter-spacing: .5em; font-size: 12px; margin-bottom: 8px; animation: fadein 1s both; }
.splash .inner b { display: block; font-family: var(--serif); font-size: 40px; letter-spacing: .24em; padding-left: .24em; color: var(--gold2); text-shadow: 0 0 24px rgba(226, 184, 111, .6), 0 4px 16px #000; animation: titlein 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.splash .inner i { display: block; margin: 12px auto 0; height: 2px; width: 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: line 1.2s .3s ease-out forwards; }
@keyframes line { to { width: min(260px, 70vw) } }
@keyframes splash { 0% { opacity: 0 } 12% { opacity: 1 } 78% { opacity: 1 } 100% { opacity: 0 } }

/* 搜证 */
.searchov .darkmask { position: absolute; inset: 0; z-index: 4; background: radial-gradient(circle 110px at var(--x, 50%) var(--y, 50%), rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .96) 100%); transition: opacity .8s; }
.searchov .darkmask.off { opacity: 0; }
.searchov .lens { position: absolute; z-index: 5; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 2px solid rgba(255, 241, 196, .35); box-shadow: 0 0 40px rgba(255, 241, 196, .25); left: var(--x, 50%); top: var(--y, 50%); transition: opacity .6s; pointer-events: none; }
.searchov .lens.off { opacity: 0; }
.searchov .locname { position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-family: var(--serif); font-size: 22px; letter-spacing: .3em; color: var(--gold2); text-shadow: 0 2px 12px #000; padding-top: 6px; }
.searchov .result { position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; padding: 0 16px max(22px, env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
.searchov .result > div { pointer-events: auto; width: min(480px, 100%); }
.clue-reveal { position: relative; padding: 18px 18px 16px; border-radius: 16px; background: linear-gradient(180deg, #f4ead2, #e3d3ae); color: #2a2012; border: 2px solid #b9873a; box-shadow: 0 20px 60px rgba(0, 0, 0, .7), 0 0 0 4px rgba(226, 184, 111, .25); animation: flipin .9s cubic-bezier(.2, .9, .3, 1) both; }
.clue-reveal.empty { background: linear-gradient(180deg, #232c40, #182033); color: var(--muted); border-color: #3a4a6a; box-shadow: 0 20px 50px rgba(0, 0, 0, .6); }
.clue-reveal .new { position: absolute; top: -12px; right: 14px; padding: 2px 12px; border-radius: 999px; background: #c0392b; color: #fff; font-weight: 800; letter-spacing: .15em; font-size: 12px; animation: stamp .5s .5s cubic-bezier(.2, 1.6, .4, 1) both; box-shadow: 0 4px 12px rgba(192, 57, 43, .6); }
.clue-reveal h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 22px; letter-spacing: .08em; }
.clue-reveal p { margin: 0 0 14px; line-height: 1.85; font-size: 15px; }
.clue-reveal .btn { width: 100%; }
.clue-reveal .btn:not(.primary) { color: inherit; }

/* 真相揭晓 */
.revealov { background: radial-gradient(800px 500px at 50% 0, #1a1630, #05070d 70%); align-items: center; justify-content: center; text-align: center; }
.revealov .beam { position: absolute; top: -10%; left: 50%; width: 140%; height: 120%; margin-left: -70%; background: conic-gradient(from 180deg at 50% 0, transparent 168deg, rgba(255, 241, 196, .18) 180deg, transparent 192deg); filter: blur(10px); z-index: 1; animation: sweep 4s ease-in-out infinite alternate; }
.revealov h2 { position: relative; z-index: 4; margin: 0 0 18px; font-family: var(--serif); font-size: 22px; letter-spacing: .3em; padding-left: .3em; color: var(--gold2); animation: titlein 1.6s both; text-shadow: 0 0 20px rgba(226, 184, 111, .5); }
.suspects { position: relative; z-index: 4; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 16px; max-width: 560px; }
.suspect { width: 72px; text-align: center; opacity: .35; filter: grayscale(1) brightness(.6); transition: all .35s; transform: scale(.94); }
.suspect .pic { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; border: 2px solid #3a4a6a; }
.suspect span { display: block; margin-top: 5px; font-size: 12px; color: #cdd6ea; }
.suspect.lit { opacity: 1; filter: none; transform: scale(1.12); } .suspect.lit .pic { border-color: var(--gold); box-shadow: 0 0 22px rgba(226, 184, 111, .8); }
.suspect.culprit { opacity: 1; filter: none; transform: scale(1.55); z-index: 6; margin: 0 20px; animation: shake .5s .1s both; }
.suspect.culprit .pic { border-color: var(--danger); box-shadow: 0 0 30px rgba(229, 123, 115, .9), 0 0 0 6px rgba(229, 123, 115, .2); }
.suspect.culprit::after { content: "真凶"; position: absolute; left: 50%; top: 46px; margin-left: -26px; padding: 1px 6px; font-weight: 900; font-size: 14px; letter-spacing: .1em; color: #fff; background: rgba(192, 38, 38, .92); border: 2px solid #ffb4ac; border-radius: 4px; transform: rotate(-12deg); animation: stamp .45s .35s cubic-bezier(.2, 1.6, .4, 1) both; }
.suspect { position: relative; }
.suspect.dim { opacity: .12; transform: scale(.8); }
@keyframes shake { 0%, 100% { translate: 0 } 20% { translate: -5px 2px } 40% { translate: 5px -2px } 60% { translate: -3px 1px } 80% { translate: 3px 0 } }
.revealov .verdict { position: relative; z-index: 5; margin-top: 70px; min-height: 120px; opacity: 0; transition: opacity .8s; padding: 0 20px; }
.revealov .verdict.on { opacity: 1; }
.revealov .verdict b { display: block; font-family: var(--serif); font-size: 34px; letter-spacing: .2em; padding-left: .2em; }
.revealov .verdict.good b { color: var(--ok); text-shadow: 0 0 24px rgba(132, 201, 160, .6); } .revealov .verdict.bad b { color: var(--danger); text-shadow: 0 0 24px rgba(229, 123, 115, .6); }
.revealov .verdict p { color: #cdd6ea; margin: 8px 0 16px; }
.revealov .flash { position: absolute; inset: 0; z-index: 7; background: #ff5a4a; opacity: 0; pointer-events: none; }
.revealov .flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .5 } 100% { opacity: 0 } }
.burst { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
.burst.gold i { position: absolute; top: -12px; width: 8px; height: 14px; opacity: 0; border-radius: 2px; animation: confetti 3s linear infinite; }
@keyframes confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1 } 100% { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9 } }
.burst.fog i { position: absolute; width: 60vw; height: 50vh; border-radius: 50%; background: radial-gradient(circle, rgba(170, 180, 200, .22), transparent 65%); animation: fogmove 9s ease-in-out infinite alternate; }
@keyframes fogmove { from { transform: translateX(-20vw) } to { transform: translateX(40vw) } }

.toast { background: linear-gradient(180deg, #2a3a5c, #1f2c48); border-color: #4b5f8a; animation: toastin .35s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px) } to { opacity: 1; transform: translate(-50%, 0) } }

@media (min-width: 560px) { .cast { grid-template-columns: repeat(4, 1fr); } .loc-grid, .vote-grid { grid-template-columns: repeat(3, 1fr); } .frame { width: 150px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
  .scene * { animation: none !important; }
}
.noanim .card, .noanim .clue, .noanim .tl-item, .noanim .cast-card, .noanim .role-hero, .noanim .sealed, .noanim .tl::before { animation: none !important; }
.noanim .truth p { animation: none !important; }
.noanim .clue.fresh { animation: none; }
.hero { height: 280px; }
.hero .scene { top: -10%; height: 112%; }
.hero-title { bottom: 14px; }
.intro .titlecard { top: 22%; }
.searchov .lens { background: radial-gradient(circle, rgba(255, 220, 150, .16), transparent 70%); }
.suspect.culprit::after { top: 58px; }

/* ---- 闪光 ---- */
.spk-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.spk { position: absolute; width: var(--s, 8px); height: var(--s, 8px); background: #fff4d0; opacity: 0; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0) } 50% { opacity: .95; transform: scale(1) rotate(45deg) } }
.popk { position: fixed; z-index: 99; width: 9px; height: 9px; margin: -4px 0 0 -4px; pointer-events: none; background: #ffe9a8; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: popk .7s ease-out forwards; }
@keyframes popk { from { opacity: 1; transform: translate(0, 0) scale(1) rotate(0) } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) rotate(var(--r)) } }
.hero { position: relative; } .hero .spk-wrap { z-index: 3; }
.splash .inner { position: relative; } .splash .inner .spk-wrap { inset: -30px -40px; overflow: visible; }
.scene .rn { animation: rain linear infinite; }
@keyframes rain { from { transform: translate(0, -10px) } to { transform: translate(-30px, 250px) } }
.scene .aurora { animation: aurora 9s ease-in-out infinite alternate; }

  return String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 12);
}

// ---------- 房间 ----------
function createRoom() {
  let code;
  do { code = rid(4); } while (rooms.has(code));
  const room = {
    code, players: [], hostId: null, phase: 'lobby', phaseEnd: null, timer: null,
    speakerOrder: [], speakerIdx: 0, chat: [], shared: [], voice: new Set(),
    result: null, scriptId: SCRIPTS.list[0].id, touched: Date.now()
  };
  rooms.set(code, room);
  return room;
}

function addPlayer(room, name, ws) {
  const p = {
    id: uid(), token: crypto.randomBytes(16).toString('hex'), name,
    ws, connected: true, charId: null, ready: false, searched: false,
    clues: [], vote: null
  };
  room.players.push(p);
  if (!room.hostId) room.hostId = p.id;
  return p;
}

function ensureHost(room) {
  const host = byId(room, room.hostId);
  if (host && host.connected && !host.isBot) return;
  const next = connectedPlayers(room).find((p) => !p.isBot);
  if (next) room.hostId = next.id;
}

function currentSpeakerId(room) {
  return room.phase === 'turns' ? room.speakerOrder[room.speakerIdx] || null : null;
}

// ---------- 状态快照（按玩家定制，绝不泄露他人私密信息） ----------
function publicChar(c) {
  return { id: c.id, name: c.name, title: c.title, age: c.age, blurb: c.blurb, look: c.look || null };
}

function scriptMeta(sc) {
  return {
    id: sc.id, title: sc.title, subtitle: sc.subtitle, tagline: sc.tagline || '', difficulty: sc.difficulty || 3,
    duration: sc.duration, minPlayers: sc.minPlayers, maxPlayers: sc.maxPlayers,
    cover: sc.cover || 'cover', tone: sc.tone || 'none'
  };
}

function snapshot(room, me) {
  const script = scriptOf(room);
  const inGame = room.phase !== 'lobby';
  const revealed = room.phase === 'reveal';
  const state = {
    type: 'state',
    now: Date.now(),
    code: room.code,
    phase: room.phase,
    phaseEnd: room.phaseEnd,
    hostId: room.hostId,
    scriptId: script.id,
    scripts: SCRIPTS.list.map(scriptMeta),
    speakerId: currentSpeakerId(room),
    speakerOrder: room.speakerOrder,
    script: {
      ...scriptMeta(script),
      intro: script.intro, publicFacts: script.publicFacts, victim: script.victim, timeline: script.timeline || [],
      introScenes: script.introScenes || [], phaseScenes: script.phaseScenes || {}, rounds: script.rounds || 3,
      locations: script.locations.map((l) => ({ id: l.id, name: l.name, desc: l.desc, scene: l.scene || l.id }))
    },
    players: room.players.map((p) => ({
      id: p.id, name: p.name, connected: p.connected, ready: p.ready, bot: !!p.isBot,
      searched: p.searched, voted: p.vote !== null,
      voice: room.voice.has(p.id),
      char: inGame && p.charId ? publicChar(script.characters[p.charId]) : null
    })),
    shared: room.shared,
    you: null,
    reveal: null
  };

  if (me) {
    const you = { id: me.id, name: me.name, clues: me.clues, vote: me.vote, char: null };
    if (inGame && me.charId) {
      const c = script.characters[me.charId];
      you.char = {
        ...publicChar(c), story: c.story, timeline: c.timeline,
        secret: c.secret, goal: c.goal, isCulprit: !!c.isCulprit
      };
    }
    state.you = you;
  }

  if (revealed && room.result) {
    state.reveal = {
      truth: script.truth,
      result: room.result,
      cast: room.players.map((p) => {
        const c = script.characters[p.charId];
        return {
          playerId: p.id, playerName: p.name, charId: c.id, look: c.look || null, charName: c.name, title: c.title,
          isCulprit: !!c.isCulprit, reveal: c.reveal
        };
      })
    };
  }
  return state;
}

function broadcastState(room) {
  room.touched = Date.now();
  for (const p of room.players) if (p.connected) send(p.ws, snapshot(room, p));
}

function broadcast(room, obj, exceptId) {
  for (const p of room.players) {
    if (p.connected && p.id !== exceptId) send(p.ws, obj);
  }
}

// ---------- 阶段控制 ----------
function setTimer(room, seconds) {
  clearTimeout(room.timer);
  const ms = (seconds * 1000) / TIME_SCALE;
  room.phaseEnd = Date.now() + ms;
  room.timer = setTimeout(() => advance(room), ms);
}

function enterPhase(room, phase) {
  clearTimeout(room.timer);
  room.timer = null;
  room.phase = phase;
  room.phaseEnd = null;

  if (phase === 'reading') room.players.forEach((p) => (p.ready = false));
  if (isSearch(phase)) room.players.forEach((p) => (p.searched = false));
  if (phase === 'vote') room.players.forEach((p) => (p.vote = null));
  if (phase === 'turns') {
    room.speakerOrder = shuffle(room.players.map((p) => p.id));
    room.speakerIdx = 0;
  }
  if (phase === 'reveal') room.result = computeResult(room);

  if (PHASE_SECONDS[phase]) setTimer(room, PHASE_SECONDS[phase]);
  broadcastState(room);
  botTick(room);
}

function advance(room) {
  if (room.phase === 'turns') {
    room.speakerIdx += 1;
    if (room.speakerIdx < room.speakerOrder.length) {
      setTimer(room, PHASE_SECONDS.turns);
      broadcastState(room);
      botTick(room);
      return;
    }
  }
  const ORDER = orderOf(room);
  const next = ORDER[ORDER.indexOf(room.phase) + 1];
  if (next) enterPhase(room, next);
}

function computeResult(room) {
  const script = scriptOf(room);
  const culprit = room.players.find((p) => script.characters[p.charId].isCulprit);
  const counts = {};
  room.players.forEach((p) => (counts[p.id] = 0));
  const votes = [];
  room.players.forEach((p) => {
    if (p.vote && counts[p.vote] !== undefined) {
      counts[p.vote] += 1;
      votes.push({ from: p.id, to: p.vote });
    }
  });
  const top = Math.max(...Object.values(counts));
  const topIds = Object.keys(counts).filter((id) => counts[id] === top);
  // 凶手必须是得票最多且唯一，才算被抓获
  const caught = top > 0 && topIds.length === 1 && topIds[0] === culprit.id;
  return { culpritId: culprit.id, counts, votes, caught };
}


// ---------- 机器人（单人测试用）----------
// 机器人只做最基本的动作：读完、说完、随机搜证、随机投票，用来让一个人也能把流程走完。
const BOT_NAMES = ['机器人甲', '机器人乙', '机器人丙', '机器人丁', '机器人戊', '机器人己', '机器人庚'];
const botDelay = (min, max) => Math.max(5, (min + Math.random() * (max - min)) / TIME_SCALE);

function botTick(room) {
  const script = scriptOf(room);
  const phase = room.phase;
  const bots = room.players.filter((p) => p.isBot);
  if (!bots.length) return;
  const stillHere = () => room.phase === phase;

  if (phase === 'reading') {
    bots.forEach((b) => setTimeout(() => {
      if (!stillHere()) return;
      b.ready = true; broadcastState(room); checkEarlyAdvance(room);
    }, botDelay(1000, 3000)));
  } else if (phase === 'turns') {
    const speakerId = currentSpeakerId(room);
    const idx = room.speakerIdx;
    if (bots.some((b) => b.id === speakerId)) {
      setTimeout(() => {
        if (stillHere() && room.speakerIdx === idx) advance(room);
      }, botDelay(2500, 4500));
    }
  } else if (isSearch(phase)) {
    bots.forEach((b) => setTimeout(() => {
      if (!stillHere() || b.searched) return;
      const loc = script.locations[crypto.randomInt(script.locations.length)];
      const have = new Set(b.clues.map((c) => c.id));
      const clue = loc.clues.find((c) => !have.has(c.id));
      if (clue) b.clues.push({ ...clue, loc: loc.name });
      b.searched = true;
      broadcastState(room); checkEarlyAdvance(room);
    }, botDelay(1500, 6000)));
  } else if (phase === 'vote') {
    bots.forEach((b) => setTimeout(() => {
      if (!stillHere() || b.vote) return;
      const others = room.players.filter((p) => p.id !== b.id);
      b.vote = others[crypto.randomInt(others.length)].id;
      broadcastState(room); checkEarlyAdvance(room);
    }, botDelay(2000, 8000)));
  }
}

function checkEarlyAdvance(room) {
  const alive = connectedPlayers(room);
  if (!alive.length) return;
  if (room.phase === 'reading' && alive.every((p) => p.ready)) advance(room);
  else if (isSearch(room.phase) && alive.every((p) => p.searched)) advance(room);
  else if (room.phase === 'vote' && alive.every((p) => p.vote)) advance(room);
}

function startGame(room) {
  const script = scriptOf(room);
  const n = room.players.length;
  const chars = shuffle(script.coreOrder.slice(0, n));
  room.players.forEach((p, i) => {
    p.charId = chars[i];
    p.clues = [];
    p.vote = null;
    p.ready = false;
    p.searched = false;
  });
  room.shared = [];
  room.result = null;
  enterPhase(room, 'reading');
}

function resetToLobby(room) {
  clearTimeout(room.timer);
  room.phase = 'lobby';
  room.phaseEnd = null;
  room.result = null;
  room.shared = [];
  room.speakerOrder = [];
  room.players.forEach((p) => {
    p.charId = null; p.clues = []; p.vote = null; p.ready = false; p.searched = false;
  });
  // 清理掉线玩家
  room.players = room.players.filter((p) => p.connected);
  ensureHost(room);
  broadcastState(room);
}

// ---------- 消息处理 ----------
function onMessage(ws, raw) {
  let msg;
  try { msg = JSON.parse(raw); } catch { return; }
  if (!msg || typeof msg.type !== 'string') return;

  const ctx = ws.ctx; // { room, player }
  const err = (m) => send(ws, { type: 'error', message: m });

  // 加入前的消息
  if (msg.type === 'create') {
    const name = cleanName(msg.name);
    if (!name) return err('请输入昵称');
    const room = createRoom();
    const p = addPlayer(room, name, ws);
    ws.ctx = { room, player: p };
    send(ws, { type: 'joined', code: room.code, token: p.token, id: p.id });
    broadcastState(room);
    return;
  }
  if (msg.type === 'join') {
    const name = cleanName(msg.name);
    const room = rooms.get(String(msg.code || '').toUpperCase());
    if (!name) return err('请输入昵称');
    if (!room) return err('没有这个房间');
    if (room.phase !== 'lobby') return err('游戏已经开始，不能加入');
    if (room.players.length >= scriptOf(room).maxPlayers) return err('房间已满');
    if (room.players.some((p) => p.name === name)) return err('这个昵称已被占用');
    const p = addPlayer(room, name, ws);
    ws.ctx = { room, player: p };
    send(ws, { type: 'joined', code: room.code, token: p.token, id: p.id });
    broadcast(room, { type: 'sys', text: `${name} 加入了房间` });
    broadcastState(room);
    send(ws, { type: 'chatlog', log: room.chat });
    return;
  }
  if (msg.type === 'rejoin') {
    const room = rooms.get(String(msg.code || '').toUpperCase());
    const p = room && room.players.find((x) => x.token === msg.token);
    if (!p) return send(ws, { type: 'rejoin-failed' });
    if (p.ws && p.ws !== ws) { try { p.ws.close(); } catch {} }
    p.ws = ws; p.connected = true;
    ws.ctx = { room, player: p };
    send(ws, { type: 'joined', code: room.code, token: p.token, id: p.id });
    ensureHost(room);
    broadcastState(room);
    send(ws, { type: 'chatlog', log: room.chat });
    return;
  }

  if (!ctx) return;
  const { room, player: me } = ctx;
  room.touched = Date.now();

  switch (msg.type) {
    case 'start': {
      if (me.id !== room.hostId) return err('只有房主可以开始');
      if (room.phase !== 'lobby') return;
      const alive = connectedPlayers(room).length;
      if (room.players.length < scriptOf(room).minPlayers) return err(`至少需要 ${scriptOf(room).minPlayers} 人`);
      if (alive < room.players.length) return err('有人处于离线状态，请等他回来');
      startGame(room);
      break;
    }
    case 'setscript': {
      if (me.id !== room.hostId || room.phase !== 'lobby') return;
      const sc = SCRIPTS.byId(String(msg.id || ''));
      if (!sc) return err('没有这个剧本');
      if (room.players.length > sc.maxPlayers) return err(`《${sc.title}》最多 ${sc.maxPlayers} 人，请先移除多余的玩家或机器人`);
      room.scriptId = sc.id;
      broadcastState(room);
      break;
    }
    case 'addbot': {
      if (me.id !== room.hostId || room.phase !== 'lobby') return;
      if (room.players.length >= scriptOf(room).maxPlayers) return err('房间已满');
      const used = new Set(room.players.map((p) => p.name));
      const name = BOT_NAMES.find((n) => !used.has(n));
      room.players.push({
        id: uid(), token: crypto.randomBytes(16).toString('hex'), name, ws: null,
        connected: true, isBot: true, charId: null, ready: false, searched: false, clues: [], vote: null
      });
      broadcastState(room);
      break;
    }
    case 'removebot': {
      if (me.id !== room.hostId || room.phase !== 'lobby') return;
      const i = room.players.map((p) => !!p.isBot).lastIndexOf(true);
      if (i >= 0) room.players.splice(i, 1);
      broadcastState(room);
      break;
    }
    case 'ready': {
      if (room.phase !== 'reading') return;
      me.ready = true;
      broadcastState(room);
      checkEarlyAdvance(room);
      break;
    }
    case 'next': {
      if (me.id !== room.hostId) return err('只有房主可以跳过阶段');
      if (room.phase === 'lobby' || room.phase === 'reveal') return;
      advance(room);
      break;
    }
    case 'speakdone': {
      if (room.phase === 'turns' && currentSpeakerId(room) === me.id) advance(room);
      break;
    }
    case 'search': {
      if (!isSearch(room.phase)) return;
      if (me.searched) return err('这一轮你已经搜过证了');
      const script = scriptOf(room);
      const loc = script.locations.find((l) => l.id === msg.loc);
      if (!loc) return err('没有这个地点');
      const have = new Set(me.clues.map((c) => c.id));
      const clue = loc.clues.find((c) => !have.has(c.id));
      me.searched = true;
      if (clue) me.clues.push({ ...clue, loc: loc.name });
      send(ws, { type: 'searchResult', loc: loc.name, clue: clue ? { ...clue, loc: loc.name } : null });
      broadcastState(room);
      checkEarlyAdvance(room);
      break;
    }
    case 'share': {
      const clue = me.clues.find((c) => c.id === msg.clueId);
      if (!clue) return;
      if (room.shared.some((s) => s.id === clue.id)) return;
      room.shared.push({ ...clue, by: me.name });
      broadcastState(room);
      break;
    }
    case 'vote': {
      if (room.phase !== 'vote') return;
      const target = byId(room, msg.target);
      if (!target || target.id === me.id) return err('不能投给自己');
      me.vote = target.id;
      broadcastState(room);
      checkEarlyAdvance(room);
      break;
    }
    case 'chat': {
      const text = String(msg.text || '').trim().slice(0, 300);
      if (!text) return;
      const m = { name: me.name, text, t: Date.now() };
      room.chat.push(m);
      if (room.chat.length > 200) room.chat.shift();
      broadcast(room, { type: 'chat', msg: m });
      break;
    }
    case 'restart': {
      if (me.id !== room.hostId || room.phase !== 'reveal') return;
      resetToLobby(room);
      break;
    }
    // ----- 语音信令 -----
    case 'voice-join': {
      const existing = [...room.voice].filter((id) => id !== me.id);
      room.voice.add(me.id);
      send(ws, { type: 'voice-peers', peers: existing });
      broadcastState(room);
      break;
    }
    case 'voice-leave': {
      room.voice.delete(me.id);
      broadcast(room, { type: 'voice-left', id: me.id }, me.id);
      broadcastState(room);
      break;
    }
    case 'signal': {
      const to = byId(room, msg.to);
      if (to && to.connected && room.voice.has(me.id)) {
        send(to.ws, { type: 'signal', from: me.id, data: msg.data });
      }
      break;
    }
    default:
      break;
  }
}

function onClose(ws) {
  const ctx = ws.ctx;
  if (!ctx) return;
  const { room, player } = ctx;
  if (player.ws !== ws) return; // 已被新连接取代
  player.connected = false;
  if (room.voice.delete(player.id)) {
    broadcast(room, { type: 'voice-left', id: player.id }, player.id);
  }
  ensureHost(room);
  broadcastState(room);
  // 如果在等其他人，别因为掉线卡住
  if (room.phase !== 'lobby' && room.phase !== 'reveal') checkEarlyAdvance(room);
}


  window.__local = { onMessage, onClose, send, ICE_SERVERS, SCRIPTS, scriptMeta };
})();


(function () {
  const L = window.__local;
  window.WebSocket = class LocalSocket {
    constructor() {
      this.readyState = 0;
      const self = this;
      const srv = { readyState: 1, ctx: null, send(s) { setTimeout(() => self.onmessage && self.onmessage({ data: s }), 0); }, close() {}, ping() {} };
      this._srv = srv;
      setTimeout(() => {
        self.readyState = 1;
        if (self.onopen) self.onopen();
        L.send(srv, { type: 'hello', ice: [], meta: { title: '线上剧本杀', subtitle: '选一个剧本，和朋友一起破案', scripts: L.SCRIPTS.list.map(L.scriptMeta) } });
      }, 0);
    }
    send(s) {
      const srv = this._srv;
      setTimeout(() => {
        L.onMessage(srv, s);
        // 试玩版：创建房间后自动补 3 个机器人，凑够 4 人
        try {
          if (JSON.parse(s).type === 'create' && srv.ctx) for (let i = 0; i < 3; i++) L.onMessage(srv, JSON.stringify({ type: 'addbot' }));
        } catch (e) {}
      }, 0);
    }
    close() { this.readyState = 3; L.onClose(this._srv); }
  };
})();

window.__CASES = [{"id":"ferry","title":"雾中渡轮","tagline":"浓雾锁海，货箱失踪，凶手就在这艘不能靠岸的船上。","difficulty":2,"cover":"coverShip","tone":"cold","brief":"夜里的青屿港，最后一班渡轮“海燕号”载着包括你在内的十个人驶向白礁岛。你是随船公干的海警刑侦顾问，本想在二等舱睡到天亮。二十三点五十分，船长庄国梁敲开了你的门：头等的3号舱里，货主代表方启明被人打死，他押运的那箱价值两千八百万的南洋金珠也不见了。海面起了大雾，能见度不到一百米，雷达屏幕上除了这艘船什么都没有，海事电台说天亮之前谁也不许靠岸。凶手就在船上，货也就在船上。距抵达白礁岛还有四个多小时，船长把船员名单推到你面前：“请你在靠岸前，查出是谁。”","victim":{"name":"方启明","desc":"恒泰珠宝派驻的货主代表，五十六岁，押运一箱南洋金珠去白礁岛拍卖。他俯卧在3号贵宾舱的床脚，后脑被重物击中，身体尚有余温，货箱托架已经空了。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"stern"}},"publicFacts":["货物是一箱38颗南洋金珠，估价约2800万，恒泰珠宝派方启明随船押运，送往白礁岛的春季拍卖会。","除你和死者之外，船上还有八人：船长、大副、轮机员、厨师四名船员，加商人、记者、游客、保险代理人四名乘客。","方启明死在驾驶台正下方的3号贵宾舱，死因是后脑遭钝器重击，死亡时间在22:50至23:48之间。","雾很大，能见度不到一百米，雷达上没有任何其他船只，没有人能从海上上船或离船。","按航行规定，雾中每两分钟鸣一次雾笛，今晚全程没有中断。","3号舱的货箱托架被钥匙打开，货箱已不在舱内。"],"timeline":[{"t":"21:40","text":"“海燕号”离青屿港，海面起雾，雾笛开始每两分钟鸣放一次。"},{"t":"22:50","text":"夜宵结束，方启明回3号舱（多人看见）。"},{"t":"23:48","text":"保险代理人谷明哲去敲3号舱门，无人应，推门发现方启明死亡、货箱不见。"},{"t":"23:55","text":"船长封锁各通道，清点人数：除死者外船上共九人（含你），无人落水，无人下船。"},{"t":"00:10","text":"海事电台通报：大雾不散，渡轮不得靠港，预计04:30抵达白礁岛，警方在岛上接手。"},{"t":"00:20","text":"船长将调查委托给你。"}],"budget":{"search":12,"ask":30},"locations":[{"id":"deck","name":"右舷甲板与救生艇","scene":"deck","desc":"贴着舱壁的狭长右舷甲板，雾水把柚木地板打得又湿又滑，头顶是悬着的救生艇，雾笛的声音在这里震得人耳膜发麻。","clues":[{"id":"c_deck1","title":"救生艇里的货箱","text":"2号救生艇的帆布罩被人掀开一角，里面塞着一只灰色钢制货箱，箱侧喷着“恒泰珠宝”，提手上挂着货运单。箱体铅封编号HT-0472完好无缺，锁孔上没有撬痕，四个角没有磕碰。货运单写着毛重31.0公斤，你抬了抬，分量和单据对得上。"},{"id":"c_deck2","title":"湿甲板上的鞋印","text":"从通向3号舱走廊的舷门起，一串白色橡胶软底鞋的人字纹鞋印一路踩到2号救生艇边，停了一阵，又折向通往驾驶台的铁梯，铁梯第一级也有同款印子，铁梯脚离舷门只有几步。鞋印长约28厘米，步子迈得很大，纹路里已经积了一层细细的雾珠，不是刚踩上去的；舷门口有两三个暗红色的小点，被雾水晕成淡粉。甲板上另有几处深色防滑胶靴的新鞋印，边缘清晰、没有雾珠，有几处直接踩在白色鞋印上面。"},{"id":"c_deck3","title":"栏杆边的电子烟","text":"右舷后段的栏杆边落着一支粉色一次性电子烟，一旁是一团揉皱、被泪水和雾水打湿的纸巾。栏杆湿漉漉的，唯独一小块地方被手肘蹭得干净，像是有人在这里趴了很久；站在这个位置，二十来米外2号救生艇旁的情形看得一清二楚。"}]},{"id":"cabin","name":"3号贵宾舱","scene":"cabin","desc":"驾驶台正下方的一间头等舱，床头灯还亮着，空气里有血腥味和一点姜茶的味道。舱门外就是一条通向右舷的短走廊。","clues":[{"id":"c_cab1","title":"凶案现场","text":"方启明俯卧在床脚地毯上，后脑塌陷，血半凝，身体还有余温。舱门完好，门内插销没有插。床头柜边滚着一把14寸活动扳手，柄上有“E-14”钢印，沾着血。墙边货箱托架上的钢缆锁被正常打开，钥匙还插在锁孔里，托架是空的。门口地毯上落着一支印有“晨潮报”字样的圆珠笔。"},{"id":"c_cab2","title":"带圈的船员名单","text":"公文包里有一份打印的“白礁线夜航船员名单”：船长庄国梁、大副邵远帆、轮机员贺大勇、厨师夏福生。“邵远帆”被红笔圈了两圈，页边是方启明的字迹：“海顺号船长也姓邵。只是巧合？先别声张，看看再说。”“贺大勇”上画着叉，旁注“旧人，避开”。"},{"id":"c_cab3","title":"凉透的姜茶","text":"床头小桌上放着一托盘姜茶，杯子是满的，已经凉透，杯沿没有唇印。托盘垫纸上用圆珠笔写着“23:05 3号 姜茶 夏”。茶杯旁边的烟灰缸里干干净净，没有任何烟头。"},{"id":"c_cab4","title":"手机里的短信","text":"方启明的手机屏幕还亮着，未读短信有三条：汪志达22:12“方总，价钱好商量，抵岸前私下谈？”；谷明哲22:47“解约的事请再考虑到明天，保单千万别在船上签退”；还有一条陌生号码22:20“方先生，聊聊海顺号吧”。公文包里另放着一份打好的解约函，抬头“中泰保险”，尚未签字。"}]},{"id":"engine","name":"机舱","scene":"engine","desc":"船尾下层的机舱，主机轰鸣，热气裹着柴油味扑面而来。一整面墙是工具架，旁边挂着值班日志和登记板。","clues":[{"id":"c_eng1","title":"工具架上的空位","text":"工具架一排挂钩，标签从E-01到E-20，唯独E-14空着。旁边登记板最后一行写着：“E-14 活动扳手14寸 · 18:40 借 · 厨房 夏 · 未还”，其余每一件借出的工具后面都有一个“还”字。"},{"id":"c_eng2","title":"后舱的柴油桶","text":"发电机组后面藏着一只200升的铁桶，软管接在日用燃油柜的放油阀上，桶里装着大半桶柴油，放油阀口还在滴，地上的油渍没干。墙上的值班日志里“23:00 巡检正常”“23:30 巡检正常”两行，笔迹、墨色、笔压完全一样，像是一支笔一口气写下的。"},{"id":"c_eng3","title":"更衣柜里的旧照","text":"轮机员更衣柜的门内侧贴着一张旧合影：码头上十几个穿“恒泰航运”工装的船员，中间的西装男人被红笔画了个叉，下面写着“方启明”。柜底压着一纸解雇通知：“因擅自出售燃油，自即日起解除劳动合同”，三年前的日期，落款是恒泰航运运营部。"}]},{"id":"dining","name":"休息厅与餐厅","scene":"dining","desc":"船腹中部的休息厅，几排固定的沙发和两张餐桌，吧台上还摆着没洗的杯子。舷窗外一片白，只有雾笛隔一阵“呜——”地响一声。","clues":[{"id":"c_din1","title":"桌上的录音笔","text":"靠窗的餐桌上，一支录音笔还在运行，屏幕显示已录四小时，自带时间戳。你拖到23点前后：23:08之前，雾笛声间隔时长时短，在九十到一百三十秒之间；从23:08:15起到23:32:15，每一声整整相隔120秒，分秒不差；23:34之后又变得长短不齐。背景里一直有玻璃杯碰撞声，和一个中年男人酒后含糊的咒骂：“不卖就不卖……什么东西。”"},{"id":"c_din2","title":"记者的剪报簿","text":"桌角的剪报簿里夹着一张三年前十一月的报纸：“渔船‘海顺号’雾夜遭撞沉 四人遇难”，文中写道：“船长邵远洋等四人遇难……肇事货轮疑为恒泰航运‘恒泰7号’，当晚船载自动识别系统中断两小时。恒泰运营部负责人方启明表示‘没有证据’。”页边铅笔字：“方启明现任恒泰珠宝货主代表，本周六押运金珠去白礁。”"},{"id":"c_din3","title":"竞买文件","text":"一只敞口的皮包里是白礁岛春季拍卖会的邀请函和竞买号牌，拍品“南洋金珠一箱”底价2500万。便签上是铅笔字：“上限3000万。拍前私下收货，能压到2200万。”"},{"id":"c_din4","title":"保单副本","text":"一份中泰保险货运险保单的复印件，投保人恒泰珠宝，保额2800万，代理人栏写着“谷明哲”。第九条被荧光笔涂过：“货主于抵岸前单方解约的，代理人须退还全部佣金并承担违约金，其白礁线代理资格自动终止。”"}]},{"id":"hall","name":"驾驶台与海图室","scene":"hall","desc":"船最高处的驾驶台，一圈玻璃外是白茫茫的雾，雷达屏幕上只有一个绿点。后壁是雾笛控制箱，隔壁小间是海图室。","clues":[{"id":"c_hall1","title":"雾笛控制箱","text":"驾驶台后壁的雾笛控制箱，旋钮现在拨在“手动”档，箱面上一块定时器小屏保留着最近一次的运行记录：“AUTO 启动 23:08 · 停止 23:34 · 间隔 120s”。下面的手动拉绳挂在钩上，纹丝不动。"},{"id":"c_hall2","title":"航海日志","text":"当班日志最新一页，字迹是邵远帆的：“23:00 船长离台休息，大副值班。23:15 能见度约80米，航向稳定，雾笛手鸣。23:30 同上。23:50 接3号舱事故报告，封锁各舱。”上一页22:10一行是船长笔迹：“雷达无他船，雾笛手鸣。”"},{"id":"c_hall3","title":"海图室的相片","text":"海图室抽屉最里面压着一张塑封相片：渔船船头并肩站着两个男人，一个穿渔民胶衣，一个年轻些，穿水手制服，两人笑得很用力。背面铅笔写着：“海顺号 · 哥 远洋 / 弟 远帆 · 出海前”。"}]},{"id":"kitchen","name":"厨房","scene":"kitchen","desc":"狭小的船上厨房，灶台上还温着一锅粥，后面有一扇通右舷后甲板的小门，冷库的门贴着一张“鱼肉蔬菜”的标签。","clues":[{"id":"c_kit1","title":"内线点单板","text":"厨房墙上的点单板用粉笔记着：“22:30 大副 咖啡×1（来取）”“23:02 3号舱 姜茶×1”，后面都画了勾，第二条勾的旁边写着“送，夏”。"},{"id":"c_kit2","title":"后门窗台","text":"通右舷后甲板的小门旁，窗台上有一道新鲜的长方形压痕，像是不久前放过一件沉重的铁器；窗台下的案板上摆着半块凿开的冻鱼冰，冰碴还没化干净。"},{"id":"c_kit3","title":"冷库里的纸箱","text":"冷库最里层的纸箱后面，藏着五条没有税票的外烟，封条是外文。纸箱下压着一张便条，是船长的笔迹：“老夏，别带太多，上岛前收好。”"}]}],"suspects":[{"id":"zhuang","name":"庄国梁","role":"“海燕号”船长","age":58,"look":{"skin":"tan","hair":"short","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"uniform","acc":"badge","mood":"tired"},"bio":"“海燕号”船长，在白礁线上跑了十一年，身材矮壮。他说雾夜自己从不离开驾驶台，夜班由他和大副一起守，23:50后封锁了全船。","demeanor":"老海员的粗嗓门，爱说“规矩”，心虚时先清嗓子。","topics":[{"id":"t_role","q":"这条线你怎么管？","a":"白礁线我跑了十一年，船小人少，四个船员当八个用。雾天的规矩只有一条：驾驶台不空人，雾笛不断声。我是船长，出了事我有责任，你要问什么尽管问。"},{"id":"t_watch","q":"23点后你在哪？","lie":true,"a":"驾驶台，从离港站到出事。雾天我从不离台，大副就在我身边帮着拉雾笛，谁都能作证。你别绕我，先去查那些外人。","truth":"我23点就回舱躺下了。血压药一吃人发昏，我对大副说“你顶着，有事叫我”，一觉睡到有人砸门。违规，我认。这话本来想烂在肚子里。"},{"id":"t_horn","q":"雾笛怎么操作？","a":"驾驶台里拉绳，手拉，两分钟一声，拉完看一眼表。后面铁箱里还有个自动档，装了定时器，是给检修准备的，值班不许用，谁用谁违规。"},{"id":"t_mate","q":"你了解大副吗？","needs":["clue:c_cab2"],"a":"邵远帆？两个月前调来的，话少，手脚快，从不叫累。这条夜班线是他自己点名要的，别人嫌雾大都不愿跑，他说不怕。……怎么忽然问起他？"},{"id":"t_foot","q":"这脚印是谁的？","needs":["clue:c_deck2"],"a":"白色软底鞋，甲板部发的，全船只有我和大副穿。我个子矮，脚小，39码，甲板部发的最小号，鞋底才二十六公分出头；你说印子有二十八公分、步子还迈得那么大？那是个大个子，别拿我凑数。再说一句，23:55封舱后下甲板搜查的人，我统一要求换深色防滑胶靴，防滑，白鞋印要是压在胶靴印底下，那就是出事前留的。"},{"id":"t_search","q":"有人下过船吗？","a":"雾里没有船靠过来，我盯过雷达，干干净净。人在船上，货也一定在船上。出事以后我让大副带着搜舱，到现在还没翻出来。"},{"id":"t_vic","q":"方启明跟你说过什么？","needs":["clue:c_kit3"],"a":"登船时他盯着冷库和货舱看，问我“全船有没有不该有的货”，说他的保险条款要求清白。我当他挑刺，可他要是报上去，我这条线就保不住了。……你别这么看我，我一个老头子，杀人？"},{"id":"t_people","q":"乘客你怎么看？","a":"汪老板喝得凶，记者小姐爱往驾驶台张望，小姑娘说晕船，保险那位整晚魂不守舍。四个都像有事，又都不像能下这种死手的人。"}],"confronts":[{"clue":"c_hall2","breaks":"t_watch","a":"他盯着日志上“23:00 船长离台休息”那一行，粗声粗气地咳了一下：“……是我让大副这么写的。年纪大了，遇上雾还吃药，传出去船公司饭碗不保。我是睡了，可我没杀人！”"},{"clue":"c_hall1","a":"他凑近定时器，粗声粗气地问：“谁动了自动档？”随即脸色沉下去，“我23点前碰都没碰过它。要说用，也是要有人在那二十几分钟里，不想被人听见脚步……你自己想。”"},{"clue":"c_deck2","a":"他蹲下去比了比鞋印，又抬起自己的脚：“看清楚，我的鞋没这么长。这印子是个大个子的，我可不背这口锅。”粗嗓门里带着点急。"},{"clue":"c_kit3","a":"“老夏那点私烟，我早知道，睁只眼闭只眼罢了。”他摆摆手，“这跟命案有什么相干？船上缺人，我不想连厨子也赶走。”"},{"clue":"c_cab2","a":"船长接过名单，眉头越皱越紧：“这圈画在邵远帆头上？”他半晌没出声，才低低说，“登船的时候，方先生问过我，大副是哪里人。我当他闲聊。”"},{"clue":"c_hall3","a":"船长看着相片愣住了：“这是他和……他哥？他从没提过家里有人出海。”他把相片翻过来，又翻回去，“这小子，闷得像块石头。”"}],"fallback":"这玩意儿跟我的船没关系，你问点实在的。"},{"id":"shao","name":"邵远帆","role":"“海燕号”大副","age":36,"look":{"skin":"light","hair":"short","hairColor":"black","glasses":"none","beard":"none","outfit":"uniform","acc":"badge","mood":"neutral"},"bio":"“海燕号”大副，两个月前调来，个子很高，话少。他说23点接班后一直守在驾驶台，手拉雾笛，直到23:50接到事故报告才下去。","demeanor":"平静克制，说话简短，条理清楚，被逼到点上才露出一丝冷。","topics":[{"id":"t_role","q":"大副管些什么？","a":"航行值班、货物积载、安全检查。船长年纪大了，夜班多半是我顶。雾天最费神，眼睛要盯雷达，手还得拉雾笛，两分钟一回，不能断。"},{"id":"t_watch","q":"23点后你在哪？","lie":true,"a":"驾驶台，一步没离开。船长回舱休息，我一个人值班，雷达、航向、雾笛全是我一个人在管。","truth":"我离开过驾驶台。23点08分到34分，雾笛调了自动。我下去了——就这些，别的我暂时不想说。"},{"id":"t_horn","q":"雾笛都是你拉的？","lie":true,"a":"每两分钟一声，我亲手拉的。你随便问休息厅里哪个乘客，他们听了一晚上，没断过，也没乱过。","truth":"……不是手拉的。我把控制箱拨到自动，定时器替我鸣笛，一声不差。我需要所有人都觉得，那个拉绳的人一直在驾驶台。"},{"id":"t_deck","q":"你下过甲板吗？","lie":true,"a":"没有。今晚我只在驾驶台和海图室里转，直到23:50接到事故报告，才第一次下到甲板上去，这一点日志里写得清清楚楚。","truth":"下去过。我从右舷铁梯下去，进舷门，再一路走到2号救生艇，原路回来。甲板上那一串鞋印，是我留下的，没什么好赖的。"},{"id":"t_know","q":"你认识方启明吗？","lie":true,"a":"不认识。名单上见过一回，货主代表，仅此而已。我这样的人，一辈子也轮不上和他搭话。","truth":"认识。海顺号上死的四个人里，有我哥邵远洋。我知道方启明是谁。三年了，我等的就是这条线，这样的一场雾。"},{"id":"t_coffee","q":"22:30你在做什么？","a":"下去厨房要了杯咖啡，在后门口站了一会儿，看雾。夏师傅可以作证。怎么，值夜班前喝杯咖啡也有问题？"},{"id":"t_hai","q":"听说过海顺号吗？","needs":["clue:c_din2"],"a":"报纸上看过。三年前雾夜，一条渔船被货轮撞沉，四个人没回来。海边的人都知道这事。你问这个，是想说我什么？"},{"id":"t_foot","q":"这鞋印是你的？","needs":["clue:c_deck2"],"a":"这是甲板部统一发的鞋，船长和我各一双，我天天穿它走甲板，印子不奇怪。至于别人的脚，那是别人的事。"},{"id":"t_box","q":"货箱你怎么看？","a":"偷箱子的人下不了船，肯定还在船上，想等靠岸混出去。我带人搜了两遍舱，没找到。我建议等警方上岛后再全面搜查。"}],"confronts":[{"clue":"c_din1","breaks":"t_watch","crack":true,"a":"他听完那段间隔精确到秒的雾笛录音，手指在袖口上捏紧了一下。“……录音笔。我没想到有人在录。”沉默几秒，他又恢复了平静，“好，我离开过驾驶台。但离开，不等于杀人。”"},{"clue":"c_hall1","breaks":"t_horn","crack":true,"a":"他看着定时器屏幕上“23:08 – 23:34”几个数字，嘴角抽了一下。“这小东西，居然自己记账。”他低声说，“是自动档，我撒了谎。可你证明不了我去了哪里。”"},{"clue":"c_deck2","breaks":"t_deck","a":"“同款鞋，不止我一个人穿。”他说得很稳，目光却落在鞋印纹路里的水珠上，又扫过压在白鞋印上的那几枚胶靴印，“……水珠，还有胶靴。印子比搜舱早。好，我下过甲板。可这串印子里，哪一串是我的，你分得出来么？”"},{"clue":"c_hall3","breaks":"t_know","a":"他看见那张塑封相片，整个人像被冻住了。“……谁让你翻我的抽屉？”声音很低，“照片里是我哥邵远洋。海顺号上死的四个人里有他。”他抬起眼，第一次没有避开你，“方启明不认得这张脸，我认得他。”"},{"clue":"c_cab2","a":"“他在名单上圈我？”大副看着那两道红圈，笑了一下，笑意没到眼底，“一个货主代表要查船员的底，也算尽职。可惜他到死，也没来问我一句。”"},{"clue":"c_din2","a":"他的目光在剪报上停了很久。“邵远洋……”他念这个名字，像在念一个很远的地名，“报道写得不错，没漏一个字。可它漏了一件事：没有人去那片海上给他们烧过一炷香。”"},{"clue":"c_deck1","a":"“箱子在救生艇里？”他语气平淡，“那也许是小偷来不及带走。偷东西的人，总是这样慌。”说完，他自己顿了一下，像是意识到这话说得太顺了。"}],"fallback":"这个我不清楚。如果没有别的事，我还要回去看雷达。"},{"id":"he","name":"贺大勇","role":"“海燕号”轮机员","age":47,"look":{"skin":"brown","hair":"cap","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","mood":"stern"},"bio":"“海燕号”轮机员，在机舱干了二十年，嗓门大，一身柴油味。他说自己整晚守在机舱，直到被船长叫去搜舱。","demeanor":"粗声粗气，爱说“老子”，被问到痛处就梗着脖子。","topics":[{"id":"t_role","q":"机舱归你管？","a":"主机、发电机、舵机，全归我。雾天主机转速不许乱动，我得盯着。老子干了二十年，没出过半点岔子，今晚这事，跟机舱可没关系。"},{"id":"t_where","q":"案发时你在机舱？","lie":true,"a":"一直在，没离开过。23点和23点半各巡一次，日志上白纸黑字，你自己去看，老子的活儿从来干净。","truth":"我在备用舵机舱的行军床上睡着了，喝了二两酒。那两行巡检是我提前一起填的，二十年的老毛病。还有后面那桶柴油，是我偷放了准备卖给岛上渔船的。"},{"id":"t_know","q":"你认识方启明？","lie":true,"a":"不认识，名字都是上船才听说的。货主代表，坐头等的，跟我这种烧油的有什么交集？别往我身上扯。","truth":"认识。三年前我在恒泰航运开货轮，他是运营部的，是他签字把我开除的，罪名是卖油。我恨他，他死了我一滴泪不掉。可我没碰他一根手指。"},{"id":"t_wrench","q":"那把扳手怎么回事？","needs":["clue:c_eng1"],"a":"E-14？十四寸那把，晚上六点四十老夏借去砸冻鱼，一直没还，登记板上写着呢。他拿去厨房，爱放哪儿放哪儿，我可管不了。"},{"id":"t_mate","q":"你和大副熟吗？","a":"新来的，话少。每回下机舱检查都一副要把我写进报告的样子。船上的人，我只信自己的扳手，可偏偏我的扳手也丢了。"},{"id":"t_vic","q":"他死了你怎么想？","needs":["clue:c_eng3"],"a":"死了干净。你要问我高不高兴，老子不装：高兴。可是动手？我这把年纪，没了那份工，再杀个人，还想不想活了？"},{"id":"t_other","q":"你觉得谁可疑？","a":"那个姓汪的，喝酒时一直盯着货箱，眼神像要吃人。还有那记者，鬼鬼祟祟。至于我们自己人，老子不乱说。"}],"confronts":[{"clue":"c_eng2","breaks":"t_where","a":"他的脸一下涨红了，嗓门更大。“谁让你翻老子的桶！”吼完又泄了气，“行，行，我睡了，巡检是假的。偷柴油卖给渔船，老子认；杀人，老子不认！”"},{"clue":"c_cab2","breaks":"t_know","a":"他盯着名单上画在自己名字上的叉和“旧人，避开”四个字，鼻子里喷出一口粗气。“呵，他倒还记得我。好，我认识他。他毁了我一辈子，可你拿这个说我杀他？”"},{"clue":"c_eng3","breaks":"t_know","a":"“谁让你开老子的柜子！”他伸手要夺，又停住，“照片是三年前的。那张解雇书我一直留着，想有一天拍他脸上。就这样，没别的。”"},{"clue":"c_kit2","a":"“这窗台的印子？”他冷笑，“那就是老夏那傻子放扳手的地方。拿我的工具当他的锅铲，活该丢。”"},{"clue":"c_deck1","a":"“箱子在救生艇里，封条还在？”他摸摸下巴，“偷东西的人，会把东西扔在救生艇里？老子在船上二十年，没见过这么蠢的贼。”"}],"fallback":"这玩意儿老子没见过，别拿来烦我。"},{"id":"xia","name":"夏福生","role":"“海燕号”厨师","age":52,"look":{"skin":"light","hair":"bald","hairColor":"grey","glasses":"none","beard":"none","outfit":"apron","mood":"worried"},"bio":"“海燕号”厨师兼杂工，圆脸，胆子小。他说自己整晚在厨房收拾，没离开过，也没怎么见过方先生。","demeanor":"絮絮叨叨，话多，一紧张就搓围裙，爱先说“我可没……”","topics":[{"id":"t_role","q":"你在船上做什么？","a":"我就是个做饭的，夜里一锅粥一碟小菜，伺候这几位祖宗。船上四个船员当八个用，我连擦甲板都得兼。出了命案，我晚上睡觉都要抱着锅盖了。"},{"id":"t_tea","q":"你去过3号舱吗？","lie":true,"a":"没有没有，我一直在厨房，3号舱那头我连脚都没往那边迈。夜宵之后我就没见过方先生。","truth":"我去了，一次。23点05分，他点了姜茶，我送过去，他开门接了盘子，人好好的，脸色有点沉。我怕说出来，被当成最后一个见他的人，就一口咬死没去。"},{"id":"t_cold","q":"冷库里放什么？","lie":true,"a":"鱼、肉、青菜，满满当当，都是船公司的公家东西。冷库里冷得很，你要看随便看，不过可别冻着了。","truth":"……还有五条外烟，是我私带上岛卖给码头工人的。老庄知道，没往上报。被查到要罚钱，我心虚，就没说。"},{"id":"t_wrench","q":"扳手是谁用的？","needs":["clue:c_eng1"],"a":"贺师傅那把十四寸的？下午我借来砸冻鱼，用完随手搁在后门窗台上，想着晚点还。后来就找不着了。我还以为被风刮到海里去了呢。"},{"id":"t_back","q":"晚上谁到过后门？","needs":["clue:c_kit2"],"a":"后门？只有大副。二十二点半他下来要咖啡，端着杯子在后门口站了好一阵，对着雾发呆，嘴里还嘀咕什么“雾真好”。我当他说胡话。"},{"id":"t_vic","q":"方先生是什么人？","a":"挑剔得很。嫌姜茶烫，嫌船晃，嫌我的窗台没擦干净。不过他给过我一百块小费，所以我不怨他。"},{"id":"t_late","q":"之后你做了什么？","a":"我收拾锅碗，二十三点半给汪老板送了碗醒酒汤，之后听到有人喊，才知道出事。我吓得腿都软了，菜刀都拿不稳。"}],"confronts":[{"clue":"c_kit1","breaks":"t_tea","a":"“……啊，写在板上了。”他盯着自己的名字，围裙搓得更凶，“我是怕呀！我送茶的时候他明明还好好的，就是脸色沉，像在等什么人。我真没害他！”"},{"clue":"c_cab3","breaks":"t_tea","a":"他看了那杯凉茶，后退半步：“那是我端去的……我进去的时候他还活着，真的。他说‘放那儿吧’，就把我关在门外了。”"},{"clue":"c_kit3","breaks":"t_cold","a":"“啊呀别……”他一个箭步想挡，又不敢，“五条，就五条！我给老庄看过，他睁只眼闭只眼。真的就是烟，不是什么要紧东西。你们千万别写进报告！”"},{"clue":"c_eng1","a":"“扳手？我借的……后来找不着了……”他吓得声音发飘，“那玩意儿是凿冰的啊！谁会拿它去……我可没想过会这样！”"},{"clue":"c_cab1","a":"他只扫了一眼那把扳手的描述就捂住了嘴：“E-14……是我借的那把！天爷，我的冰锤怎么会……我真的放在后门窗台上了！”"}],"fallback":"我可没碰过这个，真的，你别吓我。"},{"id":"wang","name":"汪志达","role":"珠宝批发商","age":49,"look":{"skin":"tan","hair":"slick","hairColor":"black","glasses":"none","beard":"none","outfit":"suit","acc":"pocketwatch","mood":"sly"},"bio":"做珠宝批发的商人，受邀去白礁岛参加拍卖会，是方启明这批货的潜在竞买人。他说夜宵一散就回舱睡了。","demeanor":"爱叫“兄弟”“老板”，笑里藏刀，喝了酒大舌头，被抓包就哈哈打圆场。","topics":[{"id":"t_role","q":"你来岛上做什么？","a":"做了二十年珠宝批发，南洋金珠这种货，一年也就见一回。拍卖会请我，我当然要去看看。货好价合适，什么都能谈，哈哈，这是行规。"},{"id":"t_night","q":"案发时你在哪？","lie":true,"a":"夜宵一散我就回舱睡了，白天赶路累坏了，一觉睡到被人喊起来。我可没出过舱门，老板你放心。","truth":"我没睡，我在休息厅喝闷酒，一直喝到23点40分以后。刚被方启明骂出来，心里窝火，又不想让人知道我低三下四去求过人家，才撒谎。喝得迷迷糊糊，谁进谁出我都没留意。"},{"id":"t_offer","q":"你和方启明谈过吗？","lie":true,"a":"没谈过，拍卖会上才打交道。他这种货主代表，拍卖前不肯见竞买人，这是规矩，兄弟你不会不懂吧。","truth":"谈了。夜宵后快到23点，我敲了他的门，想拍前私下收货，现金，开价两千二百万。他骂我坏规矩，把我撵走。我气不过才喝了一晚上。可我没杀他，货都没了，我拿什么赚？"},{"id":"t_price","q":"你的上限是多少？","needs":["clue:c_din3"],"a":"上限三千万，底价两千五，我自己心里有数。拍场上谁出得高谁拿货，私下谈能压到两千二，行价嘛，懂行的都知道。你拿这个说我杀人？可笑。"},{"id":"t_hear","q":"你听到什么动静？","a":"我那会儿迷迷糊糊的，隐约听见外头“咚”一声闷响，像什么重东西落到甲板上，大概23点二十分前后，我以为是浪。雾笛倒是一直响，响得我脑袋疼。"},{"id":"t_who","q":"你觉得是谁干的？","a":"要我说，是船上懂货的人。夜宵的时候，那个保险的和方先生在桌边小声吵，脸色难看得很。先查他，别查我这种老实生意人。"},{"id":"t_pearl","q":"金珠到底值多少？","a":"三十八颗，每颗品相都是顶级，行里报价七十万上下一颗，加起来两千六七百万。丢了，谁都心疼，我也心疼，不是我的货，是行业的损失。"}],"confronts":[{"clue":"c_din1","breaks":"t_night","a":"他听着录音里自己含糊的咒骂，脸上的笑一下子挂不住了。“嘿……兄弟，我这嗓子啊，喝多了就爱自言自语。”他挠挠头，“好吧，我没睡，我在这儿喝了一晚上。”"},{"clue":"c_cab4","breaks":"t_offer","a":"“哎呀，这短信……”他尴尬地笑，“兄弟，生意人都这样，哪个竞买人不想拍前拿货？这个数，好商量嘛。他骂我，我认；杀人？杀人我图什么？”"},{"clue":"c_din3","a":"“我的竞买号牌，上限价，你也翻出来了。”他哈哈笑了两声，却没笑到眼底，“这种东西放包里，就是怕被人看见底牌。看见了也没用，我可没处理那箱货。”"},{"clue":"c_deck1","a":"“箱子找到了？”他眼睛一亮，又立刻收敛，“封条还在？那就好，那就好。三十八颗一颗不少的话，拍卖会还办得成……我是说，替方先生高兴。”"}],"fallback":"嗨，兄弟，这东西我不懂，哈哈，你别拿来吓唬我。"},{"id":"su","name":"苏晴","role":"《晨潮报》记者","age":31,"look":{"skin":"light","hair":"ponytail","hairColor":"black","glasses":"round","beard":"none","outfit":"jacket","acc":"scarf","mood":"tired"},"bio":"《晨潮报》的记者，说自己去白礁岛做民宿专题。她整晚在休息厅写稿，桌上的录音笔一直开着。","demeanor":"语速快，爱追问，先观察你的反应，被刺到就反问“你们警察不也这样吗”。","topics":[{"id":"t_why","q":"你为什么上这班船？","lie":true,"a":"去白礁岛做民宿专题，海岛慢生活嘛。夜渡便宜，还能写点“雾中航行”的素材，一举两得。","truth":"我是冲着方启明来的。我追三年前海顺号撞沉案追了两年，听说他本周押运金珠，才订了这班夜渡。我想在船上堵他，当面问他要一个答案。"},{"id":"t_night","q":"案发时你在做什么？","lie":true,"a":"休息厅打字，一直没挪地方。录音笔就在桌上，你可以放来听：雾笛、人声、杯子响，全是证据。","truth":"23点35分，我离开了七八分钟。想去敲他的门，门虚掩着，我推开一条缝，看到他躺在地上，血……我吓得跑回来，把这当没发生过。我怕被当成凶手。"},{"id":"t_hai","q":"海顺号是怎么回事？","needs":["clue:c_din2"],"a":"三年前十一月，雾夜，白礁外海。渔船“海顺号”被一艘大货轮撞沉，四人遇难，货轮没停，自动识别系统中断两小时。我查到是恒泰7号，那晚的运营负责人就是方启明，他改过航行记录。"},{"id":"t_family","q":"遇难者家属呢？","needs":["clue:c_din2"],"a":"邵远洋有个亲弟弟，出事时在外海跑船，没赶回来。我写信、打电话都找不到人，听说后来他去考了航海证，上了哪条船，没人知道。"},{"id":"t_record","q":"录音笔为什么开着？","a":"职业习惯，也想录点雾笛声当片头。结果成了一晚上的“监控”。里面有雾笛、杯子碰撞，还有汪老板自己嘀咕。你尽管听。"},{"id":"t_other","q":"你觉得谁可疑？","a":"保险那位，整晚魂不守舍，电话响了三回都不敢接。再有就是轮机员，听说我是记者，脸一下子就黑了。其他人我不好说。"}],"confronts":[{"clue":"c_din2","breaks":"t_why","a":"她看着自己摊开的剪报簿，叹了口气：“被你翻到了。是，我不是来写民宿的。我花了两年追这件事，就为了今晚当面问他一句。他死了，我反倒成了最有动机的人，你说好笑不好笑？”"},{"clue":"c_cab1","breaks":"t_night","a":"她盯着那支“晨潮报”圆珠笔，咬了咬嘴唇：“我的笔……我慌得连笔掉了都没发现。”声音在发抖，“我进去过，只看了一眼，什么都没碰。我要是说了，你会信我吗？”"},{"clue":"c_cab4","a":"她盯着“聊聊海顺号吧”那一行，沉默了几秒：“那是我发的，22点20分。他没回。我想当面谈，又怕他躲，所以先发了条短信试他。就这一条，别的我没碰。”"},{"clue":"c_cab2","a":"“他圈了船员……”她凑近看，“邵？我追的报道里，那个遇难的船长也姓邵。巧合吗？……我从没往这条线想过。”"},{"clue":"c_hall3","a":"她看见相片背面的字，睁大了眼睛：“海顺号，远洋，远帆……这是——”她捂住嘴，半天才说，“我找了他两年。他居然就在这条船上。”"}],"fallback":"这个跟我的稿子没关系。你要采访我，得先说清楚想问什么。"},{"id":"lin","name":"林小满","role":"独自出游的游客","age":24,"look":{"skin":"fair","hair":"bob","hairColor":"brown","glasses":"none","beard":"none","outfit":"hoodie","acc":"earrings","mood":"sad"},"bio":"刚失恋的年轻游客，一个人去白礁岛散心。她说自己晕船，吃了药，整晚蜷在休息厅沙发上睡觉。","demeanor":"年轻，爱用网络口头禅，“真的假的”“我人傻了”，一紧张语速飞快。","topics":[{"id":"t_role","q":"你来岛上做什么？","a":"我就是个普通游客，请了年假去海岛散心。结果你看，被甩、晕船、还撞上命案，我今年是不是该去庙里转转？真的假的，我人傻了。"},{"id":"t_night","q":"案发时你在哪？","lie":true,"a":"沙发上睡觉啊，晕船晕得想死，吃了药，整个人昏昏沉沉，什么都没听见，什么都没看见，真的，有一说一。","truth":"我骗人了。我偷偷溜出休息厅，去右舷栏杆那边抽电子烟，躲着哭，大概23点10分到23点半。船上禁烟，我也不敢说自己跑到了头等舱那一侧。"},{"id":"t_saw","q":"你在外面看到了什么？","needs":["clue:c_deck3","ask:lin.t_night"],"a":"……行吧，反正你都捡到我的电子烟了。我趴在栏杆上，看见二十多米外有个高个子，穿白衬衫，肩膀上有杠杠，抱着个方方的大箱子往救生艇那边走。雾太大看不清脸，我以为是船员在搬货，就没在意。"},{"id":"t_height","q":"那人有多高？","needs":["ask:lin.t_saw"],"a":"比我高一个头吧，我一米六五。肩膀很宽，走得很稳。船长？不，我看那个船长挺矮的，不太像。"},{"id":"t_sound","q":"你听见什么声音？","a":"雾笛“呜——”一直响，吵死了。不过我记得它有一阵特别准，每隔一会儿一声，像闹钟。后来不知道哪个时候，又变得乱乱的。"},{"id":"t_boy","q":"你一个人去海岛？","a":"嗯，本来是两个人的行程，机票酒店都订了，他临时说不去了，我就自己来了。你问这个干嘛，人家心情很差的。"},{"id":"t_who","q":"你怀疑谁？","a":"我哪知道啊，我只知道那个商人老是喝酒，那个记者老是盯着人看，轮机员一脸凶相。大叔们都怪怪的，我可不敢乱说。"}],"confronts":[{"clue":"c_deck3","breaks":"t_night","a":"她“啊”了一声，伸手想去抢那支电子烟，又缩回来：“那是我的……行行行我承认，我出去了！我真的就是去哭的，我不是小偷，也不是凶手，我真的会谢……”"},{"clue":"c_deck2","a":"“那串鞋印？”她歪头看，“我穿的是运动鞋，花纹是波浪的，不是这种人字纹。你不信，我现在就脱鞋给你看。”"},{"clue":"c_deck1","a":"“箱子……就是我看到的那个？”她捂住嘴，“我当时还以为那人是搬货呢。我是不是该早点说？可我说了，就得先说我偷偷出去了啊。”"},{"clue":"c_cab1","a":"她听完现场的描述，脸一下白了：“我不敢看。我真的什么都没看到，我只是想一个人emo一会儿。”"}],"fallback":"这个我真的不知道，救命，别问我。"},{"id":"gu","name":"谷明哲","role":"保险代理人","age":41,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"worried"},"bio":"中泰保险白礁线货运险的代理人，随船监督这批金珠的运输。是第一个发现方启明死亡的人，说自己只是去核对封条。","demeanor":"客客气气，话里全是条款，紧张时反复推眼镜，爱说“按规定”。","topics":[{"id":"t_role","q":"你来船上做什么？","a":"我是中泰保险的货运险代理人，这批金珠由我们承保，保额两千八百万。按规定我要随船监督，确保封条、锁和押运人员都符合条款。"},{"id":"t_rel","q":"你和方启明关系如何？","lie":true,"a":"很融洽啊，客户和代理人的关系，没有任何摩擦，他也很配合我们的条款要求，一切都是按规定办的。","truth":"不融洽。他要在到岸前书面解约，换一家保险。第九条写着，那样我要退清佣金还要赔违约金，这个季度就完了。我晚上去求过他，吵得很凶。"},{"id":"t_last","q":"最后一次见他是？","lie":true,"a":"夜宵的时候，之后我就没再见过他了，一直到23点48分我去找他，按规定核对封条，才发现出了事。","truth":"22点35分我去过他的舱，求他别解约，吵了十分钟。我出来时，他还好好的，冷笑着说“随你便”。我不敢说，怕你们把我当成有动机的人。"},{"id":"t_find","q":"你怎么发现的？","a":"23点48分，我想再劝他一次，顺便核对封条，敲门没人应，一推门就开了。他趴在地上，货箱不见了。我腿都软了，大喊着去找船长。走廊上我没看见别人。"},{"id":"t_seal","q":"封条是什么情况？","needs":["clue:c_deck1"],"a":"HT-0472，我们公司的封条，启运前我亲手打的，编号和单据一致。封条完好，说明箱子没被打开过。至于偷箱子的人为什么不开箱，我不便揣测。"},{"id":"t_value","q":"金珠值多少钱？","a":"每颗七十万上下，三十八颗，连包装运费，保额按两千八百万算。出险理赔流程繁琐，我们公司最怕这种海上案件，前后要查一年，我怎么可能盼着出事。"},{"id":"t_who","q":"你怀疑谁？","a":"汪老板吧，他想私下压价，谁都知道。还有那位记者，打听方先生很久了。船员我不敢说，毕竟我要靠他们把我平安送上岸。"}],"confronts":[{"clue":"c_din4","breaks":"t_rel","a":"他推了推眼镜，手指在复印件上打滑：“第九条……您连这个都看过了。”笑容僵住了，“对，我有动机，我知道。可保险人最怕的就是出险，货丢了我只会更惨，我杀他图什么？”"},{"clue":"c_cab4","breaks":"t_last","a":"他看着手机屏幕上自己发的那条“再考虑到明天”，肩膀塌了下来：“……我去过他舱里，是22点35分。吵了十分钟，我走的时候他还好好的。我不敢说，怕你们把我当凶手。”"},{"clue":"c_cab3","a":"他看着那杯凉透的姜茶，摇头：“我22点35分去的时候，桌上还没有这杯茶。……我是说，我是说我什么都没动过。”"},{"clue":"c_deck1","a":"“箱子找到了！”他几乎喊出来，又压低声音，“封条编号对吗？请务必拍照留证，我们公司需要证据留存，按规定，一个细节都不能漏。”"}],"fallback":"按规定，这个我不便评论，请出示相关条款。"}],"solution":{"culprit":"shao","method":{"q":"凶手是怎样制造“案发时他一直在驾驶台”的假象的？","options":["船长替他作证，说他整晚都和自己在一起。","趁雾笛由手拉改成自动档，离开驾驶台下去行凶，再把货箱藏进救生艇伪装成抢劫。","让轮机员替他在驾驶台值班，自己下去行凶。","从舷窗爬进3号舱，作案后沿舷外缆绳逃回驾驶台。"],"correct":1},"motive":{"q":"凶手为什么杀人？","options":["为了抢夺价值2800万的金珠，货箱只是暂时藏起来。","方启明发现他走私，要向船长告发，他被迫灭口。","三年前海顺号被撞沉的幕后责任人正是方启明，凶手是遇难船长的弟弟，为兄复仇，抢劫只是障眼法。","方启明解约会让他丢掉保险代理的工作。"],"correct":2},"keyClues":["c_deck1","c_deck2","c_cab2","c_hall1","c_din1","c_din2"],"truth":["凶手是大副邵远帆。他三年前在雾夜失去了哥哥：渔船“海顺号”被货轮“恒泰7号”撞沉，船长邵远洋等四人遇难，当时恒泰航运的运营负责人方启明改写了航行记录，否认撞船。邵远帆改行跑船，两个月前主动调上白礁线，专挑夜班，等的就是今晚这样的浓雾。","抢劫是幌子。他把抢来的货箱藏进2号救生艇的帆布罩下，封条完好，什么也没少。他要的不是珍珠，而是让所有人把目光投向“窃贼”，掩盖这是一场针对方启明的复仇。","诡计是雾笛。23点船长吃药回舱，邵远帆独自值班。22点半他在厨房后门顺手拿走厨师搁在窗台上的14寸扳手；23点08分他把雾笛控制箱拨到自动档，让定时器每120秒替他鸣一次笛，自己沿右舷铁梯下去，以“核对货物封条”为由敲开3号舱，用扳手重击方启明，取钥匙打开托架钢缆锁，抱箱子到2号艇藏好，23点34分回驾驶台把雾笛调回手动。他赌的是这二十几分钟雷达上不会出现别的船。全船的人听到的雾笛“从没断过”，于是都以为他一直守在驾驶台。","破绽有四处：录音笔里23:08:15起到23:32:15的雾笛整整
