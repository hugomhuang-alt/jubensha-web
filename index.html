相隔120秒，说明那段时间是自动档；控制箱定时器记着“AUTO 23:08 – 23:34”，而他的航海日志却写“雾笛手鸣”；右舷湿甲板上有一串28厘米的甲板鞋印，从3号舱舷门通到救生艇再回驾驶台铁梯，船长脚小，只有高个子大副对得上，鞋印还压在23:55后搜舱人员的胶靴印底下，门口的暗红血点也说明是行凶当时留下的；游客林小满还在栏杆边见过一个穿白衬衫带肩章的高个子抱着方箱子。","动机的线索来自方启明的名单和苏晴的剪报：名单上“邵远帆”被圈出，旁注“海顺号船长也姓邵”；剪报写明遇难船长是邵远洋；海图室抽屉里的相片背面写着“哥 远洋 / 弟 远帆”。","红鲱鱼各有各的秘密：汪志达想私下压价被骂走，躲在休息厅喝闷酒；贺大勇被方启明开除过，今晚睡着并假填巡检、偷放柴油；谷明哲因为方要解约而去求过他；苏晴追海顺号案，23点35分去堵方，见到尸体吓得逃回；夏福生送过姜茶，还私藏外烟；船长违规回舱睡觉；林小满在栏杆边抽电子烟，成了唯一的目击者。他们都撒了谎，但没有一个人杀人。"]}},{"id":"lastdish","title":"最后一道菜","tagline":"美食评论家执金匙尝下第一口，七分钟后倒地不起。","difficulty":2,"cover":"cover","tone":"warm","brief":"今晚是第五届“金匙奖”青年厨师大赛的决赛夜，澜庭酒店二楼宴会厅灯火通明。二十点零五分，终局菜上桌，主评宋怀瑾执金匙尝下第一口，七分钟后捂着喉咙倒地，二十点五十八分抢救无效。警方陈队长把你请来：现场八个人，个个说自己与此无关，个个又都和死者有点什么。酒店已被封锁，所有人都被留在楼里，主桌、后厨、酒窖、门厅、露台和组委会办公室都向你开放。你二十一点三十分到场，桂花与酒酿的甜香还没散尽，水晶灯下，那把金匙静静躺在桌上。","victim":{"name":"宋怀瑾","desc":"58岁，《食界》专栏作家，业内公认的“美食评论教父”，金匙奖主评兼组委会监事。以毒舌和较真闻名，传说他一句话能让一家店关门。二十点十二分在主桌突然倒地，二十点五十八分宣布不治。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"goatee","outfit":"suit","acc":"bow","mood":"neutral"}},"publicFacts":["第五届金匙奖青年厨师大赛决赛夜，地点澜庭酒店二楼宴会厅；评审团由宋怀瑾（主评）、季雅芝、蒋德厚三人组成。","终局菜是决赛选手韩大勇的“桂花酒酿炖蛋”；按大赛传统，主评手执“金匙”第一个品尝。","医生初步判断宋怀瑾死于急性重度过敏反应（过敏性休克）；剩余菜品已被警方封存待检。","宋怀瑾的重度花生过敏记载在《评委接待须知》里；组委会称三天前已要求后厨撤下一切花生制品。","酒店监控只覆盖大堂与后厨走廊，宴会厅内没有摄像头。","八名相关人员均被留在酒店内等候询问。"],"timeline":[{"t":"18:30","text":"晚宴开席，评委与来宾入席。"},{"t":"19:40","text":"后厨巡礼开始，持续约十五分钟。"},{"t":"20:05","text":"终局菜上桌，宋怀瑾执金匙尝下第一口。"},{"t":"20:12","text":"宋怀瑾突然捂住喉咙倒地，同桌呼救。"},{"t":"20:14","text":"酒店驻场保健员赶到施救，只有基础急救设备，没有备肾上腺素；120已接到报警。"},{"t":"20:31","text":"救护车到达，宋怀瑾被送往医院；20:58宣布抢救无效。"},{"t":"21:30","text":"警方封锁酒店，你受邀到场。"}],"budget":{"search":12,"ask":30},"locations":[{"id":"dining","name":"宴会厅主桌","scene":"dining","desc":"二楼宴会厅，圆形主桌上餐具还没撤，倒地时碰翻的椅子歪在一边，水晶灯亮着，空气里残留着桂花与酒酿的甜香。","clues":[{"id":"c_din1","title":"金匙与锦盒","text":"桌上的蓝丝绒锦盒敞着，里面躺着那把镀金的“金匙”，勺面留着一层薄薄的油亮，凑近能闻到烤花生似的油香；锦盒白缎内衬靠勺柄处有一小块深色油渍。同桌另两位评委面前是普通银勺，勺面干干净净。"},{"id":"c_din2","title":"椅脚的笔与小包","text":"宋怀瑾倒地处的椅脚旁，地毯上落着一支灰色圆筒形注射笔，笔身印着“TRAINER 演示用”；拔掉蓝色保险帽，笔头没有针，管内是空的。椅背上挂着他的牛皮随身小包，拉链半敞，里面只有一张塑封卡片：“重度花生过敏，发病请立即注射肾上腺素并呼叫120”。"},{"id":"c_din3","title":"直播回放","text":"媒体席手机支架上，简小满的手机还停在直播后台，镜头对着主桌。回放里19:44:10，一名身穿黑色西装、盘发、颈挂红色工牌绳的女士侧身走近宋怀瑾的座位，蹲下约一分钟，手伸向椅边的小包，19:46离开画面。19:47，白发的蒋德厚从画面左侧走回自己的座位坐下。"}]},{"id":"kitchen","name":"后厨与备餐间","scene":"kitchen","desc":"酒店二楼后厨，不锈钢灶台还留着余温，备餐台上摆满空盅，墙上贴着今晚的菜单和各类清单。","clues":[{"id":"c_kit1","title":"留样与油品单","text":"备餐台上的留样盅里是终局菜“桂花酒酿炖蛋”的备份份量，旁边的食品检测试纸条显示阴性。墙上的油品清单写着：本场仅用菜籽油与橄榄油，花生油与一切坚果已于三天前撤出，厨师长和卫生员在清单下签了字。"},{"id":"c_kit2","title":"传菜单","text":"传菜单上写着：“20:05 主桌4盅，另附金匙1把——仅限主评宋位，其余三盅配普通银勺。”底下一行小字：“金匙盒由组委会钟总监19:08亲手送至传菜口，领班收存，待20:05随终局菜一并上桌。”"},{"id":"c_kit3","title":"储物柜里的剪报","text":"韩大勇的更衣柜门内侧贴着一张发黄的报纸剪报，标题是宋怀瑾三年前的评论《灵魂已死的一碗面》，“不必再开下去了”一行被红笔画了三道线。柜里还挂着一件熨得笔挺的新厨师服，胸口绣着“决赛”。"}]},{"id":"cellar","name":"酒窖","scene":"cellar","desc":"酒店地下的恒温酒窖，橡木桶与酒架排成长廊，尽头靠墙嵌着一只带双锁的保险柜，存放仪式用的金匙和名酒。","clues":[{"id":"c_cel1","title":"保险柜登记簿","text":"保险柜旁的登记簿写着：“18:30 贺明 擦净金匙，封盒入柜”；“19:05 钟岚 取金匙，仪式用”。柜子是双锁，只有贺明与钟岚各持一把钥匙。两行之间没有任何别的签名。"},{"id":"c_cel2","title":"暗格里的私账","text":"酒架后的暗格里塞着一本小账本和一叠现金，账本记着几笔“私售”，其中一行：“19:00 露台 方总 老年份红 4800 现金”。字迹是侍酒师贺明的。"},{"id":"c_cel3","title":"水槽边的瓶盖","text":"酒窖角落的小水槽边，排水口旁有一枚小号塑料螺旋瓶盖，盖内壁一圈油渍，闻上去有一股烤花生的香味。水槽台面有一道被匆忙抹过的痕迹；水槽下的筐里塞着一块白色擦银布，布面干净，没有油味。"}]},{"id":"hall","name":"门厅与衣帽间","scene":"hall","desc":"酒店二楼的门厅，设有签到桌、前台值班席和衣帽间，大理石地面被夜里的雨水带进来几行湿脚印。","clues":[{"id":"c_hall1","title":"后厨巡礼签到表","text":"门厅桌上的“后厨巡礼”签到表，19:40一栏签满了名字：宋怀瑾、季雅芝、韩大勇、方鸿业、简小满，以及各媒体和组委会工作人员。蒋德厚、秦川两行空白。组委会一栏钟岚名字旁，手写着“留场，核对颁奖流程”。"},{"id":"c_hall2","title":"外套口袋的纸条","text":"衣帽间寄存的宋怀瑾深灰大衣，右口袋里有一张折成四折的便笺，是女人的字迹：“笔带好，别逞强，也别又跟人吵。——雅”。左口袋里是一张酒店房卡和半包润喉糖。"},{"id":"c_hall3","title":"门厅值班本","text":"前台的记录本上写着：“17:28 厨师韩大勇求见评委休息室，17:52 离开”；“19:36 宋先生助理秦川出门接电话，19:52 返回”。后一页贴着便利贴：“大堂监控只拍到门厅与后厨走廊，宴会厅内无镜头。”"}]},{"id":"garden","name":"露台花园","scene":"garden","desc":"宴会厅外的露台花园，夜里下过雨，石板湿亮，长椅和花盆沿着围栏排开，远处是城市的灯光。","clues":[{"id":"c_gar1","title":"碎成片的撤资函","text":"露台花盆的泥土里埋着被撕碎的信纸，拼起来是一封“关于终止金匙奖冠名赞助的函”，抬头是澜庭酒店集团，落款处只有打印的“方鸿业”三字，没有签名，日期是今天。"},{"id":"c_gar2","title":"花盆后的红酒","text":"花盆后塞着一瓶标签泛黄的红酒，瓶颈上贴着酒窖的编号条。瓶下压着一张手写收条：“老年份红 4800，当面点清——贺”。"},{"id":"c_gar3","title":"粉丝签名本","text":"长椅上落着一本粉红色签名本，扉页上是宋怀瑾下午写的字：“给小满：好好吃饭，别只好好拍。”下一页是没写完的采访提纲，第一行画了颗星：“今晚一定要请宋老师讲讲他的第一碗面”。"}]},{"id":"study","name":"组委会办公室","scene":"study","desc":"宴会厅旁临时腾出的组委会办公室，桌上堆着流程表和奖杯盒，墙角的饮水机还在咕嘟咕嘟冒泡。","clues":[{"id":"c_stu1","title":"废纸篓里的快递","text":"办公桌下的废纸篓里躺着一个拆开的快递袋和一只撕烂的纸盒。面单：收件人“金匙奖组委会 钟岚”，品名“过敏急救笔演示训练套装（无针无药）×1”，下单日期10月9日。盒内空了。"},{"id":"c_stu2","title":"带批注的发票","text":"办公桌上压着一份复印的发票对账单，“场地宣传费 380,000 元”同一金额出现了两次，开票日期相差三天。页边是宋怀瑾的蓝黑钢笔字：“重复。今晚颁奖前与钟谈。不谈，致辞里我说。”"},{"id":"c_stu3","title":"评委接待须知","text":"桌角的《评委接待须知》，宋怀瑾那一页被红框标出：“重度花生过敏，随身携带肾上腺素笔，菜品须无花生及花生油。”下方“已知悉”处签着：钟岚、秦川。"}]}],"suspects":[{"id":"zhong","name":"钟岚","role":"赛事执行总监","age":41,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"suit","acc":"earrings","mood":"smile"},"bio":"金匙奖组委会执行总监，筹办了五届大赛，也是金匙仪式的主持人。当晚统筹全场流程，宋怀瑾倒下时她在主桌旁待命，第一个叫了救护车。","demeanor":"温和干练，爱说“您放心”；被追问时语速变慢，先反问一句。","topics":[{"id":"t_role","q":"你在晚宴上负责什么？","a":"流程、嘉宾、评委接待，还有金匙仪式，都归我。宋老师是我们的主评，也是组委会监事，合作五年，对细节近乎苛刻。今天这样……我到现在手还是凉的。"},{"id":"t_allergy","q":"他过敏的事你知情吗？","a":"知道。接待须知上写得清清楚楚，重度花生过敏。所以三天前我就通知后厨，花生、花生油一概撤场，每道菜单都是我逐条审的。谁想得到，还是出了这种事。"},{"id":"t_tour","q":"19:40后厨巡礼你在哪？","lie":true,"a":"我跟着大家去的呀，评委、嘉宾、媒体，一大队人挤在后厨里，韩师傅还给大家讲了蛋羹。您放心，问谁都行，我全程都在。","truth":"我没去。我“留场”核对流程，其实是等所有人都走空。我走到宋老师的座位边，蹲下，把他小包里的东西换了。我只有那几分钟。"},{"id":"t_spoon","q":"金匙是怎么送到主桌的？","lie":true,"a":"19:05我按规矩从酒窖保险柜取出，19:08直接交给传菜领班，盒子我连扣都没开过。仪式用的东西，我哪敢乱动。","truth":"我开了盒子。在酒窖水槽边，我把随身带的一小瓶带花生味的油抹在勺面，又擦了擦，扣好盒子才送出去。金匙只有他一个人用，别人谁也碰不着。"},{"id":"t_pen","q":"那支训练笔是你订的？","lie":true,"needs":["clue:c_stu1"],"a":"训练笔？我们办公室买的都是办公用品，急救用品我从没订过。大概是哪个同事随手网购的快递，丢进了我的纸篓吧。","truth":"是我订的，十月九号。真笔我换下来，丢进了酒店后院的垃圾箱。我只想他到了那一刻，手里是一支按不出东西的笔。"},{"id":"t_money","q":"那笔38万宣传费怎么回事？","lie":true,"needs":["clue:c_stu2"],"a":"宣传费发票早处理好了，宋老师就是例行问问，会后坐下来说清楚就行，没什么好谈的，更谈不上威胁。","truth":"不是例行。三十八万我挪去给母亲还手术费和欠债，发票开了两遍。宋老师要在颁奖致辞里点我的名，我五年的心血、一辈子的名声，全都没了。"},{"id":"t_suspect","q":"你觉得是谁干的？","a":"我不想乱猜。可韩大勇和宋老师的旧怨，整个圈子都知道，那道菜又是他做的。我只是希望警方好好查查那道蛋羹。"},{"id":"t_collapse","q":"他倒下时你在做什么？","a":"我站在主桌侧面，看见他捂着喉咙，从包里摸出一支笔往大腿上按，按了好几下，脸色一点点变白。季老师在喊，我立刻打了120。那几分钟，真的像一辈子。"}],"confronts":[{"clue":"c_hall1","breaks":"t_tour","a":"她看着签到表上自己写的那一行，停了停。“……是，我写的“留场”。我说我去了巡礼，是我说错了，当时太乱，您别抓这个字眼。”她的笑僵了一下，眼神却往门口飘。"},{"clue":"c_din3","breaks":"t_tour","crack":true,"a":"她盯着回放里那个蹲下去的侧影，很久没有说话。“这个角度……看不清脸。”声音忽然哑了，“可那条红挂绳，除了组委会，没有别人戴。我……我认。”"},{"clue":"c_din1","breaks":"t_spoon","crack":true,"a":"“油……”她轻声重复，手指无意识地绞着工牌绳。“金匙每年都擦得干干净净，怎么会……”话没说完，她闭上眼，“这味道，我熟。我就知道，你们总会闻到。”"},{"clue":"c_cel1","a":"“登记簿上是我的字，19:05，没错。”她强作镇定，“可取出来就是取出来，我没打开。”说到最后一句，她抬头看了您一眼，没敢多停，立刻低下头。"},{"clue":"c_cel3","breaks":"t_spoon","a":"她的视线落在那枚小小的瓶盖上，嘴唇动了动。“我……水槽边洗手，也许是谁掉的。”可这句话说得又轻又快，连她自己都没信，指尖已经冰凉。"},{"clue":"c_stu1","breaks":"t_pen","crack":true,"a":"“我的名字。”她把面单看了一遍又一遍，肩膀慢慢垮下来。“我以为纸篓里的东西，早上保洁会收走的。人算不如天算，我连垃圾都没处理干净。”她笑了一下，笑得很难看。"},{"clue":"c_din2","breaks":"t_pen","a":"“训练笔……”她的目光像被烫了一下。“宋老师倒下时，我看着他一遍遍地按。”她捂住嘴，声音发颤，“我在旁边，看着，什么也没说。我当时……怎么能什么都没说。”"},{"clue":"c_stu2","breaks":"t_money","a":"她看着那行蓝黑钢笔字，苦笑出声。“不谈，致辞里我说。他一向说到做到。”她抬起头，眼里全是红血丝，“我妈的手术等不了，您说，我能怎么办？”"},{"clue":"c_kit1","a":"“终局菜是干净的，我早说过。”她很快接话，语速比平时快，“所以我才觉得蹊跷。可您拿出来给我看，是想告诉我什么呢？”"},{"clue":"c_hall2","a":"“季老师还给他写纸条。”她微微一怔，轻轻笑了一下，“真好。他至少有个人，提醒他把笔带好。”那句话说得很平静，平静得有点不对劲。"}],"fallback":"您放心，这件事我没什么好补充的，需要什么材料，我让人给您送过来。"},{"id":"han","name":"韩大勇","role":"决赛选手·主厨","age":45,"look":{"skin":"tan","hair":"cap","hairColor":"black","glasses":"none","beard":"stubble","outfit":"apron","acc":"badge","mood":"stern"},"bio":"金匙奖决赛选手，终局菜“桂花酒酿炖蛋”的主理人。三年前他的老店“韩记小馆”因宋怀瑾的一篇差评关门。当晚他主要待在后厨备菜。","demeanor":"嗓门大、直来直去，激动时爱拍灶台，骂人不拐弯。","topics":[{"id":"t_role","q":"你的终局菜是什么？","a":"桂花酒酿炖蛋。蛋要蒸得像凝住的月光，桂花是我老家带来的。这道菜我练了两年，就想让人尝一口，知道韩记没有死。"},{"id":"t_met","q":"决赛前你见过宋怀瑾吗？","lie":true,"a":"没有。我一个进决赛的厨子，躲评委还来不及，哪敢去找他。规矩我懂，评委那边的门，我连走过都绕着走。","truth":"见过。下午五点半，我去了评委休息室，求他这回公平一点。他一句“你的汤，还是老样子”，我就炸了，拍着桌子说“你再毁我一次，我跟你没完”。可我只是吼，没动手。"},{"id":"t_grudge","q":"你恨他吗？","a":"恨过。他写“灵魂已死”那四个字，我店里的客人一天比一天少，半年就关了门。可我今晚是来拿冠军的，把牌子重新挂上去。杀了他，我还有什么脸站在这里？"},{"id":"t_dish","q":"你的菜里有花生吗？","a":"没有！钟总监三天前就通知花生和花生油全部撤场，我连酱料都重新备过，这道菜每个步骤我的助手都盯着。有什么毛病你们尽管去验。"},{"id":"t_oil","q":"后厨的油是怎么管的？","needs":["clue:c_kit1"],"a":"灶上只有菜籽油和橄榄油，花生油的桶三天前就被搬走了，我连一滴都不敢留。这是我干厨子以来最干净的一回后厨，谁要往里栽，门都没有。"},{"id":"t_zhong","q":"巡礼时钟总监在吗？","needs":["clue:c_hall1"],"a":"没有。我带队走的时候，她没跟上来。我还纳闷，她平时最爱跟在评委后面拍马屁……不是，拍照的。今晚居然没影。"},{"id":"t_collapse","q":"宋怀瑾倒下时你在哪？","a":"我在后厨，听到传菜员喊“出事了”，冲出去看到宋老师倒在地上，我脑子一片空。第一个念头，是我的蛋羹毁了。我手都软了。"}],"confronts":[{"clue":"c_hall3","breaks":"t_met","a":"他盯着值班本上自己的名字，咬紧牙关。“行，我去过。”他一拳砸在灶台上，“可我是去求他，不是去杀他！我骂了他两句，也就这样了。”"},{"clue":"c_kit3","a":"他看到那张剪报，脸色一下变了。“你连我的柜子都翻。”片刻后他苦笑，“对，我留着，每天看一遍，咽不下这口气。可气和杀人，是两码事。”"},{"clue":"c_kit1","a":"“阴性。”他念着试纸条，长长吐了口气，“我就知道我的菜没问题。”随即又一愣，“那……东西是怎么进他嘴里的？”眉头皱成了一团。"},{"clue":"c_din1","a":"他凑近看了看勺面，鼻翼动了动。“这味道……绝对不是我厨房里的。”他猛地抬头，“金匙是组委会给的，我碰都没碰过它！”"},{"clue":"c_stu2","a":"“三十八万？”他嗤了一声，“我连三千块的食材费都是借的。这种数目，我听了都肉疼。”他摇摇头，“这些人的账，我看不懂。”"}],"fallback":"这玩意儿跟我有啥关系？我就是个做菜的，别拿我开涮。"},{"id":"fang","name":"方鸿业","role":"冠名赞助商","age":57,"look":{"skin":"light","hair":"slick","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"smirk"},"bio":"澜庭酒店集团董事长，金匙奖冠名赞助商，坐在贵宾席，晚宴期间主要在应酬各路嘉宾，与评委席隔着两桌的距离。","demeanor":"商人腔，爱用“生意归生意”“我很忙”，被戳到就拔高嗓门。","topics":[{"id":"t_role","q":"你为什么赞助金匙奖？","a":"做品牌嘛。五年下来投了四百多万，酒店的名字跟着金匙奖一起红。今年又追加了一笔宣传费，是钟总监申请的。花钱我不怕，我怕花得糊涂。"},{"id":"t_talk","q":"今晚你和宋怀瑾说过话吗？","lie":true,"a":"没有。他是评委，我是赞助商，避嫌嘛。一整晚我连他的杯子都没碰过，更别说说话。你们不必在这上头费工夫，我跟他没有交集。","truth":"说过。十八点五十，他在门厅拦住我，拿着一张发票问我那笔宣传费三十八万是不是真的花在了场地上。我说我只管付钱。他说颁奖前会让钟岚自己说清楚，不然他替她说。我当场就火了，说那我撤资。"},{"id":"t_grudge","q":"你和宋怀瑾有过节吗？","a":"他骂过我们酒店的餐厅，说“味同嚼蜡”。我在饭局上笑着说“宋老师高见”，回去摔了一只杯子。生意人，不能跟评论家记仇，可也没法真的忘。"},{"id":"t_where","q":"19:40你在哪？","a":"跟大家去后厨巡礼了。韩师傅讲他的蛋羹，我还拍了几张照，这是我酒店办的活动，我怎么能不去？"},{"id":"t_pull","q":"你真想撤资吗？","needs":["clue:c_gar1"],"a":"信我写了，没发，撕了。那是气话。金匙奖办了五年，我不想它砸在一笔烂账上。……不过现在人没了，撤不撤也没意义了。"},{"id":"t_zhong","q":"你觉得钟岚这个人怎么样？","needs":["clue:c_stu2"],"a":"能力一流，五年来大小事全是她一个人扛。可那笔钱……我现在有点后悔，当初没多问一句。她人缘好，大家都信她，所以谁也没细查。"},{"id":"t_collapse","q":"宋怀瑾倒下时你在哪？","a":"我在贵宾席，听见季老师喊“笔！笔！”，回头看见他一个劲儿往大腿上按那支笔，什么都没发生。场面吓人，我生意场上混这些年没见过。"}],"confronts":[{"clue":"c_gar1","breaks":"t_talk","a":"他盯着拼好的信纸，冷哼了一声，又泄了气。“……好吧，我跟他吵过。我是写了撤资函，写完就撕了。我这人嘴硬，心里有数。”"},{"clue":"c_stu2","a":"他把对账单看了一遍，眉毛越皱越深。“同一笔钱开了两次？”他倒吸一口凉气，“我付了一次，另一次是谁的？这事我得回去查。”"},{"clue":"c_gar2","a":"“那瓶酒是我买的，”他不耐烦地摆手，“跟命案有什么关系？酒店内部的规矩，您别乱传出去。”说完又压低声音，“就当没看见，成吗？”"},{"clue":"c_hall1","a":"他扫了一眼签到表，指着自己那行说：“看，我签了。这个我没骗您，十九点四十我就在后厨，还跟韩大厨合了影。”"}],"fallback":"这个我不清楚。我很忙，没空盯着每件小事。"},{"id":"ji","name":"季雅芝","role":"评委·美食作家","age":54,"look":{"skin":"light","hair":"bob","hairColor":"silver","glasses":"round","beard":"none","outfit":"dress","acc":"necklace","mood":"sad"},"bio":"金匙奖评委之一，著名美食作家，宋怀瑾的前妻，两人离婚十年。当晚与宋同坐主桌，宋倒下时她就在他身边。","demeanor":"说话慢，爱用比喻，提到前夫时先停顿，再冷冷地补一句。","topics":[{"id":"t_role","q":"你和宋怀瑾是什么关系？","a":"前夫。二十年婚姻，离了十年。这一行很小，躲不开，所以每年金匙奖我们还是坐在同一张桌子上，互相挑刺，倒像老搭档。"},{"id":"t_relation","q":"你们离婚后还联系吗？","lie":true,"a":"除了评审场合，没有。离婚之后各过各的，十年没打过一个私人电话。我们之间早就是两条河，不往一处流了。","truth":"有。他孤身一人，我是他的紧急联系人，每月至少一通电话。每年冬天我还提醒他换笔。我嘴上说不联系，是怕别人觉得我还放不下他。"},{"id":"t_will","q":"听说他的遗产……","needs":["clue:c_hall2"],"a":"律师说，他把老房子和版权都留给了我。我听到的时候哭了。你们怀疑我，我懂。可我若是为钱，十年前离婚就拿了，何必等到今天？"},{"id":"t_allergy","q":"你知道他过敏吗？","a":"知道。结婚二十年，我陪他进过三次急诊。今天我还特地去问过钟岚菜单有没有花生，她说早撤干净了。所以他倒下时，我第一反应就是喊“笔！笔！”。"},{"id":"t_dish","q":"那道蛋羹你吃了吗？","needs":["clue:c_kit1"],"a":"吃了，温润干净，真的好。我和蒋老都吃了，什么事也没有，我们用的是普通银勺，只有他一人用金匙，那是他每年的专利。所以我不信是菜的问题。"},{"id":"t_pen","q":"他倒下时那支笔呢？","needs":["clue:c_din2"],"a":"他从包里摸出笔，往大腿上按，咔哒，咔哒，咔哒，什么也没有。那么空的声响，我再不想听第二遍。那支笔是去年冬天换的新的，他不会弄错。"},{"id":"t_collapse","q":"他倒下前有什么异常？","a":"他尝了第一口，说“好”，还眯着眼笑了。没多久，也就七分钟吧，他忽然抓住自己的脖子，脸涨得通红。人的样子，原来可以变得这么快。"}],"confronts":[{"clue":"c_hall2","breaks":"t_relation","a":"她把那张便笺接过去，指尖微微发抖。“我的字。”她深吸一口气，“我撒谎了。他去哪儿都忘带东西，我就是……见不得他一个人。”她别过脸去，眼泪还是掉了下来。"},{"clue":"c_din2","a":"她盯着那支灰色的笔，脸色倏地白了。“这不是他的笔，”她一字一顿，“他的笔是白色保险帽。谁，是谁换了它？”声音抖得几乎站不稳。"},{"clue":"c_stu3","a":"她看了一眼“已知悉”下的签名，冷笑一声。“写得这么清楚，还能出事。看来有些人，是看懂了的。”她抬眼看你，目光冰凉。"},{"clue":"c_kit3","a":"“大勇？”她摇头，“他是恨，我不否认，可他恨的是宋怀瑾的嘴，不是人。我见过他在后厨为一碗汤哭。他杀不了人。”"},{"clue":"c_stu2","a":"她盯着“致辞里我说”那几个字，慢慢点了点头。“他就是这脾气，认死理，不留余地。”片刻后，她轻声补了一句：“可是这样的人，会有人受不了的。”"}],"fallback":"这个我帮不上忙。我只想知道，是谁把他变成了这样。"},{"id":"jian","name":"简小满","role":"美食博主","age":24,"look":{"skin":"light","hair":"ponytail","hairColor":"brown","glasses":"none","beard":"none","outfit":"hoodie","acc":"headset","mood":"worried"},"bio":"百万粉丝的美食博主，受邀坐媒体席，当晚全程开直播。宋怀瑾是她的偶像，下午还给她签过名。她的直播间当晚同时在线两万多人。","demeanor":"语速快，爱说“哇”“真的假的”，紧张时口头禅是“我发誓”。","topics":[{"id":"t_role","q":"你今晚来做什么？","a":"直播啊！金匙奖决赛夜，同时在线两万多人。我还想请宋老师讲讲他的第一碗面，做一期专访。结果……我发誓，我从没想过会这样。"},{"id":"t_live","q":"你的直播一直是你本人在盯吗？","lie":true,"a":"当然！我全程守在机位旁，从头到尾没离开过。我发誓，直播间的每一帧我都亲眼看着，一点岔子都没有。","truth":"没有……巡礼时我把手机留在支架上继续开着，自己跟着去了后厨。酒店规定后厨不许拍，我怕被抓，就没说。我发誓，这跟命案真的没关系。"},{"id":"t_fan","q":"你和宋怀瑾熟吗？","a":"我是他的小迷妹！下午他在休息室门口给我签名，写了“好好吃饭，别只好好拍”，我感动得差点哭。他是真的很好的人。"},{"id":"t_heard","q":"你有没有听到过争吵？","a":"有！下午五点半，在评委休息室门口，我听到韩大厨拍桌子，说“你再毁我一次，我跟你没完”。我吓死了，赶紧溜了。我发誓，我只听到这一句。"},{"id":"t_stream","q":"回放里的女士你认得吗？","needs":["clue:c_din3"],"a":"我也是刚看到！背影看不清脸，不过那条红挂绳，只有组委会的人才戴，我们媒体的是蓝色的。哇，我的直播居然拍到了这个，我手都在抖。"},{"id":"t_book","q":"这本签名本是你的？","needs":["clue:c_gar3"],"a":"是我的！落在露台了，我巡礼完去那儿透气，大概掉了。里面是我想问宋老师的问题，我都没来得及问……真的假的，他怎么就这么走了。"},{"id":"t_collapse","q":"宋怀瑾倒下时你在做什么？","a":"我在媒体席举着手机拍菜，忽然听见季老师尖叫。我吓得把手机都扔了，后来才想起来，直播间两万人都看到了，我发誓我不是故意的……"}],"confronts":[{"clue":"c_din3","breaks":"t_live","a":"她吓得小声叫起来：“被拍到了吧！”接着缩了缩脖子，“是，我走了，手机留着开着。我发誓，后厨我就待了十分钟，别告诉酒店。”"},{"clue":"c_hall1","a":"“我签了名！”她指着自己那一行，“你看，我真的去了。可是我的手机……哎呀，反正我去了。”她越说越小声，耳朵都红了。"},{"clue":"c_gar3","a":"“我的本子！”她眼睛一亮，又黯下去，“宋老师写的字，我舍不得擦。现在……我连这一页都不敢看了。”她把本子抱在胸口，眼泪啪嗒掉了下来。"},{"clue":"c_kit3","a":"“韩大厨的剪报……”她捂住嘴，“他说过三年前那篇评论毁了他。可他今天抱着蛋盅手都在抖，我看见了。不像是会下手的人，我发誓。”"}],"fallback":"啊？这个我真没看见。我发誓，我要是知道就第一个告诉你了。"},{"id":"he","name":"贺明","role":"侍酒师","age":32,"look":{"skin":"light","hair":"sidepart","hairColor":"brown","glasses":"none","beard":"none","outfit":"vest","acc":"bow","mood":"neutral"},"bio":"澜庭酒店的侍酒师，负责酒窖和仪式用器的保管，金匙平时就锁在他看管的保险柜里。当晚他大部分时间在酒窖当值。","demeanor":"讲究，说话轻声细语，爱先报时间，被问到钱会下意识擦手。","topics":[{"id":"t_role","q":"你负责什么？","a":"酒窖里所有的酒和仪式器具。金匙是金匙奖的象征，每年只在颁奖夜用一次，平时锁在保险柜里，我一个月擦它两回，比擦我自己的皮鞋还勤。"},{"id":"t_vault","q":"谁能打开保险柜？","a":"两把钥匙，我一把，钟总监一把。每次取放都要在登记簿上签字，这是酒店的规矩。十八点三十，我亲手擦净金匙、封盒入柜。"},{"id":"t_stay","q":"晚宴开始后你离开过酒窖吗？","lie":true,"a":"没有。金匙是我的责任，我连洗手间都不敢去。十八点三十封盒之后，我一直守在酒窖里，没有人进来过。","truth":"我离开了。十八点五十五分，方总私下约我送一瓶老年份红酒到露台，现金交易，违反酒店规定。我十九点十五分才回酒窖。我怕丢饭碗，所以撒了谎，其实那二十分钟我什么也没看到。"},{"id":"t_new","q":"金匙仪式一直这样吗？","a":"不是。以前是主评自己拿勺子，今年钟总监说要“有仪式感”，才改成用锦盒呈上，还安排了她亲自去取。我当时还想，她倒是上心。"},{"id":"t_clean","q":"金匙交出去前是什么状态？","needs":["clue:c_cel1","clue:c_din1"],"a":"十八点三十擦过，一点油星都没有，这是规矩。银器一旦沾了油味，评委的舌头会先认出来。我擦完是亲眼看着勺面干干净净才封盒的。"},{"id":"t_log","q":"19:05是谁取走了金匙？","needs":["clue:c_cel1"],"a":"钟总监，登记簿上是她的字。我回酒窖已经十九点十五分，柜子锁好了，簿子也签好了，我没多想。她有钥匙，取东西本来就名正言顺。"},{"id":"t_collapse","q":"听说宋怀瑾出事，你怎么想？","a":"我吓了一跳。酒窖里的东西我最熟，那一刻我满脑子只想，这事跟我的酒、我的器具有没有关系。我擦东西从来干干净净，这点我敢拿饭碗担保。"}],"confronts":[{"clue":"c_gar2","breaks":"t_stay","a":"他看着酒瓶和收条，嘴角抽了抽。“……好吧，那是我的字。我十八点五十五分出去过，二十分钟。我只是卖了瓶酒，没碰过别的。”他擦着手，声音越说越小。"},{"clue":"c_cel2","breaks":"t_stay","a":"他看到暗格被翻开，脸一下子白了。“你们都找到了。”他苦笑，“私卖酒是要被开除的。可我发誓，我走开的这二十分钟，只是送了酒，没有别的。”"},{"clue":"c_cel1","a":"“就是这样，两行字。”他指着登记簿，“十八点三十我，十九点零五钟总监，中间没有别人签字。双锁，钥匙就我和她各一把。”说到“我和她”，他自己愣了一下。"},{"clue":"c_cel3","a":"他拿起瓶盖闻了闻，眉头一皱。“这是花生味的油。酒窖里怎么会有？”他环顾四周，“我绝对没把这东西带进来，我连花生都不吃。”"},{"clue":"c_hall1","a":"“签到表？”他摇头，“我没去巡礼，我在酒窖，至少，大部分时间在。”他舔了舔嘴唇，“您别再追问我哪一段不在，行吗？”"}],"fallback":"这个……不是我管的范围，我对此一无所知。"},{"id":"qin","name":"秦川","role":"宋怀瑾助理","age":28,"look":{"skin":"light","hair":"short","hairColor":"black","glasses":"rect","beard":"none","outfit":"shirt","acc":"badge","mood":"tired"},"bio":"宋怀瑾的私人助理，跟了他三年，负责行程、饮食和用药。当晚坐在宋后排，宋倒下时第一个冲过去。","demeanor":"语速快，条理清楚，被问到私事时爱低头看手机。","topics":[{"id":"t_role","q":"你替宋怀瑾做什么？","a":"行程、稿件、饮食，还有他的药。他过敏又健忘，所有细节都得我替他记。三年了，我连他哪天想吃甜哪天想吃咸都能猜到。"},{"id":"t_where","q":"19:40你在哪？","lie":true,"a":"一直在宴会厅，坐在宋老师后排。他去巡礼，我也跟在后面，寸步不离。助理的本分就是这样。","truth":"我不在。十九点三十六分我出门到大堂外接了个电话，是猎头来的。宋老师下午说年底不续约，我得为自己找后路。十九点五十二分才回来。我撒谎，是怕丢了这份工作的名声。"},{"id":"t_pen","q":"他的药谁在管？","a":"我管。今天下午五点，我检查了他的肾上腺素笔：白色保险帽，药液澄清，效期都对，放进他的牛皮小包里，让他随身带。那时候它是真的，我敢拿手发誓。"},{"id":"t_fired","q":"他对你好吗？","a":"他骂人是出了名的。今天下午他说合同年底不续了，还说我“记不住该记的事”。我气了一下午。可那只是一份工，不是仇，我不会拿一个人的命去赌。"},{"id":"t_ask","q":"有谁打听过他的过敏？","a":"有。上周钟总监在群里问我宋老师过敏的具体情况，说要报酒店备案。我就把接待须知上写的都告诉她了，她还说“放心，我们这边一定万无一失”。"},{"id":"t_seen","q":"包里的笔你认得吗？","needs":["clue:c_din2"],"a":"这支灰色的？不对！我装的是白色保险帽的真笔，这支印着 TRAINER，我从没见过。有人换了它，除了拿它的人，没有别的解释。"},{"id":"t_collapse","q":"宋怀瑾倒下时你做了什么？","a":"我冲过去，看到他一直在按那支笔，我喊“你按了吗”，他点头，满脸是汗。那一刻我才发现，笔是空的。他看我那一眼，我忘不掉。"}],"confronts":[{"clue":"c_hall3","breaks":"t_where","a":"他盯着值班本，手机屏幕在掌心里亮了又灭。“……好吧，我出去了十六分钟。”他长出一口气，“我就是想给自己找个出路，没想到偏偏是这十六分钟。”"},{"clue":"c_hall1","a":"“我那栏是空的。”他自嘲地说，“我不是去巡礼，我是在门外面接电话。要早知道，我宁可不接那通电话。”声音沙哑，眼眶红了。"},{"clue":"c_stu3","a":"他看着自己的签名，沉默了一会儿。“我签的，钟总监也签了。须知是我整理给她的，她还说谢谢我。”他忽然抬头，“你是说……”后半句却咽了回去。"},{"clue":"c_hall2","a":"“季老师的纸条。”他苦笑，“其实宋老师把它带到休息室给我看过，嘴上说烦，没舍得扔。”"},{"clue":"c_din3","a":"他看回放时脸色越来越难看。“蹲在他座位边……手伸向包。”他攥紧拳头，“那是我的位置，那是我的活。我走开十六分钟，就被人钻了空子。”"}],"fallback":"这个我不清楚，我只记得和宋老师有关的那些事。"},{"id":"jiang","name":"蒋德厚","role":"评委·餐饮耆宿","age":68,"look":{"skin":"light","hair":"bald","hairColor":"white","glasses":"round","beard":"mustache","outfit":"jacket","acc":"pocketwatch","mood":"smile"},"bio":"金匙奖评委，三十年老饕，餐饮界老前辈，与宋怀瑾斗了三十年嘴。当晚同坐主桌，宋倒下时他就坐在宋的右手边。","demeanor":"慢悠悠，爱讲“想当年”，耳朵偶尔“背”，一提吃就来劲。","topics":[{"id":"t_role","q":"你评审多少年了？","a":"三十一年了！想当年我评审，一碗面能吃出师傅是哪一年入的行。现在年轻人的手艺，进步是进步，可那股“气”，差了点。"},{"id":"t_tour","q":"后厨巡礼你去了吗？","lie":true,"a":"去了去了！从头到尾，韩师傅炒的那一锅锅气，我现在还记得。我这个年纪，哪能错过后厨？","truth":"没去。我膀胱不好，十九点四十就去了洗手间，出来在走廊里歇了一会儿，不好意思说。十九点四十七分才回座位。你们年轻人别笑，老了就是这样。"},{"id":"t_saw","q":"那段时间主桌边有人吗？","needs":["clue:c_hall1"],"a":"十九点四十七分前后，我看到一个穿黑西装、盘着头发、胸前挂红绳牌的女人，从我们桌边匆匆走开。我当时以为是服务员，没在意。现在想想，她走得挺快的。"},{"id":"t_dish","q":"你吃了那道蛋羹吗？","needs":["clue:c_kit1"],"a":"吃了！舀了一大勺，好得很，到八十岁我还想天天吃。用的是普通银勺，金匙是宋怀瑾的专利，每年只有他碰。吃完什么事儿也没有。"},{"id":"t_rival","q":"你和宋怀瑾关系如何？","a":"老对手，斗了三十年嘴，他骂我“守旧”，我骂他“浮夸”。他走了，我才发现没人跟我吵架了。……昨天还说要请我吃他新发现的老面馆，这个老东西。"},{"id":"t_bag","q":"他的小包你留意过吗？","needs":["clue:c_din2"],"a":"我回座位的时候，他椅背上的包拉链是敞着的。我还想，这老宋，丢三落四，包都不拉好。现在想想，真是……"},{"id":"t_collapse","q":"宋怀瑾倒下时你看到什么？","a":"我就在他右手边。他尝了一口，笑着说“好”，没多久抓着脖子往后仰。他按着笔看着我，嘴里喊“笔”。吃了一辈子席，头一回见人倒得这么快。"}],"confronts":[{"clue":"c_hall1","breaks":"t_tour","a":"他看着自己那一行空白，不好意思地摸了摸光头。“……好吧，我没去。别笑话我，老头子的毛病。”他叹了口气，“但我可没坐着不动，回来时真看到了人。”"},{"clue":"c_din3","breaks":"t_tour","a":"他凑近屏幕，眯着眼看了半天。“啊？你说什么？……这白头发的是我，对吧？”他指着屏幕，“我是从洗手间回来的，没去后厨，别笑话。那个蹲着的女人，我走回来的时候她刚走。”"},{"clue":"c_din2","a":"他看着那支灰笔，摇摇头。“他的真笔我见过，是白的。这支不是。”他叹了口气，“老宋啊，你怎么到最后，连支笔都没守住。”"},{"clue":"c_kit2","a":"“金匙单独给他一人？”他点头，“对，传统。每年都是他先尝，我们陪衬。我从来没觉得有什么，现在想来……”他说不下去，摇了摇头。"}],"fallback":"这个我没留意，人老了，记性不如从前。"}],"solution":{"culprit":"zhong","method":{"q":"凶手怎么让宋怀瑾丧命？","options":["在终局菜里掺入花生制品，由主厨韩大勇动手","把致敏的油抹在只有他使用的金匙上，并趁人不备把他随身的急救肾上腺素笔换成无针无药的训练笔","在他的酒杯里下药，再装成过敏发作","往他的餐巾和座椅上涂抹致敏物，再藏起他的急救笔"],"correct":1},"motive":{"q":"为什么杀人？","options":["被宋怀瑾的差评毁掉前程，报复","为了继承宋怀瑾留下的房子和版权","宋怀瑾查出她重复开票、挪用三十八万宣传费，准备在颁奖致辞前揭发","宋怀瑾下午宣布年底不再续约，怀恨在心"],"correct":2},"keyClues":["c_din1","c_din2","c_kit1","c_hall1","c_stu1","c_stu2"],"truth":["凶手是金匙奖执行总监钟岚。宋怀瑾死于花生过敏，可真正的杀招有两层：一是勺子，二是笔。菜没有问题，致敏物在只有他一个人使用的金匙上；救命的肾上腺素笔，被换成了一支按不出东西的训练笔。","先说菜。后厨的留样试纸是阴性，油品清单上没有花生油，季雅芝、蒋德厚用普通银勺吃了同一道蛋羹，安然无恙。韩大勇有动机、有旧怨，又是做菜的人，全场先怀疑他，这正是钟岚想要的。","再说勺。登记簿上，金匙十八点三十被贺明擦净入柜，十九点零五分被钟岚用自己的钥匙取走，两行之间没有别人。她在酒窖水槽边把带花生味的油抹到勺面，水槽边留下了瓶盖；十九点零八分她把锦盒送到传菜口，传统上只有宋怀瑾用金匙，所以别人谁也没事。","然后是笔。宋怀瑾的小包挂在椅背上，里面本来是秦川十七点检查过的真笔。十九点四十后厨巡礼，钟岚谎称自己随队，实则“留场核对流程”；十九点四十四分，简小满忘关的直播拍下一位红挂绳、盘发的黑西装女士蹲在宋的座位边，约一分钟后离开，蒋德厚十九点四十七分回座，正好撞见她匆匆走开。她用十月九日网购的无针无药训练笔换走了真笔。宋怀瑾倒下时一遍遍地按，什么也没发生；驻场保健员手边没有肾上腺素，他就这样耗了四十多分钟。","其他人的谎言都有无辜的解释：韩大勇隐瞒下午去求过宋、吵了一架；方鸿业隐瞒曾因发票被宋逼问、撕过撤资函；季雅芝隐瞒仍是他的紧急联系人和遗嘱受益人；秦川隐瞒在门外接猎头电话；简小满隐瞒把手机留在支架上；贺明隐瞒私卖酒；蒋德厚隐瞒去了洗手间。他们的谎，都只是想护住自己的小秘密。","动机藏在办公室。“场地宣传费”三十八万元被重复开票，钱被钟岚挪去支付母亲的手术费和欠债。宋怀瑾作为监事查出这笔账，在复印件上批：“重复。今晚颁奖前与钟谈。不谈，致辞里我说。”钟岚不想让五年的心血、一辈子的名声毁在颁奖致辞里，于是选择让他永远开不了口。"]}},{"id":"library","title":"闭馆之后","tagline":"百年馆庆的酒会正热闹，三楼善本室里少了一册宋刻，多了一具尸体。","difficulty":2,"cover":"cover","tone":"cold","brief":"十月十五日夜，江州大学怀德图书馆办完百年馆庆酒会，一楼大厅的灯刚熄，三楼传来了坏消息：古籍部主任方敬之教授倒在善本室里，那里的门会自动落锁，外人进门要刷卡。保卫处的老耿在电话里语无伦次，只说“书丢了，人也没了”。你是校方悄悄请来的调查人，学校不想让这事先上新闻。你赶到三楼，善本柜门敞着，一函宋刻不知去向，屋里满是旧纸和樟脑的味道。楼下，八个人被留在各处等你问话，每个人都有一点不想说的事。你有十二次搜证机会，三十次发问。","victim":{"name":"方敬之","desc":"61岁，江州大学教授、古籍部主任，在馆里工作了三十多年，被发现倒在三楼善本室的长桌旁，后脑遭重击，身旁有一把沾血的黄铜镇尺。","look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"vest","mood":"neutral"}},"publicFacts":["方敬之，61岁，古籍部主任，当晚在三楼善本室加班，没有参加一楼的馆庆酒会。","善本室房门自动落锁，外面进入必须刷卡，里面有出门按钮；室内禁带手机和饮料。","持有善本室门卡的只有少数人：方敬之、馆员、保安、修复师和馆长。","死因是后脑被黄铜镇尺重击；失窃的宋刻本《颐斋诗话》估价数百万元。","当晚酒会嘉宾约四十人，包括文学院院长闻立群、校友捐赠人康颂文等。","三楼走廊监控因检修停用；门禁系统只记录刷卡和门磁开合。"],"timeline":[{"t":"19:30","text":"一楼大厅馆庆酒会开场。"},{"t":"19:48","text":"门禁日志：方敬之刷卡进入三楼善本室。"},{"t":"20:00","text":"各阅览室闭馆，读者陆续离馆，酒会继续。"},{"t":"21:30","text":"酒会散场，嘉宾离开。"},{"t":"22:03","text":"馆员贺德昌刷卡开启善本室，发现方敬之倒地，已无呼吸。"},{"t":"22:10","text":"校保卫处报警。"},{"t":"22:20","text":"初步勘查：善本柜门敞开，宋刻本《颐斋诗话》不见踪影。"}],"budget":{"search":12,"ask":30},"locations":[{"id":"lib","name":"三楼善本室","scene":"library","desc":"恒温恒湿的小库房，长桌、善本柜和一股旧纸味。进门要换鞋套戴手套，门自动落锁，里面有出门按钮。尸体已被抬走，现场用白线圈着。","clues":[{"id":"c_lib1","title":"门禁日志打印","text":"善本室读卡器导出的日志：19:48 刷卡进入（方敬之）；门磁记录 19:55 开、19:56 关，无刷卡；20:19 开—关，无刷卡；20:31 开—关，无刷卡；22:03 刷卡进入（贺德昌）。页脚小字：门内出门按钮开门不记录刷卡，只记录门磁开合。"},{"id":"c_lib2","title":"敞开的善本柜","text":"长桌旁的地上用白线圈着方敬之倒下的位置；据勘查，他后脑有凹陷伤，一把黄铜镇尺落在桌脚，端头沾血。靠墙的善本柜门敞开，钥匙还插在锁上，锁孔没有撬痕。第二层有个空位，一只深蓝色函套敞着口，套内是空的，签条写着“宋刻本《颐斋诗话》”。"},{"id":"c_lib3","title":"使用登记簿","text":"长桌上的登记簿，最后一行是方敬之的笔迹：“10/15 19:50 取出 K-0231 周怀瑾遗稿（蓝布面手抄本）供比对”，归还栏空着。柜里标着 K-0231 的格子是空的，桌面上只有一副摊开的老花镜，没有任何稿本。"},{"id":"c_lib4","title":"三楼值班台记录","text":"值班台的访客登记表：19:52 林慕白（访问学者），事由“拜访方教授”，20:02 退出；20:00 之后再无新增。旁边的巡更打卡机显示三楼最近一次打卡是 17:58。走廊监控屏幕黑着，贴着“设备检修，周四下午至周五上午停用”的纸条。"}]},{"id":"study","name":"古籍部主任办公室","scene":"study","desc":"三楼走廊另一头的办公室，书架顶到天花板，桌上的茶杯还有半杯凉茶。方敬之平时多半在这里备课、审稿。","clues":[{"id":"c_study1","title":"对照表复印稿","text":"办公桌正中是一叠订好的复印稿，封面手写“周怀瑾遗稿 K-0231 与《宋元版本考略》（闻立群，1999）对照表”。每页左栏是遗稿原页，右栏是该书章节，红笔在相同段落之间画着等号，共三十七处，末页写着“下周一（10/19）学术委员会前递交，附原稿”。"},{"id":"c_study2","title":"座机通话记录","text":"办公桌座机的屏幕保留着最近通话：19:41 呼出，备注为“闻立群（手机）”，通话 3 分 12 秒。座机旁的便签纸上，方敬之用钢笔写着：“20:10 三楼，当面谈，最后一次机会。”"},{"id":"c_study3","title":"许知夏查重报告","text":"一份博士论文相似度检测报告，总相似度 38%，红字段落多来自网络博客和两篇硕士论文，而非古籍。报告上贴着便签：“周三约谈，不同意送审，让她想清楚”。夹着学生的字条：“老师，我真的只是太着急了。”"},{"id":"c_study4","title":"给林慕白的回信","text":"打印的邮件回复，收件人林慕白，落款方敬之：“遗稿目前不对外提供复制，请您再等一周；我答应您的事不会不算数。”旁边是林慕白的访学申请表，“与周怀瑾关系”一栏手写“外孙”。"},{"id":"c_study5","title":"库房盘点表","text":"古籍部库房盘点表的打印稿，方敬之用铅笔标出“账实不符”三项：清刻方志残页三叶、明刻《文选》残册一册、另有一项“待核”。页边用力写着“周一问贺”。"}]},{"id":"hall","name":"一楼大厅","scene":"hall","desc":"百年馆庆酒会的场地，酒会已散，长桌上还留着残局，签到台、贵宾休息室和侧门都在这一层。","clues":[{"id":"c_hall1","title":"酒会照片索引","text":"摄影师留下的相机缩略图索引，按时间排序共 31 张。20:12 的大合影里，穿深灰色西装的闻立群站在康颂文旁边；20:19 至 20:41 的 14 张里有康颂文、馆长和校友乐队，没有闻立群；20:47 的上台敬酒特写里，他的西装肩头沾着一点灰黑碎屑。"},{"id":"c_hall2","title":"礼品袋领取表","text":"签到台旁的“嘉宾礼品袋领取表”：金色礼品袋共 6 只，编号贴纸贴在袋底。领取栏：01 馆长，02 康颂文，03 闻立群（20:05 签领），04 校党委代表，05 副校长，06 方敬之（未领）。"},{"id":"c_hall3","title":"流程单与花艺清单","text":"酒会流程单：19:30 开场，20:45 康颂文致辞，20:47 闻立群上台敬酒，21:30 散场。背面是花艺师的清单：全场只用白百合和桔梗，“按学院要求不使用玫瑰等带刺花材”。"},{"id":"c_hall4","title":"被摔的冠名协议","text":"贵宾休息室茶几上有一份皱巴巴的《数字化善本室冠名捐赠协议》，条款是“善本室更名为颂文厅”，捐赠方为康颂文的公司。方敬之用红笔批：“不同意；善本室不以人名冠名；捐赠与冠名脱钩”，日期 10 月 14 日。"}]},{"id":"lab","name":"古籍修复室","scene":"lab","desc":"二楼的修复室，窗朝后院，台面上摊着待修的旧书页和晾干的纸，空气里一股糨糊和药水味。","clues":[{"id":"c_lab1","title":"纸墨检测报告","text":"修复台上的《纸张与墨迹检测报告》，委托人方敬之，对象“K-0231 周怀瑾遗稿”：纸为八十年代稿纸，蓝黑墨水，书写时间判断在 1986–1988 年之间。检测人沈青禾签名，日期 10 月 12 日，末尾有方敬之手写的“暂不外传”。"},{"id":"c_lab2","title":"抽屉里的收据","text":"修复室一个常被贺德昌借用的抽屉里压着一张收据：“嘉树斋收到清刻方志残页三叶、明刻《文选》残册一册，计 3200 元”，经手人签名贺德昌，日期 10 月 9 日，边上小字：“余款周四晚后门当面结”。"},{"id":"c_lab3","title":"修复师工作日志","text":"窗台上摊开的工作日志，沈青禾的笔迹：“10/15 修补页晾干，留守。20:35 开窗透气，后院有烧纸味。20:52 后门外两个男人低声说话，递了个纸包。21:05 关灯。”"}]},{"id":"garden","name":"后院花园","scene":"garden","desc":"图书馆背面的小花园，灌木、花坛和一个铁皮落叶焚烧桶，一道铁门通向员工楼梯。夜里没有路灯，只有二楼窗口的光。","clues":[{"id":"c_gar1","title":"花坛里的礼品袋","text":"花坛灌木后丢着一只金色礼品袋，袋底贴着编号“03”。袋里是一册线装书，书衣左上角贴着签条“宋刻本《颐斋诗话》”，保存完好，只有书角蹭了点泥。袋口黏着一小片烧焦的纸屑。"},{"id":"c_gar2","title":"焚烧桶里的残页","text":"角落的铁皮落叶焚烧桶，灰堆里有几片没烧透的纸，是格子稿纸，蓝黑钢笔字迹，能辨认的只有“怀瑾”“考辨”几个字，旁边还有一小角蓝色布面的残片。灰上有新近翻动的痕迹。"},{"id":"c_gar3","title":"员工楼梯铁门","text":"后院通向员工楼梯的铁门，锁舌被透明胶带缠住，门关上也不会落锁。门边地上有四五个同一牌子的烟头。从这里进去沿楼梯上三楼，走廊东端离善本室只有二十来步。"}]},{"id":"clinic","name":"校医务室","scene":"clinic","desc":"一楼东侧的校医务室，酒会期间安排了值班校医，夜里有一本登记簿和一张观察床。","clues":[{"id":"c_cli1","title":"夜间登记簿","text":"校医务室夜间登记簿，20:52 一行：闻立群（男，56），左手背三道平行抓痕，渗血，碘伏消毒加创可贴；“自述：被花刺划的”。"},{"id":"c_cli2","title":"校医初步验尸","text":"22:20 校医受警方委托初步查看遗体：体温明显下降，尸僵从下颌开始，他估计死亡在 20:00 到 21:00 之间，“很难更精确”。死者右手指甲缝里取出一小撮深灰色羊毛纤维；后脑创口形状与镇尺端头吻合。"},{"id":"c_cli3","title":"观察床登记","text":"观察床登记：许知夏（女，26），20:24 入，20:58 离，诊断“过度换气，情绪激动”，校医备注“患者拒绝联系导师”。"}]}],"suspects":[{"id":"wen","name":"闻立群","role":"文学院院长","age":56,"look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"stern"},"bio":"文学院院长、古典文献学系主任，方敬之的师弟，今晚馆庆酒会的校方主持嘉宾。正在竞争副校长，酒会一直在一楼大厅。","demeanor":"官腔儒雅，爱说“请注意”“这一点我要强调”，被质疑先反问","topics":[{"id":"t_rel","q":"你和方教授的关系？","a":"同门三十多年，敬之是我师兄。此人认死理，治学是一把好手，做人嘛……我常说他是图书馆的守门人。前两天我还请他下来喝一杯，他推说要守着善本。痛心，实在痛心。"},{"id":"t_where","q":"案发时你在哪？","a":"整场酒会，我都在大厅，从开场到散场，寸步未离。康先生、馆长、摄影师皆可作证。我是主持嘉宾，岂有擅离之理？这一点，请不必在我身上浪费时间。","lie":true,"truth":"好吧，我离开过一会儿。有个重要的电话，大厅太吵，我出去透了口气，大概二三十分钟。我没说，是怕你们把一次透气当成什么文章。"},{"id":"t_call","q":"他今晚找过你吗？","needs":["clue:c_study2"],"a":"没有。今晚我们一句话都没说上。他连酒会都不肯露面，我还能同他谈什么？请注意，你们这个问题，已经带有相当的倾向性了。","lie":true,"truth":"有。19:41 他打我手机，说想当面谈点“学术上的小事”。我说酒会正忙，改天。就这些。我没提，是怕说多了反招猜疑。"},{"id":"t_book","q":"周怀瑾遗稿是怎么回事？","needs":["clue:c_study1"],"a":"周先生是我的恩师，晚年我替他整理过讲义，书中引述了他的思想，序言里也致谢了。把学术共识指为抄袭，是断章取义。三十七处？呵，我倒想听听他是怎么数的。"},{"id":"t_dean","q":"副校长的评选？","a":"下月党委会上票决。这个节骨眼，我自然要格外谨慎。学者的名声，一半是著作，一半是清誉；我那本《宋元版本考略》，是我三十年的立身之本。你们问这个，意欲何指？"},{"id":"t_bag","q":"你的礼品袋呢？","needs":["clue:c_hall2"],"a":"放在席位上了，后来就找不到了。酒会上人来人往，想必是被人错拿。区区一只礼品袋，我还没有闲到去管它的下落。","lie":true,"truth":"袋子是我拿着出去的。我只是……随手提着，后来丢了。你们要是以为里面有什么，那是你们想多了。"},{"id":"t_hand","q":"你的手怎么回事？","needs":["clue:c_cli1"],"a":"席间花篮里的玫瑰刺划的。小事一桩，贴个创可贴就是了。人上了年纪，皮肤薄，碰一下就破。这也值得专门追问？","lie":true,"truth":"……不是花刺。是被人抓的。至于是谁、在哪里抓的，我现在不想再解释了。我要见律师，在他到之前，你们别想再问我。"},{"id":"t_theft","q":"宋刻失窃你怎么看？","a":"这是内贼作案，这一点我要强调。善本柜无撬痕，说明作案者有钥匙或熟悉流程。馆员、保安、书商，都难脱嫌疑。一册宋刻，价值数百万，动手的人胆子不小。"}],"confronts":[{"clue":"c_hall1","breaks":"t_where","crack":true,"a":"……一张照片能证明什么？我去洗手间，我同人寒暄，谁会盯着我的每一分钟？你们把这些零碎拼成罪名，不觉得荒唐吗？好，我是出去过，我已经说了！"},{"clue":"c_study2","breaks":"t_call","a":"一通电话。我没说，是不想被你们扯进来。他是我师兄，我们之间通话，需要向你们汇报吗？我说了改天，他就挂了。"},{"clue":"c_gar1","breaks":"t_bag","a":"这袋子……我说了，丢了。花坛里捡到的东西，也能算到我头上？编号是编号，人是人。请注意，你们别想拿一只袋子压我。"},{"clue":"c_hall3","breaks":"t_hand","a":"花艺清单？我记错了，行不行？别拿这种小事做文章！我手上的伤，同你们要追的案子没有半点关系，不要再往下问了！"},{"clue":"c_study1","a":"这是敬之个人的偏执！拿一堆复印件，就想毁掉我三十年的名誉？你们去问问学术界，谁没有引过前辈的东西。"},{"clue":"c_lab1","a":"纸是八十年代的，所以呢？周先生的稿子，当然是八十年代写的。这能证明什么？别拿这种东西吓唬我。"},{"clue":"c_gar2","a":"烧掉的废纸？后院本来就是园丁烧落叶的地方，什么东西丢进去都有可能。你们见什么都往我身上套，不累吗？"},{"clue":"c_lib1","a":"门禁日志？我没有善本室的卡，这上头自然没有我。你们拿一份没有我名字的记录来问我，这个逻辑，我实在不敢恭维。"},{"clue":"c_cli2","a":"羊毛纤维？酒会上四十来号人，穿羊毛西装的不止我一个。你们拿这个来问我，是不是太草率了？"}],"fallback":"这与我无关，请不要拿不相干的东西占用我的时间。"},{"id":"kang","name":"康颂文","role":"校友捐赠人","age":62,"look":{"skin":"tan","hair":"slick","hairColor":"grey","glasses":"none","beard":"none","outfit":"suit","acc":"pocketwatch","mood":"smile"},"bio":"鸿运地产董事长，本校校友，向图书馆捐资八百万元做善本数字化，今晚是酒会的贵宾，20:45 上台致辞。","demeanor":"嗓门大，爱提“我捐了八百万”，开口“哎呀”，带笑","topics":[{"id":"t_why","q":"你为什么来酒会？","a":"哎呀，我是这儿毕业的！毕业三十年，捐了八百万给善本数字化，馆庆我能不来吗？今晚坐头桌，还要致辞。我这人爱热闹，场面越大越高兴，哈哈！"},{"id":"t_where","q":"案发时你在哪？","a":"全程在大厅啊！跟馆长碰杯、拍照、听乐队，你去查摄影师的照片，我可是镜头常客。20:45 我上台讲了两分钟，一屋子人看着呢，我哪有空上楼？"},{"id":"t_fang","q":"你和方教授有过节吗？","a":"没有没有！老方是个老顽固，但我敬他。冠名那点小事早谈妥了，我们生意人，有事好商量嘛，哎呀，不至于不至于。","lie":true,"truth":"好吧，有。十四号他把我的冠名协议打了回来，今晚 19:25 我们在贵宾休息室吵了一架，我拍了桌子，说钱我可以收回去。他说：“随你，名字不卖。”我是气话，真的就是气话！"},{"id":"t_name","q":"冠名协议是怎么回事？","needs":["clue:c_hall4"],"a":"就是想给善本室起个名，颂文厅，多响亮！我八百万照给，名字让一让嘛。他倒好，红笔一批，“不以人名冠名”。我跟你说，我捐的钱，搁别的学校，楼都能盖一栋！"},{"id":"t_wen","q":"闻院长一直在你身边吗？","needs":["clue:c_hall1"],"a":"也不是一直。20:15 前后他说接个电话，出去透气，我上台讲话的时候他才回来，站在台边。他是院长，应酬多，出去接个电话，很正常嘛。"},{"id":"t_seen","q":"酒会上有什么异样？","a":"要说异样……闻院长敬酒的时候，西装肩头有点灰，我顺手给他拍了拍。散场前我见他手上贴了个创可贴，随口问了一句，他摆摆手说花刺划的。其他的，没有。"},{"id":"t_jian","q":"你认识书商简嘉树吗？","a":"那帮收旧书的，我清楚！简老板上个月还想卖我一册明版，价钱高得吓人，我一听就知道有水分。听说他跟馆里的老贺走得近，二十年的交情。哎呀，我不乱说啊。"},{"id":"t_theft","q":"宋刻失窃你怎么看？","a":"这事我最痛心！我捐了八百万，结果守不住一本书？肯定是内鬼，要不就是书商，圈里那帮人什么钱都敢赚！"}],"confronts":[{"clue":"c_hall4","breaks":"t_fang","a":"哎呀……谁把这东西翻出来的？好，我认，是吵了。可我要是想动手，会在酒会上当着四十个人的面致辞？我把话摆这儿：我骂过他，没碰过他！"},{"clue":"c_hall1","a":"看吧！我说我是镜头常客！这些照片里我可是一直在的，馆长也在旁边，谁都能给我作证，哎呀，你们可别再怀疑我了！"},{"clue":"c_hall2","a":"我那袋子？放头桌椅子上了，里头是一本纪念册和一瓶酒，我没拆。你们别告诉我，这也能是线索？"},{"clue":"c_gar1","a":"花坛里的袋子？不是我的，我是 02 号。我的在车上呢，不信你们去问司机。我哪有闲心去后院扔东西！"},{"clue":"c_lab2","a":"收据？这跟我有什么关系，我又不买旧书页，我是做地产的！哎呀，你们别什么都往我身上扯，我捐了八百万呢！"}],"fallback":"哎呀，这个我真不清楚，你问点别的，我知无不言！"},{"id":"xu","name":"许知夏","role":"博士研究生","age":26,"look":{"skin":"fair","hair":"ponytail","hairColor":"black","glasses":"round","beard":"none","outfit":"hoodie","acc":"badge","mood":"worried"},"bio":"方敬之的博士生，论文刚被导师打回，不同意送审。今晚本该在宿舍，酒会期间被人看见出现在图书馆一楼附近。","demeanor":"声音小，容易哽咽，答话先停顿，爱说“对不起”","topics":[{"id":"t_rel","q":"你和方教授的关系？","a":"方老师是我的导师，五年了。他对谁都严，对我更严……但我知道，他是为我好。他、他走了，我真的不知道该怎么办。对不起。"},{"id":"t_where","q":"案发时你在哪？","a":"我……我在宿舍复习，一晚上都没出门。室友可以作证……哦，她今晚回家了。反正我没来过图书馆，我连酒会都没去。对不起，我说不清楚。","lie":true,"truth":"我撒谎了。我在图书馆一楼的医务室。傍晚被拒之后我一直喘不上气，20:24 过去的，躺到快九点。我不想让人知道我又崩溃了，丢人，也怕你们觉得我有动机。"},{"id":"t_report","q":"你的论文怎么回事？","needs":["clue:c_study3"],"a":"那份查重……是我太着急，从网上和别人的硕士论文里拼了一些。不是古籍，是背景综述。方老师让我自己想清楚，说不想毁了我，但也不能放过去。我哭了很久……"},{"id":"t_last","q":"你最后一次见他？","a":"傍晚五点半，在三楼他的办公室。我求他放我一马，他说“回去想想”。就这样……他出来送我的时候，还很平静，没发火。"},{"id":"t_hate","q":"你恨他吗？","a":"恨过一点点吧，那天晚上……但我更恨我自己。他是唯一一个对我的论文一个字一个字批过的人。我怎么会……怎么会杀他。"},{"id":"t_old","q":"他最近在忙什么？","a":"这两个礼拜，他总在查一份旧稿子，晚上也不回家。有一次我听见他对着电话说：“有些人，得自己认。”我不知道是谁，我……不敢问。"},{"id":"t_wen","q":"你认识闻院长吗？","a":"闻院长……是我们学院的院长，也是方老师的师弟。昨天下午我去找老师，正好撞见闻院长从办公室出来，脸色很难看，没理我。老师关上门，一个人坐了很久。"},{"id":"t_door","q":"善本室怎么进？","a":"没有卡的人，只能敲门。老师在里头会先隔着门问一声是谁，认识的才按钮放行，生人敲再久也不开。我进去过很多次，都是这样。"}],"confronts":[{"clue":"c_cli3","breaks":"t_where","a":"……是的，我去了医务室。我当时快窒息了，校医让我别联系导师，我就没联系。我以为说在宿舍更安全，对不起，我不该骗你们。"},{"clue":"c_study3","a":"别拿这份报告说话……这是我这辈子最丢脸的东西。我已经知道错了，我不会拿它来开脱，也不想再提了。对不起。"},{"clue":"c_study1","a":"这是老师最近在弄的东西？我没见过，他不让我碰，说学生不要卷进这种事里。我只知道他这两周特别累……"},{"clue":"c_lib1","a":"门禁？我……我没有善本室的卡，从来都是老师开门让我进。日志上的东西，我真看不懂，也不关我的事。"}],"fallback":"对不起，我……这个我不太清楚。"},{"id":"he","name":"贺德昌","role":"古籍部馆员","age":58,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"vest","acc":"badge","mood":"worried"},"bio":"古籍部管理员，二十多年在馆里。持有善本室门卡，22:03 是他刷卡开门发现了方敬之的尸体。","demeanor":"絮叨，爱叹气，自称“老头子”，被问急了就念“这可怎么办”","topics":[{"id":"t_find","q":"你怎么发现的？","a":"唉，22:00 前后我上楼清场，看见善本室的灯还亮着。方教授平时 21:30 前就收工的，我敲了门没人应，等了几分钟，就刷卡进去了……天哪，他躺在地上，我腿都软了，赶紧叫保卫处。这可怎么办啊。"},{"id":"t_card","q":"你有善本室门卡吗？","a":"有有有。我的卡可以直接刷进去，用不着敲门。今晚我只刷了那一次，就是 22:03，你们查日志就知道。没卡的人要进，只能敲门，等里头的方教授按钮放行，老头子我天天见。"},{"id":"t_where","q":"20:00 之后你在哪？","a":"唉，闭馆我清完三楼的场，就下到一楼服务台了，一直守着，直到 22:00 前后才上去。老头子一个，没别的地方可去。","lie":true,"truth":"我没一直守着。20:10 我去二楼库房，包了个包裹；20:50 到后门外见个人，交了点东西，大概 20:58 回的服务台。我怕你们顺藤摸瓜把我那点事翻出来……这可怎么办。"},{"id":"t_audit","q":"库房盘点缺册？","needs":["clue:c_study5"],"a":"唉，那几件是民国时候就丢的老账，几十年没人看过，早就核销了。方教授非要翻出来，我跟他说过，没必要啊，真没必要。","lie":true,"truth":"是我卖的。残页和《文选》残册是副本价值低的，我儿子欠了网贷，我昏了头，一共卖了三千二。我不是贼，我只是……没办法。但方教授的死，真和我没关系！"},{"id":"t_fang","q":"方教授最近有异常吗？","a":"他这两周几乎不下楼，唉，人都瘦了一圈。今晚他还特意嘱咐我：“今晚谁来都别放上去，我要单独见个人。”我问是谁，他不说。我送走林先生，就守在下头，没见谁从正楼梯上去。"},{"id":"t_stair","q":"后院的员工楼梯？","a":"员工楼梯的铁门平时是锁着的，钥匙在保卫处。从后院进来，直通三楼东头，离善本室很近。可是那门……应该一直锁着啊，老耿说他每天都检查的，这可怎么办。"},{"id":"t_key","q":"善本柜的钥匙？","a":"柜钥匙一共两把，一把方教授自己带着，一把锁在馆长办公室的保险柜里。老头子我腰上挂的只有门卡和库房钥匙，善本柜我是开不了的。"},{"id":"t_jian","q":"你认识简嘉树吗？","a":"老简啊，收旧书的，常来馆里转，二十年的老熟人了，逢年过节还给我送盒茶叶。唉，也就是认识，别的我可不敢乱讲。"}],"confronts":[{"clue":"c_lab3","breaks":"t_where","a":"你们连修复师的日志都看了？……对，是我。我就是怕丢了饭碗才不敢说，我和书商私下交过一次货。但我 20:19 到 20:31 人在二楼库房，和命案半点关系都没有！这可怎么办。"},{"clue":"c_lab2","breaks":"t_audit","a":"这收据……你们怎么翻到的？我藏在修复室抽屉里的！唉，我认了。我是卖了点残页，可我宁可割自己的肉，也不会动方教授一根头发。"},{"clue":"c_lib1","a":"日志上 20:19 的开关门没有刷卡，那就不是我。我有卡，进去哪用得着敲门？你们可以放心，老头子我没那个本事做这种事。"},{"clue":"c_lib2","a":"天哪，现场我又看了一眼就心慌。柜钥匙是方教授自己那把，我腰上只挂着门卡和库房钥匙，你们验一验就知道。"},{"clue":"c_gar3","a":"这铁门被胶带缠了？这不是我干的！老耿说他每天都查……难怪他今晚一直躲着我，我还纳闷呢，唉。"}],"fallback":"唉，这个我真的不知道，老头子这把年纪了，别吓我。"},{"id":"geng","name":"耿大海","role":"图书馆保安","age":49,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"uniform","acc":"badge","mood":"tired"},"bio":"图书馆夜班保安，持有员工楼梯和善本室的门卡，当晚负责一楼大门、监控室和夜间巡更。","demeanor":"大嗓门，爱说“嗨”“我干了十几年”，心虚时声音更大","topics":[{"id":"t_round","q":"今晚你巡逻了吗？","a":"巡了啊！20:30 我上了三楼，走廊挨个看了一遍，一切正常，没见任何人。嗨，我干了十几年，这点规矩还不懂？","lie":true,"truth":"嗨……我没上去。20:10 我回监控室看球赛了，除了后来出去撕胶带那一趟，一直盯到快九点。三楼巡更机上最后一次打卡是 17:58，你们一查就穿帮。我怕担责任，才吹的牛。"},{"id":"t_door","q":"后院员工门锁了吗？","a":"一直锁着，我天天查！那铁门的钥匙在我这，谁也进不去，你们别怀疑到我头上，我干了十几年，不会犯这种低级错误！","lie":true,"truth":"……门锁是我缠的胶带。19:50 我想去后院抽根烟，又怕门关了进不来，就缠了锁舌。后来 20:40 我去撕胶带，远远看见闻院长从后院那边走过来，往大厅侧门去，我喊了声“院长”，他说出来醒酒。我就没撕，回监控室了，真的就是忘了。"},{"id":"t_camera","q":"三楼监控呢？","a":"检修，周四下午停到周五上午，通知贴在值班台上，我又不是修摄像头的。你们别怪我，我只管大门！"},{"id":"t_card","q":"你的卡能进善本室吗？","a":"能。但今晚我没刷过，你们看日志就知道。要进善本室我得走值班台，嗨，我一个保安跑上去干什么？"},{"id":"t_left","q":"闭馆时还有谁没走？","a":"20:00 清场，读者都走了，就剩个姓林的，新加坡来的访问学者。20:05 左右我在大厅碰见贺师傅带他下楼，那人脸色不太好，像哭过。"},{"id":"t_ball","q":"你在监控室做什么？","a":"嗨，看着监控呗。一楼大门、大厅、侧门的画面都在，就是三楼和后院没覆盖。酒会人多，进进出出，谁去了哪儿我可记不全。"},{"id":"t_boss","q":"今晚怎么就你一个？","a":"保卫处排的班，本来两个人，另一个老刘家里有事请假了，就剩我。一楼大门、监控、巡更全是我一个，忙不过来，真的！领导那边你可别乱说。"},{"id":"t_after","q":"散场后你见到什么？","needs":["ask:geng.t_ball"],"a":"21:30 散场，我在大门口送客，人挤人，院长、书记一个个往外走，乱哄哄的。21:55 贺师傅上楼清场，我就去把大厅玻璃门锁了。别的，嗨，没注意。"}],"confronts":[{"clue":"c_lib4","breaks":"t_round","a":"巡更打卡机最后一次是 17:58？……行，我认了，我没上去。别告诉领导，我老婆还指着我这份工资呢！"},{"clue":"c_gar3","breaks":"t_door","a":"这胶带……被你们找到了。嗨，我是缠的，我认。但我发誓，我就是想抽根烟！谁知道会出这事！"},{"clue":"c_lib1","a":"日志上 20:19 的开门没有刷卡，那就不是我的卡。我今晚真没进过善本室，也没上过三楼，你们别乱写！"},{"clue":"c_gar2","a":"焚烧桶？那是园丁烧落叶用的，早晨我还看见里头有灰呢。我也闻不到什么味，你们别吓我，嗨，我胆子小。"}],"fallback":"嗨，这个我真没注意，你问别的吧！"},{"id":"lin","name":"林慕白","role":"访问学者","age":39,"look":{"skin":"light","hair":"short","hairColor":"black","glasses":"rect","beard":"none","outfit":"jacket","acc":"scarf","mood":"sad"},"bio":"新加坡国立大学访问学者，研究古代版本学，是版本学家周怀瑾的外孙，来本校三个月，一直想看外祖父的遗稿。","demeanor":"斯文克制，偶尔夹英文，爱说“honestly”，提到外公会停顿","topics":[{"id":"t_why","q":"你为什么来本校？","a":"我外公周怀瑾 1989 年去世，留下的手稿都在这座馆里。我申请访学，就是想亲眼看一看，复印一份带回家。Honestly，三个月了，我一直在等批准。"},{"id":"t_3f","q":"你去过三楼善本室吗？","a":"没有。善本室我进不去，也不想添麻烦。闭馆前我一直在一楼阅览室看书，I mean，三楼我连楼梯都没踩过。","lie":true,"truth":"我撒了谎。19:52 我上去敲了门，想当面求方教授。等了两三分钟他才开门，只说了一分钟，说：“再给我一周，下周一之前，让它见光。”我信他，20:02 被贺师傅送了出来。我怕你们以为我有动机，就说没去。"},{"id":"t_where","q":"20:05 之后你在哪？","a":"20:05 我出了图书馆，去了校内的“木心咖啡”，点了杯美式，写了点笔记，一直坐到 21:30 才回宿舍。账单应该还在我手机里，你们可以查。"},{"id":"t_cafe","q":"咖啡馆有人记得你吗？","needs":["ask:lin.t_where"],"a":"老板娘认得我，我几乎每晚都去，坐靠窗那张桌子。付款是扫码的，记录在手机里。Sorry，我知道这听上去像在给自己找证人，但事实就是这样。"},{"id":"t_grand","q":"你外祖父的遗稿？","needs":["clue:c_study4","clue:c_study1"],"a":"那是外公晚年写的版本学讲稿，没发表过。后来有人把里面的东西拿去出了书，成了名……我家人一直都知道，但没证据。我来这里，就是为了拿证据。"},{"id":"t_title","q":"遗稿是什么样子？","needs":["clue:c_gar2"],"a":"外公那份稿子叫《版本考辨》，手抄在格子稿纸上，蓝布面。这些我只从母亲那里听过，一直没见过原件。要是烧的真是它……I mean，我不敢想。"},{"id":"t_promise","q":"方教授答应过你什么？","needs":["clue:c_study4"],"a":"他说他在整理比对，会替我外公把话说出来。他让我再等一周。他是我见过最认真的人，我不相信他会食言。现在他不在了，我……不知道该怎么办。"},{"id":"t_wen","q":"你怎么看闻院长？","a":"我和他只在迎新会上打过一次招呼。他很客气，说“周先生是我的恩师”。我没说话。Honestly，每次听他提外公，我心里都不舒服。"}],"confronts":[{"clue":"c_lib4","breaks":"t_3f","a":"你们翻到访客登记了……是，我上去过。我怕说出来就成了嫌疑人，不过，我没说谎的部分是：我 20:02 就离开了，之后再没上去过。登记表上不是写得很清楚吗？"},{"clue":"c_study4","a":"那封回信我也收到了。“我答应您的事不会不算数”，他一向言出必行。我不信他会食言，更不信是意外。"},{"clue":"c_lab1","a":"八十年代的纸，蓝黑墨水……那就是外公的字。我看到它的时候，眼睛都湿了，我想起小时候他教我握笔。"},{"clue":"c_gar2","a":"这是……我外公的稿纸格式！天哪，谁烧了它？！谁干的？你们一定要查清楚，不然我一辈子都不会原谅他！"}],"fallback":"抱歉，这个我帮不上忙。Sorry."},{"id":"jian","name":"简嘉树","role":"古籍书商","age":46,"look":{"skin":"light","hair":"short","hairColor":"brown","glasses":"round","beard":"goatee","outfit":"jacket","mood":"sly"},"bio":"嘉树斋老板，常年出入学校和馆里收旧书，与图书馆几位老人熟。今晚没有收到酒会请柬，但有人在图书馆附近见过他的车。","demeanor":"圆滑，爱说“咱们明白人”“您”，笑里藏刀","topics":[{"id":"t_biz","q":"你做什么生意？","a":"嗨，旧书生意呗。收点线装书、残页，修一修，转手卖给懂行的人。咱们明白人，这行水深，谁手上没几本来路不清的？不过国家一级的东西，我可不碰。"},{"id":"t_where","q":"今晚你在哪？","a":"一晚上都在店里对账，没出过门，也没到过学校，您信我。店员可以作证……他八点下班了，哎，反正我没来。","lie":true,"truth":"我来了。20:50 在图书馆后门外和贺师傅碰了面，付了余款，拿了个纸包，大约 20:58 走的。就这么点事，我没碰别的，我怕你们把残页的事和命案搅在一起。"},{"id":"t_he","q":"你认识贺德昌吗？","a":"老主顾了，二十年交情。他有时候手上有点多余的东西，我给他介绍买家，都是你情我愿的买卖，没什么见不得人的，您说是不是？"},{"id":"t_buy","q":"残页是怎么买的？","needs":["clue:c_lab2"],"a":"那些残页是正规流出的旧货，贺师傅说是库房核销品，手续齐全。我买的时候明码实价，有收据可查，咱们明白人，不干糊涂事。","lie":true,"truth":"手续？哪来的手续。我知道那是馆藏，价格压得低，一听就明白。我心里清楚是灰色生意，但我真没碰宋刻，那是掉脑袋的东西。"},{"id":"t_cash","q":"这笔账怎么结的？","needs":["clue:c_lab2"],"a":"三叶方志加一册残《文选》，说好三千二。头一笔我先付了两千，余下一千二，约了周四晚上后门交割。咱们明白人，账目清楚，不拖欠。"},{"id":"t_smell","q":"后院有什么异样？","a":"后门外就是后院。我在那儿站了几分钟，天黑，离花坛又远，什么也没看清，只闻到一股烧纸的焦味。我还以为是学校在烧落叶，没别的了。"},{"id":"t_value","q":"宋刻能卖给谁？","a":"一册宋版《颐斋诗话》，盖着馆藏印，有著录，流到市面上全国识货的就那么二三十家，一露头谁都知道出处。咱们明白人都清楚：偷这玩意儿，要么是疯子，要么压根没打算卖。"},{"id":"t_theft","q":"宋刻被扔花坛你怎么看？","needs":["clue:c_gar1"],"a":"书都没丢，扔在花坛里，那还叫偷？真贼舍不得这么糟蹋，除非他本来就不是冲着书去的。反正不是我，我根本没上过三楼，您可得记下。"}],"confronts":[{"clue":"c_lab3","breaks":"t_where","a":"连窗户外头的人影都被人记下来了？行，我来过。您只要知道我没上过楼就行。我就是个买旧书的，杀人的买卖我不干。"},{"clue":"c_lab2","breaks":"t_buy","a":"收据在你们手里……我就认了，我知道来路不正。可你们要是把我当凶手，那真是冤枉，我犯的是灰色的事，不是杀人的事。"},{"clue":"c_gar1","a":"花坛里的宋刻？好端端的书扔在花坛，还给泥蹭了，糟蹋东西！这也难怪，贼不识货，我可不会这样对待一册宋版。"},{"clue":"c_lib2","a":"宋刻没了就怀疑书商，是不是？您去圈里问问，谁敢收这本？我才不当替罪羊，这书放手里烫得很。"}],"fallback":"咱们明白人，这个我不清楚，您换个问法。"},{"id":"shen","name":"沈青禾","role":"古籍修复师","age":34,"look":{"skin":"fair","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"labcoat","mood":"neutral"},"bio":"古籍部修复师，在二楼修复室工作，持有善本室门卡。平日话少，与方敬之共事六年，今晚本应下班回家。","demeanor":"话少，句子短，用词专业，偶尔停顿，手上有药水味","topics":[{"id":"t_work","q":"你平时做什么？","a":"修补，托裱，检测。把破旧的纸页救回来。纸有纸性，墨有墨性，急不得。方主任最懂纸，跟着他六年，学了不少。"},{"id":"t_leave","q":"今晚几点下班？","a":"20:00。准时。回家了。修复室熄灯锁门，后面发生什么，我一概不知，也没听见动静。","lie":true,"truth":"我没走。有一批补好的页子要晾，我留守到 21:05 才关灯。我没说，是怕你们问我为什么在场，又问我知道什么。"},{"id":"t_test","q":"你给方教授做过检测吗？","needs":["clue:c_lab1"],"a":"没有。这一周没接过特殊检测。都是常规修补，方主任也没派额外的活儿。你们大概弄错了。","lie":true,"truth":"做过。10 月 12 日，他让我测 K-0231 遗稿的纸和墨。他嘱咐我暂不外传，说：“我想给一个人最后一次机会，让他自己认。”我答应了，所以不敢说。"},{"id":"t_paper","q":"遗稿的年代怎么判断？","needs":["clue:c_lab1","clue:c_study1"],"a":"纸是八十年代的稿纸，墨是蓝黑钢笔水，氧化程度对得上 1986 到 1988 年。比 1999 年出版的任何东西，都早十年以上。这点，没有疑问。"},{"id":"t_smell","q":"你闻到什么了吗？","needs":["clue:c_gar2"],"a":"20:35。我开窗透气。后院有烧纸的味道，我以为是园丁烧落叶，没在意。20:52，又看见后门外两个男人说话，递了个纸包。我不认识。"},{"id":"t_fang","q":"方教授最近如何？","a":"很紧绷。我从没见他那样。他说：“有些事，得有人认。”我问是谁，他不肯说，只说“下周一就见分晓”。"},{"id":"t_key","q":"你的卡进过善本室吗？","a":"进过，平时给方主任送修好的页子。今晚没刷过。最后一次是下午四点，送一册修补完的《文选》校样，日志上看得到。"},{"id":"t_lin","q":"你认识林慕白吗？","needs":["ask:shen.t_fang"],"a":"访问学者。来修复室看过两次纸样。他是周怀瑾先生的外孙，方主任告诉过我。他对纸很敬重，不像有些人。"}],"confronts":[{"clue":"c_lab3","breaks":"t_leave","a":"日志是我自己写的，我没法抵赖……好吧，我是留守到 21:05。我不想让人知道，是怕说多了惹麻烦。"},{"clue":"c_lab1","breaks":"t_test","a":"这份报告上有我的名字，我不能说没做过。他嘱咐过我保密，我才想着瞒。现在他没了，我再瞒就没有意义了。"},{"clue":"c_study1","a":"对照表我没见过。但如果是他整理的，我一点都不意外。他那几天几乎住在善本室，饭也不好好吃。"},{"clue":"c_gar2","a":"那是……稿纸的残片？是被谁烧了吗？天哪。纸是不能这样烧的。那是……那是别人一辈子的东西。"}],"fallback":"这个，我不太清楚。纸上的事，我才懂一些。"}],"solution":{"culprit":"wen","method":{"q":"凶手怎么做到的？","options":["贺德昌用门卡进屋杀人，再把宋刻卖给书商灭口。","闻立群趁酒会离席，经后院员工楼梯上楼，被方敬之按钮放入，杀人后带走遗稿和宋刻伪造盗窃，按钮出屋，再把遗稿烧掉、宋刻丢进花坛。","林慕白在闭馆前躲进善本室，等人散尽后行凶，再从窗户逃走。","简嘉树勾结保安从后门潜入偷宋刻，被方敬之撞破而杀人。"],"correct":1},"motive":{"q":"为什么杀人？","options":["为了盗卖宋刻本《颐斋诗话》。","为了掩盖私卖馆藏残页被盘点发现。","为了销毁足以揭穿自己成名作抄袭恩师遗稿的证据，并阻止方敬之下周一提交。","因为冠名之争，康颂文要报复方敬之。"],"correct":2},"keyClues":["c_lib1","c_study1","c_lab1","c_hall1","c_hall2","c_gar1"],"truth":["凶手是文学院院长闻立群。他的成名作《宋元版本考略》（1999）核心章节大段取自恩师周怀瑾的未刊遗稿。方敬之为遗稿编目时发现了这件事，作了三十七处对照，还请沈青禾检测了纸墨，证明遗稿早了十余年，打算下周一在学术委员会前提交。","19:41 方敬之给闻打电话，约他 20:10 到善本室“最后一次机会”，要他自己公开更正。闻正在竞争副校长，这封对照表一旦提交，他的一切都完了。","20:13 闻借口接电话离开酒会，提着自己的 03 号金色礼品袋，走后院铁门（被保安耿大海缠了胶带，没落锁）的员工楼梯上三楼。20:19 方敬之按出门按钮放他进屋，门磁留下一次无刷卡的开关。","两人争执，方敬之抓伤了闻的左手背，闻抓起黄铜镇尺击中他后脑。他拿走桌上的周怀瑾遗稿，又拿走善本柜里的宋刻本伪造盗窃现场，20:31 按出门按钮出屋——这次开关门同样没有刷卡记录。","闻回到后院，在落叶焚烧桶里烧掉遗稿，把装着宋刻的袋子丢进花坛，20:44 回到大厅，20:47 上台敬酒，肩头沾着灰，手背的伤他谎称是花刺划的，而当晚的花全是白百合，没有一枝带刺的玫瑰；校医还从死者指甲缝里取出了与他深灰色西装相符的羊毛纤维。","“失窃的宋刻”其实一直在花坛里——盗窃是幌子，真正被拿走并烧毁的，是那本不起眼的蓝布手抄稿。","其他人的隐瞒都有各自的缘由：康颂文与方争吵冠名，许知夏躲在医务室，贺德昌私卖残页，耿大海没巡逻还缠了胶带，林慕白去求过方，简嘉树买了残页，沈青禾奉命保密，但都与命案无关。"]}},{"id":"wedding","title":"婚礼前夜","tagline":"明天就是婚礼，今夜暖房里的兰花下，躺着新郎的哥哥，还有一只空了的戒指盒。","difficulty":2,"cover":"cover","tone":"red","brief":"十月十六日夜，郊外白鹭庄园。周家小儿子周子恒与林若溪明天就要在这里举行婚礼，今晚是彩排晚宴。你本是受新郎之父周振国之托，来做婚礼的“安保顾问”，没想到刚到庄园，就撞上了一场命案：婚礼总策划、新郎的兄长周明哲，被人发现死在花园暖房里，新娘那枚周家传了三代的钻戒也不见了。警方暂时封锁了庄园，要求所有人留在原地等候。周振国把你拉到一旁，压低声音说：“天亮之前，我要知道是谁干的。明天的婚礼，也许还办得成。”","victim":{"name":"周明哲","desc":"36 岁，明哲婚礼工作室创办人，也是这场婚礼的总策划，新郎周子恒同父异母的兄长。他倒在暖房兰花架旁，后脑遭钝器重击，身边的铜喷壶沾着血。","look":{"skin":"light","hair":"short","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"neutral"}},"publicFacts":["死者周明哲是本场婚礼的总策划，也是新郎的兄长；他倒在暖房，死因是后脑钝器伤，现场有一把沾血的铜喷壶。","彩排仪式结束后，伴郎按流程把戒指盒交给周明哲保管；现在戒指盒是空的，戒指不见了。","周明哲腕上的智能手表与手机自动校时，心率记录在 21:19 归零，警方据此认定死亡时间。","从宴会厅步行到暖房，要四五分钟；暖房侧门通花园小径，另有一条月季小路连着后厨后门。","当晚庄园只有大门一个出入口，由管家登记；警方到场前没有人离开，也没有外人强行闯入的痕迹。"],"timeline":[{"t":"18:30","text":"草坪彩排仪式结束，伴郎把戒指盒交给策划师周明哲保管。"},{"t":"19:00","text":"彩排晚宴在白鹭厅开席，约三十位亲友入座。"},{"t":"20:38","text":"门岗登记：新娘前任顾衍到达，无请柬，经周明哲同意放行。"},{"t":"21:05","text":"据同桌宾客称，周明哲在此时前后离席，说去暖房看花。"},{"t":"21:19","text":"周明哲的智能手表记录到心率归零。"},{"t":"21:40","text":"因新郎迟到，彩排蛋糕在这个时间才开始切。"},{"t":"21:55","text":"管家韩伯去关暖房加湿系统时发现尸体，随即报警。"},{"t":"22:20","text":"警方到达，封锁庄园。"}],"budget":{"search":12,"ask":30},"locations":[{"id":"garden","name":"花园暖房","scene":"garden","desc":"庄园后花园深处的玻璃暖房，湿热、满是兰花香。警方的黄色警戒带拦在门口，加湿器的白雾已被关停。","clues":[{"id":"c_gh1","title":"死者与智能手表","text":"周明哲仰面倒在兰花架旁，后脑有钝器伤，地上的铜喷壶壶底沾着血和几根头发。他腕上的智能手表屏幕裂了，健康记录显示心率于 21:19 骤然归零；警方技术员说，这块表与他的手机自动校时，时间是准的。"},{"id":"c_gh2","title":"半朵被踩的胸花","text":"尸体右手旁压着半朵被踩碎的白色兰花胸花，银色别针弯折，针上缠着一截蓝色缎带。花瓣边缘有撕裂的痕迹，缎带的断口参差不齐。"},{"id":"c_gh3","title":"空戒盒与放大镜","text":"花架上的丝绒戒指盒盖子敞开着，里面的凹槽空空如也。地上滚着一只带挂绳的十倍放大镜，挂绳上系着“明哲婚礼”的小铭牌，镜片完好。"},{"id":"c_gh4","title":"门边的细烟头","text":"暖房门边的盆栽土里按着三个细长的烟头，滤嘴上沾着浅玫瑰色口红印，烟头还很新。旁边的软泥地上留着一行细高跟的鞋印，从花园小径走到门口，又折返回去。"}]},{"id":"hall","name":"门厅与露台","scene":"hall","desc":"庄园正门的大门厅，连着一道朝花园敞开的石砌露台。门厅里摆满明天要用的花艺和签到台，露台上能听到远处草坪的虫鸣。","clues":[{"id":"c_hall1","title":"胸花清单","text":"签到台上压着花艺师留下的胸花清单：“新郎·白兰·白缎带；伴郎（一位）·白兰·蓝缎带；新郎父亲·白兰·金缎带。均于当日 18:00 前别好，针为银色。”清单末尾画了个勾，旁边写着“全部到位”。"},{"id":"c_hall2","title":"捧花里的字条","text":"新娘彩排用的捧花里夹着一张卡片，背面是潦草的字迹：“若溪，我在花园长椅等你，最后一次，就五分钟。——衍”。卡片一角沾着红酒渍，像是被人攥过又展平。"},{"id":"c_hall3","title":"露台烟灰缸","text":"露台栏杆边的烟灰缸里有四个同一牌子的烟头，其中几个只抽了一半就掐灭了。栏杆下放着一只银色打火机，侧面刻着“白鹭庄园”四个小字，看样子是临时借出去的。"}]},{"id":"dining","name":"白鹭厅宴会厅","scene":"dining","desc":"彩排晚宴的会场，长桌上摆着没收完的甜品和香槟杯，吊灯暖黄。一角堆着摄影器材，彩排蛋糕立在推车上，刀子还没拆封。","clues":[{"id":"c_din1","title":"摄影师的相机回放","text":"摄影师放在桌边的单反相机，回放屏幕停在一张照片上：贺铭举着香槟杯笑向镜头，信息栏显示拍摄时间 21:21。他身后墙上的圆形挂钟是 12 小时制表盘，没有标上下午，指针指在九点四十一分。他深色礼服的左翻领上没有别花，只有一个小小的针孔。"},{"id":"c_din2","title":"墙上的挂钟","text":"你拿手机对照宴会厅墙上的挂钟：手机上的时分与钟面完全一致（钟是 12 小时制，手机是 24 小时制，换算后分秒不差）。管家说这座石英钟每周一由专人校准，从没出过错；彩排以来也没人动过它。"},{"id":"c_din3","title":"彩排流程表","text":"流程表上写着：“21:00 自由交流；21:30 新人切蛋糕；22:00 散场。”页边有人用红笔改过：“新郎迟到，蛋糕推迟到 21:40。”下面一行小字：“摄影师全程自由抓拍，注意补拍伴郎伴娘。”"}]},{"id":"guestroom","name":"新郎伴郎休息间","scene":"guestroom","desc":"二楼走廊尽头的休息套间，沙发上堆着几只衣袋和行李包，衣架上挂着明天要穿的礼服。空气里有淡淡的发胶味。","clues":[{"id":"c_gr1","title":"珠宝店取件单","text":"新郎礼服袋的口袋里夹着一张“琢玉轩”的取件单：委托人周子恒，经手人贺铭，9月3日送修、9月5日取件，项目“清洗、改圈”。单子下方另有一行手写：“加订锆石仿品一枚，款式同，付款人贺铭，3800 元。”"},{"id":"c_gr2","title":"伴郎的行李袋","text":"贺铭的行李袋底夹着两份文件：一份是“鼎盛财务”的借款协议，借款人贺铭，三十六万元，到期日 10 月 18 日，盖着逾期条款；另一份是首饰回收店的收据，“裸钻 1.8 克拉，回收价 22 万元”，日期 9 月 6 日，出售人栏签着贺铭。"},{"id":"c_gr3","title":"揉皱的意向书","text":"新郎西装内袋里塞着一张被揉皱又抚平的纸：《股权转让意向书（草稿）》，转让方周振国，受让方周明哲，比例 51%，日期是本周六。纸边有被指甲掐出的几道深痕。"}]},{"id":"kitchen","name":"后厨与酒窖口","scene":"kitchen","desc":"庄园的后厨，灶台上还摆着没洗完的餐具，后门通向一条碎石小路，墙角有一道小门通往地下酒窖。","clues":[{"id":"c_kit1","title":"后门水槽的毛巾","text":"后厨后门旁水槽边挂着一条湿毛巾，角上有淡红水渍和几点黑泥。值班厨师在交接本上写道：“21:30 前后，一位穿深色礼服的先生从后门进来冲手，说被花刺划了，没看清脸，也没打招呼。”"},{"id":"c_kit2","title":"酒窖出入簿","text":"酒窖口的出入簿上，20:55 一栏写着：“2009 年波尔多红 一瓶，取用人：韩。”备注栏却是空的，今晚彩排的酒水清单里根本没有这个年份的酒。"},{"id":"c_kit3","title":"后门的月季小路","text":"后厨后门外是一条碎石小路，穿过一片月季丛，直通花园暖房的侧门。路边有几根新折断的月季枝，泥地潮湿，一路上都有深浅不一的脚印，分不清是谁的。小路中段绕过一座锦鲤池，石沿上有一处青苔刚被蹭掉，池水深而浑，鲤鱼聚在那处石沿下，不肯散开。"}]},{"id":"study","name":"管家办公室","scene":"study","desc":"庄园一楼的小办公室，墙上挂着一排钥匙，桌上摆着门岗登记本和周明哲留下的策划文件夹，雪茄味还没散干净。","clues":[{"id":"c_stu1","title":"门岗登记本","text":"门岗登记本上，20:38 一栏写着“顾衍，无请柬，策划师口头同意放行，车牌尾号 7K”，出场时间一栏是空白。管家说，警方到场时这辆车还停在停车场里，一直没有开出过大门。"},{"id":"c_stu2","title":"策划文件夹","text":"周明哲的策划文件夹里，今晚的待办事项写着：“21:05 暖房：戒指再看一遍（带放大镜）。有话问取件的人。”内页夹着一张拍立得，是他和苏小棠的合影，背面写着“7.14 我的小棠”，被划掉了一半。"},{"id":"c_stu3","title":"婚礼预算核对表","text":"核对表上有一栏用红笔圈着：“9月28日，婚礼专户转出 32,000 元至个人账户‘顾衍’，备注‘周转’，授权人：林若溪。”红圈旁写着“明天前找她谈，别让子恒从别处知道”。"},{"id":"c_stu4","title":"律师名片与预约","text":"桌角压着一张“林建业律师事务所”的名片，背面是手写的预约：“周六 08:00，送文件至庄园，周振国先生，51% 股份，婚礼前勿告知子恒。”名片上有雪茄烟灰的痕迹。"}]}],"suspects":[{"id":"ziheng","name":"周子恒","role":"新郎","age":29,"look":{"skin":"light","hair":"short","hairColor":"black","glasses":"none","beard":"none","outfit":"suit","acc":"flower","mood":"worried"},"bio":"周家小儿子，明天的新郎，周明哲同父异母的弟弟。晚宴中途离席，说自己一个人在露台待了一阵，直到蛋糕环节才回到餐厅。","demeanor":"老实、短句，容易叹气，被戳到痛处会突然提高音量。","topics":[{"id":"t_rel","q":"你和哥哥感情如何？","a":"他比我大七岁。小时候我闯祸，他替我挨爸的打。后来他做策划，我做销售，各忙各的。我的婚礼方案他改了十几稿，一句怨言都没有。我真没想到……今晚会是最后一面。"},{"id":"t_quarrel","q":"你们今晚吵过吗？","lie":true,"a":"没有。我们兄弟俩从来不吵。他今天还帮我张罗整场婚礼，我怎么会跟他吵？警察同志，你们问这个，是怀疑我吗？","truth":"吵了。20:15 在走廊。爸要把 51% 股份给我哥，我说“凭什么”，他说“你先管好你的婚礼”。我摔了门就走，一个人到露台抽烟，一根接一根。后来才发现，那是我跟他说的最后一句话。"},{"id":"t_where","q":"21点后你在哪？","a":"露台。我一个人抽烟，想静一静。管家韩伯给我递过打火机，陪我站了一会儿，大约 21:12 到 21:22。我 21:25 才下楼，所以蛋糕被拖到了 21:40。"},{"id":"t_ring","q":"戒指是谁送去清洗的？","needs":["clue:c_gr1"],"a":"贺铭啊。他说顺路，我就把单子塞给他了，也没细看。……仿品？我不知道这回事，真的。他是我最好的兄弟，我没理由怀疑他。"},{"id":"t_ringmiss","q":"戒指丢了你怎么想？","a":"那是我奶奶留给若溪的，传了三代。谁拿走它，我跟他没完。可是我哥……我哥难道是为了一枚戒指丢了命吗？这太荒唐了。"},{"id":"t_bride","q":"若溪最近有没有异常？","a":"她这半个月老是接了电话就躲着我，我以为是婚前焦虑，也不敢问。你别告诉她是我说的，行吗？她胆子小，我怕她多想。"},{"id":"t_share","q":"股权意向书怎么回事？","needs":["clue:c_gr3"],"a":"那张纸是我下午在爸书桌抽屉里翻到的。我哥一向比我强，爸选他我认，可他们瞒着我，这口气我咽不下。你要说我杀了他？他是我哥啊，我再混蛋也做不出来。"}],"confronts":[{"clue":"c_gr3","breaks":"t_quarrel","a":"他一把攥住那张纸，指节发白。“……你们连这个都翻出来了。”沉默了很久，他才哑着嗓子开口：“我是吵了。但我吵完就去露台了，我没碰过他一根手指头。”"},{"clue":"c_hall3","a":"他看着烟灰缸里一半一半的烟头，苦笑。“都是我的。抽到一半，想起还有婚礼要办，就掐了，再点一根。管家说我再抽下去，明天嗓子要哑。”"},{"clue":"c_gh1","a":"听到“21:19”，他整个人僵住。“那会儿我正在露台，韩伯在我旁边。”他喃喃道，“我哥死的时候，我在抽烟，我在怨他。这种事我一辈子都忘不了。”"},{"clue":"c_stu4","a":"他盯着“51%”那几个字，嘴唇动了动。“原来周六早上就要签。”他深吸一口气，“爸连一句话都不肯提前跟我说。我哥呢？他知道吗？他从来不说。”"}],"fallback":"这个……我没见过，也不太明白，你问问别人吧。"},{"id":"ruoxi","name":"林若溪","role":"新娘","age":27,"look":{"skin":"fair","hair":"long","hairColor":"black","glasses":"none","beard":"none","outfit":"dress","acc":"necklace","mood":"sad"},"bio":"明天的新娘，小学美术老师。丢失的钻戒是周家传给她的信物。晚宴后她说自己回二楼化妆间换鞋、歇脚，直到蛋糕环节才下楼。","demeanor":"轻声细语，爱说“对不起”，紧张时会咬嘴唇、绞手指。","topics":[{"id":"t_rel","q":"你和明哲的关系？","a":"他像我另一个哥哥。选场地时他一个人跑了二十多家，只因为我随口说想要有暖房的庄园。他连我一句话都记着。对不起，我说着说着，眼睛又……"},{"id":"t_where","q":"21点后你在哪？","a":"我在二楼化妆间，换了双鞋，坐了一会儿，想静一静。21:30 才下楼切蛋糕。一个人，没人作证，对不起，我知道这样说不好。"},{"id":"t_exmeet","q":"你今晚见过顾衍吗？","lie":true,"a":"没有……我根本不知道他今晚会来。我们早就断了，我连他的号码都删了。真的，你们别往他身上想，他不是坏人。","truth":"见了。20:50 在花园长椅，五分钟。他喝了酒，求我别嫁，我让他走。我怕子恒误会，才瞒着没说。我只是想让他死心，对不起，我不该撒谎。"},{"id":"t_money","q":"婚礼专户那笔钱？","lie":true,"needs":["clue:c_stu3"],"a":"那笔钱我不太清楚，预算都是明哲哥在管，可能是工作室周转吧。我只负责签字，我对数字不敏感，对不起……","truth":"是我转的。顾衍欠了赌债被人堵，哭着求我，我一时心软转了三万二，想婚后再补上。20:30 明哲找我，要我明天前向子恒坦白，否则他来说。我很怕，可我没有伤害他。"},{"id":"t_ringfeel","q":"你试戴过戒指吗？","a":"9月底子恒拿给我试戴过一次。我觉得有点轻，还以为是改了圈口的缘故，没多想。对不起……难道，真的有问题吗？"},{"id":"t_ringmiss","q":"戒指失踪你怎么看？","a":"那是子恒奶奶留下的，三代人的心意。可我现在更在意的是明哲哥。戒指没了可以再买，人没了，就真的没有了。对不起，我说不下去了。"}],"confronts":[{"clue":"c_hall2","breaks":"t_exmeet","a":"她盯着卡片，手指不由自主地绞紧。“……是他写的。”声音很轻，“我去了，只坐了五分钟。”她咬着嘴唇，“我怕子恒误会，才没说。对不起，我是不是毁了所有人的信任？”"},{"clue":"c_stu3","breaks":"t_money","a":"她的脸一下子白了。“明哲哥连这个都记着……”她闭上眼，眼泪滑下来，“我知道不应该。可他当时那样哭，我没办法。”她深吸一口气，“我是怕，可我从没想过要他死。”"},{"clue":"c_gr1","a":"“仿品？”她愣住了，仿佛没听清，“难怪……难怪那天我戴上总觉得轻飘飘的。”她捂住嘴，“是谁换的？子恒他知道吗？天哪，这是传家宝啊。”"},{"clue":"c_gh3","a":"她看着空戒盒，指尖微微发颤。“他拿着放大镜……”她低声道，“明哲哥一向细心，如果他发现了什么，他一定会先自己弄清楚，再告诉我们。那是他的习惯。”"},{"clue":"c_stu1","a":"“顾衍的车一直没开走？”她吸了口气，“他今晚喝了酒，不会开车，大概在车里睡着了。”她迟疑，“他是个懦弱的人，不会伤害任何人，我敢保证。”"}],"fallback":"对不起，这个我不太清楚，我现在脑子里一片空白。"},{"id":"zhen","name":"周振国","role":"新郎之父","age":63,"look":{"skin":"tan","hair":"sidepart","hairColor":"grey","glasses":"rect","beard":"mustache","outfit":"suit","acc":"pocketwatch","mood":"stern"},"bio":"周氏建材创始人，周明哲与周子恒的父亲。晚宴上他陪亲家寒暄，之后说自己嫌吵，找了个安静的地方抽雪茄，直到蛋糕环节才露面。","demeanor":"威严、说话慢，爱训人，一口一个“年轻人”，嫌烦时直接敲桌子。","topics":[{"id":"t_rel","q":"你怎么看两个儿子？","a":"老大稳，老二浮。明哲跟着我从小学做事，遇事不慌；子恒心软，爱面子，心思都在姑娘身上。我从没偏心，只是做生意，要用最合适的人。"},{"id":"t_where","q":"21点到22点你在哪？","a":"21:05 前在餐厅陪亲家，之后去管家办公室抽雪茄，大概 21:08 到 21:40，韩伯中间给我添过一次茶。我老了，吵得慌，就想一个人待着。"},{"id":"t_lawyer","q":"你找过律师吗？","lie":true,"needs":["clue:c_stu4"],"a":"律师？没有。家里的事我现在没打算动，我还没老糊涂到婚礼前夜办这种事。年轻人，你别拿这种话来激我。","truth":"找了。周六早八点，林律师送文件来，把 51% 股份交给明哲。我想等婚礼过了再跟子恒说，免得他闹脾气。没想到明哲走在了我前面。我一个人在办公室抽烟，真不知该怎么开口。"},{"id":"t_aware","q":"子恒知道股份的事吗？","needs":["ask:zhen.t_lawyer"],"a":"他今天下午翻过我的抽屉，我是知道的，只是没点破。那孩子今晚摔门，我就猜到他看见了。……唉，我这当父亲的，两个儿子都没处理好。"},{"id":"t_ex","q":"你知道有前任来吗？","a":"管家来报过，我说让明哲看着办。年轻人的那点事，我才懒得管。他放人进来，应该有他的理由，他做事向来有分寸。"},{"id":"t_ring","q":"那枚戒指多值钱？","a":"老物件了，一点八克拉的老矿钻，去年估价四十多万。更值钱的是老太太留下的那份心意。谁要是偷了它，我追到天涯海角。"},{"id":"t_blame","q":"你怀疑谁？","a":"不好说。两个儿子脾气都冲，但杀人，不会。我更倾向外人，那个前任小子大半夜还赖在庄园，难说他安的什么心。"}],"confronts":[{"clue":"c_stu4","breaks":"t_lawyer","a":"他拿起名片，看了很久，手背上青筋一跳。“……你们翻到这个了。”片刻后他放下，声音沙哑：“是，我要把股份给明哲。我想等婚礼过了再说，是我自己糊涂了。”"},{"clue":"c_gr3","a":"“这张纸在老二手里？”他眉头一拧，随即颓然，“难怪他今晚摔门。我这个做父亲的，替他们安排了一辈子，到头来，一句话都没交代清楚。”"},{"clue":"c_gr1","a":"“仿品？”他的声音陡然拔高，“传家宝被人换成了假的？谁敢！”敲着桌子的手顿了顿，“……贺铭经手的？他和子恒穿一条裤子长大，我从没往那边想过。”"},{"clue":"c_hall3","a":"“打火机上刻着庄园的名字，不是我的。”他瞟了一眼烟灰缸，“我抽雪茄，不抽这种细烟。年轻人，别把我也圈进去。”"}],"fallback":"这种东西，年轻人，你拿来问我，不如去问管家。"},{"id":"xiaotang","name":"苏小棠","role":"伴娘","age":26,"look":{"skin":"light","hair":"ponytail","hairColor":"brown","glasses":"none","beard":"none","outfit":"dress","acc":"earrings","mood":"sly"},"bio":"新娘的表妹，医院护士，今晚的首席伴娘。她说自己整晚都在白鹭厅里帮表姐盯流程，跟伴郎伴娘团打闹，从没单独离开过。","demeanor":"咋咋呼呼，爱用网络词（破防、emo、绝了），慌了就笑得更大声。","topics":[{"id":"t_rel","q":"你和新娘什么关系？","a":"若溪是我表姐，从小一起长大，这伴娘我当得可是心甘情愿！今天一直帮她盯流程、看小物件，累得我脚都肿了。救命，明天的婚礼还办得成吗？"},{"id":"t_where","q":"21点后你在哪？","lie":true,"a":"一直在餐厅呀！帮若溪盯着蛋糕，还跟贺铭他们闹来着。不信你问陆野，他到处拍我呢！我哪儿也没去，绝了，你们不会怀疑我吧？","truth":"撒谎了。21:00 我偷偷溜去暖房门口抽烟，抽到 21:07。明哲那会儿一个人在摆弄戒指，拿着放大镜看，说“在等人”，让我先走。我怕被姨妈看见我抽烟，更怕被当成嫌疑人。"},{"id":"t_affair","q":"你和明哲私下很熟吗？","lie":true,"a":"不熟呀，就工作对接。他是策划，我是伴娘，顶多一起开过几次会。你问这个干嘛，我才不会为了这种事难过呢！","truth":"……交往过两个多月。7 月 14 号开始的，上个月他说“工作太忙”提了分手。我没恨他，就是难受，今晚一直在躲着他。可我真的没想过他会死，破防了。"},{"id":"t_bride","q":"新娘最近怎么样？","a":"我表姐吗？这半个月可 emo 了，老是接了电话就躲着打，我问她就说没事。她那个前任也真是，阴魂不散的，我都替她烦。"},{"id":"t_shoes","q":"你今晚穿什么鞋？","needs":["clue:c_gh4"],"a":"银色细高跟，好看吧？怎么了，鞋印的事吗？哎哟，别告诉我那串鞋印是我的……好吧，我承认我穿的就是这双，但别想太多！"},{"id":"t_ringmiss","q":"戒指失踪你怎么看？","a":"肯定是被人偷了呗，那么贵，谁见了不动心？宴会厅里进进出出的人那么多，盒子又一直不在新人手里，谁防得住啊！"}],"confronts":[{"clue":"c_gh4","breaks":"t_where","a":"她盯着那几个沾着玫瑰色口红的烟头，笑声一下子卡在嗓子里。“……行吧，是我。”她抓了抓头发，“我就抽了三根，一眼都没往里面看。那会儿明哲哥明明还好好的啊！”"},{"clue":"c_stu2","breaks":"t_affair","a":"她捏着那张拍立得，眼眶迅速红了。“他居然还留着……”她吸了吸鼻子，强笑了一下，“好吧，我们谈过恋爱。分手那天我哭了一整晚。可你们别看我，我对他只有难过。”"},{"clue":"c_gh3","a":"“放大镜？”她倒吸一口气，“我走的时候他就拿着它，在灯下对着戒指转来转去，脸色特别难看。当时我没敢问，现在想想，是不是他看出了什么？”"},{"clue":"c_hall1","a":"她凑过去看清单，“蓝缎带是伴郎的，我可记得清楚，因为是我提醒花艺师别弄混的。”她眨眨眼，“怎么，这跟案子有关系吗？”"},{"clue":"c_din1","a":"她看着照片，“这张我在场啊，当时人超多，大家抢蛋糕呢。”忽然顿住，“咦，贺铭怎么笑得这么用力？跟平时不太一样……”"}],"fallback":"啊？这个我真不知道，别逼我，我已经很慌了！"},{"id":"heming","name":"贺铭","role":"伴郎","age":29,"look":{"skin":"light","hair":"slick","hairColor":"black","glasses":"none","beard":"stubble","outfit":"suit","acc":"flower","mood":"smile"},"bio":"新郎周子恒的发小，做投资顾问，今晚担任伴郎，彩排时负责递戒指。晚宴上他一直在白鹭厅里带头闹酒，说中间只出去接过一个短电话。","demeanor":"嘴碎爱开玩笑，一口一个“兄弟”，被问急了就讲段子打岔。","topics":[{"id":"t_rel","q":"你和周家兄弟的关系？","a":"我跟子恒穿一条裤子长大的，明哲哥算半个亲哥。这场婚礼从选址到流程都是他一个人盯的，昨天还拍我肩膀说：“你这伴郎要是掉链子，我拿花剪戳你。”唉，谁想到今天人就没了。"},{"id":"t_where","q":"21点到22点你在哪？","lie":true,"a":"全程在白鹭厅啊，陪伴娘们疯。哎对了，21:21 陆野还给我拍了一张，我举着杯子笑得跟傻子似的，不信你去翻他的相机。中间就出去接了个电话，三两分钟的事儿。","truth":"我撒谎了。21:08 我说去接电话，其实是从后厨走月季小路去了暖房。明哲约我谈戒指，我们吵到 21:19，我推了他一把，他后仰着撞上花架，我抓起喷壶就砸了下去……21:38 我才回的餐厅。"},{"id":"t_ring","q":"戒指是你经手的吗？","lie":true,"a":"就是帮子恒跑腿，送去琢玉轩清洗改圈，9月5号取回来直接交给子恒。彩排那天交给明哲保管，我连盒子都没多开过。这种传家宝，我哪敢乱碰。","truth":"我多开过。那枚是仿品，我订的。真钻我 9 月 6 日就卖了，二十二万。我想着婚后赚了钱赎回来，神不知鬼不觉。谁知道明哲一眼就看出来了。"},{"id":"t_money","q":"你最近手头紧吗？","lie":true,"a":"我？做投资顾问的，吃的就是钱这碗饭。今晚伴郎红包我都包了两万六，紧什么紧，别拿我开涮啊兄弟。","truth":"紧得要命。我赌球输了，借了鼎盛财务三十六万，十八号到期，不还就要断我一只手。卖钻的钱还了一部分，还差十几万的窟窿，我真的走投无路了。"},{"id":"t_flower","q":"你的胸花呢？","lie":true,"needs":["clue:c_gh2"],"a":"胸花？晚宴上跟伴娘们闹，不知蹭哪儿掉了。我也纳闷，花艺师别得那么紧。丢了就丢了，一朵花又不值钱，你们不会因为一朵花怀疑我吧？","truth":"是在暖房里被扯掉的。明哲死死抓着我的领口，我挣开的时候，胸花连着针被他一把拽了下来。我当时慌得没有捡，只管把戒指盒里的东西抓走了。"},{"id":"t_photo","q":"那张21:21的照片？","lie":true,"needs":["clue:c_din1"],"a":"就是随手拍的呀，我举杯跟伴娘们闹，陆野顺手按了快门。他那台相机准得很，时间还能有假？您别疑神疑鬼，我真就是个普通的伴郎。","truth":"我知道他的相机慢了二十分钟，20:55 他自己在那儿抱怨。我 21:38 回餐厅，趁着切蛋糕乱，叫他给我拍一张。相机上显示 21:21，不就等于告诉大家，我那会儿还在餐厅里。"},{"id":"t_suspect","q":"你觉得是谁干的？","a":"还用问？顾衍呗。前任跑到人家婚礼现场，不是来抢人就是来抢东西，戒指不就丢了么？再不然就是子恒跟他哥吵翻了——我可不是怀疑兄弟，我就是讲逻辑。"}],"confronts":[{"clue":"c_din1","breaks":"t_where","crack":true,"a":"他盯着相机屏幕，嘴角还挂着笑，眼神却先冷了一下。“照片是陆野拍的，21:21 的我在笑，您看，我怎么可能……”话到一半，他的目光不由自主地落在背景那座钟上，喉结滚了一下。"},{"clue":"c_kit1","breaks":"t_where","a":"“冲手而已。”他嗤笑一声，笑意却僵在脸上，“我可能去洗手间那条路走岔了。”他搓了搓指节，像要把什么搓掉。“穿深色礼服的满场一半，凭什么就是我？”"},{"clue":"c_gh2","breaks":"t_flower","a":"他低头看着那半朵胸花，下意识摸了一下自己的左翻领，那里只有一个针孔。“……这花看着眼熟。”他干笑两声，“蓝缎带的……行，您说是我的，那就是我的。”声音越来越低。"},{"clue":"c_gr1","breaks":"t_ring","a":"“仿品……”他舔了舔嘴唇，“朋友，我这个人爱闹，订个仿品给新郎开玩笑，不行吗？”没人接话，他的笑声越来越小，“好吧，这个玩笑开大了。”"},{"clue":"c_gr2","breaks":"t_money","a":"他看着那两份文件，肩膀垮了下去，嗓子发干。“您翻我包了……对，我缺钱。缺得睡不着觉。”他苦笑，“伴郎红包还是我跟别人借的，您说好笑不好笑。”"},{"clue":"c_din2","breaks":"t_photo","a":"“钟是准的……”他喃喃道，随即猛地抬头，“那又怎样？相机慢了，我哪知道！”声音拔高得有点刺耳，可手指一直在轻轻发抖。“我怎么可能提前算好……”"},{"clue":"c_kit3","a":"他扫了一眼小路上的脚印，嗤了一声：“这路谁都能走，月季又不会说话。”嘴上轻松，却下意识把手插进裤兜，笑得有点勉强：“您该不会要去池子里捞线索吧？”"},{"clue":"c_gh1","a":"他听到“21:19”这个时间，肩膀轻微一震，很快又恢复了嬉皮笑脸。“这么准？警察同志真厉害。”他挠挠头，“可惜我那会儿，在餐厅。”说得太快，像背过的台词。"},{"clue":"c_hall2","a":"“前任写的小卡片？”他把卡片翻过来看了看，撇撇嘴。“这种桥段我只在电视剧里见过，编剧都懒得写了。”他顿了顿，“不过顾衍有这个动机，是吧？我可没说他不是凶手。”"}],"fallback":"这东西跟我有什么关系？兄弟，你别为了破案瞎找人下嘴啊。"},{"id":"guyan","name":"顾衍","role":"新娘前任","age":30,"look":{"skin":"tan","hair":"messy","hairColor":"black","glasses":"none","beard":"stubble","outfit":"coat","acc":"scarf","mood":"tired"},"bio":"新娘的前男友，开酒吧的，没有请柬却出现在庄园。他承认来过，说自己和新娘说了几句话后就离开了，对后来发生的事一无所知。","demeanor":"带着酒气，嘴硬爱讽刺，江湖腔，自嘲时会苦笑一声。","topics":[{"id":"t_rel","q":"你和新娘什么关系？","a":"前女友，处了四年。我没出息，她爸妈看不上，就分了。今晚我来，不是为了闹，就是想亲口说句祝福。虽然我嘴里一点不祝福。"},{"id":"t_leave","q":"你什么时候离开的？","lie":true,"a":"跟若溪聊了几句我就走了，大概九点前，还回家睡了一觉。后面发生什么，我一概不知，别拿这种事往我头上扣，我再混也有底线。","truth":"没走。我喝多了，开不了车，就在停车场车里窝着，一直到警察来。21:30 左右我看到一个穿深色礼服的男人从暖房那条小路过来，在厨房后门冲手，没看清脸，只觉得他走得很急。"},{"id":"t_letter","q":"那张字条是你写的？","a":"是。托服务生塞进捧花里的。丢人，可我实在没别的办法。她来了，坐了五分钟，一句话都不肯松口，我也就死心了。"},{"id":"t_threat","q":"明哲对你说过什么？","a":"放我进来的时候他说：“给你十分钟，别闹事。”后来听说我还在庄园，他让保安盯着我。他是个讲规矩的人，我不恨他，甚至有点佩服他。"},{"id":"t_money","q":"三万二是怎么回事？","needs":["clue:c_stu3"],"a":"她告诉你们了？是我欠的赌债，她可怜我才转的。我会还，我发誓。明哲说如果她不坦白，他就要告诉子恒。说实话，我听着都觉得他是为她好。"},{"id":"t_suspect","q":"你觉得谁有问题？","a":"我？别逗了，所有人第一眼怀疑的就是我这种人，我认。可我真没动过手，连暖房朝哪个方向开门都没摸清。不信你们去查我的鞋底，看有没有暖房的土。"}],"confronts":[{"clue":"c_stu1","breaks":"t_leave","a":"他盯着出场栏的空白，苦笑了一声。“你们查得真细。”他摸了摸后脑勺，“行，我没走。我坐在车里，一杯接一杯地灌，想着要不要再进去一次，最后没勇气。”"},{"clue":"c_hall2","a":"“那是我写的。”他低头看着卡片，“字丑吧？喝了点酒。她来了，我们说了五分钟，她让我走。我是真想走，可是腿不听使唤。人哪，总是在最没出息的时候最想要面子。”"},{"clue":"c_stu3","a":"“这张表是明哲的？”他的脸色变了变，“他一直盯着这件事，我以为他看不起我。原来他是想让她自己说出口。……我这个前任当得，真他妈不是东西。”"},{"clue":"c_kit1","a":"他看到“21:30”那一栏，眼睛一亮。“对对对，就是这个点！我在车里看到的，那人从后门进去洗手，我还纳闷，一个客人怎么往厨房钻。”他顿了顿，“可惜我真没看清他的脸。”"}],"fallback":"这玩意儿我没见过。别看我，我现在比你们谁都想知道真相。"},{"id":"hanbo","name":"韩伯","role":"庄园管家","age":58,"look":{"skin":"light","hair":"bald","hairColor":"grey","glasses":"round","beard":"none","outfit":"vest","acc":"tie","mood":"neutral"},"bio":"白鹭庄园干了二十年的管家，管钥匙、门岗和酒水。21:55 他去关暖房的加湿系统，发现了周明哲的尸体并报了警，自称整晚都在岗位上。","demeanor":"稳重守规矩，话带老派敬语，被问到私事会含糊其辞，说“这个嘛”。","topics":[{"id":"t_role","q":"你在庄园做什么？","a":"管家，在白鹭庄园二十年了。钥匙、门岗、酒水、客人起居，样样归我管。婚礼期间我格外小心，没想到还是出了这种事，实在对不住周家。"},{"id":"t_found","q":"尸体是你发现的？","a":"是。21:55，我去关暖房的加湿系统，推开门就看见周先生倒在兰花架旁。我摸了摸他的颈脉，已经没有跳动了。我马上报了警，别的东西一概没碰。"},{"id":"t_terrace","q":"你见过新郎吗？","a":"见过。21:12 到 21:22，我在露台给少爷递打火机，陪他站了一会儿。他一个人说了很多话，眼圈红红的。那十分钟，他没离开过我的视线。"},{"id":"t_ex","q":"前任怎么进来的？","a":"20:38 到的门岗，没有请柬。我想拦，周先生说放他进来，免得外面闹得更难看，还嘱咐我登记在册。他是策划师，我听他的。"},{"id":"t_door","q":"暖房的门锁吗？","a":"暖房晚上不锁，里头要通风保湿。侧门通花园小径，另一头有一条月季小路直通后厨后门，熟悉庄园的人才知道这条路。"},{"id":"t_wine","q":"酒窖有缺什么吗？","lie":true,"needs":["clue:c_kit2"],"a":"酒窖一切正常，一瓶没少。今晚的酒水都是按清单走的，您可以放心，我这个管家当了二十年，从没出过这种差错。","truth":"少了一瓶 09 年的波尔多红，是我私自开的。20:55 我心里发慌，想压压惊，结果只喝了一杯就听说出事了。我不想让雇主知道，怕丢了饭碗，这事与命案毫无关系。"},{"id":"t_tea","q":"周董事长那晚在哪？","a":"周董在我办公室抽雪茄，21:08 前后我给他送了一壶茶，随后就去露台找少爷了。21:23 我从露台回来续茶，周董还坐在沙发上，雪茄烟灰积了一小堆。"},{"id":"t_pond","q":"小路边那池子是什么？","needs":["clue:c_kit3"],"a":"锦鲤池，夫人当年挖的，水深一米多，池底铺着鹅卵石，掉进去的小东西根本找不着。我原本打算婚礼前一早叫人抽水清淤，如今警方封了庄园，这活儿也只能先搁着。"},{"id":"t_route","q":"谁能不被人看见走到暖房？","a":"除了正门，就是后厨那条小路。夜里没人走，月季丛又密，过去要四五分钟。我不敢乱说是谁，但有心的人，一定知道。"}],"confronts":[{"clue":"c_kit2","breaks":"t_wine","a":"他看着簿子上那个“韩”字，脸一点点红起来。“这个嘛……是我。”他清了清嗓子，“这事我不想让周董知道，一瓶酒而已。可不管怎么说，那会儿我都在酒窖，没离开过庄园半步。”"},{"clue":"c_hall3","a":"“这打火机是庄园的。”他拿起来看了看，“少爷不抽烟的人，今晚却一根接一根。我陪他站着，一句话没劝。”顿了顿，“人这种时候，总要有点东西握在手里。”"},{"clue":"c_stu1","a":"“这是我登记的。”他点了点头，“我以为他走了。车一直停在那儿，我没想到他还在。”他叹气，“年轻人，感情的事，唉，说不清。”"},{"clue":"c_kit3","a":"“这条路我知道。”他蹲下身看了看泥地上的脚印，“那些月季是夫人亲手种的。任何人踩过去，都会留下痕迹，可今晚来来往往的人太多，分不出是谁。”"}],"fallback":"这个嘛……我不太清楚，您还是问问别人吧。"},{"id":"luye","name":"陆野","role":"摄影师","age":32,"look":{"skin":"tan","hair":"messy","hairColor":"brown","glasses":"none","beard":"stubble","outfit":"jacket","acc":"badge","mood":"tired"},"bio":"明哲婚礼工作室长期合作的自由摄影师，负责今晚彩排晚宴的全场抓拍。案发时他一直在白鹭厅里拍照，相机和器材都留在餐厅桌边。","demeanor":"话少，懒洋洋，爱用摄影行话，被问到专业问题会立刻绷紧。","topics":[{"id":"t_role","q":"你今晚负责什么？","a":"全场抓拍：晚宴、新人互动、宾客合影。明哲哥交代多拍伴郎伴娘，说明天要剪短片。现在想想，这批片子大概要变成遗物了。"},{"id":"t_clock","q":"你的相机时间准吗？","lie":true,"a":"准啊。我出门前跟手机对过，一分不差。吃这碗饭，时间戳是我的底线，真出了错，我自己都没法交片。","truth":"不准。20:55 我换了块电池，要重设时间，手忙脚乱凭印象设的，结果慢了差不多二十分钟。后来发现了也没敢改，怕老板说我不专业，扣我尾款。这事我谁也没说，贺铭倒是听见过我嘀咕。"},{"id":"t_lapel","q":"伴郎的胸花呢？","needs":["clue:c_gh2"],"a":"咦，您这么一问……20:30 的合影里，贺铭那朵蓝缎带胸花还别得好好的，我有这张。可是 21:21 那张，他左边领口是空的。我当时只顾着构图，完全没留意。"},{"id":"t_group","q":"谁中途离开过？","a":"新郎 21 点前后就不见了，说是去透气；伴郎出去接过电话；伴娘们也进进出出。我盯着取景框，没数人头。真要我说谁几点出去的，我给不出准话。"},{"id":"t_cake","q":"蛋糕几点切的？","a":"原定 21:30，新郎迟到，拖到了 21:40 才开始。那阵子大厅乱哄哄的，谁招呼我拍我就拍，哪张先哪张后，我真记不清。"},{"id":"t_ringshot","q":"彩排时拍过戒指吗？","a":"交接戒指盒那会儿，我给过一个特写。怪了，听说是一点八克拉的老钻，在灯下居然不怎么“冒火”，我还以为是自己打光不对，补了一张也一样。明哲哥当时凑过来看了好久，什么也没说。"},{"id":"t_shots","q":"你还拍到了什么？","a":"20:50 我去花园取景，远远拍到新娘和一个男人坐在长椅上说话，我没敢多拍。后来才知道那是前任。这种照片放着也没用，我早删了，只记得两人都挺难过。"}],"confronts":[{"clue":"c_din1","breaks":"t_clock","a":"陆野一把抢过相机，翻到那张照片，手停在半空。“墙上的钟……九点四十一？”他喉头动了动，“我的天，我的相机慢了。”沉默片刻，他苦笑：“我装不知道，其实一晚上都心虚。”"},{"clue":"c_din2","breaks":"t_clock","a":"“钟是准的？”他叹了口气，抹了把脸，“那就说明真是我的相机出事了。我换电池时就觉得时间跳了，可怕老板念叨，没敢说。您说这算不算帮了谁的忙……”"},{"clue":"c_gh2","a":"他不敢多看那半朵胸花。“蓝缎带是伴郎的。”声音很轻，“那朵我拍过特写，白兰花，银针。我拍了一晚上花，没想到会在这种地方再见到它。”"},{"clue":"c_din3","a":"他看着流程表上的红字，挠了挠头发。“蛋糕推迟这事我印象很深，新郎一直没回来，大家干等着，我拍了好几张无聊的脸。——老板就是这样，什么都要写进表里。”"},{"clue":"c_hall2","a":"“字条……”他想了想，“应该就是花园长椅上的那个人写的。我拍到的两人，一个低着头，一个一直说话。那种场面我见得多，婚礼上多的是没说完的话。”"}],"fallback":"这东西我没拍过，也不太懂。构图这块我熟，案子我真不在行。"}],"solution":{"culprit":"heming","method":{"q":"凶手怎么做到的？","options":["外来窃贼从暖房侧门潜入，抢戒指时失手打死了周明哲","新郎在露台与哥哥争吵后折回暖房行凶，再让管家为自己作证","趁离席潜入暖房杀人拿走戒指，并利用摄影师慢了二十分钟的相机照片制造不在场证明","前任顾衍躲在暖房里行凶，再利用停车场的车辆逃脱监控"],"correct":2},"motive":{"q":"为什么杀人？","options":["为了抢在婚礼前夺得周家公司 51% 的股份","挪用婚礼预算的事被周明哲揭穿，怕婚礼上被当众拆穿","因为与周明哲的感情纠葛，嫉恨他分手","他早已偷换并卖掉真钻还赌债，被周明哲当场识破，杀人并拿走仿品灭迹"],"correct":3},"keyClues":["c_din2","c_gh2","c_hall1","c_din1","c_gr1","c_gr2"],"truth":["凶手是伴郎贺铭。他在赌球上欠下三十六万高利贷，9 月初借着替新郎送戒指清洗的机会，订了一枚锆石仿品，把周家传家的 1.8 克拉真钻换掉卖了二十二万。","彩排结束后，周明哲在交接戒指盒时用放大镜发觉不对，没有声张，只约贺铭 21:10 到暖房私下问清楚。贺铭 20:55 又恰好听见摄影师陆野抱怨：他换电池重设时间时设错了，相机慢了二十分钟。","21:08 贺铭借口接电话离席，走厨房后门的月季小路去暖房。两人争执到 21:19，周明哲抓住他的领口，扯掉了他蓝缎带的胸花，贺铭推倒对方，抓起铜喷壶砸向他的后脑，随后拿走戒指盒里的仿品，把它扔进了月季小路边的锦鲤池，小物件沉进池底的鹅卵石间，直到警方抽干池水才会浮出来。","21:30 他在后厨后门冲手，被厨师和躲在车里的顾衍看见一个“穿深色礼服的人”。21:38 回到餐厅，趁切蛋糕混乱，他叫陆野给自己拍了一张：相机显示 21:21，仿佛他在案发两分钟后还在笑。","可照片背景里准时的挂钟指着九点四十一分，翻领上的胸花也不见了。这与暖房里压在死者手边的蓝缎带胸花对上，而蓝缎带只属于伴郎。","戒指不是被劫走的值钱货，而是被拿走的赃证；取件单上的仿品加订、借款协议和卖钻收据，一起解释了贺铭为什么非杀人不可。新郎、新娘、前任、伴娘各有隐瞒，却都与命案无关。"]}},{"id":"antique","title":"古董店","tagline":"镇店之宝纹丝未动，老掌柜却死在了后堂——这一夜，谁在替谁说谎？","difficulty":3,"cover":"cover","tone":"sepia","brief":"一九九八年十月，省城老街。你接到老街派出所的电话：聚珍斋的老掌柜谷鸿年昨夜死在了后堂。店里的“镇店之宝”宣德青花梅瓶一直立在展柜里，纹丝未动，没有人抢，也没有人偷。所里却收到一张匿名条子，说“聚珍斋有事瞒着”。你赶到时，学徒方小满脸色惨白地守在门口，前堂的灯还亮着，后院的葡萄藤在风里沙沙作响，街对面几个街坊正探头张望。你有十二次搜证的机会，二十六次发问的机会。真与假之间，有人在撒谎。","victim":{"name":"谷鸿年","desc":"聚珍斋第三代掌柜，六十八岁，侧卧在后堂太师椅旁，后脑凹陷，左腕上的机械表表蒙碎裂，指针停在九点十分。收音机还在大声放着评书。","look":{"skin":"light","hair":"short","hairColor":"white","glasses":"round","beard":"none","outfit":"robe"}},"publicFacts":["谷鸿年，六十八岁，聚珍斋第三代掌柜，店开了百年，一九八五年从国营门市部改回个体，合伙人是常永昌。","店里的镇店之宝是一只宣德青花云龙梅瓶，一九七九年十一月曾被盗，三天后追回，当时的学徒沈文清因此被判十年，一九八三年病死狱中。","十月二十一日，谷鸿年向省文物鉴定站递交了梅瓶热释光检测委托，约定十月二十六日（周一）上午由鉴定站派员到店取样。","展柜铜锁完好，梅瓶未被动过，保险柜也没有被撬，现场没有劫财的迹象。","凶器疑为案头的铜镇尺，店里的前门与后门均无撬痕，店里有人配了钥匙。"],"timeline":[{"t":"19:30","text":"聚珍斋打烊，徒弟方小满锁前门，谷鸿年留在后堂。"},{"t":"21:10","text":"谷鸿年左腕机械表停在这个时刻，表蒙碎裂。"},{"t":"22:10","text":"方小满按约回店，推开后门，发现谷鸿年倒在地上。"},{"t":"22:14","text":"方小满用店里的电话报警。"},{"t":"22:30","text":"老街派出所民警到场，封锁后堂与前堂。"},{"t":"22:40","text":"民警记录：后堂的收音机仍在播放，音量被拧到最大。"},{"t":"23:05","text":"警医到场验尸，确认后脑钝器伤致死。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"hall","name":"聚珍斋前堂","scene":"hall","desc":"临街的铺面，博古架、玻璃柜台、一张老柜台，墙上挂着“聚珍斋”的老匾。打烊后灯还亮着，正中的展柜里立着那只镇店之宝。","clues":[{"id":"c_hall1","title":"展柜里的梅瓶","text":"玻璃展柜中立着一只青花云龙纹梅瓶，高约三十八厘米，釉色莹润，口沿光洁完整，底足有“大明宣德年制”六字楷书款。展柜的铜锁完好，柜前木牌写着“镇店之宝·谢绝拍照”，玻璃上有一圈新擦的指痕。"},{"id":"c_hall2","title":"来客登记簿","text":"柜台上的毛边纸登记簿，十月二十三日一栏记着：“15:20 俞鹤龄，观瓶”“17:50 蒋文彬（省拍卖行），洽谈代销与鉴定事宜”，蒋名字后的离店栏被人用钢笔补写了“19:15”。前一天十月二十二日一栏有“16:00 港商林嘉明”，没写事由。"},{"id":"c_hall3","title":"鉴定委托回执","text":"压在柜台玻璃下的一张蓝色回执：“省文物鉴定站委托登记回执：梅瓶一件，委托热释光断代检测，约定十月二十六日（周一）上午由本站派员到店取样，委托人谷鸿年。十月二十一日”，签名一栏是谷鸿年的亲笔。旁边另夹着一份蒋文彬署名的《代销意向书》，谷的签字栏空白。"},{"id":"c_hall4","title":"柜台上的BP机","text":"柜台抽屉半开着，谷鸿年的摩托罗拉 BP 机放在里面，屏幕还亮着一条汉显：“叔，速回电！立群 20:52”。旁边的电话机听筒搁放得很正，话机下压着一张写着“十点，小满来”的便条纸。"}]},{"id":"study","name":"后堂","scene":"study","desc":"前堂后面的小厅，一张太师椅、一张紫檀小几、一架多宝格，案上摆着文房四宝和铜器。谷鸿年平日就在这里会客、看货、听收音机。","clues":[{"id":"c_study1","title":"碎表","text":"谷鸿年侧卧在太师椅旁的地上，后脑一处凹陷，血已发暗。左腕上的上海牌机械表表蒙正中被砸成蛛网，碎玻璃卡住了指针，时针分针停在 9 点 10 分；表冠被整个拉出，处在校时位置，表壳背面却光洁，没有磕碰痕。地上没有拖拽痕，椅子也没有倒。"},{"id":"c_study2","title":"警医的初步意见","text":"二十三点零五分，警医蹲下按压尸体：尸僵已蔓延到全身大关节，尸斑指压不褪，身体已凉透。他说死亡“少说过去两个半钟头，三个半钟头也不稀奇”。案上的铜镇尺一角带血与白发，凹陷伤的形状与它的棱角相合。"},{"id":"c_study3","title":"两只盖碗","text":"紫檀小几上并排摆着两只盖碗。靠太师椅的一只茶汤只剩小半、边沿有唇印；另一只盖碗斟得满满的，茶叶是茉莉高碎，浮着一层冷膜，盖子根本没揭开过。"},{"id":"c_study4","title":"开大的收音机","text":"多宝格上的红灯牌收音机还开着，调在省台，音量旋钮拧到了底。旋钮旁贴着一条小红纸，上面用毛笔写着一个“三”字，现在的位置远远超过红纸的标记。旁边的保险柜锁着，没有被动过。"}]},{"id":"library","name":"账房与档案室","scene":"library","desc":"后堂旁的小屋，四壁是账簿和线装的货单，樟脑与旧纸气味很重。一张老书桌上摊着谷鸿年的稿纸和一只铁盒。","clues":[{"id":"c_lib1","title":"信稿","text":"稿纸上是谷鸿年的蝇头小楷，抬头“致市公安局”，落款日期十月二十二日：“……一九七九年十一月本店梅瓶失窃一案，学徒沈文清并非窃贼，实为我私售真品、另请人仿制，嫁祸于他……沈文清已死于狱中。余时日无多，愿以此身承担。仿制者尚在，我已约其周五晚八点来后堂，劝其同我一道投案……”信未写完，没有署名盖章。"},{"id":"c_lib2","title":"旧照与剪报","text":"抽屉里一张发黄的黑白照片，背面铅笔写着“1979.9 梅瓶摄于店中”：照片里的梅瓶口沿内侧有一处米粒大小的补痕，旁边站着一个二十出头的年轻学徒。夹着的剪报是一九七九年十一月五日《省城日报》：“文物商店梅瓶被盗案告破，学徒沈某落网，追回国宝一件”。"},{"id":"c_lib3","title":"合伙分红账","text":"账桌上翻开的一本分红账，一九九六年到一九九八年几页被红笔圈满，“常永昌”名下多出三笔“私支”，合计三万元，页边谷鸿年批着：“来路不明，限月底还清。”账本边上还有一张便条：“周五晚找老常谈。”"},{"id":"c_lib4","title":"铁盒里的汇款单","text":"桌上的铁盒里是一叠汇款存根，一九八四年起每月一张，收款人“贺秀英”，每张八十元，从未间断，最后一张在十月初。盒底另压着一份判决书抄件：“被告人沈文清犯盗窃国家文物罪，判处有期徒刑十年”，旁边有谷鸿年用铅笔画的一个圈。"},{"id":"c_lib5","title":"旧药费单","text":"一捆用麻绳扎好的旧单据压在铁盒下：一九七九年的住院通知和药费催缴单，抬头是“谷门周氏”，欠费数千元，一张比一张催得急。最末一张盖着蓝色“结清”章，日期是一九七九年十月二十九日。"}]},{"id":"cellar","name":"地窖库房","scene":"cellar","desc":"店后的地窖，阴凉干燥，码着木箱、旧家具和没来得及修的瓷器。一盏昏黄的灯泡吊在梁下。","clues":[{"id":"c_cel1","title":"旧木箱","text":"角落里一只旧樟木箱，箱盖内壁墨书“乙·梅”二字。箱里垫着揉皱的旧报纸，是一九七九年十月三十日的《省城日报》，报纸下压着一张撕下的宣纸条，一角盖着半方残朱印，只辨得出“缘斋·钟”几个字，纸条背面有干透的浆糊痕。"},{"id":"c_cel2","title":"麻布包","text":"货架后塞着一只蓝布包，里面是空的，只剩三张谷鸿年手写的货签——“玉蝉”“鼻烟壶”“核桃一对”——货签上都被人用铅笔划了价。布包上压着一张省拍卖行的收货单副本，经手人栏写着“蒋”。"},{"id":"c_cel3","title":"港商名片","text":"一只旧樟木书箱的夹层里压着一张名片：“林嘉明·香港嘉廷古玩行”，背面用圆珠笔写着：“家父林廷芳，一九七九年十月于贵店购得梅瓶一件，付款凭据尚存。请谷先生拨冗一谈。十月二十二日”。名片边上有被指甲掐出的折痕。"}]},{"id":"garden","name":"后院与夹道","scene":"garden","desc":"店后的小院，一口井、一架葡萄藤、一个堆煤的角落。院墙边有一扇小木门通向两铺之间的窄夹道，另一边是通往街后的后门。","clues":[{"id":"c_gar1","title":"夹道小门","text":"院墙上的小木门，内侧门闩被拔开，门板虚掩。门框离地约一米处有两处灰白色发黏的指印，门轴上粘着几片碎纸屑。门外夹道的泥地上有一串浅脚印，深浅不一，步距时长时短，走到夹道中段就被踩乱了。"},{"id":"c_gar2","title":"窗下烟头","text":"后堂窗下的墙根，落着三个红塔山烟头，烟屁股都被碾过，间隔不远，说明有人在这里站过一阵。烟头旁的泥地上有一对宽大的皮鞋印，鞋头朝着后堂的窗。"},{"id":"c_gar3","title":"后门钥匙板","text":"后门边钉着一块小木板，挂钩上写着“谷”“满”“常”，现在“谷”和“满”两个挂钩上挂着钥匙，“常”字钩上是空的。后门的门闩没有插，门板只是虚掩着。"}]},{"id":"kitchen","name":"灶间","scene":"kitchen","desc":"后堂旁的小灶间，一口煤球炉、一只砂锅、一个碗柜。碗柜里的碗碟不多，却码得整整齐齐。","clues":[{"id":"c_kit1","title":"半碗面","text":"灶台上放着一只青花粗碗，阳春面只吃了两三口，汤面凝出了白油花，面条黏成一团。碗旁一只竹编小食盒，盖子里贴着一小片红纸，用毛笔写着“贺”字。碗柜里本来成套的盖碗少了两只。"},{"id":"c_kit2","title":"诊断书与药","text":"碗柜下层的抽屉里有一张省人民医院的诊断书：“谷鸿年，男，68 岁，肺癌（晚期），建议住院”，日期十月十九日。旁边一个药袋，里面的止痛片只剩几粒。"},{"id":"c_kit3","title":"灶间门口票根","text":"灶间门槛内侧的地上落着一张被踩脏的“金鼎录像厅”票根，印着“10月23日 20:10 场”，旁边滚着半包前门烟。门后挂着一件蓝布围裙，上面用红线绣着一个“满”字，口袋里是空的。"}]}],"suspects":[{"id":"fang","name":"方小满","role":"店里学徒","age":26,"look":{"skin":"tan","hair":"messy","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","acc":"badge","mood":"worried"},"bio":"聚珍斋的学徒，跟谷鸿年学了六年，管开门关门、擦货、跑腿。昨晚是他锁的前门，也是他十点回店第一个发现了尸体。","demeanor":"嘴快、慌张，爱说“哎呀”“师傅常说”，被问急了声音发飘。","topics":[{"id":"t_role","q":"你在店里做什么？","a":"擦货、跑腿、看柜台，师傅教我认器物、认款识。哎呀，六年了，师傅骂我最多，可真正教东西也是他最舍得。我家里没人，这店就是半个家。"},{"id":"t_leave","q":"昨晚几点离店的？","a":"七点半打烊我锁了前门，七点四十五从后院走的。师傅留在后堂，说他还有客人。我走出后院时，听见后堂里常老板在吼，吼得好大声。"},{"id":"t_home","q":"离店后去了哪里？","lie":true,"a":"我直接回家了呀，吃了碗泡面，倒头就睡，真的。我住在城南，一个人，没人能作证，可我没骗你们。","truth":"我没回家。我去蒋经理家送了最后一件小货，三回加起来拿了三百块钱，然后去金鼎录像厅看了八点十分那场。我怕您以为我偷师傅的东西，就瞒了。"},{"id":"t_stolen","q":"你动过店里的货吗？","lie":true,"a":"没有！师傅的货我碰都不敢乱碰，擦货都要戴白手套的。你们不能因为我是徒弟就怀疑我。","truth":"动过……三回。一只玉蝉、一个鼻烟壶、一对核桃。师傅最近总说我“靠不住”，我怕被赶走，就偷偷拿去卖，想攒点钱另找活路。但师傅的命，我真不敢。"},{"id":"t_return","q":"为什么十点又回来了？","a":"师傅前天交代的：“十点你再来一趟，有话同你说，不要早，不要晚。”我准十点到，推后门，看见他躺在地上，天……我手都软了，才摸到电话报的警。"},{"id":"t_fired","q":"师傅要对你说什么？","needs":["clue:c_hall4"],"a":"我猜是要赶我走。前些天他看我的眼神就怪，不骂了，反而话少。那张便条上写“十点，小满来”，我以为是让我走人，现在想想，也许他有话没来得及说完。"},{"id":"t_quarrel","q":"常老板吼了什么？","needs":["ask:fang.t_leave"],"a":"好像是“你查我的账，你凭什么”，还有“三万块你要逼死我”。师傅的声音很低，一句也听不清。我不敢多听，从后院溜了。"},{"id":"t_health","q":"师傅最近身体怎样？","needs":["clue:c_kit2"],"a":"他咳血咳了好几天，不让我告诉别人。前天还让我拿着委托单跑了趟鉴定站，约好下周一他们来人取样，说“这瓶子，该有人把它的底细看看清楚”。我那时没懂。"}],"confronts":[{"clue":"c_kit3","breaks":"t_home","a":"他盯着那张票根，脸一下红到耳根。“……那场电影，一直放到十点才散。”他挠着头，“我以为没人会发现。我真的没杀人，八点十分我就坐在黑漆漆的厅里，一屋子人都在抽烟。”"},{"clue":"c_cel2","breaks":"t_stolen","a":"“这个……”小满往后缩了一步，声音发飘，“货签是师傅写的，价是我划的。我不是想偷，是想攒点路费。”他低下头，“我知道自己糊涂，可师傅出了事，我比谁都怕。”"},{"clue":"c_hall4","a":"他看着“十点，小满来”几个字，嘴唇抖了抖。“师傅的字……他那天写得特别慢，一笔一划的。”他吸了吸鼻子，“要是我早半个钟头回来就好了。”"},{"clue":"c_study1","a":"“表……师傅最爱惜那块表。”小满瞪大眼睛，“他睡觉都不摘，怎么会摔成这样？我只见他对着表发过呆，说“该办的事不能再拖了”。”"},{"clue":"c_hall1","a":"他伸手想去碰玻璃，又缩了回来。“师傅说，这瓶子是活的，擦一次，脾气不同一次。可他前些天擦的时候，手抖得拿不稳布。”"}],"fallback":"哎呀，这个……我没见过，师傅也没交代过。"},{"id":"li","name":"谷立群","role":"死者亲侄","age":41,"look":{"skin":"tan","hair":"slick","hairColor":"black","glasses":"sun","beard":"stubble","outfit":"jacket","acc":"necklace","mood":"sly"},"bio":"谷鸿年的亲侄，做建材倒卖，是死者唯一的亲人。叔侄俩嘴上不和，他说昨晚在家和朋友打牌，案发后才赶来。","demeanor":"油滑，爱称“叔”，夸大其词，被盯紧了就拍桌子说“我是苦主”。","topics":[{"id":"t_role","q":"你和叔叔关系如何？","a":"我叔就我一个亲侄子，他没儿没女，将来这店不给我给谁？嘴上骂我，心里疼我。这话我今天放这儿。我当苦主，不当嫌疑人。"},{"id":"t_night","q":"昨晚你在哪儿？","lie":true,"a":"在家打牌，一桌四个人，从七点打到十一点多。我出的第一手牌是南风，不信你问他们。我连我叔后门朝哪开都不记得。","truth":"我八点四十去了后门。我叔欠我一个人情，我想借两万还赌债。敲了半天门没人应，收音机响得吓人，我骂了两句，在窗下抽了三支烟，八点五十就走了。我没进去过。"},{"id":"t_money","q":"你最近缺钱吗？","lie":true,"a":"我缺钱？我的建材生意好得很！上半年刚进了一批货，要缺钱我能打 BP 机满街找人借？","truth":"欠了两万的赌债，月底要还。BP 机那条是我发的，不是找叔叔叙旧，是催他把钱给我。"},{"id":"t_will","q":"店将来怎么分？","a":"我叔说过：“谁守得住，就归谁。”他觉得我守不住，更乐意给小满那个傻小子。我气归气，也没想过动他一根手指头。真有这念头，我早动手了。"},{"id":"t_vase","q":"你怎么看那只梅瓶？","a":"那是我叔一辈子的命根子。听说有个港商肯出八十万，被他一口回绝。这几天他又说要“送去验验”，我还当他疯了，八十万不赚，验什么验。"},{"id":"t_window","q":"窗下的脚印是谁的？","needs":["clue:c_gar2"],"a":"是我的，行了吧？我承认在窗下站过。收音机吼得震天响，我还以为叔在里头装死不开门。要是知道他躺在里头，我就是撞门也撞开了。"},{"id":"t_aunt","q":"你婶婶呢？","a":"婶婶七九年得了重病，叔把家底掏空了还不够，欠了一屁股债。可那年秋天债一下子全还清了，她住了半年院，八〇年开春还是走了。叔从此话少了，我妈说他像换了个人。"},{"id":"t_sick","q":"你知道叔叔得了重病吗？","needs":["clue:c_kit2"],"a":"……肺癌？他没跟我说过。难怪这些日子咳得像破风箱，我还嫌他吵。叔是拿我当外人，还是怕我听了就盘算他的钱？我现在想问也问不到了。"}],"confronts":[{"clue":"c_gar2","breaks":"t_night","a":"“红塔山。”他看着烟头，苦笑，“我只抽这个牌子。”过了会儿又拍桌子：“我是去借钱！借钱不犯法吧？我叔活着时我没进去，死了更没必要进去。”声音越说越小。"},{"clue":"c_hall4","breaks":"t_money","a":"他一把抢过 BP 机看了看，又放回去。“那是我发的，行，我承认。”他搓着脸，“欠了人两万，人家拿刀架脖子上催。叔不借，我才在窗下骂他……我骂了他最后一场。”"},{"clue":"c_gar3","a":"“后门钥匙……”他看着空挂钩，“我没有钥匙，叔不给我。谁拿了常叔那把？他要是进去过，凭什么说六点就回家了？”他的眼睛转得飞快，显然想把水搅浑。"},{"clue":"c_study4","breaks":"t_night","a":"“收音机开那么大？”他愣了一下，“我叔耳朵比我灵，嫌吵，平时只开一点点。这么大声，我在后院都听得见，当时我还以为他是故意放给我听的。”"},{"clue":"c_lib2","a":"他瞥了眼照片，满不在乎：“那是我叔年轻时的事，我那会儿才二十出头，听说是个学徒偷了东西。人都死了，你问我也没用。”语气却有些发虚。"}],"fallback":"这玩意儿我可没见过，别往我身上泼脏水。"},{"id":"chang","name":"常永昌","role":"店铺合伙人","age":58,"look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"worried"},"bio":"一九八五年入股聚珍斋的合伙人，占三成，管账与对外联络。他说昨晚六点便回了家，听到消息才赶来。","demeanor":"圆滑、爱算账，爱说“按规矩”“这么说吧”，一急就开始报数字。","topics":[{"id":"t_role","q":"你在店里管什么？","a":"这么说吧，我三成股，管账、管进货、管跟拍卖行打交道。老谷懂货，我懂账，这是个搭档的规矩。十三年没红过大脸，外头都知道。"},{"id":"t_leave","q":"昨晚你几点离店的？","lie":true,"a":"下午六点就走了，回家吃饭，看电视，早早睡了。我老婆能作证。店里打烊后的事，我一概不知。","truth":"我去过。七点三十五分，我用自己的后门钥匙进去，和老谷在后堂吵了十几分钟，七点五十二分摔门走的。我不认账是怕你们把“吵架”当成“杀人”。"},{"id":"t_money","q":"分红账怎么回事？","lie":true,"needs":["clue:c_lib3"],"a":"账是老谷自己记的，他那手字你看得懂吗？我常年按规矩分红，该拿多少拿多少，谁说我多拿了？","truth":"拿了。三万，给儿子付婚房首付，想着年底补上。老谷查出来，限我月底还清。我怕他在鉴定站面前连我一起抖出来。"},{"id":"t_test","q":"梅瓶送检你怎么看？","needs":["clue:c_hall3"],"a":"我反对。送检要是出了岔子，聚珍斋百年招牌一朝就砸，我三成股份缩水一半。老谷犟起来九头牛拉不回，我劝了他三遍。劝不动，只好听他的。"},{"id":"t_after","q":"你走时他是什么样？","needs":["ask:chang.t_leave"],"a":"他好好的，坐在太师椅上，脸色发青，咳嗽，说话不饶人。我摔门时他还说“你走吧，八点还有位老朋友要来，不方便见你”。我哪想到那就是诀别。"},{"id":"t_vase","q":"你知道那瓶有问题吗？","a":"瓶子我倒腾了十几年，也没往坏处想。都说是一九七九年追回来的真品，我入股那年，价钱就按“真”的谈。要有问题，也是老谷一个人的问题。"},{"id":"t_jiang","q":"蒋经理的代销是怎么回事？","a":"蒋文彬那孩子精得很，早想把瓶子弄到拍卖行去。我愿意，抽成够我吃三年。可老谷说“不卖”，我拗不过他，那份意向书他一直没签。"}],"confronts":[{"clue":"c_gar3","breaks":"t_leave","a":"他盯着那个空挂钩，喉结滚了好几下。“……钥匙在我口袋里。”他把钥匙慢慢掏出来，“我是去过，是吵了，可我走的时候他还活着，坐着骂我呢。”"},{"clue":"c_lib3","breaks":"t_money","a":"常永昌看着页边的红字，肩膀一塌。“三万。我认。”他擦了擦额头，“可你们要想着，我杀了他，那三万也不会一笔勾销，反而一辈子洗不清。我没那么傻。”"},{"clue":"c_hall3","a":"他看着那份《代销意向书》，叹了口气：“蒋文彬签了，老谷没签，这是明摆着的事。他不想卖。他要送检，可我至今想不通，他图什么。”"},{"clue":"c_study1","a":"“九点十分？”他拧着眉毛，“我七点五十二分走的，那时他表走得好好的。谁把它砸了，又为什么要停在九点十分，我这个算账的也算不出。”"},{"clue":"c_kit2","a":"他拿着诊断书，手有点抖。“肺癌……他一个字都没跟我说过。难怪这半年脾气比从前更拗，原来是在安排后事。”他摘下眼镜擦了擦，“早知道，那三万我宁可烂在肚子里。”"}],"fallback":"这个我不清楚，账上没记，我不乱说。"},{"id":"yu","name":"俞鹤龄","role":"老主顾藏家","age":63,"look":{"skin":"light","hair":"bald","hairColor":"white","glasses":"round","beard":"goatee","outfit":"robe","acc":"scarf","mood":"sad"},"bio":"退休的中学语文教师，几十年的收藏家，聚珍斋最老的主顾，对镇店之宝念念不忘。他说自己周四以后就没再来店里。","demeanor":"文绉绉，咳嗽，爱引古人，自称“老朽”，说到伤心处会停顿。","topics":[{"id":"t_role","q":"你与谷掌柜的交情？","a":"老朽与鸿年兄交往三十五年，他卖东西，我收东西，彼此知根知底。他嘴硬、手细，最怕人说他的货不真。他一辈子靠的就是这个“真”字，可惜了。"},{"id":"t_visit","q":"昨天你去过聚珍斋吗？","lie":true,"a":"周四之后老朽就没再踏进过那道门。昨日在家临帖，晚上去文化宫票房，唱了半夜的戏。这点小事，不劳你们翻簿子。","truth":"去过。下午三点二十分到四点十分，我在店里看了那只梅瓶，看了很久。我瞒着，是因为看完之后……我心里发慌。"},{"id":"t_1979","q":"一九七九年的案子？","lie":true,"a":"梅瓶失窃？老朽略有耳闻。案子是公家办的，学徒是公家抓的，老朽不过是个爱瓷器的人，与我何干？","truth":"我与干系大了。当年法庭请我到场鉴定追回的瓶，我说“是真品”，那一句话，把一个二十二岁的孩子送进了牢房。我至今想起，夜里都睡不着。"},{"id":"t_buy","q":"你想买那只瓶吗？","a":"想了二十年。老朽开价五十万，鸿年兄不肯，说“此瓶不卖”。近些日子他又说，“怕是要出个新价钱了”。我当他是要抬价，如今才觉得他话里有话。"},{"id":"t_mouth","q":"昨天你看出什么了？","needs":["clue:c_hall1","ask:yu.t_visit"],"a":"口沿。当年那只，口沿内侧有一处米粒大的补烧痕，是老瓶身上的毛病。昨日我拿放大镜照了一刻钟，眼前这只口沿光洁如新，一点补痕也没有……老朽不敢往下想。"},{"id":"t_shen","q":"沈文清死后你做过什么？","needs":["clue:c_lib4"],"a":"他死后第三年，我去过他母亲家，放了二百块钱，那位婆婆没收，说“我儿没偷东西”。老朽拿着钱站了一刻钟，就这么走了。这是老朽一辈子最不敢提的事。"},{"id":"t_where","q":"你昨晚去了哪里？","a":"文化宫票房，唱的是《空城计》，七点到十点，总有二十多个人能作证。老朽嗓子不好，唱到第三段就哑了，被同行取笑了半天。"}],"confronts":[{"clue":"c_hall2","breaks":"t_visit","a":"他看着登记簿上自己的名字，叹了口气。“……是老朽糊涂。”他摘下眼镜，“我怕你们一看到我，就想起那个案子。鸿年兄的命与我无涉，可老朽的良心有涉。”"},{"clue":"c_lib2","breaks":"t_1979","a":"他捧着那张发黄的照片，手指在“米粒大的补痕”上抚过，“……当年我在法庭上咬定它是真的。可这疤，我好像没在法庭那只上见过。”声音哑了，“学徒的脸在这儿，我二十年没敢看。”"},{"clue":"c_hall1","a":"他凑近玻璃，目光停在口沿上，半晌才说：“光洁……太光洁了。真东西可以有毛病，做出来的东西，只会没有毛病。”说完便闭口不言了。"},{"clue":"c_lib4","a":"他看着那叠汇款单，眼眶红了。“鸿年兄每月给那位婆婆寄钱，一寄就是十四年。我一直以为他是良心发现，不曾想……”他没有说下去。"},{"clue":"c_study3","a":"“两盏茶。”俞鹤龄喃喃道，“一盏凉透，一盏只喝了半口。他是等客的，可那位客，没有喝他那盏茶。”他一边咳，一边把话咽了回去。"}],"fallback":"老朽不识此物，也不敢妄断。"},{"id":"jiang","name":"蒋文彬","role":"拍卖行经理","age":45,"look":{"skin":"fair","hair":"slick","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"smirk"},"bio":"省拍卖行经理，一年前起就在游说谷鸿年把镇店之宝交给他上拍。他说自己和谷只有电话联系。","demeanor":"套话多，爱说“这个嘛”“我们公司的流程”，被追问时会反问“有凭据吗”。","topics":[{"id":"t_role","q":"你找谷鸿年谈什么？","a":"代销。聚珍斋的镇店之宝，一旦上我们的春拍，品相、出处、品牌效应，保守估计能上一百二十万。这个嘛，对老先生、对店、对公司，都是一桩三赢的好事。"},{"id":"t_meet","q":"昨天你见过他吗？","lie":true,"a":"没见面，只通了一个电话，上午十点多。他说“再考虑考虑”，我就没再催。我们公司讲究分寸，不会天天堵人家的门。","truth":"见过。我下午五点五十分到店里，谈到七点一刻才走，吵得很凶：我要他签意向书，他不签，还说要送检。我怕你们把“吵架”听成“谋财”，就瞒了。"},{"id":"t_contract","q":"代销合同签了吗？","lie":true,"a":"签了，口头加书面。老先生点了头，只差盖章。这个嘛，行内规矩，点了头就算数，我们公司的流程也认这个。","truth":"没签，一个字都没签。我对林先生说“已经谈妥”，其实是谷老先生没点头，我先把话说满了。"},{"id":"t_goods","q":"你收过小满的货吗？","lie":true,"a":"我们是正规拍卖行，只收有手续的东西，学徒送来的私货，一概不收。你不信可以查收货单。","truth":"收了三回。小满带来的玉蝉、鼻烟壶、核桃，我私下给了他三百块，挂在公司名下转手。这事若让谷老先生知道，他会剁了我的手。"},{"id":"t_quarrel","q":"你们吵了些什么？","needs":["ask:jiang.t_meet"],"a":"我劝他别送检，他说“谁拦我，我就跟谁拼命”，又说晚上要见一位“老相识”，把话说开。我问是谁，他不肯讲。我走的时候，他手背青筋都冒起来了。"},{"id":"t_test","q":"你怎么看热释光检测？","needs":["clue:c_hall3"],"a":"检测？风险太大了。万一结果跟标签对不上，这瓶子价值立刻归零。我们公司不碰有争议的东西。老先生这一步，我始终想不明白：值一百万的东西，他为什么要自己去试？"},{"id":"t_lin","q":"林嘉明是什么人？","needs":["clue:c_cel3"],"a":"香港来的行家，开古玩行的，上周找到我，说想买那只瓶。我收了他五万港币“意向订金”，开了收据。这个嘛，生意人嘛，总得抢个先手。"}],"confronts":[{"clue":"c_hall2","breaks":"t_meet","a":"他盯着“19:15”那一栏，笑容僵了。“……这是小满补写的。”过了一会儿，叹了口气，“好，我承认去了。可我七点一刻就走，他活得好好的，你们别想把锅扣我头上。”"},{"clue":"c_hall3","breaks":"t_contract","a":"蒋文彬低头看着空白的签字栏，脸色难看。“我说是‘口头’。”他强笑一下，“我们这一行，有时候是要抢跑一步的。”这话说得越来越没底气。"},{"clue":"c_cel2","breaks":"t_goods","a":"“收货单副本……”他伸手要去拿，又缩回，“那是我签的。三个小件，三百块，一点小买卖，不犯大法吧？”他勉强笑了笑，“老先生不会知道的……他以前是不会知道的。”"},{"clue":"c_study2","a":"他听完警医的话，脸色发青：“死了两个半到三个半钟头？那是八点多的事？我七点一刻就离开了，你们该去查八点以后进来的人。”"},{"clue":"c_lib1","a":"他越看越是皱眉：“仿制者？这个嘛，我可不知道。”他把信稿推回去，“老先生想自首，我没想到他是这样的人。”这句话说得不像演戏。"}],"fallback":"这个嘛，我们公司没有相关记录。"},{"id":"he","name":"贺秀英","role":"后巷街坊","age":71,"look":{"skin":"tan","hair":"bun","hairColor":"white","glasses":"none","beard":"none","outfit":"apron","acc":"flower","mood":"sad"},"bio":"住在后巷的孤老太太，在街口摆过三十年的馄饨摊，如今领着退休金。她说自己跟谷掌柜只是点头之交，昨晚七点后就关门睡了。","demeanor":"絮叨、方言重，爱说“哎哟”“咱们”，提到伤心事会抹眼睛。","topics":[{"id":"t_know","q":"你和谷掌柜熟吗？","lie":true,"a":"哎哟，哪能说熟呢，街坊嘛，见面点个头，他买我的馄饨，我送他半碟小菜，就这样。人家是大掌柜，咱们是穷街坊。","truth":"不是点头之交。他每月给我汇八十块钱，十四年没断过。我那孩子沈文清是他的徒弟，死在牢里。他说“对不住你”，我只当他念着旧情。"},{"id":"t_night","q":"昨晚你去过后堂吗？","lie":true,"a":"没有，没有。我七点收了摊就关门睡了，老年人，晚上哪还出门？有人说我去，那是看错了。","truth":"去了。他胃不好，我每晚七点五十五给他送阳春面。昨晚他吃了两口，说“有客人要来，你先回”，我就走了。我怕你们说我与他有牵连，才瞒着。"},{"id":"t_alive","q":"你走时他是什么样？","needs":["ask:he.t_night"],"a":"他精神还行，就是咳得厉害。我走之前，他叫我把一对盖碗洗了，沏了两盏茶，一盏放他自己跟前，另一盏摆在对面。我走的时候是八点过三分，我看了墙上的钟。"},{"id":"t_window","q":"你家的窗对着哪里？","a":"正对着夹道，隔着一道矮墙，就是谷家的后院和钟家的后窗。我这把年纪睡得浅，晚上外面一点响动都能听见。"},{"id":"t_see","q":"夹道里你见到谁了？","needs":["clue:c_gar1","ask:he.t_night"],"a":"八点一刻前后，我回屋开了窗，看见一个人影背着个扁扁的画夹，左腿有点拖，闪进了谷家后院的小门。月光暗，脸看不真，可那走相我认得，像是……我不敢说。人家是体面人。"},{"id":"t_son","q":"沈文清是你儿子？","needs":["clue:c_lib4"],"a":"是我的独苗，二十二岁进的监，二十六岁死的。他到死都说没偷东西，我信他，可法院说偷了。老谷每月汇钱，我只当他可怜我这个老婆子，哪想到里面还有别的缘故。"},{"id":"t_hate","q":"你恨谷掌柜吗？","needs":["clue:c_lib2"],"a":"恨过。我儿子进监那年，我在街口骂过他。后来他寄钱，我也收了，人活着总得吃饭。昨晚他吃了我的面，说了声“谢谢”……我现在想起来，这是他第一次说这句话。"}],"confronts":[{"clue":"c_lib4","breaks":"t_know","a":"她接过汇款存根，手抖得厉害。“十四年……”她用袖口擦眼睛，“我就是不想让人知道，我这老婆子靠他养活。人家要是知道文清是我儿子，会说是我下的手。”"},{"clue":"c_kit1","breaks":"t_night","a":"她看着食盒盖里的红纸，叹了口气。“那是我写的。哎哟，这食盒我用了十几年，红纸都褪色了。”她抹了把脸，“我是去了，我不是凶手，我连我儿子都不敢恨，哪敢杀人。”"},{"clue":"c_study3","a":"“两只盖碗？是我洗的。”她点点头，“一只给他自己，一只摆在对面，他说‘有人要来，茶要先沏好’。哎哟，那位客人到底还是没喝一口。”"},{"clue":"c_hall1","a":"她隔着想象的玻璃朝瓶子看了看，摇摇头：“好看是好看，可文清说过，这瓶子口上有一个小疤，像个米粒。现在这只，我找半天没找着。”"},{"clue":"c_lib1","a":"她让人念了两遍，浑身发抖。“‘并非窃贼’……”泪水大颗大颗落下来，“二十年了，二十年了，有人终于肯说这句话。”过了好一会儿才问：“那这信，他是想往哪儿递啊？”"}],"fallback":"哎哟，这个我老婆子不认得，别拿来吓我。"},{"id":"lin","name":"林嘉明","role":"香港古玩商","age":50,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"round","beard":"none","outfit":"suit","acc":"tie","mood":"neutral"},"bio":"香港“嘉廷古玩行”东主，十月中旬来省城，住省城宾馆，自称是冲着聚珍斋的镇店之宝而来。案发当晚他说自己在宾馆。","demeanor":"港普夹杂粤语，爱说“唔该”“我话畀你知”，彬彬有礼却滴水不漏。","topics":[{"id":"t_role","q":"你来省城做什么？","a":"做生意。内地这两年放开了，好东西多，我专程来看货。听说聚珍斋有件宣德梅瓶，我话畀你知，宣德青花出名难得，当然要来看一眼。"},{"id":"t_know","q":"你以前见过谷先生吗？","lie":true,"a":"没有。这回是第一次来贵店，也是第一次同谷先生讲话。我这个人做事老实，只是想问问价钱，唔该你不要把我想得太复杂。","truth":"周四下午我见过他，在后堂谈了一个钟头。我跟他讲，我父亲林廷芳一九七九年从他手里买走了真品梅瓶。我不想吓他，可我必须开口。"},{"id":"t_night","q":"昨晚你在哪里？","a":"七点起就在宾馆餐厅同我的助手吃饭，八点半回房，九点多叫了宵夜同助手谈事，十点才睡。前台、餐厅领班都可以证明。香港人守时守矩，不会乱走。"},{"id":"t_father","q":"你父亲买的是什么？","needs":["clue:c_cel3"],"a":"一只青花云龙梅瓶，口沿内侧有一处旧补烧。一九七九年十月，经侨务渠道，他以四万港币从聚珍斋买走。那只瓶后来一直在我家，去年我请人做热释光，结果是明初无疑。"},{"id":"t_real","q":"你看了店里那只怎么说？","needs":["clue:c_hall1","ask:lin.t_father"],"a":"我话畀你知，做得很好，连釉面的“橘皮纹”都对，可口沿太干净了。我对谷先生讲：“您柜里这只，我家里也有一只。”他沉默很久，只说了一句：“我知道。”"},{"id":"t_sue","q":"你打算怎么办？","needs":["ask:lin.t_real"],"a":"我没有要告谁。父亲当年是收了个“真”，被人蒙了个“实情”，事情总要有人讲清楚。我只希望谷先生肯说出来，哪怕给法院写一份证词，我愿意出面作证。"},{"id":"t_deposit","q":"你付了订金吗？","needs":["clue:c_hall3"],"a":"付了，五万港币，交给蒋经理，收据在我房间。蒋经理说谷先生已经同意代销。现在我才明白，这个“同意”，只是他自己的话。我愿意向他索回订金，不过那是后话。"}],"confronts":[{"clue":"c_cel3","breaks":"t_know","a":"他看着那张被掐出折痕的名片，轻叹一声。“都是我递的。”他推了推眼镜，“我不是想瞒你们，我只是怕一开口，谷先生就成了‘被骗的主’。其实被骗的人，更多。”"},{"clue":"c_hall2","breaks":"t_know","a":"“二十二号下午四点。”林嘉明点头，“我是那个时间到的。登记簿上没写事由，是谷先生让我别写。他说这件事，要先给我父亲一个交代。”"},{"clue":"c_hall1","a":"他凑近玻璃，沉默了一会儿。“好瓶。”他慢慢说，“可惜是‘好’得太完整了。我家那一只，有疤，有伤，才像活过六百年的东西。”"},{"clue":"c_lib1","a":"他读完信稿，久久没有抬头。“‘余时日无多，愿以此身承担’……我原本以为他会辩，会赖，会翻脸。想不到，是我低估了这位老先生。”声音低得几乎听不见。"},{"clue":"c_study1","a":"“九点十分？”他皱了皱眉，“我九点十分还在宾馆吃宵夜，同助手讨论下周一去鉴定站的事。表可以砸，时间改不了。你们该查的，是谁需要这个时间。”"}],"fallback":"唔该，这个我不清楚，不方便乱讲。"},{"id":"zhong","name":"钟世昌","role":"邻铺裱画师","age":56,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"rect","beard":"none","outfit":"vest","acc":"pocketwatch","mood":"tired"},"bio":"“墨缘斋”裱画铺老板，与聚珍斋一墙之隔，三十年的老邻居，靠一手裱画修补的手艺吃饭。案发当晚他说自己在街口茶馆打牌，听说出事才赶过来。","demeanor":"慢条斯理，文人腔，爱称“老哥”“惭愧”，说话时总捻着指尖。","topics":[{"id":"t_role","q":"你和谷鸿年什么交情？","a":"三十年的老邻居了。我这铺子裱的画，十有八九是他引来的主顾。他懂货，我懂纸，彼此客气。老哥走得这样，我心里难受，惭愧，实在惭愧。"},{"id":"t_where","q":"昨晚你在哪里？","lie":true,"a":"街口“清心茶馆”，七点半坐下就没动过，打到十一点，一桌四个人，都是老牌友，随便你问。听到出事，我外套都没顾上穿就跑过来了。","truth":"我离过席。八点我说回铺子取烟，其实从夹道进了老谷的后院。我在他那里待到八点半过一点，回茶馆时八点四十五，没有人觉得我少了谁。"},{"id":"t_gate","q":"夹道小门是怎么回事？","needs":["clue:c_gar1"],"a":"夹道是两铺共用的，小门是老谷家的。我前几日借过道去他那边送过一幅装好的画，有指印脚印，也不稀奇。至于昨晚，我在茶馆，这一点你再问我十遍也是这句。"},{"id":"t_1979","q":"一九七九年梅瓶失窃案？","lie":true,"a":"那一年我在文物商店修复组，只听说梅瓶被一个学徒偷出去，又追了回来。具体我不清楚，也帮不上你什么忙。你知道，我们做手艺的，不碰这些事。","truth":"那只瓶是我做的。八月接的活，十月做成，足足画了四十天，连口沿都没敢补。他说那是“救急”，老婆躺在医院里等着钱。我拿了八百块和一个铺面的承诺，便闭了口。木箱里那方“墨缘斋”是我早年的斋号印，后来铺子就拿它当了招牌。"},{"id":"t_appoint","q":"最近你们见过面吗？","lie":true,"a":"没什么往来。他前些天来过我铺里一趟，借了点糨糊，说是补账本，连话都没怎么说。人老了，各忙各的，哪来的什么“约”。","truth":"他昨天傍晚亲自到我铺里，说要去自首，约我周五晚八点到后堂，劝我一起去。我嘴上没应，可晚上还是去了。"},{"id":"t_vase","q":"那只梅瓶你怎么看？","needs":["ask:zhong.t_1979"],"a":"宣德官窑的东西，我一个裱画的哪里敢断。老谷说是真的，那就是真的。热释光那一套，我不懂，不过听说它对窑火的年份很挑剔。"},{"id":"t_shen","q":"沈文清是谁？","needs":["clue:c_lib2"],"a":"那个学徒？手脚不干净，被抓了，判了十年，后来病死了。可怜是可怜，可法院判的案子，咱们外人嚼什么舌根。"},{"id":"t_leg","q":"你的腿是怎么回事？","needs":["clue:c_gar1"],"a":"早年修房顶摔的，落了个左腿使不上劲，一到阴天就拖。这街上谁不知道？你问这个做什么，难不成走路也有罪？"}],"confronts":[{"clue":"c_gar1","breaks":"t_where","crack":true,"a":"他的指尖停在半空，缓缓捻了几下。“夹道是公用的，谁都走得……那门闩是老谷自己在里头拔的，外人推也推不开——”话一出口，他自己也听出了破绽，抬手去扶眼镜，却扶了个空。"},{"clue":"c_cel1","breaks":"t_1979","crack":true,"a":"他望着那方残缺的小朱印，像看见一个年轻的自己。“……他竟留着。”声音哑了，“二十年，一只木箱，一张纸。我以为那些东西早烧光了。”"},{"clue":"c_lib1","breaks":"t_appoint","a":"“他连这个也写了。”钟世昌闭了闭眼，“‘仿制者尚在’……他说得轻巧，倒是一点没替我想过。我这一辈子，难道就该跟着他的良心去投案吗？”声音发颤。"},{"clue":"c_study1","a":"“表停在九点十分。”他喃喃道，“九点十分，我那时在茶
