"宋药师这个人？","a":"老实人，肯干，从不跟人红脸。就是腿，七六年摔的，阴雨天右脚拖着，走几步就要歇。他夜里常守着药房，我常给他送茶。"},{"id":"t_fire","q":"后院有什么动静？","needs":["clue:c_y2"],"a":"半睡半醒的时候，我看见焚化炉那边有火光，红红的一团，旁边有个人影，好像在往里添东西。我当是做梦，翻个身又睡了。说出来你们也不信，我是醉汉。"},{"id":"t_ghost","q":"院里闹鬼的说法？","a":"梁先生说的“白衣人”，咱们院里的老人都听过，夜里一两点，药房那边有灯，有时也在走廊。我不敢说有鬼，也不敢说没有。不过那不像鬼，鬼哪用提灯呢。"},{"id":"t_doc","q":"院长最近怎么了？","a":"近来他疼得厉害，半夜常叫我去煮针。有一回他看着一支小玻璃管，念叨：“怎么越打越疼……”我不懂，就没吭声。"}],"confronts":[{"clue":"c_y2","breaks":"t_where","a":"那瓶酒……是我的。唉，我说实话，咱们院里的事，我是喝多了睡过去的，不是在巡廊。你可别告诉护士长，她要是知道，非撵我走不可。"},{"clue":"c_r4","breaks":"t_where","a":"这是我写的，字不好看，一笔一画可都是真的。“23:00 在发电机棚歇”……唉，白纸黑字，我赖不掉。我是醉了睡的，不是在巡廊。"},{"clue":"c_s3","a":"门口这些烟蒂，我二十二点四十五巡廊时还没有。大前门是客房那位洪师傅抽的，我闻得出这个味儿。"},{"clue":"c_p3","a":"这是宋药师的鞋，我认得，右脚垫了两层。他这条腿，一到阴雨天就疼，走路一拖一拖，咱们院里人都知道。"}],"fallback":"这个我不懂，咱们院里的事我只知道大概。"},{"id":"jian","name":"简若川","role":"实习医生","age":24,"look":{"skin":"fair","hair":"messy","hairColor":"black","glasses":"rect","beard":"none","outfit":"labcoat","acc":"stethoscope","mood":"worried"},"bio":"省医学院毕业的实习医生，九月二十日才来松岚报到，被安排在内科和化验室帮忙。自称昨夜在宿舍睡觉，之后听到喊声才起来。","demeanor":"年轻，语速快，爱先道歉，紧张时背医学名词","topics":[{"id":"t_bio","q":"你来院里多久了？","a":"才六天，对不起，我还在适应。我在医学院学的是内科，这边院长让我兼着化验，说人手缺。我手脚还不熟，希望没给你添乱。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"宿舍，九点半后就没出去过，躺下听着风声，一直到喊声。我真的没出门，护士长可以作证……呃，她可能也不在。总之，我在宿舍。","truth":"我在化验室，一直到二十三点二十。我心里不踏实，想用第二种方法再验一遍那批药，所以点着马灯做到那个钟点。我怕被人知道我违令，才瞒了。回宿舍的路上我谁也没见着。"},{"id":"t_test","q":"你替院长做过化验吗？","lie":true,"needs":["clue:c_l1"],"a":"没有。就是照流程做常规检验，血常规、尿常规、肝功，没有谁交代我什么特别的。你要问我，我什么都说，可真的没有。","truth":"有。九月二十二号，院长交给我一支8612批吗啡，让我悄悄检含量，说不许对任何人讲，连严副院长都不行。结果出来只有标示量的十分之一，我吓坏了，院长让我闭嘴，我就一直闭嘴。"},{"id":"t_day","q":"昨天院长有什么异常？","needs":["clue:c_l2"],"a":"下午两点半，他让我复核新到的8706批，结果合格。他看着结果说，这批是真的。他还说，明早八点，有些人就得老实了。我当时没懂，现在想起来，后背发凉。"},{"id":"t_dose","q":"苏婉如的针是怎么打的？","needs":["ask:su.t_gap"],"a":"九点我按单子给她肌注了氯丙嗪二十五毫克，后来想起来，单子上已经写好“已注”，我怕漏了，又补了一针。等于打了两针，对不起，我吓得没敢说。她今天要是记不清事，是我的错。氯丙嗪两针五十毫克，不至于出大事，可也够她晕一晚上。"},{"id":"t_song","q":"宋药师对你如何？","a":"客气，常给我倒茶。有天他半开玩笑问我，新来的医生是不是要给院里查账。我说我哪有那本事，他笑笑没说话。我现在回想，他问的时候，手一直在转钥匙。"},{"id":"t_ghost","q":"你信有白影吗？","a":"我信数据，不信鬼。可梁先生的记录，时间、方位都那么一致，我很难说那只是幻觉。这几天我越看越觉得，他不一定在说胡话。"},{"id":"t_fear","q":"你怕什么？","a":"怕被牵扯。我刚来六天，又碰上院长的死，又知道不该知道的事。我是个新人，说话没分量，一旦被怀疑，没人替我辩。"}],"confronts":[{"clue":"c_l1","breaks":"t_test","a":"这是……我的字。那个，院长让我保密，我就一直保着。您要是早一点来就好了，我一个实习生，真的不知道该跟谁说。"},{"clue":"c_l3","breaks":"t_where","a":"那盏灯，还有那行字，是我留的。我撒了谎，我没在宿舍，我在做第二法复检。怕一个新人被扯进这种事，就……我知道这样不对。"},{"clue":"c_r1","a":"这单子……我是照着上面的顺序打的针。如果上面的记录是预先写的，那我到底是在治病，还是在照着一张假单子行事？"},{"clue":"c_l2","a":"8706我验过，含量合格，我敢拿行医资格担保。药没问题，真的，问题在别的批号上，这个我只能说到这儿了，再多我怕说错。"}],"fallback":"对不起，这个我真的不清楚，可以问问别人吗？"},{"id":"song","name":"宋鹤龄","role":"药剂师","age":52,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"rect","beard":"none","outfit":"labcoat","acc":"badge","mood":"tired"},"bio":"松岚疗养院药剂师，十五年来管着药房和管制药品柜，院里的药都经他的手。七六年摔伤右腿，阴雨天走路拖脚。自称昨夜在药房月末盘点。","demeanor":"客气周到，说话慢，爱用“您”，被逼急了先叹气","topics":[{"id":"t_bio","q":"药房的工作是怎样的？","a":"收药、点药、发药、记账。管制药品要双锁双账，一支一支对。十五年没出过差错，不是我夸口，院长那样挑剔的人，也挑不出我的毛病。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"药房。月底盘点，从九点多起一直做到零点四十，听见喊声才出来。台风夜我腿疼，哪儿也没去，您要信，翻我的登记册就是。","truth":"我去了院长室。二十二点二十到五十二，我与他谈了近半个钟头。我不敢承认，是怕您听了就认定是我。这一点我瞒了您，对不起。"},{"id":"t_ledger","q":"管制药品登记册可靠吗？","lie":true,"a":"每笔当场记，当场签，一笔不错。昨晚22:10，院长亲自来药房领了三支8706，我发的药，他签的字，您去翻第38页，白纸黑字。他想自己打，我劝不住。","truth":"那页是我后来补的。原页上有些不能让人看的记录，我烧了，另抄一页，把“院长自领”添进去，想让三支空安瓿有个来路。"},{"id":"t_key","q":"8706的柜钥匙谁有？","needs":["clue:c_p1"],"a":"麻醉柜两把锁，一把我带着，一把也在我手里，备用的封在院长保险柜里，封条是严副院长盖的章，完好无损。所以这柜子，除了我，谁也开不了。"},{"id":"t_stock","q":"药品账物相符吗？","lie":true,"a":"相符，一支不差。有破损，每月二三支，都有护士长核对签字。药房的账，是我一生的脸面。","truth":"不相符。我从八三年起把8612批的吗啡冲成盐水，真药拿去换了钱，给儿子治肾病。破损是我编的，薛护士长签的字也是我拿空白页骗的。账是假的，我这一辈子，就是这几页纸。"},{"id":"t_ghost","q":"你怎么看梁的白影？","a":"梁先生是个体面人，我很同情，他的病程记录写得明白，是药物和病情，不能当真。他夜里睡不稳，看谁都是白的。院里人的白大褂，哪一件不是白的？"},{"id":"t_visit2","q":"你去院长室做什么？","needs":["clue:c_w1"],"lie":true,"a":"梁先生的本子，您大概已经看过了，我也不再瞒：我是去过。我只想劝劝他，他最近疑心我，我去解释。没带药，也没碰他的针。我走时他自己在抽屉里备针，用的是他平日那批8612，好端端的。我离开时是二十二点五十二，门一合就锁了，我也没想到。","truth":"我没劝他。下午他只叫我明早八点带8612的账册去，没说为什么，可我心里明白。夜里我提着新批的8706，说是给他止痛，他疼得厉害，又知道这批验过是真药，就让我进了门。我说他手抖，我替他推。……我替他打了那针。"},{"id":"t_conf","q":"那针是你打的？","needs":["ask:song.t_visit2","clue:c_s1","clue:c_s2"],"a":"是我。我说他手抖，新批劲大，我替他推。他信了我十五年。我从自己的柜里取了三支真药，推进他右臂，看着他一点点睡下去。然后拉门，门咔一声锁上。我回药房，重抄了第38页，烧了原页。我儿子的病，我这辈子也还不清。"}],"confronts":[{"clue":"c_w1","breaks":"t_where","crack":true,"a":"……唉。梁先生的本子，您读得仔细。是我，我去过。右脚拖着走，您大概也看出来了。我这一晚上最怕的，就是有人把“疯话”当了真。"},{"clue":"c_p2","breaks":"t_ledger","crack":true,"a":"这半枚章……您连这个都看出来了。字我抄得再像，章也盖不回去。……唉，好，您问吧，您要什么，我给您什么。"},{"clue":"c_y1","breaks":"t_ledger","a":"这一角……没烧透。我烧得太急，雨又大，炉子不旺。第38页原样是什么样，您现在大概也猜得出。"},{"clue":"c_l1","breaks":"t_stock","a":"一比十……他竟然真的验了。我早该想到，他那个人，从不空口说话。账是假的，药也是假的，我认。"},{"clue":"c_s1","breaks":"t_visit2","crack":true,"a":"右臂……他从不扎右臂，这我是知道的。当时只想着快，竟忘了。您说得对，没有人会给自己扎错手臂。"},{"clue":"c_s2","breaks":"t_visit2","a":"三支空的是8706，抽屉里原封的是8612，我无话可说。他一支也没碰过自己的药，真药是我带去的。"},{"clue":"c_y2","breaks":"t_where","a":"后院的泥……唉，雨这么大，竟也冲不干净。右脚拖出来的沟，我自己最清楚。我说“哪儿也没去”，是我不老实了。"},{"clue":"c_p3","a":"这是我的鞋，院里谁不知道？我腿不好，天天拖着走。可您要拿一双鞋就定我的罪，未免也太轻率了。"},{"clue":"c_p1","a":"四十七支，三支领出去的，账上有。柜角那些空盒是用完的旧批，也都登记在册。您数得准，可您数的是药，不是人。"},{"clue":"c_p4","a":"练字的废纸。药房里夜长，闲着没事，谁不描几张帖解闷？院长的字写得好，我不过是学着玩的，您不要多心。"},{"clue":"c_s4","a":"明早八点……是，院长是约了我。账册我自然会带，他要查，尽管查，我问心无愧。药房的账，我这一辈子都认。"},{"clue":"c_y3","a":"烧点废纸，药房里常有的事，包药的草纸、作废的处方，总得有个去处。您别见怪，我这人，一向爱干净。"}],"fallback":"这个与药房无关，您恐怕问错人了。"}],"solution":{"culprit":"song","method":{"q":"凶手怎么做到的？","correct":2,"options":["A 院长因癌痛难忍，自己多打了几支吗啡，属于意外或自戕，门自合只是巧合","B 凶手在院长抽屉的8612安瓿里掺入毒药，等他自己注射后发作，再从窗口潜出","C 凶手以“替院长注射”为由，把自己柜里的8706三支推进他右臂，出门令弹簧锁自合成密室，再重抄账页伪造“院长自领”","D 凶手撬开院长室的门锁进入，作案后用备用钥匙从外面反锁，再把钥匙放回桌面"]},"motive":{"q":"为什么杀人？","correct":1,"options":["想夺院长之位，接管整座疗养院","院长查出他长年把吗啡冲成盐水、倒卖真药，次日八点就要对账报官","为多年前的一次误诊旧怨，借台风夜报复院长","院长发现他私收病人家属的钱，要他退赃并辞职"]},"keyClues":["c_s1","c_s2","c_p2","c_l1","c_w1","c_r1"],"truth":["凶手是药剂师宋鹤龄。多年来他把8612批管制吗啡冲成盐水，倒卖真药给儿子治病；顾清源察觉自己的止痛针越来越不管用，暗中让实习医生简若川化验，结果只有标示量的十分之一，并约宋次日八点带账册对质。宋知道天亮就是末日，借台风封山动手。","22:20 宋蒙着口罩、穿着白大褂，左手提马灯、右脚拖着，从药房走到院长室。他说是送新批的止痛药来，又以“你手抖，我替你打，新批劲大”为由，取自己柜里真正的8706批吗啡三支，推进院长从不扎的右臂。院长多年实际只吃进十分之一的药量，对吗啡几乎没有耐受，三十毫克足以致命。22:52 他离开，弹簧锁自合“咔”一声，门外看就成了“反锁密室”。","回到药房，他用23:00—23:30重抄登记册第38页：删去多年的“破损”记录，补上“22:10 院长亲自领8706×3”，让三支空安瓿有了来路；23:35 他把原页烧在后院焚化炉，泥地上留下一串右脚拖着沟的脚印；这一幕被梁秋白和半醉的魏德贵半梦半醒地看见，被苏婉如瞥见他在“抄账”。","为什么没人信？护士长薛玉芬提前一整夜填好护理记录，写着梁秋白21:30已服镇静药，于是梁看见的白影成了“幻觉”。其实梁一直把药吐在缸底，他的怀表和笔记记下了22:00—22:20走廊无人、22:20白衣人入、22:52出——院长根本不可能22:10去药房领药。","红鲱鱼各有解释：严仲谦收了洪建国每月八十元，与薛玉芬有私情，两人互作假证；薛玉芬伪造记录、替宋空白签“破损核”；洪建国怕妻子出院，22:54 在院长室门外抽了四根烟；魏德贵醉睡；简若川偷偷化验，还重复给苏婉如打了针。他们都有谎，却没有人杀人。","证据环环相扣：右臂新针眼与抽屉里原封的8612，说明有人替他打了针，且真吗啡出自8706；8706少三支，登记册第38页的骑缝章对不上，焚化炉里烧剩的原页残角、稿纸上的练习签名，都指向有人在改账；化验单给出动机，梁的笔记和洪的所见共同描出那个拖着右脚的白衣人，后院泥地的拖沟脚印，与药房里那双右脚垫厚、前掌钉菱形胶皮的布鞋吻合，而全院只有宋鹤龄右脚有伤。"]}},{"id":"paimai","title":"压轴之夜","tagline":"暴雨封楼，拍卖师死在上锁的鉴定室，台下的名画却分毫未损","difficulty":4,"cover":"cover","tone":"purple","brief":"十月的暴雨夜，云轩拍卖行在二十八层举办年度压轴夜场，失传百年的《霁雪寒林图》将在22:30开拍，估价八千八百万。可开拍前，首席拍卖师兼鉴定师谷鸣远被人发现死在上锁的鉴定室里，后脑塌陷，名画就在三步之外，毫发无损。暴雨冲断了山路，警方两个小时后才能赶到。拍卖行股东求你在这段时间里先把事情弄清楚。你穿过满厅惊惶的宾客，手里只有六处能搜的地方，和八个各怀心事的人。每个人都有话没说，而你要找的人，此刻就站在他们中间。","victim":{"name":"谷鸣远","age":62,"desc":"云轩拍卖行首席拍卖师兼鉴定师，业内公认最难糊弄的“眼睛”。被发现死在上锁的鉴定室内，后脑遭钝器重击，倒在书桌与紫外灯台之间。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"none","outfit":"suit","acc":"bow","mood":"stern"}},"publicFacts":["谷鸣远死在二十八层东侧的鉴定室。门关上会自动落锁，发现时门是锁着的，保安用主卡打开。","鉴定室里的《霁雪寒林图》完好地摆在展台上，没有被盗，没有破损。","东走廊3号摄像头因雷击跳闸离线，直到夜里才恢复；贵宾厅的摄像头一直正常运行。","暴雨冲断山路，电梯停运检修，二十八层的所有人只能留在楼里，没有人离开过。","谷鸣远曾在今晚的预展上说过，压轴拍品开拍前他还要做最后一次终检。","这幅画由墨痕画廊柯美玲送拍，恒安保险承保，由保险调查员严松监督运输和封存。"],"timeline":[{"t":"19:30","text":"预展酒会在二十八层开始，宾客陆续入场"},{"t":"20:28","text":"门禁记录：谷鸣远刷卡进入鉴定室，此后到22:38 没有任何刷卡记录"},{"t":"21:10","text":"系统记录：东走廊3号摄像头雷击离线，22:52 恢复"},{"t":"21:42","text":"手机记录：谷鸣远与柯美玲通话三分钟，这是他最后一通电话"},{"t":"22:05","text":"柯美玲自称敲鉴定室的门无人应，随后去找保安"},{"t":"22:30","text":"原定压轴开拍时间，夜场被迫中止"},{"t":"22:38","text":"门禁记录：保安主卡打开鉴定室门"}],"budget":{"search":12,"ask":26},"locations":[{"id":"loc_lab","name":"鉴定室","scene":"study","desc":"顶楼东侧的恒温鉴定室，隔音门厚重，关上即自动落锁。书桌、紫外灯台、展台一应俱全，谷鸣远倒在其间。","clues":[{"id":"c_st1","title":"鉴定笔记","text":"书桌上摊开的硬皮鉴定笔记，最后一页用蓝黑墨水潦草写着：“紫外灯下右下角有一个‘巳’字荧光暗记——韩的摹本，无疑。摹本10月2日只交给柯。10月5日起运，封条S-4417，装箱监封人：严。画心绢偏新。真迹在哪？”"},{"id":"c_st2","title":"死者手机","text":"桌角的手机屏幕仍亮着。短信：20:55 发给韩述“现在来一趟，有东西要你认。”；21:20 发给严松“S-4417。十点前，来一趟。”（显示已送达）。通话记录：21:42 柯美玲，通话3分钟。严松那一栏没有回复。"},{"id":"c_st3","title":"青铜镇纸","text":"谷鸣远面朝下倒在书桌与紫外灯台之间，后脑塌陷。沾血的青铜镇纸滚在地毯上，表面没有清晰指纹，只有一层细密的棉纤维压痕。桌上两只茶杯，一只已凉，杯沿有一圈淡淡的口红印；一只半满。门内侧没有撬动痕迹。"},{"id":"c_st4","title":"紫外灯下的画","text":"你拧亮灯台，展台上的《霁雪寒林图》右下角浮出一枚淡青色的“巳”字荧光印记。放大镜下，画心绢边的经纬丝线整齐细密，没有一处旧损。画旁摆着一副没用完的白棉手套。"}]},{"id":"loc_mon","name":"监控室","scene":"library","desc":"一整面墙的屏幕和一台嗡嗡作响的主机，空气里是泡面和烟草味。保安彭大海平时在这里值守。","clues":[{"id":"c_mon1","title":"贵宾厅截图","text":"贵宾厅摄像头的截图，时间戳 22:15:06：严松起身与贺承握手，两人身后墙上的倒计时屏清楚地显示“距压轴开拍 00:34:54”，几名侍者正引导宾客往外走。"},{"id":"c_mon2","title":"门禁记录","text":"打印的门禁日志，鉴定室只有两条：20:28 谷鸣远刷卡进入；22:38 保安主卡开门。东走廊3号摄像头标注“21:10 雷击跳闸离线，22:52 恢复”。旁边附一张系统设置截屏：“自动校时：关闭”。"},{"id":"c_mon3","title":"安防整改单","text":"恒安保险《场馆安防审核整改单》复印件，第3项手写：“门禁及监控主机时钟较标准时间偏快约20分钟，建议校准后复核。”审核人签名：严松，日期10月9日；整改回执栏空白。"},{"id":"c_mon4","title":"巡逻本","text":"彭大海的巡逻记录本，21:35至22:00一栏空白，页脚夹着一张彩票和棋牌室会员卡；22:08 一行字“柯女士来找，要开鉴定室，先报备值班经理”，22:18“开鉴定室”。另一行：“21:32 钱总上天台，说抽烟；22:11 下来。”"}]},{"id":"loc_vip","name":"贵宾厅","scene":"hall","desc":"铺着深红地毯的贵宾厅，洽谈区的沙发围着一面倒计时屏，窗外暴雨如注，宾客已被引去拍卖厅。","clues":[{"id":"c_vip1","title":"夜场流程单","text":"苏小棠打印的《夜场流程单》：19:30 预展酒会；21:15–21:55 VIP洽谈区（严松/贺承预约）；21:55 终场铃，宾客移步拍卖厅；22:30 压轴开拍。页边钢笔批注：“铃响一次；鉴定室谷老师说十点前出来。”"},{"id":"c_vip2","title":"揉皱的合同","text":"沙发缝里塞着一份《藏品质押借款合同》复印件：出借人魏某，质押物《霁雪寒林图》，借款2600万，到期日10月20日；柯美玲签名旁有红笔批注“拍卖成交后第一时间还款”。"},{"id":"c_vip3","title":"竞价牌登记册","text":"登记册上贺承的号牌“A-08”旁有铅笔小字“10/11预览，谷老师特批”，该日期的访客栏被涂改过一次，涂改处仍能辨出一个“贺”字。"}]},{"id":"loc_bk","name":"后台寄存间","scene":"backstage","desc":"拍卖厅后台的寄存间，金属架上码着宾客的箱包与拍品周转箱，潮气里混着樟木味。","clues":[{"id":"c_bk1","title":"勘验箱夹层","text":"寄存架第17号：恒安保险的铝合金勘验箱，标签写着严松。箱底有一层夹层，里面卷着一幅绢本，樟木卷轴，题签“霁雪寒林图”，绢色泛暗，背面有几处旧补绢，轴头刻着一个“程”字小款。"},{"id":"c_bk2","title":"装箱签收单","text":"10月5日墨痕画廊《装箱监封签收单》：14:10 柯美玲离场（备注：有事外出），14:50 返回；14:25 封箱，封条编号S-4417，监封人栏只有“严松”一人签名；两名搬运工签于14:55，备注“候于外间”。"},{"id":"c_bk3","title":"洛芷的提包","text":"一只被雨淋湿的帆布提包，里面是一叠旧信、一支笔式紫外手电，和一张写了又揉过的便笺，上面写着“绢不对，手感太新——你再看一遍。芷 20:35”。"},{"id":"c_bk4","title":"编目照片","text":"苏小棠平板里存着10月8日入库编目照片：木箱封条S-4417完好，开箱后的画作全幅照，拍摄者署名苏小棠；备注栏写着“先开箱了，别告诉谷老师”。"}]},{"id":"loc_res","name":"修复间","scene":"lab","desc":"拍卖行里的修复工作间，灯台、镊子、浆糊盆和一排排裱纸，韩述把这里当成了半个家。","clues":[{"id":"c_lb1","title":"摹本交接单","text":"韩述工作台上的交接单副本：10月2日，交付墨痕画廊柯美玲“《霁雪寒林图》展示用摹本一幅”，条款“仅限展陈，不得出售”；摹本右下角按工作习惯加“巳”字荧光暗记；收件人签名：柯美玲。"},{"id":"c_lb2","title":"修复日志","text":"修复日志记载真迹7至9月在此修复，9月21日交还柯美玲；备注：绢本，背面多处旧补绢，樟木轴头刻“程”字小款，需避光。日志下压着一张银行催缴单和一份工作室欠薪名单。"},{"id":"c_lb3","title":"律师函","text":"墨痕画廊的律师函，催促韩述退还已预付的摹本制作费40万元；韩述在页边批了一句“柯不付尾款，我凭什么退”。"}]},{"id":"loc_bar","name":"酒廊","scene":"dining","desc":"预展酒会的酒廊，香槟塔空了一半，吧台边的杯子东倒西歪，雨声压过了背景乐。","clues":[{"id":"c_dn1","title":"遗落的备忘","text":"吧台边遗落的手机备忘录页面：“收购云轩全部股权，报价2.4亿，贺总方；谷若反对，此事不成，先要拿到他手里那10%。”最后编辑 20:50，机主署名钱立诚。"},{"id":"c_dn4","title":"掉落的信封","text":"吧台高脚凳底下掉着一个被捏皱的信封，收件人栏写着“严松”。里面是澳门一家赌场的《信用额度逾期通知》，欠额一千九百万港币，限十月二十五日前清偿；信封背面用铅笔草草写了“4200”和“拍后”两个词。"},{"id":"c_dn2","title":"酒廊账单","text":"酒廊账单：洛芷 20:45 点威士忌两杯，21:30 结账离开；侍者备注“客人一直在哭，中途没离开过吧台”。"},{"id":"c_dn3","title":"侍者便签","text":"侍者便签：“21:15 左右韩先生从东走廊快步回来，脸色发白；21:20 左右柯女士在东侧走廊尽头打电话，声音发抖。”"}]}],"suspects":[{"id":"yan","name":"严松","role":"保险调查员","age":41,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"smile"},"bio":"恒安保险派驻的艺术品理赔调查员，负责这幅压轴拍品的承保、运输监封和现场安防审核。当晚大部分时间在贵宾厅陪买家洽谈。","demeanor":"斯文周到，爱用“按程序”“据我所知”，被问到要害时语速反而更慢","topics":[{"id":"t_job","q":"你在这里做什么？","a":"据我所知，这幅《霁雪寒林图》保额八千八百万，承保、运输监封、现场安防审核都归我。我是恒安的调查员。说白了，我是替保险公司盯着这幅画别出事的人。结果偏偏出了事，真是讽刺。"},{"id":"t_where","q":"案发时你在哪？","lie":true,"a":"我从九点十五分起一直在洽谈区陪贺总，监控能证明，一直到十点一刻我才起身，之后去拍卖厅找座位。中间我没离开过半步，这点贺总可以作证，你们调监控就清楚了。","truth":"好吧，铃一响，也就是九点五十五，我就借口去洗手间离开了洽谈区。监控时间我知道偏快二十分钟，我故意引你们去信那个时间。我去了东走廊，见了谷先生。之后的事，我不会再多说一个字。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷先生是业内最顶尖的眼睛，也是最难缠的人。他对每件拍品都要求保险条款逐条过目，我们合作过六次，彼此尊重，仅此而已。他走了，我很遗憾。"},{"id":"t_contact","q":"你今晚和他联系过吗？","lie":true,"a":"到场后只在酒会上点过头，没有单独说过话，也没收到过他的消息。我手机一直静音，拍卖夜我习惯这样，免得打扰客人。","truth":"他的短信我看到了，九点二十。他知道封条的事不对劲。我没回复，铃响后我去见了他。我骗你们，是因为我知道那条短信一旦被看到，我就完了。"},{"id":"t_painting","q":"这幅画是真的吗？","a":"鉴定是谷先生的职权，我只负责保险和运输。我只能说，装箱前后封条完好，从程序上讲，这幅画自始至终没出过问题。"},{"id":"t_crate","q":"10月5日装箱时的情形？","lie":true,"a":"那天我按程序监封，柯女士全程在场，两名搬运工也在，封条S-4417是当着大家的面贴的。整个过程没有任何疏漏，签收单上都有记录。","truth":"柯美玲十四点十分就走了，封箱之前那十五分钟，库房里只有我一个人。我翻到了角落圆筒里那幅没人知道的摹本，就在那十五分钟里动的手：摹本放进木箱，真迹卷进了我的勘验箱。"},{"id":"t_clock","q":"你知道系统时钟偏差吗？","lie":true,"needs":["clue:c_mon3"],"a":"偏差？整改单是例行公事，我随手写一条建议，监控时钟差几分钟太常见了，我并不清楚具体差多少，也没当回事。","truth":"我清清楚楚。十月九号审核时我对过表，快整整二十分钟。那天我就想到，这二十分钟可以变成我的不在场证明。"},{"id":"t_case","q":"你的勘验箱里有什么？","lie":true,"needs":["clue:c_bk1"],"a":"只有仪器：放大镜、色卡、湿度计、手套和记录本。保险调查员的箱子，里面能有什么？你们要查就查，别吓到别人。","truth":"夹层里的是真迹。四千二百万，港商已经谈好，拍卖一结束我就带着箱子走。摹本拍出去，谁还会查？谷鸣远偏偏查了。"},{"id":"t_debt","q":"你最近手头宽裕吗？","lie":true,"needs":["clue:c_dn4"],"a":"我们这行薪水稳当，谈不上宽裕，也谈不上紧。我不好赌也不好酒，生活一向规律，公司的背景调查里都有记录，你们尽管去查。","truth":"我欠了澳门那边一千九百万港币，利滚利，催债的人已经找到公司楼下。港商给四千二百万，还完债我还能全身而退。我本不想杀人，是谷鸣远逼我走到这一步。"}],"confronts":[{"clue":"c_mon1","breaks":"t_where","crack":true,"a":"……三十五分钟。压轴二十二点半开拍，往回推，这一刻是九点五十五，不是画面角落写的十点十五。主机的时间不对，我比谁都清楚。你们……看懂了。"},{"clue":"c_vip1","breaks":"t_where","a":"流程单写得很清楚，终场铃是九点五十五。我说陪到十点一刻，是按监控时间说的。你们要纠结这二十分钟，我无话可说，铃响后我确实离开过洽谈区。"},{"clue":"c_st2","breaks":"t_contact","a":"他的手机……九点二十，十点前来一趟。我确实看到了。我说没收到，是因为我不想成为他最后一条消息的收件人。这谎是我说的。"},{"clue":"c_bk2","breaks":"t_crate","a":"签收单上柯女士十四点十分离场，十四点五十回来，监封人只有我。这张纸……我说全程在场，是我记错了——不，是我说谎。"},{"clue":"c_bk1","breaks":"t_case","crack":true,"a":"那是我的箱子，夹层里是什么我无法再否认。轴头的“程”字款，修复日志里想必也写着。是的，那才是真迹。"},{"clue":"c_mon3","breaks":"t_clock","a":"那是我亲笔签的字，日期、签名都是我的。我说不清楚偏差，是装的，我其实清楚得很，快整整二十分钟，一分不差。"},{"clue":"c_dn4","breaks":"t_debt","a":"……那封信是我掉的。你们既然捡到了，我也不必再装。数字是真的，欠款是真的，人家给的期限也是真的。"},{"clue":"c_st3","a":"镇纸上只有棉纤维压痕？很多人都戴手套，鉴定行业不稀奇。我看不出这和我有什么关系。"}],"fallback":"这和我无关，请按程序来，我愿意配合，但请别断章取义。"},{"id":"han","name":"韩述","role":"书画修复师","age":38,"look":{"skin":"light","hair":"messy","hairColor":"black","glasses":"round","beard":"stubble","outfit":"hoodie","mood":"worried"},"bio":"云轩拍卖行的特聘书画修复师，那幅压轴拍品的真迹曾在他手里修复了整整三个月。当晚在修复间和酒廊之间来回，说话絮叨，手总在抖。","demeanor":"内向絮叨，爱用手艺人的比喻，一紧张就搓手指","topics":[{"id":"t_job","q":"你和这幅画的关系？","a":"七月到九月，这幅《霁雪寒林图》整整三个月都在我案子上。揭裱、补绢、全色，一寸一寸地喂。说句不怕笑话的，我比它的主人更熟它的绢纹，它就像我养大的孩子。"},{"id":"t_where","q":"案发前后你在哪？","lie":true,"a":"我一直在修复间收拾工具，后来去酒廊喝了两杯。鉴定室我今晚根本没去过，谷老师最近忙，我哪敢去烦他。","truth":"我去过。他九点前发短信叫我，我九点到九点十二分在鉴定室里，被他问得像审犯人。我撒谎是怕你们觉得我动过那幅画——我真的什么都没动，我走的时候他还活着。"},{"id":"t_copy","q":"你做过这幅画的摹本吗？","lie":true,"a":"摹本？没有没有，我是修复师，不是造假的。这行最忌讳的就是摹本，我怎么可能碰那种东西。","truth":"做过。十月二日我交给柯美玲一幅展示用摹本，合同写了仅限展陈。我怕说出来，大家以为是我拿摹本调了包，所以才说没有。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷老师是我师傅的朋友，也是我的恩人，行里没人比他更懂眼学。但他眼里揉不得沙子，这也是很多人怕他的原因。"},{"id":"t_money","q":"你缺钱吗？","a":"工作室欠着三个月的薪水，银行也在催，柯美玲的尾款拖了又拖。你说缺不缺？可我再缺钱，也不会拿这种脏手段，你信不信由你。","needs":["clue:c_lb2"]},{"id":"t_msg","q":"谷鸣远找你说了什么？","needs":["clue:c_st2"],"a":"他问我摹本交给了谁，我说只交了柯美玲一人，他又问装箱那天有谁在，我答不上来。他说他心里有数了，让我回去。我走的时候他正低头调紫外灯，活得好好的。"},{"id":"t_mark","q":"“巳”字暗记是怎么回事？","needs":["clue:c_st4"],"a":"那是我的习惯，每幅摹本右下角加一个“巳”，紫外灯下才显形，为的就是将来有人拿摹本冒充真迹，一照就穿。没想到，最后是谷老师用它找出了问题。"},{"id":"t_guess","q":"你觉得谁调的包？","needs":["ask:han.t_msg"],"a":"摹本只经过柯美玲的手，之后就是装箱封存。装箱那天在场的人，我就不知道了。你们去查监封单吧，纸比嘴靠得住。"}],"confronts":[{"clue":"c_st2","breaks":"t_where","a":"……这条短信是我的名字。好吧，我去过。我不是没想说，是我一想到说出来就成了最后见他的人，我就怕。"},{"clue":"c_dn3","breaks":"t_where","a":"侍者看见我九点十五分快步回酒廊？对，我那时候刚从鉴定室出来，脸白得像宣纸，我自己都知道。"},{"clue":"c_lb1","breaks":"t_copy","a":"交接单上有柯美玲的签名，合同条款也在。我否认摹本，是想撇清自己，现在没办法了，是我做的。"},{"clue":"c_lb3","a":"那份律师函……柯美玲想赖掉我的尾款，还倒打一耙要我退预付金。我恨她，但我没杀人。"},{"clue":"c_bk1","a":"……这几处补绢是我七月亲手补的，针脚我闭着眼都认得，轴头上的“程”字小款也在。这才是真迹。它怎么会在保险公司的箱子里？"},{"clue":"c_st3","a":"镇纸？我没留意过那东西。你们别这么看我，我拿惯了镊子和排笔，连只鸡都杀不了，更别说杀人了，真的。"}],"fallback":"我只会修画，别的我真不懂，您问点我能答的行吗？"},{"id":"ke","name":"柯美玲","role":"墨痕画廊主","age":52,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"qipao","acc":"necklace","mood":"stern"},"bio":"墨痕画廊的老板，《霁雪寒林图》的送拍人，成交价她能拿走大头。当晚大部分时间在酒廊应酬，十点前后去敲过鉴定室的门。","demeanor":"干练强势，爱抬高声调，用“我们做画廊的”开头，被戳到痛处会忽然压低声音","topics":[{"id":"t_job","q":"你为什么送拍这幅画？","a":"这是我们墨痕画廊压箱底的东西，我替藏家守了十年。八千八百万的估价，是我们这行的脸面，也是我的心血。谁要毁了它，我跟谁拼命。"},{"id":"t_replica","q":"这幅画有摹本吗？","lie":true,"a":"摹本？我们做画廊的，最忌讳在真迹旁边放仿品，哪来的什么摹本。你们不要听风就是雨，更不要拿这种没影的事来给我添乱，我没工夫陪你们猜。","truth":"有。韩述十月二日交给我一幅展示用摹本，是为了真迹送拍这阵子，画廊展厅里不至于空着。我没敢告诉拍卖行，怕保险公司觉得我们保管不严，不肯承保。"},{"id":"t_present","q":"10月5日装箱你在场吗？","lie":true,"a":"当然在场，从头到尾我都盯着。封条是当着我的面贴的，严先生和搬运工都可以作证，这么大的拍品，我怎么敢走开。","truth":"我十四点十分出去了，四十分钟。有个人必须见，我没办法。库房里只剩严松一个人监封。我这些天越想越怕，所以才硬说我全程在场。"},{"id":"t_call","q":"你和谷鸣远最后说了什么？","lie":true,"a":"那通电话只是聊夜场流程，叮嘱我别紧张，开拍时我得坐在第一排，替藏家举牌应答。统共三分钟，没什么别的，你们不用追问。","truth":"他问我10月5日装箱那天我在不在场，又问摹本放哪了。我说我不在，我出去了一会儿。他沉默了很久，说：“知道了。等拍卖完我再找你。”那是他最后的话。"},{"id":"t_victim","q":"你怎么看谷鸣远？","a":"谷鸣远是我认识二十年的老朋友，也是拍卖场上让我最放心的人。他说话从不拐弯，今晚他叫我时语气很沉，我就觉得不对劲。"},{"id":"t_knock","q":"你去敲过鉴定室的门？","a":"十点零五分左右，我去敲了三下，里面没人应。我想他是不想被打扰，又等了几分钟才去找保安。保安说动主卡要先报备，磨了十来分钟，十点一刻过了才开的门。"},{"id":"t_loan","q":"你很缺钱吗？","needs":["clue:c_vip2"],"a":"……是，魏老板的质押款到期日是十月二十号。拍卖成交，我才还得上。所以这幅画的真假、拍卖能不能成，对我生死攸关。可我要杀他，就不会自己守着画等他开拍了。"},{"id":"t_tube","q":"摹本平时放在哪？","needs":["clue:c_lb1","clue:c_bk2"],"a":"库房最里头的圆筒，靠在铁架角落，我自己都懒得去看。十月五号那天我走得急，库房门没锁，叫严先生自己进去对封箱清单——人家是保险公司的，我信得过。现在想想，我真是……"},{"id":"t_lender","q":"十四点十分你见了谁？","needs":["ask:ke.t_present"],"a":"魏老板。我在街角茶楼求他把质押宽限，他最多只肯拖到十月二十号。回来的时候封条已经贴好，严先生说一切顺利，我看着封条完好，就放心了。"}],"confronts":[{"clue":"c_lb1","breaks":"t_replica","a":"这是我的签名……好吧，我承认摹本是有的。可它一直躺在库房的圆筒里，我没碰过，你们不要把我往坏处想。"},{"clue":"c_bk2","breaks":"t_present","a":"签收单上写着我离场，我还能说什么。我撒谎是怕保险失效，画一旦被说成监封有漏洞，质押方就要抽贷。"},{"clue":"c_st2","breaks":"t_call","a":"他的手机记着我，三分钟。好，我告诉你们实话，他问的是封箱，不是流程。我当时慌了，所以……"},{"clue":"c_vip2","a":"这份合同怎么在沙发缝里？……对，那是我的，不小心掉的。是，我缺钱，但我缺的是画卖出去，不是画被毁掉。"},{"clue":"c_dn3","a":"我在东侧走廊打电话，是在求魏老板宽限日子，不是别的。声音抖，是急的，换你被逼到那份上，也会哭出来的。"}],"fallback":"这和我没关系，我只关心画能不能顺利拍卖，别绕弯子。"},{"id":"he","name":"贺承","role":"压轴竞买人","age":49,"look":{"skin":"tan","hair":"slick","hairColor":"black","glasses":"none","beard":"mustache","outfit":"jacket","acc":"pocketwatch","mood":"smirk"},"bio":"做地产起家的富商，今晚最有可能举牌拿下压轴拍品的买家。酒会大半时间都在贵宾厅洽谈区，和保险公司的严松聊天。","demeanor":"豪爽带点江湖气，爱叫人“老弟”，被问急了会拍桌子","topics":[{"id":"t_job","q":"你为什么想拍这幅画？","a":"老弟，我这辈子收了不少东西，就缺一幅压得住场的雪景。这幅《霁雪寒林图》来历干净，名头又响，该花的钱我不省。拿下它，我这个收藏圈的位子就坐稳了。"},{"id":"t_know","q":"你以前认识谷鸣远吗？","lie":true,"a":"谷老师？今晚酒会才第一次见，隔着人群点了个头。我这种人怎么会和拍卖师有交情，那是犯规的。","truth":"十月十一号我私下来云轩预览过，谷鸣远特批的。我想探别的买家上限，他当场翻脸把我骂回去，说再问就取消我的号牌。我怕这事传出去号牌被吊销，才装不熟。"},{"id":"t_talk","q":"你和严松聊了什么？","a":"艺术品投资啊，他讲保险条款、估值逻辑，一套一套的，我听得服气。九点一刻起在洽谈区坐下，聊了将近四十分钟。这个人说话滴水不漏。"},{"id":"t_bell","q":"终场铃响时他怎样？","needs":["clue:c_mon1"],"a":"铃一响他就起身，说去趟洗手间，让我先进拍卖厅。我还抬头看了那块倒计时，三十五分钟，记得清楚。之后我直接进场了，没再见到他，直到拍卖厅里宣布出事。"},{"id":"t_qian","q":"你和钱立诚有往来吗？","lie":true,"a":"钱总？酒会上碰过一杯，没有往来。我买画，他是云轩的股东，不过如此，你别把我和他扯到一块儿，传出去不好听。","truth":"行，我跟你说实话。我在谈收购云轩，价码二点四亿，钱立诚是中间人。谷鸣远不松口，这事就黄了。我瞒着，是怕你们把收购和命案扯在一块。"},{"id":"t_bid","q":"你打算出到多少？","a":"一亿二的底线，再多我就走人，谁劝都没用。这事我没瞒着，谁问我都这么说，拍卖场上讲的就是一个干脆。"},{"id":"t_victim","q":"你怎么看谷鸣远的死？","a":"可惜，真可惜。能把规矩守得这么死的拍卖师，这行里不多了。就这么没了，我心里不是滋味。"}],"confronts":[{"clue":"c_vip3","breaks":"t_know","a":"登记册连我名字的“贺”字都涂改出来了？行，我认。那次预览是我求他的，别往歪处想。"},{"clue":"c_dn1","breaks":"t_qian","a":"备忘录上写着“贺总方”，那是钱立诚的手机。是，我们在谈收购，我得瞒着，因为谷鸣远是最大的拦路虎。"},{"clue":"c_mon1","a":"这就是我刚才说的，铃响他起身，墙上倒计时三十五分钟。你们要我作证，我就实话实说，反正我进场的时候他没跟上来。"},{"clue":"c_st2","a":"这条短信不是发给我的，里头的事我一概不知道。你们别拿这个吓唬我，我是来买画的，不是来蹲局子的。"}],"fallback":"老弟，这个我真不清楚，你换个问法。"},{"id":"qian","name":"钱立诚","role":"拍卖行大股东","age":58,"look":{"skin":"light","hair":"bald","hairColor":"grey","glasses":"round","beard":"none","outfit":"vest","acc":"bow","mood":"sly"},"bio":"云轩拍卖行持股最多的股东，名义上主管财务与后勤。他和谷鸣远是三十年合伙人，近来为公司股权的去向多次起争执。","demeanor":"官腔十足，爱说“按公司章程”“据我了解”，被追问时笑着绕圈子","topics":[{"id":"t_job","q":"你在公司负责什么？","a":"我主管财务与后勤，按公司章程，拍品估值与成交归鉴定部和拍卖师负责，我不干涉。老谷是首席，我是后勤，我们三十年的配合，一向分工明确。"},{"id":"t_where","q":"案发前后你在哪？","lie":true,"a":"我一直在拍卖厅，调试大屏和音响，九点半到十点一刻，工作人员都可以作证。我是股东，也是后勤，这种夜晚我哪敢乱走。","truth":"我九点半多上了天台，说是抽烟，实则一直在跟对方律师打电话，十点十一分才下来。我瞒着，是因为那通电话在谈出卖公司，被人知道我就完了。"},{"id":"t_victim","q":"你和谷鸣远关系如何？","a":"三十年的合伙人，难免有分歧。他对公司股权有他的坚持，我有我的考虑，但我们从没红过脸。他的死，对云轩是巨大的损失。"},{"id":"t_stock","q":"他手里的股份会怎样？","a":"老谷持有百分之十，按章程，他无继承人，股权由公司回购或转给其他股东。说到底，谁受益，我心里也明白，所以我先说清楚：我没杀他。"},{"id":"t_deal","q":"你在谈收购吗？","needs":["clue:c_dn1"],"lie":true,"a":"收购？没有的事，公司的事我只管后勤，股权上的事我从来不碰。你们不要拿一条没头没尾的备忘录做文章，那说明不了什么。","truth":"好，我谈了。贺承出价二点四亿，要全部股权，条件是拿到老谷的百分之十。老谷不同意，我本想今晚拍完让他松口。可我没杀他，他死了，这笔交易反而悬了。"},{"id":"t_roof","q":"你在天台和谁通话？","needs":["ask:qian.t_where"],"a":"对方的律师，姓顾。通话记录你们尽管去查，九点三十四分打出，十点零九分挂断，一共三十五分钟。"},{"id":"t_clock","q":"你知道监控时钟问题吗？","a":"那是安保部的事，我只在年终会议上听老彭提过一句，说主机老了，该换了。具体偏差多少，我没留意，也不归我管。"}],"confronts":[{"clue":"c_mon4","breaks":"t_where","a":"彭大海居然把我上天台的时间记了下来？……这个榆木脑袋。行，我认，我那段时间确实不在拍卖厅里。"},{"clue":"c_dn1","breaks":"t_deal","a":"这是我的手机……备忘录是我写的。是，收购这件事我一直在推，老谷不点头，我一个人做不了主。"},{"clue":"c_vip2","a":"柯美玲的质押合同？我头一次见。这件事公司没有备案，我一点也不清楚，你们该去问她本人，别问我。"},{"clue":"c_mon2","a":"门禁记录……我对监控一窍不通。不过我们公司的门禁什么时候乱成这样了？这些记录该交给谁看，回头得整顿一下。"}],"fallback":"这个问题，按公司章程，我无可奉告。"},{"id":"su","name":"苏小棠","role":"拍卖助理","age":25,"look":{"skin":"fair","hair":"ponytail","hairColor":"brown","glasses":"none","beard":"none","outfit":"dress","acc":"headset","mood":"worried"},"bio":"谷鸣远的贴身助理，管流程、编目和竞买人登记，跟了他两年。当晚戴着耳麦满场跑，是最后给他送茶的人。","demeanor":"语速飞快，爱说“哎呀”“真的啦”，一紧张就咬嘴唇","topics":[{"id":"t_job","q":"你平时做什么？","a":"我是谷老师的助理，流程单、编目、号牌登记，全是我的活。他脾气硬，但对我很照顾，教了我不少东西。他走了，我到现在都不敢信。"},{"id":"t_tea","q":"你最后见他是什么时候？","a":"二十点十分，我给他送了一壶茶。他在鉴定室门口接过去，说“今晚谁也别打扰我”，还叮嘱我十点前准时敲铃。我就是那时候最后一次见他。"},{"id":"t_open","q":"入库编目时你开过箱吗？","lie":true,"a":"我没开过箱呀，真的啦。箱子是原封到的，封条S-4417完好，我按流程只核对封条，开箱是谷老师的权限。","truth":"我开过。十月八日我偷偷拧开侧板，把画拍了照，想赶在谷老师之前做图录，违反了规定。我怕被骂才不敢说。封条没动，是因为我动的是侧板的螺丝。"},{"id":"t_photo","q":"照片里的画有问题吗？","needs":["clue:c_bk4"],"a":"我看不出来……那天的画跟平时一样，绢色、题款、印章都对。我不是鉴定师，要是有问题，也只有谷老师能看出来。现在想想，是不是我拍的就已经……"},{"id":"t_see","q":"终场铃响后你看见谁？","needs":["ask:he.t_bell"],"a":"我在拍卖厅门口收号牌，A-08贺总铃响没多久就进来了。大概十点零八分，严先生从东边走廊那头过来，说洗手间排队，随便找了个靠后的座位。我当时忙着数人，没多想。"},{"id":"t_list","q":"号牌名单你给过谁？","a":"没有啊……除了A-08贺总的助理私下问过我一嘴，我没给。哎呀，真的就是问了一嘴，你们别往外传，我会被开除的。"},{"id":"t_victim","q":"你觉得谁想害谷老师？","a":"他得罪的人不少，可他是为了守住规矩。他今晚情绪很沉，看着像是发现了什么大事。我不敢猜，真的不敢。"}],"confronts":[{"clue":"c_bk4","breaks":"t_open","a":"这是我的平板……好吧，我违规了。我只是想早点做图录，没想到……没想到会出这种事。"},{"clue":"c_vip1","a":"这是我打的流程单，铃响一次，鉴定室那边谷老师说十点前出来。批注是我写的，他那时亲口说的。"},{"clue":"c_st1","a":"这是谷老师的笔记，他的字我认得，一笔一划都不会错。“真迹在哪？”……他是不是已经发现画被换了？"},{"clue":"c_mon1","a":"这是贵宾厅的监控画面？我对这套系统不太熟，时间戳我平时没留意过，也没人跟我说过它有问题。"}],"fallback":"哎呀，这个我真不知道，你别吓我……"},{"id":"peng","name":"彭大海","role":"保安队长","age":46,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"uniform","acc":"badge","mood":"stern"},"bio":"云轩拍卖行的保安队长，退伍军人，管门禁、监控和夜间巡逻。当晚是他用主卡打开鉴定室的门，发现了谷鸣远。","demeanor":"军人腔，爱说“报告”“长官”，被问到痛处会声音变大","topics":[{"id":"t_job","q":"你负责什么？","a":"报告，我管门禁、监控、巡逻，一共六个人的班。云轩的安保，每个点位我心里都有数。这次出事，我有责任。"},{"id":"t_clock","q":"监控时间准确吗？","lie":true,"a":"准！主机每天自动校时，误差不会超过几秒钟，我天天盯着的。你们看到的所有时间戳，放心大胆地当真就是了。","truth":"报告，不准。去年自动校时老是让摄像头掉线，我就把它关了，慢慢地主机越走越快，现在快了二十分钟。我怕被扣奖金，一直没敢报上去。"},{"id":"t_post","q":"你整晚都在监控室吗？","lie":true,"a":"报告，我整晚没离开过监控室，眼睛都没眨一下。所有点位的画面都在我视线里，要是有人进出，我不可能不知道。","truth":"报告，九点三十五到十点我溜出去了，躲在消防楼梯间用手机打了二十多分钟牌，监控室没人。我知道这是失职，可我真没碰过鉴定室。"},{"id":"t_open","q":"你怎么开的鉴定室门？","a":"柯女士十点零八分来监控室找我，说敲门没人应。规定动主卡得先向值班经理报备，报备完，十点一刻到的门口，十点十八分刷卡开门，谷先生已经倒在地上了，我第一时间报警，保护现场。"},{"id":"t_door","q":"谁能进鉴定室？","a":"门关上自动落锁，能开的有两张：谷先生自己的卡，和我的主卡。里面的人要放人进去，按钮一按门就开。门禁只记录刷卡，按钮不记。"},{"id":"t_cam","q":"东走廊摄像头怎么回事？","needs":["clue:c_mon2"],"a":"雷击，3号摄像头那一路跳闸，要去配电间手动合闸。我看见画面黑了，想等巡完这一轮再去，一拖就拖到出了事。这事我认。"},{"id":"t_offset","q":"时钟究竟偏了多少？","needs":["clue:c_mon3"],"a":"二十分钟，我自己拿手机对过。整改单我没签收。严先生来过一回，说整改月底前做完就行，夜场前千万别动系统，万一重启出岔子谁担责。我就顺坡下驴，拖着了。"}],"confronts":[{"clue":"c_mon2","breaks":"t_clock","a":"报告，设置页是我截的，“自动校时：关闭”。这是我关的，你们说得对，我愿意受处分，也不再瞒了。"},{"clue":"c_mon4","breaks":"t_post","a":"这是我的巡逻本，空白的那一栏就是我溜走的时间。我认罚，只求你们别把赌博的事告诉老板。"},{"clue":"c_mon1","a":"这帧画面时间戳是十点十五分，可我觉得，嗯……这块倒计时屏看着不对。我不是技术员，说不准。"},{"clue":"c_st3","a":"报告，我进去的时候，镇纸就是这个样子滚在地毯上，我没动现场，保护得很完整，请长官放心。"}],"fallback":"报告，这个我不清楚，请换个问题。"},{"id":"luo","name":"洛芷","role":"博物馆研究员","age":33,"look":{"skin":"light","hair":"long","hairColor":"black","glasses":"round","beard":"none","outfit":"turtleneck","acc":"scarf","mood":"sad"},"bio":"谷鸣远多年前的学生，也曾是他的恋人，现在在省博物馆做书画研究。受谷鸣远邀请来看压轴夜场，当晚多半时间在酒廊独坐。","demeanor":"冷静克制带自嘲，被刺痛时会笑一下，“你们别用那种眼神看我”","topics":[{"id":"t_job","q":"你为什么来今晚？","a":"谷老师邀请我来看压轴夜场，说有一幅他想让我看的东西。我在省博做书画研究，他是我的师傅。这些年我们不常联系，这次请柬来得有些突然。"},{"id":"t_relation","q":"你和谷鸣远是什么关系？","a":"师生，也曾经不止是师生。都过去了，各过各的日子，这些年连逢年过节都不怎么联系，你们不用多想。"},{"id":"t_visit","q":"你今晚单独见过他吗？","lie":true,"a":"没有。酒会上我一直待在酒廊，没有去过鉴定室，更没有单独见他。你们不要把我和这件事扯上。","truth":"我去过。二十点二十分到四十分，我在鉴定室里和他吵了一架，也提醒他那幅画的绢手感太新。他脸色很沉，只说了句“有人动了不该动的东西”，我气得撂下一句“你会后悔的”就走了。我撒谎，是怕你们知道旧事，更怕你们听到那句话。"},{"id":"t_paper","q":"你为什么说手感太新？","needs":["clue:c_bk3"],"a":"我摸过上百幅清初的绢本，那幅画的画心绢，手感太新，太挺括。可我没勇气说它是假的——我怕我错了，也怕我对了。我只是写了张便笺，让他再看一遍。"},{"id":"t_after","q":"九点半后你在哪？","a":"二十一点半离开酒廊后，我在楼梯间坐着，雨声很大，我哭了一阵。没人能证明，你们爱怎么想怎么想。"},{"id":"t_old","q":"你们的旧事是怎么回事？","needs":["ask:luo.t_visit"],"a":"九年前，他答应推荐我去故宫，后来因为一场鉴定风波他撤回了推荐。我恨过他很多年，直到后来明白，他是为了保护我。今晚我去找他，也是想把话说开。"},{"id":"t_victim","q":"你觉得他会遇到什么事？","a":"他太认真了，认真的人容易得罪人。请柬上只写了“来看一幅画”，我想他这阵子多半就是在为这幅画发愁。"}],"confronts":[{"clue":"c_bk3","breaks":"t_visit","a":"那是我的包，里面的纸条是我写的，时间也是真的。好，我说实话，二十点三十五分我还在鉴定室里，我去过。"},{"clue":"c_dn2","a":"酒廊的账单，是的，我二十点四十五到二十一点三十分都在吧台，侍者可以证明。我不是不想说，是怕被问到更多。"},{"clue":"c_st4","a":"紫外灯下的“巳”字……他是不是已经确认它是摹本了？那我今晚的直觉没有错，可我宁愿自己错了。"},{"clue":"c_st1","a":"这是他的笔迹，我认得，一笔一划都像他本人。“真迹在哪？”……他最后一页想的，竟然是这个。"}],"fallback":"我只想知道真相，别的，与我无关。"}],"solution":{"culprit":"yan","method":{"q":"凶手怎么做到的？","options":["买通保安关闭东走廊监控，趁谷鸣远独处时潜入，用主卡开门行凶","先在10月5日装箱时调包，再借监控和门禁时钟偏快二十分钟制造“全程在贵宾厅”的假象，终场铃后进入鉴定室行凶","在谷鸣远的茶里下毒，再伪造现场令死亡时间提前","与柯美玲合谋，由她在东走廊望风，严松从鉴定室暗门出入"],"correct":1},"motive":{"q":"为什么杀人？","options":["为了阻止拍卖行被贺承收购","为了独吞保险公司的赔偿金","他私下调包卖掉真迹，谷鸣远识破摹本并追问封条，凶手灭口以掩盖盗换","为报复谷鸣远当年撤回对他的推荐"],"correct":2},"keyClues":["c_mon1","c_vip1","c_st1","c_st2","c_bk1","c_bk2"],"truth":["凶手是保险调查员严松。他欠下巨额赌债，10月5日在墨痕画廊监督装箱时，趁柯美玲离场、封箱前库房里只剩他一人的十五分钟，把角落圆筒里的“展示用摹本”封进木箱，真迹则卷进自己勘验箱的夹层，港商已谈好四千二百万。","谷鸣远当晚终检时，在紫外灯下照出摹本右下角韩述留下的“巳”字暗记。洛芷提醒绢太新，韩述承认摹本只交给过柯美玲，他在笔记里写下：封箱监封人只有严松。他21:20发短信让严松十点前来解释，又在21:42追问柯美玲，确认她当天不在场。","严松的“不在场证明”来自一个错觉：拍卖行门禁和监控的时钟偏快整整二十分钟。他在10月9日的整改单里亲笔写过这一条。监控里他陪着贺承直到22:15，其实那是真实的21:55——终场铃一响，他就借口去洗手间离开了。","21:58，严松戴着白棉手套进入鉴定室，趁谷鸣远转身开紫外灯，用青铜镇纸击杀了他。门关上自动落锁，不需要刷卡，也没有任何记录。东走廊摄像头恰好因雷击离线。22:08，他回到拍卖厅，苏小棠还看见他从东走廊那头过来，说是洗手间排队。","保安彭大海22:18开门，门禁却记成22:38，又是同样的二十分钟。贺承证实严松在铃响时起身，那块倒计时写着三十五分钟；流程单写明终场铃是21:55。这些独立线索合起来，严松的“全程在场”不攻自破。","至于其他人：韩述怕被当成造假者，柯美玲怕质押贷款曝光，贺承私下预览、钱立诚暗谈收购、苏小棠违规拆箱、彭大海赌博又关了自动校时、洛芷隐瞒旧情——每个人都有秘密，但没有一个人的秘密能解释那二十分钟。","最后的铁证是后台17号架的勘验箱：夹层里卷着的绢本，旧补绢与轴头的“程”字小款都对得上韩述的修复日志，才是真迹。吧台边掉落的赌场逾期通知，背面写着“4200”和“拍后”，说明了他为何铤而走险。严松原打算拍卖一结束，就拎着这只箱子走出云轩。"]}},{"id":"zujie","title":"留声","tagline":"满座宾客都听见他在门里念稿，可那扇门是从外面锁上的。","difficulty":4,"cover":"cover","tone":"sepia","brief":"一九三七年八月底，上海法租界。闸北的炮声隔几分钟就滚过一阵，泰和洋行买办顾鸿章在霞飞路公馆办欢送酒会，周二就要举家去香港。可就在致词前，他死在了锁着的书房里。公馆里有英国大班、日本记者、来历不明的女学生，还有一台据说在发报的电台，巡捕房的老朋友怕此案牵出外交纠纷，半夜把你请来。你踏进公馆时，客厅里的钢琴没人弹了，二十来位宾客被扣在原地，所有人都说同一句话：九点四十一分，顾老爷在书房里排练致词，还活着。","victim":{"name":"顾鸿章","desc":"泰和洋行买办，五十八岁。仰卧在二楼书房书桌后，后脑被重物击伤。书房门从外面反锁，钥匙在他背心口袋里，窗闩却是抬起的。","look":{"skin":"light","hair":"slick","hairColor":"grey","glasses":"rect","beard":"mustache","outfit":"suit","acc":"pocketwatch","mood":"stern"}},"publicFacts":["顾鸿章是泰和洋行的买办，周二将去香港，今晚的酒会既是欢送，也是为了二十二点的致词。","二十二点十分，管家周福用钥匙打开反锁的书房门，发现顾鸿章死在书桌后，凶器像是桌上的铜马镇纸。","书房的钥匙共三把：顾自己一把（在他口袋里）、管家一把、账房钱仲平一把。","大班哈考特与账房钱仲平称，二十一点四十一分在书房门外听见顾在里面排练致词，所有人据此认为那时他还活着。","公馆里有英国大班、日本记者、来历不明的女学生，据说阁楼里还有人发电报；二十二点十分后大门落锁，宾客一律不得离开。","闸北正在打仗，租界当局最怕涉外命案，限你天亮前给出答案。"],"timeline":[{"t":"19:30","text":"晚宴开席，二十几位宾客在餐厅入座。"},{"t":"20:40","text":"宾客移至大客厅，林素秋弹钢琴，白露放留声机。"},{"t":"21:41","text":"大班与账房称在书房门外听见顾鸿章排练致词（二人所述）。"},{"t":"22:00","text":"原定致词时间，顾鸿章没有出现。"},{"t":"22:10","text":"管家用钥匙开门，发现顾鸿章死亡，窗闩抬起，门反锁。"},{"t":"22:15","text":"公馆报案，租界巡捕房通知了你。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"study","name":"顾鸿章的书房","scene":"study","desc":"二楼走廊尽头的大书房，厚地毯、红木书桌、满墙洋装书。尸体已被盖上白布，门锁已被管家用钥匙打开过。","clues":[{"id":"c_study1","title":"书房的手摇唱机","text":"窗边矮柜上的手摇留声机，发条已完全松尽，唱针停在一张十寸铝质刻录盘最里圈的空槽上，盘面用铅笔写着“致词 一”。制动杆上缠着一小截烧焦的红色棉线，旁边小碟里有一截烧短的线香头，香灰落了一小摊。"},{"id":"c_study2","title":"死者的状态","text":"顾鸿章仰卧在书桌后，后脑塌陷，血已发暗发干，地毯上的血渍边缘结硬。夜里十一点巡捕房的医生赶到，试了下颌与颈项：已经僵硬，手指冰凉，膝弯也发紧。他低声说：“僵到这个地步，少说也死了快两个钟头，也许更久。”桌角那只铜马镇纸沾着血和头发，地毯上还有一只摔碎的威士忌杯。"},{"id":"c_study3","title":"刻录盘试听","text":"你把“致词 一”放回唱机摇紧发条试听：顾的声音念着告别词，第一句“诸位，今晚承蒙赏光”之后清了一下嗓子，后面有一句“我先静一静，稍后再出来同诸位道别”，全盘约两分半钟，底噪沙沙。旁边另一张“致词 二”被收在唱片套里，盘面干净没有磨痕。"},{"id":"c_study4","title":"门锁与钥匙","text":"书房门是普通的弹子锁，从外面用钥匙才能反锁。顾的钥匙在他背心口袋里，锁孔内侧没有插着钥匙。管家说这把锁一共三把钥匙：顾自己一把、管家一把（开门用的就是这一把）、账房钱仲平一把，他说自己那把一直锁在抽屉里。"},{"id":"c_study5","title":"半开的法式窗","text":"通向露台的法式窗窗闩被抬起，窗扇虚掩。但门槛和窗框下缘落的一层薄灰完好无损，没有被手或鞋蹭过；窗帘下摆干燥平整，而窗外这一晚下过雨，露台边缘湿漉漉的。"}]},{"id":"acct","name":"账房","scene":"library","desc":"一楼后侧的小账房，满柜线装账簿，一股檀香味。钱仲平平日在这里办公，门没锁。","clues":[{"id":"c_acct1","title":"线轴与线香","text":"账房桌上摆着装订账册用的红色粗棉线轴，线头有新鲜的剪口，轴上少了一截。桌边的香筒里插着一束同样粗细的檀香线香，其中一支被掐去了一段。账房里常年点檀香，这是钱仲平的习惯。"},{"id":"c_acct2","title":"两套账簿","text":"书柜里有两套账。一套是洋行保证金的明细账，每页盖着“钱”字朱印，大笔款项以“寄港·K.M.”名义转出，累计四十二万元。另一套是顾鸿章的私账，字迹是顾的：K.M. 即“金茂行”，开在香港，户主栏填的是顾鸿章的化名。"},{"id":"c_acct3","title":"钱的存折","text":"抽屉里一本折子：钱仲平四千八百元的全部积蓄存在顾家的“鸿泰钱庄”，八月二十六日起挤兑停付，折上盖着“暂缓提取”的红戳。折子下压着一张写着“儿媳产期在十月”的便条。"}]},{"id":"hall","name":"大客厅","scene":"hall","desc":"摆着三角钢琴和留声机的大客厅，酒会的残局还没收拾，窗外隐约传来闸北方向的炮声。","clues":[{"id":"c_hall1","title":"舞会节目单","text":"节目单背面是铅笔写的临时安排：“林小姐：21:30 后曲目改慢板，21:38 起停琴七分钟（钱先生嘱，说老爷要排练致词，要清静）。21:45 恢复。”最下面用红笔圈着“22:00 致词”。"},{"id":"c_hall2","title":"电话便条","text":"电话机旁的便条纸上记着：“21:10 吴律师来电，请太太回电，说‘遗嘱和房契的事’。我上楼敲了太太卧房的门，太太在里头应了一声，说‘知道了，待会儿’。”落款是接线的佣人。"},{"id":"c_hall3","title":"来宾签名簿","text":"签名簿上哈考特、几位洋行同仁、银行界人士的名字齐全。最后一栏有个潦草的“石川谦”，介绍人写着“白露夫人”，没有请柬编号，旁边有人用铅笔打了个问号。"},{"id":"c_hall4","title":"沙发上的手袋","text":"沙发角落有只小手袋，里面一本窄长的小册，页页都是四位数字和圈圈叉叉，夹着几张“白鸽票”和马票的存根。手袋内袋里还有一张去香港的船票的收据复写联，写的是两人名字。"}]},{"id":"garden","name":"花园与露台","scene":"garden","desc":"洋房后面的草坪和露台，夜里下过雨，泥地潮软。墙角立着一只焚烧落叶的铁桶，远处有炮声闷闷滚过。","clues":[{"id":"c_gar1","title":"焚烧桶里的残纸","text":"铁桶里的灰还微温，灰底压着半张没烧尽的毛边纸，右下角有一枚朱红的“钱”字方印，纸边一排细密的针孔，像是从线装册子上撕下来的；残存字迹是“……愿自承……亏空……绝无异议”。"},{"id":"c_gar2","title":"窗下的花坛","text":"书房露台下的花坛泥土松软，没有任何脚印通向窗台或爬上露台的痕迹。草坪另一头的树荫下有一小片被反复踩踏的草，地上落着五六个“敷岛”牌香烟头，离书房窗约二十步。"},{"id":"c_gar3","title":"掉落的胶卷盒","text":"树荫下的草丛里躺着一只空的小号胶卷盒，盒盖上有人用指甲划了个“I”字。附近的草被压得很平，像是有人长时间蹲伏在这里，朝书房的窗口张望。"}]},{"id":"attic","name":"三楼阁楼","scene":"guestroom","desc":"顾明远住的阁楼客房，斜顶、小窗、一张行军床。屋里有股焊锡和旧木头的味道。","clues":[{"id":"c_att1","title":"藏在箱里的电台","text":"床下的旧樟木箱里藏着一台短波发报机，天线从老虎窗拉出去。机旁摊着一本发报日志，用铅笔记满数字组，最后几行时间是：“21:04 起 · 21:29 止”，其中一行批注“21:08 新底本到（素）”，每行后面都有一个“明”字签。"},{"id":"c_att2","title":"《圣经》密码页","text":"床头一本英文《圣经》，书页间夹着手抄的一串串数字，对应章节与行数——一套用经文做底的简易密码。扉页写着“林素秋，圣玛丽女校”，字迹是女孩子的。"},{"id":"c_att3","title":"顾写给明远的字条","text":"桌上压着一张顾鸿章手书的字条：“那东西明晚之前搬走。不然我自己送去公董局。你想害我们全家吗？ 鸿”。字条边缘有被攥皱又抚平的痕迹，日期是八月二十三日。"}]},{"id":"kitchen","name":"厨房与后楼梯","scene":"kitchen","desc":"一楼后侧的厨房，连着通二楼的后楼梯和通花园的后门，酒会的碗碟堆了半个灶台。","clues":[{"id":"c_kit1","title":"灶间的湿毛巾","text":"灶台边的毛巾架上挂着一条潮湿的粗布毛巾，上面有一抹淡褐红的痕，凑近有一股檀香味。厨娘说，晚上九点一刻多，有位先生在灶间水龙头下匆匆冲了手，把毛巾用完就挂回去了。"},{"id":"c_kit2","title":"领用单","text":"厨房的领用簿上记着：“20:30 书房 冰一桶 酒杯二只 威士忌一瓶 周福取”。后面又记“20:55 书房 咖啡两份——钱先生说不必，退”。备注栏里有人写：“二楼书房，内有老爷与钱先生。”"},{"id":"c_kit3","title":"后门的泥印","text":"通后弄堂的后门，门槛里侧泥地上有几个新鲜的鞋印，不止一双布鞋，鞋底都沾着雨后的泥。厨房的角落里放着骰盅和一副扑克牌，盒盖上写着“周”。"}]}],"suspects":[{"id":"shen","name":"沈婉仪","role":"顾太太","age":51,"look":{"skin":"light","hair":"bun","hairColor":"grey","glasses":"none","beard":"none","outfit":"qipao","acc":"necklace","mood":"stern"},"bio":"顾鸿章的正室，当家主母，酒会的女主人。说自己晚宴后一直留在客厅招呼女眷，直到管家喊人才知道老爷出了事。","demeanor":"端着架子，冷而克制，开口先“我们顾家”，被戳到痛处就笑。","topics":[{"id":"t_role","q":"你与顾鸿章是怎样的夫妻？","a":"我们顾家二十六年。他是买办，我是顾太太，该有的体面一样不缺，该担的家事我也一件没落下。外头怎么说，我不管。"},{"id":"t_where","q":"案发前后你在哪里？","lie":true,"a":"客厅。陪几位银行太太说话，一步没挪。你去问她们，我是主人，怎么能够离席？这点规矩我还是懂的。","truth":"我二十点五十分上了楼，关着房门在老爷卧房里翻他的抽屉，足足待到九点二十分才下来。我想找船票。我要知道，那个人这一回走，是不是把我留下。"},{"id":"t_noise","q":"你在楼上听到什么？","needs":["ask:shen.t_where"],"a":"落地钟刚敲过九点，过了几分钟，我从卧房出来站在楼梯口，听见走廊那头书房里有一声闷响，像重东西倒了，接着是玻璃碰地的声音。我以为他又跟人拍桌子，没理会。"},{"id":"t_marriage","q":"你和他感情和睦吗？","lie":true,"a":"夫妻之间，有什么不和睦的？他在外头应酬，我在家里管事，二十六年没红过脸。若说有不顺心的，那也是上海这世道不顺心。","truth":"和睦？我找到了两张头等舱的船票，周二开往香港，一张顾鸿章，一张白露。没有我的。他要把我连同这栋空房子一起留给日本人的炮火，自己带着那个唱歌的走。"},{"id":"t_will","q":"吴律师为何来电？","needs":["clue:c_hall2"],"a":"那是遗嘱的事。八月二十号老爷改过一次，吴律师含含糊糊没说明白，我才打电话问。九点二十，我在楼上分机上给他回的话，他说顾的新遗嘱，大头给了一个我“不认得的户头”。"},{"id":"t_ming","q":"你对养子明远怎么看？","a":"明远是我娘家侄孙，过继给我们的。这孩子聪明，就是心太野，整天往学堂跑，跟些来历不明的同学来往。老爷为这孩子操了不少心，也发过几次火。"},{"id":"t_bai","q":"你对白露怎么看？","a":"一个百乐门出来的，会唱几支小曲，就以为这座公馆也姓白了。我不屑与她争。可今晚她在我眼皮底下，把一个陌生的东洋人带进客厅，这就是不懂规矩了。"},{"id":"t_alive","q":"你信那声音是他吗？","a":"我没有亲耳听见，是大班和钱先生说的。钱仲平跟了他二十二年，说话向来稳当，他说听见，大概错不了。只是我没听见，不好说。"}],"confronts":[{"clue":"c_hall2","breaks":"t_where","a":"她盯着便条上“敲了太太卧房的门”那一行，嘴角抽了抽。“佣人嘴快。”她终于说，“我那时在楼上。你想要真话，就别一直盯着我的脸。”"},{"clue":"c_hall4","breaks":"t_marriage","a":"她的指甲掐进了掌心。“船票收据，两个名字……”她低头笑了一声，“原来她也知道。那就不必装了，我找到了票，我气得发抖，我也想过杀人，可我没有动手。”"},{"clue":"c_study4","a":"“钥匙？管家有，账房有。”太太淡淡道，“我是主母，从不管这些。不过这屋里谁能反锁那扇门，我倒是想了很久。”"},{"clue":"c_study2","a":"她看着盖白布的人形，很久没有说话。“僵了？”她低声问，“那么九点过的那声闷响，就是……”话没说完，她的手撑在了椅背上。"}],"fallback":"这些东西我不懂，你该去问账房与管家。"},{"id":"qian","name":"钱仲平","role":"账房先生","age":55,"look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"robe","acc":"pocketwatch","mood":"tired"},"bio":"在顾家当了二十二年账房，经手洋行保证金与顾家全部账目。晚宴后说自己在账房理账，九点半后到大厅招呼客人，还陪大班去过书房门口。","demeanor":"恭谨、絮叨，爱说“不敢”“小的愚见”，被问急了就反复擦眼镜。","topics":[{"id":"t_role","q":"你替顾先生管什么？","a":"洋行的保证金明细、家里的开销、钱庄往来，都是小的经手。二十二年了，顾先生信得过我，账上的章只有我那一枚。不敢说功劳，只能说没出过岔子。"},{"id":"t_last","q":"你何时最后见到他？","lie":true,"a":"二十点五十几分，我把账册送进书房，老爷看了两眼，说了句“知道了”，我就退出来了。那会儿他好好的，我再没进去过。这话巡捕房问几遍都是这句。","truth":"我没有退出来。他拿出一张字据，逼我画押，说四十二万的亏空全是我经手、我盖的章，明晚他就走了，我不认也得认。我……我在他背后抄起了镇纸。九点过一刻我才从那间屋子里出来。"},{"id":"t_where","q":"21点到21点25你在哪？","lie":true,"a":"在账房里，一个人，对着账册。灯亮着，门也没关，谁都看得见。到九点半光景我才去大厅，帮着给客人添茶，这一节厨房里的人都能作证。","truth":"我不在账房。我从后楼梯下来，在灶间冲手，又去了花园。周福撞见我时，我说是烫着了手。那天晚上我走过的每一步，其实都有人看见，只是人家没往心里去。"},{"id":"t_alive","q":"21:41你听到了什么？","lie":true,"needs":["ask:qian.t_where"],"a":"大班哈考特先生要见老爷，我就陪他去书房门口。里头老爷在排练致词，一句句念得清清楚楚，还清了嗓子。大班先生也听见了。老爷那时活着，凶手只可能是后来从窗口进去的外人。","truth":"那不是老爷。我九点十分把“致词一”放上唱机，上紧发条，红线拴住制动杆，线搭在一支点着的粗檀香上，离香头一寸半。香烧到线，线断，盘就转了，正好半个钟头。我带大班去听的，是一个死人念他自己的稿子。"},{"id":"t_voice","q":"那声音真是老爷？","needs":["ask:qian.t_alive"],"a":"是老爷的声音，没错。跟他二十二年，闭着眼我也认得出：他的嗓子，他那口咳嗽，他的官腔。老爷下午还在书房里摆弄他那架新机器，试嗓子，得意得很。您若说是别人学的，除非拿得出第二个顾鸿章。"},{"id":"t_stop","q":"为何要林小姐停琴？","needs":["clue:c_hall1"],"a":"是我去同林小姐传的话，九点三十八分起停七分钟，我同她说的是“老爷要排练致词，请清静一会儿”。大班先生那边，我也请他去听听老爷念稿，有个洋人在旁边，老爷脸上也有光。小事一桩，何必当真。"},{"id":"t_window","q":"书房的窗是怎么回事？","needs":["clue:c_study5"],"a":"窗闩抬着，窗虚掩着，开门的时候小的也看见了。依小的愚见，外头来的人翻进窗，打死老爷，再翻出去，也不是不可能。闸北那边乱成那样，租界里混进多少闲人，谁说得清。"},{"id":"t_ledger","q":"“寄港K.M.”是什么？","needs":["clue:c_acct2"],"a":"这户头是老爷自己吩咐开的，小的只管照章登记，盖的是账房的章。去向么，账上只写“寄港”两个字。外头人说什么的都有，说替日本人办事的，说替英国人跑腿的，小的只认账上的字，不敢乱猜。"},{"id":"t_money","q":"你的钱呢？","needs":["clue:c_acct3"],"a":"小的一辈子的积蓄，四千八百元，存在老爷的钱庄里，八月二十六号停付，取不出一个铜板。儿媳十月生产，我连接生婆的钱都垫不出……可这与命案有什么关系，您别往小的头上扣。"}],"confronts":[{"clue":"c_study1","breaks":"t_alive","crack":true,"a":"他的手慢慢伸向眼镜，又缩回去。“……唱机停了。针在最里头。”半晌，他摘下眼镜，声音突然很轻：“您看得很细。是，是我放的盘，我不敢说是老爷的声音，可我也不敢说不是。”"},{"clue":"c_study2","breaks":"t_alive","a":"“僵了……”钱仲平喃喃道，“可九点四十一分……我亲耳……”他忽然闭嘴，像被人掐住了喉咙。过了一会儿才低声说：“人死了多久，是尸体说了算，不是耳朵说了算。”"},{"clue":"c_study3","a":"他听着唱机里那段“稍后再出来同诸位道别”，肩头一点点塌下去。“……连清嗓子的位置，一个字也没差。老爷下午刻这张盘，是笑着让我听的。他大概没想到，它会被用来干这个。”"},{"clue":"c_acct1","breaks":"t_alive","crack":true,"a":"“这线……是账房的装订线。”他看着那截红线，很久没有说话。“香也是我的。可全公馆的账册都用这种线，您说是我，也说得通别人。”他的手却在发抖，抖得连眼镜都握不稳。"},{"clue":"c_hall1","a":"“……是我吩咐林小姐的。”他连说了两遍，“可我一个账房，让大班听老爷念稿子，也算犯法么？”话没说完，嗓子已经哑了。“那盘子又小又沙，琴一响就什么都盖住了……”他猛地住了口。"},{"clue":"c_gar1","breaks":"t_last","a":"他盯着那枚朱印看了许久。“那是我的章……老爷逼我画的押。我烧了它。是的，我烧了它。”忽然抬起头，“可烧一张纸，不是杀人。”这句话说得既像辩解，又像认罪。"},{"clue":"c_kit1","breaks":"t_where","a":"“灶间的毛巾……”他苦笑了一下，“是我擦的手。我说是烫着了。厨娘居然还记得。”他望着自己的手心，像要找出什么没洗掉的东西。"},{"clue":"c_gar2","a":"“没有脚印。”他重复了一遍，“窗闩是我抬的。我只想着窗闩，没想着泥。”他缓缓坐下，“五十五岁的人，把一个晚上算得再细，也算不过一场雨。”"},{"clue":"c_acct2","a":"“您翻到了他的私账。”钱仲平声音发干，“K.M. 就是金茂行，四十二万，全是他转走的，账却做在我名下。我早知道有这一本，只是没有凭据。他说签了字据，明早便不再追究；不签，便送我去巡捕房。我五十五了，没处去。”"},{"clue":"c_acct3","a":"他的眼圈慢慢红了。“那折子……那是小的一辈子。”他沉默了很久，“他要走，要拿我顶缸，还把我的棺材本留在一家不会再开门的钱庄里。可这些，说出来像是替自己开脱吧？”"}],"fallback":"小的……不敢乱说，这件东西小的没见过，也不明白与账房有何相干。"},{"id":"bai","name":"白露","role":"顾家姨太太","age":31,"look":{"skin":"fair","hair":"curly","hairColor":"black","glasses":"none","beard":"none","outfit":"qipao","acc":"earrings","mood":"worried"},"bio":"百乐门出身的歌女，三年前被顾鸿章纳为姨太太，在公馆里处处看人脸色。今晚在客厅给林素秋的钢琴翻谱、放唱片，还引了一位东洋记者进门。","demeanor":"软糯、会撒娇，嘴上叫“阿拉”，一紧张就绞手帕，爱岔开话题。","topics":[{"id":"t_role","q":"你在顾家的处境如何？","a":"阿拉是什么身份，侬还看不出吗？老爷疼我，太太瞧不上我。我不过是个歌女，进这公馆，吃一口饭，也吃一肚子气。今晚他死了，我还不晓得明天睡哪里。"},{"id":"t_book","q":"手袋里的小册子是什么？","lie":true,"a":"那……那是家里的菜账呀，买米买菜的。数字密密麻麻的，我自己都认不全。侬一定要看，就拿去看好了，反正无聊得很。","truth":"是白鸽票和马票的号码。我偷偷买，输了好些钱，不敢叫老爷知道。人家以为是什么密码本，阿拉倒是想要有那么玄的东西，可惜只是赌。"},{"id":"t_invite","q":"石川是怎么进来的？","lie":true,"a":"是阿拉的表哥呀，在日本做事情。想来见见世面，阿拉就写了个名帖。老爷也知道的，没有什么好问的。","truth":"他不是我表哥。他是个记者，来找我打听顾家与东洋人的往来。我缺钱，收了他一点好处，替他签了名。我真不晓得他要拍什么，更不晓得他会在花园里蹲着。"},{"id":"t_quarrel","q":"你和老爷吵过架吗？","a":"二十点二十分，在走廊里。我问他周二去香港，是不是带我。他说带，又吞吞吐吐，说“人多嘴杂”。我气极了，把手帕丢在他脸上。后来我躲在房里哭，十几分钟，才下楼。"},{"id":"t_record","q":"老爷下午做了什么？","needs":["clue:c_study1"],"a":"下午四点半，老爷新买的那台刻录机在书房玩，还叫我去唱了一首《夜上海》刻在盘上。他刻了两张致词，一张“一”，一张“二”，念得一本正经，念完自己先笑，说官腔十足。钱先生就站在书桌旁递账册。"},{"id":"t_ticket","q":"你知道去香港的船票？","needs":["clue:c_hall4"],"a":"周二的头等舱，一张老爷，一张阿拉。他说太太留在上海看房子，免得被人说闲话。这话他对太太说过没有，阿拉可不晓得，可见了她，阿拉总觉得心虚。"},{"id":"t_hall","q":"21点后你在做什么？","a":"在客厅换唱片。林小姐九点过后就不在琴边，说去透口气，我替她放了几张舞曲，一直放到她回来为止，大概九点二十几分。后来她回来，我就把唱机交给她。"},{"id":"t_ming","q":"你对明远有何看法？","a":"那孩子心眼好，就是爱躲在阁楼里。上个礼拜我听见楼上有“嘀嘀嗒嗒”的声音，像发电报。老爷也听见了，当天夜里火气很大，把他叫去训话。"}],"confronts":[{"clue":"c_hall4","breaks":"t_book","a":"她的脸一下子白了。“侬……侬翻了阿拉的包。”她抢过手袋，又泄气地松开，“好吧，我赌，输得精光，不敢跟老爷说。那种事，总比杀人好听吧？”"},{"clue":"c_hall3","breaks":"t_invite","a":"她看着那行潦草的“石川谦”，抿着嘴唇不吭声，半晌才小声说：“是我签的。我不晓得会出这种事。”"},{"clue":"c_study3","a":"她听见唱机里老爷的声音，浑身一抖。“就是这张。”她低低说，“下午他刻着玩，还笑说‘等我走了，你们想我就放这张’。想不到……”"},{"clue":"c_att3","a":"“明远……”她叹气，“那孩子被老爷逼得没法子。可阿拉可以拿命担保，那孩子连只鸡都不敢杀。”"}],"fallback":"阿拉不晓得呀，侬不要一直盯着阿拉看。"},{"id":"ming","name":"顾明远","role":"顾家养子","age":24,"look":{"skin":"light","hair":"messy","hairColor":"black","glasses":"round","beard":"none","outfit":"shirt","mood":"worried"},"bio":"太太娘家的侄孙，过继给顾家，在圣约翰大学念书。说自己整晚在三楼房里看书睡觉，直到被楼下的喊声惊醒。","demeanor":"年轻气盛，防备心重，爱反问，被逼急了会冷笑。","topics":[{"id":"t_role","q":"你和顾家是什么关系？","a":"过继来的，吃顾家的饭，念顾家的书。老爷待我，说得上恩，也说得上管得严。他想让我毕业后去洋行当学徒，我想去的地方，他不肯放我去。"},{"id":"t_night","q":"案发时你在哪里？","lie":true,"a":"三楼我自己的房里，睡觉。白天跑了一天，累得很，一觉睡到管家敲门。这有什么好问的？我又不是那种杀人的人。","truth":"我没有睡。九点零四分到九点二十九分，我在阁楼里发报。我们这几个同学成立了一个小团体，把上海战事的消息发往内地。那天夜里是整夜最忙的时候，我不能离开半步。"},{"id":"t_gu","q":"你和顾先生有矛盾吗？","lie":true,"a":"没有。老爷待我很好。偶尔训我几句，那是做父亲的本分，我从来不放在心上，更不会为此记恨他。","truth":"有。上周他发现了电台，说再不拆，就把我送去公董局。他说“你想害我们全家吗”。我们吵过，我摔了门。但我不会杀他，他再凶，也是养了我十年的人。"},{"id":"t_lin","q":"你和林素秋认识吗？","lie":true,"a":"林小姐？今晚才第一次见。她是白姨太请来弹琴的，我们一句话都没说过，谈不上认识，更没有来往。","truth":"她是我的同学，也是联络员。她今晚借着弹琴进门，真正的任务是把新的密码底本带给我。九点零八分她上阁楼，十几分钟就回去了。我们都没想到，那十几分钟，会成为她整个晚上的空白。"},{"id":"t_radio","q":"电台是怎么回事？","needs":["clue:c_att1"],"a":"短波发报机，是一位教授拆旧收音机拼的。我在阁楼里用它，替他们发闸北的情况。日志上写着我的起止时间，九点零四到九点二十九，这二十五分钟我一直在发报，一步也没挪开。"},{"id":"t_smell","q":"之后你有没有下楼？","needs":["ask:ming.t_night"],"a":"收报完毕，我下二楼上厕所，大概是九点三十二分。经过书房门口，里头没有一点声音，门缝底下渗出一股檀香味，浓得很。老爷平常只抽雪茄，他最讨厌香味，我当时还觉得奇怪。"},{"id":"t_key","q":"你对书房钥匙了解吗？","a":"三把钥匙，老爷自己一把，管家一把，账房钱先生一把，我都没有。书房是顾家的重地，我这个养子进去只能敲门。"},{"id":"t_will","q":"你想过老爷遗嘱吗？","a":"我不指望他留给我什么。他要是真留给我什么，我反倒睡不踏实。顾家的财产，太太、白姨太、洋行，谁拿都轮不到我。"}],"confronts":[{"clue":"c_att1","breaks":"t_night","a":"他沉默了好一会儿，把发报日志合上，低声说：“你们终究还是翻到了。好，我认。可你们也看见了，这二十五分钟，我寸步没有离开。”"},{"clue":"c_att3","breaks":"t_gu","a":"“他写得很重。”明远冷笑，“可你要是以为我会因此动手，那就看轻了我。我也想过，要是他死了该多好。但我宁可把机器沉进苏州河，也不想拿命去换。”"},{"clue":"c_att2","breaks":"t_lin","a":"他的脸色变了。“她的名字写在扉页上……好吧，她是我的联络员。请别把她牵扯进来，她只是个十九岁的学生。”"},{"clue":"c_study1","a":"明远盯着那截烧焦的红线，目光忽然锐利了：“有人用香做定时？这不是临时起意，这是预先布置好的。”"}],"fallback":"这个我不清楚，我只管自己的书。"},{"id":"hark","name":"哈考特","role":"英籍洋行大班","age":52,"look":{"skin":"fair","hair":"sidepart","hairColor":"red","glasses":"none","beard":"mustache","outfit":"suit","acc":"tie","mood":"stern"},"bio":"泰和洋行的英国大班，顾鸿章的顶头上司。今晚是顾的欢送酒会主宾，明早本要带人查账。他说自己晚宴后一直在大客厅，九点四十分与钱先生一起去过书房门口。","demeanor":"英式冷淡，中文夹英语，语速慢，喜欢先反问“你凭什么这样问”。","topics":[{"id":"t_role","q":"你与顾是什么关系？","a":"他是我的买办，二十年。生意上，他给洋行办事，我给他地位，彼此互不亏欠。我今晚来，是为他送行，也有……几件账目上的小事需要明早处理。"},{"id":"t_private","q":"散席后你见过他吗？","lie":true,"a":"Well，不曾。晚宴之后我一直在客厅里，和银行的几位先生谈话，没有单独见过顾。你们警察总想把大班和买办的闲话变成密谈，我不喜欢这样。","truth":"见过。二十点三十五分，他在书房请我喝威士忌。我们谈到洋行保证金的亏空。他很镇定，说明天十点账本摆在桌上，“都是账房钱仲平经手的，你去问他”。我二十点五十分离开，那是我最后一次看见他的脸。"},{"id":"t_spy","q":"你为什么盯着他的账？","lie":true,"needs":["ask:hark.t_private"],"a":"洋行大班检查买办账目，天经地义。你若想听出别的意思，就是你的想象了。我可没有什么谍报任务，也不会向租界当局以外的人汇报。","truth":"领事馆托我查他：有人说顾把钢材转卖给日方军需商。我查了账，发现钱是流向香港，却不是通敌。这件事没有任何公开的权限，若泄露，我在租界立刻难做。我隐瞒，是为公务，不是为命案。"},{"id":"t_41","q":"21:41你听见了什么？","a":"九点三十九分，钱仲平先生请我去书房门口，说顾正在排练致词。走到门外是四十一分前后，很静，我听见里面的声音：“诸位，今晚承蒙赏光”，然后有人清嗓子，还说“我先静一静，稍后再出来同诸位道别”。我以为他在排练，就没有敲门。"},{"id":"t_odd","q":"那声音有无异样？","needs":["ask:hark.t_41"],"a":"Hmm，现在你问起，我倒觉得有点怪。声音很平，语气没有变化，也没有停顿去想词，一句接一句。人排练时总会重复，会改，会骂自己。而那声音，像背得滚瓜烂熟，或者……像念的是印好的东西。"},{"id":"t_qian","q":"钱仲平如何引你去？","needs":["ask:hark.t_41"],"a":"他在客厅里找到我，神色很恭敬，说“老爷在排练致词，请大班先生听一听，也许有话要指教”。他还特意看了看表，说“差一两分钟，等等就好”。我当时以为是中国人的客气。"},{"id":"t_window","q":"你看到窗口有人吗？","a":"我在客厅窗前抽烟时，往花园看过一眼，似乎有个影子在树荫下。可我的眼睛不是很好，也许是花匠。我没有注意到有谁翻窗，也没有听到任何响动。"},{"id":"t_late","q":"22点之后做了什么？","a":"到了十点，致词时间已到，顾却没有出来。我与钱先生都觉得不对，是管家周福用钥匙开的门。我看见他躺在地上，那一刻我想：昨夜我同他还在讲公事，今天他就不会再说话了。"}],"confronts":[{"clue":"c_kit2","breaks":"t_private","a":"大班把领用单看了两遍，鼻子里哼了一声。“冰桶，两只杯子。是的，那是我。你们的人记账记得比我的会计还细。”他松了松领带，“好吧，我可以说实话。”"},{"clue":"c_acct2","breaks":"t_spy","a":"他看着“金茂行”三个字，神情终于松动。“所以我查到的，只是这个。”片刻后他苦笑，“我的上司将因此得知，这个民国买办不是汉奸，只是个贼。这比我们想的好一些，也坏一些。”"},{"clue":"c_hall1","a":"“钱先生吩咐停琴？”大班皱起眉头，“那么我听到的静，是他安排的静。”他沉默了几秒，“我一直以为，那是顾自己要求的。”"},{"clue":"c_study1","a":"大班凑近唱机看了很久。“有人把它摇上了弦。”他缓缓直起身，“你是说，我听见的是机器？……天哪，我是证人，还是帮凶？”"}],"fallback":"这件东西与我无关。如果你想指控什么，请先拿出证据。"},{"id":"shi","name":"石川谦","role":"日籍记者","age":35,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"sly"},"bio":"《大陆晨报》驻沪记者，日本人，会说一口略带关西腔的中文。凭白露夫人的名帖进了酒会，自称一直在大客厅里与宾客攀谈。","demeanor":"客气得过分，常鞠躬，说话绕弯，被追问时先道歉再避实就虚。","topics":[{"id":"t_role","q":"你为何来参加酒会？","a":"失礼了。我是新闻记者，想报道一位买办离沪赴港的新闻，也想请教租界商界对战局的看法。顾先生是体面人物，我一向敬重。"},{"id":"t_where","q":"案发时你在哪里？","lie":true,"a":"一直在大客厅，与几位先生谈话，也听林小姐弹琴。失礼，请原谅我记不得具体和谁说话，酒喝得不少，只记得很热闹。","truth":"我在花园。九点钟之后，我借口透气，在树荫下蹲了很久，想拍书房的窗口和人影。我怀疑顾先生和军需商有往来。这件事我没有说，因为我是日本人，在这个晚上出现在命案现场，谁都会怀疑我。"},{"id":"t_cam","q":"你带着相机吗？","lie":true,"a":"没有。记者到酒会，应该只带笔和耳朵，相机太失礼了。我一向守规矩，请不要误会，更不要怀疑我。","truth":"带了一台小相机，藏在大衣里。我在花园里想偷拍，结果胶卷盒掉在草丛里。我什么都没拍到，窗帘一直拉着。"},{"id":"t_war","q":"你对战事怎么看？","a":"我反对这场战争。我写过稿子，被编辑部压下来了。我是日本人，也是人，看见炮火压在闸北，我不好受。请别因为我的国籍，就把我当作间谍。"},{"id":"t_voice","q":"花园里听到什么？","needs":["ask:shi.t_where"],"a":"九点四十分左右，书房窗里传出人的声音，说“诸位，今晚承蒙赏光”。我隔着窗帘听着，觉得声音带着沙沙的杂音，像唱片的底噪，只是当时很远，我没往这方面想。"},{"id":"t_shadow","q":"你在花园看到谁？","needs":["ask:shi.t_where"],"a":"九点二十分前后，墙角焚烧桶边有个瘦瘦的人影，穿灰布长衫，背对着我，在烧什么东西。风里有一股檀香味。他烧完用鞋尖把灰拨平，匆匆走了。我没看见脸。"},{"id":"t_window","q":"你见到有人翻窗吗？","a":"从九点到九点四十，我盯着那扇窗，没有人爬上露台，也没有人从窗里出来。窗帘一直拉着，直到最后，我才听到有人叫管家开门。"},{"id":"t_bai","q":"你和白露怎么认识的？","a":"失礼了，那是一个朋友引荐的。白夫人需要一点帮忙，我需要一张进门的名帖，大家各取所需。我没有为难她，也没有写任何不利于她的东西。"}],"confronts":[{"clue":"c_gar3","breaks":"t_cam","a":"他看着那只胶卷盒，苦笑着鞠了一躬。“失礼了，是我的。盖子上的‘I’是我写的。我只是想拿到一点证据，没想到命案先发生了。”"},{"clue":"c_gar2","breaks":"t_where","a":"石川望着那堆“敷岛”烟头，叹了口气。“这个牌子，租界里肯抽的人不多，我是一个。”他摊了摊手，“好吧，我在花园。请你相信，我只是旁观者。”"},{"clue":"c_hall3","a":"“白夫人替我签的名。”他微微欠身，露出尴尬的笑，“请别告诉太太。我没有恶意，只想进来看看，听听生意人怎么谈战事。”"},{"clue":"c_gar1","a":"他认出了那只铁桶，眼睛一亮。“就是这里。”他指着焚烧桶，“九点二十分，那个穿灰长衫的人，烧的就是这样的纸，一张一张撕着烧。”"}],"fallback":"请原谅，这件事我实在不清楚。"},{"id":"zhou","name":"周福","role":"顾家管家","age":62,"look":{"skin":"tan","hair":"short","hairColor":"white","glasses":"none","beard":"stubble","outfit":"vest","mood":"tired"},"bio":"在顾家当了三十年管家，手里一串钥匙。酒会上张罗茶水酒食，十点过后用钥匙打开书房门，是第一个看到尸体的人。","demeanor":"老派、絮叨，句句带“老爷”“东家”，一慌就把话绕回规矩上。","topics":[{"id":"t_role","q":"你在顾家管什么？","a":"管门户，管下人，管酒窖，管一串钥匙。东家的规矩是，书房锁着，除非他亲口吩咐，谁都不许进。老头子跟了他三十年，没出过半点差错。"},{"id":"t_ice","q":"20:30你送了什么？","lie":true,"a":"冰一桶，杯子一只，威士忌一瓶，只有老爷一人在书房。他嘱咐我别吵，我放下就出来了。","truth":"杯子是两只。大班哈考特先生也在里头。他递给我十块钱，叫我别说他来过书房。我这把老骨头，收了钱，就把嘴缝上了。"},{"id":"t_pantry","q":"21点到21点半你在哪？","lie":true,"a":"就在茶水间。添酒、收杯子、擦盘子，一步没走开。厨房的人都看见的，东家的规矩我不敢忘。","truth":"我溜去后弄堂赌了两手牌九。只一刻钟，九点过后出去，九点一刻多就回了。我怕东家知道，更怕太太知道。那天晚上的牌也没赢，输了八块钱。"},{"id":"t_back","q":"你在后楼梯遇到谁？","needs":["ask:zhou.t_pantry"],"a":"九点一刻多，我从后门回来，在后楼梯上撞见钱先生，他从楼上下来，一边走一边搓手，说烫着了手。我当时只当他又去灶间弄茶水，也没多嘴问。他走路急，鞋也没顾着擦。"},{"id":"t_order","q":"钱先生有吩咐吗？","needs":["ask:zhou.t_back"],"a":"九点三十分前后，钱先生把我叫到一边，说“老爷在排练致词，别惊动他，十点以后再说”。我就照办，一直守到十点。十点了东家还没出来，我才拿钥匙去开门。"},{"id":"t_door","q":"开门时是什么情形？","a":"十点过十分，门是锁着的，锁孔里没钥匙。我用自己的钥匙开了，推门进去，老爷躺在书桌后头，头上全是血。窗是虚掩的，窗闩抬着。我当时一下子腿就软了。"},{"id":"t_key","q":"你的钥匙借出去过吗？","a":"那串钥匙从不离身，连睡觉都挂在腰上。你们可以查：我这一把在东家出事时，仍在我身上。要说借，钱先生那一把，也是东家亲手给的。"},{"id":"t_lin","q":"林小姐中途离开过吗？","a":"那位弹琴的林小姐？九点以后我是看见她从楼梯上下来的，神色匆匆，手里还拿着本书。白姨太替她放了唱片。我只当年轻人坐不住，没往别处想。"}],"confronts":[{"clue":"c_kit2","breaks":"t_ice","a":"管家的手有点抖。“一桶冰，两只杯子，是我自己写的。”他叹了口气，“大班先生给了十块钱，我嘴上说一个人……是我糊涂。”"},{"clue":"c_kit3","breaks":"t_pantry","a":"老管家看着那副骰盅，脸一下红到耳根。“被你们翻出来了。”他搓着手，“我只出去一刻钟。可就是那一刻钟，我撞见了不该撞见的。”"},{"clue":"c_study4","a":"“三把钥匙。”管家点头，“东家那把在他口袋里，我这把在腰上，钱先生那把……他说锁在抽屉里。”他说完，自己也愣了一愣。"},{"clue":"c_kit1","a":"“毛巾……”管家想了想，“我在后楼梯撞见钱先生时，他身上就有这股檀香味。可他向来用檀香，我也没往心里去。”"}],"fallback":"老头子不懂这些，您问别人吧。"},{"id":"lin","name":"林素秋","role":"女学生·钢琴伴奏","age":19,"look":{"skin":"fair","hair":"bob","hairColor":"black","glasses":"none","beard":"none","outfit":"dress","acc":"bow","mood":"worried"},"bio":"圣玛丽女校的学生，经白露介绍到酒会弹钢琴伴奏。说自己整晚坐在钢琴前，只有账房先生请她停琴那一次离开过琴凳。","demeanor":"说话清脆急促，带点学生腔，紧张时咬嘴唇，爱说“其实”。","topics":[{"id":"t_role","q":"你怎么来弹琴的？","a":"白姨太太说酒会缺个弹琴的，我就来了，二十块酬劳。其实我家里在闸北，炮声响了以后，全家逃到法租界，我需要这笔钱。"},{"id":"t_piano","q":"21点到21点半你在哪？","lie":true,"a":"一直坐在琴凳上，没离开过。白姨太替我翻谱子，可是琴一直是我弹的，不信你问在座的客人。","truth":"九点零五分起我离开了二十分钟，是白姨太替我放的唱片。我上了三楼阁楼，把一本新的密码底本交给顾明远。九点二十五分回来。这是我们这个团体里的秘密，我宁可说谎，也不能害了同学。"},{"id":"t_ming","q":"你认识顾明远吗？","lie":true,"a":"不认识。今晚才第一次听说有这么个人。顾家的少爷怎么会和我这样的学生打交道，我们差得远了。","truth":"他是我同学，也是我们团体的负责人。我们靠发报把战事消息送到内地。我今晚借着弹琴进门，其实是为了送密码底本。请不要把他交出去。"},{"id":"t_stop","q":"钱先生要你做什么？","needs":["clue:c_hall1"],"a":"九点半前后，钱先生走到琴边，客气得很，说老爷要排练致词，请我九点三十八分起停琴七分钟，之前换慢板。我照办了，他还站在琴旁看着表。"},{"id":"t_clock","q":"停琴时你看到什么？","needs":["ask:lin.t_stop"],"a":"九点三十八分，我停手，客厅里一下子静下来。钱先生马上走到大班先生身边，两人往楼梯那边去了。七分钟里，我看见他们从楼上下来，大班先生脸色古怪，钱先生却很平静。"},{"id":"t_bible","q":"那本《圣经》是你的？","needs":["clue:c_att2"],"a":"是我的，我送给明远的。其实不是为了礼拜，是用《圣经》的章节行数做底本，换一套新的密码。每周换一次，免得被敌人破译。"},{"id":"t_guzhu","q":"你对顾先生印象如何？","a":"见过一面，很客气，说我弹得好。有钱人的客气总让人不踏实，我只想弹完琴，拿钱回家。"},{"id":"t_bai","q":"白姨太太人怎样？","a":"她是个可怜人，嘴上爱撒娇，心里很空。她替我放唱片，一点怨言也没有，还说“你们年轻人有你们的事”。"}],"confronts":[{"clue":"c_att1","breaks":"t_piano","a":"她咬着嘴唇，眼圈红了。“日志上有我的名字……是，九点零八分，我在阁楼。可我二十分钟就回来了，你们别抓明远。”"},{"clue":"c_att2","breaks":"t_ming","a":"她愣愣地看着扉页，忽然笑了一下。“我写的字，终究是骗不过人的。”她低头，“我认。”"},{"clue":"c_hall1","a":"“这是钱先生写的？”她盯着铅笔字，“我只知道我照他说的做了。他那天看起来特别平静，好像早就晓得七分钟之后会发生什么似的。”"},{"clue":"c_study1","a":"“唱机？”她眨了眨眼睛，声音忽然低下去，“难道说……那天夜里，有人让一个已经不在的人，在门里念了一遍稿子？”"}],"fallback":"我……我不太懂这个，请您问别人吧。"}],"solution":{"culprit":"qian","method":{"q":"凶手是怎样制造“九点四十一分顾鸿章还活着”的？","options":["凶手九点四十分趁无人时潜入书房，模仿死者的声音念稿。","凶手让死者自己在门里念稿，之后才从窗口翻入将其杀死。","提前杀人，把死者下午刻的致词试录盘放上唱机，用线香烧断红线定时放出声音。","凶手买通管家，由管家学顾的腔调在门内说话。"],"correct":2},"motive":{"q":"凶手为什么杀人？","options":["顾鸿章通日卖国，凶手为国锄奸。","顾鸿章侵吞洋行保证金逃港，并把亏空做成凶手经手、盖章的账，逼他画押背锅。","凶手想独吞顾家遗产。","顾鸿章发现了凶手的电台，凶手为灭口杀人。"],"correct":1},"keyClues":["c_study1","c_study2","c_acct1","c_acct2","c_hall1","c_gar1"],"truth":["凶手是账房钱仲平。他用一台留声机和一张刻录盘，把一个死人的声音，放进了所有人的耳朵里。","谍战只是迷雾：阁楼上的电台是顾明远与林素秋的救亡团体所设，石川谦在花园是偷拍与探听，哈考特暗查账目是为领事馆，白露的“密码本”是马票，太太翻楼上抽屉是为了找船票。它们都有事后能解释的真相，却都与命案无关。","真正的动机藏在账里：所谓“寄港K.M.”的款项，并不是通敌，而是顾鸿章把洋行保证金四十二万转入自己在香港开的“金茂行”。他周二要携白露逃走，早已把亏空做成钱仲平经手、盖钱章的账。当晚二十点五十五分，他逼钱画押认账。钱的四千八百元积蓄困在顾家的钱庄里，儿媳十月临盆，他一怒之下抄起铜镇纸，二十一点零五分前后将顾打死。太太在楼梯口听见的那一声闷响，就是此刻。","诡计：下午顾鸿章刻了“致词一”“致词二”两张试录盘，钱当时在场。杀人后，钱把“致词一”放上唱机，摇紧发条，用账房的红棉线拴住制动杆，线搭在一支点燃的粗檀香上，离香头约一寸半，粗香燃得慢，正好烧上半个钟头。香烧断线，制动放开，唱机约二十一点四十分开始出声。他二十一点十五分用自己的钥匙从外面反锁了门，抬起窗闩，让人以为有外人出入。","钱在后楼梯被管家撞见，说烫了手，在灶间冲手，又去花园的焚烧桶烧掉逼他画押的字据。二十一点三十分他请林素秋二十一点三十八分起停琴七分钟，二十一点三十九分又把大班哈考特带到书房门外。唱机里响起“我先静一静，稍后再出来同诸位道别”，一个洋大班成了他最好的证人。","破绽：唱机停在盘尾空槽、制动杆上有红色焦线、账房里有同样的线与线香；顾的尸体在十一点验时已僵硬，死亡远早于九点四十一分；节目单上有钱嘱咐停琴的铅笔字；焚烧桶里有带“钱”字印的字据残片；窗台灰尘完好，花园没有脚印，所谓外人行凶不攻自破。账簿一翻，真相明白：杀人的不是特务，而是被逼到墙角的老账房。"]}},{"id":"mirror","title":"镜厅","tagline":"四壁皆镜，一地粉面，只留一串脚印，和一具没有凶器的尸体。","difficulty":5,"cover":"coverOldHouse","tone":"red","brief":"一九二七年十一月五日深夜，暴雪压着阿尔卑斯山脚的霍恩庄园，山桥已封。管家马蒂亚斯·克勒在电话线断前打来电话，求你立刻赶来。你乘最后一趟雪橇到达时，他正站在门厅，没戴手套，两手攥得发白，衣角还带着一股地窖的潮气。“先生，主人死在镜厅里。”他的嗓音发哑，“仪式后本该二十三点一刻开门，可老爷特意嘱咐，今年多留他一会儿，我守到二十三点四十分才开。我是第一个进去的，只探了探他的脉，别的什么都没碰。他躺在厅心，脸上红肿，像被什么烫过。”身后，舞厅的大门敞着，镜子里映出一地雪白；八个被暴雪困住的人，正等着你开口。","victim":{"name":"奥古斯特·冯·霍恩","desc":"霍恩男爵，六十一岁，镜厅会馆的主人。仰卧在四壁皆镜的舞厅正中央，面部红肿，没有外伤，没有凶器，地上的滑石粉只留下几串脚印。","look":{"skin":"light","hair":"slick","hairColor":"silver","glasses":"none","beard":"goatee","outfit":"suit","acc":"pocketwatch","mood":"stern"}},"publicFacts":["霍恩男爵每年假面夜二十三点举行“三面金面”仪式：男爵与两名替身（管家克勒、画家马洛）同戴金面具、披黑斗篷走进镜厅，替身退出后男爵独留，二十三点一刻摇铃摘面具。","舞厅四壁皆镜，地面当晚新撒了滑石粉，门是普通双扇门，没有锁；仪式期间由管家守在门外。","二十三点四十分管家开门，发现男爵死在厅心；现场确认：除开门后进出的人，粉面上没有别人的脚印，也没有凶器，男爵戴入的那张金面具不见了。","暴雪封桥，电话线二十三点五十八分中断，庄园里没人能离开。","仍被扣在庄园里的重要相关者有八人：管家、面具师、画家、上校、女伯爵、医生、记者、债权人。","男爵生前负债，庄园已抵押，据说近来与几位客人关系不睦。"],"timeline":[{"t":"20:00","text":"假面舞会开始，宾客均戴面具入场。"},{"t":"22:00","text":"舞蹈结束，宾客移至餐厅用夜宵。"},{"t":"22:50","text":"管家、画家与男爵在前厅戴上金面具、披上黑斗篷。"},{"t":"23:00","text":"三个金面黑披风的人影走进舞厅，23:01 两人退出，一人留下。"},{"t":"23:02","text":"管家关上舞厅大门，守在门外。"},{"t":"23:15","text":"本应是男爵摇铃摘面具的时间，无动静。"},{"t":"23:40","text":"管家开门，发现男爵死亡，面具不见。"},{"t":"23:58","text":"电话线中断，管家此前已致电请你前来。"}],"budget":{"search":12,"ask":22},"locations":[{"id":"hall","name":"镜厅（舞厅）","scene":"hall","desc":"四壁嵌满镜板的大舞厅，水晶吊灯只亮了一半，成百个自己在镜面里重叠。地面是当晚新撒的滑石粉，白得像雪。","clues":[{"id":"c_hall1","title":"厅心的尸体与粉面","text":"地板铺着今晚新撒的滑石粉。粉面上，三人并排的鞋印从大门走到厅心；两串折返到门口，只有一串停在厅心，止于霍恩仰卧的尸体旁。门口到尸体另有几趟来回的皮鞋印叠在其上。尸体脸上没有面具，鼻翼、上唇和下巴一圈皮肤红肿，沾着碎金箔屑，指缝里也是金粉。四周地面再无别的印子，没有凶器，也没有那张金面具。"},{"id":"c_hall2","title":"脚手架下的工具箱","text":"修补镜框的脚手架下，帆布后藏着一只薄木箱：金箔本、貂毛笔、一罐黏稠的油性金胶、一小把细铜铆钉和一支带木柄的小冲子，箱盖内用墨水写着 L.M.。冲子尖上粘着一点新亮的铜屑，旁边散落几片碎金箔。"},{"id":"c_hall3","title":"北墙的镜板暗门","text":"北墙正中的一块镜板边缘有细缝，推开是一扇旋转暗门，门后是窄石阶，向下通到黑暗里。暗门门框与门前的粉面完好，没有任何蹭痕。镜板背面右下角压着铸字“V. & FILS 1896”，其余各块镜板背面都是同样的铸字。"}]},{"id":"atelier","name":"面具工坊","scene":"library","desc":"由旧图书室改成的工坊，书架上摆满空白面具和假发，工作台上一盏绿罩灯，空气里一股胶水和松节油的味道。","clues":[{"id":"c_lib1","title":"退回的“II号”面具","text":"工作台上摆着晚间退回的两张金面具。其中一张内眉的黄铜铭牌刻着“II”，铆钉头比周围的旧钉明显新亮；左太阳穴处有一道细长的修补痕，胶线已泛黄。内衬干净，没有异味。"},{"id":"c_lib2","title":"面具登记簿","text":"登记簿记着：“11月4日14:00 交马洛重镀金 I、II、III 三面；11月5日17:30 收回，签收：莉泽（验号栏空白）。I号：1923年左太阳穴旧裂已补，余二面无修补。22:25 擦拭主人面具内衬。22:50 凭铭牌发出：I 男爵，II 马洛，III 克勒。23:03 收回III，23:12 收回II，I号未归。三面出厂铸号依次为1、2、3，铭牌随铸号钉：I铸1、II铸2、III铸3。”"},{"id":"c_lib3","title":"抽屉底的信与预约卡","text":"工作台抽屉最底下压着一封折了又折的信：“……他说过会娶我，如今却要把整座会馆连同我一起抛下。爸爸，我不敢告诉你……”信纸被泪水晕开，没有署收件人。旁边夹着布劳恩医生诊所11月5日16:30的预约卡，背面写着“妊娠三月”。"}]},{"id":"study","name":"男爵书房","scene":"study","desc":"二楼走廊尽头的书房，红木书桌、保险柜和一面落地镜。壁炉里还有余温，房间里有淡淡的纸灰味。","clues":[{"id":"c_study1","title":"旧卷宗与便条","text":"书桌最底层抽屉里有一份泛黄的卷宗《瓦朗镜厂清算案 1908》，保证人栏签着霍恩的名字。卷宗里夹着一张合影，背面写“Armand 与 Lucien，1906”，照片上的男孩左手食指缠着绷带。最上面压着一张近日便条，男爵笔迹：“L.M. 的左手食指少一节，和照片上那孩子一样。随他去吧，让他把墙画完。”"},{"id":"c_study2","title":"流程单与雪橇单","text":"书桌上摊着男爵手写的流程单：“22:50 发面具；23:00 三人入；23:01 二人退；23:05 北镜门；23:40 M 开门，宣布失踪。”旁边是雪橇预订单：“23:30 北角门外，一辆，勿点灯。”窗边的牛皮旅行箱敞着，箱底衬布有一块方形压痕。书桌抽屉的锁孔周围有新鲜划痕。"},{"id":"c_study3","title":"遗嘱与新草稿","text":"保险柜旁的文件夹里有两份遗嘱。旧的：会馆与庄园归未婚妻伊莲娜·冯·罗森，债务由遗产清偿。11月1日的新草稿：伊莲娜的份额被划去，改为一笔“补偿金”。抵押附页写着：权利人利维，欠款四十万；庄园估价栏手写“约三十万”。"},{"id":"c_study4","title":"壁炉里的纸灰","text":"壁炉里有新烧的纸灰，没烧尽的一角印着军团徽记和“……军需款……阿尔滕”几个字。炉边地毯上掉着一粒军官外套上的铜纽扣，扣眼上还挂着一缕黑线。"}]},{"id":"dining","name":"餐厅","scene":"dining","desc":"长桌上还摆着没收的夜宵，银烛台歪着，花窗下的角落放着几张小圆桌。窗外雪越下越大。","clues":[{"id":"c_din1","title":"花窗下的两只酒杯","text":"花窗下的小圆桌上并排放着两只酒杯，一只杯沿有深红口脂。杯下压着一张折起的字条，男人的圆体字：“先别答应他，什么都别签。我四十分钟后在北角门等您。”字条背面有一个“L”字。"},{"id":"c_din2","title":"皮套里的相机","text":"餐边柜下放着一只皮套，里面是一台折叠相机，已卸下三块玻璃底片，对光可见：摊开的流程单、空旅行箱、保险柜边缘；边角手写时间 22:36、22:38、22:41。皮套上别着《科隆晨报》记者证，名字：玛戈·法伊弗。"},{"id":"c_din3","title":"医生的药箱","text":"药箱里有一只标签写着“霍恩男爵·强心”的洋地黄药瓶，已经空了。旁边的处方簿存根写着“11月3日 布劳恩”，字迹潦草。"},{"id":"c_din4","title":"画家的座位","text":"长桌第三位前的盘子几乎没动，椅背上搭着一条沾着金粉的围裙。侍者补记在座次表边上：“马洛先生 22:20 起席，说去整理披风；伯爵夫人在邻座。”"}]},{"id":"garden","name":"雪中花园","scene":"garden","desc":"积雪没过脚踝的花园，一座玻璃温室在雪里泛着微光，北边墙上有一扇通向小路的角门，风吹得雪粒拍打玻璃。","clues":[{"id":"c_gar1","title":"毒草温室","text":"积雪的玻璃温室里，一排乌头（花穗已枯）的盆栽中有两盆被连根拔去，泥土新翻。工作台上的石臼里留着棕色糊状物，混着黄色油胶和碎金箔；臼边搁着一支貂毛笔，笔毛沾着金粉。温室门口的雪地有一串带防滑钉的鞋印，从花园侧门来回。"},{"id":"c_gar2","title":"北角门的雪橇辙","text":"北角门外的雪地里，雪橇的辙痕和马蹄印停在门边，停了很久，雪被压成两道深槽。门内墙角有一个男人的皮靴印来回踱步，地上落着好几截粗雪茄烟蒂。"},{"id":"c_gar3","title":"药棚里的乌头酊","text":"温室旁木棚里的药柜摆着贴拉丁文标签的小瓶。一瓶“乌头酊（外用）”瓶盖被拧开过，量只剩小半，标签上盖着布劳恩医生的领用章，最近一次日期是十月初。"}]},{"id":"cellar","name":"酒窖","scene":"cellar","desc":"潮冷的石砌酒窖，一排排橡木桶和酒架，窖尾有一道砖拱。煤油灯的光照不透角落。","clues":[{"id":"c_cel1","title":"酒桶后的金面","text":"最里面的空酒桶后塞着一副白手套，裹着一张金面具。面具内衬的鼻梁、上唇和下巴一带，金箔下透出一层褐色胶质，闻得到淡淡的苦涩草腥味。内眉的黄铜铭牌刻着“I”，铆钉头新亮；铭牌边缘翘起处露出铸模号“2”。面具没有任何修补痕。手套内侧绣着 M.K."},{"id":"c_cel2","title":"深色证件夹","text":"同一只空酒桶后还塞着一只深色皮证件夹：里面是一本护照，名字“安东·维克”，照片却是霍恩；一叠法郎钞票用橡皮筋捆着，约有十来万；夹层里有一张写着“23:30 北角门”的车票存根。"},{"id":"c_cel3","title":"窖尾的暗道","text":"窖尾的砖拱后是一条窄暗道，斜斜向上通往舞厅北墙。暗道里积着厚灰，从窖口到出口的灰面没有任何鞋印，出口石阶上的灰尘也完整无痕。"}]}],"suspects":[{"id":"kohler","name":"马蒂亚斯·克勒","role":"会馆管家","age":58,"look":{"skin":"light","hair":"bald","hairColor":"grey","glasses":"none","beard":"mustache","outfit":"suit","acc":"pocketwatch","mood":"worried"},"bio":"在霍恩家当了四十年管家，是今晚三名“金面替身”之一，仪式后负责守在舞厅门外。他亲手打开的门，也是他在断线前请来了你。","demeanor":"一板一眼的老仆口吻，爱说“先生”“照规矩”，被逼急了会攥手套。","topics":[{"id":"t_role","q":"你在会馆多久了？","a":"四十年，先生。十八岁进这座宅子，伺候过老男爵，后来是现在的老爷。宅子改成会馆那年，是我把一间间客房重新挂的牌子。老爷有什么事，向来先吩咐我。"},{"id":"t_ritual","q":"镜厅的仪式是怎么回事？","a":"每年的假面夜，二十三点整，老爷与两名替身都戴金面、披黑斗篷走进镜厅，绕一圈，两名替身退出，老爷一人留下与镜中的自己“对话”。二十三点一刻，他摇铃摘下面具，迎接宾客。面具归莉泽小姐保管。"},{"id":"t_touch","q":"你进去时碰过什么？","lie":true,"a":"我进去只探了他的脉，冰凉，已经没救。别的什么都没碰。他脸上什么也没有，面具我也没见着，大概是他自己不知扔到哪里去了。我对宾客们就是这句话，先生，一个字没改。","truth":"我拿了。面具就掉在他手边，内衬一股苦草味，他嘴唇红肿，我当时脑子里只有一个念头：面具是莉泽重镀后的东西，她会被当成凶手。我把它裹进手套，连同他怀里的证件夹，趁取酒下窖时塞进了空酒桶后。我骗了你，先生。"},{"id":"t_delay","q":"为何守到23:40才开门？","lie":true,"a":"老爷自己嘱咐的，说今年想在镜子前多留一会儿。我是仆人，不敢违命。伯爵夫人二十三点半来催，我也没敢开。要怪就怪我太守规矩。","truth":"老爷定的就是二十三点四十分。他欠了债，打算借仪式失踪：二十三点零五分从北镜暗门走，二十三点半雪橇在北角门，我拖到四十分，再宣布他“消失在镜子里”。我不说，是怕债主闻到风声，封了这座宅子。"},{"id":"t_niece","q":"莉泽和你是什么关系？","lie":true,"needs":["clue:c_lib3"],"a":"远房侄女，先生。我举荐她来工坊做事，因为她手巧。除此之外没有别的。她这些日子不舒服，您别吓着她。","truth":"她是我亲生女儿。她母亲早逝，我让她随母姓，免得人说闲话。她怀了老爷的孩子，我是在她哭着躲进工坊那天才知道的。我拿走面具，就是怕她被当作凶手。她没有害人的心，先生，她连小鸟都不敢捏。"},{"id":"t_mask_seen","q":"那张面具有什么不对？","needs":["clue:c_cel1","ask:kohler.t_touch"],"a":"我拿起来就觉得不对。老爷的I号左太阳穴有道修补痕，我亲眼见莉泽补的，这一张没有。铭牌写着I，边上却露出个“2”。那股苦味我认得，乌头，老庄园的温室里种过。我本该立刻说，可我怕。"},{"id":"t_pouch","q":"那只证件夹是怎么回事？","needs":["clue:c_cel2","ask:kohler.t_touch"],"a":"老爷的旅行箱是我备的，假护照是他的主意。他怀里鼓着，我一时糊涂就拿了，想着债主若来封账，这笔钱至少能先留给小姐，算老爷欠她的一个交代。先生，我不是贼。"},{"id":"t_who","q":"谁有机会动那三张面具？","needs":["ask:kohler.t_mask_seen","clue:c_lib2"],"a":"只有小姐和画家马洛先生。重镀金是他一手包办，十一月四日下午取走，五日傍晚还回。小姐那天不舒服，只签了收条，没有细验。至于谁动了手……我不敢乱说，先生。"}],"confronts":[{"clue":"c_cel1","breaks":"t_touch","a":"手套被放到桌上时，克勒的手指抖了一下。他慢慢坐下去，像一棵被砍倒的老树。“……是我藏的。我以为这样就能护住她。可我骗了您，也骗了老爷。”他盯着自己的手，一句话再说不下去。"},{"clue":"c_study2","breaks":"t_delay","a":"他看着那张流程单，嘴唇颤得厉害。“那是老爷的字……”他低声承认，“我答应过他，到死都不说。可他真的死了。我守着那扇门，守着一个早已不存在的人。”"},{"clue":"c_lib3","breaks":"t_niece","a":"“您翻了她的抽屉！”他先是怒，随即整个人垮下来。“……是，她是我女儿。我这辈子没敢当着人叫她一声。老爷……他答应过会娶她。您要骂就骂我，别吓着她。”"},{"clue":"c_cel2","a":"他的脸色一下灰了。“证件夹……您都找到了。老爷说，若他走不成，这些就是他最后的体面。我没本事保他，只想替他保住这点体面。我不是想独吞，先生，我手抖了一整夜。”"},{"clue":"c_hall1","a":"“嘴唇红肿，一圈金屑……”克勒喃喃道，“我进去时看见了，我一直没敢说。老爷躺在那里，像睡着了，又像被谁按住了脸。我当时只想：这一定是面具的错。”"},{"clue":"c_lib2","a":"他读着登记簿，低声道：“我戴的是三号，退给了小姐。可老爷那张……我不敢想，也不敢问。”他合上眼，“如果这簿子今夜传开，第一个被拷问的会是我女儿。”"}],"fallback":"先生，这东西老仆没见过，也不敢乱猜。"},{"id":"liese","name":"莉泽·哈恩","role":"面具师","age":31,"look":{"skin":"fair","hair":"bun","hairColor":"brown","glasses":"none","beard":"none","outfit":"apron","acc":"necklace","mood":"worried"},"bio":"管家克勒的远房侄女，三年前来会馆做面具。仪式前她负责擦拭并分发三张金面具，今晚几乎没离开过面具工坊与前厅。","demeanor":"声音轻，爱咬指节，句子很短，被逼问时会突然哭。","topics":[{"id":"t_role","q":"你在会馆做什么？","a":"做面具，修面具，管面具。宾客的面具、舞会的面具、男爵的金面。我手上有三张最重要的，I、II、III，是霍恩老爷订的，每年仪式用。我不喜欢人多。"},{"id":"t_hand","q":"面具是怎么发的？","a":"二十二点二十五分我擦了老爷那张，认的是它左边太阳穴的修补痕，擦完放上托盘。二十二点五十分前厅灯调暗，我凭铭牌用手摸着发：I 给老爷，II 给马洛先生，III 给克勒先生。我凭牌发，从来没错过。"},{"id":"t_receive","q":"重镀后你验过面具吗？","lie":true,"a":"十一月五日傍晚收回时，我逐面验了号和铭牌，都对，才放上架。这是我的规矩，登记簿上有我的签名。","truth":"我没验。我那天下午去了诊所，回来恶心得站不住，只签了字就把三张放上架。我怕你们说我失职，所以撒谎。"},{"id":"t_baron","q":"你和男爵是什么关系？","lie":true,"a":"雇主，和手艺人。他欣赏我的活儿，如此而已。他有他的宾客，我有我的工坊，我们并不熟。","truth":"我怀了他的孩子，三个月。他答应过会娶我，可上月我偷看到他在准备远走，把整座会馆连同我一起丢下。我恨过他，可我没有杀他，求您相信我。"},{"id":"t_dad","q":"克勒先生是你的什么人？","needs":["clue:c_lib3"],"a":"他……是我父亲。我随母姓，他叫我侄女，是怕人闲话。他知道我怀孕后一个晚上没睡。今晚他守着舞厅门，我守着工坊，我们谁也没说话。"},{"id":"t_painter","q":"马洛先生碰过面具吗？","needs":["ask:liese.t_receive","clue:c_hall2"],"a":"十一月四日下午他来取面具，说要重镀，还向我讨了一小把铜铆钉，说铭牌松了要重新铆。我给了。他的手艺没人比得过，我从没疑心。"},{"id":"t_swap","q":"这张“II号”是怎么回事？","needs":["clue:c_lib1","ask:liese.t_hand"],"a":"这张有修补痕……这是老爷的原面具！可铭牌写着II？我擦的明明是它，认痕不认牌，放上托盘；发的时候凭牌摸……天哪，我把另一张发给了老爷？是铭牌被人换了！"}],"confronts":[{"clue":"c_lib2","breaks":"t_receive","a":"她盯着那一栏空白，眼泪一下涌出来。“我签了字，没验……我好怕，怕你们说我害了老爷。”她抓住衣角，“可是请相信我，我没有在面具上做过手脚。”"},{"clue":"c_lib3","breaks":"t_baron","a":"“那是我的信！”她声音突然尖起来，又立刻低下去。“……是，是我的孩子。老爷说会娶我，可我知道他要走……我恨他，恨过。但我怎么会杀他？我连他今晚也想见最后一面。”"},{"clue":"c_hall2","a":"她盯着铆钉与冲子，缓缓开口：“这是马洛先生的箱子。他是我见过最稳的手。铜屑是新的……您别问我，我不敢往下想。”"},{"clue":"c_cel1","a":"她接过那副手套，指尖发白。“这是爸爸的手套……面具里面有毒？我每天擦它们，我吸进过吗？”她后退一步，几乎站不稳，“是我的错，我没验。”"},{"clue":"c_lib1","a":"“老爷的原面具……”她摸着那道修补痕，眼眶红了，“我认得每一道胶线。可铭牌写着II……谁会换铭牌？只有动过手的人才知道哪一张是哪一张。”"}],"fallback":"我不知道这是什么……我不想看，也不想被人问。"},{"id":"lucien","name":"吕西安·马洛","role":"驻馆画家","age":34,"look":{"skin":"tan","hair":"messy","hairColor":"brown","glasses":"none","beard":"stubble","outfit":"vest","acc":"scarf","mood":"smile"},"bio":"法国画家，三年前受聘为镜厅描金修镜，左手食指少了一节。今晚是三名“金面替身”之一，仪式后在餐厅与前厅陪着宾客。","demeanor":"温和幽默、爱用比喻，被追问时语速反而更慢，爱反问“您真这么想？”。","topics":[{"id":"t_role","q":"你在会馆做什么？","a":"描金、修镜框、补壁画。镜厅四壁的金线是我一笔笔描的。我在这里三年，白天跟着梯子，晚上跟着颜料。画画的人总是跟光待在一起，不太爱说话。"},{"id":"t_alias","q":"你是哪里人？","lie":true,"a":"里昂人，孤儿，叔叔把我养大。三年前看到招聘告示才来的，之前没听过霍恩的名字。我的手指是小时候被炉子烫的，您问的人太多了，我已经懒得解释。","truth":"我姓瓦朗，我父亲阿芒是瓦朗镜厂的主人。一九〇八年霍恩做保，转手吞了镜厂，我父亲在厂里的炉前上了吊。这座镜厅四壁的镜子，就是我家最后一批货。我化名进来，只为在这面镜子前站着。"},{"id":"t_baron","q":"你怎么看男爵？","a":"一个很会享受自己倒影的人。慷慨，也专横。他每年让我当“替身”，说我的下巴像他年轻时。我对他无话可说，他欠我的，也许只是一杯酒。"},{"id":"t_mask","q":"面具的事你知道多少？","lie":true,"a":"我只负责重镀三张金面，十一月五日傍晚按原样还给莉泽，没碰过别处。仪式我戴的是II号，退回时她也在。您想从我这里找什么，只管问。","truth":"我换了铭牌。毒涂在No.2的内衬，我用冲子把I和II的铭牌对调，让莉泽凭牌把它发给霍恩。我戴的那张才是他的原面具，干干净净。"},{"id":"t_where","q":"22:20到22:50你在哪？","lie":true,"a":"一直陪伯爵夫人坐在餐厅，直到我去前厅戴面具。我那条围裙还搭在椅背上，您可以去看，不少人都看见我坐着。","truth":"我借口整理披风，去了花园温室。石臼里还有半臼糊，我得洗干净，雪下得大，我一身是雪回来。"},{"id":"t_target","q":"这毒是冲谁来的？","lie":true,"needs":["clue:c_cel1"],"a":"前厅灯暗，三个人摸着面具往脸上扣，谁拿错都可能。毒也许是冲着我或克勒来的，男爵只是倒霉，拿了不该拿的那张。","truth":"没有人拿错。是我换的牌，毒从一开始就是冲着他的。这不是误杀，是我父亲死去那年起，我就该做的事。"},{"id":"t_plate","q":"铭牌为什么是新铆的？","needs":["clue:c_lib1","ask:lucien.t_mask"],"a":"重镀时铭牌松了，我顺手重新铆了。莉泽还借给我铜铆钉。正常工序，换了谁来做都一样。"},{"id":"t_gild","q":"金胶和铜屑是怎么回事？","lie":true,"needs":["ask:lucien.t_plate","clue:c_hall2"],"a":"金胶是重镀用的，铜屑是冲子磨铆钉磨出来的。我吃这碗饭的，箱子丢在脚手架后，谁路过都能看。","truth":"那冲子是我拆换铭牌用的：拆旧钉、换位、再铆。要不是雪夜里匆忙，我会把铜屑和金箔都收干净，不给你们留下。"},{"id":"t_root","q":"温室里的乌头呢？","lie":true,"needs":["ask:lucien.t_gild","clue:c_gar1"],"a":"温室？我从没进去过。乌头有毒，谁会去碰它？石臼大概是园丁的，貂毛笔也是别人落下的，我画画只用猪鬃，您可以查我的画笔。","truth":"我挖了两盆根，磨成糊，混进金胶，涂满No.2的内衬，盖上金箔。三分钟就能渗进皮肤。我的指尖发麻，医生说是神经冻着了。"}],"confronts":[{"clue":"c_lib1","breaks":"t_mask","crack":true,"a":"他看着那道修补痕，指尖在桌沿停了一下。“……这是霍恩的原面具，对吗？”他慢慢笑了，“您果然看得很细。是，我戴的才是他的。人总得有一件东西，是只有自己知道的。”"},{"clue":"c_din4","breaks":"t_where","a":"“围裙还在椅背上……我忘了。”他笑得很淡，“我说在餐厅，其实是想回避温室。您瞧，说谎的人总以为自己会收拾得干净。”"},{"clue":"c_cel1","breaks":"t_target","a":"他听着“铭牌I，铸号2”，沉默了很久。“没有人拿错。”最后他说，“那张面具从一开始就是为他准备的。您想听我说得更清楚吗？”声音很轻，却没有一丝犹豫。"},{"clue":"c_study1","breaks":"t_alias","a":"“他居然留着这张照片。”他死死盯着那个缠绷带的男孩，良久才低声说：“我父亲是在炉前上的吊，我十五岁。这些镜子都是他一块块烧出来的，现在全在这里，映着这个人的脸。”"},{"clue":"c_hall2","breaks":"t_gild","a":"他看着箱子，神情反而放松了。“我什么都不想瞒了。冲子是我的，铆钉是我的，铜屑也是我的。我把铭牌对换，就像把一个人的名字换在另一个人脸上。”"},{"clue":"c_gar1","breaks":"t_root","a":"“温室里的石臼。”他叹了口气，“我本想洗掉的，可雪下得太大，我怕被人看见。乌头开在庭院里二十年，没有人认得它是毒。”"},{"clue":"c_lib2","a":"他读着登记簿，指尖微动。“莉泽的字很干净。她什么都不知道，不要为难她。”语气温柔得近乎恳求。"}],"fallback":"您问的东西我听不太懂，画家只会看颜色，不会看这些。"},{"id":"konrad","name":"康拉德·冯·阿尔滕","role":"退役上校","age":55,"look":{"skin":"tan","hair":"short","hairColor":"grey","glasses":"none","beard":"mustache","outfit":"uniform","acc":"badge","mood":"stern"},"bio":"霍恩的老战友，退役上校，今晚第一个到场的客人。他说仪式时自己一直站在舞厅门口的宾客队伍里，没有离开。","demeanor":"短句、命令式，爱说“废话少说”“照事实讲”，被戳到痛处会拍桌。","topics":[{"id":"t_role","q":"你和男爵是什么交情？","a":"二十年战友。一九一六年他在壕沟里背过我，这笔人情我记着。后来他做生意、我退役，各走各的路。每年假面夜我必到，到了就是喝酒、跳一曲、看他得意。"},{"id":"t_where","q":"23:00后你在哪？","lie":true,"a":"站在舞厅门口的宾客队伍里，没离开半步。老爷进去后我就那样站着，一直到克勒开门。废话少说，这么多人看着，您问谁都一样。","truth":"我二十三点零三分离开了。我溜进书房，想烧掉男爵手里握着的几封旧信。炉火太小，我抓了一把纸就烧，纽扣大概是那时勾落的。我没杀他，我只是怕。"},{"id":"t_sabre","q":"你的佩剑呢？","a":"在腰上，您可以看。礼仪佩剑，没开过刃。要杀一个人，我不会用这种玩具。您想找凶器，去看那具尸体的脸，而不是我的腰。"},{"id":"t_painter","q":"你对那个画家怎么看？","a":"手艺没话说，人有点怪。他刚到会馆那天，站在镜厅里翻看镜板背面的铸字，脸白得像纸，我还以为他犯了什么病。后来再没提过。"},{"id":"t_debt","q":"你和男爵有账目吗？","needs":["clue:c_study4"],"a":"有。他拿几封旧信吊了我十年，信里是我挪用军需款的证据。今晚我本想趁乱烧了它们。可男爵一死，信落到律师手里，我岂不更糟？杀他对我没好处。"},{"id":"t_study","q":"你在书房见到什么？","needs":["clue:c_study2","ask:konrad.t_where"],"a":"桌上有张流程单，空皮箱敞着，雪橇单上写着北角门。我当时想：这老狐狸要跑，把我丢下。我骂了他一句，扭头走了。回到厅门口已是二十三点二十分。"}],"confronts":[{"clue":"c_study4","breaks":"t_where","a":"康拉德的脸涨得发紫，拍了一下桌子又僵住。“那粒纽扣……该死。”他咬牙道，“是，我溜去烧信。可我只烧了自己的。要杀他，我不会等到今晚，更不会等他先跑。”"},{"clue":"c_study2","a":"他盯着流程单，喉结滚动。“他要走……他竟然要走。”声音突然低下去，“二十年的战友，到头来只留我一人对着债主。他若还活着，我会亲手揍他一顿。”"},{"clue":"c_hall1","a":"“脸肿了，金屑……”他背过身，“我见过毒气的受害者，没见过这样的。没有刀，没有血，那面具……”他咬住牙，“这不是军人的杀法。”"},{"clue":"c_cel1","a":"他看了一眼那张金面，沉声道：“藏起来了？谁藏的？克勒？”他顿了顿，“若是他，我要听他自己说。”"}],"fallback":"这东西我没见过，废话少说，问点要紧的。"},{"id":"elena","name":"伊莲娜·冯·罗森","role":"女伯爵","age":44,"look":{"skin":"fair","hair":"long","hairColor":"blonde","glasses":"none","beard":"none","outfit":"dress","acc":"earrings","mood":"sly"},"bio":"霍恩的未婚妻，按旧遗嘱是会馆与庄园的继承人。今晚她戴着天鹅面具，仪式时站在舞厅门口，二十三点半第一个催管家开门。","demeanor":"贵族腔，慵懒带刺，爱说“亲爱的”，被拆穿时反而更优雅。","topics":[{"id":"t_role","q":"你和男爵是什么关系？","a":"亲爱的，我是他的未婚妻，春天就要结婚。我们认识了五年，他会说笑话，会给我写诗。我嫁给他不是为钱，我们这种人哪里还缺这个。"},{"id":"t_love","q":"你们感情如何？","lie":true,"a":"恩爱，如同镜子里的两个人。他从来没让我受过委屈，我也从来没想过离开他。你想从我嘴里听到别的，那是白费功夫。","truth":"他那张新遗嘱我是知道的。他要甩开我，只给一笔补偿金，我自己也在准备离开。我们之间早就隔着一面镜子，谁也照不到谁。但我没有杀他。"},{"id":"t_aware","q":"你知道他的债务吗？","lie":true,"a":"债务？他从不跟我谈钱，我只知道他慷慨。庄园是不是抵押了，我真不清楚。亲爱的，谁会在舞会前夜问这种扫兴的事。","truth":"我知道。利维今晚在餐厅告诉我，说男爵打算借仪式一走了之，让我别在任何文件上签字。我们约好二十三点十分在北角门见，可大门里全是宾客，我没能走开。"},{"id":"t_levi","q":"你和利维谈了什么？","needs":["clue:c_din1"],"a":"他提醒我，男爵欠他四十万，庄园只值三十万，我继承的是个空壳。亲爱的，我并不爱钱，但也不愿被拖进别人的坑里。我们商量过要不要替男爵还账，仅此而已。"},{"id":"t_painter","q":"画家今晚的行踪呢？","a":"马洛先生？他坐我邻座，二十二点二十分借口整理披风离席，二十二点五十分才回来，肩头沾着雪，手冷得像冰。我以为他去吸烟。他笑着说，雪夜里很适合想事情。"},{"id":"t_will","q":"遗嘱的事你怎么看？","needs":["clue:c_study3"],"a":"那份新草稿划了我的名字，一点也不意外。庄园资不抵债，我继承的是负资产。他死了，我反倒多了一屋子债主。你们把我当最大受益人，岂不是个笑话？"}],"confronts":[{"clue":"c_din1","breaks":"t_aware","a":"她先是笑，笑意渐渐淡了。“那是利维的字条，口脂是我的。”她拢了拢手套，“好吧，亲爱的，我知道。我没告诉你们，是因为这听起来很像杀人的动机。”"},{"clue":"c_study3","breaks":"t_love","a":"她接过那页草稿，目光在被划去的名字上停了很久。“……他连这个也不告诉我。”她笑得有点疼，“我们都在互相等着对方先开口，等到他躺在地上。”"},{"clue":"c_hall1","a":"“脸上的金屑……”她眼底闪了一下，“我二十三点半就觉得不对。他是个爱干净的人，仪式不可能拖这么久。可克勒不让开门。”"},{"clue":"c_study2","a":"她读到“宣布失踪”，轻轻吸了口气。“原来如此……他要借镜子玩一出消失。他一向爱这种戏。可惜这回，戏没演完。”"}],"fallback":"亲爱的，这东西我不认得，也不想认得。"},{"id":"braun","name":"西奥多·布劳恩","role":"医生","age":47,"look":{"skin":"light","hair":"sidepart","hairColor":"brown","glasses":"round","beard":"goatee","outfit":"suit","acc":"stethoscope","mood":"tired"},"bio":"山下小镇的开业医生，霍恩家的老朋友，今晚受邀赴宴。二十三点四十一分第一个检查尸体，说死亡发生在二三十分钟之前。","demeanor":"冷静克制，爱用专业词，但被追问私人事务时会躲闪、扶眼镜。","topics":[{"id":"t_role","q":"你与男爵是什么交情？","a":"朋友，也是邻居。我在山下行医十几年，偶尔受邀来会馆赴宴。仅此而已。他聪明、爱面子、很少真正开口求人，这是我对他的全部评价。"},{"id":"t_exam","q":"你怎么看死因？","a":"我二十三点四十一分入内：体温未降透，嘴唇和面部红肿，皮肤有灼烧样麻木，瞳孔散大，死亡约发生在二十到三十分钟之前。像是某种生物碱，经皮肤或黏膜吸收。没有外伤，不是刀枪。"},{"id":"t_treat","q":"你给他开过药吗？","lie":true,"a":"没有。我只是社交上的朋友，从没给他开过任何药，也没为他治过病。他身体硬朗得很，您别往医药上猜。","truth":"我给他开过洋地黄，他有心脏病，一直瞒着别人。我怕泄露病情才撒谎。药瓶空了，是他自己服完的，与命案无关。"},{"id":"t_tincture","q":"药棚里的乌头酊呢？","lie":true,"needs":["clue:c_gar3"],"a":"我今年夏天以后就没碰过温室药棚，那瓶酊剂跟我一点关系也没有。您不必拿这个吓我，我是医生，不是投毒的人。","truth":"我取过，是给他痛风外敷的，酊剂稀释后才能用，量也有限。瓶里少的那些，十月初就用掉了。我没想到有人会拿乌头做别的用途。"},{"id":"t_cause","q":"你怀疑是什么毒？","needs":["clue:c_hall1"],"a":"唇周红肿、金屑、全身麻木，像乌头碱。这种毒经黏膜和皮肤都能吸收，数分钟起效，二三十分钟致命。可那得先有一件沾毒的东西贴在脸上。凶器，也许就是那张失踪的面具。"},{"id":"t_liese","q":"你见过面具师莉泽吗？","needs":["clue:c_lib3"],"a":"十一月五日十六点三十分她来过，孕三月，需要休息。医生的保密义务不容打破，可看来我也不得不说了。她没有杀人的嫌疑。我可以为她作证。"},{"id":"t_hand","q":"有人手上有异常吗？","needs":["ask:braun.t_exam","clue:c_gar1"],"a":"你一提温室，我想起马洛。十一月五日中午，他来问我手指发麻是怎么回事，说是画画冻着了，我给他开了锌软膏，没多问。现在想来，指尖麻木，也是乌头碱的症状之一。"}],"confronts":[{"clue":"c_din3","breaks":"t_treat","a":"他扶了扶眼镜，目光在那只空瓶上停留。“那是我的处方。”他苦笑，“霍恩要我保密，他最怕被人知道自己的心脏不好。”"},{"clue":"c_gar3","breaks":"t_tincture","a":"“我的章。”他淡淡地说，“痛风的老毛病，酊剂是外敷的。我撒了谎，是因为这瓶东西在命案里看起来太像凶器了。”"},{"clue":"c_hall1","a":"“金屑……”他轻声道，“如果有东西贴着面部，毒会从毛孔、黏膜进去。我当时就想到面具，可我没有证据。”"},{"clue":"c_cel1","a":"他戴上手套，用镊子拨开内衬，嗅了一下。“乌头碱，没错。涂得很均匀，外面还盖了金箔。这是一个熟悉金箔与胶的人干的。”"}],"fallback":"这不是我的专业范围，抱歉。"},{"id":"margot","name":"玛戈·法伊弗","role":"记者","age":29,"look":{"skin":"light","hair":"bob","hairColor":"auburn","glasses":"none","beard":"none","outfit":"jacket","acc":"flower","mood":"smirk"},"bio":"自称是伯爵夫人带来的社交专栏记者，今晚一直在宾客中穿梭。二十三点半之后，她是第一个跟着人群挤到舞厅门口的人。","demeanor":"快嘴、俏皮、爱抢话头，底下藏着紧张，爱说“您别想套我”。","topics":[{"id":"t_role","q":"你来会馆做什么？","lie":true,"a":"社交专栏呀。伯爵夫人带我来写假面夜，谁戴什么面具、谁和谁跳舞，读者最爱。您别想从我这儿套出什么大新闻，我就是个写八卦的。","truth":"我是《科隆晨报》的调查记者，来查霍恩的假账和那四十万抵押。伯爵夫人是我的掩护，她不知道我的真实身份。"},{"id":"t_study","q":"22:30你在哪？","lie":true,"a":"在餐厅，一直在餐厅。我对着蛋糕和香槟写稿，侍者可以作证，您别想从我这里套出什么，我连书房在哪儿都不知道。","truth":"我撬了书房抽屉。22:36到22:41拍了流程单、空皮箱、保险柜。我那时就知道男爵打算失踪。我没说，是想要独家。"},{"id":"t_case","q":"你拍到什么？","needs":["clue:c_din2"],"a":"流程单，23:40“宣布失踪”。空皮箱，雪橇单。我猜他要借仪式跑路。所以二十三点半伯爵夫人催门，我一点也不着急。谁想到会在厅心找到一具尸体。"},{"id":"t_bell","q":"23:15有听到铃声吗？","a":"没有。仪式的铃是男爵亲手摇的，二十三点一刻整，每年准时。今年没响，我就觉得不对。伯爵夫人二十三点半去敲门，克勒死活不肯开。"},{"id":"t_butler","q":"管家后来去了哪？","needs":["clue:c_cel1"],"a":"二十三点五十分，克勒说去取酒，脸灰得像纸，披风下鼓鼓的，像藏了东西。他往酒窖楼梯去，我当时以为他是被吓傻了，现在想来……他是去藏东西。"},{"id":"t_gate","q":"外面有什么动静？","needs":["clue:c_gar2"],"a":"二十三点一刻前后我在走廊窗口看到雪地里有人影，在北角门来回走，裹着深色大衣。我以为是守夜的雪橇夫，现在想来，那人在等什么人。"}],"confronts":[{"clue":"c_din2","breaks":"t_role","a":"她先笑了一声，像被抓到偷糖的孩子。“好吧，被您翻了皮套。”笑声很快淡下去，“是，我是记者。可我不是凶手，我只是想拿一份独家。”"},{"clue":"c_study2","breaks":"t_study","a":"“那抽屉我撬的。”她干脆承认，指尖敲着桌面，“您想说我撒谎，对。我偷拍，不犯杀人罪，顶多犯点新闻道德。”"},{"clue":"c_hall1","a":"“只有一串鞋印。”她盯着描述，“我从来没见过这样的案子——凶手没进去，也没出来。要么是鬼，要么是这具尸体自己造了一个凶手。”"},{"clue":"c_cel2","a":"“证件夹……”她眼睛发亮，随即皱眉，“克勒藏的？这是个好新闻，也是个坏兆头。他到底在护着谁？”"}],"fallback":"这玩意儿我没拍过，您别想套我。"},{"id":"levi","name":"所罗门·利维","role":"债权人","age":52,"look":{"skin":"light","hair":"slick","hairColor":"black","glasses":"rect","beard":"mustache","outfit":"coat","acc":"pocketwatch","mood":"sly"},"bio":"山下银行的老板，持有霍恩庄园的抵押，欠款四十万。他自称整晚留在大厅和餐厅，仪式后一直在宾客中等待男爵现身。","demeanor":"客气、算计、爱打比方，句句像在谈生意，被戳穿时反而更礼貌。","topics":[{"id":"t_role","q":"你和男爵的账怎么算？","a":"我借给他四十万，抵押庄园。我不是他的敌人，是他的债主，这两个身份有时重叠，有时不重叠。我今晚来，是想听他怎么还。"},{"id":"t_where","q":"23:00后你在哪？","lie":true,"a":"一直在大厅和餐厅，伯爵夫人可以作证。我不是那种在雪夜里乱跑的人，我的皮靴也不配。","truth":"二十三点十分到二十三点四十五分，我在北角门外。雪橇夫告诉我，男爵订了二十三点半的车。我想堵他，可什么人也没等到。"},{"id":"t_know","q":"你知道他要逃吗？","lie":true,"a":"不知道。我只是来赴宴的，顺便谈谈利息。他要逃，我怎会不拦着？一个债主要是知道，早就把庄园的钥匙收走了。","truth":"我知道。我买通了雪橇夫，他把预订的事全告诉了我。我告诉了伯爵夫人，让她别签任何字。"},{"id":"t_note","q":"那张字条是你写的吗？","needs":["clue:c_din1"],"a":"是我写给她的，意思很简单：别答应他的任何条件，我在北角门等她商量对策。生意人之间的暗语，被你们读成了阴谋。"},{"id":"t_loan","q":"他死了你亏多少？","needs":["clue:c_study3"],"a":"庄园估价三十万，欠我四十万。他活着我还有机会追，他死了庄园被分割，十万的洞就是我的。杀他对我没好处，杀一个有现金流的人才是蠢事。"},{"id":"t_sleigh","q":"雪橇夫怎么说？","needs":["clue:c_gar2","ask:levi.t_where"],"a":"他说男爵订了车，不点灯，二十三点半停在北角门。我守到二十三点四十五分，门里没人出来，我就回来了。门里没有任何动静，像是男爵被什么吞了。"}],"confronts":[{"clue":"c_gar2","breaks":"t_where","a":"利维笑得很客气：“雪茄烟蒂，我的牌子。”他摘下手套，“好吧，我在北角门。可我只是等一个骗子，不是等一个死人。”"},{"clue":"c_study2","breaks":"t_know","a":"他读着雪橇单，笑意慢慢退去。“原来他真的订了。我说了谎，因为这看起来很像预谋。我买通雪橇夫，只是想追回我的钱，而不是他的命。”"},{"clue":"c_din1","a":"他认出那张字条，微微一笑：“我的字，她的口脂。商人和贵妇之间的小秘密，您大可以公开，但请别当成杀人证据。”"},{"clue":"c_study3","a":"他把遗嘱附页放回桌上：“三十万对四十万，我早知道。我最怕的是他活着逃走，我连三十万都拿不到。”"}],"fallback":"这东西与我的账目无关，抱歉。"}],"solution":{"culprit":"lucien","method":{"q":"凶手是怎样让霍恩“自己走进死亡”的？","options":["趁前厅熄灯时，用毒针刺入霍恩的颈部，再从暗道离开。","重镀金面具时把乌头毒胶涂进一张面具的内衬，并对调两张面具的铭牌，让按牌号发放的毒面具戴到霍恩脸上。","在仪式前往霍恩的酒杯里下毒，趁他进镜厅后从暗道潜入补刀。","躲在北墙暗门后，在霍恩独留时勒死他并拿走面具。"],"correct":1},"motive":{"q":"凶手为什么杀人？","options":["想夺取霍恩的遗产和庄园。","为当年被霍恩吞并的瓦朗镜厂和上吊的父亲复仇。","霍恩发现他伪造名画，要把他送进监狱。","霍恩诱骗了他的恋人，他怀恨在心。"],"correct":1},"keyClues":["c_hall1","c_lib1","c_lib2","c_cel1","c_gar1","c_study1"],"truth":["凶手是画家吕西安·马洛，本名吕西安·瓦朗。他没有走进镜厅，也没有留下脚印——毒是霍恩自己戴进去的。","镜厅四壁的镜子来自一九〇八年被霍恩吞并的瓦朗镜厂，厂主阿芒·瓦朗在炉前上吊。他的儿子吕西安化名进馆，三年里一笔笔描金，等的就是这一晚。","十一月四日下午，面具师莉泽把I、II、III三张金面交他重镀。他在温室里挖出乌头根，磨成糊混进金胶，涂在No.2的内衬，覆上金箔；再用冲子和铜铆钉把No.2与男爵原面具No.1的铭牌对调。莉泽因怀孕去了诊所，回来只签收未验号。","十一月五日二十二点二十分，他借口整理披风去温室洗石臼，雪落满肩。二十二点五十分，莉泽凭铭牌发面具：I给霍恩，II给吕西安，III给克勒。霍恩戴上的是毒面具，吕西安戴的才是他自己的原面具。毒很快从脸上渗入，霍恩走到厅心便倒下，约在二十三点一刻前后。","这晚霍恩本来要借仪式失踪：二十三点零五分走北镜暗门，二十三点半雪橇在北角门，管家守到二十三点四十分再宣布“他消失在镜子里”。所以没有人进去，也没有人催促。管家开门后拿走掉在地上的面具和证件夹，藏进酒窖——他怕女儿被当成凶手，这才是委托人没说的事。","红鲱鱼们各有各的秘密：上校去书房烧信，女伯爵与利维暗中商量，医生瞒着心脏病和乌头酊，记者偷拍流程单，莉泽怀着男爵的孩子。它们都有事后可以解释的真相，都与命案无关。","真正的证据是那串被铭牌改写的“身份”：毒面具上铸着No.2却挂着I，退回的“II号”有男爵的修补痕；重镀过面具的人，只有吕西安。"]}},{"id":"twins","title":"双生","tagline":"四十岁生日夜，海边别墅的码头浮起一具蓝裙女尸，零点一到，三亿信托归谁，全看她是谁。","difficulty":5,"cover":"cover","tone":"purple","brief":"林家双胞胎姐妹四十岁生日，海滨别墅“听潮居”里宾客云集。二十三点前后，有人在码头发现一名蓝裙女子漂在水里，被捞起时已无呼吸。随后，另一名红裙女子冲到岸边，声嘶力竭地说：“死的是我姐姐知夏，我是知秋！”可她的丈夫、家里的医生都说，她是受了惊吓的知夏，认错了自己。\n家族律师梁叙把你请来：午夜零点，祖父留下的海岸信托将按遗嘱交给“长女知夏”，到时必然有人要争。台风封了盘山路，警方最快凌晨一点半才到。你抵达时是二十三点五十分，客厅里八个人各怀心事，身后是黑沉沉的海。你只有这一夜，要弄清死者到底是谁、死在何时何处，以及谁让她死。","victim":{"name":"蓝裙女子（身份存疑）","desc":"四十岁左右的女子，身穿蓝色晚礼服，戴珍珠项链，在别墅码头被发现浮于水中，捞起时已无呼吸。她与幸存的红裙女子面容几乎一模一样，两人都自称或被称作姐妹中的一个。","look":{"skin":"fair","hair":"long","hairColor":"black","glasses":"none","beard":"none","outfit":"dress","acc":"necklace","mood":"sad"}},"publicFacts":["林知夏、林知秋是同卵双胞胎，今天满四十岁；姐妹俩有个家族惯例：生日当天互换装束，让宾客“猜谁是谁”，今年她们分别穿红、蓝两色礼服。","祖父遗嘱：海岸信托在两人四十岁生日当晚零点起，由长女知夏全权继承；若知夏在此之前去世，信托并入林氏基金会，由继母柳月华担任执行人。","二十二点五十八分闺蜜苏念称在码头发现落水者；私人医生宋怀仁二十三点零五分赶到，初步判断为溺水，死亡时间约在二十二点五十分至二十三点十分。","二十三点零八分，红裙女子赶到岸边，坚称自己是妹妹知秋、死者是姐姐知夏；其丈夫谢承泽与宋医生都认为她是惊吓过度的知夏。","二十年前的同一晚，姐妹二十岁生日宴上，管家周妈的儿子周辉在这个码头溺亡，当时定性为意外。","台风封山，警方预计凌晨一点半到达；别墅所有人都还在场，没有人离开。"],"timeline":[{"t":"19:30","text":"生日晚宴在宴会厅开始，红、蓝两名姐妹同时亮相。"},{"t":"21:30","text":"全体宾客在宴会厅举杯祝酒，宋医生在场，约二十一点四十分离席。"},{"t":"22:58","text":"苏念在码头发现水中有人，高声呼救。"},{"t":"23:05","text":"宋医生赶到码头，判断死者已无生命体征，初步认定溺水。"},{"t":"23:08","text":"红裙女子赶到，称死者是姐姐知夏，自己是知秋。"},{"t":"23:50","text":"律师梁叙请来的侦探（你）到达别墅。"},{"t":"24:00","text":"祖父信托将按遗嘱生效，权利人是“长女知夏”。"}],"budget":{"search":12,"ask":24},"locations":[{"id":"hall","name":"门厅与衣帽间","scene":"hall","desc":"别墅一进门的大厅，左手是衣帽间，右手墙上挂着一块钥匙板。雨水顺着玻璃门流成一道道水线，宾客的外套还湿着。","clues":[{"id":"c_hall1","title":"酒窖钥匙登记","text":"钥匙板旁挂着一本借用登记簿。“酒窖”一栏写着：“20:45 取，宋”，“归还”一栏空白；钥匙板上标着“酒窖”的那只挂钩是空的。上一行是三天前周妈取钥匙取酒的记录，当天就签了归还。"},{"id":"c_hall2","title":"宋医生的出诊包","text":"衣帽间长椅上放着宋怀仁的黑色出诊包，包里有一张药品清点单：咪达唑仑注射液“上次清点 6 支”，现在包里只剩 4 支，没有空安瓿。清点单下方是宋医生三天前的签名，以及几盒标着“林知秋”的助眠药。"},{"id":"c_hall3","title":"访客登记簿","text":"访客登记簿上，程野 19:50 到，“被访人”一栏写着“林知夏”，“事由”栏写“约好的资料”。簿子上另有一行：苏念，18:30 到，被访人“知秋”。两人的签名都是当场手写的。"}]},{"id":"dining","name":"宴会厅","scene":"dining","desc":"摆满残席的长桌，吃了一半的三层蛋糕立在中央，蜡烛已经熄灭。天花板角落架着一台为生日直播准备的摄像机，旁边是甜品台。","clues":[{"id":"c_dining1","title":"宴会厅录像回放","text":"直播摄像机的存储卡回放（时间戳完整，20:10–22:10）：红裙女子 20:40 起一直在厅内应酬，切蛋糕、签留言簿、与人碰杯都用右手，左手始终托着酒杯底。21:25 至 22:05，苏念一人在甜品台摆盘、补酒，其间没有离开画面；宋怀仁 21:40 离厅后，画面里再没有他。"},{"id":"c_dining2","title":"留言簿","text":"留言簿摊开着，红裙女子 21:50 签的“知夏”两字，笔画干净，向右倾斜。往前翻到去年，同一栏里“知夏”的签名向左倾，笔画末端总被手掌抹出一小片灰影。同一页的下一行是程野的留言，墨迹最新。"},{"id":"c_dining3","title":"备餐台账","text":"备餐台账上，周妈用铅笔记着：“20:30 主菜完；21:00 甜品；22:00 夜宵（苏小姐端出）；22:15 起收厨房。”台账旁放着一副厨房手套，还是湿的，水槽里堆着没洗完的碗碟。"}]},{"id":"cellar","name":"酒窖","scene":"cellar","desc":"别墅地下的酒窖，石墙阴冷潮湿，一排排橡木酒架直抵拱顶，角落有一扇通往花园的外侧小门。品酒桌上的灯没关。","clues":[{"id":"c_cellar1","title":"品酒桌上的两只杯","text":"品酒桌上有两只高脚杯。一只杯口留着深红色唇印，杯底留着一层无色微黏的残液，凑近有淡淡的甜苦味，和红酒味不同；另一只杯子倒扣在桌上，杯壁被擦得发亮。桌边一瓶 1998 年的红酒只倒出了一小半。"},{"id":"c_cellar2","title":"外侧小门","text":"通往花园的外侧小门，插销是被人从里面拔开的，门没有关严，门外台阶上有两串被雨冲淡的鞋印。门内地面上，从品酒桌一直到门口，有两道平行的擦痕，地面散着灰白色的石灰粉。"},{"id":"c_cellar3","title":"酒架后的暗格","text":"最里侧酒架后有一个小木暗格，锁扣被撬开，里面空着。积满灰尘的底板上留着一块方形印痕，像是长期放着一个铁盒，印痕边缘有新近蹭过的痕迹，一粒药丸大小的白色碎片卡在板缝里。"}]},{"id":"garden","name":"花园与码头","scene":"garden","desc":"别墅后的海边花园，石板路通向木码头，路边有一座凉亭，远处悬崖上有个观景台。风雨把花枝打得七零八落，码头上还留着担架的痕迹。","clues":[{"id":"c_garden1","title":"蓝裙遗体","text":"码头边的遗体上盖着白布：蓝色晚礼服，珍珠项链。高跟鞋鞋底沾着灰白色石灰粉和暗红酒渍，鞋跟有两道细长的拖擦痕。左手小指外侧缘有一道蓝黑色的墨迹；右下腹有一道约四厘米的陈旧手术疤。指甲缝里嵌着一点暗红色。"},{"id":"c_garden2","title":"遗体腕上的手表","text":"死者腕上的智能手表导出记录：心率曲线 21:16 起快速下降，21:17 变成直线，此后一直是零；22:52 手表显示“水锁模式已开启”。表带内侧磨得发亮，表盘是女款，戴在右腕。"},{"id":"c_garden3","title":"凉亭","text":"花园凉亭的长椅和石桌积着一层薄灰，只有几滴新鲜雨水，桌上没有杯子，烟灰缸是干净的。通向凉亭的石板路上没有任何脚印被踩乱的痕迹。"},{"id":"c_garden4","title":"观景台上的相机","text":"悬崖观景台的栏杆上用三脚架架着一台相机，镜头对着码头，机身防雨罩湿透。内存卡里最后几张是长曝光：22:52 码头上有两个人影弯腰放下一个长条形的东西，其中一人披着浅色披肩，另一人身形高大、穿着深色外套。"}]},{"id":"guest","name":"客房","scene":"guestroom","desc":"二楼走廊尽头的客房，是姐妹俩今晚换装用的房间。梳妆台前一片凌乱，床上扔着几条披肩，窗外雨声很大。","clues":[{"id":"c_guest1","title":"镜框便签","text":"梳妆镜的镜框里夹着一张便签，字迹向左倾，每行末尾都被手掌抹出一小片灰影：“19:25——换好了。我八点五十要去酒窖，拿到原件就回。万一我晚了，替我撑到蛋糕，别问为什么。”"},{"id":"c_guest2","title":"浅黄披肩","text":"床上一条浅黄色披肩，下摆吸饱了水，沾着碎木屑和一小片海藻，披肩上有几处暗红色的污渍，像红酒。披肩一角绣着一个“念”字。"},{"id":"c_guest3","title":"床头的老花镜","text":"床头柜上有一副金丝老花镜，镜腿内侧刻着“YH”，旁边是知夏随身的小提包，拉链被拉开过，里面的东西被翻得乱七八糟，只剩下一个空的文件袋。"}]},{"id":"study","name":"父亲的书房","scene":"study","desc":"一楼尽头林国梁生前的书房，书架上摆着航海模型和旧相框。保险箱的门敞开着，书桌台灯亮着，抽屉被人拉开过。","clues":[{"id":"c_study1","title":"牛皮纸袋","text":"书桌上摊着一个牛皮纸袋，里面三份复印件：①急救中心调度记录，二十年前同夜 23:05 呼入，备注“患者有微弱呼吸”，23:12 备注“林宅家庭医生在场，取消派车”；②死亡证明副本，死亡时间 23:40，医师签名“宋怀仁”；③一张二百万元的收据，收款人宋怀仁，日期在次日。"},{"id":"c_study2","title":"股权转让书","text":"抽屉里压着一叠《股权转让协议》，转让方签名栏写着“林知夏”，笔迹向右倾斜、字迹工整。叠在下面的便利贴上是谢承泽的字：“今晚前必须搞定，利息逾期。”手机便签里存着一个放贷人的号码。"},{"id":"c_study3","title":"律师的备忘录","text":"书桌一角放着梁叙的黑皮备忘本，翻开的一页记着：“9月12日 柳问信托条款，已告知；9月15日 谢问条款，已告知；知夏要求：信托文书原件，零点前交她本人。”"}]}],"suspects":[{"id":"qiu","name":"红裙女子","role":"双胞胎之一","age":40,"look":{"skin":"fair","hair":"long","hairColor":"black","glasses":"none","beard":"none","outfit":"dress","acc":"earrings","mood":"sad"},"bio":"同卵双胞胎之一，今晚穿着红色礼服，宾客一整晚都叫她知夏。赶到码头后一口咬定自己是妹妹知秋，死者是姐姐。","demeanor":"声音发颤，常说到一半停住，眼眶发红，却努力把话说清楚。","topics":[{"id":"t_who","q":"你到底是谁？","a":"我是林知秋。红裙是我姐姐的，蓝裙才是我的，今年我们换了装。你们不信我，可你们想想：我若是知夏，零点一过整个信托都是我的，我为什么偏要说自己是知秋？"},{"id":"t_swap","q":"为什么要换装？","a":"家里的惯例，生日那天互换装束，让客人猜。今年姐姐临时托我替她撑场子，我就应了。她说她有点事，要早点溜。我只知道这些。"},{"id":"t_note","q":"晚上见过姐姐吗？","lie":true,"a":"十九点半换完装，我就再没见过她了。我还以为她躲去露台透气，想着她总有自己的事，晚点自然会回来，哪知道会出这种事……","truth":"我撒谎了。换装时她在镜框里夹了张便签，说八点五十要去酒窖，让我撑到蛋糕，别问为什么。我一直照做，却没敢告诉任何人，怕被追问我为什么要替她遮掩。"},{"id":"t_cellar","q":"你去过酒窖吗？","needs":["ask:qiu.t_note","clue:c_cellar2"],"a":"二十二点三十五分我下去过一趟。酒窖正门锁着，门缝里透着光。我敲了三下，没人应。我想她大概躲着不想见人，就回宴会厅了……要是我当时撞开那扇门。"},{"id":"t_scar","q":"姐姐有什么记号？","needs":["clue:c_garden1"],"a":"我姐姐二十五岁割过阑尾，右下腹有道疤，是宋叔叔开的刀。我没有。她还是个左撇子，写字总会把手边蹭得一片灰。你们看白布下的那具……就知道了。"},{"id":"t_sleep","q":"你在吃安眠药吗？","needs":["clue:c_hall2"],"a":"是，我失眠好些年了，宋医生给我开助眠药，有时一晚吃两次。我知道这听上去像是我自己出了事。可昨晚我还跟姐姐说，等她四十岁生日一过，我就戒。"},{"id":"t_doc","q":"宋医生为什么说你是知夏？","needs":["ask:qiu.t_scar","ask:qiu.t_sleep"],"a":"他一遍遍对大家说，我是受了刺激、认错了自己。可他给姐姐做过手术，他比谁都清楚谁有那道疤。我当时没敢多想，现在……我不敢想。"},{"id":"t_xie","q":"你和姐夫关系如何？","a":"承泽和姐姐两年前就分房了。今晚他整晚都没认出我不是她，一次也没有。他看我的眼神，就像看一个陌生人。他现在一口咬定我是知夏，大概也是怕承认这一点。"}],"confronts":[{"clue":"c_guest1","breaks":"t_note","a":"她读着那几行向左倾的字，嘴唇发抖：“……是姐姐的字。她叫我别问为什么。我真的没问，我什么都没问……”她用手捂住脸，肩膀剧烈地起伏，“我以为她只是想躲个清静。”"},{"clue":"c_dining1","a":"“那是我。”她点点头，“我右手惯用，左手拿不稳东西，只好一直托着杯底。姐姐才是左撇子。我装了一晚上，可除了周妈，没人看出来。”她苦笑了一下，笑意很快就碎了。"},{"clue":"c_garden1","a":"她朝白布下看了一眼，脸色一下子灰了：“那道疤……那个小指上的墨迹……是她。”她的指尖掐进了掌心，“我不是认错自己，我是真的认出了她。”"},{"clue":"c_hall2","a":"“这些药是我的。”她看着清单，“宋医生每次都亲手交给我。……少了两支针剂？这个我不懂。”她抬头看你，眼睛里有一点说不清的恐惧。"},{"clue":"c_garden2","a":"她盯着那条在21:17变成直线的心率曲线，嘴唇动了好几下才说出声：“那时候……宴会厅里我还在替她切蛋糕、收祝福。她那时候就已经不在了。”"},{"clue":"c_study1","a":"她一页页翻着那三份复印件，翻到第二页就停住了：“我爱过周辉，那晚我没能保护他。”她闭了闭眼，“这些东西，姐姐应该也是三天前才看到的。”"}],"fallback":"我不知道……我现在脑子里一片空白，你问别的吧。"},{"id":"xie","name":"谢承泽","role":"知夏之夫","age":42,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"stubble","outfit":"suit","acc":"tie","mood":"stern"},"bio":"知夏的丈夫，经营着一家酒店。婚后长年住在林家，最近与妻子分房。当晚起初陪着红裙女子应酬，后来说自己回房休息。","demeanor":"语气强势，爱打断人，被戳中痛处就拔高嗓门。","topics":[{"id":"t_wife","q":"她真是你太太？","lie":true,"a":"当然。我和知夏做了十几年夫妻，她换身衣服我也认得出。她这是惊吓过度，说胡话。死的是知秋，那个吃药吃糊涂的妹妹，这还用问？","truth":"我认不出来。我们两年前就分房，整晚我没认真看过她一眼。我咬定她是知夏，是不敢承认连妻子都认不出，更怕若死的是知夏，我这个丈夫什么也得不到。"},{"id":"t_where","q":"祝酒后你在哪？","lie":true,"a":"我喝多了，回房睡到听见尖叫声才下楼。房间里就我一个人，没人能作证，可我也没理由撒谎。","truth":"我没在睡觉。我在书房接放贷人的电话，被催得走投无路，翻出了一份股权转让书，想靠它撑几天。我没杀人，只是不敢让人知道我欠了一屁股债。"},{"id":"t_marry","q":"你们夫妻关系如何？","a":"分房两年，我承认。她提过离婚，我没答应。外人看我是靠着岳家吃饭的软饭男，我自己也知道。可这跟她死活没有关系。"},{"id":"t_will","q":"你知道信托条款吗？","a":"知道。梁律师告诉过我，零点之后知夏全权继承。她是我妻子，我当然关心。你不用拿这个盯着我，要是她活着，我的好处比她死了大得多。"},{"id":"t_forge","q":"那份转让书怎么回事？","needs":["clue:c_study2","ask:xie.t_where"],"a":"签名是我模仿的。她的字我临摹过很多遍……可你看，我写成了向右倾，工整漂亮。后来才有人跟我说，她是左撇子，字总是往左歪。我这个丈夫，真是个笑话。"},{"id":"t_doc","q":"宋医生怎么看她？","a":"宋医生是长辈，是看着她们长大的家庭医生。他说她受了刺激，需要镇静，还让我劝她吃药。我当然信他，难道信一个说自己是妹妹的疯女人？"},{"id":"t_old","q":"二十年前周辉的事","a":"那时我还没进林家，只听说过。听说知夏那晚亲眼看着他被抬上来，从此再不碰海。周妈每年那天都在码头点一支蜡烛，一点声音都不出。"},{"id":"t_tall","q":"观景台照片里的高个子","needs":["clue:c_garden4"],"a":"我一米八五，你们是不是在想这个？我手机整晚开着，通话记录随你们查。穿深色外套的又不止我，宋医生进门时也穿着深色风衣——我可没说是他，别记我头上！"}],"confronts":[{"clue":"c_dining1","breaks":"t_wife","a":"他盯着屏幕里那个用右手签字的红裙女子，脸上的肌肉抽了一下：“左撇子……”他喃喃道，“我怎么会没想到。我竟然连她写字用哪只手都不知道。”声音一下子哑了。"},{"clue":"c_study2","breaks":"t_where","a":"他的脸一阵红一阵白，抓着桌沿：“好，好，是我。我在书房，可我没碰过她。”他深吸一口气，“放贷人给我最后期限，今晚零点。我没杀她，我巴不得她好好活着。”"},{"clue":"c_garden1","a":"他看着那道旧疤，嘴唇动了动：“她割过阑尾，我是知道的，可我没见过那道疤。”他把脸别开，“两年没碰过她了，我连她身上哪里有疤都不知道。”"},{"clue":"c_garden4","a":"他凑近看了很久，摇头：“披肩的是个女人，高个子……穿深色外套的男人，我看不清。不是我。我当时在书房，我的手机在通话。”他的声音急促起来。"},{"clue":"c_hall1","a":"“酒窖钥匙？”他皱眉，“我岳父的酒窖我一次也没去过，我不爱喝红酒。宋医生一向爱拿酒窖的酒给寿星祝寿，这你们可以问他。”"}],"fallback":"这个跟案子有什么关系？别浪费我的时间。"},{"id":"liang","name":"梁叙","role":"家族律师","age":55,"look":{"skin":"light","hair":"slick","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"pocketwatch","mood":"tired"},"bio":"林家三十年的家族律师，今晚负责信托交割。晚宴后离席去了偏厅，案发后第一个提出要请侦探。","demeanor":"措辞谨慎，爱说“按规定”，被追问会推眼镜，语速变慢。","topics":[{"id":"t_role","q":"你为什么请我来？","a":"零点信托生效，知夏小姐要求原件当面交她本人。可现在谁是知夏，谁是知秋，没人说得清。身份不明，我没法办交割。我请你，不为谁翻案，只为查清。"},{"id":"t_will","q":"谁知道信托条款？","lie":true,"a":"没有任何人。这是职业操守，条款我从不对外透露一个字。知道的只有我和知夏小姐本人，连她的丈夫都不清楚。","truth":"我说过。九月十二日柳太太问过，九月十五日谢先生也问过，被他们缠得我松了口。我怕丢了林家三十年的饭碗，一直不敢承认。"},{"id":"t_trust","q":"信托怎么分？","a":"知夏零点前去世，信托并入林氏基金会，柳太太任执行人，知秋一分没有。若死的是知秋，知夏零点就是全权继承人。所以这具尸体是谁，值三亿。"},{"id":"t_where","q":"祝酒后你在哪？","a":"偏厅沙发上。喝多了，睡着了，直到尖叫声才醒。没人能证明，这我知道，你不用提醒我，我这个年纪不该喝那么多。"},{"id":"t_xia","q":"知夏最近有何异常？","needs":["clue:c_study3"],"a":"三天前她来找我，说要进父亲的保险箱，拿一个纸袋。出来时脸色很怪。她说要在生日夜前“了结一件旧账”，我问，她只说：“梁叔，你别问。”"},{"id":"t_old","q":"二十年前周辉的事","needs":["ask:liang.t_xia","clue:c_study1"],"a":"那晚我不在，事后林国梁让我拟协议：给周妈二十万，换她不再追究。我问过那孩子怎么没的，他只说“急救不及”。看了这纸袋，我睡不着了。"},{"id":"t_song","q":"宋医生和林家的关系","needs":["clue:c_study1"],"a":"三十年的家庭医生。二十年前林国梁拿二百万给他开了诊所，现在成了他的招牌。他这辈子靠林家吃饭，对知夏和知秋，他像看自己孩子一样。"},{"id":"t_liu","q":"柳太太怎么看信托？","a":"比谁都紧张，这几天问了我三遍，若知夏出事，基金会谁管。她是继母，在这家一直被当外人，我想她只是怕。"}],"confronts":[{"clue":"c_study3","breaks":"t_will","a":"他盯着自己写的那几行字，苦笑着摘下眼镜擦了擦：“你们是先把我的本子翻了一遍。”他把眼镜戴回去，“我是说过。两次，对象就是你说的这两位。老了，就是怕得罪人。”"},{"clue":"c_study1","a":"他拿起那份调度记录，看了很久：“‘取消派车’……”他慢慢念了一遍，“二十年前我只拿到一张死亡证明。原来中间有这么一段。”手指在纸上轻轻敲了两下。"},{"clue":"c_guest3","a":"“这是柳太太的老花镜，镜腿内侧刻着她名字缩写。”他认得很快，“她为什么会在知夏的提包旁边？……这我不方便替她解释。”"},{"clue":"c_hall1","a":"他看着登记簿，皱了皱眉：“宋医生取的酒窖钥匙？他是爱喝酒的人，二十年老习惯，这倒不稀奇。可归还栏怎么空着？”"}],"fallback":"这个涉及保密义务，我只能说到这里。"},{"id":"song","name":"宋怀仁","role":"私人医生","age":58,"look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"none","outfit":"coat","acc":"stethoscope","mood":"smile"},"bio":"林家三十年的私人医生，身形高瘦，二十三点零五分第一个赶到码头，宣布死者已无生命体征。当晚称自己祝酒后在花园凉亭陪苏念聊天。","demeanor":"慈祥稳重，爱叫人“孩子”，被逼到墙角时语速加快，爱引医学名词。","topics":[{"id":"t_role","q":"你和林家的关系？","a":"三十年的家庭医生，两个孩子是我看着长大的。今
