馆，打的是……”他猛然收声，半晌才说，“真是谁都能砸块表。我不信这世上有人能靠一块表吊死另一个人。”"},{"clue":"c_hall1","a":"他只淡淡扫了一眼，“好瓶。老谷擦了二十年，没人敢说它不是好瓶。”指尖却在柜沿上轻轻刮了一下，像怕把什么刮出声来。"},{"clue":"c_cel2","a":"“这些是他的小玩意儿，小满那孩子手不干净，我早提醒过老哥。”钟世昌叹了口气，“少年人，见了钱就迷眼。我不信是他害的老哥，可他也不是干净的。”"}],"fallback":"这个……老朽实在没有见过，帮不上忙，惭愧。"}],"solution":{"culprit":"zhong","method":{"q":"凶手是怎么做到的？","options":["A. 趁打烊后从前堂进去，在茶里下毒，再把尸体摆成摔倒的样子","B. 小满回店时与谷鸿年争吵，推倒他撞上多宝格致死","C. 从后院夹道的小门进后堂，用铜镇尺行凶，再把手表拨到九点十分砸碎，回茶馆造不在场","D. 在后堂放煤气使其中毒，之后伪造入室盗窃"],"correct":2},"motive":{"q":"为什么杀人？","options":["A. 觊觎镇店之宝的真品，要夺走保险柜里的瓶","B. 谷鸿年要自首翻案，凶手是当年仿制赝品的帮手，怕被揭穿一生的名声与刑责","C. 谷鸿年拒绝偿还借款，两人积怨已久","D. 为替死在狱中的沈文清报仇"],"correct":1},"keyClues":["c_study1","c_study2","c_lib1","c_cel1","c_gar1"],"truth":["凶手是邻铺“墨缘斋”的裱画师钟世昌。他杀谷鸿年，是为了封住一桩二十年前的旧案：一九七九年的梅瓶失窃案，从头到尾是谷鸿年与他合演的一出戏。","一九七九年，谷鸿年为救患重病的妻子（药费在十月底才付清，妻子仍于次年春天去世），偷偷把真梅瓶卖给了香港商人林廷芳，又请钟世昌仿造一只赝品，谎报失窃，再栽赃学徒沈文清，把赝品“追回”。沈文清判了十年，一九八三年病死狱中。镇店之宝，从那一年起就是假的。","二十年后，谷鸿年十月十九日确诊晚期肺癌，十月二十一日向鉴定站递交了热释光检测委托；十月二十二日林廷芳的儿子林嘉明登门，当面道破真相，他当晚写好投案信稿，傍晚亲自去墨缘斋约“仿制者”周五晚八点来后堂，劝其同去投案。","周五晚八点，钟世昌借口回铺子取烟，从茶馆溜出，穿过夹道从后院小门进入后堂（门闩是谷鸿年在里头为他拔开的）。谷鸿年不肯回头，钟抄起案头铜镇尺击其后脑致死。他拔出谷的表冠，把指针拨到九点十分，再砸碎表蒙卡住指针，又把收音机拧大，造出“谷鸿年九点以后仍在”的假象，八点四十五回到茶馆继续打牌。","但表是假的：表冠被拉到校时位置，表壳背面却光洁；警医说死亡已超过两个半小时，推算在八点半以前；展柜里的梅瓶口沿光洁，与一九七九年照片里有补痕的原瓶不符；木箱里一九七九年的旧报纸和“墨缘斋·钟”的宣纸条，指向了仿造者；小门上的糨糊指印与深浅不一的脚印，加上贺秀英看见的“背画夹、左腿拖着”的人影，则指明了他的来去。","贺秀英是沈文清的母亲，她在窗口看到了那个背画夹、左腿拖着的身影；其余人的谎，不过是各自藏着一点不想被人知道的事——小满偷卖小件，立群欠赌债，常永昌挪用分红，俞鹤龄愧疚于当年的鉴定，蒋文彬抢先收订金，林嘉明隐瞒了周四的访问。","谷鸿年想用一辈子的悔恨去换一个公道，却死在了他最想救的人手里。那只真瓶在香港，那封没写完的信，替他把话说给了你听。"]}},{"id":"blackout","title":"断电夜","tagline":"台风夜断电四十七分钟，一位教授倒在冷库门外，没人能证明自己在哪。","difficulty":3,"cover":"cover","tone":"green","brief":"台风“云岚”登陆那晚，沪南生命科学研究所的重点实验室全楼断电四十七分钟。来电后，课题组组长周廷远被发现倒在低温样本间的门外，后脑有伤，所里的人都说那四十七分钟里谁也没法作证。所长在电话里压着嗓子对你说：这个实验室的图3 数据刚被人质疑，明天还要签一份几千万的专利许可，不能再出任何岔子。你冒雨赶到时，走廊的应急灯还亮着，粉笔人形圈在冷间门前，门禁日志、温度记录和实验记录本都还没人动过。八个人被留在楼里等你，每个人都说自己什么也没做。","victim":{"name":"周廷远","desc":"沪南生命科学研究所教授、课题组组长，五十六岁。来电后被保安发现倒在三楼低温样本间的门外，后枕部有挫裂伤。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"stern"}},"publicFacts":["台风夜 22:13 至 23:00 全楼停电 47 分钟；UPS 与后院发电机只保 -80℃ 冷冻柜、应急灯和门禁读卡器，楼内照明和步入式 -20℃ 冷间的压缩机都不在其内。","周廷远 23:02 被保安孙国栋发现倒在冷间门外，后脑受钝击；警方暂时无法给出死亡时间。","样本间走廊门只记录刷卡进入，出门靠按钮；冷间另有中央报警，开门超过三分钟才会报警。","图3 的数据近期被人质疑有偏差，所里正在内部核查；周廷远与华澜生物约定次日 10:00 签署一份 7F2 抗体专利的许可协议。","来电后被留在楼里等候询问的有：副教授秦海、博士后魏子墨、博士生许知夏、技术员童伟、行政主管齐美玲、华澜生物的方知行、保安孙国栋，以及周的妻子蒋书琴。","会后秦海与周廷远在会议室门口当众争吵，全组都听到了。"],"timeline":[{"t":"20:05","text":"组会结束，秦海与周廷远在会议室门口争吵。"},{"t":"21:46","text":"门禁记录：周廷远的工牌刷开样本间走廊门。"},{"t":"22:13","text":"台风造成全楼停电，UPS 与后院发电机接管应急回路。"},{"t":"22:36","text":"门禁记录：周廷远的工牌再次刷开样本间走廊门。"},{"t":"22:40","text":"中央系统记录冷间门开启超时报警一次。"},{"t":"23:02","text":"来电后，保安孙国栋在冷间门外发现周廷远，23:15 报警。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"lab","name":"低温样本间走廊","scene":"lab","desc":"三楼尽头的走廊，一侧是 -20℃ 的步入式冷间，另一侧是 -80℃ 冷冻柜间。应急灯还亮着，地上用粉笔圈出了人形，空气里一股冷气味。","clues":[{"id":"c_lab1","title":"冷间温度记录仪","text":"冷间内壁挂着一台电池供电的USB温度记录仪，每分钟一个点，导出曲线平稳在 -20℃ 上下。21:55 起升到 -13.4℃，21:57 回落；22:13 后缓慢爬升，22:37 突升到 -8.9℃，22:41 回落。旁边贴着中央报警系统的说明：开门超过3分钟才报警，当晚只有一条 22:40 的报警记录。"},{"id":"c_lab2","title":"冷间地面","text":"冷间内靠门一侧的地面上有三四个硬币大的暗红色冻结斑点，以及一道约两米长、通向门口的浅擦痕。擦痕和斑点上都覆着一层薄薄的白霜。冷间外的走廊地面干燥，没有血迹。"},{"id":"c_lab3","title":"秦组的冷冻柜","text":"-80℃ 间里秦海课题组的3号冷冻柜门边挂着取用登记卡，最后一行是“22:23 开 / 22:29 关”，签名处是秦海的笔迹。上数第三层一个样本盒的编号标签明显是新贴的，盒内有两个空位，空位里结了霜。"},{"id":"c_lab4","title":"货架转角","text":"走廊靠冷间门的不锈钢货架下层转角处有一小块被酒精擦过的亮痕，旁边垃圾桶里有几团酒精棉纸，棉纸上洇着深浅不一的褐色。货架另一端整整齐齐摆着冻存盒。"}]},{"id":"clinic","name":"临时急救室","scene":"clinic","desc":"一楼的医务室，被警方临时当作询问室和存放随身物品的地方。台风把窗户拍得砰砰响，几名当事人被安排在这里等候。","clues":[{"id":"c_cli1","title":"法医初检记录","text":"初检记录：周廷远后枕部有一处挫裂创，创缘与硬质棱角相符，仰卧位。23:20 测直肠温 30.8℃（室温 27.8℃），背部与衣领内侧有未化尽的薄霜，外套内衬有细小冰碴，两只鞋的鞋跟和裤脚后缘有拖拽磨痕，耳廓与指端发白发硬。表格页脚印着参考换算：常温下直肠温度每小时约降 1℃。死亡时间栏写着：“受低温影响，暂无法估算。”"},{"id":"c_cli2","title":"工牌与手机","text":"周廷远的工牌在西装内袋里，卡面朝内，挂绳一圈圈盘在卡片下面，潮得发软；他的衬衫领口和颈后没有挂绳压痕。手机锁屏上有一条 21:52 的微信预览，发件人“书琴”：“我在一楼接待室等你，台风要来了，早点下来。”使用记录显示最后一次手动解锁在 21:44，之后只有 21:52 来信自动亮屏，停电后手电筒功能从未打开。电量剩 3%，没有未接电话。"},{"id":"c_cli3","title":"蒋书琴的电脑包","text":"周廷远的妻子蒋书琴坐在墙边，膝上抱着一只黑色电脑包，包上挂着研究所资产标签。她在警察要求打开时犹豫了一下，包里是一台关机的笔记本电脑，外壳上有一张“周廷远 课题组”的贴纸。"}]},{"id":"study","name":"周廷远的办公室","scene":"study","desc":"三楼东侧的组长办公室，书架顶到天花板，办公桌上堆满打印稿。台灯还亮着，有人匆匆翻动过抽屉。","clues":[{"id":"c_study1","title":"专利申请底稿","text":"桌上一份打印的《抗体克隆 7F2 检测方法专利申请》底稿，发明人栏只印着“周廷远、秦海”，页边有红笔批注：“魏——不列，致谢处理。图3 偏差追到他名下，周一前递交学术委员会。”末页有周廷远今日日期的签名，夹着华澜生物许可协议草案，落款签约时间是明天 10:00。"},{"id":"c_study2","title":"被裁走的记录页","text":"抽屉的文件夹里夹着六页被整齐裁下的实验记录，页码 57 至 62，裁口一侧留着蓝色装订胶的残边。页眉写着“魏子墨”，日期是前年三、四月，记着 7F2 克隆的筛选与验证，页脚有魏子墨的签名和组长的见证签字。"},{"id":"c_study3","title":"空的电脑底座","text":"办公桌上的笔记本扩展坞连着电源线和显示器，但上面没有电脑。桌角一张便签：“电脑别留所里。周一前——学术委员会。”抽屉被拉开过，里面几个文件夹的次序明显被翻乱。"}]},{"id":"hall","name":"一楼门厅与保安室","scene":"hall","desc":"研究所一楼的门厅，保安室的玻璃窗上贴着值班表。停电时这里只亮着应急灯，来电后保安把所有记录一一整理了出来。","clues":[{"id":"c_hall1","title":"门禁日志导出","text":"门禁系统导出，读卡器由UPS供电，断电期间照常记录。样本间走廊门（只记录进入，出门按钮不记录；开门后约8秒才重新锁闭）：15:10 童伟；17:20 周廷远；21:46 周廷远；22:20 秦海；22:36 周廷远。P2细胞房（进出均刷卡）：魏子墨 21:40 进、21:44 出、22:03 进、22:12 出；许知夏 17:30 出。"},{"id":"c_hall2","title":"保安巡查与访客登记","text":"保安室的巡查本和访客登记：方知行 18:40 入，“离馆”栏空白；蒋书琴 21:20 入，同样空白；夜间留所登记表上有“齐美玲 17:00 入”。巡查本上孙国栋自己写的一行：“22:25 地下车库积水，去抽水”，下一行：“22:45 回岗”。"},{"id":"c_hall3","title":"监控录像的状态","text":"门厅摄像头的录像从 21:20 蒋书琴进门起完整保存，22:13 整段变黑，23:00 才重新出现画面；画面里孙国栋 21:20 到 22:13 始终在保安室和门厅之间，没有离开画面超过两分钟。三楼走廊的摄像头标签上写着“检修中”，当晚没有任何录像文件。后门电子锁断电后改用实体钥匙，保安室和发电机房的钥匙板上各挂着一把。"}]},{"id":"library","name":"实验记录本档案室","scene":"library","desc":"三楼的资料室，满墙铁皮柜存放历年实验记录本，借阅要签名登记。靠窗一张长桌，台灯下压着几本摊开的记录本。","clues":[{"id":"c_lib1","title":"魏子墨的当晚记录","text":"魏子墨的记录本摊在桌上，当晚一页写着：“21:42 加样；孵育 20 min；22:04 读板；22:10 记录完毕。”页首贴着实验方案：“孵育步骤无需守候，可离开房间，25 分钟内返回即可。”页尾他签了名，没写“全程在岗”之类的话。"},{"id":"c_lib2","title":"档案借阅登记","text":"借阅登记表最新几行：“21:50 许知夏 借 W-07 魏记录本、Q-12 秦记录本；22:12 归还”。长桌上留着许知夏的手机支架和一支没盖盖子的笔；归还架上的 W-07 魏记录本，第57至62页被整齐裁走，只剩装订线。"},{"id":"c_lib3","title":"秦海的记录本","text":"秦海 Q-12 记录本里图3 对应的那几页，有两个样本编号被划掉重写，旁边铅笔批注“改贴，待核”。同一页边角有周廷远的红笔字迹：“此处我知道。”笔迹和专利底稿上的红笔批注一致。"}]},{"id":"garden","name":"后院发电机房与停车场","scene":"garden","desc":"研究所楼后的小院，台风里树枝乱舞，积水没过台阶。角落的发电机房亮着一盏应急灯，旁边是几辆被雨淋透的车。","clues":[{"id":"c_gar1","title":"发电机值班本","text":"发电机房的值班本，童伟铅笔字：“21:35 查油位；22:00 试机；22:14 转自动，应急回路供电正常；22:16 魏博士来；22:30 离岗（取柴油）；22:49 回岗；22:51 魏博士取手电回。”字迹用力，每一行都标着时间。"},{"id":"c_gar2","title":"停车场的银色轿车","text":"停车场角落一辆银色租赁轿车，驾驶座上有人刚坐过，座椅发潮，仪表台上放着一支U盘，标签写着“华澜—细胞株测序”。旁边的积水里有两串湿脚印通向发电机房方向，一串进一串出。"},{"id":"c_gar3","title":"消防梯口的烟头","text":"后门外的消防梯口被雨水冲出一条细流，台阶上有几个烟头，还有一把折断的大黑伞。伞柄上贴着“保安室”的标签，伞骨弯折，伞面被风撕开一道口子。"}]}],"suspects":[{"id":"qin","name":"秦海","role":"副教授","age":44,"look":{"skin":"light","hair":"messy","hairColor":"black","glasses":"rect","beard":"stubble","outfit":"shirt","mood":"stern"},"bio":"周廷远的多年合作者，自己带一个小课题组，在专利里署第二发明人。会后与周当众争吵过，自称断电后一直在自己办公室。","demeanor":"急躁、嗓门大，爱打断人，被戳到痛处就拍桌子。","topics":[{"id":"t_role","q":"你和周廷远什么关系？","a":"合作二十年，也斗了二十年。他是大牌，我是他的副手。论文上他是通讯，我永远排在后面。这么多年我认了，可没想到他连专利都要拿来压我。"},{"id":"t_fight","q":"会后你们吵什么？","a":"二十点零五分，会议室门口。我说专利署名排序我不服，他说“你没资格谈条件”。我嗓门是大了点，全组都听见了。吵架是吵架，我还没蠢到去杀人，杀了他我还拿什么署名？"},{"id":"t_corr","q":"22:20你在哪？","lie":true,"a":"在我自己办公室，一个人摸黑看文献。样本间那条走廊我晚上根本没去过。你们有什么证据说我去了，拿出来看看。","truth":"我去了。二十二点二十分进走廊，到 -80 间取回我组里被改贴的两管样本，二十九分关的柜子。我怕被查到，所以说谎。走廊里冷间门关着，门口什么都没有，我拿了东西就走，没碰过周廷远。"},{"id":"t_fig3","q":"图3 的数据有问题吗？","lie":true,"a":"我组里提供的原始数据完整无缺，每一管都有记录。有人要拿图3 做文章，那是冲着我来的，我不接。","truth":"有两管样本的编号我改贴过，因为原来的标签脱了，我不想补一个“数据丢失”的说明。周廷远知道，他拿这件事压了我两年。当晚我去取回那两管样本，就是想把它换回原来的样子。"},{"id":"t_nobody","q":"走廊里当时有什么？","needs":["clue:c_hall1"],"a":"刷卡记录你们都翻出来了，我不瞒。我拿手电扫过，冷间门关着，门口地上是空的，走廊干净，只有应急灯和压缩机停转后的静。我待了十一分钟，一个人影都没碰上，也没看见周廷远。"},{"id":"t_patent","q":"专利署名到底怎么回事？","needs":["clue:c_study1"],"a":"底稿上写着我和周廷远两个人。我没有提魏子墨，我心里有数，7F2 是他筛的。周廷远一口咬定“专利是我的名下”，我没吭声。这是我欠魏子墨的，我不想多说，你看着办。"},{"id":"t_wei","q":"你怎么看魏子墨？","a":"踏实，肯吃苦，没脾气。组里谁有麻烦都找他。周廷远这些年对他比对我还刻薄，可他从来没吭过一声。要说他有火气，我是真没看出来。"}],"confronts":[{"clue":"c_hall1","breaks":"t_corr","a":"他盯着“22:20 秦海”那一行，脸涨得通红，一巴掌拍在桌上。“刷卡……我忘了这破东西记账！”吼完又泄了气，低头嘟囔，“行，我进去过。可我是去拿我自己的东西，不是去杀人！”"},{"clue":"c_lab3","breaks":"t_corr","a":"“柜子登记卡。”他咬牙，“我自己的字，自己写的！你们连这个都翻出来了……好，好，我认。二十二点二十分进去，二十九分关柜。”拳头松开，肩膀垮了下去。"},{"clue":"c_lib3","breaks":"t_fig3","a":"他看着那行“改贴，待核”，苦笑了一声，又看到旁边周廷远的红笔“我知道”，眼睛一下红了。“他知道。他一直都知道。拿这个压了我两年，我连一声‘不’都不敢说。”"},{"clue":"c_study1","a":"“我的名字在上面。”他看了很久，手指点在“致谢处理”四个字上，“这四个字我下午就听说了。我没吭声，我是个懦夫。你们要抓我的懦弱，尽管抓。”"},{"clue":"c_lab1","a":"他凑近曲线，眉头拧成一团。“二十一点五十五？我二十二点二十才到，那个时候冷间早就关好了。不是我。”他抬头，“你们应该查查是谁在这之前开过它。”"},{"clue":"c_cli1","a":"“背上有霜？”他一愣，“那他是在冷间里待过？可我去的时候门口是空的……”他说着说着声音就弱了，“那就是我走之后的事了。”"}],"fallback":"这东西我没印象，也别想往我头上扣。"},{"id":"wei","name":"魏子墨","role":"博士后","age":33,"look":{"skin":"light","hair":"short","hairColor":"black","glasses":"round","beard":"none","outfit":"labcoat","mood":"smile"},"bio":"周廷远课题组的博士后，组里最能干活的人，台风夜主动去后院帮技术员盯发电机。自称断电前一直在P2细胞房做实验。","demeanor":"温和有礼，句句替别人着想，爱说“我理解”，被问急了会放慢语速。","topics":[{"id":"t_role","q":"你在课题组做什么？","a":"做抗体筛选和细胞实验，来组里第四年了。周老师是我的导师，也是我的合作者。组里的活，一半是我在盯，我不觉得苦，做科研的都这样。"},{"id":"t_where","q":"21:40到22:10你在哪？","lie":true,"a":"一直在P2房做转染。加样以后要孵育二十分钟，我就守在里面等，没出过门。出来时正好断电，我马上就去后院找童师傅了。","truth":"我出去过。孵育这二十分钟没人盯着我，我从P2出来，追着周老师进了走廊。我们在货架边吵起来，我推了他一把，他后脑撞上了货架角，一下就没气了。我慌了，把他拖进冷间，拿了他的工牌，回P2时手还在抖。"},{"id":"t_blackout","q":"断电后你一直在哪？","lie":true,"a":"我一断电就去后院发电机房帮童师傅，两个人守着机器，一直到来电。他可以证明，我们俩一步都没分开。","truth":"不是一步没分开。童师傅二十二点三十分离岗，我也跟着进楼，用周老师的工牌刷了走廊门，把他从冷间拖到门外，想让人以为他是断电后才出事。二十二点四十六分我在门厅撞见保安，二十二点五十一分回机房，对童师傅说是去取手电。我后来求童师傅别说破。"},{"id":"t_rel","q":"你和周老师关系怎样？","lie":true,"a":"亦师亦友。周老师对我有知遇之恩，我们从没红过脸。他这一走，我也不知道课题组还能不能撑下去。","truth":"那是场面话。当晚二十一点二十五分我去找他，7F2 是我筛出来的，他却在专利里把我划成“致谢”，还说图3 的问题要追到我头上。我求他，他说“你一个博士后，没资格”。我恨他，恨到发抖，可我也没打算杀他。"},{"id":"t_last","q":"你最后一次见周老师？","a":"二十一点三十五分左右，在他办公室，谈了一下实验进度。他让我先去忙，我就回P2了。他当时看起来很正常，还在翻文件。"},{"id":"t_7f2","q":"7F2 抗体是谁筛的？","needs":["clue:c_study2"],"a":"是我。那六页记录是我整整一个春天的心血，每一步都有他的签字见证。现在被裁走了，他想让它从我手里消失。我不是第一次被他用这种方式对待，但我不想多说。"},{"id":"t_cold","q":"冷间的温度曲线你怎么看？","needs":["clue:c_lab1"],"a":"断电以后压缩机停了，温度当然会升。二十二点三十七分那一下大升，应该是有人开了门。周老师一直不放心冷间，说不定他自己去看的，结果出了事。"},{"id":"t_fig3","q":"图3 的偏差怎么回事？","needs":["clue:c_study1"],"a":"图3 的原始数据是秦老师组那边提供的批次，我只负责后面的拟合。要说偏差，也不是出在我这里。周老师要把它推到我名下，我有记录、有日志，我不怕查。"}],"confronts":[{"clue":"c_hall1","breaks":"t_where","crack":true,"a":"他盯着P2的刷卡记录，那一行“21:44 出”像一颗钉子。“……二十分钟，我说我守着，是我说的。”他慢慢把眼镜摘下来，手指在镜腿上发白，“门禁不会说谎，是吧。”"},{"clue":"c_lib1","breaks":"t_where","a":"“孵育无需守候。”他念了方案上那行字，苦笑，“是我自己贴的，嫌每次被人问。我写了加样和读板，没写我在里面。你们真会抠字眼。”声音还是温和的，却一点点哑下去了。"},{"clue":"c_gar1","breaks":"t_blackout","a":"他看着“22:30 离岗”和“22:51 取手电”之间那段空白，笑意终于挂不住。“童师傅记得很细。”他低声说，“我以为他不会写那么细的。”"},{"clue":"c_study1","breaks":"t_rel","a":"红笔的“不列，致谢处理”让他整个人静止了几秒。“看到了吧。”他说，“这就是我口中的亦师亦友。我真心把他当老师，他把我当耗材。”眼眶发红，却没有一滴泪。"},{"clue":"c_lab1","a":"他看着那两处突起的曲线，轻轻吸了口气。“二十一点五十五？”他很快稳住了，“那时还有市电，冷间谁都能进，取个样本开两分钟门，再正常不过。”"},{"clue":"c_cli1","a":"“背上有霜。”他重复这一句，指尖在桌沿敲了一下又停住，“冷间里的东西……会沾霜的。可这能说明什么？尸体也能自己走出冷间吗？”这句话问出口，他自己先愣了一下。"},{"clue":"c_cli2","a":"他的目光在“21:44 最后一次解锁”上停了一瞬。“停电了，谁还顾得上看手机。”他笑了笑，“电量那么低，大概是舍不得开手电吧。”可他没有解释，那张卡为什么会盘在内袋里。"},{"clue":"c_gar3","a":"他对着那把断伞摇摇头。“后院风大，伞都折了。我披的是雨披，不打伞。”说完又补了一句，“这跟我有什么关系？”"}],"fallback":"我不太了解这个，不过我愿意配合你们调查。"},{"id":"xu","name":"许知夏","role":"博士生","age":25,"look":{"skin":"fair","hair":"ponytail","hairColor":"black","glasses":"none","beard":"none","outfit":"hoodie","mood":"worried"},"bio":"周廷远名下的博士四年级学生，论文答辩迟迟不被批准。说自己整晚在学生办公室写论文，直到被保安叫下楼。","demeanor":"声音小，说话快，爱先看别人脸色，紧张时抠指甲。","topics":[{"id":"t_role","q":"周老师对你怎样？","a":"他是我导师，对我……挺严的。我延期了一年，答辩申请一直卡在他那里。他说“等图3 的事处理完”。我不敢追问，也不敢多想。"},{"id":"t_where","q":"21:40到22:15你在哪？","lie":true,"a":"学生办公室，写论文，写到手酸。我从九点多一直坐到被保安叫下楼，没出过门，不信你看我的文档保存时间。","truth":"我去了资料室。二十一点五十分借了魏师兄和秦老师的记录本，想拍下图3 相关的几页，准备向学术委员会匿名反映。二十二点十二分还回去的。我怕你们以为我有杀人动机，才没说。"},{"id":"t_saw","q":"离开资料室时遇见谁？","needs":["clue:c_lib2"],"a":"你们既然翻到了登记表，我就不瞒了。二十二点零二分，我出去倒水，在走廊里撞见魏师兄急匆匆回P2。他刷卡的手一直在抖，我碰到他的手，冰得像从冰箱里抓出来的。我问他怎么了，他说“刚在冷间拿了点试剂”，就进去了。"},{"id":"t_wei","q":"魏师兄是怎样的人？","needs":["ask:xu.t_saw"],"a":"他对我最好，我论文哪里不会，都是他教的。可那天晚上他的手那么冷，说话那么急……我现在才觉得不对劲。我不想怀疑他，可我也没法当没看见。"},{"id":"t_fig3","q":"图3 你知道什么？","needs":["clue:c_lib3"],"a":"图3 里有两管样本编号被改过，我在秦老师记录本里看到“改贴待核”。周老师也知道。我不确定该怪谁，只想把原始记录留一份，不然最后背锅的肯定是我们这些学生。"},{"id":"t_zhou","q":"你恨周老师吗？","a":"恨过，也怕。他把我的答辩压了一年，说话从来不留余地。可是我没想过他会死，更没想过要自己动手。你们别把我当成那种人。"}],"confronts":[{"clue":"c_lib2","breaks":"t_where","a":"她盯着登记表上自己的名字，指甲几乎掐进掌心，声音发颤：“是我签的……我撒谎了。我不是想害谁，我是怕！一旦说出来，谁会信一个被压了一年答辩的学生？”眼泪终于掉了下来。"},{"clue":"c_lib3","a":"她看着那行“改贴，待核”，睫毛颤了一下。“我拍的就是这页。”过了一会她才抬头，“我只想留证据，不是要揭谁的短。”"},{"clue":"c_study2","a":"“那是魏师兄的记录页。”她吃了一惊，“被裁掉了？周老师怎么能……”她把后半句咽了回去，眼眶发红，“那他们俩之间的事，比我想的严重多了。”"},{"clue":"c_hall1","a":"“P2的刷卡记录……”她仔细看了一会，“二十一点四十四分出，二十二点零三分进。那我二十二点零二分撞见他，时间对得上。”她停了停，“你们是不是已经知道了什么？”"}],"fallback":"这个……我不太清楚，真的。"},{"id":"tong","name":"童伟","role":"实验室技术员","age":46,"look":{"skin":"tan","hair":"cap","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","mood":"tired"},"bio":"在所里干了十九年的技术员，管仪器、管发电机、管冷库。断电后去后院发电机房值守，说魏子墨来帮他，两人一直在一起。","demeanor":"老师傅腔调，话少而硬，爱说“按规程”，一心虚就低头摆弄手套。","topics":[{"id":"t_role","q":"你平时管什么？","a":"仪器维护、冷库、发电机，还有夜里的巡检。十九年了，这套楼里哪颗螺丝松了我都知道。规程上写的，我一条不敢漏。"},{"id":"t_gen","q":"断电后设备怎么运转？","a":"市电一断，发电机和UPS接管应急回路，只管 -80 冷冻柜、应急灯和门禁，整楼照明和步入式冷间的压缩机不在上面，所以断电超半小时规程要求开冷间检查。我二十二点十四分转的自动，应急回路一直正常。"},{"id":"t_shed","q":"断电后你一直在哪？","lie":true,"a":"就在发电机房，一步没离开。魏博士二十二点十六分过来帮忙，我们俩守着机器，一直到来电。按规程我不敢离岗，你们去问魏博士。","truth":"我离岗了。二十二点三十分我说去取柴油，其实是去车里给人送东西。魏博士那时在机房，说“你去，我帮你看着”。我二十二点四十九分回来，他不在，过了两分钟才披着雨披回来，说去拿手电。后来他求我别提这段，我也怕说出自己的事，就答应了。"},{"id":"t_fang","q":"你认识方知行吗？","lie":true,"a":"华澜的方经理？招待过一两次，不熟。他是客人，我是技术员，除了带他参观仪器，没有任何私下来往。","truth":"熟。我私下替华澜做过几次细胞株测序，拿点外快。当晚我二十二点三十几分去车里，把一支U盘交给他，里面是一份测序数据。这事要传出去，我这饭碗就丢了，所以我说谎。"},{"id":"t_cover","q":"魏博士让你做了什么？","needs":["ask:tong.t_shed","clue:c_gar1"],"a":"来电以后，魏博士悄悄跟我说：“咱俩就说一直在一起，你出去那事我也不提。”我当时只觉得是他讲义气。现在回头想，他是在拿我的短处换他自己的口供。"},{"id":"t_cold","q":"冷间该怎么检查？","needs":["clue:c_lab1"],"a":"按规程，断电超三十分钟要开一次，核对温度、拍照记录。我守着机器走不开，想着等来电再去，这是我的失职。要是我早去看一眼，周老师也不至于躺在门口那么久。"}],"confronts":[{"clue":"c_gar1","breaks":"t_shed","a":"他看着自己写的那几行铅笔字，半晌没说话，手套在掌心捏成一团。“22:30 离岗，22:49 回岗。”他哑着嗓子念出来，“干了十九年，头一回写得这么老实，也写得这么要命。行，我不装了。”"},{"clue":"c_gar2","breaks":"t_fang","a":"他盯着那支U盘，脸一下白了，嘴唇哆嗦：“华澜——细胞株测序……”他猛地攥紧手套，“我就赚点外快！没偷过课题组的核心数据，我拿十九年的名声担保！”"},{"clue":"c_hall1","a":"“22:36 周老师的卡。”他皱起眉，“那会儿周老师在哪、在干什么？我在机房守机器，什么都不知道。按规程，这卡谁都不该借着用。”"},{"clue":"c_lab1","a":"他看着温度曲线，嘴唇动了动。“二十一点五十五分？可那时还没断电啊，谁开的冷间？”他摸了摸帽檐，“我是技术员，我知道开门三分钟以内不会报警，这事很有心思。”"},{"clue":"c_gar3","a":"“保安室的伞。”他看了一眼，“风大，折了，这个别算在我头上。”过了一会又补一句，“我那晚没碰过伞。”"}],"fallback":"这个不在我管的范围内，按规程你该问别人。"},{"id":"qi","name":"齐美玲","role":"所办行政主管","age":41,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"rect","beard":"none","outfit":"suit","acc":"badge","mood":"worried"},"bio":"研究所行政办公室主管，负责专利和合同流程。自称十九点三十分就下班回了家，被电话叫回来才知道出事。","demeanor":"客气、官腔，爱说“按流程”，一被追问细节就看表。","topics":[{"id":"t_role","q":"你负责哪些事？","a":"课题组的合同审批、专利备案和人员考勤，全按流程走。周老师的项目尤其多，每一份文件我都亲手过。"},{"id":"t_leave","q":"你当晚几点离开所里？","lie":true,"a":"十九点三十分就走了，台风要来，我提前回了家，是后来接到所里的电话才匆匆赶回来的，什么都没见着。","truth":"我一直没走，十七点入的所，留所登记上有我。我在行政办公室加班，直到断电，之后一个人摸黑坐到来电。我怕被问“为什么要留在所里”，才说谎。"},{"id":"t_sign","q":"专利文件有没有违规？","lie":true,"a":"所有申请材料都齐全合规，发明人声明、署名页、各方签字，一步不缺，我亲手过的每一份都经得起查。这方面我可以保证。","truth":"不合规。下午五点，周老师叫我把发明人声明从三个人改成两个，我说魏子墨没签放弃声明，他一句“我负责”就签了字。我没敢拦，怕丢工作。这事要查出来，我要担责。"},{"id":"t_form","q":"发明人声明改过吗？","needs":["clue:c_study1","ask:qi.t_sign"],"a":"改过。原来的版本是周廷远、秦海、魏子墨三个人。周老师下午说“魏子墨的贡献按致谢处理”。我劝过他，他不耐烦，说一个博士后没资格署名。"},{"id":"t_wei","q":"你对魏子墨印象怎样？","a":"稳重，礼貌，从不惹事。我记得他前两天来问过专利的进度，我只说“还在走流程”。现在想想，他那个眼神……我不敢说。"},{"id":"t_dark","q":"断电后你做了什么？","a":"一个人坐在办公室，听着风雨声，手机只剩一点电。我不敢乱跑，更没离开过二楼。你们别指望我给谁作证，我连自己都证明不了。"}],"confronts":[{"clue":"c_hall2","breaks":"t_leave","a":"她盯着留所登记上自己的名字，嘴唇动了动，手下意识去扶眼镜。“十七点入，没有离馆……”声音绷得发紧，“是，我骗了你们。我只是怕，一沾上这件事，这份工作就保不住了。”"},{"clue":"c_study1","breaks":"t_sign","a":"她脸色刷地白了，捏着衣角：“这份底稿……上面的签名是真的，可魏子墨的放弃声明根本不在流程里。”她深吸一口气，眼圈红了，“是我违规，我认。我当时就该拦住他的。”"},{"clue":"c_study2","a":"“被裁走的六页。”她愣了愣，“难怪魏子墨前两天来问我，能不能调他的原始记录。我当时只当他是核对。”声音越来越低。"},{"clue":"c_hall1","a":"“这些刷卡我看不懂。”她把日志推开一点，“我只知道，当晚周老师没跟我说过要去样本间。别问我了，这条走廊我都很少去。”"}],"fallback":"这个我得去查一下流程，现在不好说。"},{"id":"fang","name":"方知行","role":"华澜生物商务总监","age":38,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"none","beard":"none","outfit":"suit","acc":"tie","mood":"smirk"},"bio":"合作企业华澜生物的商务代表，傍晚来所里谈许可协议，约定次日十点签约。自称晚饭后二十点三十分就回了酒店。","demeanor":"生意人的圆滑，笑着打太极，爱用“从商业角度讲”，被拆穿也不慌。","topics":[{"id":"t_role","q":"你来所里做什么？","a":"谈一个 7F2 抗体检测的许可，我们出四千八百万，明天十点签。周教授点了头，只差签字。从商业角度讲，这是双赢的事，没人愿意看到它黄。"},{"id":"t_leave","q":"你几点离开所里？","lie":true,"a":"二十点三十分，吃完饭就回酒店了。台风前我总得早点歇，一夜平安，什么都没看见，也不想卷进你们所里的事。","truth":"我没走成。台风封路，打不到车，我先在接待室坐着，后来为了等童伟那边的东西，躲进自己车里。我说回了酒店，是不想被当成命案当晚还在现场的人。"},{"id":"t_drive","q":"你和技术员有来往吗？","lie":true,"a":"技术员？没有，我就见过一面。商务上的事都找周教授，和实验室的人我从不私下打交道。","truth":"有。童伟私下帮我们做过几次测序，我当晚在车里等他，二十二点三十几分他把一支U盘交给我，里面是细胞株测序数据，私人交易，和周教授的专利无关。"},{"id":"t_see","q":"你在车里看到什么？","needs":["ask:fang.t_drive","clue:c_gar2"],"a":"大概二十二点四十八分，有个披蓝色雨披的人拿着手电，从楼里小跑着出来，往发电机房去。风太大，我看不清脸。我当时以为是哪个值夜的，没多想。"},{"id":"t_who","q":"专利发明人有变化吗？","needs":["clue:c_study1"],"a":"三天前我手里的版本，发明人是周教授、秦教授和魏博士三个人。今天下午收到的就是现在两个人。我问周教授，他说“内部调整”。商业上我只认最终文件，不多追问。"},{"id":"t_cost","q":"协议黄了你损失多大？","a":"我们前期已经付了两百万的咨询费，协议不签，等于打水漂，我老板会剥了我的皮。可从商业角度讲，我犯不着为这个杀人，周教授一死，协议就是一堆废纸。"}],"confronts":[{"clue":"c_hall2","breaks":"t_leave","a":"他看着访客登记里空白的“离馆”栏，先是一愣，随即笑出声，摊开手。“登记没填。你们保安的活儿，做得比我想的细。”笑容褪下去一点，“好吧，我没走成，被这场台风钉在这儿了，窝火得很。”"},{"clue":"c_gar2","breaks":"t_drive","a":"他盯着自己车里的U盘，笑意挂不住了。“标签写得太老实了。”他叹了口气，“好吧，童伟跟我有生意，不过那只是细胞株数据，和周教授的专利无关。”"},{"clue":"c_study1","a":"他拿起底稿翻了翻，眉头皱起来。“签约前一晚还在改发明人，周教授真是心急。”他抬头，笑意淡了，“这种事，企业最怕，发明人不清，专利将来是要打官司的。”"},{"clue":"c_hall1","a":"“我对门禁一窍不通。”他把日志推还给你，“不过那个22:36很有意思，教授如果已经出事，谁能刷他的卡？我可没有他的卡。”"}],"fallback":"从商业角度讲，这个和我没什么关系。"},{"id":"sun","name":"孙国栋","role":"夜班保安","age":52,"look":{"skin":"tan","hair":"short","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"uniform","acc":"badge","mood":"tired"},"bio":"研究所夜班保安，当晚值班。供电恢复后他在三楼走廊里第一个发现周廷远倒在冷间门外。自称整夜没离开过门厅。","demeanor":"憨厚的老保安，一口乡音，说话先“哎呀”，急了会拍大腿。","topics":[{"id":"t_role","q":"你当晚负责什么？","a":"看大门、登记来客、半夜巡楼。哎呀，我这个人不聪明，就是老实，几十年没出过岔子。台风夜我格外小心，所有人进出都记在本子上。"},{"id":"t_post","q":"你整夜都在岗位上吗？","lie":true,"a":"哎呀，那当然。我在门厅一步没动，眼睛盯着门，谁进谁出我都知道。就是断电后黑咕隆咚，看不清楚罢了。","truth":"不是一步没动。二十二点二十五分地下车库漏水，我怕淹了配电箱，去抽了二十分钟水，二十二点四十五分才回来。我怕领导知道我离岗，就说一直在。这是我不对。"},{"id":"t_find","q":"谁发现了周教授？","a":"来电以后我上三楼巡一圈，二十三点零二分在冷间门外看见周教授躺着，一动不动。我马上喊人、报警，没敢碰他。当时魏博士也在人群里，叫大家别靠近。"},{"id":"t_guest","q":"当晚有哪些外来人员？","a":"外来的两位，方总监和蒋太太，都在本子上登记过。哪个钟点进来的，你自己翻保安室的本子，我记性不如笔头。台风天嘛，谁都走不了。"},{"id":"t_lobby","q":"你回岗时遇见谁？","needs":["ask:sun.t_post","clue:c_hall2"],"a":"二十二点四十五分我从车库上来，快到门厅，二十二点四十六分，魏博士披着蓝雨披、拿着手电从楼梯口出来，匆匆往后门去。我问他去哪，他说“出去看看发电机”，我还嘀咕，发电机有童师傅盯着呢。"},{"id":"t_card","q":"门禁记录靠得住吗？","needs":["clue:c_hall1"],"a":"读卡器是UPS供电，断电也记账。就是出门按钮不记，开门后八秒才重新锁，后面的人要是跟得紧，也能进去。不过刷卡就是刷卡，一张卡一个人。"}],"confronts":[{"clue":"c_hall2","breaks":"t_post","a":"他看着自己巡查本上“22:25 去抽水”几个字，脸涨得通红，狠狠拍了下大腿。“哎呀！我自己写的，赖不掉了！”他垂着头，“好，我是离岗了，二十分钟。我老孙干了半辈子，就这一回……”"},{"clue":"c_gar3","a":"“这把伞是我们保安室的。”他指着标签，“我那晚去车库抽水用的，风太大折了，后来丢在后门口。你们别说我偷懒，我是真去干活了。”"},{"clue":"c_hall1","a":"“22:36 周教授刷卡。”他念着，一脸茫然，“那时候我在车库……哎呀，我要是在门厅就好了，我肯定能看见谁进的走廊。”"},{"clue":"c_cli2","a":"“手机一直没亮过？”他挠头，“哎呀，停电那阵子楼里黑得伸手不见五指，活人走夜路谁不先摸手机照个亮？我巡楼还举着手电呢。”说到这儿，他自己顿住了。"},{"clue":"c_cli1","a":"“背上有霜？”他倒吸一口气，“我发现他的时候，他身子冰得吓人，我还以为是被雨淋的。后来才想起来，走廊里是没有雨的。”"}],"fallback":"哎呀，这个我不懂，你问别人吧。"},{"id":"jiang","name":"蒋书琴","role":"周廷远的妻子","age":54,"look":{"skin":"light","hair":"bob","hairColor":"grey","glasses":"none","beard":"none","outfit":"coat","acc":"necklace","mood":"sad"},"bio":"周廷远的妻子，中学教师。自称在家接到电话，赶到研究所时已经二十三点二十分，丈夫已被盖上了白布。","demeanor":"端着教师的体面，语气克制，爱用反问，被戳到心事时会突然安静。","topics":[{"id":"t_role","q":"你和周廷远的关系？","a":"三十年夫妻。他把一生都给了实验室，我习惯了。外人眼里我们体面，但这么多年，我把话咽进肚子的时候，比说出口的多。"},{"id":"t_arrive","q":"你几点到的所里？","lie":true,"a":"接到电话已经二十三点多了，我打车赶来的。台风天路上堵，二十三点二十分才到。之前我一直在家。","truth":"二十一点二十分我就到了，因为台风要来，我想接他回家。保安让我在接待室等，我二十一点三十六分上楼找过他一次，被人劝回接待室，一直等到来电。我说谎，是怕你们怀疑我，我手里还拿着他的电脑。"},{"id":"t_laptop","q":"电脑包里是什么？","lie":true,"a":"我自己的东西，一些旧文件和教案，不值一提。我是来接丈夫的，不是来受审的，你们没有权力翻我的包。","truth":"是周廷远的笔记本电脑。二十二点零二分我趁他不在，上楼进办公室拿的。他的聊天记录里，藏着他把专利收益转到私人账户的计划，我想留作离婚的证据。他死了，这些就更不能让外人看。"},{"id":"t_stair","q":"你在所里见过谁？","needs":["ask:jiang.t_arrive","clue:c_cli2"],"a":"二十一点三十六分，我上三楼找他，在楼梯口撞见魏博士，他脸色发白，说“周老师在忙，您先去接待室等”。我当时还觉得他怪怪的，没多问，下楼等了。"},{"id":"t_wei","q":"你对魏子墨印象如何？","a":"周廷远常在家里说起他，嘴上嫌他“太老实”，其实最倚重他。魏博士每年中秋都往家里送月饼，礼数周全。那天晚上在楼梯口，他是我见到的最后一个组里人。"},{"id":"t_marriage","q":"你们夫妻到底怎么了？","needs":["clue:c_study3"],"a":"他最近一年，账上多了个我不知道的户头，手机总背着我。我听见他在电话里提“离岸”两个字。我不想闹，只想留份证据。你们要说我有动机，我认，可我没杀人。"}],"confronts":[{"clue":"c_cli2","breaks":"t_arrive","a":"她盯着手机预览里自己发的那行字，嘴唇抖了一下，手慢慢捂住嘴。“二十一点五十二分……是我发的。”她闭上眼，“好，我二十一点二十分就到了。我撒了谎。他一直没回我，我就那么傻等着……”"},{"clue":"c_hall2","breaks":"t_arrive","a":"“访客登记里有我。”她苦笑，“保安老孙写得比我记得清。好，我二十一点二十分就到了，你们别再逼我了。”"},{"clue":"c_cli3","breaks":"t_laptop","a":"她抱紧电脑包，指节发白。“……你们都看见贴纸了。”她终于松开手，声音很轻，“是他的电脑，我拿的。我不是贼，我是他的妻子。”"},{"clue":"c_study3","breaks":"t_laptop","a":"她看着那只空的底座，沉默了很久，才把电脑包放到桌上。“是他的电脑。我拿的。”她没有看你，“不要问我里面有什么，我自己也不想再看一遍。”"},{"clue":"c_study1","a":"她读到“致谢处理”几个字，轻轻一震。“他还是这样。”她说，“把别人的功劳揣进兜里，一辈子都改不了。我早知道他会出事，只是没想到是这种方式。”"}],"fallback":"这个我不清楚，也不想多说。"}],"solution":{"culprit":"wei","method":{"q":"凶手是怎样让人相信“周廷远死于断电期间”的？","options":["断电后凶手趁黑潜入走廊行凶，并破坏门禁系统使日志缺失。","断电前行凶并把尸体藏进冷间，断电后用死者的工牌刷门、把尸体拖出冷间，伪造他断电时仍活着的假象。","凶手篡改冷间温度记录和中央报警，让死亡时间显得更晚。","凶手在冷间里把周廷远反锁到断电后，使其冻死。"],"correct":1},"motive":{"q":"凶手为什么杀人？","options":["周廷远发现凶手在图3 数据上造假，要将其开除。","凶手收了企业好处，要阻止专利许可协议的签署。","周廷远把凶手从专利发明人中抹去，还要把图3 的偏差栽到他头上，凶手争执中失手致死并掩盖。","凶手想夺取课题组组长的位置。"],"correct":2},"keyClues":["c_cli1","c_cli2","c_lab1","c_hall1","c_gar1","c_study1"],"truth":["凶手是博士后魏子墨。所有人都以为周廷远死在断电后的黑暗里，真相是：他在断电前就已经死了，而断电只是凶手借来用的一张幕布。","动机藏在专利里。7F2 抗体克隆是魏子墨一个春天筛出来的，记录页上有周廷远亲笔的见证签字；可周廷远在发明人名单里只留了自己和秦海，把魏子墨划成“致谢”，还打算把图3 的偏差追到他名下，把那六页记录也裁走了。次日 10:00 周要与华澜签许可协议，今晚是魏子墨最后的机会。","21:25，魏子墨在办公室求周廷远无果；21:40 回 P2 加样，借着“孵育二十分钟无需守候”的空隙，21:44 出门追上走廊。门禁只记周廷远 21:46 刷卡，魏子墨尾随进门，争执中把周推向货架，后脑撞上棱角，当场死亡。","他慌乱中把尸体拖进 -20℃ 冷间，拿走周的工牌，21:55 开门、21:57 关门，温度记录仪记下了这两分钟的突升，却因为不足三分钟没触发中央报警；他把工牌塞进自己口袋，22:03 回到 P2，路上被许知夏碰到冰冷的手，还顺口说是“刚在冷间拿了点试剂”。","22:13 台风断电，冷间压缩机停转。魏子墨明白断电后必须开冷间检查，尸体藏不住，便去后院发电机房找童伟，借他当不在场证明。22:30 童伟离岗，他进楼，22:36 用周的工牌刷开走廊门，把尸体拖到冷间门外，再把工牌盘好塞回死者内袋，让门禁日志显示周在断电后还活着、是在黑暗中被人杀害的。冷间门敞开四分钟，22:40 触发超时报警。22:46 他在门厅撞见保安，22:51 回机房对童伟称去取手电，又求童伟“就说我们一直在一起”。","破绽：法医初检的霜、拖痕与偏低的体温，加上冷间记录仪 21:55 的开门曲线和冷间地面冻结的擦痕，说明周在断电前已被藏入冷间；他的手机自 21:44 起再没被他自己用过，工牌盘在内袋里、颈后无压痕，说明 22:36 刷门的是拿着死人卡的另一个人；P2 门禁和“孵育无需守候”让魏子墨有了二十分钟的空窗；发电机值班本证明他 22:30–22:49 根本不在机房；周亲笔的专利底稿和被裁走的记录页，把动机钉死。","副教授秦海、博士生许知夏、技术员童伟、行政齐美玲、方知行、保安孙国栋和周的妻子蒋书琴，各自都藏着事，有的改过样本编号，有的偷偷拍记录本，有的私下送U盘，有的违规改声明，有的离岗抽水，有的偷走电脑，却没有一件指向杀人。真正动手的，是那个最温和、最能干活的人。"]}},{"id":"homestay","title":"雪山民宿","tagline":"暴雪封山的民宿里，主人死在从内反锁的房间，八个人谁也走不了。","difficulty":3,"cover":"cover","tone":"cold","brief":"你是被镇派出所老同学紧急托来的“民间顾问”。昨天午后一场罕见的暴雪封了山路，旅行博主兼“栖雪山居”民宿主人山屿，今早被发现死在自己的二〇二房间里——门从里面插着插销，窗也锁着。警方的车被堵在山下，最快要到明天才能上来，你是唯一能先进山的人，靠雪地摩托一路颠到民宿门口。大厅的炉火烧得很旺，却没有一个人敢靠近二楼。房客、员工、一个路过的学生，八个人围着壁炉，都说自己什么也不知道。你搓了搓冻僵的手，开始一个个看他们的脸。","victim":{"name":"山屿（商屿）","desc":"33岁，拥有一百二十万粉丝的旅行博主，“栖雪山居”民宿的主人。今早被发现倒在二〇二房间的地毯上，面颈肿胀、满身红疹，喉部有自己抓出的伤痕，指缝里带血。","look":{"skin":"light","hair":"slick","hairColor":"black","glasses":"none","beard":"stubble","outfit":"vest","mood":"smirk"}},"publicFacts":["山屿，本名商屿，33岁，旅行博主，“栖雪山居”民宿的主人，粉丝一百二十万。","昨天午后雪封山路，晚上七点起手机信号中断，民宿里的人无法与外界联系。","今早七点二十，二〇二的房门被撞开：门内侧的插销已插死，窗户内锁完好，窗外积雪没有脚印。","遗体面颈严重肿胀、满身红疹，喉部有抓痕；现场没有打斗痕迹，也没有发现外人闯入的迹象。","民宿里共有八人：四位房客，管家魏敏，杂工周守山，运营贺杰，另有一个借宿的学生；连死者共九人。","警方尚未赶到，通过电话初步判断，死者死亡时间在昨晚二十二点到二十四点之间。"],"timeline":[{"t":"14:00","text":"暴雪封山，山路中断，所有人都被困在民宿。"},{"t":"19:00","text":"晚饭，众人同桌；山屿另有一份魏敏单做的饭菜。19:00后手机信号中断。"},{"t":"21:00","text":"前后，大厅里有人听见山屿与一位女房客激烈争执，约21:15结束。"},{"t":"22:05","text":"山屿手持保温杯，穿着橙色背心，独自上楼回到二〇二。"},{"t":"23:10","text":"前后，有人在202门外敲过门，没有人回应。"},{"t":"06:50","text":"魏敏送早餐敲202的门，没有回应，去叫人。"},{"t":"07:20","text":"周守山与邢大海撞开房门，发现山屿已死，警方通过电话被告知。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"room","name":"二〇二主人房","scene":"guestroom","desc":"二楼走廊中段的主人房，暖气还开着，空气里有一股淡淡的姜味。门框上的插销座被撞裂，一圈人都不敢往里踏。","clues":[{"id":"c_room1","title":"山屿的保温杯","text":"书桌上立着一只银色保温杯，杯盖倒扣在旁边，杯里还剩小半杯姜茶。杯底沉着一层浅褐色的细腻糊状物，混着油星，比红枣和姜渣滑得多；凑近细闻，姜和蜂蜜的辛甜底下压着一丝炒花生的香气。桌上没有别的饮食，垃圾桶是空的。"},{"id":"c_room2","title":"背心与翻乱的抽屉","text":"橙色羽绒背心搭在椅背上，左胸口袋的拉链敞开，袋里空空如也，袋布上有一道长条形的压痕，像长期装过一支圆柱形的东西。床头柜的抽屉被整个拽出倒扣在地，药盒、充电线撒了一地；手边掉着一张塑封卡片：“花生严重过敏。发作时立即注射肾上腺素，并拨打120。”"},{"id":"c_room3","title":"反锁的门窗与遗体","text":"门内侧的黄铜插销推到了底，门框上的插销座连着螺丝被撞裂。窗扇关严，月牙锁扣着，窗台积雪完整无痕。山屿侧卧在床与书桌之间，离门约四步，脸颈肿胀发亮，满布红疹，指缝里有血。靠201一侧的墙根，书桌凳翻倒，凳腿在墙面磕出几处新痕；房门外侧下缘有一个靴尖踢出的泥雪印。"}]},{"id":"kitchen","name":"民宿厨房","scene":"kitchen","desc":"一楼后侧的厨房，连着通后院的小门，灶上还温着早上没吃完的粥，案板边堆着昨晚没收拾完的碗碟。","clues":[{"id":"c_kit1","title":"垃圾桶里的小瓶","text":"灶台下的垃圾桶深处躺着一只40毫升的透明按压分装瓶，瓶身原有的标签被撕掉，留着一圈胶痕；瓶口和内壁糊着褐色浓稠的酱，有炒花生的香气；胶痕处残留一角印着蓝色细线边框的白色标签纸。旁边是一只用过的一次性塑料手套，和几个蘸了酱的纸巾团。"},{"id":"c_kit2","title":"厨房值班本","text":"操作台上的值班本，是魏姐的字迹：“19:00 晚餐。山屿另做：清炒鸡丁，单锅单铲，无任何坚果。21:35 姜蜜茶（姜、红枣、蜂蜜）装保温杯，放操作台待取。22:00 山屿下楼取杯。”本子边压着一张便条：“蜂蜜罐是老板私人的，谁也不许动。”"},{"id":"c_kit3","title":"未拆封的牛轧糖","text":"料理台角落放着一盒系着丝带的花生牛轧糖，塑封完好，没有拆过，卡片上写着“给山屿——鹿”。魏姐说是客人下午放下的，山屿看了一眼，说“放厨房吧”，就再没碰过。"}]},{"id":"hall","name":"一楼大厅","scene":"hall","desc":"带壁炉的大厅，沙发围着炉火，楼梯通向二楼，门边立着一排衣帽架。落地窗外是白茫茫的雪，窗玻璃上结着霜花。","clues":[{"id":"c_hall1","title":"书架后的运动相机","text":"书架第三层《徒步指南》后面藏着一台指尖大小的运动相机，镜头对着楼梯口和门边的衣帽架，机身贴着一张小标签“MU”。机内回放：21:52:04，壁炉边沙发上两个女人背对镜头在说话，近处衣帽架上挂着一件湿漉漉的橙色羽绒背心；一只戴荧光绿腕带的手伸进背心左口袋，取出一支深色圆柱形的东西，塞进自己袖口。画面里看不到此人的脸和身体。"},{"id":"c_hall2","title":"装修催款函","text":"吧台抽屉里压着一份盖了章的催款函，甲方山屿，乙方“大海装饰”，装修尾款八十六万，逾期八个月，最后一行手写：“本周一前不结清，走法律程序。——邢”。函上有山屿的批注：“周一新赞助到账再说。”函后还别着一页银行的逾期通知，抬头是“大海装饰”，列着两笔贷款逾期未还。"},{"id":"c_hall3","title":"前台登记本","text":"前台登记本里近期几页是房客登记。“沈晴”一行的身份证复印件用胶带遮住了姓名栏，胶带边缘露出一个“苏”字的上半截；“许老师”的职业栏写着“瑜伽教练”。登记本中间有一页被整页撕走，装订线上还留着三年前十月的日期残角。"}]},{"id":"garden","name":"后院与火盆","scene":"garden","desc":"民宿后院，屋檐下摆着一只铜火盆，雪在院子里积了一尺厚。运营室的侧门通向这里，东墙角是全院唯一偶尔能有一格信号的地方。","clues":[{"id":"c_gar1","title":"火盆里的残骸","text":"屋檐下的铜火盆里炭火已成灰，灰里埋着一截半融的深色塑料圆筒，一头的橙色保护帽熔成一团，筒身残留“……肾上腺素……”几个字；旁边有半张烧卷边的药房标签，能认出“商屿”和“自动注射”。"},{"id":"c_gar2","title":"通向火盆的脚印","text":"从运营室侧门到火盆之间的雪地上，有一串往返的脚印：软底拖鞋的纹路，没有鞋跟印，步幅很小，来去的深浅相近。脚印在屋檐下，没被新雪盖住，在火盆前停了一会儿，鞋印旁撒着几点黑色炭灰。"},{"id":"c_gar3","title":"门廊下的烟蒂","text":"后院门廊下的雪被踩得很实，墙角堆着六七根“黄鹤楼”烟蒂，最近的一根还没被新雪盖住。旁边的雪地里有一个人形的凹坑，坑边有一只手套的印子，雪面被蹭乱了一大片。"},{"id":"c_gar4","title":"东墙角的挂绳","text":"东墙角信号稍好的地方，雪被反复踩出一小块平地，雪里落着一根毛线手机挂绳，绳上系着一块小木牌，刻着一个“魏”字，绳子另一头连着半截手机壳的边角。"}]},{"id":"cellar","name":"地下储藏间","scene":"cellar","desc":"民宿地下的储藏间，堆着酒坛、腌菜缸和旧工具，角落里临时搭了几个八十块一晚的铺位，空气又冷又潮。","clues":[{"id":"c_cel1","title":"偷拍笔记本","text":"角落铺位上摊着一本笔记本和一台旧笔记本电脑。本上列着“拆穿山屿”拍摄清单：“人设穿帮点：自称无辣不欢——实际不碰辣；‘什么都敢吃’——存疑。”下面记着昨晚的素材：“21:03 大厅争吵 录音 06:12”“22:20 二楼走廊 女客在202门前停留约两分钟（浅色睡袍）”，最后一行画着圈：“相机在书架”。"},{"id":"c_cel2","title":"红色登山包","text":"酒坛旁放着一只褪色的红色登山包，吊牌上写着“苏岚”和一个手机号。包旁有一把矮凳和一只空酒杯，杯口的酒渍还没干。包里有一台镜头摔裂的相机和半盒过期的巧克力。"},{"id":"c_cel3","title":"工具柜里的旧本子","text":"工具柜最底层压着一本旧记事本，是周守山的字：“10.17 老板说别报警。10.18 工钱涨五百。”再往后每月一行同样的数目，备注“封口”。本子最后一页夹着一张发黄的纸条，只有两个字：“对不起。”"}]},{"id":"study","name":"运营室","scene":"study","desc":"一楼大厅旁的小房间，两台显示器、三脚架和一堆灯具，墙上贴着“山屿”的内容日历。一扇侧门通向后院。","clues":[{"id":"c_study1","title":"待签的情况说明","text":"打印纸标题《关于“山屿”账号内容及收款事宜的情况说明》，正文：“本人贺杰，未经山屿本人同意，长期以山屿名义与粉丝私聊并收取打赏、转账，共计十七万余元，所有责任由本人承担。”落款“贺杰”后留着空白签名线，页脚有铅笔字：“周一报警前让他签。——屿”。"},{"id":"c_study2","title":"摄影包的分装瓶","text":"黑色摄影包侧面并排四个袋格，三格里插着40毫升透明按压分装瓶（洗发水、镜头清洁液），瓶身都贴着印蓝色细线边框的白色标签，第四格空着，只剩一圈压痕。包里夹着一张工整的手写便条：“红线：不拍花生，不提过敏。老板人设＝什么都敢吃。——杰”。"},{"id":"c_study3","title":"账号后台与转账","text":"工作电脑开着“山屿”账号的私信后台。昵称“鹿鸣”的对话从去年九月持续到昨晚，“山屿”每晚十点发来“晚安，不怕，慢慢来”。转账页有一笔十二万八，备注“小院基金”。后台实名认证写着“许敏”，登录设备栏：“工作电脑·贺杰”。"},{"id":"c_study4","title":"剪辑软件的日志","text":"剪辑软件的历史记录：21:31 保存工程；到22:03之间没有任何操作；22:03 开始导出“民宿vlog_终.mp4”，22:44 完成。电脑旁的鞋架上，一双灰色软底拖鞋鞋底潮湿，沾着黑色炭灰。"}]}],"suspects":[{"id":"lin","name":"林小鹿","role":"自由插画师","age":24,"look":{"skin":"fair","hair":"long","hairColor":"black","glasses":"none","beard":"none","outfit":"coat","acc":"scarf","mood":"sad"},"bio":"来自外省的插画师，雪封山前一天入住203。登记时自称“来看雪”。昨晚有人听见她在大厅和山屿大吵，之后她回了房间。","demeanor":"说话轻声，紧张就绞围巾，被逼急了会突然呛声。","topics":[{"id":"t_why","q":"你为什么来这里？","lie":true,"a":"就是来旅游呀，看了山屿的视频，想来看看雪。我就是个普通游客，跟他一点都不熟，你们别瞎猜，也别问了。","truth":"我是来见他的。我们在网上聊了一年零两个月，每天晚上十点他都会说晚安。我给他转了十二万八，他说是我们以后小院的基金。我来之前，觉得自己快要结婚了。"},{"id":"t_night","q":"昨晚九点你在哪？","lie":true,"a":"吃完饭就回房间了，一直没出来过。睡前还吃了两片安眠药，一觉睡到天亮，什么都没听见，真的。","truth":"不对。九点我在大厅跟他吵了一架，吵到九点一刻才哭着跑回房间，反锁了门。安眠药是真的，我吃了两片，所以后面的事我真的一点都没听见。"},{"id":"t_feel","q":"你对山屿什么感觉？","a":"我……以前觉得他是世界上最懂我的人。昨晚见到真人，他看我像看一个陌生的住客，连“鹿鸣”是谁都要想一想。那一刻我心里有什么东西碎了，你明白吗？"},{"id":"t_gift","q":"那盒牛轧糖是你的？","needs":["clue:c_kit3"],"a":"是我买的，他在视频里说过爱吃甜的。盒子你们都看见了，封条都没拆！你不会觉得我是想用糖毒他吧？我只是想送他个礼物。"},{"id":"t_threat","q":"你说过要他身败名裂？","needs":["clue:c_cel1"],"a":"说过。气头上谁不说？我是想把聊天记录发到网上，让大家看看他怎么骗人。可我从来没想过动手，我连只鸡都不敢杀。"},{"id":"t_chat","q":"你们聊了多久？","needs":["clue:c_study3"],"a":"一年零两个月。每晚十点的“晚安，不怕，慢慢来”，我都截图存着。可他昨晚站在我面前，说那些话是“花钱请人写的”。那写字的人，我真想当面问一句：你为什么要对我那么好？"},{"id":"t_he","q":"你觉得贺杰怎样？","needs":["clue:c_study3"],"a":"运营的小哥，话不多。昨晚我哭，他递了纸巾，说“不怕，慢慢来”。我当时愣住了，那是……每晚对我说的话。我不敢往下想，也许只是巧合。"}],"confronts":[{"clue":"c_cel1","breaks":"t_night","a":"她盯着那行“21:03 大厅争吵”，嘴唇发白。“你们还录了音？……好，我承认，我跟他吵了。我说的话都是真心的，可我没碰他一根手指，也没碰过他的任何东西！”"},{"clue":"c_study3","breaks":"t_why","a":"她看着屏幕上那一行行“晚安”，手指发抖。“原来在你们面前也瞒不住。这些全是我的……我来，是想亲口对他说一声我愿意。结果呢？”她笑了一下，笑得比哭还难看。"},{"clue":"c_kit3","a":"“这个我认得，丝带是我自己系的。”她吸了吸鼻子，“他说放厨房，连拆都没拆。你们不会觉得，我是想在糖里下毒吧？我连他吃什么都不知道……”"},{"clue":"c_room1","a":"她下意识捂住嘴，往后退了一步。“花生……那杯茶里？我、我没进过厨房，也没进过他的房间！你们要是怀疑我，我就在这儿等着，随便查。”"},{"clue":"c_hall1","a":"她凑近看了很久，摇头。“看不出是谁的手，只看得见腕带是绿色的……我没印象。我昨晚吵完架就跑上楼了，根本不在大厅。”"}],"fallback":"这个我不知道……你别这样看着我，我已经很难受了。"},{"id":"xing","name":"邢大海","role":"装修老板","age":47,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","acc":"pocketwatch","mood":"stern"},"bio":"承包了民宿装修的老板，山屿拖欠他八十六万尾款。前天自驾上山催款，被大雪困住。住205，说自己昨晚早早睡了。兜里总揣着一包黄鹤楼。","demeanor":"嗓门大，爱拍桌子，句句带“老子”，一被问到痛处就吼。","topics":[{"id":"t_debt","q":"山屿欠你多少？","a":"八十六万尾款，拖了八个月！合同写得明明白白，周一前不结，老子就起诉。别以为我不敢，我邢大海干了二十年工程，还没被谁赖过账。"},{"id":"t_night","q":"昨晚你几点睡的？","lie":true,"a":"吃完饭就回205了，看了会儿手机，十点不到就睡。年纪大了熬不住，一觉到天亮，你们别想往我头上扣屎盆子。","truth":"我没睡。九点二十我把他堵在后院火盆边，抽了六七根烟，吵了二十分钟。我火大推了他一把，他摔进雪里，湿得跟落汤鸡。我怕你们说我动手，才瞒着。九点四十我就上楼了。"},{"id":"t_knock","q":"半夜去过202吗？","needs":["clue:c_room3"],"lie":true,"a":"没有。我的门一直关着，谁看见我去过了？你们有种就拿出证据来，别在这儿血口喷人，老子最烦被人冤枉了！","truth":"……去过。十一点过十分，我睡不着，想再逼他一回，在门上敲了几下，还踹了一脚。里头没人应，我以为他装死，骂了两句就走了。要是知道他在里头……"},{"id":"t_hear","q":"你敲门时听见什么？","needs":["ask:xing.t_knock"],"a":"什么声音都没有，静得吓人。灯光从门缝底下透出来，可就是没人说话。我现在想起来后背发凉：他那时候，是不是已经……"},{"id":"t_firm","q":"你自己的公司怎样？","lie":true,"a":"好得很！工程排到明年去了，八十六万在我这儿也就是个零头。我追着要，是为了争口气，不是等米下锅。","truth":"早就空了。两笔银行贷款逾期，工人的工钱欠着，高利贷追到家门口。这八十六万周一收不回来，我周一就得跑路。所以我才拼命逼他，可我要的是钱，他活着我才有指望。"},{"id":"t_vest","q":"你见过他的背心吗？","needs":["clue:c_gar3"],"a":"那件橙色羽绒背心？天天穿。他被我推进雪里那会儿穿的就是它，湿透了。后来他是挂起来烘还是怎么着，老子上楼了，没管。"},{"id":"t_motive","q":"他死了对你有利吗？","needs":["clue:c_hall2"],"a":"放屁！我要的是钱，不是命！他死了，我这八十六万找谁要？找鬼要吗？我比谁都盼着他活着，活着才能赖得掉，也才能被我逼着还！"},{"id":"t_fire","q":"后院的火盆谁烧的？","needs":["clue:c_gar1"],"a":"火盆我坐的，炭是魏姐给我生的。我九点四十走的时候还有火星。后来谁往里头扔了什么，老子哪知道？你去问问谁最后一个去的后院。"},{"id":"t_who","q":"你怀疑谁？","a":"那个小姑娘，晚上闹得最凶。还有那个运营小贺，整天跟在老板屁股后头，我看他看老板的眼神就不对，像个憋着火的炮仗。"}],"confronts":[{"clue":"c_gar3","breaks":"t_night","a":"他盯着那堆烟蒂和人形的雪坑，咬了咬牙：“……行，被你抓到了。是我推的，可我只是推了一把，没下死手！他自己爬起来的，还骂我穷鬼！”"},{"clue":"c_room3","breaks":"t_knock","a":"邢大海脸涨成猪肝色：“那个靴印……是我踢的，我认。可门打不开，我踢一脚泄气怎么了？我要是想杀他，用得着在门口大声嚷嚷吗！”"},{"clue":"c_hall2","breaks":"t_firm","a":"“这是我写的催款函！白纸黑字，我讨债光明正大！”他一把抓过去，翻到后头那页，脸一下黑了，“……谁让你们翻到这张的？”他把纸摔回桌上，“老子的账，轮不到你们看！”"},{"clue":"c_gar1","a":"他蹲下去拨了拨灰：“烧的是什么东西？……药？老子可没往火盆里扔过这种东西。我走的时候就一堆炭，你自己想想谁后来去过。”"},{"clue":"c_room1","a":"“花生？”他一愣，“老子昨晚吃的宫保鸡丁里就有花生，没见谁倒下啊。……他不会是……对这个过敏吧？这些年谁也没跟老子说过。”"}],"fallback":"少来这套，老子没什么好说的。"},{"id":"wei","name":"魏敏","role":"管家兼厨师","age":51,"look":{"skin":"tan","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"apron","acc":"necklace","mood":"tired"},"bio":"在民宿干了四年的管家兼厨师，山屿每天的饮食都由她负责。昨晚她做了晚饭和夜宵，今早敲不开202的门，是她叫的人。","demeanor":"说话快，爱碎碎念，一紧张就拿围裙擦手。","topics":[{"id":"t_routine","q":"山屿睡前喝什么？","a":"一杯姜蜜茶，姜片红枣加他自己那罐蜂蜜，装进保温杯，他自己下来厨房取。四年了，雷打不动。三个月前有粉丝半夜翻墙，他从那以后睡前必插插销。"},{"id":"t_tea","q":"昨晚茶什么时候做的？","a":"九点三十五分，我亲手做的，就姜、红枣、蜂蜜，别的什么都没放。装进杯子放在操作台上，十点他自己下来拿的，已经穿着那件橙背心了，说今天怎么这么晚，端起杯子就上楼了。"},{"id":"t_stay","q":"9点半后你离开过厨房？","lie":true,"a":"没有！我这个人手不离灶，哪儿也没去，一直守在厨房收拾碗碟，不信你们问谁都行，我骗你们干什么！","truth":"我出去过。九点四十几分我儿子来电话，说他在外头又欠了钱，我怕被人听见，跑到后院东墙角那儿说，大概十分钟。厨房那会儿没人。我怕说出来被当成下手的人，才没敢讲。"},{"id":"t_allergy","q":"山屿有什么忌口？","lie":true,"a":"没什么忌口，他什么都吃，天南海北的东西都敢尝，这事他的粉丝都知道，视频里也都拍着呢。","truth":"他花生过敏，很严重，四年了。我给他做饭都是单做。他让我对谁都别说，说一传出去，赞助商要掀桌。我答应了，所以不敢吭声。我真不知道会这样……"},{"id":"t_jar","q":"蜂蜜罐谁碰过？","needs":["clue:c_kit1"],"a":"蜂蜜罐一直放在我柜顶，盖子拧得紧紧的。那种小分装瓶……我们厨房从来不用，我这儿用的是玻璃罐，谁往里头掺过东西，我一眼就能看出来。"},{"id":"t_found","q":"早上怎么发现的？","a":"我六点五十送早餐，敲门没应，又敲了半天。我去叫老周和邢老板，老周肩膀撞了三下，插销座才裂开。山屿倒在地上，那张脸……我这辈子都忘不掉。"},{"id":"t_seen","q":"你出去前见过谁？","needs":["ask:wei.t_stay"],"a":"我去过道口放碗的时候，看见贺杰在大厅里伸着懒腰，说剪片剪得腰疼，出来透口气。那是九点四十一分，我看了钟的。我回来是九点五十二，厨房垃圾桶盖开着，我还嘀咕谁这么没规矩。"},{"id":"t_son","q":"你儿子是怎么回事？","needs":["clue:c_gar4"],"a":"那个挂绳是我儿子送我的，小木牌上刻着“魏”。他赌钱欠了人家三万，找我要。我手头哪有这么多钱？所以才不敢让老板知道，我怕被辞了。"}],"confronts":[{"clue":"c_gar4","breaks":"t_stay","a":"魏姐的手在围裙上擦了又擦：“……这挂绳是我的。我去接了个电话，十来分钟。我不是有意瞒你们，是怕说出来，你们都觉得是我在茶里动了手脚。”"},{"clue":"c_kit2","breaks":"t_allergy","a":"她的眼圈红了：“那一页是我自己写的，‘无任何坚果’几个字，是我提醒自己。老板花生过敏，这事他要我烂在肚子里，可现在人都没了，还守这个干嘛。”"},{"clue":"c_room2","a":"她一见那张卡片就哽住了：“他把药一直揣在左边口袋，我看见过无数次。要是我早两年劝他别瞒着，让大家都知道……”后面的话被抽泣吞掉了。"},{"clue":"c_kit1","a":"“这瓶子不是我们厨房的。”魏姐脸色变了，“里头的酱是花生酱，早饭台上那罐。有人往里头灌了，用完扔在这儿……谁会这么干？”"},{"clue":"c_hall1","a":"她凑近看了又看：“这是衣帽架……这种荧光绿的腕带，拍摄的时候小贺戴一条，老周扫雪也有条反光的，我不敢乱说是谁。对不起，我这脑子一急就乱。”"}],"fallback":"这个我真不清楚，老板的事他很少跟我说。"},{"id":"he","name":"贺杰","role":"民宿运营","age":27,"look":{"skin":"light","hair":"sidepart","hairColor":"black","glasses":"rect","beard":"none","outfit":"hoodie","acc":"headset","mood":"tired"},"bio":"山屿的运营兼摄像，负责拍片、剪片、发内容，在民宿干了两年，整天挂着耳机。昨晚他说自己一直在一楼运营室剪片子，今早第一个去通知魏姐。","demeanor":"语速慢，爱说“可能吧”，对谁都客气，提到老板时嘴角会不自觉绷紧。","topics":[{"id":"t_boss","q":"山屿对你怎么样？","a":"还行吧……可能吧。他脾气大，但出镜的时候挺会装。工资拖了三个月，他说等新赞助到账补齐。我也没办法，我欠着房贷呢，走不了。"},{"id":"t_where","q":"21:30后你在哪？","lie":true,"a":"一直在运营室剪片，从九点半剪到十一点多，一步没出去。厨房、后院我都没去过，魏姐、老周他们可以作证——哦，当然，运营室里没别人。","truth":"我出去过。大概九点四十走的，去了厨房、大厅，又从侧门去了后院，十点前才回来开始导出。我说我一直在剪片，是因为我不想让你们知道我去了哪儿。"},{"id":"t_allergy","q":"你知道他过敏吗？","lie":true,"a":"过敏？没听说过。山屿的人设就是什么都敢吃，镜头前他吃过辣、吃过虫子，哪来的过敏？你们别听外头瞎传。","truth":"我知道。花生，很严重。是我给他定的人设红线：镜头里不能出现花生，不能提过敏，不然赞助商会撤。他随身带着一支肾上腺素笔，放在左边口袋里。"},{"id":"t_yard","q":"你去过后院火盆吗？","lie":true,"a":"后院？没去过。侧门是平时抽烟透气用的，昨晚我没出过那扇门。外头零下十几度，谁没事往火盆跑，可能吧，邢老板在那儿抽了一晚上。","truth":"去了。十点差几分，我从侧门出去，在火盆前站了一会儿，把那支笔扔进炭里。拖鞋沾了灰，回来来不及擦。"},{"id":"t_chat","q":"私信是你回的？","needs":["clue:c_study3"],"lie":true,"a":"账号是公司的，粉丝私信有时我帮忙代回几条，都是套话，没什么特别的。至于哪个粉丝跟他聊了多久，我真记不清。","truth":"“鹿鸣”的每一条消息，都是我写的。一年多，每晚十点。山屿根本不看私信，他只收钱。她在我心里，早就不是粉丝了。可昨晚她来了，站在我面前，却在对着那个骗子说喜欢。"},{"id":"t_vest","q":"你碰过他的背心吗？","needs":["clue:c_hall1"],"lie":true,"a":"没有。老板的东西我从不乱碰，他那件背心挂在衣帽架上烘着，我连那个角落都没走近过，真的。","truth":"是我。九点五十二分，我趁大厅里没人看那边，从他背心左口袋里把笔摸了出来，塞进袖口，之后扔进火盆烧软。杯子里那勺花生酱，也是我拌的。他离了那支笔，撑不过半小时。"},{"id":"t_doc","q":"那份情况说明是什么？","needs":["clue:c_study1"],"lie":true,"a":"什么说明？我没见过这东西。肯定是老板自己打印的，跟我没什么关系，我也从来没打算要签它。","truth":"昨晚八点四十，他把说明拍在我桌上：周一报警前签字，把十七万的账全算在我头上，否则就送我进派出所，还说我的聊天记录都在设备里，铁证如山。他笑着说：你写的情话，值十七万。"},{"id":"t_lin","q":"你对林小鹿怎么看？","a":"一个很单纯的姑娘，被骗了。昨晚她哭着冲上楼，我心里挺不是滋味的。但话说回来，她吵起来的时候是真狠，说要让他身败名裂，我觉得……你们该多留意她。"},{"id":"t_door","q":"运营室侧门怎么回事？","needs":["clue:c_gar2"],"a":"侧门通后院，我平时抽烟透气用的。九点半前我请老周把门闩松开，就是图个方便。别多想，那是我们每天的习惯。"}],"confronts":[{"clue":"c_hall1","breaks":"t_vest","crack":true,"a":"他盯着屏幕里那只戴绿腕带的手，很久很久没说话。然后他慢慢抬起自己的左手，看了一眼腕上的荧光绿，像看一个陌生人的东西。“这不是巧合。”他轻声说，“我也想不出别的解释了。”"},{"clue":"c_gar1","a":"“火盆里烧的是药？”他没有看你，只盯着那截变形的塑料，“山屿的东西……可能吧。可火盆谁都能去，邢老板在那儿抽了一晚上的烟。”"},{"clue":"c_study4","breaks":"t_where","a":"他看着日志，苦笑：“二十一点三十一到二十二点零三，三十二分钟，什么都没动。还有这鞋……你们把时间对得真细。我还以为剪辑软件这种东西，不会有人看。”"},{"clue":"c_gar2","breaks":"t_yard","a":"“软底拖鞋，鞋跟没有印……”他低头看了一眼自己脚上的拖鞋，立刻把脚往后缩了缩，“好吧，我去过后院。可你凭什么说是我？这民宿里穿拖鞋的人多着呢。”"},{"clue":"c_study2","breaks":"t_allergy","a":"他沉默了一会儿，说：“那张便条是我写的。红线是我定的。我怎么会不知道他过敏？每次拍花生相关的内容，赞助商的律师函是我挡的。”他自嘲地笑了笑，“只是我不想说。”"},{"clue":"c_study1","breaks":"t_doc","a":"他的脸一下子变得惨白：“……你们翻我桌子？这张纸，是他逼我签的，我没签，一个字都没签！可我只是个拿工资的，凭什么替他背十七万？”"},{"clue":"c_study3","breaks":"t_chat","a":"他伸手挡了一下屏幕，指节发白：“别念了。那些话，是我写的。一年两个月，每一句都是我一个字一个字敲出来的。她在对着我说话，只是她不知道。”"},{"clue":"c_kit1","a":"“一个小瓶子而已。”他说，“这种瓶子我有一堆，分装洗发水、镜头水，哪里都有。你想说什么，直接说。”声音很平，但他握着杯子的手明显在抖。"},{"clue":"c_cel1","a":"“偷拍的小孩啊。”他叹了口气，“他跟了我们一天，我就觉得不对劲。不过他拍的东西，跟我又有什么关系？”"}],"fallback":"这个……我真不太清楚，要不你再问问别人？"},{"id":"su","name":"沈晴","role":"自由摄影师","age":36,"look":{"skin":"light","hair":"ponytail","hairColor":"black","glasses":"none","beard":"none","outfit":"coat","acc":"scarf","mood":"tired"},"bio":"登记为“沈晴”，自称自由摄影师，说第一次上山拍雪景。住201，和死者的202只隔一堵墙。昨晚说自己睡得很沉。","demeanor":"话少，目光很沉，回答前总要停顿一下，像在斟酌措辞。","topics":[{"id":"t_why","q":"你为什么上山？","lie":true,"a":"拍雪景。朋友推荐的这家民宿，我是第一次来，没想到会被大雪困在这儿，还碰上这种事。","truth":"我叫苏晴，“沈晴”是假名。三年前十月，我妹妹苏岚住进这家民宿，说要上山拍日出，之后再没回来。警方只查到她最后在这里登记过。我用假名订房，就是想弄明白她到底怎么没的。"},{"id":"t_night","q":"昨晚你听到什么？","lie":true,"a":"什么都没听见。我睡得很沉，这房子的隔音又挺好的，隔壁有没有动静，我是真的完全不知道。","truth":"我听见了。十点四十前后，隔壁有“咚、咚”的撞墙声，隔很久一下。我以为他发酒疯，或者……我恨他，所以没敲门。一想到我可能听着一个人死，我整夜没合眼。"},{"id":"t_sister","q":"你妹妹是怎么回事？","needs":["clue:c_cel2"],"a":"那个包是岚岚的，吊牌是我给她写的。他把它藏在地窖里三年。我恨不得杀了他——可我没有，我昨晚只想问清楚她那天到底是怎么没的。"},{"id":"t_name","q":"“沈晴”这个名字？","needs":["clue:c_hall3"],"a":"胶带下面是我的真名。我知道用假名不对，可山屿这三年一直说“不认识苏岚”，我要是报真名，他连门都不会让我进。"},{"id":"t_fire","q":"21:50你在哪？","needs":["clue:c_hall1"],"a":"在壁炉边，和那位许老师聊天，聊到快十点。她说话挺冲，人不坏。那个时候我背对衣帽架，什么也没看见——我要是回头多看一眼就好了。"},{"id":"t_hate","q":"你恨他吗？","a":"恨。可恨一个人，和杀一个人，中间隔着很远。我要的是真相，不是他死。他死了，岚岚的事就更没人说得清了。"},{"id":"t_ask","q":"你问过他吗？","a":"昨天傍晚我试探着问过他一次，三年前有没有一个姓苏的女孩住过。他看都没看我，说“客人太多，记不清”。那一瞬间我就知道，他在说谎。"}],"confronts":[{"clue":"c_room3","breaks":"t_night","a":"她盯着墙根那几处磕痕，嘴唇动了动：“……是我隔壁那面墙。”过了很久她才开口：“我听见了，我一整夜都听见。我不该装没听见。”"},{"clue":"c_hall3","breaks":"t_why","a":"“那个‘苏’字，是我的。”她声音很平，“我早就料到会被人看出来。我不是来害人的，我是来找人的。”"},{"clue":"c_cel2","a":"她的手指在吊牌上停了很久。“……这是岚岚的字，是我给她写的。他居然留着，在地窖里，放了三年。”她吸了口气：“你们现在还觉得，我只是来拍雪的？”"},{"clue":"c_room1","a":"“花生？”她皱了皱眉，“他在视频里什么都吃，我以为他百无禁忌。原来是装的。人设这东西，真是比命还重要。”"},{"clue":"c_hall1","a":"她看了一遍，摇头：“画面里的我们俩是背对镜头的，我只记得那时和许老师聊得很投入。那只手是谁的，我没法判断。”"}],"fallback":"我只想知道妹妹的下落，别的我没兴趣。"},{"id":"xu","name":"许敏","role":"瑜伽教练","age":38,"look":{"skin":"fair","hair":"bun","hairColor":"brown","glasses":"round","beard":"none","outfit":"turtleneck","acc":"earrings","mood":"stern"},"bio":"登记为“许老师”，瑜伽教练，说是山屿的粉丝，来看看真人。住204，昨晚说自己十点就睡了。","demeanor":"冷静、克制，说话像在教课，一生气就语速变慢。","topics":[{"id":"t_know","q":"你认识山屿吗？","lie":true,"a":"不认识。我就是个粉丝而已，看了他两年视频，这回来看看真人。你们别拿这个做文章，没意思。","truth":"我是他前妻。离婚两年了。“山屿”这个号当年是用我的身份证注册的，我陪他从零做起，现在它有一百二十万粉丝，收益我一分没分到。"},{"id":"t_night","q":"昨晚你几点上楼？","lie":true,"a":"吃完饭聊了会儿天，十点就回204睡了。后面没出过门，也没有听见任何的动静，别再问了。","truth":"不是。大概十点二十，我去敲过202的门，想跟他谈账号过户的事。里头有声音，很哑，像吸不上气，他说“别……烦我”。我以为他又喝多了，骂了一句就回去了。"},{"id":"t_allergy","q":"你知道他过敏吗？","needs":["clue:c_study3"],"a":"知道。结婚三年我给他备过两次药。他最恨别人提这个，说一提就毁人设——什么都敢吃的山屿。那支笔他一直放左边口袋，从来不离身。"},{"id":"t_acct","q":"账号怎么回事？","needs":["clue:c_study3"],"a":"实名认证写的是我。我是法定所有人，这次来就是要他签字把号转还给我，他一直拖。说句公道话，现在那个“山屿”早就不是我认识的人了，文案很多根本不是他写的。"},{"id":"t_fire","q":"21:50你在哪？","needs":["clue:c_hall1"],"a":"壁炉边，和住201的那位聊天，聊到快十点。有个人在衣帽架那边晃了一下，我没回头，以为是谁在找外套。"},{"id":"t_div","q":"你们为何离婚？","a":"他变了。人设立住以后，他需要的是粉丝，不是老婆。我劝他别把假的当真的，他说：“真的没人看。”那天我就知道没法过了。"},{"id":"t_news","q":"得知死讯你什么反应？","a":"我站在门口看了很久，没哭。可回房间后，我把脸埋在毛巾里，哭了半个小时。离了婚的人，原来也会为这种事哭。"}],"confronts":[{"clue":"c_cel1","breaks":"t_night","a":"“浅色睡袍，两分钟。”她盯着那行字，苦笑：“被人拍到了啊。对，是我，我在门外站了两分钟。我真希望那时候我多敲几下。”"},{"clue":"c_study3","breaks":"t_know","a":"她看着“实名认证：许敏”几个字，忽然笑了，笑意没到眼底。“好了，不演了。我就是他前妻。这账号，一开始是我的名字。”"},{"clue":"c_room2","a":"她拿起那张卡片，指尖在“花生严重过敏”几个字上停了一瞬，又放下：“这种事，他的粉丝圈里传过。那支笔应该就是他一直带在身上的那种。”"},{"clue":"c_hall1","a":"“绿腕带……”她眯起眼睛，“我那天只顾着跟人说话，没看见。你们是想说，有人趁我们在壁炉边的时候动了手脚？”"},{"clue":"c_study1","a":"她看完整张纸，嗤了一声：“他又来这一套。把锅甩给手下人，这种事我见得多了。贺杰这孩子，是被他逼到墙角了。”"}],"fallback":"这个跟我没关系，你问别人吧。"},{"id":"zhou","name":"周守山","role":"杂工兼向导","age":58,"look":{"skin":"brown","hair":"cap","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"jacket","mood":"tired"},"bio":"山下村里人，在民宿做杂工兼向导十年，今早是他撞开了202的门。说自己昨晚扫完雪就回柴房睡了。","demeanor":"寡言，带浓重乡音，爱说“莫得事”，被追问就低头抽烟。","topics":[{"id":"t_job","q":"你在这儿做什么？","a":"扫雪、劈柴、修水管，客人上山我带路。山上哪块石头松，哪条沟有冰，我闭着眼都晓得。十年了，山屿老板待我……莫得说的，给饭吃。"},{"id":"t_night","q":"昨晚你在哪？","a":"扫完雪回柴房躺着，睡不着。十点过后去了趟地窖，那儿清静，坐了好一阵才回去。莫得别的事，你们莫乱想，我一个老头子哪有那个力气折腾哦。"},{"id":"t_missing","q":"三年前苏岚的事？","lie":true,"a":"那个姑娘？听说是自己上山走丢的，我莫得印象，也不清楚。山里头每年都有人走丢的嘛。","truth":"是山屿带她去走封闭的老道，说要直播“没人去过的日出”。我跟在后面，她在冰壳上滑下去的……老板说别报警，直播已经开了，一报警号就完了。他给我涨了五百工钱。我欠那姑娘一条命。"},{"id":"t_door","q":"早上撞门是怎么回事？","a":"魏姐喊我，我和邢老板去的。门是从里头插死的，我肩膀撞了三下，插销座才裂。门一开，他倒在地上，脸肿得吓人。莫得人进去过，我敢拿脑壳担保。"},{"id":"t_vest","q":"你见过他的背心吗？","a":"那件橙色的？昨晚我扫完雪进屋，看见挂在大厅衣帽架上，湿的。十点前后他自己来拿，穿上就去厨房取杯子，然后上楼了，我远远看见的。"},{"id":"t_hej","q":"你对贺杰了解多少？","needs":["clue:c_gar2"],"a":"那孩子命苦，老板让他干十个人的活，工资还拖。昨晚九点半前后他让我把运营室侧门的闩松开，说抽烟透气方便。那门平时都闩着，他那天特意交代的。"},{"id":"t_band","q":"你戴过荧光腕带吗？","needs":["clue:c_hall1"],"a":"反光那种？扫雪的时候戴，一条挂在柴房墙上，昨晚没戴。要看你自己去看，我穿胶靴、戴手套，大厅里那种细活，我干不来。"},{"id":"t_hate","q":"你恨山屿吗？","needs":["clue:c_cel3"],"a":"恨过。三年的封口费，你当那点钱买得了觉？我每月拿着那五百块，手都是抖的。可他死了，我也莫得高兴，只是……那姑娘还在山上。"}],"confronts":[{"clue":"c_cel2","breaks":"t_missing","a":"老周盯着背包吊牌上的名字，嘴唇抖了抖：“……苏岚。你们真找到了。杯子还没干，我昨晚就坐在这儿，陪这姑娘坐了一阵。”"},{"clue":"c_hall3","breaks":"t_missing","a":"他看着被撕走的那一页，摸出烟又塞回去：“那页是三年前老板亲手撕的。他说不撕，会有人顺藤摸瓜。我劝过，他不听。”"},{"clue":"c_cel3","a":"他把本子抢过去攥在手里，半晌才松开：“那是我的账……拿封口费这事，我记了三年。那姑娘还在山上，我记着，一天都不敢忘。”"},{"clue":"c_room1","a":"“花生？”老周皱起眉，“难怪魏姐做饭，总是给老板单开灶。我还当是他嘴刁，原来是怕这个。”他叹了口气，“怪不得，怪不得……”"},{"clue":"c_gar2","a":"他蹲下看那串脚印：“软底拖鞋，鞋跟莫得印子，是屋里人穿的。不是我，我穿胶靴，一脚一个大坑。”"}],"fallback":"我莫得啥说的，你问别个吧。"},{"id":"qiao","name":"乔木","role":"徒步学生","age":20,"look":{"skin":"light","hair":"messy","hairColor":"brown","glasses":"none","beard":"none","outfit":"hoodie","mood":"sly"},"bio":"外地大学生，说是徒步路过，昨天傍晚被大雪逼进民宿，花八十块睡在地下储藏间的铺位。昨晚说自己一觉睡到天亮。","demeanor":"语速快，爱抖机灵，爱用网络梗，被问急了就抓头发。","topics":[{"id":"t_why","q":"你为什么在这儿？","lie":true,"a":"徒步路过的，下午雪太大，魏姐好心让我睡地下室。就这么简单，大学生穷游，你们懂的。","truth":"我做“拆穿”类短视频，账号叫“木头说山”。我早就怀疑山屿的人设造假，专门上山偷拍，地下室就是图便宜。相机我藏在大厅书架上，拍了他一整天。"},{"id":"t_night","q":"昨晚你听到什么？","a":"九点多大厅吵架，我在楼梯拐角偷听。女的说“你不是他，你不是跟我聊天的人”，男的笑着说“你充钱买的是故事”。我录了音，手机放在地窖，等下可以给你们听。"},{"id":"t_stairs","q":"你昨晚上过二楼吗？","lie":true,"a":"没有啊，我一直在地下室待着，晚上只出去上了趟厕所，就在一楼，二楼我可不敢上，怕被赶出去。","truth":"上去过。二十二点二十，我偷偷上二楼想拍点素材，路过走廊时看见一个女客站在202门口，我赶紧缩回楼梯口，没敢拍。回来我就把这事写进笔记了。"},{"id":"t_cam","q":"相机拍到了什么？","needs":["clue:c_hall1"],"a":"我自己回看过，镜头太低，只拍到手。是男人的手，指节偏细，戴着荧光绿的腕带，运动手环那种。我没细看是谁，当时只觉得……这只手在拿东西。"},{"id":"t_audio","q":"录音里还有什么？","needs":["ask:qiao.t_night"],"a":"吵到最后，山屿说：“那些话是我花钱请人写的，你要找温柔的，去问写字的人。”那姑娘当时一下就不说话了，站了好久才跑上楼。"},{"id":"t_fan","q":"你为什么盯着山屿？","a":"他靠骗人赚钱，我看不惯。又吃又拿又骗，一百二十万粉丝还说自己是“真实”，我就想看看他到底有多真。"},{"id":"t_sleep","q":"你睡在哪儿？","needs":["clue:c_cel2"],"a":"我这个铺位就在酒坛后头，离那只红色背包不到三米。老周昨晚十点多下来过，我装睡没理他。他坐了很久，一直在念“对不起”，我听着都起鸡皮疙瘩。"}],"confronts":[{"clue":"c_hall1","breaks":"t_why","a":"他挠头：“MU，是我的标签，被你们找到了。好吧，我是偷拍党，相机是我藏的。但我拍的是他的人设，不是他的命，我可没想到会拍到这种东西。”"},{"clue":"c_cel1","breaks":"t_stairs","a":"他叹气：“行行行，我上去过，笔记本都被你们翻了。可我就看了一眼，什么都没碰。我只想拍素材，不想惹麻烦。”"},{"clue":"c_study3","a":"他凑过来看了看后台：“嚯，十二万八……这就是传说中的‘榜一大姐’待遇？我之前只知道他会骗，不知道他骗得这么狠。”"},{"clue":"c_room2","a":"他倒吸一口凉气：“左口袋，一支笔……我拍他三天，他一直把手揣在左口袋里，我还以为他有什么坏习惯。原来是在护着命。”"},{"clue":"c_gar1","a":"“哇，你们连火盆都翻了？”他吹了声口哨，又立刻收住，“……不好意思，我这个人一紧张就想打岔。那东西是被人故意烧的吧？”"}],"fallback":"这个你问我不如去看我的素材，哈哈，开玩笑的。"}],"solution":{"culprit":"he","method":{"q":"房间从里面反锁，凶手是怎么杀人的？","options":["凶手用细线从门外拉上插销，作案后伪造成密室","往山屿每晚必喝的姜蜜茶里拌入花生酱，并事先取走他随身的肾上腺素笔，让他自己锁门后发病身亡","在茶里下了安眠药，趁他昏睡后用枕头捂死，再从窗户爬出","趁他不备用钥匙进屋行凶，随后从外面把门反锁"],"correct":1},"motive":{"q":"凶手为什么杀人？","options":["为三年前失踪的苏岚复仇","因为山屿拖欠巨额装修款而起了杀心","山屿要他签字替自己背诈骗的黑锅，并且长期拖欠工资、利用他的文字骗钱","为了夺回被前妻注册的账号归属"],"correct":2},"keyClues":["c_room1","c_room2","c_hall1","c_gar1","c_study1","c_study2"],"truth":["凶手是运营贺杰。山屿并不是被人闯进反锁的房间杀死的，他是自己锁上门、自己喝下掺了花生酱的姜蜜茶，在找不到救命药的情况下，在屋里慢慢窒息而死。","山屿花生严重过敏，却靠“什么都敢吃”的人设赚钱，这一点只有魏敏、许敏和贺杰知道。贺杰正是这个人设的设计者，也是以“山屿”的口吻和林小鹿聊了一年多的人。","昨晚八点四十，山屿把一份《情况说明》拍在贺杰桌上，要他周一报警前签字，承认长期冒用身份收款十七万，替自己背黑锅，工资也欠了三个月。贺杰在二十一点四十离开运营室，趁魏敏出去接电话，在厨房把花生酱拌进保温杯里的姜蜜茶，又在21:52从挂在衣帽架上的湿背心左口袋里拿走了肾上腺素笔，扔进后院火盆烧毁。","22:05山屿拿着杯子上楼，习惯性插上了插销，22:10前后喝下茶，姜的辛辣盖住了味道，而那支笔在他口袋里放了好几年，他从不检查。22:15开始发作，他翻遍背心和抽屉也找不到药，喉头水肿，叫不出声，也没力气走到门口；22:20许敏在门外只听见他嘶哑的“别烦我”，以为他又喝多了；22:40他撞墙求救，隔壁的苏晴听见却没出来；他在约22:50死去，23:10邢大海敲门也无人应答。","这一切在现场被凑成了“密室”：门窗内锁，没人进过屋。其实真正的杀人手法在门外——杯子里的花生酱，和一支被拿走的笔。","证据环环相扣：保温杯里有花生酱，背心口袋被掏空、抽屉被翻乱，说明他在找药；乔木藏在书架后的相机拍下一只戴荧光绿腕带的手在21:52从背心里取走了东西（老周扫雪也有一条反光腕带，但他穿胶靴，并非火盆边那串软底拖鞋的主人）；火盆里烧剩的药笔与标签对上了山屿；摄影包里便条证明贺杰早知道过敏，包里四格瓶少了一个，垃圾桶里撕掉标签的空瓶，规格和残留的标签样式都对得上；运营室里待签的《情况说明》，则说明了他的动机。","他谎称一直在剪片，但剪辑日志有半小时空白、软底拖鞋沾着火盆里的炭灰，魏敏出门前也看到他在大厅，而且他还不得不承认自己知道山屿过敏。至于林小鹿，她愤怒、绝望，却从没碰过他的茶和衣服；那盒花生牛轧糖，到死都没拆封。"]}},{"id":"troupe","title":"最后一场","tagline":"解散前的告别演出，灯灭三分钟，再亮时台柱已经没有了呼吸。","difficulty":3,"cover":"coverTheater","tone":"purple","brief":"暮光剧社在纺机剧场演最后一场《雨夜归人》，演完就解散。下半场演到第三场，整个剧场忽然断电，黑了整整三分钟，灯亮后团长兼导演方知远没有按时上场。灯亮十分钟后，演员在后台化妆间发现了他的尸体。观众被扣在场内，警方只听到一段录音里的巨响，就断定他死在黑暗中。刑警队的朋友深夜把你请来，让你在天亮前看清这间小剧场里每个人真正的位置。所有人都说，最该被怀疑的人是掌管灯光的陈野。","victim":{"name":"方知远","desc":"暮光剧社团长、导演兼台柱演员，五十二岁。伏在后台化妆间的化妆台前，左侧头部被重物击伤，戏服大衣还挂在衣架上，脸上的底妆只涂了一半。","look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"shirt","mood":"stern"}},"publicFacts":["暮光剧社的告别演出《雨夜归人》，十九点三十分开演，中场休息二十点三十五分到二十点五十五分，下半场二十点五十五分开始。","方知远二十一点前后在化妆间通过旁白话筒念完下半场开场旁白，音控确认这是他最后一次被人听到的声音。","二十一点十二分到十五分，剧场供电中断三分钟，调光柜归零，灯光师陈野当时称自己什么也没碰；停电期间唐婉清持提灯在台上撑场。","二十一点二十分，方知远应在第四场上场却没有出现；二十一点二十五分，新人演员乔小满与舞美贺长根推开化妆间的门，发现了尸体。","现场凶器是走廊道具桌上的黄铜烛台。警方初步判断：音控回放里二十一点十三分有一声巨响，凶手趁停电行凶。","所有观众和剧社成员被留在剧场内，等待问话。"],"timeline":[{"t":"19:30","text":"《雨夜归人》开演，上半场顺利结束。"},{"t":"20:55","text":"下半场开场，方知远在化妆间候场。"},{"t":"21:00","text":"方知远在化妆间对着旁白话筒念完下半场开场旁白，之后话筒静音。"},{"t":"21:12","text":"剧场供电中断，台上一片漆黑；唐婉清持提灯继续演出。"},{"t":"21:15","text":"灯光恢复。乔小满按排场表去叫方知远候场，无人应答。"},{"t":"21:20","text":"方知远未按时上场，其他演员即兴补戏。"},{"t":"21:25","text":"乔小满与贺长根推开化妆间的门，发现方知远死亡。"},{"t":"21:32","text":"剧社报警，警方封锁化妆间并通知你。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"stage","name":"舞台与控台","scene":"stage","desc":"黑盒剧场的小舞台和观众席后方的控台。舞台上还留着第二幕的雨夜布景，台口放着一盏电池提灯，控台上的屏幕亮着。","clues":[{"id":"c_stage1","title":"后台监听录音","text":"音控电脑里导出的“后台走廊监听”通道，放大增益后只有两处异响：21:02:10 一声很轻的闷响，随即是平直底噪；21:13:02 一声响亮的重物倒地声，起音很齐整，尾部渐弱。音控电脑和监听走的是独立的不间断电源，没有受停电影响。警方听的是后一处。两处响度相差悬殊，中间十一分钟再无人声。"},{"id":"c_stage2","title":"灯光台操作日志","text":"灯光台屏幕上的执行记录：Cue29 20:58:40，Cue30 21:09:50，Cue31 21:11:58，之后到 21:15:00 没有任何指令；21:15:00 灯光台“重新上线”，调光柜电源灯同时亮起。旁边便签是陈野手写：“调光柜 21:12 市电归零，21:15 回 220V，无跳闸记录。”"},{"id":"c_stage3","title":"音效库文件夹","text":"控台笔记本上的音效库，第三幕用的素材有 cue15 雨声、cue16 门铃，以及 cue17_重物倒地.wav，创建者署名“共享盘同步”。文件夹的访问记录显示该文件 9 月 2 日被“票务账号”从共享盘下载过一次。cue17 在今晚第三幕才会用到，尚未播放。"}]},{"id":"back","name":"后台化妆间","scene":"backstage","desc":"后台走廊尽头的单人化妆间，方知远的专属位置。门外还挂着“勿扰”牌，门口拉了警戒带，屋里灯光发白，镜框一圈灯泡亮着。","clues":[{"id":"c_back1","title":"化妆间的尸体","text":"方知远趴在化妆台前，左侧头部凹陷，血已发黑凝固。他只穿衬衫，“老团长”的大衣还挂在衣架上，脸上的底妆只涂了半边，已经干透起皮。旁边地上滚着一只沾血的黄铜烛台，是第三幕要用的道具，原放在走廊的道具桌上。"},{"id":"c_back2","title":"戏服箱里的旧手机","text":"角落的戏服箱最下层、两件旧戏服中间压着一部旧安卓手机，屏幕碎角，背面贴着一张标签纸：“团产 票务-03”。闹钟界面有一条 21:13 的闹钟，已响过，铃声文件显示为 cue17_重物倒地.wav，音量调到最大，旁边没有其他应用被打开过。"},{"id":"c_back3","title":"方知远的手机","text":"死者的手机屏幕亮着，聊天记录里：20:30 他发给唐婉清“演完来我化妆间，把你签的合同拿来谈。”对方回“我没什么好谈的”；20:50 他发给“许会计”：“九点整，化妆间。只给你五分钟。别告诉别人。”20:51 回复一个字：“好。”"},{"id":"c_back4","title":"走廊的道具桌","text":"走廊上的道具桌空着一个位置，桌面上一圈灰尘印子正好是烛台底座的大小。桌边放着“勿扰”牌的挂钩，旁边的墙上没有监控。走廊顶上有一只黑色小话筒，线接进台口的音控设备。"}]},{"id":"cellar","name":"道具仓库与配电角","scene":"cellar","desc":"舞台下方的地下仓库，堆着旧布景、道具箱和一只老保险柜。一角是调光柜的配电角，电缆沿着墙根爬向舞台，空气里有灰尘和樟脑味。","clues":[{"id":"c_cellar1","title":"电缆上的定时插座","text":"调光柜的供电电缆没有直接插墙，而是经一只白色的数显定时插座接入墙插。插座面板上的程序一栏显示：1 号 关 21:12，开 21:15，每日重复。插座外壳很新，面板边缘还有没撕净的包装胶带残迹。墙面上方的总闸盒完好，没有被拨动。"},{"id":"c_cellar2","title":"仓库出入登记簿","text":"仓库门口挂着一本手写登记簿，规定“进出必签”。今晚三行：19:58 许 取找零备用金；20:38 贺 取座钟箱；21:03 陈 取外租灯×2。每行后面有签名，字迹各不相同。保险柜钥匙挂在墙上的钥匙板，板上标着“许 / 贺 各一把”。"},{"id":"c_cellar3","title":"空的座钟木箱","text":"角落里一只花梨木大箱，箱盖半开，里头只剩泡沫衬垫，箱内壁贴着旧标签“民国座钟 库存”。盘点表上这一栏被人用铅笔轻轻划了一下，旁边一行小字：“待核”。箱底落着一张拍卖行的名片，名片是新的。"}]},{"id":"hall","name":"前厅与观众席","scene":"hall","desc":"剧场入口的前厅和后面的小观众席。柜台、海报和一台挂在墙角的监控摄像头，观众已被留在原位等待问话。","clues":[{"id":"c_hall1","title":"前厅监控回放","text":"前厅摄像头覆盖柜台、大门和通向员工通道的侧门。回放：20:52 金永昌起身出大门；20:57:20 许敏锁屏、拿起灰开衫穿进员工通道侧门；21:07:10 她从同一扇门回来坐下；21:08:30 金永昌回到前厅；21:12 起画面一片漆黑，直到 21:15（前厅的灯和调光柜接在同一路上）。"},{"id":"c_hall2","title":"保安亭值班记录","text":"剧场外保安亭的值班本上记着：“20:53 金总车（黑色奥迪）停在东侧车位，车内另一男子；21:07 男子下车离开，金总 21:08 回楼。”旁边备注一个手写的名字“宏远置业·赵”。保安补充说，两人在车里待了一刻钟，车窗一直关着。"},{"id":"c_hall3","title":"观众席F12座位","text":"观众席 F 排 12 号放着一件米色风衣和一本写满批注的剧本，剧本署名页上被人用笔画了个圈。邻座观众说，这位女士一直坐在这里，“下半场刚开场没多久就站起来走了，一直到停电结束后好一阵才回来”。座位旁的地上落着一枚抽烟时蹭到的烟灰。"},{"id":"c_hall4","title":"停电时的观众视频","text":"一位观众用手机拍下了停电的三分钟：黑暗中，唐婉清提着电池提灯站在台中央，光圈只照亮她半身，她一句句把台词念完，中间没有停顿、也没有离开光圈。台下的手机光点亮成一片，前排有人小声说“好险，还好有她”。"}]},{"id":"study","name":"团长办公室","scene":"study","desc":"二楼不大的办公室，墙上贴满历年海报，办公桌上堆着文件和一台老式打印机。方知远习惯在这里写排练笔记，门锁着，由警方带你进去。","clues":[{"id":"c_study1","title":"审计函与银行流水","text":"桌上摊着区文旅局的专项补贴审计通知：下周一上午进场审计。下面压着一叠银行流水打印件，红笔圈出十几笔转出，每笔都进入同一个个人账户（尾号 7316），合计 38.6 万元，页脚是方知远的笔迹：“周一前当面问清，先别声张。”"},{"id":"c_study2","title":"报销单与资产登记","text":"办公室文件夹里夹着两样：一张 9 月报销单，品名“数显定时插座×2（仓库节能用）”，经办人许敏，收款账户尾号 7316；一页团产登记表，“票务-03 旧手机，保管人：许敏，用于扫码验票”。两行字都有许敏的签名。"},{"id":"c_study3","title":"违约追偿函草稿","text":"打印机里卡着一份没发出的函：“致唐婉清：你未经剧社同意与星河影视签约，违反《演员合约》，追偿违约金 80 万元。”落款方知远，日期是今天。另有一张附注：“金总想月底前拿到解散协议，别让他拖到下周。”"},{"id":"c_study4","title":"被改过的署名页","text":"剧本署名页的复印件上，“编剧：苏孟”被划掉，改成“导演/编剧：方知远（原作：苏孟）”，页边是方知远的批注：“演出版权归剧社，一切以我为准。”背面有一行潦草的字：“苏孟——你欠我的，我不欠你。”像是别人写的，又被涂掉了一半。"}]},{"id":"dining","name":"后台休息室","scene":"dining","desc":"后台的休息室兼茶水间，一张长桌、几把折叠椅、一个电热水壶和半面墙的服装架。演员们候场时在这里喝水、抽空吃口东西。","clues":[{"id":"c_din1","title":"休息室出入白板","text":"休息室门边的白板上，大家用磁贴写着出入时间：“乔 20:57 出（取充电器）／21:01 回”“唐 20:55 上场”“贺 20:50 出／21:00 回”。白板边上贴着排场表：“21:15 乔：叫方导候场；21:20 方导上场（第四场）”。"},{"id":"c_din2","title":"沙发上的旧团服","text":"角落沙发上扔着一件旧团服外套，胸口绣着“暮光”，后背贴着一张“晨星剧社”的新临时贴。口袋里一张后台通行证，上面压着签收印“20:48”，通行证已过期一年。沙发垫上还有半盒没吃完的外卖。"},{"id":"c_din3","title":"垃圾桶里的便条","text":"垃圾桶里一团揉皱的打印便条，纸角有咖啡渍，内容是：“方导，请核对文旅补贴专户的流水，尤其是尾号 7316 的转入。别问我是谁。”字是剧社打印机常用的宋体，纸张和办公室里的打印纸一样。同一只桶里还扔着一只喝空的拿铁外卖杯，杯套上手写着“小满”，杯底的残渍和便条上的咖啡渍颜色相同。"}]}],"suspects":[{"id":"chen","name":"陈野","role":"灯光音响师","age":34,"look":{"skin":"tan","hair":"messy","hairColor":"black","glasses":"none","beard":"stubble","outfit":"hoodie","acc":"headset","mood":"worried"},"bio":"剧社的灯光兼音控，一个人守着控台。停电发生在他的调光台上，所有人第一反应都看向他。他说自己整个下半场都没离开过控台。","demeanor":"语速快、爱说行话，嘴硬，一急就挠头发，句尾带“我跟你讲”。","topics":[{"id":"t_role","q":"你在剧社做什么？","a":"灯、音一把抓，全场上百个 cue，哪个该按哪个不该按，都在我手里。剧社穷，谁都一人当三人使。方导说过，我这台子就是剧社的心脏——结果最后一场心脏停了三分钟。"},{"id":"t_booth","q":"下半场你离开过控台吗？","lie":true,"a":"没有，从头到尾没挪窝。每个 cue 都是我手按的，不信你看日志。我跟你讲，停电的时候我都吓傻了，灯台屏幕全黑，我什么键都没碰，就坐在那儿等。","truth":"我离开过，21:03 到 21:09 之间。那会儿灯光静场十分钟，我跑下仓库拿两盏外租的 LED 灯。我私下把剧社备用灯租给婚庆公司，一晚三百。我怕方导知道，才说没离开。"},{"id":"t_blackout","q":"停电是怎么回事？","a":"我也想知道！调光柜 21:12 整个没电，不是我这边断的，台上所有灯一起灭。警察一听就认定是我，说灯是你管的，你最清楚。我跟你讲，我是被冤枉的。"},{"id":"t_auto","q":"灯为什么自己亮了？","needs":["clue:c_stage2"],"a":"问到点子上了。跳闸要有人去合闸，可它 21:15 整，一秒不差自己上线了。这不是跳闸，是有人给供电设了时间。我跟警察讲过，他们说我在推卸，没人愿意听。"},{"id":"t_rack","q":"你下仓库见过电缆吗？","needs":["clue:c_cellar1"],"a":"下午五点我巡检过，调光柜电缆是直插墙的。21:03 我下去，看到中间多了个白插座，我以为是贺老加的防浪涌插排，没细看，拿了灯就走。要是早多看一眼……"},{"id":"t_who","q":"你觉得谁有理由害他？","a":"多了去了。编剧苏孟和他为署名吵了半年；金总想拆楼，方导不松口；唐姐签了影视约，他气得要追偿。我就是个打灯的，谁愿意杀他，我哪知道？"},{"id":"t_cue17","q":"cue17 是什么？","needs":["clue:c_stage3"],"a":"第三幕的“重物倒地”音效，倒了好几年了。共享盘里谁都能下，票务和财务共用一个账号，我也懒得管权限。我没动它，今晚也没放。放它做什么，第三幕还没到呢。"}],"confronts":[{"clue":"c_cellar2","breaks":"t_booth","a":"他挠了挠头发，半晌才说：“……我签字了。我真是笨，签了字还撒谎。”声音低下来，“好吧，我去了仓库，拿租出去的灯。您千万别告诉方导——哦，他已经……”话没说完，他的喉结滚了一下。"},{"clue":"c_stage2","a":"“对，这就是我说的！”他一下子来了精神，“没有指令，供电自己归零又自己回来。我跟你讲，灯台没有一点错。要是有人说我手脚不干净，把这份日志拍到他脸上。”说完才发觉自己说得太响，赶紧压低声音。"},{"clue":"c_stage1","a":"他把耳机凑近，来来回回听了三遍。“这两声……不对，一声轻，一声重。重的那声我在控台根本没听见，监听那一路我早就推下去了。轻的那声，要放大才有。”他抬头，脸色发白：“这是两回事啊。”"},{"clue":"c_cellar1","a":"他蹲在显示屏前盯着照片，倒抽一口凉气：“就是它！我当时就觉得别扭，怎么没拔掉……”随即拍了一下自己的大腿，“您说，要是我当时拔了，这三分钟就没有了，方导也许……”他停住，没有说下去。"},{"clue":"c_back2","a":"“旧手机？”他皱着眉，“票务的那种，扫码用的，我们好几部。闹钟铃声设成音效？谁想得出来……”他忽然压低声音，“这个人懂我们这行的东西，起码知道 cue17 在共享盘的哪个文件夹。”"}],"fallback":"这个我真不清楚，我就是个打灯的，别拿我当替罪羊。"},{"id":"su","name":"苏孟","role":"编剧","age":45,"look":{"skin":"light","hair":"long","hairColor":"black","glasses":"round","beard":"none","outfit":"coat","acc":"scarf","mood":"sad"},"bio":"《雨夜归人》的原作者，和方知远合作十年，最近半年为署名与版权闹僵，被禁止进入后台。她说自己整个下半场都坐在观众席 F12 看戏。","demeanor":"说话慢、爱引台词，感情一上来就停顿，眼圈发红，语句带点文艺腔。","topics":[{"id":"t_role","q":"你和剧社是什么关系？","a":"这个本子是我十年前写的，每一句台词我都背得出。方导是第一个读它的人，也是后来把它变成他自己东西的人。剧社要散了，我本来只想在最后一场把话说清楚。"},{"id":"t_feud","q":"你们为署名吵过吗？","a":"吵。从去年到今年，他把“编剧”一栏改成“原作”，说演出版权归剧社。我写的本子，最后连我的名字都只剩半行。我恨过他，可我没想过他会死。"},{"id":"t_seat","q":"下半场你在哪？","lie":true,"a":"就在 F12，从头坐到停电，再坐到谢幕，一步没动。周围的观众都看见我，我连水都没喝。后台我进不去，方导早就禁了，我没必要去自讨没趣。","truth":"我离开过。下半场刚开场我就起身了，想去后台堵他谈署名。我怕被人看见就撒了谎。可我什么都没做，我只是站在门外。"},{"id":"t_sign","q":"署名页上的涂改？","needs":["clue:c_study4"],"a":"那行“你欠我的，我不欠你”是他写的，涂掉一半是他自己都觉得过分。他一向这样，伤了人，又装作什么都没发生。我说过很多狠话，可那是十年的交情啊。"},{"id":"t_heard","q":"你在后台门外听到了什么？","needs":["clue:c_hall3","clue:c_stage1"],"a":"既然你们已经知道我离过席了。大约九点整，我在门外，门里有女人的声音，压得很低，在求他“再给我一点时间”。方导说：“周一我必须如实报告，我是法人。”接着是很轻的一声闷响，我以为是道具掉了，吓得跑出去抽烟，二十分钟后才敢回来。"},{"id":"t_vic","q":"你觉得他是什么样的人？","a":"固执，爱面子，对钱又有洁癖。他会为了一句台词跟人吵一个晚上，也会为了一分钱账对不上翻到半夜。这样的人，不该死在一间化妆间里。"}],"confronts":[{"clue":"c_hall3","breaks":"t_seat","a":"她看着那件米色风衣，嘴唇动了动，轻声说：“是我的。我……不是故意骗你。”她攥紧围巾，“我怕你们一听我去过后台，就觉得是我。我和他吵了半年，换谁都会这么想。”眼眶红得发亮。"},{"clue":"c_study4","a":"“他连这个都留着。”她苦笑，指尖在纸边上摩挲，“划掉我名字的那天，我把他骂了一顿，扔了杯子。可他没有赶我走，只说‘剧社要散了，你再忍忍’。我忍到今天，他就死了。”"},{"clue":"c_stage1","a":"她听完那两声，脸色一点点白下去。“轻的那声……就是我听到的闷响。”她捂住嘴，“那是九点过两分，不是停电的时候。我这些年写的都是别人的死亡，到自己听见，才知道这么轻。”"},{"clue":"c_back1","a":"她只看了一眼那只烛台，就转过脸去，肩膀微微发抖。“这是第三幕的烛台。我写的时候，让老团长拿它点灯，等一个回不来的人……”声音哑了，“我从来没想过它会有这样一天。”"}],"fallback":"这个我不知道，也许是在我没写过的那一场戏里。"},{"id":"tang","name":"唐婉清","role":"女主演","age":38,"look":{"skin":"fair","hair":"long","hairColor":"auburn","glasses":"none","beard":"none","outfit":"dress","acc":"earrings","mood":"worried"},"bio":"剧社的女主演，与方知远合作十二年，曾是他的恋人。下半场她一直在台上，停电时提着提灯在黑暗里撑完了三分钟的戏。","demeanor":"腔调优雅带刺，爱用反问，情绪激动时语速反而变慢，爱摸耳坠。","topics":[{"id":"t_role","q":"你和方知远的关系？","a":"合作十二年，前恋人，现在……大概是仇人。他教会我演戏，也毁了我很多年。可我说句公道话：他对戏，从来比对人真诚。"},{"id":"t_last","q":"你最后一次私下见他？","lie":true,"a":"上周排练的时候，我们吵了一架。之后我们就只在台上说台词，下了台不说话。今晚更是，我从头到尾没和他单独待过。","truth":"今晚中场结束我们在走廊吵了一架，二十点四十五分。他还给我发了短信，叫我演完去他化妆间谈合同。我没去。我怕被说成嫌疑人，才说上周。"},{"id":"t_contract","q":"你和影视公司的事？","lie":true,"a":"谣言。我去试过镜，没签。剧社要散了，我总得给自己留条路吧？我没做过对不起剧社的事。","truth":"我签了，星河影视的剧集，月底进组。剧社要散了，我快四十岁了，不想再等。他要追偿八十万，我说我赔，但我没有杀他的理由——人死了，我一分钱也赔不出。"},{"id":"t_stage","q":"停电时你做了什么？","a":"我拿起台口的提灯，站到台中央，把那场戏念完了。观众的手机灯亮成一片，我一句词都没敢错。我很骄傲，哪怕他听不到了。"},{"id":"t_quarrel","q":"他让你演完去化妆间？","needs":["clue:c_back3"],"a":"对，他要我把合同拿去给他看。我不会去的，我知道他的脾气。演到二十一点二十分我下场，在侧幕里喘气，一直到小乔跑来喊“方导不对劲”。我没进过那间屋子。"},{"id":"t_xu","q":"你觉得许会计这人怎样？","a":"许会计？工资发得一分不差，对谁都客气。就是这阵子瘦了一圈，大概是解散的事闹的。这样的人，怎么会和命案扯上关系。"}],"confronts":[{"clue":"c_back3","breaks":"t_last","a":"她盯着屏幕上自己那句“我没什么好谈的”，指尖摸了摸耳坠，冷笑里带了一点疲惫。“你们果然翻了他的手机。是，我们在走廊吵过，二十点四十五分。可我被他叫去，我没去。我是站在台上被灯照着的人。”"},{"clue":"c_study3","breaks":"t_contract","a":"“他连这个都写好了，日期还是今天。”她慢慢笑了一下，像在笑一个多年的老对手，“八十万。他是真的要我偿命。可我没动手——我这一辈子，只能在台上杀人。”"},{"clue":"c_hall4","a":"她看着视频里提着灯的自己，眼神一下子软了。“那三分钟我记得很清楚，台词不停，手却一直在抖。我以为我只是在撑一场戏，没想到那时候他已经……”她吸了口气，“谢谢你们留着这段。”"},{"clue":"c_din1","a":"“我二十点五十五分上台，二十一点二十才下场。”她指着白板上自己那一行，“中间一步没出过台口，你们问观众，问灯光，问谁都行。我这辈子最清楚的就是自己什么时候站在哪盏灯下。”"}],"fallback":"我不知道。我只会念台词，不会猜谜。"},{"id":"xu","name":"许敏","role":"剧团会计","age":41,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"rect","beard":"none","outfit":"jacket","acc":"badge","mood":"tired"},"bio":"暮光剧社的专职会计，管了十二年的账、票房和补贴申报。她说自己整个下半场都守在前厅柜台对账，没去过后台，停电时就坐在投资人金永昌身边。","demeanor":"轻声细语、句句讲规矩，爱用“按流程”“有记录”，被逼急了会反复整理袖口。","topics":[{"id":"t_role","q":"你在剧社管什么？","a":"管钱。票房、补贴申报、发工资、报销，十二年了。方导管戏，我管账，剧社撑到今天，一半是靠账上一分一厘抠出来的。解散以后的遣散清单，今天晚上我也还在对。"},{"id":"t_where","q":"停电时你在哪？","lie":true,"a":"前厅柜台，对今晚的票房。中场以后我就没挪过窝，停电的时候金总就坐在我旁边，黑咕隆咚的，他还抓着我的椅背说“别怕”。这话你们问他，他会说一样的。","truth":"我离开过柜台。20:57 我从员工通道进了后台，21:07 才回来坐下。金总那会儿根本不在前厅。停电时他确实在我旁边——那是真的，只是我最需要证明的从来不是那三分钟。"},{"id":"t_contact","q":"最后一次和方导说话？","lie":true,"a":"下午三点，算今晚的结算和解散后的遣散费。之后就各忙各的，没单独说过话。他今晚手机一直在响，不缺我这一个。","truth":"他 20:50 给我发过短信，让我九点整去化妆间，只给五分钟，别告诉别人。我回了“好”。我去了。我撒谎，是因为那五分钟之后，他就再也没起来。"},{"id":"t_tech","q":"你懂电路设备吗？","lie":true,"a":"我？只会按计算器。连投影仪都接不好，每次都喊陈野。你们说停电是人为的，那更跟我没关系，我连总闸在哪都要问人。","truth":"定时插座是我买的，一共两个，报销写“仓库节能”。19:58 我下去取备用金，顺手把一个接在调光柜前面，设成 21:12 关、21:15 开。我知道怎么弄，网上看一遍就够了。"},{"id":"t_blackout","q":"你怎么看这次停电？","a":"那是陈野的台子，灯一直是他管。老剧场线路旧，跳闸不稀奇。我只觉得可惜，最后一场偏偏出事，还死了人。方导要是知道，大概又要骂陈野了。"},{"id":"t_audit","q":"补贴账是怎么回事？","lie":true,"needs":["clue:c_study1"],"a":"那十几笔是项目分摊，先转到我个人户头走手续，年底统一冲平。周一我本来就要向审计说明，方导也知道。他就是爱多心。","truth":"不是分摊。三年，三十八万六。我妈尿毒症、换肾，ICU 一天一万多。我总想着发了奖金就补上，一直没补上。方导对账了，说周一必须如实报告，他是法人，他也脱不了干系。"},{"id":"t_phone","q":"票务旧手机呢？","lie":true,"needs":["clue:c_back2"],"a":"票务-03？那部破手机上个月就丢了，我在登记表上还写了待核销。谁捡了拿去做什么，我哪里知道。","truth":"没丢，今晚它一直在我包里。我从共享盘下载了 cue17，设了 21:13 的闹钟，九点零三分把它压进了他的戏服箱。我要的就是警察以为他死在那一声里。"}],"confronts":[{"clue":"c_hall1","breaks":"t_where","crack":true,"a":"她看着屏幕上自己穿侧门的那一帧，手指停在袖口上不动了。“……您连门都看了。”过了很久才说：“我是离开过。可金总也不在，他回来我已经坐下了。我从没说我整个人都在。”声音越说越轻。"},{"clue":"c_back3","breaks":"t_contact","a":"她盯着那条“好”字，睫毛颤了颤。“他发了短信。是，我回了。我以为他只是要谈遣散的事……我怕说了，你们就以为是我。”她深吸一口气，又低低补了一句：“可是现在，你们还是这样以为了。”"},{"clue":"c_cellar1","breaks":"t_tech","a":"“这个……”她的声音一下子紧了，“这种插座，谁都能在网上买。陈野那边的线我真的不懂。”说着她下意识地把袖口理平，一下，又一下，像要把什么抚平。“您不会觉得，一个会计会动电线吧？”"},{"clue":"c_study2","breaks":"t_phone","a":"她看着登记表上自己的签名，嘴唇发白。“……报销单和登记表，都是我亲手填的。我做账十二年，从来不留空白。”苦笑了一下，“原来做事太规矩，也会变成证据。”那两个插座，那只旧手机，她再没有否认。"},{"clue":"c_study1","breaks":"t_audit","a":"她闭了闭眼，像是终于卸下了什么。“尾号 7316，是我的卡。”声音低哑，“三年，我一直想补。他给了我周末，说周一不管怎样都要报。我妈在 ICU 里躺着，一天一天地烧钱……您说，我还能怎么办？”"},{"clue":"c_cellar2","a":"“十九点五十八，取找零备用金，规矩就是进出必签。”她说得很平，“每天晚上开演前都要备找零，谁都知道。”袖口被她理了又理。"},{"clue":"c_stage1","a":"她静静听了一遍两处响声，指尖在膝盖上点了点。“一声轻，一声重。警察听的是重的那一声，对吗？”她抬眼，“声音不会撒谎，但听的人会挑。”语气平稳得不像在谈一个死人。"},{"clue":"c_din3","a":"“这张便条，我见过。”她盯着那团纸，“咖啡渍……是谁的我不知道。可是写这种东西的人，是想让方导查我，对吧？这个剧社里，我是最容易被人怀疑的那个，我早该料到。”"}],"fallback":"这个我不清楚，你可以去查账，凡事都有记录的。"},{"id":"jin","name":"金永昌","role":"投资人","age":50,"look":{"skin":"light","hair":"slick","hairColor":"grey","glasses":"rect","beard":"none","outfit":"suit","acc":"tie","mood":"smirk"},"bio":"永昌文化基金的老板，八年来给剧社投了三百万，也是纺机剧场所在这栋旧厂房的业主。他想月底前签解散协议。他说下半场自己一直陪会计坐在前厅。","demeanor":"商人口吻，爱说“从商业角度”，笑里带刀，被追问时先报数字再绕开。","topics":[{"id":"t_role","q":"你和剧社的关系？","a":"八年，三百万，外加这栋楼的租约。从商业角度，这是一笔很不划算的投资，我一直在做慈善。方知远很固执，可我没有恨他，只是想让这事早点收场。"},{"id":"t_where","q":"下半场你在哪？","lie":true,"a":"前厅，陪许会计。中场以后我就没离开过，我们还聊了聊解散后的遣散费。灯灭的时候我就站在她旁边，这点她可以作证，我们一起摸黑等了三分钟。","truth":"我 20:52 到 21:08 不在前厅。我在车里见宏远置业的赵经理，谈这栋楼的出让意向。方知远不肯松口，我不想让他知道。停电时我确实回来了，站在她旁边。"},{"id":"t_blackout","q":"停电时你看见了什么？","a":"什么都看不见，一片漆黑。我听见台上唐婉清念台词，身边许会计喘得有点急，我还说她紧张，她没吭声。三分钟后灯亮，我还没缓过神。"},{"id":"t_dissolve","q":"你想拿到解散协议吗？","a":"当然想。月底前签完，我才能把楼转出去。方知远死了对我也不是好事，解散的事要重新走程序，我白白多出一堆麻烦。我再不讲情面，也不会为一栋楼杀人。"},{"id":"t_deal","q":"你在车里和谁谈？","needs":["clue:c_hall2"],"a":"宏远置业的赵经理。出让意向书我准备月底签，条件是剧社三十天内腾退。方知远要把使用权延到明年，我拒绝了。我没想到他今晚就死了。"},{"id":"t_books","q":"你怎么看剧社的账？","a":"许会计管，十二年没出过错。我每年签字，从没细看过，不是不信任，是信任得过头了。账上要有问题，我这个出资人比谁都吃亏。"}],"confronts":[{"clue":"c_hall2","breaks":"t_where","a":"他的笑僵在脸上，然后又很快堆回来：“你们连保安亭都查。”他摊手，“好，我承认不在，二十点五十二到二十一点零八分。我是怕你们误会，才这么说。生意嘛，难免见不得光。”"},{"clue":"c_hall1","breaks":"t_where","a":"他看着回放里自己起身出门的画面，轻轻叹了口气。“好吧，监控是不会骗人的，我是出去过，二十点五十二到二十一点零八分，在车里谈生意。”顿了顿，“不过我回来之后，她确实一直坐在柜台后面，直到灯灭。这点我没骗你。”"},{"clue":"c_study3","a":"“追偿函？”他挑了挑眉，“方知远这人，对谁都下得去手。我提醒过他，月底前别拖。”他笑了一下，“从商业角度，一份没发出去的函，价值为零。”"},{"clue":"c_study1","a":"“三十八万？”他的眼神第一次冷下来，“我投的钱，就是这么被花的？”随即又缓下来，“账是谁管的，不用我明说吧？不过这个数目，不够一栋楼，也不值得我杀人。”"}],"fallback":"从商业角度说，这件事和我关系不大。"},{"id":"he","name":"贺长根","role":"舞美师傅","age":56,"look":{"skin":"tan","hair":"cap","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"vest","mood":"tired"},"bio":"剧社的老舞美，二十八年没离开过后台。布景、道具、仓库都归他管。他说道具下午都摆好了，今晚自己没进过地下仓库，只在侧幕守着。","demeanor":"老派、话少，爱用方言“咯”“哇”，被问急了就拍大腿。","topics":[{"id":"t_role","q":"你在剧社做什么？","a":"搭台，摆景，管道具，二十八年了。方团长刚办剧社时我就在，台子是我一钉一钉搭出来的。这回要散了，我心里空咯，比哪个都难受。"},{"id":"t_cellar","q":"今晚你下过仓库吗？","lie":true,"a":"没有哇。道具下午全摆好了，开演后我就守在侧幕，仓库那头连脚都没伸过。不信你问休息室的人，我就进进出出这两处。","truth":"下去过，20:38 左右。我是去看那只座钟箱。那是真正的民国老座钟，我偷偷卖了，三万八，想着解散盘点前把箱子摆回去糊弄过去。这事丢人，我才说谎。"},{"id":"t_wing","q":"停电时你在哪？","a":"侧幕里，扶着布景的框。灯一灭我就摸黑把几块景板按住，怕被人撞倒。三分钟后灯亮，我才发现手心全是汗。二十一点二十五分，是我和小乔开的化妆间门。"},{"id":"t_timer","q":"仓库里的白插座？","needs":["clue:c_cellar1"],"a":"那个插座我二十点三十八分下去时就在了。白的，带个小屏幕。我当它是陈野加的防浪涌，没碰。要是我早点拔了，唉……这算不算我也有份？"},{"id":"t_candle","q":"烛台一直放在哪？","needs":["clue:c_back1"],"a":"走廊的道具桌上，第三幕才要用，谁都能拿。二十点四十八分我最后看了一眼，它还在。后来在地上看到它，我腿一软，差点站不住。那是我亲手擦亮的。"},{"id":"t_clock","q":"座钟去哪了？","needs":["clue:c_cellar3"],"a":"卖了。我认。一个月前拍卖行来看货，开价三万八，我老伴住院，我没扛住。我真没想到会出这种事……方团长要是知道，不会放过我，可我不会为这个杀人。"}],"confronts":[{"clue":"c_cellar2","breaks":"t_cellar","a":"他看着登记簿上自己那行字，拍了一下大腿。“我签了名还赖。”他低着头，半晌才闷声说，“二十点三十八，我下去过。我是去看座钟箱的，那座钟的事……丢人啊，我不想让孩子们知道。”"},{"clue":"c_cellar3","a":"“这是我摆的。”他的声音低下去，像被砂纸磨过，“箱子里本来有一只老座钟，花梨木的，民国年间的，是我师父传下来的。我对不起老团长，也对不起它。”他深深吸了口气。"},{"clue":"c_back1","a":"他在门外站了很久，才终于敢看一眼。“这烛台，我亲手擦的，擦得锃亮，现在上头……”他说不下去，别过脸，“二十八年，我头一次不敢进这间屋。”"},{"clue":"c_din1","a":"“白板是我写的，二十点五十出，二十一点回。”他叹气，“我去上了趟厕所，又去外头抽了一根。别的我真没什么，您别看我老，我腿脚快着呢。”"}],"fallback":"这个……我不晓得哇，我就是个搭台子的。"},{"id":"qiao","name":"乔小满","role":"新人演员","age":22,"look":{"skin":"fair","hair":"ponytail","hairColor":"black","glasses":"none","beard":"none","outfit":"hoodie","mood":"worried"},"bio":"去年才进剧社的新人，兼任方知远的助手和候场“叫场”。她负责 21:15 去敲化妆间的门叫他候场，没人应，十分钟后与舞美一起开门发现了尸体。","demeanor":"声音发颤、爱道歉，紧张时先说“对不起”，说着说着会攥衣角。","topics":[{"id":"t_role","q":"你在剧社做什么？","a":"我是新来的，演一个小女佣，也给方导跑腿、叫场。他其实对我很好，教我台词，还把自己的旧本子送给我。对不起，我说着说着就想哭。"},{"id":"t_stay","q":"中场后你在哪？","lie":true,"a":"休息室。我一直在那里背词，没出去。二十一点十五分按排场表才去走廊敲方导的门，对不起，我什么都没看见。","truth":"我 20:57 出去过，回来是 21:01。我手机没电了，去走廊拿充电器，在拐角看见一个人往化妆间那边走。我怕说了会惹事，就说没出去。对不起。"},{"id":"t_tip","q":"你知道账上的事吗？","lie":true,"a":"账？我只负责跑腿，不懂这些。许姐让我帮着核对过几次发票，我看都看不懂。对不起，我真的什么都不知道。","truth":"我知道。帮许姐核发票时，我发现补贴专户有几笔转进一个个人账户。我不敢当面说，打印了一张匿名便条塞给方导。我怕被灭口，更怕被赶出剧社，对不起。"},{"id":"t_saw","q":"你在走廊看见了谁？","needs":["clue:c_din1","clue:c_hall1"],"a":"……既然白板和监控都在，我就说吧。大概 20:58，我在拐角看见许姐，穿着那件灰开衫，朝化妆间的方向走。我以为她去问方导遣散费的事，就没多想。对不起，我现在想起来才觉得不对。"},{"id":"t_knock","q":"你敲门时情形如何？","a":"二十一点十五分，门上挂着“勿扰”牌，我敲了三下，没人应。我以为他在入戏，就没敢开。二十一点二十他没上场，我才慌了。对不起，我应该早点开门的。"},{"id":"t_find","q":"谁发现了尸体？","a":"我和贺师傅，二十一点二十五分。门没锁，我推开，方导趴在化妆台上，旁边有只烛台。我当场就腿软了，是贺师傅扶着我出来的。对不起，我现在还抖。"}],"confronts":[{"clue":"c_din1","breaks":"t_stay","a":"她盯着白板上自己的名字，手指揪紧了衣角。“对不起，我骗了你。”声音很低，“二十点五十七，我出去过，拿充电器。我不是故意的，我只是怕说出来，会有人觉得是我。”"},{"clue":"c_din3","breaks":"t_tip","a":"她一眼认出那团纸，脸涮地白了：“这是我打的，咖啡是我的拿铁洒的。”眼泪掉下来，“对不起，我怕得要命。我只是想帮方导，我没想他会……我真没想到他会因为这个。”"},{"clue":"c_back1","a":"她只看了一眼就捂住嘴，肩膀剧烈地抖。“我不敢看。”过了好一会儿才哽咽着说，“他今晚还在跟我对台词，说我‘不要怕，台上你是最亮的’。对不起，对不起。”"},{"clue":"c_hall1","a":"她盯着屏幕里那个穿灰开衫的身影，嘴唇哆嗦着，“……是，是许姐。”随即慌乱地摆手，“我不是说她干了什么，我只是说我看见了。对不起，我不知道这样说对不对。”"}],"fallback":"对不起，这个我真的不知道……"},{"id":"jiang","name":"江临","role":"前团员","age":36,"look":{"skin":"tan","hair":"cap","hairColor":"brown","glasses":"none","beard":"goatee","outfit":"jacket","mood":"sly"},"bio":"五年前离开暮光剧社的老团员，如今在晨星剧社做导演助理。他说自己只是来买票看最后一场的，二十一点半谢幕前才进场。","demeanor":"吊儿郎当、爱调侃，笑嘻嘻带点酸，被戳到痛处时反而笑得更大声。","topics":[{"id":"t_role","q":"你和暮光什么关系？","a":"前团员，演过五年，后来被方知远一脚踢了出去。现在在晨星剧社混口饭吃。听说暮光要散，我就想来看最后一场，毕竟那是我的青春。哈，听上去像悼词。"},{"id":"t_grudge","q":"你恨方知远吗？","a":"恨过。他当年说我“没有舞台感”，当着全剧社的面。可五年了，我现在也做导演了，才明白他那话有一半是对的。恨不恨有什么用，我只是想看他的最后一场。"},{"id":"t_arrive","q":"你几点进的剧场？","lie":true,"a":"二十一点半左右，谢幕前买了张站票。我从大门进，看了一眼谢幕就走，没去后台，哪儿也没去，你们查监控，我可没溜进来。","truth":"我 20:48 就进来了，用过期的旧通行证，从后台门溜进休息室，躲在那里偷看下半场。我想拷贝他的舞美思路。丢脸，但不是杀人。"},{"id":"t_why","q":"你为什么躲着看？","needs":["clue:c_din2"],"a":"晨星最近要排一出同题材的戏，我想看他怎么处理雨夜的光影。买票太贵，也怕他不让我进，就偷偷看了。我拍了几张舞台照片，不信你查手机。"},{"id":"t_dark","q":"停电时你听到了什么？","needs":["clue:c_stage1","clue:c_din2"],"a":"既然通行证都被你翻出来了，我就直说吧。黑的时候我正从休息室去洗手间，走到走廊，听见后面“咚”的一声重物倒地。我愣在原地，等着有人喊或者有人跑，结果什么动静都没有，连脚步声都没有。我还以为是道具，现在想起来后背发凉。"},{"id":"t_see","q":"休息室里谁进出过？","needs":["clue:c_din1","clue:c_din2"],"a":"既然露了底，我就直说，我躲在衣架后面，看得还算清楚。小乔二十点五十七分出去，四分钟后才回来，手里捏着个充电器；老贺二十点五十走的，二十一点回。化妆间那头的走廊我没敢探头，怕被人撞见。"}],"confronts":[{"clue":"c_din2","breaks":"t_arrive","a":"他笑了，笑声比平时大了一倍：“哈，被抓了。”笑完才摸了摸鼻子，“是，我二十点四十八就进来了。旧通行证，过期一年，看门的老张没认出来。”顿了顿，“我真不是来杀人的，我是来偷师的。”"},{"clue":"c_stage1","a":"“一轻一重？”他靠着墙听了两遍，笑意慢慢收起，“重的那声我听见了，在走廊。轻的我没听见。可你想想，倒了个人，怎么会一点人声都没有？”他自己也皱了眉。"},{"clue":"c_back1","a":"他看了一眼就别开了视线，没像平时那样笑：“他这辈子最爱干净，连台上的灰都要擦。结果死在一滩血里。”咽了咽，“我讨厌他，可也不想他这么走。”"},{"clue":"c_hall3","a":"“哟，苏编剧的座位。”他挑眉，“我跟她不熟，她爱坐哪儿坐哪儿。她跟方知远那点官司，全剧社都知道，我可不掺和，各人有各人的难处。”"}],"fallback":"哈，这个我可不清楚，我只是个来看戏的。"}],"solution":{"culprit":"xu","method":{"q":"凶手怎样让所有人以为方知远死在停电里？","options":["趁停电的三分钟潜入后台，凭对剧场的熟悉在黑暗里来去自如。","二十一点出头就在化妆间杀人，再用定时插座制造二十一点十二分的停电，并用藏在戏服箱的旧手机闹钟放出“重物倒地”音效，把死亡时间伪造进停电里，自己回前厅坐到投资人身边。","指使灯光师在调光台上切断电源，趁黑由同伙动手。","先让方知远在化妆间服下安眠药，停电时药性发作倒地撞伤。"],"correct":1},"motive":{"q":"凶手为什么杀人？","options":["方知远擅自改掉了编剧署名，凶手不满抢夺版权。","剧社解散，凶手不想失去工作和分红。","凶手多年挪用补贴与票房款，方知远已对账、周一审计即将暴露，他要如实报告。","凶手与方知远有多年的感情纠葛，被抛弃后报复。"],"correct":2},"keyClues":["c_stage1","c_cellar1","c_back2","c_hall1","c_study1","c_study2"],"truth":["凶手是剧团会计许敏。她让所有人相信方知远死在 21:12 到 21:15 的黑暗里，可方知远其实 21:02 就死了。","真正的动机藏在账里：三年间，许敏陆续把文旅补贴和票房款共 38.6 万转进自己的卡（尾号 7316），给重病的母亲付医疗费。小乔匿名便条提醒了方知远，他对完账后约许敏 21:00 在化妆间“只谈五分钟”，并说周一审计前必须如实报告，他是法人，他也脱不了干系。她哀求无果，抓起走廊道具桌上的黄铜烛台打死了他。","她早有准备：19:58 以取备用金为名下仓库，把一只数显定时插座接在调光柜的供电电缆前，设成 21:12 关、21:15 开。她还把共享盘里的 cue17_重物倒地.wav 设成票务旧手机的 21:13 闹钟铃声，杀人后把手机塞进戏服箱，挂上“勿扰”牌，21:07 回到前厅。","于是 21:12 灯“故障”，21:13:02 走廊监听录下清脆的巨响，警方就认定案发在黑暗中；而许敏此刻正坐在投资人金永昌身边，金永昌愿意发誓。可他 20:52 到 21:08 在车里见买家，并不在前厅——她的不在场证明只覆盖了“假的死亡时间”，真正的 21:02 她在后台。","破绽：监听录音里 21:02:10 有一声极轻的闷响，与 21:13 的响亮巨响并非同一回事；调光日志显示没有指令，灯在 21:15 整自己亮起，说明不是跳闸而是定时；仓库里有白色数显定时插座，程序 21:12 关、21:15 开；戏服箱里的旧手机贴着“票务-03”，闹钟铃声就是 cue17；办公室里的报销单和资产登记表写着许敏经办、保管，收款账户尾号正是被圈出的 7316；前厅监控显示她 20:57 到 21:07 离岗。","灯光师陈野的私下租灯、苏孟的署名之争、唐婉清的违约合同、贺长根卖掉的座钟、金永昌背着剧社谈卖楼、乔小满的匿名便条和江临的偷师，都是烟雾。最终拆穿真相的，是一台定时插座、一部旧手机和一本做得太规矩的账。"]}},{"id":"liaoyang","title":"台风夜查房","tagline":"台风封山，院长死在反锁的屋里，唯一的目击者是个“看见鬼”的病人","difficulty":4,"cover":"cover","tone":"green","brief":"一九八七年九月二十六日傍晚，你坐着吉普车爬上青崖山，来到松岚疗养院。十天前，院长顾清源给你写过一封信，只有一句要紧话：“药房账目似有蹊跷，不便行文，望一见。”他在门厅握了握你的手，说：“今晚风大，明早再谈。”可当夜台风封了山，山路塌方，摇把电话线也断了。零点五十五分，你被喊声惊醒：院长室的门从里面锁着，护工和副院长劈开门，顾清源伏在桌前，右臂上插着一支空注射器，已经没了呼吸。副院长说是吗啡过量，意外或自戕。可你揣着那封信，还有一个病人在走廊拦住你，低声说：“我昨夜看见了，没有脸的人，提着灯进了他的屋子。”警察最早天亮才到，你只有这一夜。","victim":{"name":"顾清源","desc":"松岚疗养院创办人兼院长，六十一岁，患晚期胰腺癌，每晚自行注射吗啡止痛。零点五十五分被发现伏在院长室书桌前，已无呼吸，右臂上斜插着空注射器，桌角散落三支空安瓿，门自内锁死。","look":{"skin":"light","hair":"short","hairColor":"grey","glasses":"round","beard":"none","outfit":"labcoat","acc":"stethoscope","mood":"tired"}},"publicFacts":["松岚疗养院是青崖山腰的私立疗养院，设三十四张床位；19:10 山路塌方，19:40 摇把电话线被风刮断，警方最早明晨抵达。","顾清源患晚期胰腺癌，只有副院长严仲谦、护士长薛玉芬和药剂师宋鹤龄知情，他每晚自行注射吗啡止痛。","院长室是弹簧门锁，门一拉上就锁，钥匙当晚放在桌面，窗内插销闩着；零点五十五分魏德贵与严仲谦劈门而入。","22:00 值夜护工魏德贵送开水时院长仍然活着，院长吩咐他零点半再送一壶；22:30 全院停电，此后只用马灯和手电。","严仲谦初验后认为是吗啡过量致呼吸抑制，倾向于意外或自戕；你的委托信里提到“药房账目蹊跷”。","长期住院的梁秋白声称昨夜见到“白衣无面人提灯进院长室”，但护理记录显示他21:30已服镇静药，医护都认为是旧病幻觉。"],"timeline":[{"t":"19:10","text":"山路塌方，疗养院被隔绝；19:40 电话线被风刮断。"},{"t":"21:10","text":"严仲谦与院长在院长室谈话约半小时，魏德贵在廊下听见有人提高嗓门。"},{"t":"22:00","text":"魏德贵给院长送开水，院长在世；院长吩咐零点半再送一壶。"},{"t":"22:30","text":"全院停电，各处改用马灯和手电。"},{"t":"22:45","text":"魏德贵巡廊一次（值班本记录）。"},{"t":"00:40","text":"魏德贵送水叩门无人应，赶去叫严仲谦。"},{"t":"00:55","text":"二人劈开院长室门，发现院长已死，右臂插着空注射器，桌上三支空安瓿。"},{"t":"01:10","text":"严仲谦初验：尸体尚温，下颌僵硬刚起，瞳孔针尖样缩小。"}],"budget":{"search":12,"ask":26},"locations":[{"id":"study","name":"院长室","scene":"study","desc":"东头的院长办公室，书柜、铁皮保险柜和一张老式写字台，窗内插销闩着。台风把窗纸似的雨幕压在玻璃上，马灯的光在墙上发抖。","clues":[{"id":"c_s1","title":"右臂新针眼","text":"遗体伏在桌前，左袖挽到肘上，左臂内侧布满陈旧针眼与淤青，密得像缝过线；右袖也被卷起，右上臂外侧只有一个新鲜针眼，空注射器斜插其上。棉球盒里的棉球原样未动。"},{"id":"c_s2","title":"空安瓿与抽屉","text":"桌角摆着三支空安瓿，蓝字标签写“盐酸吗啡注射液 10mg”，瓶身批号印“8706”。拉开右手抽屉，里面还躺着两支同规格的未开封安瓿，批号印“8612”，旁边是一个煮针筒的铝盒。"},{"id":"c_s4","title":"台历与便条","text":"台历9月27日栏用红笔写着“晨八时 宋 带8612账册来”。台历下压着半张便条：“严 收洪 每月八十元 核实 勿声张”。字迹都是死者惯用的钢笔字。"},{"id":"c_s3","title":"弹簧锁与烟蒂","text":"门是老式弹簧锁，门内旋钮拧到“关”位，门一合就自动锁上，钥匙当时放在桌面。门外廊砖上有半干的水痕，右脚的痕迹较轻，还拖出一道；门框旁落着四个“大前门”烟蒂。"}]},{"id":"pharm","name":"药房","scene":"clinic","desc":"西侧的药房，玻璃药柜、天平和一排褐色药瓶，里间有铁皮麻醉柜。空气里一股来苏水混着薄荷脑的味道，侧门通向后院。","clues":[{"id":"c_p1","title":"麻醉柜清点","text":"里间铁皮麻醉柜上着两把锁，钥匙串在宋鹤龄腰间。柜内8706批吗啡整盒码放，标牌写“存50支”，实际清点只剩47支；柜角堆着8612批的空盒，盒盖都已拆开。"},{"id":"c_p2","title":"管制药品登记册","text":"布面登记册每页边缘盖着红色骑缝章。第38页纸色偏白偏新，页边半枚红章与前后页对不上；页末一行新写着“9月26日22:10 吗啡8706×3 顾清源 亲领 签”，墨色比上一页更黑。"},{"id":"c_p3","title":"厚底右布鞋","text":"药房门后靠着一根枣木手杖和一双布鞋，右脚那只鞋里垫了两层厚棉布，鞋跟外侧磨得很偏，前掌钉着一块菱形格纹的旧胶皮；旁边挂着一件白大褂和一只洗得发黄的口罩。"},{"id":"c_p4","title":"稿纸上的签名","text":"废纸篓里有十几张揉皱的稿纸，同一个“顾清源”签名反复写了几十遍，越到后面越像。纸边沾着蓝黑墨水，与登记册第38页上的墨色接近。"}]},{"id":"lab","name":"化验室","scene":"lab","desc":"后楼一间窄小的化验室，酒精灯、试管架和一台旧显微镜，墙上贴着“检验规程”。窗外就是后院，雨声很大。","clues":[{"id":"c_l1","title":"化验申请与结果","text":"化验申请单：9月22日，申请人顾清源，“检8612批吗啡注射液含量”。结果栏9月24日：“含量约为标示量十分之一，余为氯化钠反应”，检验人简若川。另附院长亲笔批示：“结果仅限你我知悉。”"},{"id":"c_l2","title":"化验记录本","text":"实验记录本9月26日14:30一栏：“8706批吗啡，含量合格，与标示相符。顾院长要求当面复核。”下面还有8612批两次复检的数字，与申请单上的结果一致。"},{"id":"c_l3","title":"窗台马灯","text":"窗台上放着一盏马灯，灯罩里的煤油烧去了大半，灯芯刚被剪过；试管架旁的记录纸上，有一行“22:40 复检第二法”的新铅笔字，墨迹未被雨气晕开。"}]},{"id":"records","name":"病历档案室","scene":"library","desc":"一楼拐角的档案室，铁皮病历柜一排排立着，值班桌上压着护理记录和值班本。屋里没有灯，只有手里的马灯照出一圈黄光。","clues":[{"id":"c_r1","title":"夜班护理记录单","text":"9月26日夜班护理记录单从21:00一直填到次日06:00，连02:00、04:00、06:00的体温脉搏栏都已写满，全是同一支蓝黑钢笔、同样圆润的笔迹，22:30栏写着“查房毕，各床安睡”。现在才凌晨一点多。"},{"id":"c_r4","title":"夜间值班本","text":"值班本是魏德贵的字，歪斜但清楚：“22:00 送开水，院长在。22:30 停电。22:45 巡廊，严副院长房有灯，里面有人说话，没敢敲。23:00 在发电机棚歇。00:20 醒。00:40 叩门无应。”"},{"id":"c_r3","title":"苏婉如病历夹","text":"病历柜第三层苏婉如的病历夹被抽走了，空槽里夹着院长亲笔的评估草稿：“病情稳定一年以上，拟十月办理出院”，下面压着洪建国的探视登记。"},{"id":"c_r2","title":"梁秋白病历","text":"梁秋白的病历夹：医嘱“氯丙嗪100mg 睡前”，用药栏每日“已服”；病程记录近两月多次写着“诉夜间见白衣无面人持灯于药房、走廊走动，查房未见，视为幻觉”。"}]},{"id":"ward","name":"梁秋白的病室","scene":"guestroom","desc":"男病区尽头的单人病室，窗户正对走廊另一头。一张铁床、一只木箱、一摞包着牛皮纸的书，收拾得比别处都整齐。","clues":[{"id":"c_w1","title":"梁的夜间笔记","text":"蓝皮练习本每行先写时间：“22:00 院长室灯亮，老魏送水，片刻即出，其后廊下无人往来。22:20 白衣人，蒙口罩，左手提马灯，右脚拖着走，自药房那头来，入院长室，未敲门。22:30 停电。22:45 老魏提灯巡廊，过院长室门前不停。22:52 白衣人出，门‘咔’一声自合，仍提灯向药房去。22:54 另有一人自客房那头来，立门前敲门、点烟，至23:15 方去。23:40 走廊尽头窗外，后院方向有火光。”"},{"id":"c_w2","title":"缸底的药片","text":"床头搪瓷缸底压着三片半化的白色糖衣片，缸沿上有指甲划出的细痕；床垫下还有几片用手帕包好的药。"},{"id":"c_w3","title":"怀表与窗","text":"窗台上放着一块铜壳怀表，走时与大厅座钟只差一分钟。从他床边向外，透过玻璃正对着走廊尽头院长室的门，中间没有遮挡。"}]},{"id":"yard","name":"后院","scene":"garden","desc":"药房侧门外的后院：焚化炉、发电机棚和一架被风吹倒的葡萄藤。雨在泥地上砸出一个个小坑，棚檐下还挂着一盏熄了的马灯。","clues":[{"id":"c_y1","title":"焚化炉残页","text":"焚化炉的灰里挑出一角没烧透的纸，带着半枚红色骑缝章，可辨页码“38”和几行残字：“……破损2支 ……破损3支 ……破损2支”，每行末尾都有“薛玉芬 核”，墨色完全一致。"},{"id":"c_y2","title":"棚边酒瓶与脚印","text":"发电机棚的草席旁倒着一只空酒瓶，瓶身有“地瓜烧”字样，手摇发电机的手柄上有水渍。棚与药房侧门之间的泥地上有一串往返焚化炉的脚印：左脚印清楚，右脚印浅，前掌带菱形格纹，脚尖后面拖出一道浅沟，沟里积着半窝雨水。"},{"id":"c_y3","title":"药房侧门","text":"药房侧门通向后院，门闩刚上过油，门槛内侧的地砖上落着几点黑色纸灰，旁边有一小片擦得半干的泥印。"}]}],"suspects":[{"id":"yan","name":"严仲谦","role":"副院长","age":55,"look":{"skin":"light","hair":"sidepart","hairColor":"grey","glasses":"round","beard":"none","outfit":"suit","acc":"pocketwatch","mood":"stern"},"bio":"松岚疗养院副院长兼内科主任，跟了顾清源十二年。当晚是他与魏德贵合力破的门，并做了初步勘验，认为是吗啡过量。自称晚饭后回房休息。","demeanor":"官腔，爱说“按规定”，被问急了就拿资历压人","topics":[{"id":"t_bio","q":"您负责院里什么？","a":"临床和管理，院长不在，我就是当家人。十二年，我没有一天误过查房。你一个外来的同志，问话之前先摆正位置，我配合是出于纪律，不是出于客气。"},{"id":"t_judge","q":"您怎么看死因？","a":"吗啡过量，呼吸抑制，教科书上的症状我看得清清楚楚。院长癌痛多年，夜里手抖，多扎一支少扎一支都可能。意外也好，想结束痛苦也好，院里的体面要紧，结论我已经下了，明早警察来我自会交代。"},{"id":"t_cancer","q":"院长的病有谁知道？","a":"知情的只有三个人：我，薛护士长，药房的宋药师。他自己要求保密，怕床位上的病人和家属慌。这事我从没对外说过，你问别人也问不出来。"},{"id":"t_where","q":"21:40 以后你在哪？","lie":true,"a":"谈完话我回房间看了会儿文件，然后睡了，一直到老魏来砸门。台风夜里屋里就我一个人，没有谁能给我作证，可这不等于我撒谎。","truth":"我没睡。我和薛玉芬在我房里，从十点到十一点过一刻。我们……处了两年了，这事要是传开，她护士长当不成，我的位置也保不住。我不该瞒你，但这跟院长的死没有关系。"},{"id":"t_quarrel","q":"你们晚饭后吵了什么？","lie":true,"a":"谁说我吵了？例行汇报。下季度的预算、床位、药品采购，老顾脾气硬，嗓门大了点，这在我们之间不算事。","truth":"他拿着一张便条质问我收了家属的钱。他说今天路一通，明天他就写书面材料交县卫生局，要我退赃、写检查、自己辞职。我嚷了几句，扭头就走。那是气话，我杀他图什么，他快死了。"},{"id":"t_money","q":"那便条上的钱是怎么回事？","needs":["clue:c_s4"],"a":"洪建国每月八十，托我把他老婆多留一阵子。我收了，一共收了十一个月。你要记就记吧，这是我的错，但人是病人，照样治，没亏待她。院长要我退赃，我答应了，没想到还没退他就……"},{"id":"t_succ","q":"院长之后谁接班？","a":"县卫生局的意思是外派，我这辈子也就到副字头了。有人说我盼着他死，笑话，他活着，我至少还有副院长这块牌子，他一死，天知道上头派来个什么人。"},{"id":"t_ghost","q":"梁秋白看到的白影呢？","a":"妄想，病程记录写得明明白白，近两月反复。护理单上他21:30就吃了氯丙嗪，一百毫克，睡得比我还死。你要是拿一个病人的话来办案，我只能说，你不懂这一行。"}],"confronts":[{"clue":"c_r4","breaks":"t_where","a":"……老魏这个本子，谁准他记这种东西的。好，你既然翻到了，我就不抵赖：那晚我不是一个人。其余的，按规定，我只对你一个人说，对警察我也是这个口径。"},{"clue":"c_s4","breaks":"t_quarrel","a":"这半张条子……他什么时候写的！好，我不绕了。八十块，是我的把柄，也是我的耻辱。可你替我想想，我若要杀他，何必挑台风夜，挑这么个满院都是人的晚上？这不合常理，同志。"},{"clue":"c_r1","a":"这是护士长的事，我不管。不过一张写到早上六点的记录，连我都看出不对来了。明早我会处理，轮不到你来教我怎么管人。"},{"clue":"c_s2","a":"8706，8612……我只验了死因，没去看批号。哪一批能要人命，哪一批不能？这是药房的账，你问宋药师，别问我。"},{"clue":"c_s1","a":"右臂？他的习惯，我不如护士长清楚。可癌痛的人，疼起来哪还顾得上哪只手？这一点，不足以推翻我的结论。"}],"fallback":"这与你要查的事有什么关系？按规定，我只回答与案情有关的问题。"},{"id":"xue","name":"薛玉芬","role":"护士长","age":49,"look":{"skin":"light","hair":"bun","hairColor":"black","glasses":"none","beard":"none","outfit":"uniform","acc":"badge","mood":"tired"},"bio":"松岚疗养院护士长，守着三十四张床十七年，当晚与魏德贵共同值夜。自称一直在病区查房，22:30 后点着马灯逐床看过。","demeanor":"短句利落，开口先说“按章办事”，心虚时语速变快","topics":[{"id":"t_bio","q":"您在院里做什么？","a":"护士长，也是半个管家。三十四个人的药、饭、被褥，都归我。院长信我，我也没让他失望过，十七年，一次差错也没有。"},{"id":"t_round","q":"昨夜 22:30 查房了吗？","lie":true,"a":"查了。我点着马灯，一间一间看过去，各床安睡，才写的“查房毕”。记录单就是我的凭据，你可以看。","truth":"我没查，那单子……是我傍晚交班前就填好的。台风夜人手少，我想着省点事，把整夜的栏都先写了。22:00以后我和严副院长在他房里，直到十一点过一刻才回病区。我对不起那些病人，可我没害院长。"},{"id":"t_pill","q":"梁秋白的药你看他咽了？","lie":true,"needs":["clue:c_r1"],"a":"我亲手递的杯子，亲眼看他咽下去的。氯丙嗪一百毫克，他吃了就睡，从来如此，所以他半夜看见什么，一定是药没压住病。","truth":"我递了杯子就转身去忙别的，没盯着他咽。单子上的“已服”，是我提前写的。梁先生从不闹，我就信了纸。他要是把药吐了，那夜里看见的东西就不一定是病了。"},{"id":"t_sign","q":"药房的破损登记你签过？","lie":true,"needs":["clue:c_y1"],"a":"每月月底我亲自去药房点破损的空安瓿，一支一支对数，核对无误才签字。我是护士长，这点规矩比命重要。","truth":"宋药师说空安瓿太多、站着点腿疼，让我签个字就行，他事后会补数。我信他，一签就是四个月，有时一次签好几页。我不知道那是把我当遮羞布。"},{"id":"t_vic","q":"院长平时怎么打针？","needs":["clue:c_s1"],"a":"他右手抖，只能用右手握针筒，扎左臂，十年没变过。我给他配过棉球，他从不碰右臂，说那只胳膊要留着写字。这几个月左臂扎得没处下针，他疼，可也不肯换边。"},{"id":"t_song","q":"你怎么看宋药师？","a":"勤勉、守时、手脚细，药房的账从没出过岔子。他七六年修房梁摔断过右腿，阴雨天走路右脚拖着，老人家都习惯了。院长的药都是他亲手发，我也只有信他的份。"},{"id":"t_ghost","q":"你信梁说的白影吗？","a":"不信，也不是不信。我在这儿十七年，梁先生六年，他一向条理清楚，只在夜里偶尔胡言。这回我不好说，记录是那样写的，可我现在知道那记录……不好当凭据。"},{"id":"t_truth","q":"22:00 以后你人在哪？","needs":["clue:c_r1"],"a":"两年了，院里没人知道。他离了婚，我守寡，可这种事传出去，我就别想当护士长了。昨夜十点到十一点过一刻，我们在他房里，谁也没出去过，老魏巡廊从门口过，我听见了脚步。"}],"confronts":[{"clue":"c_r1","breaks":"t_round","a":"……是我写的。写到早上六点，是我写的。别用那种眼神看我，我认错。可单子废了，你问严副院长，我们那一个多钟头到底在哪儿。"},{"clue":"c_w2","breaks":"t_pill","a":"药在缸底……他一直在藏。那我写的“已服”，就全是白纸黑字的谎。我真该死。要是我盯着看那一眼，他的话也不至于被当成疯话。"},{"clue":"c_y1","breaks":"t_sign","a":"这是我的名字。同一天，同一支笔，我认得出。四个月的“核”，原来烧起来是这么个样子。宋药师，你拿我的字去干了什么？"},{"clue":"c_r4","a":"老魏巡到严副院长房门口，我听见了。他没敢敲，是个体面人。倒是他后来躲进棚里喝酒，我心里知道，也没说破。"}],"fallback":"这个我说不清楚，按章办事，我只认记录。"},{"id":"liang","name":"梁秋白","role":"长期住院病人","age":59,"look":{"skin":"light","hair":"short","hairColor":"white","glasses":"round","beard":"none","outfit":"vest","acc":"pocketwatch","mood":"smile"},"bio":"退休中学历史教师，因反复发作的抑郁住进松岚六年，正在写一部《松岚六年》。自称昨夜看见一个“白衣无面人”提灯进了院长室，护理记录却说他早已服药入睡。","demeanor":"文雅克制，有教师的条理，被当病人时语气温和而带锋","topics":[{"id":"t_bio","q":"您是怎样的人？","a":"教了三十一年历史。这里的人都当我是病人，我也承认自己是病人，可病人不等于不会看、不会记。我每晚记笔记，是教书留下的习惯，一件事发生的时刻，我比多数人更在意。"},{"id":"t_saw","q":"昨夜你看见了什么？","a":"二十二点二十分，一个穿白衣的人提灯进了院长室。他蒙着口罩，没有脸，左手提灯，右脚拖着走。二十二点五十二分，他出来，门咔的一声自己合上。这些都在我的本子里，你可以去拿。我知道这听起来像什么，可我只是说我看见的。"},{"id":"t_pill","q":"药你吃了吗？","lie":true,"a":"吃了。护士看着我咽的，我从不违抗医嘱，夜里睡得很沉。你不要因为这个怀疑我，我可以现在张嘴给你看。","truth":"我没吃。氯丙嗪让我昏沉，写不出东西，我就含在舌下，等护士走了吐进搪瓷缸，压在缸底。这是我六年里的小抵抗，我不是怕药，是怕被药变成另一个人。这事和院长无关，只是我想要自己的脑子。"},{"id":"t_clock","q":"你怎么知道时间？","a":"怀表。我当年教书起，就习惯和大厅的座钟对表，每天二十一点校一次。差一分钟，不会更多。我用它记所有的事，包括你现在问我的这个。"},{"id":"t_past","q":"你以前也见过他吗？","a":"见过。八月以来，我记了六回：夜里一两点，同样的白影从药房侧门出来，往后院走一趟又回去。他们都说我是幻觉，可幻觉不会每回都走同一条路，也不会拖着同一只脚。"},{"id":"t_face","q":"那人是男是女？","needs":["ask:liang.t_saw"],"a":"男。个子中等，偏瘦，肩膀有点往右塌。脸被口罩和马灯照出的暗影遮住，我说不出是谁。我只能说，他走路的时候，右脚比左脚晚落地半拍。"},{"id":"t_record","q":"护士长的记录呢？","needs":["clue:c_r1"],"a":"那单子我听说过，是不是连明天早上的体温都写好了？十七年，薛护士长先写后做，我见过她站在走廊里对着墙补记，不过我不怪她，人少，活多。可如果我的“已服”也是先写的，你就该知道我话里能信几分了。"},{"id":"t_dignity","q":"被当成疯子是什么感觉？","a":"一开始愤怒，后来是疲倦。人们说话的时候不看你的眼睛，只看你的病历。我只希望你，这位外来的先生，这一次，先看我的本子，再看我的病历。"}],"confronts":[{"clue":"c_w2","breaks":"t_pill","a":"……被你翻出来了。不错，我没吃。你不必替我瞒着护士长，也不必替我辩解。这几片药是我的证词，不是我的罪。"},{"clue":"c_w1","a":"这是我的笔记，一字不改。你读到“右脚拖着”了吗？我只写所见，从不下判断。判断是你的事。"},{"clue":"c_r2","a":"“视为幻觉”，是他们写的。幻觉能记下时间、方向和步法吗？但我不怪他们，人总习惯用现成的词，把看不懂的事关起来。"},{"clue":"c_r1","a":"连早上六点的体温都写了，我就知道我的“已服”也白搭了。你要信的话，信我的怀表吧，它从不先写。"}],"fallback":"这个我没看见，也不想编。我只说我写进本子里的事。"},{"id":"su","name":"苏婉如","role":"住院病人","age":38,"look":{"skin":"fair","hair":"bob","hairColor":"black","glasses":"none","beard":"none","outfit":"robe","mood":"sad"},"bio":"原纺织厂会计，因精神分裂症稳定期住院四年，院长曾答应她今年秋天出院。昨晚打了安神针后睡下，自称只记得天亮。","demeanor":"说话轻，爱停顿，爱用数字；记忆断片时先道歉","topics":[{"id":"t_bio","q":"您原来做什么的？","a":"纺织三厂，管财务科的账，十年，从不出错。我现在每天在这里数东西：几张床，几个窗，几口人。数字是不会骗人的，对不起，我说得有点多。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"我睡了。九点简医生给我打了针，之后什么都不记得，一觉到天亮。对不起，我真的不记得别的。","truth":"我不是一直睡。大概十一点以后我醒了，口渴，摸黑去水房，路上看见药房亮着灯。后来我又去了档案室，我想拿回自己的病历，因为我想知道他们到底给我写了什么。我怕被发现乱走，要加药，所以不敢说。"},{"id":"t_gap","q":"你的记忆是怎么回事？","a":"那针打完，脑子就像被擦过的黑板，一块一块空着。我分不清是病，还是药。简医生很年轻，他后来也跟我道歉，说记不清是不是打了两遍。对不起，我不想怪他。"},{"id":"t_keep","q":"你想出院吗？","a":"想。院长答应过，今年秋天。我丈夫来看我，说家里没人照顾，让我再等等，他说话的时候不看我，我就知道了，这个人，不想我回去。"},{"id":"t_hong","q":"你丈夫昨天的样子？","a":"他下午就到了，说是路上耽搁。晚上他睡客房，我睡病房，隔着一条走廊。他带了橘子，剥了一个又一个，剥完又装回去，像是把心思也装回去了。"},{"id":"t_water","q":"你夜里走动时看见了什么？","needs":["clue:c_r3"],"a":"我口渴去水房，途中药房里亮着灯，我从门缝瞥了一眼。是宋药师，戴着口罩，伏在桌上写字。我在厂里干过十年，那姿势我认得，他是在抄账。我正要走，他抬头看见我，让我回去睡，说我什么都没看见。"},{"id":"t_ledger","q":"你怎么知道是抄账？","needs":["ask:su.t_water"],"a":"他左手压着一页旧账，右手用尺子压着新纸，一行一行地照着写，写一行吹一口气，等墨干。这是造账的法子，我看过不少人做假账。那时候钟刚打完十一下不久，我记得钟声，别的我记不全，对不起。"},{"id":"t_ghost","q":"梁先生说的白影？","a":"梁先生从不撒谎，只是话说得太细，细得没人耐烦听。我信他。因为我自己也知道，被人当成没有记性的人，是什么滋味。"}],"confronts":[{"clue":"c_r3","breaks":"t_where","a":"那是我的病历夹……我没偷，我只是想拿回来看。他们写的东西，我连看的资格都没有吗？好，我说，我昨晚不是一直在睡。"},{"clue":"c_p2","a":"这页的红章，边缘对不上。会计看一眼就知道，这一页是后来补的。这种做法我们厂里叫“抽换页”，一旦动了，就说明原来的页有不能给人看的东西。"},{"clue":"c_p4","a":"这是练字……不，是练别人的签名。越写越像，说明他要用。我在厂里见过，这是造假的第一步。对不起，我是不是说得太专业了？"},{"clue":"c_w1","a":"梁先生写得这样细，时间、方向、脚步都有，他一定没有说谎。我们这里的人，字写得越小，越是怕被人看轻。"}],"fallback":"对不起，这个我真的不记得，说不清。"},{"id":"hong","name":"洪建国","role":"病人家属","age":41,"look":{"skin":"tan","hair":"short","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","mood":"sly"},"bio":"苏婉如的丈夫，机修厂钳工。昨天下午探视，因山路塌方被困在院里，住在客房。自称晚饭后回客房睡觉，没见过院长。","demeanor":"粗嗓门，爱套近乎，急了拍桌子，一口车间腔","topics":[{"id":"t_bio","q":"你是干什么的？","a":"钳工，干了二十年，厂里的活儿我闭着眼都能干。咱是粗人，不会拐弯抹角，该说就说。我老婆在这儿住了四年，每月的费用我一分没少交，你问问院里。"},{"id":"t_visit","q":"你为什么来探视？","a":"一个月一回，这个月赶上台风。我带了橘子。她那脾气，隔着玻璃都吵，我也不想吵，就是想她安安稳稳在这儿，别折腾。"},{"id":"t_where","q":"昨夜你在哪里？","lie":true,"a":"客房，晚饭后就躺下了。外头风太大，我睡得不踏实，听见老魏砸门才爬起来。我连院长长啥样都没打过照面，你别往我身上扯。","truth":"我不在客房。快十一点的时候，我去了院长室门口，想最后求他一回，别让我老婆出院。我敲了好几次门，没人应，就在门口抽了四根烟，等到十一点一刻才走。我怕说出来你们觉得我是凶手，所以才瞒。"},{"id":"t_money","q":"你给过严副院长什么吗？","lie":true,"needs":["clue:c_s4"],"a":"没有，没有。我一个工人，一个月才挣几十块，哪来的钱孝敬领导？你别听人胡说八道，我跟严副院长连话都说不上几句。","truth":"每月八十，我给过，十一个月了。我厂里有个女工，跟我好了两年，我老婆一出院，这事就藏不住。我把钱塞给严副院长，求他多留她一阵。我不是个好人，可我真没动过院长一根指头。"},{"id":"t_wife","q":"你怎么对待你老婆？","a":"她是我孩子的娘，我不想她遭罪，也不想她回去遭罪。你们这些做官的、做学问的不会懂，一个家，我一个月六十来块工资，哪来那么多心力？她在这儿吃得饱穿得暖，我挺放心。"},{"id":"t_door","q":"你在门口都听到什么？","needs":["clue:c_w1"],"a":"里头没动静，只有一阵粗重的呼吸，呼噜呼噜的，我当他睡着了。门底下透出灯光，我敲了三回，没人开门。我就想着等他醒，一根接一根地抽，抽到十一点一刻才走。"},{"id":"t_heard","q":"你来的路上遇见谁？","needs":["ask:hong.t_door"],"a":"我是从客房那头过来的，拐进走廊，就见院长室门口那头有个白衣的影子，提着灯背对我往药房那头走，走得一拐一拐的，右脚拖地。我以为是哪个医生，没在意。事后想想，当时离我少说三四十步。"},{"id":"t_ghost","q":"听说院里闹鬼？","a":"我不信那些。不过住这里的人都爱说“白衣的”。我看他们是被药给灌的。你要问我，我信的是人，不是鬼。"}],"confronts":[{"clue":"c_s3","breaks":"t_where","a":"那四个烟蒂……是我的，大前门，我就抽这个。行，你逮着了！我是去过，可我就站在门口敲门，屁都没干！"},{"clue":"c_s4","breaks":"t_money","a":"这便条……他们连这个都记上了！行，我认。八十块，每个月。我一个钳工，一个月才六十几，剩下的是我借的。你可别让我老婆知道！"},{"clue":"c_r3","a":"拟十月出院！这就是我最怕的事。我没杀人，但我心里确实盼过他别这么痛快。我知道我不是东西。"},{"clue":"c_p3","a":"这鞋我认得，是宋药师的。他走路就这样，一高一低，院里谁没见过？你拿这个问我干什么，我可没碰过他的东西。"},{"clue":"c_w1","breaks":"t_where","a":"梁老师那本子，连我抽烟都记了？……行，那我不赖。我就是去求院长的，敲了门没人应，我也不敢硬闯。"}],"fallback":"这个我不懂，别问我，我就是个钳工。"},{"id":"wei","name":"魏德贵","role":"值夜护工","age":56,"look":{"skin":"brown","hair":"cap","hairColor":"grey","glasses":"none","beard":"stubble","outfit":"jacket","mood":"tired"},"bio":"松岚疗养院的老护工，管开水、扫地和后院的手摇发电机，在院里干了十四年。昨夜22:00 给院长送过开水，00:40 又去叩门，是第一个发现不对的人。","demeanor":"老实巴交，拖长音，爱说“咱们院里”，一紧张就搓手","topics":[{"id":"t_bio","q":"您在院里干什么？","a":"烧水、扫地、推车、摇发电机，咱们院里的粗活都归我。十四年了，院长待我不薄，逢年过节还给我留半斤酒票。他这一走，咱们院里怕是要散了。"},{"id":"t_water","q":"22:00 院长什么样？","a":"好好的，就是脸白，说话喘。他拉开抽屉看了看里头那两支小玻璃管，又推了回去，煮了针筒，吩咐我：今晚疼得厉害，别让人来吵，零点半再送一壶开水来。我应了，就出来了。"},{"id":"t_where","q":"你整夜在哪里？","lie":true,"a":"我哪儿也没去，整夜来回巡廊，开水房、病区、前后院，一遍遍地走。咱们院里台风夜，谁敢睡？零点二十我还在走，这才想起送水。","truth":"二十二点四十五巡了一趟，之后我就坐不住了，躲进发电机棚喝了半瓶地瓜烧，一醉就睡到零点二十。我这毛病院长知道，每回都骂我，也都护着我。我不敢跟人说，怕被辞，可我没害他。"},{"id":"t_find","q":"你怎么发现的？","a":"零点四十我端着水去叩门，叩了好几回没人应。我慌了，去叫严副院长。我俩拿斧头劈开的门，钥匙就放在桌上，门是锁着的，窗也闩着。院长趴在桌上，手还是温的。"},{"id":"t_song","q":
