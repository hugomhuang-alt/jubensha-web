<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>线上剧本杀</title>
<link rel="stylesheet" href="style.css?v=10171352">
</head>
<body>
<div id="banner" class="banner" hidden>连接已断开，正在重连…</div>
<div id="toast" class="toast" hidden></div>
<canvas id="snow"></canvas>

<main id="home" class="home" hidden>
  <button class="btn small ghost sfx-toggle home-tools" aria-label="声音开关">🔊</button>
  <div class="home-card">
    <div class="hero" id="hero">
      <div class="hero-title">
        <p class="eyebrow">选剧本 · 约朋友 · 开推理</p>
        <h1 id="homeTitle">雪夜云栖</h1>
      </div>
    </div>
    <div class="home-body">
      <p class="sub" id="homeSub">一桩发生在暴风雪山庄里的密室谋杀</p>
      <div class="net" data-s="wait" role="status"><i></i><span>正在连接联机服务器…</span></div>
      <div class="acct" id="acct" hidden><span class="acct-av" id="acctAv"></span><span class="acct-nm" id="acctNm"></span><button class="btn small ghost" id="logoutBtn">退出登录</button></div>
      <button id="detBtn" class="btn menu-big" hidden><span class="mb-ic">🔍</span><span class="mb-tx"><b>单人侦探</b><small>13 个案件 · 不用朋友，不用开麦</small></span></button>
      <button id="mpBtn" class="btn menu-big primary"><span class="mb-ic">👥</span><span class="mb-tx"><b>多人剧本杀</b><small>创建房间，或加入大家的房间</small></span></button>
      <div class="menu-row"><button class="btn small ghost" id="qualBtn">画质：自动</button></div>
      <p class="fine ver" id="ver"></p>
      <p class="fine" id="homeFine">4–8 人 · 约 90–120 分钟 · 需要麦克风（可选）</p>
    </div>
  </div>
</main>

<main id="auth" class="home auth" hidden>
  <div class="home-card">
    <div class="auth-hero"><div class="logo-mark"><i></i></div><p class="eyebrow">ABBA ENTERTAINMENT</p><h2>登录 / 注册</h2></div>
    <form class="home-body" id="authForm" autocomplete="on">
      <div class="seg" id="authSeg"><button type="button" class="on" data-m="login">登录</button><button type="button" data-m="register">注册</button></div>
      <label class="field"><span>邮箱（Gmail 等都可以）</span><input id="auEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@gmail.com"></label>
      <label class="field" id="auNickRow" hidden><span>昵称（游戏里别人看到的名字）</span><input id="auNick" maxlength="12" autocomplete="nickname" placeholder="例如：阿远"></label>
      <label class="field"><span>密码（至少 6 位）</span><input id="auPw" type="password" autocomplete="current-password" placeholder="••••••"></label>
      <button class="btn primary cta" id="auGo" type="submit">登录</button>
      <p class="fine" id="auMsg"></p>
      <div class="net" data-s="wait" role="status"><i></i><span>正在连接联机服务器…</span></div>
      <button class="btn small ghost" id="auGuest" type="button">先玩单人侦探（无需登录）</button>
    </form>
  </div>
</main>

<main id="mp" class="home mp" hidden>
  <div class="home-card">
    <div class="mp-head"><button class="btn small ghost" id="mpBack">‹ 返回</button><h2>多人剧本杀</h2><span class="net mini" data-s="wait"><i></i><span>连接中</span></span></div>
    <div class="home-body">
      <div class="seg" id="mpSeg"><button class="on" data-m="join">加入房间</button><button data-m="create">创建房间</button></div>
      <label class="field" id="mpNameRow" hidden><span>你的昵称</span><input id="nameInput" maxlength="12" placeholder="例如：阿远" autocomplete="off"></label>
      <section id="mpJoin">
        <div class="mp-sec"><h3>等待中的房间 <button class="btn small ghost" id="roomsRefresh">刷新</button></h3><div id="roomList" class="room-list"></div></div>
        <div class="or">或者输入房间码</div>
        <div class="join-row"><input id="codeInput" maxlength="4" placeholder="房间码" autocomplete="off" autocapitalize="characters"><button id="joinBtn" class="btn">加入</button></div>
      </section>
      <section id="mpCreate" hidden>
        <h3>选择剧本</h3><div id="mpScripts" class="sc-list"></div>
        <div class="cap-row"><span>房间人数</span><div class="stepper"><button class="btn small" id="capMinus">−</button><b id="capNum">4</b><button class="btn small" id="capPlus">+</button></div></div>
        <p class="fine">人数凑满后自动开始游戏，不需要房主手动点开始。</p>
        <button id="createBtn" class="btn primary cta">创建房间</button>
      </section>
    </div>
  </div>
</main>

<div id="splash" class="splash-logo"><div class="sl-inner"><div class="logo-mark big"><i></i></div><div class="sl-name">abba</div><div class="sl-sub">ENTERTAINMENT</div></div></div>

<main id="det" class="det" hidden></main>

<main id="room" class="room" hidden>
  <header class="topbar">
    <button id="backBtn" class="btn small ghost back-btn" aria-label="返回">‹ 返回</button>
    <div class="tb-left">
      <div class="room-code" id="roomCode" title="点击复制房间码"></div>
      <div class="net mini" data-s="wait" role="status"><i></i><span>连接中</span></div>
      <div class="phase-name" id="phaseName"></div>
    </div>
    <div class="tb-right"><div class="timer" id="timer"></div><button class="btn small ghost sfx-toggle" aria-label="声音开关">🔊</button></div>
  </header>

  <section id="players" class="players"></section>
  <section id="phaseCard" class="phase-card"></section>

  <nav class="tabs" id="tabs">
    <button data-tab="role">我的角色</button>
    <button data-tab="case">案情</button>
    <button data-tab="clues">线索</button>
    <button data-tab="chat">聊天<span class="dot" id="chatDot" hidden></span></button>
  </nav>

  <section id="tabBody" class="tab-body"></section>
  <section id="chatPane" class="chat-pane" hidden>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" maxlength="300" placeholder="发送文字消息…" autocomplete="off">
      <button class="btn">发送</button>
    </form>
  </section>

  <footer class="voicebar" id="voiceBar"></footer>
</main>

<script src="cases.js?v=10171352"></script>
<script src="config.js?v=10171352"></script>
<script src="art.js?v=10171352"></script>
<script src="sfx.js?v=10171352"></script>
<script src="fx.js?v=10171352"></script>
<script src="detective.js?v=10171352"></script>
<script src="app.js?v=10171352"></script>
</body>
</html>
