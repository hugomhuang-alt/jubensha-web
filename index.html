<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>线上剧本杀</title>
<link rel="stylesheet" href="style.css?v=10181943">
<link rel="stylesheet" href="werewolf.css?v=10181943">
</head>
<body>
<div id="banner" class="banner" hidden>连接已断开，正在重连…</div>
<div id="toast" class="toast" hidden></div>
<canvas id="snow"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gf" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e6b4"/><stop offset=".5" stop-color="#d4af5f"/><stop offset="1" stop-color="#8f6a2a"/></linearGradient></defs></svg>

<main id="home" class="screen home" hidden>
  <div class="bg-fade"></div>
  <header class="s-top"><button class="back home-back" id="homeBack" aria-label="游戏列表" hidden>‹</button><span class="mini-mark"><svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
<circle class="e-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gf)" stroke-width="1.6" pathLength="100"/>
<circle class="e-ring2" cx="60" cy="60" r="49" fill="none" stroke="url(#gf)" stroke-width=".5" opacity=".6" pathLength="100"/>
<g class="e-lens" fill="none" stroke="url(#gf)" stroke-width="1.5"><circle cx="48" cy="60" r="24" pathLength="100"/><circle cx="72" cy="60" r="24" pathLength="100"/></g>
<path class="e-gem" d="M60 44l7 16-7 16-7-16z" fill="url(#gf)"/></svg><b>abba</b></span><div class="s-top-r"><div class="acct" id="acct" hidden><span class="acct-av" id="acctAv"></span><span class="acct-nm" id="acctNm"></span><button class="link" id="logoutBtn">退出</button></div><button class="btn small ghost sfx-toggle" aria-label="声音开关">🔊</button></div></header>
  <section class="s-title"><h1 id="homeTitle">线上剧本杀</h1><p class="sub" id="homeSub">一桩案，一屋人，一个在说谎的</p></section>
  <section class="doors">
    <button id="detBtn" class="door" hidden><div class="door-art" id="artSolo"></div><div class="door-tx"><small>独自一人</small><b>单人侦探</b><span>13 桩案件，自己审问、搜证、指认</span></div><i class="door-go"></i></button>
    <button id="mpBtn" class="door gold"><div class="door-art" id="artMulti"></div><div class="door-tx"><small>和朋友一起</small><b>多人剧本杀</b><span>建房间，或加入正在等人的房间</span></div><i class="door-go"></i></button>
  </section>
  <footer class="s-foot"><div class="net" data-s="wait" role="status"><i></i><span>正在连接联机服务器…</span></div><button class="link" id="qualBtn">画质：自动</button><p class="fine ver" id="ver"></p><p class="fine" id="homeFine"></p></footer>
</main>

<main id="hub" class="screen hub" hidden>
  <div class="bg-fade"></div>
  <header class="s-top"><span class="mini-mark"><svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
<circle class="e-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gf)" stroke-width="1.6" pathLength="100"/>
<circle class="e-ring2" cx="60" cy="60" r="49" fill="none" stroke="url(#gf)" stroke-width=".5" opacity=".6" pathLength="100"/>
<g class="e-lens" fill="none" stroke="url(#gf)" stroke-width="1.5"><circle cx="48" cy="60" r="24" pathLength="100"/><circle cx="72" cy="60" r="24" pathLength="100"/></g>
<path class="e-gem" d="M60 44l7 16-7 16-7-16z" fill="url(#gf)"/></svg><b>abba</b></span><div class="s-top-r"><div class="acct" id="hubAcct" hidden><span class="acct-av" id="hubAv"></span><span class="acct-nm" id="hubNm"></span><button class="link" id="hubLogout">退出</button></div><button class="btn small ghost sfx-toggle" aria-label="声音开关">🔊</button></div></header>
  <section class="s-title"><h1>今晚玩什么</h1><p class="sub">选一个游戏开始</p></section>
  <section class="doors">
    <button id="hubScript" class="door gold"><div class="door-art" id="artHubScript"></div><div class="door-tx"><small>推理 · 单人 / 多人</small><b>剧本杀</b><span>28 桩单人案件，20 个多人剧本，找出说谎的人</span></div><i class="door-go"></i></button>
    <button id="hubWolf" class="door wolf"><div class="door-art" id="artHubWolf"></div><div class="door-tx"><small>6–12 人 · 可补机器人</small><b>狼人杀</b><span>狼人、预言家、女巫、猎人、守卫……天黑请闭眼</span></div><i class="door-go"></i></button>
    <div class="door soon" aria-disabled="true"><div class="door-art"></div><div class="door-tx"><small>敬请期待</small><b>更多游戏</b><span>正在准备中</span></div></div>
  </section>
  <footer class="s-foot"><div class="net" data-s="wait" role="status"><i></i><span>正在连接联机服务器…</span></div></footer>
</main>

<main id="ww" class="screen ww" hidden>
  <div class="bg-fade"></div>
  <header class="ww-top"><button class="back" id="wwBack" aria-label="返回">‹</button><h2 id="wwTitle">狼人杀</h2><div class="ww-top-r"><span class="ww-timer" id="wwTimer"></span><span class="net mini" data-s="wait"><i></i><span>连接中</span></span><button class="btn small ghost sfx-toggle" aria-label="声音开关">🔊</button></div></header>
  <div id="wwBody" class="ww-body"></div>
</main>

<main id="auth" class="screen auth" hidden>
  <div class="bg-fade"></div>
  <header class="s-top"><span class="mini-mark"><svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
<circle class="e-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gf)" stroke-width="1.6" pathLength="100"/>
<circle class="e-ring2" cx="60" cy="60" r="49" fill="none" stroke="url(#gf)" stroke-width=".5" opacity=".6" pathLength="100"/>
<g class="e-lens" fill="none" stroke="url(#gf)" stroke-width="1.5"><circle cx="48" cy="60" r="24" pathLength="100"/><circle cx="72" cy="60" r="24" pathLength="100"/></g>
<path class="e-gem" d="M60 44l7 16-7 16-7-16z" fill="url(#gf)"/></svg><b>abba</b></span></header>
  <form class="auth-form" id="authForm" autocomplete="on">
    <button class="btn primary cta" id="auContinue" type="button" hidden>继续</button>
    <h2 id="auTitle">欢迎回来</h2><p class="sub" id="auSub">登录后可以创建房间、加入朋友的房间；也可以先以游客身份进去逛逛。</p>
    <label class="uf"><span>邮箱</span><input id="auEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@gmail.com"></label>
    <label class="uf" id="auNickRow" hidden><span>昵称</span><input id="auNick" maxlength="12" autocomplete="nickname" placeholder="游戏里别人看到的名字"></label>
    <label class="uf"><span>密码</span><input id="auPw" type="password" autocomplete="current-password" placeholder="至少 6 位"></label>
    <button class="btn primary cta" id="auGo" type="submit">登录</button>
    <p class="au-msg" id="auMsg"></p>
    <div class="au-alt"><span id="auAltTx">还没有账号？</span><button class="link" type="button" id="auSwitch">注册</button></div>
    <div class="seg" id="authSeg" hidden><button type="button" class="on" data-m="login">登录</button><button type="button" data-m="register">注册</button></div>
    <button class="link quiet" id="auGuest" type="button">游客身份进入</button>
    <div class="net" data-s="wait" role="status"><i></i><span>正在连接联机服务器…</span></div>
  </form>
</main>

<main id="mp" class="screen mp" hidden>
  <div class="bg-fade"></div>
  <header class="s-top"><button class="back" id="mpBack" aria-label="返回">‹</button><h2>多人剧本杀</h2><span class="net mini" data-s="wait"><i></i><span>连接中</span></span></header>
  <div class="tabs2" id="mpSeg"><button class="on" data-m="join">加入房间</button><button data-m="create">创建房间</button></div>
  <label class="uf" id="mpNameRow" hidden><span>你的昵称</span><input id="nameInput" maxlength="12" placeholder="例如：阿远" autocomplete="off"></label>
  <section id="mpJoin">
    <div class="sec-h"><h3>正在等人的房间</h3><button class="link" id="roomsRefresh">刷新</button></div>
    <div id="roomList" class="room-list"></div>
    <div class="code-join"><span>知道房间码？</span><div class="join-row"><input id="codeInput" maxlength="4" placeholder="四位房间码" autocomplete="off" autocapitalize="characters"><button id="joinBtn" class="btn primary">加入</button></div></div>
  </section>
  <section id="mpCreate" hidden>
    <label class="uf"><span>房间密码（可不填）</span><input id="roomPw" maxlength="12" placeholder="设置后，朋友进房要输入密码" autocomplete="off"></label>
    <div class="sec-h"><h3>选剧本（点一下就选中，下面随时可以创建）</h3></div><div id="mpScripts" class="sc-list"></div>
    <div class="mp-bar">
      <div class="cap-row"><span>房间人数</span><div class="stepper"><button class="btn small" id="capMinus">−</button><b id="capNum">4</b><button class="btn small" id="capPlus">+</button></div></div>
      <button id="createBtn" class="btn primary cta">创建房间</button>
      <p class="fine">人到齐、并且都点了“准备”，游戏自动开始。</p>
    </div>
  </section>
</main>

<div id="splash" class="splash-logo"><div class="sl-inner"><div class="sl-emblem"><svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
<circle class="e-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gf)" stroke-width="1.6" pathLength="100"/>
<circle class="e-ring2" cx="60" cy="60" r="49" fill="none" stroke="url(#gf)" stroke-width=".5" opacity=".6" pathLength="100"/>
<g class="e-lens" fill="none" stroke="url(#gf)" stroke-width="1.5"><circle cx="48" cy="60" r="24" pathLength="100"/><circle cx="72" cy="60" r="24" pathLength="100"/></g>
<path class="e-gem" d="M60 44l7 16-7 16-7-16z" fill="url(#gf)"/></svg></div><div class="sl-word"><span>A</span><span>B</span><span>B</span><span>A</span></div><div class="sl-rule"></div><div class="sl-sub">ENTERTAINMENT</div></div><div class="sl-sweep"></div></div>

<main id="det" class="det" hidden></main>

<main id="room" class="room" hidden>
  <header class="topbar">
    <button id="backBtn" class="btn small ghost back-btn" aria-label="返回">‹ 返回</button>
    <div class="tb-left">
      <div class="room-code" id="roomCode" title="点击复制房间码"></div>
      <div class="net mini" data-s="wait" role="status"><i></i><span>连接中</span></div>
      <div class="phase-name" id="phaseName"></div>
    </div>
    <div class="tb-right"><div class="timer" id="timer"></div><button class="btn small ghost sfx-toggle" aria-label="声音开关">🔊</button></div>
  </header>

  <section id="players" class="players"></section>
  <section id="phaseCard" class="phase-card"></section>

  <nav class="tabs" id="tabs">
    <button data-tab="role">我的角色</button>
    <button data-tab="case">案情</button>
    <button data-tab="clues">线索</button>
    <button data-tab="chat">聊天<span class="dot" id="chatDot" hidden></span></button>
  </nav>

  <section id="tabBody" class="tab-body"></section>
  <section id="chatPane" class="chat-pane" hidden>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" maxlength="300" placeholder="发送文字消息…" autocomplete="off">
      <button class="btn">发送</button>
    </form>
  </section>

  <footer class="voicebar" id="voiceBar"></footer>
</main>

<script src="cases.js?v=10181943"></script>
<script src="config.js?v=10181943"></script>
<script src="art.js?v=10181943"></script>
<script src="sfx.js?v=10181943"></script>
<script src="fx.js?v=10181943"></script>
<script src="detective.js?v=10181943"></script>
<script src="werewolf.js?v=10181943"></script>
<script src="app.js?v=10181943"></script>
</body>
</html>
