晚出了这种事，我比谁都心痛。你们要什么，尽管问，我是医生，一向配合。"},{"id":"t_where","q":"祝酒后你在哪？","lie":true,"a":"二十一点四十离席后，我到花园凉亭抽烟，苏念陪着我，聊她母亲的病。我们在那儿待到二十二点四十，才分头回去。她可以作证。","truth":"我没在凉亭。二十点四十五我拿了酒窖钥匙，下去见知夏；祝酒时上来露了个面，之后又回酒窖，一直待到二十二点四十。苏念没陪我，是我让她这么说的。"},{"id":"t_death","q":"死亡时间怎么判断？","lie":true,"a":"我到码头时她身体还是温的，瞳孔、肢体都对得上，溺水，二十二点五十到二十三点十分。我是医生，这点判断我有把握。","truth":"那是我编的。她二十一点十七分就死在酒窖里，我在她的酒里下了药，又捂住她的口鼻。后来我和苏念趁风雨把她抬到码头，放进水里。海水冷，没人分得出来。"},{"id":"t_tell","q":"谁是知夏，谁是知秋？","lie":true,"a":"双胞胎我也分不清，只能认衣服：蓝裙是知秋，红裙是知夏。她认错自己是受了刺激，我建议她先吃一片镇静药，睡一觉就好了。","truth":"我分得清。知夏二十五岁那年的阑尾是我开的刀，我知道谁有那道疤。我故意把死者说成知秋，因为只有死的是吃药的知秋，尸检里的镇静成分才讲得通。"},{"id":"t_old","q":"二十年前周辉的事","lie":true,"a":"那晚捞上来他已经没有呼吸，我尽了全力，二十三点四十分才宣布死亡，是顾及家属心情。你们现在翻这件事，对谁都是伤害。","truth":"他当时还有微弱呼吸。林国梁不许送医，我取消了派车，什么也没做，眼睁睁看他停了。我收下二百万，开了诊所。知夏拿到了证据，说零点要报警，所以……"},{"id":"t_qiu","q":"你为何说她是知夏？","a":"我见过太多受刺激的人，把自己当成死者是一种心理防御。再说，知秋这孩子心思重，这些年总觉得姐姐什么都占先，几次跟我念叨过。我劝她吃镇静药，是怕她想不开，做出更糟的事来。"},{"id":"t_bag","q":"出诊包里少了药？","needs":["clue:c_hall2"],"lie":true,"a":"咪达唑仑少两支？上周给知秋临时镇静用掉的，还没来得及补登记。这点小事，是我疏忽，跟案子没有关系。","truth":"没有给知秋用。那两支是我拿的，一支兑进知夏的酒，一支留作备用。用完的空安瓿被我扔进了海里。"},{"id":"t_su","q":"你和苏念的关系？","a":"她母亲的病我一直帮着看，没跟她提过钱。心地善良的孩子，就是耳根子软，谁说什么都信——有些朋友，也不见得都为她好。今晚她陪我坐凉亭，一直在发抖，我只当她是怕雨。你们对她客气点。"},{"id":"t_sleep","q":"知秋有没有梦游？","a":"有过。几年前她半夜走到过海边，我给她开了药。所以今晚水里捞起来的人，我头一个念头就是她。这话难听，可医生看多了，先看病史，再看别的。倒是承泽那边，我听说债主逼得紧，你们也该问问。"}],"confronts":[{"clue":"c_hall1","breaks":"t_where","crack":true,"a":"他盯着“20:45 取，宋”那一行，脸上的笑意僵了一瞬：“我拿钥匙是想给寿星挑瓶酒祝寿，这不犯法吧？”他停了停，嗓子发干，“……可我没还，是吗。我老了，记性不好。”"},{"clue":"c_dining1","breaks":"t_where","a":"录像里苏念一直在甜品台忙碌，他看了很久，终于干笑一声：“她大概记错了时间，或者我记错了。人上了岁数，一点事就混淆。”可他的手背上青筋一根根鼓了起来。"},{"clue":"c_garden2","breaks":"t_death","crack":true,"a":"他看着那条二十一点十七分归零的曲线，沉默了很久。“表……”他低声说，“我没想过，她戴着这么个东西。”他终于抬起头，目光里没有医生的温和，只剩疲惫，“水锁，二十二点五十二分。你们都看到了。”"},{"clue":"c_cellar2","breaks":"t_death","a":"他看着那两道擦痕和石灰粉，嘴角抽了抽：“酒窖地面本来就脏，擦痕是搬酒留下的。”顿了顿，又说，“可……鞋跟的擦痕，也是搬酒搬出来的吗？”说完他自己先沉默了。"},{"clue":"c_cellar1","breaks":"t_bag","a":"他看着杯底那层发黏的残液，没有再辩解。“那杯子……”他慢慢地说，“是我擦的，我擦了自己那一只。”他闭了闭眼，“她那杯我没敢碰。”"},{"clue":"c_garden1","breaks":"t_tell","a":"他看着那道旧疤，喉结滚了两下：“……右下腹，四厘米，我自己缝的。”他抬眼看你，嗓音沙哑，“你们不会放过这个细节的，是吧。”"},{"clue":"c_study1","breaks":"t_old","a":"他拿起那份“取消派车”的调度记录，手指微微发抖：“这份东西，她是从保险箱里拿的？”他嘴唇哆嗦着，“二十年了，我以为它早就跟林国梁一起烧成灰了。”"},{"clue":"c_hall2","a":"“药品清点？我每个月都清点。”他瞥了一眼，语速快了一点，“这个跟案子没关系，我自己出诊用的。我的助眠药是开给知秋的，这谁都知道。”"},{"clue":"c_cellar3","a":"“老国梁的铁盒？”他摇头，“我只在多年前见他开过一次，里头像是些旧药和旧信。谁撬的，拿走了什么，我真不知道。这家里想翻旧账的人，可不止一个。”"},{"clue":"c_garden4","a":"“这是谁的相机？”他的目光在照片上停了一下，“天黑，雨大，这种长曝光谁看得清？披肩的是个女人，高个子的……你们不会觉得是我吧？”"}],"fallback":"孩子，这个我一时想不起来。你问点别的。"},{"id":"zhou","name":"周妈","role":"管家","age":62,"look":{"skin":"tan","hair":"bun","hairColor":"grey","glasses":"none","beard":"none","outfit":"apron","mood":"stern"},"bio":"在林家做了三十多年的管家，姐妹俩是她一手带大的。二十年前她的儿子周辉在码头溺亡。当晚称一直在厨房忙碌。","demeanor":"寡言，带方言腔，爱说“晓得”“不作兴”，说到儿子时会停顿。","topics":[{"id":"t_peace","q":"周辉的事你放下了吗？","lie":true,"a":"二十年了，早放下了。林家供我吃住，周辉的事我不恨任何人。人各有命，我老了，只想把这最后几年安安静静过完。","truth":"我没放下。三天前我把保险箱的号码告诉了知夏小姐，说有些事她该知道了。我恨，恨得夜里睡不着觉，可我没害她，我疼她们俩像疼自己的孩子。"},{"id":"t_hand","q":"你分得出两姐妹吗？","a":"我带大的，闭着眼睛也分得出。知夏左手，知秋右手。红裙那位一晚上都拿右手，左手只托着杯底，我就晓得她是知秋。我没敢讲，怕人当我老糊涂了。"},{"id":"t_night","q":"今晚你在做什么？","lie":true,"a":"一直在厨房，备夜宵、洗碗、收拾，脚没沾过地。窗户正对着后花园小路，雨大，啥也看不清。我这把年纪，不作兴瞎打听。","truth":"我出过一趟后门。二十二点四十几分我拎垃圾出去，看见路上有人抬东西往码头走。我退回檐下，一声没敢吭。我怕说出口，别人当我是替儿子寻仇，乱咬人。"},{"id":"t_old","q":"二十年前那晚的事","a":"周辉十九岁，会修船，会唱歌。那晚他被捞上来，我打了120，说他还有气。后来医生来了，说没救了。我一直想不通，120怎么没来。"},{"id":"t_safe","q":"保险箱的号码","needs":["ask:zhou.t_peace"],"a":"号码是老爷的生日，二十年我都知道，从来没动过。三天前知夏小姐问我周辉的事，她哭了，我才告诉她：该看的，都在里面。"},{"id":"t_doc","q":"你怎么看宋医生？","needs":["clue:c_study1","ask:zhou.t_safe"],"a":"我就想不通那晚120怎么没来。原来……是被人取消的。那个人在我家吃了二十年的年夜饭，我还给他煮过长寿面。我是个下人，我讲了，谁信？"},{"id":"t_window","q":"厨房窗外看见什么？","needs":["ask:zhou.t_night","clue:c_cellar2","clue:c_garden4"],"a":"二十二点四十几分，我拎垃圾出后门，在檐下躲雨。路上两个人影，抬着个长条的东西往码头走。风大，我退回檐下，没敢出声。你莫问我为啥先头不讲。"},{"id":"t_seen","q":"那两个人你看清了吗？","needs":["ask:zhou.t_window","clue:c_garden4"],"a":"一个裹着浅黄披肩，是个女人，肩膀在抖。另一个高个子，深色衣裳，从我跟前过的时候，一股药水味，碘伏还是药油我闻不准。我不敢说是哪个，怕被当成替儿子报仇，乱咬人。"},{"id":"t_key","q":"酒窖钥匙是谁取的？","needs":["clue:c_hall1"],"a":"三天前我取过一回，拿酒做寿宴，当天就还了。今晚的我没碰过。钥匙从来不许放在外面过夜，这是老爷定的规矩。"}],"confronts":[{"clue":"c_study1","breaks":"t_peace","a":"她一页一页翻着，翻到第一页，手一下子攥紧：“这是我打的电话……”嗓子像被什么堵住，“我骗你们了。我没放下，我一天也没放下。那个号码，是我告诉她的。”"},{"clue":"c_dining3","a":"“这是我的字。”她摸了摸台账，“二十二点十五分起我收厨房，碗洗了三遍，手都泡白了。”说完才发现自己握着围裙，捏得指节发白。"},{"clue":"c_hall1","a":"“酒窖钥匙，规矩是用完就还。”她皱起眉，“宋医生是熟人，我从来不管他拿不拿。可他拿了不还，不是他的作风。”"},{"clue":"c_cellar3","a":"她看着空了的暗格，半晌才说：“老爷在这里放过一只铁盒，装的都是不能见光的东西。二十年了，没人动过。是知夏小姐拿的吧。”"},{"clue":"c_garden4","breaks":"t_night","a":"她把相片凑到眼前，嘴唇抖了好久：“披肩……我晓得，我晓得这两个人。”她攥紧围裙，“我骗你们了，我出过后门。我怕啊，说出来谁信我？”"},{"clue":"c_garden2","a":"她看着那条归零的曲线，一声不吭，眼泪突然落下来：“二十年前那一晚，我儿子也是这样……我没法说，我真的没法说。”"}],"fallback":"这个我不晓得。你去问别人吧。"},{"id":"liu","name":"柳月华","role":"继母","age":58,"look":{"skin":"light","hair":"bob","hairColor":"grey","glasses":"none","beard":"none","outfit":"qipao","acc":"necklace","mood":"worried"},"bio":"林国梁的续弦，姐妹俩的继母，林氏基金会的执行人。晚宴上话不多，称二十一点后头疼，回二楼房间休息。","demeanor":"客气克制，说话绕圈，被戳到痛处会攥手帕。","topics":[{"id":"t_trust","q":"你了解信托吗？","lie":true,"a":"我一个妇道人家，对信托一窍不通。国梁在世时就是男人管事，我只管家里。什么零点，什么基金会，我都是今晚才听梁律师说的。","truth":"我知道。九月十二日梁律师亲口告诉了我，我问得很细。我怕知夏一接手就解散基金会，把我这个继母赶出林家，所以才问了又问。"},{"id":"t_where","q":"二十一点后你在哪？","lie":true,"a":"我头疼，二十一点以后就一直在二楼自己房间躺着，直到听见尖叫。房间里没别人，也没人能给我作证。","truth":"我没躺着。二十一点半后我溜进客房，翻知夏的提包找新遗嘱，什么也没找到，还把老花镜落在了床头。我真的没害她，我只是怕。"},{"id":"t_rel","q":"你和姐妹俩的关系？","a":"我嫁进来时她们十六岁，一个冷一个热，谁也没当我是母亲。可我把她们的生日、药、冷暖记得比谁都牢。外人说我是后妈，也由他们说。"},{"id":"t_benefit","q":"知夏死了你得益吧？","a":"我知道所有人都会这么看我。可我若想要钱，何必等到今天？基金会这些年的账都是我管，我每个月自己的薪水，一分也没多拿。你们尽管查。"},{"id":"t_hand","q":"你认得出谁是谁吗？","a":"我认不出。没人认得出，那孩子红裙、蓝裙一换，连我也糊涂了。宋医生说是知夏受惊，我信了，毕竟他是医生。"},{"id":"t_song","q":"你看到过宋医生吗？","needs":["ask:liu.t_where"],"a":"房门没关严，我躺着，听见楼下有人快步往地下室去，皮鞋声很重，二十一点四十多吧。这家里穿皮鞋走路那么响的，宋医生、承泽，都有可能。我当时只当是去拿酒，没多想。"},{"id":"t_old","q":"周辉的事你了解多少？","a":"国梁从来不许人提。我嫁进来的第二年才听说，那孩子在码头淹死了。他每年那一天都喝到烂醉，说“我对不起那孩子”，我也问不出究竟。"},{"id":"t_fund","q":"基金会是怎么回事？","needs":["clue:c_study3"],"a":"基金会是老太爷留下的，专门管家族信托的收益。知夏要是零点继承，基金会就要被她解散，我这个执行人，也就没用了。……我承认我怕。"}],"confronts":[{"clue":"c_study3","breaks":"t_trust","a":"她盯着“柳问信托条款，已告知”那一行，慢慢叹了口气：“梁叙，你啊。”她把手帕攥在掌心里，“是，我问过。我不是图钱，我是怕被扫地出门。”"},{"clue":"c_guest3","breaks":"t_where","a":"她盯着那副金丝老花镜，脸色白了：“我就说怎么到处找不到。”她闭了闭眼，“是我。我在知夏的包里翻来翻去，什么也没找到。我只是想知道，她会不会把我赶走。”"},{"clue":"c_hall1","a":"她看着钥匙登记簿，慢慢说：“宋医生取的钥匙？他老是爱往酒窖跑。”顿了顿，语气里有一点犹疑，“我隔着门听见有人往酒窖那边去，皮鞋声……我不敢说一定是他。”"},{"clue":"c_study1","a":"她一页页看完，手指发抖：“国梁……他到底做了什么。”她抬起头，声音有些哑，“我嫁给他的时候，一点也不知道这些。”"},{"clue":"c_garden2","a":"她看着那条归零的曲线，嘴唇发白：“二十一点十七分……那时候楼下还在唱生日歌，我躺着都听得见。不管是知夏还是知秋，那会儿不是还在笑吗？”"}],"fallback":"这个……我真不清楚，你别为难我。"},{"id":"su","name":"苏念","role":"知秋闺蜜","age":39,"look":{"skin":"light","hair":"ponytail","hairColor":"brown","glasses":"none","beard":"none","outfit":"dress","acc":"scarf","mood":"worried"},"bio":"知秋的大学室友，二十多年的闺蜜，在一家画廊工作。第一个“发现”落水者并呼救，称当时在花园透气。","demeanor":"说话轻，爱用“其实”“我也不知道”，一紧张就绞披肩。","topics":[{"id":"t_where","q":"祝酒后你在哪？","lie":true,"a":"二十一点四十到二十二点四十，我一直在花园凉亭陪宋医生，聊我妈的病。他心善，帮了我家这么多，我也想听听他的建议。我可以发誓。","truth":"我没和他在凉亭。二十一点二十五我在甜品台摆盘，二十二点后他叫我去了酒窖。我欠他很多钱，一时糊涂，替他说了谎。"},{"id":"t_pier","q":"你怎么发现尸体的？","lie":true,"a":"二十二点五十八分，我去花园透气，远远看见码头水里漂着一个人。我吓坏了，喊着就跑回屋，连码头的边都没敢上。","truth":"我上过码头。我和宋医生把人从酒窖抬出来，放进了水里，再喊人。他说这是意外，只要口径一致，就替我还清我妈的医药费。我做梦都在看她的眼睛。"},{"id":"t_mother","q":"你母亲的病？","a":"尿毒症，每周透析两次，一次三千多。宋医生这些年一直帮我垫着，欠了他三十多万。我没办法，每次想起来，我就觉得自己活得像个借条。"},{"id":"t_friend","q":"你和这对姐妹的关系？","a":"我和知秋是大学室友，二十年的交情了。其实知夏更像大姐，嘴硬心软，也帮过我。她们俩的事我不敢乱说……今晚谁跟谁换了裙子，我也是进门才晓得。我现在怕得睡不着。"},{"id":"t_dessert","q":"你在甜品台看到什么？","needs":["clue:c_dining1"],"a":"我一直在摆盘补酒。二十一点四十，宋医生离席时在我耳边说了一句“等下我找你”，我以为他要和我谈我妈的事，就一直守在甜品台。"},{"id":"t_song","q":"你怎么看宋医生？","a":"他对我妈有恩，是长辈……其实今晚他有点怪，老盯着红裙那位，还问我她吃没吃药。我也不知道是不是多心，医生嘛，职业习惯。出了这种事，我想他也不好受。"},{"id":"t_cry","q":"你还有什么没说？","needs":["ask:su.t_pier","clue:c_guest2"],"a":"我只知道他说那是意外，我不用怕，听他的就行。我每天晚上都做噩梦，求你们别告诉我妈。……知夏那个眼神，我这辈子都忘不了。"}],"confronts":[{"clue":"c_dining1","breaks":"t_where","a":"她盯着录像里自己摆盘的身影，脸一下子没了血色：“我……那段时间我确实在甜品台。”她咽了口唾沫，“可宋医生说……他说如果有人问，我就这么讲。”"},{"clue":"c_garden3","breaks":"t_where","a":"她看着凉亭里的灰，半晌才开口：“我们……是说在这里。可是，没有。”她声音越来越小，“我什么也没想，宋医生叫我说什么，我就说了什么。”"},{"clue":"c_guest2","breaks":"t_pier","a":"她认出自己的披肩，浑身一颤：“我、我淋雨了，雨水溅的……”话没说完，她看见披肩上的暗红污渍，嘴唇哆嗦着，“……不。是我上过码头。我什么都不想说了。”"},{"clue":"c_garden4","breaks":"t_pier","a":"她看着长曝光里的两个人影，看了很久很久，手指绞着衣角：“披肩……是我的。”声音像从很远的地方传来，“别人看见了，我就说不下去了。”"},{"clue":"c_hall2","a":"她瞥了一眼清单：“这是宋医生的包，我从来不碰。”她把脸转开，“药的事，他从来不跟我讲。”"}],"fallback":"我……我不太清楚，对不起。"},{"id":"cheng","name":"程野","role":"神秘访客","age":35,"look":{"skin":"tan","hair":"messy","hairColor":"black","glasses":"none","beard":"stubble","outfit":"jacket","mood":"sly"},"bio":"十九点五十来到别墅的陌生男子，自称是朋友带来的客人，晚宴后很少露面，案发时没人说得清他在哪里。","demeanor":"说话懒散带笑，爱反问，被逼问时爱摸鼻子。","topics":[{"id":"t_who","q":"你为什么来这里？","lie":true,"a":"哎，我就是朋友带来蹭饭的，和林家谁都不熟，知夏小姐嘛，更是素不相识。事情闹成这样，我也想早点走，别给我惹上麻烦。","truth":"三周前知夏雇了我，让我重新调查二十年前周辉溺水的旧案。今晚我是来当见证人的，她答应零点前给我“原件”。我怕被当成别有用心的人，就撒了谎。"},{"id":"t_where","q":"二十二点后你在哪？","lie":true,"a":"我一直在宴会厅啊，吃蛋糕、喝酒，跟人闲聊。到处是人，没人特别注意我也正常，我这人本来就不起眼，嘿。","truth":"我在悬崖观景台，知夏让我二十二点起守在那儿，说她若迟迟不回来，就把镜头对准码头，“万一我出了事，总有人要往海边走”。我拍到了，可没敢说，怕被当成跟踪狂，更怕被当成同伙。"},{"id":"t_job","q":"你是做什么的？","a":"独立调查人，做旧案复核、保险理赔核查。别想歪，我合法经营，有执照。今晚是我头一回见这么大的阵仗，你们这一家子，都不太对劲。"},{"id":"t_photo","q":"观景台那台相机？","needs":["clue:c_garden4","ask:cheng.t_where"],"a":"是我的。长曝光，只能拍到人影、披肩和长条状的东西。雨太大，台阶又滑，我没敢走近。要是我当时冲下去，也许……算了，说这个也没用。"},{"id":"t_xia","q":"知夏雇你时说了什么？","needs":["ask:cheng.t_who"],"a":"她说二十年前那晚有人撒了谎，要证据，一份“原件”，说零点前能拿到，叫我在场当见证。她还说，如果她迟到，叫我别急，多半是在见一个不太愿意见她的人。"},{"id":"t_doc","q":"她提到过要见谁吗？","needs":["ask:cheng.t_xia","clue:c_study1"],"a":"她说是“当年经手那件事的人”。我问是谁，她只笑，说“你今晚就能看到”。她要的是原件，复印件不顶用。可现在……她再也没机会了。"},{"id":"t_hand","q":"你认得出谁是谁吗？","a":"我就见过知夏一面，红裙那位走路不一样，右肩略沉，知夏是左肩沉。我不敢肯定，毕竟灯光一晃，两张脸一模一样。"}],"confronts":[{"clue":"c_hall3","breaks":"t_who","a":"他摸了摸鼻子，笑得有点尴尬：“被你们翻出来了。是，她约的我。我不想卷进去，才撒了谎。三周前她给了我预付款，我总不能说自己是蹭饭的吧。”"},{"clue":"c_garden4","breaks":"t_where","a":"他叹了口气，肩膀垮下来：“那是我的相机。我不敢认，因为我在那里，什么也没做。”他把手插进头发，“要是我当时冲下去，也许……”后半句他咽回去了。"},{"clue":"c_study1","a":"他把三份复印件看了一遍，吹了声口哨又立刻收住：“这就是她说的东西。二十年前的120调度记录……果然有人撒了谎。不是普通的谎，是人命。”"},{"clue":"c_guest1","a":"“八点五十，酒窖。”他念着便签，“她没跟我说是酒窖。”顿了一下，“她也许是不想我跟着她。她说有些话只能她和那个人单独说。”"},{"clue":"c_garden2","a":"他盯着零线，脸色一点点沉下去：“二十一点十七分……我那时候在宴会厅外面抽烟，还看见红裙那位和人碰杯。……可她其实已经——”他没再说下去。"}],"fallback":"这个我就不好说了，你找别人问问。"}],"solution":{"culprit":"song","method":{"q":"凶手是怎么做到的？","options":["谢承泽在书房与妻子争执后失手掐死她，再借换装让妹妹顶替身份，独吞信托","柳月华在客房翻遗嘱时被蓝裙的死者撞破，推她下楼致死，再由周妈协助抛尸入海","宋怀仁在酒窖用药迷晕并捂死蓝裙死者，再与苏念趁暴雨抬到码头，伪装成溺水","红裙女子趁换装把姐姐骗到码头推入水中，事后谎称自己才是妹妹，逃避继承纠纷"],"correct":2},"motive":{"q":"为什么杀人？","options":["二十年前他私吞林家付给周妈的赔偿金，被知夏查出账目后要报警揭发他","知夏零点继承后将解散基金会，他作为基金顾问医生会失去全部收入来源","他与苏念有私情，被知夏撞破并威胁当众揭露，他为保住名誉先下了手","二十年前他取消急救见死不救还收了封口费，知夏拿到证据要在零点前报警"],"correct":3},"keyClues":["c_hall1","c_cellar1","c_garden1","c_garden2","c_dining1","c_study1"],"truth":["凶手是私人医生宋怀仁，苏念是他的共犯。死的不是外界以为的“知秋”，而是姐姐林知夏；活下来、坚称自己是知秋的红裙女子，说的是实话。","身份错觉：姐妹按惯例互换装束，知夏托知秋“撑到蛋糕”，自己穿着妹妹的蓝裙，二十点五十去酒窖见宋怀仁，要他交出二十年前的原件。宾客把红裙当成知夏，红裙的知秋右手签字、左手托杯，宴会厅录像和留言簿都能证明她不是左撇子的知夏。","时间错觉：宋怀仁在酒里下了药，捂死知夏，手表心率二十一点十七分归零。他让苏念在凉亭作伪证，酒窖钥匙却一直没还；二十二点四十左右两人经酒窖外侧小门把尸体抬向码头，二十二点五十二分入水（手表“水锁”与观景台照片），二十二点五十八分苏念“发现”。于是真正的死亡时间被推迟了一个半小时，二十二点五十分之后各人的在场与否都成了误导。","为什么偏偏要让死者被当成知秋：知秋长期失眠，服用宋怀仁开的镇静药，尸检里的药物成分便能解释为“自服”，还可以说她有梦游旧疾。宋怀仁因此一口咬定红裙女子是受惊吓的知夏。可他亲手给知夏割过阑尾，遗体右下腹的旧疤就是他无法辩驳的证据。","红鲱鱼：谢承泽伪造签名，分不清妻子；柳月华翻找遗嘱，是信托的受益人；周妈为儿子积怨已久，给了知夏保险箱号码；梁叙隐瞒了条款已经泄露；程野隐瞒了自己受知夏雇佣。这些谎言各自遮着私心，都与命案无关。","动机：二十年前同夜，周辉被捞上岸时还有微弱呼吸，周妈打了急救电话；林国梁不愿声张，宋怀仁以“家庭医生在场”取消派车，收下二百万开了诊所。知夏取得调度记录和死亡证明副本，打算午夜前逼他认罪，他于是先下手。"]}}];

<script>
'use strict';
// 视觉特效：飘雪、点击涟漪、打字机、火花/彩带、卡片倾斜
const FX = (() => {

    let w = 0, h = 0, raf = 0, flakes = [], dead = false;
    const fit = () => {

      const r = el.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width - 0.5), y = ((e.clientY - r.top) / r.height - 0.5);
      el.style.transform = `perspective(700px) rotateY(${(x * 14).toFixed(1)}deg) rotateX(${(-y * 14).toFixed(1)}deg)`;
      el.style.setProperty('--sx', (x + 0.5) * 100 + '%');
    };
    const reset = () => { el.style.transform = ''; };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerleave', reset);
    el.addEventListener('pointerup', reset);
  }

  // 闪烁的小星星，撒在一个元素里
  function sparkle(el, n, o = {}) {
    if (!el || reduce() || LITE) return null;
    const w = document.createElement('div');
    w.className = 'spk-wrap';
    for (let i = 0; i < (n || 8); i++) {
      const s = document.createElement('i');
      s.className = 'spk';
      s.style.cssText = `left:${(Math.random() * 96).toFixed(0)}%;top:${(Math.random() * 96).toFixed(0)}%;--s:${(o.min || 6) + Math.random() * (o.max || 12)}px;animation-delay:-${(Math.random() * 3).toFixed(2)}s;animation-duration:${(1.5 + Math.random() * 2).toFixed(2)}s`;
      w.appendChild(s);
    }
    el.appendChild(w);
    return w;
  }
  // 点击处迸出一圈火花
  function pop(x, y) {
    if (reduce() || LITE) return;
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('i');
      const a = (i / 9) * 6.283 + Math.random() * 0.5, d = 26 + Math.random() * 30;
      s.className = 'popk';
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;--r:${(Math.random() * 180).toFixed(0)}deg`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 750);
    }
  }
  return { snow, typewriter, burst, tilt, sparkle, pop, reduce };
})();
if (typeof window !== 'undefined') window.FX = FX;

</script>
<script>
'use strict';
// 单人侦探模式：纯前端。案件数据来自 window.__CASES（见 docs/detective-spec.md）。
// 进度存 localStorage（读写都包 try/catch，存不了也能玩）。
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const root = () => $('#det');
  let C = null;       // 当前案件
  let G = null;       // 当前进度
  let tab = 'brief';
  let sel = null;     // 当前审问的嫌疑人 id
  let pickClue = false;
  let lastClue = null;
  let confirmSubmit = false;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const cases = () => window.__CASES || [];
  const caseById = (id) => cases().find((c) => c.id === id);
  const key = (id) => 'det:' + id;
  const fresh = () => ({ ptr: {}, found: [], asked: {}, conf: {}, broken: [], log: [], mark: [], searches: 0, asks: 0, result: null });
  function save() { if (C) store.set(key(C.id), G); }

  const clueMap = () => { const m = {}; C.locations.forEach((l) => l.clues.forEach((k) => { m[k.id] = Object.assign({ loc: l.id, locName: l.name }, k); })); return m; };
  const sus = (id) => C.suspects.find((s) => s.id === id);
  const searchLeft = () => C.budget.search - G.searches;
  const askLeft = () => C.budget.ask - G.asks;
  const hasClue = (id) => G.found.includes(id);
  const isAsked = (sid, tid) => !!(G.asked[sid] && G.asked[sid].includes(tid));
  const isBroken = (sid, tid) => G.broken.includes(sid + '.' + tid);
  const needOk = (nd) => {
    if (nd.startsWith('clue:')) return hasClue(nd.slice(5));
    const [a, b] = nd.slice(4).split('.');
    return isAsked(a, b) || isBroken(a, b);
  };
  const toast = (m) => { if (window.toast) window.toast(m); };

  // ---------- 入口 ----------
  function open() {
    $('#home').hidden = true; $('#room').hidden = true;
    root().hidden = false;
    delete document.body.dataset.tone;
    C = null; renderList();
    window.scrollTo(0, 0);
  }
  function close() {
    root().hidden = true; C = null;
    delete document.body.dataset.tone;
    if (window.showHome) window.showHome();
  }

  function stars(n) { return '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i>'; }
  function renderList() {
    const list = cases();
    root().innerHTML = `
      <div class="det-wrap">
        <div class="det-top"><button class="btn small ghost" data-act="home">‹ 返回</button><div class="det-title">单人侦探</div><span></span></div>
        <p class="det-lead">你是被请来的侦探。搜证、审问、对质，最后指认凶手。不需要朋友，也不需要开麦。</p>
        <div class="det-list">${list.map((c) => {
          const g = store.get(key(c.id)); const r = g && g.result;
          const badge = r ? `<span class="det-badge g-${r.grade}">${r.grade}</span>` : g && (g.searches || g.asks) ? '<span class="det-badge go">进行中</span>' : '';
          return `<button class="sc-card det-case" data-case="${esc(c.id)}">
            <div class="sc-art">${ART.scene(c.cover)}</div>
            <div class="sc-info"><div class="sc-name">${esc(c.title)} ${badge}</div>
            <div class="sc-tag">${esc(c.tagline)}</div>
            <div class="sc-meta">难度 <span class="stars">${stars(c.difficulty)}</span> · 搜证 ${c.budget.search} 次 · 提问 ${c.budget.ask} 次</div></div></button>`;
        }).join('') || '<p class="det-lead">还没有案件。</p>'}</div>
      </div>`;
  }

  function start(id) {
    C = caseById(id); if (!C) return;
    const g = store.get(key(id));
    G = g && g.log ? Object.assign(fresh(), g) : fresh();
    tab = G.result ? 'accuse' : 'brief'; sel = null; pickClue = false; lastClue = null;
    document.body.dataset.tone = C.tone || 'none';
    renderCase(); window.scrollTo(0, 0);
  }

  // ---------- 主界面 ----------
  const TABS = [['brief', '案情'], ['search', '搜证'], ['ask', '审问'], ['notes', '笔记'], ['accuse', '指认']];
  function renderCase() {
    confirmSubmit = false;
    const body = { brief: viewBrief, search: viewSearch, ask: viewAsk, notes: viewNotes, accuse: viewAccuse }[tab]();
    root().innerHTML = `
      <div class="det-wrap">
        <div class="det-top"><button class="btn small ghost" data-act="list">‹ 案件</button><div class="det-title">${esc(C.title)}</div>
          <div class="det-meter" title="剩余搜证 / 提问次数"><b>${searchLeft()}</b> 搜 · <b>${askLeft()}</b> 问</div></div>
        <nav class="tabs det-tabs">${TABS.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${n}${k === 'notes' && G.found.length ? `<em>${G.found.length}</em>` : ''}</button>`).join('')}</nav>
        <div class="det-body">${body}</div>
      </div>`;
    wireFx();
  }
  function wireFx() { try { root().querySelectorAll('.det-fx').forEach((el) => FX.sparkle(el, 6, { min: 5, max: 8 })); } catch (e) {} }

  function viewBrief() {
    return `
      <div class="det-hero">${ART.scene(C.cover)}<div class="det-hero-t"><p class="eyebrow">委托</p><h2>${esc(C.title)}</h2></div></div>
      <div class="card"><p class="det-p">${esc(C.brief).replace(/\n/g, '<br>')}</p></div>
      <div class="card det-victim"><div class="det-av">${ART.portrait(C.victim.look, { age: C.victim.age || 50 })}</div>
        <div><h4>死者 · ${esc(C.victim.name)}</h4><p class="det-p">${esc(C.victim.desc)}</p></div></div>
      <div class="card"><h4>已知事实</h4><ul class="det-ul">${C.publicFacts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></div>
      <div class="card"><h4>现场时间线</h4><div class="det-tl">${C.timeline.map((t) => `<div><b>${esc(t.t)}</b><span>${esc(t.text)}</span></div>`).join('')}</div></div>
      <div class="card"><h4>规则</h4><p class="det-p">搜证和提问都有次数限制。线索会随着你反复搜查同一个地点而逐渐深入。把你找到的证物拿给嫌疑人看，谎言就会露出破绽。准备好了，就去“指认”。</p>
      <button class="btn primary det-fx" data-tab="search">开始调查</button></div>`;
  }

  function viewSearch() {
    const cm = clueMap();
    const locs = C.locations.map((l) => {
      const got = (G.ptr[l.id] || 0), left = l.clues.length - got;
      const list = l.clues.slice(0, got).map((k) => `<button class="det-ev ${lastClue === k.id ? 'new' : ''}" data-ev="${k.id}"><b>${esc(k.title)}</b></button>`).join('');
      return `<div class="det-loc"><div class="det-loc-art">${ART.scene(l.scene)}<div class="det-loc-n">${esc(l.name)}</div></div>
        <div class="det-loc-b"><p class="det-d">${esc(l.desc)}</p>
        <div class="det-evs">${list}</div>
        <button class="btn small ${left > 0 && searchLeft() > 0 ? 'det-go' : ''}" data-search="${l.id}" ${left <= 0 || searchLeft() <= 0 ? 'disabled' : ''}>${left <= 0 ? '已搜遍' : searchLeft() <= 0 ? '次数用完' : got ? '再仔细搜一次' : '搜查这里'}</button></div></div>`;
    }).join('');
    const ev = lastClue && cm[lastClue] ? evCard(cm[lastClue]) : '';
    return `${ev}<div class="det-grid">${locs}</div>`;
  }
  const evCard = (k) => `<div class="card det-evcard"><h4>证物 · ${esc(k.title)} <small>${esc(k.locName)}</small></h4><p class="det-p">${esc(k.text)}</p></div>`;

  // ---------- 审问 ----------
  function viewAsk() {
    const chips = C.suspects.map((s) => {
      const star = G.mark.includes(s.id);
      return `<button class="det-sus ${sel === s.id ? 'on' : ''}" data-sus="${s.id}"><div class="av">${ART.portrait(s.look, { age: s.age, crop: 'head' })}</div><div class="nm">${esc(s.name)}</div><div class="ch">${esc(s.role)}</div>${star ? '<i class="mk">★</i>' : ''}</button>`;
    }).join('');
    return `<div class="det-sus-row">${chips}</div>${sel ? panel(sus(sel)) : '<div class="card"><p class="det-p det-dim">选一个人开始审问。每个人只说自己知道的，也会隐瞒。</p></div>'}`;
  }
  function panel(s) {
    const cm = clueMap();
    const tps = s.topics.filter((t) => (t.needs || []).every(needOk));
    const hidden = s.topics.length - tps.length;
    const log = G.log.filter((e) => e.s === s.id);
    const btns = tps.map((t) => {
      const asked = isAsked(s.id, t.id), br = isBroken(s.id, t.id);
      return `<button class="det-q ${asked ? 'done' : ''} ${br ? 'broken' : ''}" data-q="${t.id}">${esc(t.q)}${br ? ' <em>已揭穿</em>' : ''}</button>`;
    }).join('');
    const found = G.found.map((id) => cm[id]).filter(Boolean);
    const showList = pickClue ? `<div class="det-pick">${found.length ? found.map((k) => `<button class="det-ev" data-conf="${k.id}"><b>${esc(k.title)}</b><small>${esc(k.locName)}</small></button>`).join('') : '<p class="det-dim">你还没有证物。先去搜证。</p>'}</div>` : '';
    const lg = log.map((e) => e.kind === 'q'
      ? `<div class="det-msg me"><span>${esc(e.q)}</span></div><div class="det-msg them ${isBroken(s.id, e.t) ? 'lie' : ''}"><div class="mini">${ART.portrait(s.look, { age: s.age, crop: 'head' })}</div><span>${esc(e.a)}</span></div>`
      : `<div class="det-msg me ev"><span>出示：${esc(e.title)}</span></div><div class="det-msg them ${e.crack ? 'crack' : e.broke ? 'lie' : ''}"><div class="mini">${ART.portrait(s.look, { age: s.age, crop: 'head' })}</div><span>${esc(e.a)}</span></div>${e.truth ? `<div class="det-note">${esc(s.name)}改口：${esc(e.truth)}</div>` : ''}`
    ).join('');
    return `<div class="card det-panel">
      <div class="det-ph"><div class="det-big">${ART.portrait(s.look, { age: s.age })}</div><div><h4>${esc(s.name)} · ${esc(s.role)}</h4><p class="det-p">${esc(s.bio)}</p><p class="det-dim">语气：${esc(s.demeanor)}</p></div></div>
      <div class="det-log" id="detLog">${lg || '<p class="det-dim">还没问过话。</p>'}</div>
      <div class="det-qs">${btns}${hidden > 0 ? `<p class="det-dim">还有 ${hidden} 个话题，等你掌握更多线索才能问出口。</p>` : ''}</div>
      <div class="det-actions"><button class="btn small ${pickClue ? 'danger' : ''}" data-act="pick">${pickClue ? '取消' : '出示证物 ›'}</button>
      <button class="btn small ghost" data-mark="${s.id}">${G.mark.includes(s.id) ? '取消标记嫌疑' : '标记为嫌疑'}</button></div>${showList}</div>`;
  }
  function ask(sid, tid) {
    const s = sus(sid), t = s.topics.find((x) => x.id === tid); if (!t) return;
    const again = isAsked(sid, tid);
    if (!again) {
      if (askLeft() <= 0) return toast('提问次数用完了。可以去指认了。');
      G.asks++; (G.asked[sid] = G.asked[sid] || []).push(tid);
      G.log.push({ s: sid, kind: 'q', t: tid, q: t.q, a: t.a, lie: !!t.lie });
    }
    save(); renderCase(); scrollLog();
  }
  function confront(cid) {
    const s = sus(sel), cm = clueMap(), k = cm[cid]; if (!k) return;
    const ck = sel + '.' + cid;
    pickClue = false;
    if (G.conf[ck]) { renderCase(); return scrollLog(); }
    if (askLeft() <= 0) { renderCase(); return toast('提问次数用完了。'); }
    G.asks++; G.conf[ck] = 1;
    const f = (s.confronts || []).find((x) => x.clue === cid);
    const e = { s: sel, kind: 'c', title: k.title, a: f ? f.a : s.fallback };
    if (f && f.breaks && !isBroken(sel, f.breaks)) {
      G.broken.push(sel + '.' + f.breaks);
      const t = s.topics.find((x) => x.id === f.breaks);
      e.broke = true; e.truth = t && t.truth; e.crack = !!f.crack;
    }
    G.log.push(e); save(); renderCase(); scrollLog();
    if (e.crack) { try { const b = FX.burst(root(), 'gold'); setTimeout(() => b.remove(), 4500); } catch (x) {} }
  }
  function scrollLog() { const el = $('#detLog'); if (el) el.scrollTop = el.scrollHeight; }

  // ---------- 笔记 ----------
  function viewNotes() {
    const cm = clueMap();
    const ev = G.found.length ? G.found.map((id) => evCard(cm[id])).join('') : '<div class="card"><p class="det-dim">还没有证物。去搜证吧。</p></div>';
    const broken = G.broken.map((b) => { const [sid, tid] = b.split('.'); const s = sus(sid), t = s.topics.find((x) => x.id === tid); return `<li><b>${esc(s.name)}</b>：${esc(t.q)} → ${esc(t.truth)}</li>`; }).join('');
    const marks = G.mark.map((id) => esc(sus(id).name)).join('、');
    return `<div class="card"><h4>被揭穿的谎言</h4>${broken ? `<ul class="det-ul">${broken}</ul>` : '<p class="det-dim">暂无。用证物对质，才能让他们改口。</p>'}</div>
      <div class="card"><h4>标记的嫌疑人</h4><p class="det-p">${marks || '<span class="det-dim">暂无</span>'}</p></div>
      <h4 class="det-h">证物（${G.found.length}）</h4>${ev}`;
  }

  // ---------- 指认 ----------
  function viewAccuse() {
    const r = G.result;
    if (r) return resultView(r);
    const A = G.draft || {};
    const sol = C.solution;
    return `<div class="card"><h4>谁是凶手？</h4><div class="det-pickrow">${C.suspects.map((s) => `<button class="det-opt ${A.culprit === s.id ? 'on' : ''}" data-draft="culprit:${s.id}">${esc(s.name)}<small>${esc(s.role)}</small></button>`).join('')}</div></div>
      <div class="card"><h4>${esc(sol.method.q)}</h4>${sol.method.options.map((o, i) => `<button class="det-opt wide ${A.method === i ? 'on' : ''}" data-draft="method:${i}">${esc(o)}</button>`).join('')}</div>
      <div class="card"><h4>${esc(sol.motive.q)}</h4>${sol.motive.options.map((o, i) => `<button class="det-opt wide ${A.motive === i ? 'on' : ''}" data-draft="motive:${i}">${esc(o)}</button>`).join('')}</div>
      <p class="det-dim">只能指认一次。想清楚再提交。</p>
      <button class="btn primary det-fx" data-act="submit" ${A.culprit && A.method != null && A.motive != null ? '' : 'disabled'}>提交指认</button>`;
  }
  function submit() {
    const A = G.draft || {}, sol = C.solution;
    const okC = A.culprit === sol.culprit, okM = A.method === sol.method.correct, okV = A.motive === sol.motive.correct;
    const keys = sol.keyClues.filter(hasClue).length;
    const score = (okC ? 40 : 0) + (okM ? 15 : 0) + (okV ? 15 : 0) + Math.round(30 * keys / sol.keyClues.length);
    const grade = !okC ? 'C' : score >= 95 ? 'S' : score >= 80 ? 'A' : 'B';
    G.result = { okC, okM, okV, keys, total: sol.keyClues.length, score, grade, culprit: A.culprit, asks: G.asks, searches: G.searches };
    save(); renderCase(); window.scrollTo(0, 0);
    if (okC) { try { const b = FX.burst(root(), 'gold'); setTimeout(() => b.remove(), 4500); } catch (e) {} }
  }
  function resultView(r) {
    const sol = C.solution, cu = sus(sol.culprit), cm = clueMap();
    const mk = (b, t) => `<li class="${b ? 'ok' : 'no'}">${b ? '✓' : '✗'} ${t}</li>`;
    return `<div class="det-result ${r.okC ? 'win' : 'lose'}">
      <div class="det-grade g-${r.grade}">${r.grade}</div>
      <h3>${r.okC ? '案件告破' : '抓错了人'}</h3>
      <ul class="det-ul">${mk(r.okC, `凶手：${esc(cu.name)}`)}${mk(r.okM, `手法：${esc(sol.method.options[sol.method.correct])}`)}${mk(r.okV, `动机：${esc(sol.motive.options[sol.motive.correct])}`)}
      <li class="${r.keys === r.total ? 'ok' : 'no'}">关键证物 ${r.keys} / ${r.total}　用掉搜证 ${r.searches}、提问 ${r.asks}</li></ul></div>
      <div class="card"><h4>完整真相</h4>${sol.truth.map((p) => `<p class="det-p">${esc(p)}</p>`).join('')}</div>
      <div class="card"><h4>关键证物</h4><ul class="det-ul">${sol.keyClues.map((id) => `<li class="${hasClue(id) ? 'ok' : 'no'}">${hasClue(id) ? '✓' : '✗ 错过'} ${esc(cm[id].title)}（${esc(cm[id].locName)}）</li>`).join('')}</ul></div>
      <div class="det-actions"><button class="btn" data-act="again">重新调查此案</button><button class="btn ghost" data-act="list">换一个案件</button></div>`;
  }

  // ---------- 事件 ----------
  document.addEventListener('click', (e) => {
    const r = root(); if (!r || r.hidden || !r.contains(e.target)) return;
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.case) return start(d.case);
    if (d.act === 'home') return close();
    if (d.act === 'list') { C = null; delete document.body.dataset.tone; return renderList(); }
    if (!C) return;
    if (d.tab) { tab = d.tab; pickClue = false; renderCase(); return window.scrollTo(0, 0); }
    if (d.search) {
      const l = C.locations.find((x) => x.id === d.search), got = G.ptr[l.id] || 0;
      if (got >= l.clues.length) return;
      if (searchLeft() <= 0) return toast('搜证次数用完了。');
      const k = l.clues[got]; G.ptr[l.id] = got + 1; G.searches++; if (!hasClue(k.id)) G.found.push(k.id);
      lastClue = k.id; save(); renderCase(); return window.scrollTo(0, 0);
    }
    if (d.ev) { lastClue = d.ev; renderCase(); return window.scrollTo(0, 0); }
    if (d.sus) { sel = d.sus; pickClue = false; renderCase(); return scrollLog(); }
    if (d.q) return ask(sel, d.q);
    if (d.act === 'pick') { pickClue = !pickClue; renderCase(); return; }
    if (d.conf) return confront(d.conf);
    if (d.mark) { const i = G.mark.indexOf(d.mark); if (i >= 0) G.mark.splice(i, 1); else G.mark.push(d.mark); save(); return renderCase(); }
    if (d.draft) {
      const [k, v] = d.draft.split(':'); G.draft = G.draft || {}; G.draft[k] = k === 'culprit' ? v : Number(v); save(); renderCase(); return;
    }
    if (d.act === 'submit') {
      if (!confirmSubmit) { confirmSubmit = true; t.textContent = '再点一次确认（提交后不能更改）'; return; }
      confirmSubmit = false; return submit();
    }
    if (d.act === 'again') { store.set(key(C.id), null); G = fresh(); tab = 'brief'; renderCase(); window.scrollTo(0, 0); }
  });

  window.DET = { open, close, available: () => cases().length > 0 };
})();

</script>
<script>
'use strict';
// 前端：原生 JS，无构建步骤。语音使用 WebRTC 网状连接（8 人以内足够）。

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ================= 网络 =================
// 内容没变就不重写 DOM（否则动画会被重置，看起来一闪一闪）
function setHTML(el, html) { if (el._h === html) return false; el._h = html; el.innerHTML = html; return true; }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function session() {
  try { return JSON.parse(localStorage.getItem('jbs_session') || 'null'); } catch { return null; }
}
function saveSession(s) { try { localStorage.setItem('jbs_session', JSON.stringify(s)); } catch {} }
function clearSession() { try { localStorage.removeItem('jbs_session'); } catch {} }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    $('#banner').hidden = true;
    const s = session();
    if (s) send({ type: 'rejoin', code: s.code, token: s.token });
  };
  ws.onclose = () => {
    $('#banner').hidden = false;
    voiceTeardownPeers();
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
}

function onMsg(m) {
  switch (m.type) {
    case 'hello':
      ICE = m.ice || ICE;
      $('#homeTitle').textContent = m.meta.title;
      $('#homeSub').textContent = m.meta.subtitle;
      $('#homeFine').textContent = `${(m.meta.scripts || []).length} 个剧本 · 试玩版：自动加 3 个机器人 · 不含语音`;
      if (!session()) showHome();
      break;
    case 'joined':
      myId = m.id;
      saveSession({ code: m.code, token: m.token });
      break;
    case 'rejoin-failed':
      clearSession();
      showHome();
      break;
    case 'state':
      clockOffset = m.now - Date.now();
      S = m;
      onState();
      break;
    case 'chatlog':
      chatLog.length = 0;
      m.log.forEach((x) => chatLog.push(x));
      renderChat();
      break;
    case 'chat':
      chatLog.push(m.msg);
      renderChat();
      if (tab !== 'chat') { unread++; updateDot(); }
      break;
    case 'sys':
      chatLog.push({ sys: true, text: m.text });
      renderChat();
      break;
    case 'searchResult':
      showSearch(m.loc, m.clue);
      break;
    case 'error':
      toast(m.message);
      break;
    case 'voice-peers':
      m.peers.forEach((id) => voiceCall(id));
      break;
    case 'voice-left':
      voiceClosePeer(m.id);
      break;
    case 'signal':
      voiceSignal(m.from, m.data);
      break;
  }
}

// ================= 小工具 =================
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 4200);
}
let heroDone = false, stopSnow = null;
// 阶段名称：最后一轮讨论叫“最终讨论”
function phaseInfo(phase) {
  const m = /^discuss(\d)$/.exec(phase);
  if (m && S && Number(m[1]) === (S.script.rounds || 3)) return ['最终讨论', '最后的讨论时间。下一步就是投票指认凶手。'];
  return PHASE[phase];
}
function showHome() {
  S = null;
  delete document.body.dataset.tone;
  if (!heroDone) { heroDone = true; $('#hero').insertAdjacentHTML('afterbegin', ART.scene('cover')); FX.sparkle($('#hero'), 16, { min: 7, max: 12 }); FX.sparkle($('#createBtn'), 6, { min: 5, max: 7 }); }
  if (!stopSnow) stopSnow = FX.snow($('#snow'), { count: 80 });
  $('#home').hidden = false;
  $('#room').hidden = true;
}
function me() { return S && S.players.find((p) => p.id === myId); }
function isHost() { return S && S.hostId === myId; }
function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
}
function playerName(id) { const p = S.players.find((x) => x.id === id); return p ? p.name : '?'; }

// ================= 状态变化 =================
function onState() {
  document.body.dataset.tone = S.script.tone || 'none';
  $('#home').hidden = true;
  $('#room').hidden = false;
  if (S.phase !== lastPhase) {
    // 新阶段时回到合适的页签
    if (S.phase === 'reading') tab = 'role';
    if (S.phase === 'reveal') tab = 'case';
    const prev = lastPhase;
    lastPhase = S.phase;
    if (S.phase === 'lobby') { roleOpened = false; introShown = false; revealShown = false; }
    render();
    onPhaseEnter(S.phase, prev);
    voiceApplyGate();
    return;
  }
  render();
  voiceApplyGate();
}

function render() {
  $('#roomCode').textContent = S.code;
  $('#phaseName').textContent = phaseInfo(S.phase)[0];
  renderPlayers();
  renderPhaseCard();
  renderTabs();
  renderVoiceBar();
  updateTimer();
}

function renderPlayers() {
  setHTML($('#players'), S.players.map((p) => {
    const initial = p.char ? portraitOf(p.char, { crop: 'face' }) : esc(p.name.slice(0, 1));
    const ch = p.char ? `${esc(p.char.name)} · ${esc(p.char.title)}` : (p.id === S.hostId ? '房主' : '');
    let st = '';
    if (S.phase === 'reading') st = p.ready ? '✓' : '…';
    else if (isSearchPhase(S.phase)) st = p.searched ? '✓' : '…';
    else if (S.phase === 'vote') st = p.voted ? '✓' : '…';
    const mic = p.bot ? '🤖' : (p.voice ? '🎙' : '');
    const cls = ['chip', p.id === myId ? 'me' : '', p.connected ? '' : 'off', p.id === S.speakerId ? 'speaker' : ''].join(' ');
    return `<div class="${cls}" data-pid="${p.id}"><div class="av">${initial}</div><div><div class="nm">${esc(p.name)}${p.id === myId ? '（你）' : ''} <span class="st">${st}${mic}</span></div><div class="ch">${ch || '&nbsp;'}</div></div></div>`;
  }).join(''));
}

    <div class="sc-tx"><b>${esc(sc.title)}</b><span class="sc-tag">${esc(sc.tagline)}</span><span class="sc-meta"><em>难度 ${dots(sc.difficulty)}</em> · ${sc.minPlayers}–${sc.maxPlayers} 人 · ${esc(sc.duration)}</span></div>${sel ? '<i class="sc-check">已选</i>' : ''}</button>`;
  const list = host ? S.scripts : S.scripts.filter((x) => x.id === S.scriptId);
  return `<h3>${host ? '选择剧本' : '本局剧本'}</h3><div class="sc-list">${list.map((x) => card(x, x.id === S.scriptId)).join('')}</div>${host ? '' : '<p style="font-size:13px">房主正在选剧本，选定后会显示在这里。</p>'}`;
}

      extra = `<div class="stage"><div class="spot"></div><div class="speaker-av"><i class="ring"></i><i class="ring"></i><i class="ring"></i><div class="face">${portraitOf(sp && sp.char, { crop: 'face' })}</div></div>
        <div class="info"><span>第 ${i}/${S.speakerOrder.length} 位发言</span><b>${esc(sp && sp.char ? sp.char.name : playerName(S.speakerId))}</b>
        <span>${esc(playerName(S.speakerId))}${mine ? '（你）' : ''}<span class="wave"><i></i><i></i><i></i><i></i></span></span></div></div>
        <p style="margin:0 0 10px">${mine ? '轮到你了，开麦说话。' : '正在发言，其他人已被静音。'}</p>
        <div class="actions">${mine ? '<button class="btn primary" style="width:auto" id="doneBtn">我说完了</button>' : ''}</div>`;
    } else if (isSearchPhase(S.phase)) {
      extra = `<div class="loc-grid">${S.script.locations.map((l) =>
        `<button class="loc place" data-loc="${l.id}" ${m && m.searched ? 'disabled' : ''}><div class="th">${ART.scene(l.scene)}${m && m.searched ? '<span class="tick">已搜</span>' : ''}</div><div class="tx"><b>${esc(l.name)}</b><small>${esc(l.desc)}</small></div></button>`).join('')}</div>
        ${m && m.searched ? '<p style="margin-top:10px">你这一轮已经搜过了，等其他人。</p>' : ''}`;
    } else if (S.phase === 'vote') {
      const picked = S.you.vote;
      extra = `<div class="vote-grid">${S.players.filter((p) => p.id !== myId).map((p) =>
        `<button class="vote-card ${picked === p.id ? 'picked' : ''}" data-vote="${p.id}"><div class="ph">${portraitOf(p.char)}</div><div class="tx"><b>${esc(p.char ? p.char.name : p.name)}</b><small>${esc(p.name)}${picked === p.id ? ' · 已选' : ''}</small></div></button>`).join('')}</div>`;

  el.querySelectorAll('[data-vote]').forEach((b) => b.addEventListener('click', () => send({ type: 'vote', target: b.dataset.vote })));
  const rs = el.querySelector('#restartBtn');
  if (rs) rs.addEventListener('click', () => send({ type: 'restart' }));
}

function revealCard() {
  const r = S.reveal;
  if (!r) return '<h3>真相揭晓</h3>';
  const caught = r.result.caught;
  const culprit = r.cast.find((c) => c.playerId === r.result.culpritId);
  const maxV = Math.max(1, ...Object.values(r.result.counts));
  const bars = S.players.map((p) => {
    const n = r.result.counts[p.id] || 0;
    const c = r.cast.find((x) => x.playerId === p.id);
    return `<div class="vote-bar"><span style="width:110px">${esc(c.charName)}</span><span class="bar" style="width:${(n / maxV) * 140}px"></span><span>${n} 票</span></div>`;
  }).join('');
  return `<p class="reveal-win ${caught ? 'good' : 'bad'}">${caught ? '凶手被抓获了！' : '凶手逃脱了……'}</p>
    <p style="color:var(--text)">真凶是 <b>${esc(culprit.charName)}</b>（${esc(culprit.playerName)}）。</p>
    ${bars}
    ${isHost() ? '<div class="actions" style="margin-top:12px"><button class="btn primary" style="width:auto" id="restartBtn">再来一局</button></div>' : ''}`;
}

function renderTabs() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const chatOn = tab === 'chat';
  $('#chatPane').hidden = !chatOn;
  $('#tabBody').hidden = chatOn;
  if (chatOn) { unread = 0; updateDot(); renderChat(); return; }
  const el = $('#tabBody');
  // 同一页面内的刷新不要重播入场动画
  const key = tab + '|' + S.phase + '|' + (S.reveal ? 1 : 0) + '|' + (roleOpened ? 1 : 0);
  el.classList.toggle('noanim', key === lastTabKey);
  lastTabKey = key;
  const html = tab === 'role' ? roleTab() : tab === 'case' ? caseTab() : cluesTab();
  if (!setHTML(el, html)) return;
  if (tab === 'role') {
    const open = el.querySelector('[data-open]');
    if (open) open.addEventListener('click', () => { roleOpened = true; renderTabs(); });
    FX.tilt(el.querySelector('.frame'));
    FX.sparkle(el.querySelector('.frame'), 6);
    FX.sparkle(el.querySelector('.role-hero'), 10);
    FX.sparkle(el.querySelector('.sealed'), 12);
  } else if (tab === 'clues') {
    el.querySelectorAll('[data-share]').forEach((b) => b.addEventListener('click', () => send({ type: 'share', clueId: b.dataset.share })));
    freshClues.clear();
  }
}

  if (S.phase === 'reading' && !roleOpened) {
    return `<div class="sealed"><h4>密封的角色档案</h4><p>只有你自己能看。拆开之前，先确认身边没有别人在偷看。</p>
      <button class="seal-btn" data-open="1">拆封</button></div>`;
  }
  return `<div class="role-hero ${S.phase === 'reading' ? 'unseal' : ''}">
      <div class="frame">${portraitOf(c, { label: c.name })}</div>
      <div class="role-info"><span class="big">${esc(c.name)}</span><span class="meta">${esc(c.title)} · ${c.age} 岁</span>
        <p>${esc(c.blurb)}</p>${c.isCulprit ? '<span class="stamp">你是凶手</span>' : ''}</div>
    </div>
    <div class="card"><h4>你的故事</h4><p>${esc(c.story)}</p></div>

    <div class="card secret"><h4>你的秘密（不要轻易说出口）</h4><p>${esc(c.secret)}</p></div>
    <div class="card ${c.isCulprit ? 'culprit' : ''}"><h4>你的目标</h4><p>${esc(c.goal)}</p></div>`;
}

  if (S.phase !== 'lobby') {
    html += `<div class="card"><h4>在场的人</h4><div class="cast">${S.players.map((p, i) => p.char
      ? `<div class="cast-card ${p.id === myId ? 'me' : ''}" style="animation-delay:${(i * 0.06).toFixed(2)}s"><div class="ph">${portraitOf(p.char)}</div><span class="who">${esc(p.name)}${p.id === myId ? '（你）' : ''}</span>
        <div class="tx"><b>${esc(p.char.name)}</b><small>${esc(p.char.title)} · ${p.char.age} 岁</small><p>${esc(p.char.blurb)}</p></div></div>` : '').join('')}</div></div>`;
  }
  if (S.reveal) {
    const truth = S.reveal.truth.map((p, i) => `<p style="animation-delay:${(0.4 + i * 1.1).toFixed(1)}s">${esc(p)}</p>`).join('');
    html = `<div class="card culprit truth"><div class="truth-cover">${ART.scene(S.script.cover || 'study')}</div><h4>真相</h4>${truth}</div>
      <div class="card"><h4>每个人的结局</h4><ul style="list-style:none;padding:0">${S.reveal.cast.map((c) =>
        `<li class="ending ${c.isCulprit ? 'c' : ''}"><div class="mini">${portraitOf(c, { crop: 'face' })}</div><div><b>${esc(c.charName)}</b>（${esc(c.playerName)}）${c.isCulprit ? '<span class="tag" style="color:var(--danger)">凶手</span>' : ''}<br>${esc(c.reveal)}</div></li>`).join('')}</ul></div>` + html;
  }
  return html;
}

function cluesTab() {
  const mine = (S.you && S.you.clues) || [];
  const sharedIds = new Set(S.shared.map((s) => s.id));
  const locId = sceneKey;
  const mineHtml = mine.length
    ? mine.map((c) => `<div class="clue ${freshClues.has(c.id) ? 'fresh' : ''}"><div class="cth">${ART.scene(locId(c.loc))}</div><div class="cbody"><div class="t"><b>${esc(c.title)}</b><span class="loc-tag">${esc(c.loc)}</span></div><p>${esc(c.text)}</p>
        <div style="margin-top:10px">${sharedIds.has(c.id) ? '<span class="tag">已公开</span>' : `<button class="btn small" data-share="${c.id}">公开给所有人</button>`}</div></div></div>`).join('')
    : '<p class="empty">你还没有线索。搜证阶段选一个地点吧。</p>';
  const shared = S.shared.length
    ? S.shared.map((c) => `<div class="clue"><div class="cth">${ART.scene(locId(c.loc))}</div><div class="cbody"><div class="t"><b>${esc(c.title)}</b><span class="loc-tag">${esc(c.loc)} · ${esc(c.by)} 公开</span></div><p>${esc(c.text)}</p></div></div>`).join('')
    : '<p class="empty">还没有人公开线索。</p>';
  return `<div class="card"><h4>我的线索（只有你看得到）</h4>${mineHtml}</div><div class="card"><h4>公开的线索</h4>${shared}</div>`;
}

// ================= 全屏特效：开场、转场、搜证、揭晓 =================
function mountOverlay(cls, html) {
  const el = document.createElement('div');
  el.className = 'ov ' + cls;
  el.innerHTML = html;
  document.body.appendChild(el);
  return el;
}
function closeModal(el, after) {
  if (!el) return;
  el.classList.add('out');
  if (el._stop) el._stop();
  if (el._timers) el._timers.forEach(clearTimeout);
  setTimeout(() => { el.remove(); if (modal === el) modal = null; if (after) after(); }, 400);
}
function setModal(el) {
  if (modal && modal !== el) { modal._timers && modal._timers.forEach(clearTimeout); modal._stop && modal._stop(); modal.remove(); }
  modal = el;
  el._timers = el._timers || [];
}

function onPhaseEnter(phase, prev) {
  if (phase === 'reading' && !introShown) { introShown = true; return showIntro(); }
  if (phase === 'reveal') return showReveal();
  if (phase === 'lobby') return;
  if (!modal) showSplash(phase);
}

function showSplash(phase) {
  const i = phaseOrder().indexOf(phase) + 1;
  const el = document.createElement('div');
  el.className = 'splash';
  el.innerHTML = `<div class="bgscene">${ART.scene((S.script.phaseScenes && S.script.phaseScenes[phase]) || S.script.cover || 'cover')}</div><div class="inner"><small>第 ${NUM[i] || i} 幕</small><b>${esc(phaseInfo(phase)[0])}</b><i></i></div>`;
  document.body.appendChild(el);
  FX.sparkle(el.querySelector('.inner'), 14);
  setTimeout(() => el.remove(), 2200);
}

function showIntro() {
  const sc = S.script;
  const slides = [{ scene: sc.cover || 'cover', title: true }, ...sc.intro.map((t, i) => ({ scene: (sc.introScenes && sc.introScenes[i]) || sc.cover || 'cover', text: t }))];
  const el = mountOverlay('intro', `<div class="slides"></div><div class="shade"></div><canvas class="ovsnow"></canvas>
    <button class="skip">跳过 ▸▸</button><div class="titlecard" hidden><h1>${esc(sc.title)}</h1><p>${esc(sc.subtitle)}</p></div>
    <div class="textbox"><div class="tt"></div><div class="hint"><div class="dots">${slides.map(() => '<i></i>').join('')}</div><span class="next">点击继续 ▸</span></div></div>`);
  setModal(el);
  el._stop = FX.snow(el.querySelector('canvas'), { count: 90, speed: 1.2 });
  FX.sparkle(el.querySelector('.titlecard'), 16, { min: 8, max: 14 });
  let idx = -1, tw = null;
  const slidesEl = el.querySelector('.slides'), tt = el.querySelector('.tt'), title = el.querySelector('.titlecard');
  const go = () => {
    idx++;
    if (idx >= slides.length) return closeModal(el);
    const sl = slides[idx];
    const d = document.createElement('div');
    d.className = 'slide';
    d.innerHTML = `<div class="bgscene">${ART.scene(sl.scene)}</div>`;
    slidesEl.appendChild(d);
    // 等图片解码好再淡入，避免淡入时先露出黑底
    const im = d.querySelector('img');
    const show = () => requestAnimationFrame(() => d.classList.add('on'));
    if (im && im.decode) im.decode().then(show, show); else show();
    const old = slidesEl.querySelectorAll('.slide');
    // 旧画面保持不透明，等新画面完全淡入后再移除，避免两张图交叉淡入时中间变暗（一闪）
    if (old.length > 1) { const o = old[0]; setTimeout(() => o.remove(), 1000); }
    el.querySelectorAll('.dots i').forEach((x, k) => x.classList.toggle('on', k <= idx));
    title.hidden = !sl.title;
    tt.textContent = '';
    el.querySelector('.next').textContent = idx === slides.length - 1 ? '开始游戏 ▸' : '点击继续 ▸';
    if (sl.text) tw = FX.typewriter(tt, sl.text, 38);
    else tw = null;
  };
  el.addEventListener('click', (e) => {
    if (e.target.closest('.skip')) return closeModal(el);
    if (tw && !tw.done()) return tw.skip();
    go();
  });
  go();
}

function showSearch(locName, clue) {
  const loc = S.script.locations.find((l) => l.id === pendingLoc) || S.script.locations.find((l) => l.name === locName) || S.script.locations[0];
  pendingLoc = null;
  const el = mountOverlay('searchov', `<div class="bgscene">${ART.scene(loc.scene || loc.id)}</div><div class="shade" style="opacity:.55"></div>
    <div class="darkmask"></div><div class="lens"></div><div class="locname">${esc(loc.name)}</div><div class="result"><div></div></div>`);
  setModal(el);
  const W = () => el.clientWidth, H = () => el.clientHeight;
  const path = [[.2, .7], [.78, .35], [.35, .45], [.62, .68], [.5, .5]];
  const T = 2300, t0 = performance.now();
  let raf = 0, done = false;
  const setPos = (x, y) => { el.style.setProperty('--x', x + 'px'); el.style.setProperty('--y', y + 'px'); };
  setPos(W() * path[0][0], H() * path[0][1]);
  const finish = () => {
    if (done) return; done = true; cancelAnimationFrame(raf);
    setPos(W() * .5, H() * .5);
    el.querySelector('.darkmask').classList.add('off'); el.querySelector('.lens').classList.add('off');
    const res = el.querySelector('.result > div');
    res.innerHTML = clue
      ? `<div class="clue-reveal"><span class="new">新线索</span><h3>${esc(clue.title)}</h3><p>${esc(clue.text)}</p><button class="btn primary">收入线索</button></div>`
      : `<div class="clue-reveal empty"><h3 style="color:var(--text)">什么也没有</h3><p>你翻遍了这里，没有新的发现。</p><button class="btn primary">继续</button></div>`;
    if (clue) { freshClues.add(clue.id); FX.sparkle(res.querySelector('.clue-reveal'), 14); }
    res.querySelector('.btn').addEventListener('click', () => closeModal(el, () => { if (clue) { tab = 'clues'; if (S) renderTabs(); } }));
  };
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / T), seg = (path.length - 1) * k, i = Math.min(path.length - 2, Math.floor(seg)), f = seg - i;
    const ease = f * f * (3 - 2 * f);
    setPos(W() * (path[i][0] + (path[i + 1][0] - path[i][0]) * ease), H() * (path[i][1] + (path[i + 1][1] - path[i][1]) * ease));
    if (k >= 1) return finish();
    raf = requestAnimationFrame(tick);
  };
  if (document.documentElement.classList.contains('lite')) {
    // 手机：不做手电筒移动动画（每帧重绘全屏渐变很卡），停一下直接出结果
    setPos(W() * .5, H() * .5);
    const to = setTimeout(finish, 900);
    el._stop = () => clearTimeout(to);
  } else {
    raf = requestAnimationFrame(tick);
    el._stop = () => cancelAnimationFrame(raf);
  }
  el.addEventListener('click', (e) => { if (!done && !e.target.closest('.btn')) finish(); });
}

function showReveal() {
  const r = S.reveal;
  if (!r || revealShown) return;
  revealShown = true;
  const culprit = r.cast.find((c) => c.playerId === r.result.culpritId) || r.cast.find((c) => c.isCulprit);
  const caught = r.result.caught;
  const others = r.cast.filter((c) => c !== culprit).sort(() => Math.random() - 0.5);
  const order = [...others, culprit];
  const el = mountOverlay('revealov', `<div class="beam"></div><canvas class="ovsnow"></canvas><button class="skip">跳过 ▸▸</button>
    <h2>真相，只有一个</h2>
    <div class="suspects">${r.cast.map((c) => `<div class="suspect" data-pid="${c.playerId}"><div class="pic">${portraitOf(c, { crop: 'face' })}</div><span>${esc(c.charName)}</span></div>`).join('')}</div>
    <div class="verdict ${caught ? 'good' : 'bad'}"><b>${caught ? '凶手落网' : '凶手逃脱'}</b><p>真凶是 ${esc(culprit.charName)}（${esc(culprit.playerName)}）</p><button class="btn primary cta" id="seeTruth">查看完整真相</button></div>
    <div class="flash"></div>`);
  setModal(el);
  el._stop = FX.snow(el.querySelector('canvas'), { count: 50, alpha: 0.5 });
  const pick = (pid) => el.querySelector(`.suspect[data-pid="${pid}"]`);
  const later = (fn, ms) => { const t = setTimeout(fn, ms); el._timers.push(t); };
  let shown = false;
  const verdict = () => {
    if (shown) return; shown = true;
    el._timers.forEach(clearTimeout);
    el.querySelectorAll('.suspect').forEach((x) => { x.classList.remove('lit'); });
    el.querySelectorAll('.suspect').forEach((x) => { if (x.dataset.pid !== culprit.playerId) x.classList.add('dim'); });
    pick(culprit.playerId).classList.add('culprit');
    el.querySelector('.flash').classList.add('go');
    el._burst = FX.burst(el, caught ? 'gold' : 'fog');
    FX.sparkle(pick(culprit.playerId), 10, { min: 8, max: 12 });
    later(() => el.querySelector('.verdict').classList.add('on'), 700);
  };
  const STEP = 520, START = 1300;
  order.forEach((c, k) => {
    if (k === order.length - 1) return;
    later(() => { el.querySelectorAll('.suspect.lit').forEach((x) => x.classList.remove('lit')); pick(c.playerId).classList.add('lit'); }, START + k * STEP);
  });
  later(verdict, START + (order.length - 1) * STEP + 500);
  el.querySelector('.skip').addEventListener('click', () => { verdict(); el.querySelector('.skip').remove(); });
  el.querySelector('#seeTruth').addEventListener('click', () => closeModal(el, () => { tab = 'case'; lastTabKey = null; $('#tabBody')._h = null; if (S) { renderTabs(); } window.scrollTo(0, 0); }));
}

function renderChat() {
  const log = $('#chatLog');
  if (!log) return;
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  log.innerHTML = chatLog.map((m) => m.sys
    ? `<div class="msg sys">${esc(m.text)}</div>`
    : `<div class="msg"><b>${esc(m.name)}</b>${esc(m.text)}</div>`).join('') || '<div class="msg sys">还没有消息</div>';
  if (stick || tab === 'chat') log.scrollTop = log.scrollHeight;
}
function updateDot() { $('#chatDot').hidden = unread === 0; }

function updateTimer() {
  const t = $('#timer');
  if (!S || !S.phaseEnd) { t.textContent = ''; return; }
  const left = (S.phaseEnd - (Date.now() + clockOffset)) / 1000;
  t.textContent = fmt(left);
  t.classList.toggle('low', left < 30);
}
setInterval(() => { if (S) updateTimer(); }, 500);

// ================= 语音（WebRTC 网状） =================
const voice = { stream: null, on: false, muted: false, pcs: new Map(), pending: new Map(), analysers: new Map() };
let audioCtx = null;

async function voiceOn() {
  if (voice.on) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('这个浏览器不支持麦克风。请用 https 打开（或在本机用 localhost）。');
  }
  try {
    voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    return toast('无法使用麦克风。请在浏览器地址栏允许麦克风权限后重试。');
  }
  voice.on = true;
  voice.muted = false;
  watchLevel('me', voice.stream);
  send({ type: 'voice-join' });
  voiceApplyGate();
  renderVoiceBar();
}

function voiceOff() {
  if (!voice.on) return;
  send({ type: 'voice-leave' });
  voiceTeardownPeers();
  if (voice.stream) voice.stream.getTracks().forEach((t) => t.stop());
  voice.stream = null;
  voice.on = false;
  renderVoiceBar();
}

function voiceTeardownPeers() {
  voice.pcs.forEach((pc) => { try { pc.close(); } catch {} });
  voice.pcs.clear();
  voice.pending.clear();
  document.querySelectorAll('audio[data-peer]').forEach((a) => a.remove());
  voice.analysers.forEach((x, k) => { if (k !== 'me') voice.analysers.delete(k); });
}

function voiceClosePeer(id) {
  const pc = voice.pcs.get(id);
  if (pc) { try { pc.close(); } catch {} voice.pcs.delete(id); }
  voice.pending.delete(id);
  const a = document.querySelector(`audio[data-peer="${id}"]`);
  if (a) a.remove();
  voice.analysers.delete(id);
}

function voiceMakePC(id) {
  const pc = new RTCPeerConnection({ iceServers: ICE });
  voice.stream.getTracks().forEach((t) => pc.addTrack(t, voice.stream));
  pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'signal', to: id, data: { candidate: e.candidate } }); };
  pc.ontrack = (e) => {
    let a = document.querySelector(`audio[data-peer="${id}"]`);
    if (!a) {
      a = document.createElement('audio');
      a.dataset.peer = id;
      a.autoplay = true;
      a.playsInline = true;
      document.body.appendChild(a);
    }
    a.srcObject = e.streams[0];
    a.play().catch(() => {});
    watchLevel(id, e.streams[0]);
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') toast('有一路语音连接失败（可能需要 TURN 服务器，见 README）。');
  };
  voice.pcs.set(id, pc);
  return pc;
}

async function voiceCall(id) {
  if (!voice.on) return;
  voiceClosePeer(id);
  const pc = voiceMakePC(id);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: 'signal', to: id, data: { sdp: pc.localDescription } });
}

async function voiceSignal(from, data) {
  if (!voice.on) return;
  try {
    if (data.sdp) {
      let pc = voice.pcs.get(from);
      if (data.sdp.type === 'offer') {
        if (pc) voiceClosePeer(from);
        pc = voiceMakePC(from);
        await pc.setRemoteDescription(data.sdp);
        await flushPending(from, pc);
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        send({ type: 'signal', to: from, data: { sdp: pc.localDescription } });
      } else if (pc) {
        await pc.setRemoteDescription(data.sdp);
        await flushPending(from, pc);
      }
    } else if (data.candidate) {
      const pc = voice.pcs.get(from);
      if (pc && pc.remoteDescription) await pc.addIceCandidate(data.candidate);
      else { const q = voice.pending.get(from) || []; q.push(data.candidate); voice.pending.set(from, q); }
    }
  } catch (e) { console.warn('signal error', e); }
}
async function flushPending(id, pc) {
  const q = voice.pending.get(id) || [];
  voice.pending.delete(id);
  for (const c of q) { try { await pc.addIceCandidate(c); } catch {} }
}

// 轮流发言阶段：只有当前发言人的麦克风是开的
function micAllowed() {
  if (!voice.on || voice.muted) return false;
  if (S && S.phase === 'turns') return S.speakerId === myId;
  return true;
}
function voiceApplyGate() {
  if (voice.stream) voice.stream.getAudioTracks().forEach((t) => (t.enabled = micAllowed()));
  renderVoiceBar();
}

function watchLevel(key, stream) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const an = audioCtx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    voice.analysers.set(key, an);
  } catch {}
}
setInterval(() => {
  if (!S) return;
  const buf = new Uint8Array(256);
  voice.analysers.forEach((an, key) => {
    an.getByteTimeDomainData(buf);
    let peak = 0;
    for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
    const pid = key === 'me' ? myId : key;
    const speaking = peak > 14 && (key !== 'me' || micAllowed());
    const chip = document.querySelector(`.chip[data-pid="${pid}"]`);
    if (chip) chip.classList.toggle('speaking', speaking);
  });
}, 200);

function renderVoiceBar() {
  const bar = $('#voiceBar');
  if (!S) { setHTML(bar, ''); return; }
  const n = S.players.filter((p) => p.voice).length;
  if (!voice.on) {
    if (!setHTML(bar, `<div class="inner"><div class="status"><b>语音未开启</b><br>${n ? `${n} 人已在语音中` : '开启后可以和大家直接说话'}</div><button class="btn mic-on" id="voiceOnBtn">开启语音</button></div>`)) return;
    $('#voiceOnBtn').addEventListener('click', voiceOn);
    return;
  }
  let status;
  if (S.phase === 'turns' && S.speakerId !== myId) status = `<b>已静音</b><br>轮到 ${esc(playerName(S.speakerId))} 发言`;
  else if (S.phase === 'turns') status = '<b>轮到你了</b><br>麦克风已打开';
  else status = voice.muted ? '<b>你已静音</b>' : '<b>麦克风已打开</b>';
  const gated = S.phase === 'turns' && S.speakerId !== myId;
  if (!setHTML(bar, `<div class="inner"><div class="status">${status}<br><span style="font-size:12px">${n} 人在语音中</span></div>
    <button class="btn ${gated ? 'mic-gated' : voice.muted ? '' : 'mic-on'}" id="muteBtn" ${gated ? 'disabled' : ''}>${voice.muted ? '取消静音' : '静音'}</button>
    <button class="btn ghost" id="voiceOffBtn">退出语音</button></div>`)) return;
  $('#muteBtn').addEventListener('click', () => { voice.muted = !voice.muted; voiceApplyGate(); });
  $('#voiceOffBtn').addEventListener('click', voiceOff);
}
